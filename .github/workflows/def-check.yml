name: def-check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: check default aplica en API + estado asignaciones import
        env:
          CID: ${{ secrets.PP_CLIENT_ID }}
          SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT: ${{ secrets.PP_TENANT_ID }}
          URL: ${{ secrets.DATAVERSE_URL }}
        run: |
          set +e
          URL="${URL%/}"
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token" -d "client_id=$CID" -d "client_secret=$SECRET" -d "grant_type=client_credentials" -d "scope=$URL/.default" | jq -r .access_token)
          API="$URL/api/data/v9.2"; H="Authorization: Bearer $TOKEN"; A="Accept: application/json"; C='Prefer: odata.maxpagesize=1'
          cnt(){ curl -s -H "$H" -H "$A" -H "$C" "$API/$1&\$count=true&\$top=1" | jq -r '.["@odata.count"]'; }
          echo "=== estadoaprobacion en asignaciones (¿el import las dejó con algo?) ==="
          echo -n "  total asignaciones: "; cnt "sanic_cm_tbl_asignacions?"
          echo -n "  estadoaprobacion NULL: "; cnt "sanic_cm_tbl_asignacions?\$filter=sanic_cm_as_estadoaprobacion%20eq%20null"
          echo -n "  estadoaprobacion = Pendiente(2): "; cnt "sanic_cm_tbl_asignacions?\$filter=sanic_cm_as_estadoaprobacion%20eq%202"
          echo "=== defaults actuales de tipo y estadoaprobacion ==="
          curl -s -H "$H" -H "$A" "$API/EntityDefinitions(LogicalName='sanic_cm_tbl_asignacion')/Attributes(LogicalName='sanic_cm_as_tipo')/Microsoft.Dynamics.CRM.PicklistAttributeMetadata?\$select=DefaultFormValue" | jq -r '"  tipo DefaultFormValue = \(.DefaultFormValue)"'
          curl -s -H "$H" -H "$A" "$API/EntityDefinitions(LogicalName='sanic_cm_tbl_asignacion')/Attributes(LogicalName='sanic_cm_as_estadoaprobacion')/Microsoft.Dynamics.CRM.PicklistAttributeMetadata?\$select=DefaultFormValue" | jq -r '"  estadoaprobacion DefaultFormValue = \(.DefaultFormValue)"'
