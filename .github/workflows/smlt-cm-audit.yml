name: smlt-cm-audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - name: audit column mappings vs columnas reales
        env:
          CID: ${{ secrets.PP_CLIENT_ID }}
          SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT: ${{ secrets.PP_TENANT_ID }}
          URL: ${{ secrets.DATAVERSE_URL }}
        run: |
          set +e
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token" -d "client_id=$CID" -d "client_secret=$SECRET" -d "grant_type=client_credentials" -d "scope=$URL/.default" | jq -r .access_token)
          API="$URL/api/data/v9.2"; H="Authorization: Bearer $TOKEN"; A="Accept: application/json"
          g(){ curl -s -H "$H" -H "$A" "$API/$1"; }
          TID='dcb61b79-e66d-f111-ab0e-0022480a5be8'
          # table mappings: tmid + target
          g "sanic_tbl_smlt_tablemappings?\$filter=_sanic_smlt_tm_importtemplateid_value%20eq%20$TID&\$select=sanic_tbl_smlt_tablemappingid,sanic_smlt_tm_targettable,sanic_smlt_tm_name" | jq -r '.value[] | "\(.sanic_tbl_smlt_tablemappingid)|\(.sanic_smlt_tm_targettable)"' > /tmp/tms.txt
          : > /tmp/mapped.txt
          while IFS='|' read -r tmid target; do
            g "sanic_tbl_smlt_columnmappings?\$filter=_sanic_smlt_cm_tablemappingid_value%20eq%20$tmid&\$select=sanic_smlt_cm_targetcolumn,sanic_smlt_cm_sourcecolumn" | jq -r --arg t "$target" '.value[]? | "\($t)|\(.sanic_smlt_cm_targetcolumn)"' >> /tmp/mapped.txt
          done < /tmp/tms.txt
          echo "===== columnas MAPEADAS por tabla ====="
          cut -d'|' -f2 /tmp/tms.txt | sort -u | while read -r tbl; do
            echo "  [$tbl]"
            grep "^$tbl|" /tmp/mapped.txt | cut -d'|' -f2 | sort -u | sed 's/^/     ✓ /'
          done
          echo ""
          echo "===== columnas NO MAPEADas (existen en la tabla, NO en el template) ====="
          echo "  (excluye lookups [los hace el Relationship Mapping], virtuals, PK, *idname)"
          cut -d'|' -f2 /tmp/tms.txt | sort -u | while read -r tbl; do
            g "EntityDefinitions(LogicalName='$tbl')/Attributes?\$select=LogicalName,AttributeType" | jq -r '.value[] | select(.LogicalName|startswith("sanic_")) | select(.AttributeType!="Lookup" and .AttributeType!="Virtual" and .AttributeType!="Uniqueidentifier") | select(.LogicalName|test("idname$|idyominame$")|not) | .LogicalName' | sort -u > /tmp/cols.txt
            grep "^$tbl|" /tmp/mapped.txt | cut -d'|' -f2 | sort -u > /tmp/m.txt
            miss=$(comm -23 /tmp/cols.txt /tmp/m.txt)
            if [ -n "$miss" ]; then echo "  [$tbl] FALTAN:"; echo "$miss" | sed 's/^/     ✗ /'; else echo "  [$tbl] — todo mapeado ✓"; fi
          done
