name: sol-role
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - name: audit rol Solicitante
        env:
          CID: ${{ secrets.PP_CLIENT_ID }}
          SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT: ${{ secrets.PP_TENANT_ID }}
          URL: ${{ secrets.DATAVERSE_URL }}
        run: |
          set +e
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token" -d "client_id=$CID" -d "client_secret=$SECRET" -d "grant_type=client_credentials" -d "scope=$URL/.default" | jq -r .access_token)
          API="$URL/api/data/v9.2"; H="Authorization: Bearer $TOKEN"; A="Accept: application/json"
          g(){ curl -s -H "$H" -H "$A" "$API/$1"; }
          RID='d9f0f107-fd76-f111-ab0e-70a8a5b226fd'  # SR | CM | Solicitante
          g "RetrieveRolePrivilegesRole(RoleId=$RID)" | jq -r '.RolePrivileges[]? | .PrivilegeId + " " + (.Depth|tostring)' | sort > /tmp/rp.txt
          g "privileges?\$select=name,privilegeid&\$filter=contains(name,'sanic_cm_tbl_')" | jq -r '.value[] | .privilegeid + " " + .name' | sort > /tmp/pn.txt
          echo "===== ROL Solicitante — privilegios por tabla (C/R/W/D/Ap/ApA) ====="
          join /tmp/rp.txt /tmp/pn.txt 2>/dev/null | awk '{n=$3; sub(/^prv/,"",n);
            for(t in seen){}
            match(n,/sanic_cm_tbl_[a-z]+/); tbl=substr(n,RSTART,RLENGTH); act=substr(n,1,RSTART-1);
            printf "%s|%s\n", tbl, act }' | sort | awk -F'|' '{a[$1]=a[$1] " " $2} END {for(t in a) printf "  %-28s :%s\n", t, a[t]}' | sort
          echo ""
          echo "  (esperado Solicitante: Create+Read+Write+Append+AppendTo en asignacion/cliente/cuenta/direccion/telefono; Read+AppendTo en producto/fiador/agente)"
