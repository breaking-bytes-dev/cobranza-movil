name: add-columns-transcripcion

# One-shot: crea las 4 columnas de transcripción del backoffice en sanic_cm_tbl_interaccion.
# Patrón reusable (mismo que add-columns-oneshot, ya retirado): token client_credentials del SP +
# POST a EntityDefinitions/Attributes con MSCRM.SolutionUniqueName. Se retira tras aplicarse.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  add-columns:
    runs-on: ubuntu-latest
    steps:
      - name: Crear columnas de transcripción
        env:
          CID: ${{ secrets.PP_CLIENT_ID }}
          SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT: ${{ secrets.PP_TENANT_ID }}
          URL: ${{ secrets.DATAVERSE_URL }}
        run: |
          set -euo pipefail
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token" \
            -d "client_id=$CID" -d "client_secret=$SECRET" -d "grant_type=client_credentials" -d "scope=$URL/.default" | jq -r .access_token)
          [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ] || { echo "::error::sin token"; exit 1; }
          API="$URL/api/data/v9.2"
          H_AUTH="Authorization: Bearer $TOKEN"
          H_JSON="Content-Type: application/json"
          H_ACC="Accept: application/json"
          H_SOL="MSCRM.SolutionUniqueName: cm_core_cobranzamovil"
          ENT="EntityDefinitions(LogicalName='sanic_cm_tbl_interaccion')/Attributes"

          post() { # $1 = url  $2 = json file  -> imprime status y cuerpo
            local url="$1" file="$2"
            local code
            code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X POST "$url" \
              -H "$H_AUTH" -H "$H_JSON" -H "$H_ACC" -H "$H_SOL" --data @"$file")
            echo "  HTTP $code"
            if [ "$code" -ge 300 ]; then echo "  >> $(cat /tmp/resp.txt)"; fi
            return 0
          }

          echo "===================== 1) GLOBAL OPTION SET (estado de transcripción) ====================="
          # Sin valores fijos: Dataverse asigna dentro del rango del prefijo del publisher (evita el 400).
          cat > /tmp/os.json <<'JSON'
          {
            "@odata.type": "Microsoft.Dynamics.CRM.OptionSetMetadata",
            "Name": "sanic_cm_choice_estadograbacioninteraccion",
            "OptionSetType": "Picklist",
            "IsGlobal": true,
            "DisplayName": { "@odata.type": "Microsoft.Dynamics.CRM.Label",
              "LocalizedLabels": [ { "@odata.type": "Microsoft.Dynamics.CRM.LocalizedLabel", "Label": "Estado de transcripción", "LanguageCode": 1033 } ] },
            "Options": [
              { "Label": { "@odata.type": "Microsoft.Dynamics.CRM.Label", "LocalizedLabels": [ { "@odata.type": "Microsoft.Dynamics.CRM.LocalizedLabel", "Label": "Pendiente", "LanguageCode": 1033 } ] } },
              { "Label": { "@odata.type": "Microsoft.Dynamics.CRM.Label", "LocalizedLabels": [ { "@odata.type": "Microsoft.Dynamics.CRM.LocalizedLabel", "Label": "Grabada en core", "LanguageCode": 1033 } ] } }
            ]
          }
          JSON
          RESP=$(curl -si -X POST "$API/GlobalOptionSetDefinitions" -H "$H_AUTH" -H "$H_JSON" -H "$H_ACC" -H "$H_SOL" --data @/tmp/os.json || true)
          CODE1=$(echo "$RESP" | tr -d '\r' | grep -iE '^HTTP/' | tail -1)
          echo "  $CODE1"
          if echo "$CODE1" | grep -qE ' (4|5)[0-9][0-9]'; then
            # 400/500: puede ser que ya exista. Mostramos el cuerpo para diagnóstico.
            echo "  >> body:"; echo "$RESP" | sed -n '/^\r\?$/,$p' | tail -n +2
          fi
          # Leemos el option set por Name (exista de antes o recién creado) + el valor de "Pendiente".
          OS=$(curl -s "$API/GlobalOptionSetDefinitions(Name='sanic_cm_choice_estadograbacioninteraccion')" -H "$H_AUTH" -H "$H_ACC" || true)
          OSID=$(echo "$OS" | jq -r '.MetadataId // empty')
          PENDVAL=$(echo "$OS" | jq -r '[.Options[] | select(.Label.LocalizedLabels[0].Label=="Pendiente") | .Value][0] // empty')
          echo "  OptionSet MetadataId = ${OSID:-<vacío>}  ·  Pendiente = ${PENDVAL:-<vacío>}"
          if [ -z "$OSID" ] || [ -z "$PENDVAL" ]; then echo "::error::no pude resolver el option set / valor Pendiente"; exit 1; fi

          echo "===================== 2) estadograbacion (Picklist -> global) ====================="
          cat > /tmp/estado.json <<JSON
          {
            "@odata.type": "Microsoft.Dynamics.CRM.PicklistAttributeMetadata",
            "SchemaName": "sanic_cm_in_estadograbacion",
            "RequiredLevel": { "Value": "None" },
            "DisplayName": { "@odata.type": "Microsoft.Dynamics.CRM.Label",
              "LocalizedLabels": [ { "@odata.type": "Microsoft.Dynamics.CRM.LocalizedLabel", "Label": "Estado de transcripción", "LanguageCode": 1033 } ] },
            "Description": { "@odata.type": "Microsoft.Dynamics.CRM.Label",
              "LocalizedLabels": [ { "@odata.type": "Microsoft.Dynamics.CRM.LocalizedLabel", "Label": "Estado de la transcripción al core (DEC-002).", "LanguageCode": 1033 } ] },
            "DefaultFormValue": $PENDVAL,
            "GlobalOptionSet@odata.bind": "/GlobalOptionSetDefinitions($OSID)"
          }
          JSON
          post "$API/$ENT" /tmp/estado.json

          echo "===================== 3) codigograbacion (String 100) ====================="
          cat > /tmp/codigo.json <<'JSON'
          {
            "@odata.type": "Microsoft.Dynamics.CRM.StringAttributeMetadata",
            "SchemaName": "sanic_cm_in_codigograbacion",
            "RequiredLevel": { "Value": "None" },
            "MaxLength": 100,
            "FormatName": { "Value": "Text" },
            "DisplayName": { "@odata.type": "Microsoft.Dynamics.CRM.Label",
              "LocalizedLabels": [ { "@odata.type": "Microsoft.Dynamics.CRM.LocalizedLabel", "Label": "Código del core", "LanguageCode": 1033 } ] },
            "Description": { "@odata.type": "Microsoft.Dynamics.CRM.Label",
              "LocalizedLabels": [ { "@odata.type": "Microsoft.Dynamics.CRM.LocalizedLabel", "Label": "Código con que el backoffice grabó la gestión en el core.", "LanguageCode": 1033 } ] }
          }
          JSON
          post "$API/$ENT" /tmp/codigo.json

          echo "===================== 4) fechagrabacion (DateTime UserLocal) ====================="
          cat > /tmp/fecha.json <<'JSON'
          {
            "@odata.type": "Microsoft.Dynamics.CRM.DateTimeAttributeMetadata",
            "SchemaName": "sanic_cm_in_fechagrabacion",
            "RequiredLevel": { "Value": "None" },
            "Format": "DateAndTime",
            "DateTimeBehavior": { "Value": "UserLocal" },
            "DisplayName": { "@odata.type": "Microsoft.Dynamics.CRM.Label",
              "LocalizedLabels": [ { "@odata.type": "Microsoft.Dynamics.CRM.LocalizedLabel", "Label": "Fecha grabada en core", "LanguageCode": 1033 } ] },
            "Description": { "@odata.type": "Microsoft.Dynamics.CRM.Label",
              "LocalizedLabels": [ { "@odata.type": "Microsoft.Dynamics.CRM.LocalizedLabel", "Label": "Cuándo el backoffice la transcribió al core.", "LanguageCode": 1033 } ] }
          }
          JSON
          post "$API/$ENT" /tmp/fecha.json

          echo "===================== 5) grabadopor (Lookup -> systemuser) ====================="
          cat > /tmp/rel.json <<'JSON'
          {
            "@odata.type": "Microsoft.Dynamics.CRM.OneToManyRelationshipMetadata",
            "SchemaName": "sanic_systemuser_cm_tbl_interaccion_grabadopor",
            "ReferencedEntity": "systemuser",
            "ReferencingEntity": "sanic_cm_tbl_interaccion",
            "AssociatedMenuConfiguration": { "Behavior": "DoNotDisplay", "Group": "Details", "Order": 10000 },
            "CascadeConfiguration": { "Assign": "NoCascade", "Delete": "RemoveLink", "Merge": "NoCascade", "Reparent": "NoCascade", "Share": "NoCascade", "Unshare": "NoCascade" },
            "Lookup": {
              "@odata.type": "Microsoft.Dynamics.CRM.LookupAttributeMetadata",
              "SchemaName": "sanic_cm_in_grabadopor",
              "RequiredLevel": { "Value": "None" },
              "DisplayName": { "@odata.type": "Microsoft.Dynamics.CRM.Label",
                "LocalizedLabels": [ { "@odata.type": "Microsoft.Dynamics.CRM.LocalizedLabel", "Label": "Grabada por", "LanguageCode": 1033 } ] },
              "Description": { "@odata.type": "Microsoft.Dynamics.CRM.Label",
                "LocalizedLabels": [ { "@odata.type": "Microsoft.Dynamics.CRM.LocalizedLabel", "Label": "Usuario de backoffice que la grabó.", "LanguageCode": 1033 } ] }
            }
          }
          JSON
          post "$API/RelationshipDefinitions" /tmp/rel.json

          echo "===================== 6) PublishAllXml ====================="
          code=$(curl -s -o /tmp/pub.txt -w "%{http_code}" -X POST "$API/PublishAllXml" -H "$H_AUTH" -H "$H_JSON" -H "$H_ACC" -d '{}')
          echo "  HTTP $code"

          echo "===================== 7) Verificación (GET de cada columna) ====================="
          for col in sanic_cm_in_estadograbacion sanic_cm_in_codigograbacion sanic_cm_in_fechagrabacion sanic_cm_in_grabadopor; do
            found=$(curl -s "$API/EntityDefinitions(LogicalName='sanic_cm_tbl_interaccion')/Attributes(LogicalName='$col')?\$select=LogicalName,AttributeType" -H "$H_AUTH" -H "$H_ACC" | jq -r '.LogicalName + " [" + .AttributeType + "]"')
            printf "  %-32s -> %s\n" "$col" "$found"
          done
