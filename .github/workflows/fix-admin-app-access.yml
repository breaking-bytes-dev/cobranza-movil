name: fix-admin-app-access

# One-shot: asocia el rol "SR | CM | Admin" con el app module del Backoffice
# vía la relación N:N appmodule<->role (bypass del picker roto del portal).
# Descubre el nombre de la navegación N:N por metadata, luego asocia y publica.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Asociar rol Admin al app module
        env:
          CID: ${{ secrets.PP_CLIENT_ID }}
          SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT: ${{ secrets.PP_TENANT_ID }}
          URL: ${{ secrets.DATAVERSE_URL }}
        run: |
          set -e
          URL="${URL%/}"
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token" \
            -d "client_id=$CID" -d "client_secret=$SECRET" -d "grant_type=client_credentials" -d "scope=$URL/.default" | jq -r .access_token)
          H="Authorization: Bearer $TOKEN"; A="Accept: application/json"; CT="Content-Type: application/json"

          APPID=$(curl -s -H "$H" -H "$A" \
            "$URL/api/data/v9.2/appmodules?\$select=appmoduleid&\$filter=contains(name,'Backoffice')" \
            | jq -r '.value[0].appmoduleid')
          ROLEID=$(curl -s -H "$H" -H "$A" \
            "$URL/api/data/v9.2/roles?\$select=roleid&\$filter=name%20eq%20'SR%20%7C%20CM%20%7C%20Admin'" \
            | jq -r '.value[0].roleid')
          echo "APPID=$APPID  ROLEID=$ROLEID"

          echo "===================== RELACIONES N:N de appmodule ====================="
          META=$(curl -s -H "$H" -H "$A" \
            "$URL/api/data/v9.2/EntityDefinitions(LogicalName='appmodule')/ManyToManyRelationships?\$select=SchemaName,Entity1LogicalName,Entity2LogicalName,Entity1NavigationPropertyName,Entity2NavigationPropertyName")
          echo "$META" | jq -r '.value[] | "  \(.SchemaName)  |  E1=\(.Entity1LogicalName)/\(.Entity1NavigationPropertyName)  E2=\(.Entity2LogicalName)/\(.Entity2NavigationPropertyName)"'

          NAV=$(echo "$META" | jq -r '.value[]
            | select((.Entity1LogicalName=="appmodule" and .Entity2LogicalName=="role") or (.Entity2LogicalName=="appmodule" and .Entity1LogicalName=="role"))
            | if .Entity1LogicalName=="appmodule" then .Entity1NavigationPropertyName else .Entity2NavigationPropertyName end' | head -1)
          echo "  -> NAV (appmodule -> role) = $NAV"
          if [ -z "$NAV" ] || [ "$NAV" = "null" ]; then echo "ERROR: no encontré la nav N:N appmodule<->role"; exit 1; fi

          echo "===================== ROLES ASOCIADOS (ANTES) ====================="
          curl -s -H "$H" -H "$A" \
            "$URL/api/data/v9.2/appmodules($APPID)?\$expand=$NAV(\$select=name,roleid)" \
            | jq -r ".[\"$NAV\"][]? | \"  \(.name)  (\(.roleid))\"" 2>/dev/null \
            || curl -s -H "$H" -H "$A" "$URL/api/data/v9.2/appmodules($APPID)?\$expand=$NAV(\$select=name,roleid)" | jq -r '.'

          echo "===================== ASOCIANDO Admin -> app ====================="
          HTTP=$(curl -s -o /tmp/assoc.txt -w '%{http_code}' -X POST -H "$H" -H "$A" -H "$CT" \
            "$URL/api/data/v9.2/appmodules($APPID)/$NAV/\$ref" \
            -d "{\"@odata.id\":\"$URL/api/data/v9.2/roles($ROLEID)\"}")
          echo "  HTTP: $HTTP"
          if [ "$HTTP" -ge 300 ]; then
            if grep -q "Cannot insert duplicate" /tmp/assoc.txt; then
              echo "  -> ya estaba asociado (duplicate). OK."
            else
              echo "  RESP:"; cat /tmp/assoc.txt; exit 1
            fi
          else
            echo "  -> asociado OK"
          fi

          echo "===================== ROLES ASOCIADOS (DESPUÉS) ====================="
          curl -s -H "$H" -H "$A" \
            "$URL/api/data/v9.2/appmodules($APPID)?\$expand=$NAV(\$select=name)" \
            | jq -r ".[\"$NAV\"][]? | \"  \(.name)\""

          echo "===================== PUBLICANDO ====================="
          PXML="<importexportxml><appmodules><appmodule>$APPID</appmodule></appmodules></importexportxml>"
          HTTP=$(curl -s -o /tmp/pub.txt -w '%{http_code}' -X POST -H "$H" -H "$A" -H "$CT" \
            "$URL/api/data/v9.2/PublishXml" -d "{\"ParameterXml\":\"$PXML\"}")
          echo "  publish HTTP: $HTTP"; [ "$HTTP" -ge 300 ] && cat /tmp/pub.txt || echo "  -> publicado"
          echo "LISTO."
