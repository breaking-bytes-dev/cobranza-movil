name: dn
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: display names
        env:
          CID: ${{ secrets.PP_CLIENT_ID }}
          SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT: ${{ secrets.PP_TENANT_ID }}
          URL: ${{ secrets.DATAVERSE_URL }}
        run: |
          set +e
          URL="${URL%/}"
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token" -d "client_id=$CID" -d "client_secret=$SECRET" -d "grant_type=client_credentials" -d "scope=$URL/.default" | jq -r .access_token)
          API="$URL/api/data/v9.2"; H="Authorization: Bearer $TOKEN"; A="Accept: application/json"
          for e in sanic_cm_tbl_asignacion sanic_cm_tbl_cuenta sanic_cm_tbl_interaccion; do
            curl -s -H "$H" -H "$A" "$API/EntityDefinitions(LogicalName='$e')?\$select=LogicalName,SchemaName&\$expand=DisplayName,DisplayCollectionName" | jq -r '"  \(.LogicalName):  Display=\"\(.DisplayName.LocalizedLabels[0].Label)\"  ·  Plural=\"\(.DisplayCollectionName.LocalizedLabels[0].Label)\""'
          done
          echo "=== display name del campo agente en asignacion ==="
          curl -s -H "$H" -H "$A" "$API/EntityDefinitions(LogicalName='sanic_cm_tbl_asignacion')/Attributes(LogicalName='sanic_cm_as_agenteid')?\$select=LogicalName&\$expand=DisplayName" | jq -r '"  sanic_cm_as_agenteid Display=\"\(.DisplayName.LocalizedLabels[0].Label)\""'
