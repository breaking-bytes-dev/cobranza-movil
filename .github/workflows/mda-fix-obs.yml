name: mda-fix-obs

# Correcciones tras verificación en portal:
#  - backfill fechacaptura = createdon en interacciones viejas (estaba null)
#  - reordenar vista 'Por Transcribir': Localizador (cobrador) prominente, 2da columna
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Correcciones
        env:
          CID: ${{ secrets.PP_CLIENT_ID }}
          SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT: ${{ secrets.PP_TENANT_ID }}
          URL: ${{ secrets.DATAVERSE_URL }}
        run: |
          set +e
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token" \
            -d "client_id=$CID" -d "client_secret=$SECRET" -d "grant_type=client_credentials" -d "scope=$URL/.default" | jq -r .access_token)
          API="$URL/api/data/v9.2"
          H_AUTH="Authorization: Bearer $TOKEN"; A="Accept: application/json"; JSON="Content-Type: application/json"
          SOL="MSCRM.SolutionUniqueName: cm_core_cobranzamovil"
          ENT='sanic_cm_tbl_interaccion'
          g(){ curl -s -H "$H_AUTH" -H "$A" "$API/$1"; }

          echo "===== BACKFILL fechacaptura = createdon (registros con null) ====="
          ROWS=$(g "sanic_cm_tbl_interaccions?\$select=sanic_cm_tbl_interaccionid,createdon,sanic_cm_in_fechacaptura&\$filter=sanic_cm_in_fechacaptura%20eq%20null")
          echo "$ROWS" | jq -r '.value[]? | .sanic_cm_tbl_interaccionid + " " + .createdon' | while read -r ID CO; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH "$API/sanic_cm_tbl_interaccions($ID)" -H "$H_AUTH" -H "$JSON" -H "$A" --data "{\"sanic_cm_in_fechacaptura\":\"$CO\"}")
            echo "  $ID -> $CO  HTTP $code"
          done
          NULLS=$(g "sanic_cm_tbl_interaccions?\$count=true&\$top=1&\$filter=sanic_cm_in_fechacaptura%20eq%20null" -H "Prefer: odata.maxpagesize=1" | jq -r '.["@odata.count"]')
          echo "  quedan con fechacaptura null: $NULLS"

          echo "===== REORDENAR vista 'Por Transcribir' (Localizador 2do) ====="
          OTC=$(g "EntityDefinitions(LogicalName='$ENT')?\$select=ObjectTypeCode" | jq -r '.ObjectTypeCode')
          echo "  objecttypecode=$OTC"
          V=$(g "savedqueries?\$filter=returnedtypecode%20eq%20'$ENT'%20and%20name%20eq%20'Por%20Transcribir'&\$select=savedqueryid,layoutxml")
          SQID=$(echo "$V" | jq -r '.value[0].savedqueryid')
          # alias del link a cuenta (para las columnas cliente/nº cuenta) — lo saco del layout actual
          ALIAS=$(echo "$V" | jq -r '.value[0].layoutxml' | grep -oE 'a_[0-9a-f]+' | head -1)
          echo "  savedqueryid=$SQID  alias=$ALIAS"
          LAYOUT=$(printf '<grid name="resultset" object="%s" jump="sanic_cm_in_numerointeraccion" select="1" icon="1" preview="1"><row name="result" id="sanic_cm_tbl_interaccionid"><cell name="sanic_cm_in_numerointeraccion" width="110" /><cell name="sanic_cm_in_agente" width="170" /><cell name="%s.sanic_cm_ct_clienteid" width="160" /><cell name="%s.sanic_cm_ct_numerodecuenta" width="130" /><cell name="sanic_cm_in_estadograbacion" width="120" /><cell name="sanic_cm_cd_aplicapago" width="90" /><cell name="createdon" width="125" /></row></grid>' "$OTC" "$ALIAS" "$ALIAS")
          jq -n --arg lx "$LAYOUT" '{layoutxml:$lx}' > /tmp/layout.json
          code=$(curl -s -o /tmp/r.txt -w "%{http_code}" -X PATCH "$API/savedqueries($SQID)" -H "$H_AUTH" -H "$JSON" -H "$A" -H "$SOL" --data @/tmp/layout.json)
          echo "  PATCH layout HTTP $code"; [ "$code" -ge 300 ] && cat /tmp/r.txt

          echo "===== publish ====="
          curl -s -o /dev/null -w "  PublishAllXml HTTP %{http_code}\n" -X POST "$API/PublishAllXml" -H "$H_AUTH" -H "$JSON" -H "$A" -d '{}'
          echo "  -- columnas finales de la vista --"
          g "savedqueries($SQID)?\$select=layoutxml" | jq -r '.layoutxml' | grep -oE 'name="[^"]*"' | grep -v resultset | grep -v '"result"'
