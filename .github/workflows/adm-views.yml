name: adm-views
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - name: vistas admin
        env:
          CID: ${{ secrets.PP_CLIENT_ID }}
          SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT: ${{ secrets.PP_TENANT_ID }}
          URL: ${{ secrets.DATAVERSE_URL }}
        run: |
          set +e
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token" -d "client_id=$CID" -d "client_secret=$SECRET" -d "grant_type=client_credentials" -d "scope=$URL/.default" | jq -r .access_token)
          API="$URL/api/data/v9.2"; H_AUTH="Authorization: Bearer $TOKEN"; A="Accept: application/json"; JSON="Content-Type: application/json"
          SOL="MSCRM.SolutionUniqueName: cm_core_cobranzamovil"
          g(){ curl -s -H "$H_AUTH" -H "$A" "$API/$1"; }
          otc(){ g "EntityDefinitions(LogicalName='$1')?\$select=ObjectTypeCode" | jq -r '.ObjectTypeCode'; }
          OTC_AS=$(otc sanic_cm_tbl_asignacion); OTC_CD=$(otc sanic_cm_tbl_cargadiaria); OTC_AG=$(otc sanic_cm_tbl_agente)
          echo "OTC asignacion=$OTC_AS cargadiaria=$OTC_CD agente=$OTC_AG"
          # mkview NAME ENTITY OTC FETCH LAYOUT
          mkview(){
            local name="$1" ent="$2" fetch="$3" layout="$4"
            jq -n --arg n "$name" --arg e "$ent" --arg f "$fetch" --arg l "$layout" '{name:$n, returnedtypecode:$e, fetchxml:$f, layoutxml:$l, querytype:0, description:"Admin"}' > /tmp/v.json
            local code=$(curl -s -o /tmp/r.txt -w "%{http_code}" -X POST "$API/savedqueries" -H "$H_AUTH" -H "$JSON" -H "$A" -H "$SOL" --data @/tmp/v.json)
            printf "  %-40s HTTP %s\n" "$name" "$code"; [ "$code" -ge 300 ] && head -c 300 /tmp/r.txt && echo
          }
          L(){ printf '<grid name="resultset" object="%s" jump="%s" select="1" icon="1" preview="1"><row name="result" id="%s">%s</row></grid>' "$1" "$2" "$3" "$4"; }
          C(){ printf '<cell name="%s" width="%s" />' "$1" "$2"; }

          # 1) Incobrables abiertas (tipo=2, estado=1)
          F1='<fetch version="1.0" mapping="logical"><entity name="sanic_cm_tbl_asignacion"><attribute name="sanic_cm_as_numero" /><attribute name="sanic_cm_as_cuentaid" /><attribute name="sanic_cm_as_numerocuenta" /><attribute name="sanic_cm_as_agenteid" /><attribute name="sanic_cm_as_ultimacarga" /><attribute name="sanic_cm_tbl_asignacionid" /><order attribute="sanic_cm_as_numero" descending="false" /><filter type="and"><condition attribute="sanic_cm_as_tipo" operator="eq" value="2" /><condition attribute="sanic_cm_as_estado" operator="eq" value="1" /></filter></entity></fetch>'
          LY1=$(L "$OTC_AS" sanic_cm_as_numero sanic_cm_tbl_asignacionid "$(C sanic_cm_as_numero 110)$(C sanic_cm_as_cuentaid 150)$(C sanic_cm_as_numerocuenta 130)$(C sanic_cm_as_agenteid 140)$(C sanic_cm_as_ultimacarga 140)")
          mkview "Admin · Incobrables abiertas" sanic_cm_tbl_asignacion "$F1" "$LY1"

          # 2) Especiales activas (tipo=3, estado=1)
          F2='<fetch version="1.0" mapping="logical"><entity name="sanic_cm_tbl_asignacion"><attribute name="sanic_cm_as_numero" /><attribute name="sanic_cm_as_cuentaid" /><attribute name="sanic_cm_as_estadoaprobacion" /><attribute name="sanic_cm_as_agenteid" /><attribute name="sanic_cm_as_fechasignacion" /><attribute name="sanic_cm_tbl_asignacionid" /><order attribute="sanic_cm_as_fechasignacion" descending="true" /><filter type="and"><condition attribute="sanic_cm_as_tipo" operator="eq" value="3" /><condition attribute="sanic_cm_as_estado" operator="eq" value="1" /></filter></entity></fetch>'
          LY2=$(L "$OTC_AS" sanic_cm_as_numero sanic_cm_tbl_asignacionid "$(C sanic_cm_as_numero 110)$(C sanic_cm_as_cuentaid 150)$(C sanic_cm_as_estadoaprobacion 150)$(C sanic_cm_as_agenteid 140)$(C sanic_cm_as_fechasignacion 140)")
          mkview "Admin · Especiales activas" sanic_cm_tbl_asignacion "$F2" "$LY2"

          # 3) Diarias - revisar carga (tipo=1, estado=1, orden ultimacarga asc)
          F3='<fetch version="1.0" mapping="logical"><entity name="sanic_cm_tbl_asignacion"><attribute name="sanic_cm_as_numero" /><attribute name="sanic_cm_as_cuentaid" /><attribute name="sanic_cm_as_agenteid" /><attribute name="sanic_cm_as_ultimacarga" /><attribute name="sanic_cm_tbl_asignacionid" /><order attribute="sanic_cm_as_ultimacarga" descending="false" /><filter type="and"><condition attribute="sanic_cm_as_tipo" operator="eq" value="1" /><condition attribute="sanic_cm_as_estado" operator="eq" value="1" /></filter></entity></fetch>'
          LY3=$(L "$OTC_AS" sanic_cm_as_numero sanic_cm_tbl_asignacionid "$(C sanic_cm_as_numero 110)$(C sanic_cm_as_cuentaid 150)$(C sanic_cm_as_agenteid 140)$(C sanic_cm_as_ultimacarga 150)")
          mkview "Admin · Diarias (revisar carga)" sanic_cm_tbl_asignacion "$F3" "$LY3"

          # 4) Monitoreo de carga (cargadiaria, fechacarga desc)
          F4='<fetch version="1.0" mapping="logical"><entity name="sanic_cm_tbl_cargadiaria"><attribute name="sanic_cm_cd_fechacarga" /><attribute name="sanic_cm_cd_numerocuenta" /><attribute name="sanic_cm_cd_cuenta" /><attribute name="sanic_cm_cd_agenteid" /><attribute name="sanic_cm_cd_tipoasignacion" /><attribute name="sanic_cm_tbl_cargadiariaid" /><order attribute="sanic_cm_cd_fechacarga" descending="true" /></entity></fetch>'
          LY4=$(L "$OTC_CD" sanic_cm_cd_numerocuenta sanic_cm_tbl_cargadiariaid "$(C sanic_cm_cd_fechacarga 150)$(C sanic_cm_cd_numerocuenta 140)$(C sanic_cm_cd_cuenta 150)$(C sanic_cm_cd_agenteid 140)$(C sanic_cm_cd_tipoasignacion 130)")
          mkview "Admin · Monitoreo de carga" sanic_cm_tbl_cargadiaria "$F4" "$LY4"

          # 5) Agentes y usuarios (agente)
          F5='<fetch version="1.0" mapping="logical"><entity name="sanic_cm_tbl_agente"><attribute name="sanic_cm_ag_nombre" /><attribute name="sanic_cm_ag_emailusuario" /><attribute name="sanic_cm_ag_usuarioid" /><attribute name="sanic_cm_ag_activo" /><attribute name="sanic_cm_tbl_agenteid" /><order attribute="sanic_cm_ag_nombre" descending="false" /></entity></fetch>'
          LY5=$(L "$OTC_AG" sanic_cm_ag_nombre sanic_cm_tbl_agenteid "$(C sanic_cm_ag_nombre 160)$(C sanic_cm_ag_emailusuario 200)$(C sanic_cm_ag_usuarioid 160)$(C sanic_cm_ag_activo 80)")
          mkview "Admin · Agentes y usuarios" sanic_cm_tbl_agente "$F5" "$LY5"

          curl -s -o /dev/null -w "  Publish HTTP %{http_code}\n" -X POST "$API/PublishAllXml" -H "$H_AUTH" -H "$JSON" -H "$A" -d '{}'
          echo "===== vistas Admin creadas ====="
          g "savedqueries?\$filter=startswith(name,'Admin%20%C2%B7')&\$select=name" | jq -r '.value[]? | "  " + .name'
