name: ret
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - name: retiro cols + form solicitud
        env:
          CID: ${{ secrets.PP_CLIENT_ID }}
          SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT: ${{ secrets.PP_TENANT_ID }}
          URL: ${{ secrets.DATAVERSE_URL }}
        run: |
          set +e
          URL="${URL%/}"
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token" -d "client_id=$CID" -d "client_secret=$SECRET" -d "grant_type=client_credentials" -d "scope=$URL/.default" | jq -r .access_token)
          API="$URL/api/data/v9.2"; H="Authorization: Bearer $TOKEN"; A="Accept: application/json"; J="Content-Type: application/json"; SOL="MSCRM.SolutionUniqueName: cm_core_cobranzamovil"
          g(){ curl -s -H "$H" -H "$A" "$API/$1"; }
          ENT="EntityDefinitions(LogicalName='sanic_cm_tbl_asignacion')/Attributes"
          adddec(){ # schema  label
            cat > /tmp/c.json <<JSON
          {"@odata.type":"Microsoft.Dynamics.CRM.DecimalAttributeMetadata","SchemaName":"$1","RequiredLevel":{"Value":"None"},"Precision":2,"MinValue":0,"MaxValue":1000000000,"DisplayName":{"@odata.type":"Microsoft.Dynamics.CRM.Label","LocalizedLabels":[{"@odata.type":"Microsoft.Dynamics.CRM.LocalizedLabel","Label":"$2","LanguageCode":1033}]}}
          JSON
            local code=$(curl -s -o /tmp/r.txt -w "%{http_code}" -X POST "$API/$ENT" -H "$H" -H "$J" -H "$A" -H "$SOL" --data @/tmp/c.json)
            printf "  %-28s HTTP %s\n" "$1" "$code"; [ "$code" -ge 300 ] && grep -o '"message":"[^"]*"' /tmp/r.txt | head -1
          }
          echo "=== crear columnas retiro en asignacion ==="
          adddec sanic_cm_as_retironio 'Retiro C\$'
          adddec sanic_cm_as_retirousd 'Retiro US\$'
          curl -s -o /dev/null -w "  Publish HTTP %{http_code}\n" -X POST "$API/PublishAllXml" -H "$H" -H "$J" -H "$A" -d '{}'

          echo "=== rearmar form 'CM | Solicitud de Especial' con retiro ==="
          FID=$(g "systemforms?\$filter=objecttypecode%20eq%20'sanic_cm_tbl_asignacion'%20and%20name%20eq%20'CM%20%7C%20Solicitud%20de%20Especial'&\$select=formid" | jq -r '.value[0].formid')
          TEXT='{4273EDBD-AC1D-40d3-9FB2-095C621B552D}'; MEMO='{E0DECE4B-6FC8-4a8f-A065-082708572369}'; LOOKUP='{270BD3DB-D9AF-4782-9025-509E298DEC0A}'; PICK='{3EF39988-22BB-4f0b-BBBE-64B5A3748AEE}'; DATE='{5B773807-9FB2-42db-97C3-7A91EFF8ADFF}'; DEC='{C3EFE0C3-0EC6-42be-8349-CBD9079DFD8E}'
          uid(){ echo "{$(uuidgen)}"; }
          row(){ printf '<row><cell id="%s"><labels><label description="%s" languagecode="1033" /></labels><control id="%s" classid="%s" datafieldname="%s" disabled="%s" /></cell></row>' "$(uid)" "$3" "$1" "$2" "$1" "$4"; }
          section(){ printf '<section name="%s" showlabel="true" showbar="false" id="%s" columns="11" labelwidth="150" celllabelalignment="Left" celllabelposition="Left"><labels><label description="%s" languagecode="1033" /></labels><rows>%s</rows></section>' "$1" "$(uid)" "$2" "$3"; }
          SOLIC="$(row sanic_cm_as_cuentaid "$LOOKUP" 'Cuenta (existente)' false)$(row sanic_cm_as_retironio "$DEC" 'Retiro C\$' false)$(row sanic_cm_as_retirousd "$DEC" 'Retiro US\$' false)$(row sanic_cm_as_motivo "$MEMO" 'Motivo de la solicitud' false)"
          CLASIF="$(row sanic_cm_as_tipo "$PICK" 'Tipo' false)$(row sanic_cm_as_estadoaprobacion "$PICK" 'Estado de aprobación' false)"
          INFO="$(row sanic_cm_as_solicitadopor "$LOOKUP" 'Solicitado por' true)$(row sanic_cm_as_fechasignacion "$DATE" 'Fecha de solicitud' true)"
          RESOL="$(row sanic_cm_as_agenteid "$LOOKUP" 'Localizador asignado' true)$(row sanic_cm_as_resolutorid "$LOOKUP" 'Resuelto por' true)$(row sanic_cm_as_motivorechazo "$MEMO" 'Motivo de rechazo' true)"
          SECTIONS="$(section sec_solic 'Solicitud (llená vos)' "$SOLIC")$(section sec_clasif 'Clasificación' "$CLASIF")$(section sec_info 'Info' "$INFO")$(section sec_resol 'Resolución (supervisor)' "$RESOL")"
          FX="$(printf '<form><tabs><tab name="tab_esp" verticallayout="true" id="%s" IsUserDefined="0" locklevel="0" showlabel="true" expanded="true"><labels><label description="Solicitud de Especial" languagecode="1033" /></labels><columns><column width="100%%"><sections>%s</sections></column></columns></tab></tabs></form>' "$(uid)" "$SECTIONS")"
          jq -n --arg fx "$FX" '{formxml:$fx}' > /tmp/f.json
          code=$(curl -s -o /tmp/rf.txt -w "%{http_code}" -X PATCH "$API/systemforms($FID)" -H "$H" -H "$J" -H "$A" -H "$SOL" --data @/tmp/f.json)
          echo "  PATCH form HTTP $code"; [ "$code" -ge 300 ] && head -c 200 /tmp/rf.txt
          curl -s -o /dev/null -w "  Publish HTTP %{http_code}\n" -X POST "$API/PublishAllXml" -H "$H" -H "$J" -H "$A" -d '{}'
          g "systemforms($FID)?\$select=formxml" | jq -r '.formxml' | grep -oE 'datafieldname="[^"]*" disabled="[^"]*"'
