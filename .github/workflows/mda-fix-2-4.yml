name: mda-fix-2-4

# Fix 2: agrega filtro estadograbacion=Pendiente a la vista "Por Transcribir".
# Fix 4: activa la business rule "Bloqueo tras grabacion en CORE".
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Fix vista + regla
        env:
          CID: ${{ secrets.PP_CLIENT_ID }}
          SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT: ${{ secrets.PP_TENANT_ID }}
          URL: ${{ secrets.DATAVERSE_URL }}
        run: |
          set +e
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token" \
            -d "client_id=$CID" -d "client_secret=$SECRET" -d "grant_type=client_credentials" -d "scope=$URL/.default" | jq -r .access_token)
          API="$URL/api/data/v9.2"
          H_AUTH="Authorization: Bearer $TOKEN"; A="Accept: application/json"; JSON="Content-Type: application/json"
          SOL="MSCRM.SolutionUniqueName: cm_core_cobranzamovil"
          ENT='sanic_cm_tbl_interaccion'
          g(){ curl -s -H "$H_AUTH" -H "$A" "$API/$1"; }

          echo "################ FIX 2 — filtro estadograbacion=Pendiente en 'Por Transcribir' ################"
          V=$(g "savedqueries?\$filter=returnedtypecode%20eq%20'$ENT'%20and%20name%20eq%20'Por%20Transcribir'&\$select=savedqueryid,fetchxml")
          SQID=$(echo "$V" | jq -r '.value[0].savedqueryid')
          FX=$(echo "$V" | jq -r '.value[0].fetchxml')
          echo "  savedqueryid=$SQID"
          if echo "$FX" | grep -q 'sanic_cm_in_estadograbacion.*operator'; then
            echo "  (ya tenía filtro — no toco)"
          else
            FILTER='<filter type="and"><condition attribute="sanic_cm_in_estadograbacion" operator="eq" value="1" /></filter>'
            # Insertar el filtro como primer hijo del <entity ...> (posición que Dataverse siempre acepta)
            NEWFX=$(echo "$FX" | sed "s#\(<entity name=\"$ENT\">\)#\1${FILTER}#")
            echo "  debug filtro en payload: $(echo "$NEWFX" | grep -oE '<filter.*</filter>' || echo NO-INSERTADO)"
            jq -n --arg fx "$NEWFX" '{fetchxml:$fx}' > /tmp/patch.json
            code=$(curl -s -o /tmp/r.txt -w "%{http_code}" -X PATCH "$API/savedqueries($SQID)" -H "$H_AUTH" -H "$JSON" -H "$A" -H "$SOL" --data @/tmp/patch.json)
            echo "  PATCH HTTP $code"; [ "$code" -ge 300 ] && cat /tmp/r.txt
          fi
          echo "  -- fetchxml resultante --"
          g "savedqueries($SQID)?\$select=fetchxml" | jq -r '.fetchxml' | grep -oE '<filter.*</filter>' || echo "  (sin filtro!)"

          echo "################ FIX 4 — activar business rule de bloqueo ################"
          W=$(g "workflows?\$filter=primaryentity%20eq%20'$ENT'%20and%20category%20eq%202&\$select=workflowid,name,statecode,statuscode")
          echo "$W" | jq -r '.value[] | "  \(.name)  state=\(.statecode) status=\(.statuscode)  [\(.workflowid)]"'
          WID=$(echo "$W" | jq -r '[.value[] | select(.name|test("Bloqueo"))][0].workflowid')
          echo "  workflowid=$WID"
          if [ -n "$WID" ] && [ "$WID" != "null" ]; then
            code=$(curl -s -o /tmp/r2.txt -w "%{http_code}" -X PATCH "$API/workflows($WID)" -H "$H_AUTH" -H "$JSON" -H "$A" --data '{"statecode":1,"statuscode":2}')
            echo "  activar HTTP $code"; [ "$code" -ge 300 ] && cat /tmp/r2.txt
          fi
          echo "  -- estado final --"
          g "workflows($WID)?\$select=name,statecode,statuscode" | jq -r '"  \(.name): state=\(.statecode) (1=Activada) status=\(.statuscode)"'

          echo "################ PublishAllXml ################"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$API/PublishAllXml" -H "$H_AUTH" -H "$JSON" -H "$A" -d '{}')
          echo "  HTTP $code"
