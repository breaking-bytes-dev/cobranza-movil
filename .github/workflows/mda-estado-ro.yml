name: mda-estado-ro
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ro:
    runs-on: ubuntu-latest
    steps:
      - name: Estado read-only
        env:
          CID: ${{ secrets.PP_CLIENT_ID }}
          SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT: ${{ secrets.PP_TENANT_ID }}
          URL: ${{ secrets.DATAVERSE_URL }}
        run: |
          set +e
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token" \
            -d "client_id=$CID" -d "client_secret=$SECRET" -d "grant_type=client_credentials" -d "scope=$URL/.default" | jq -r .access_token)
          API="$URL/api/data/v9.2"; H_AUTH="Authorization: Bearer $TOKEN"; A="Accept: application/json"; JSON="Content-Type: application/json"
          SOL="MSCRM.SolutionUniqueName: cm_core_cobranzamovil"; ENT='sanic_cm_tbl_interaccion'
          g(){ curl -s -H "$H_AUTH" -H "$A" "$API/$1"; }
          FID=$(g "systemforms?\$filter=objecttypecode%20eq%20'$ENT'%20and%20type%20eq%202&\$select=formid" | jq -r '.value[0].formid')
          FX=$(g "systemforms($FID)?\$select=formxml" | jq -r '.formxml')
          NEWFX=$(echo "$FX" | sed 's#datafieldname="sanic_cm_in_estadograbacion" disabled="false"#datafieldname="sanic_cm_in_estadograbacion" disabled="true"#')
          jq -n --arg fx "$NEWFX" '{formxml:$fx}' > /tmp/f.json
          code=$(curl -s -o /tmp/r.txt -w "%{http_code}" -X PATCH "$API/systemforms($FID)" -H "$H_AUTH" -H "$JSON" -H "$A" -H "$SOL" --data @/tmp/f.json)
          echo "PATCH HTTP $code"; [ "$code" -ge 300 ] && cat /tmp/r.txt
          curl -s -o /dev/null -w "Publish HTTP %{http_code}\n" -X POST "$API/PublishAllXml" -H "$H_AUTH" -H "$JSON" -H "$A" -d '{}'
          echo "-- estado editables/RO --"
          g "systemforms($FID)?\$select=formxml" | jq -r '.formxml' | grep -oE 'datafieldname="sanic_cm_in_(estadograbacion|codigograbacion)" disabled="[^"]*"'
