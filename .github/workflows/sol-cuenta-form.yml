name: sol-cuenta-form
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - name: form cuenta
        env:
          CID: ${{ secrets.PP_CLIENT_ID }}
          SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT: ${{ secrets.PP_TENANT_ID }}
          URL: ${{ secrets.DATAVERSE_URL }}
        run: |
          set +e
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token" -d "client_id=$CID" -d "client_secret=$SECRET" -d "grant_type=client_credentials" -d "scope=$URL/.default" | jq -r .access_token)
          API="$URL/api/data/v9.2"; H_AUTH="Authorization: Bearer $TOKEN"; A="Accept: application/json"; JSON="Content-Type: application/json"
          SOL="MSCRM.SolutionUniqueName: cm_core_cobranzamovil"; E='sanic_cm_tbl_cuenta'
          g(){ curl -s -H "$H_AUTH" -H "$A" "$API/$1"; }
          FID=$(g "systemforms?\$filter=objecttypecode%20eq%20'$E'%20and%20type%20eq%202&\$select=formid" | jq -r '.value[0].formid')
          AVIEW=$(g "savedqueries?\$filter=returnedtypecode%20eq%20'sanic_cm_tbl_asignacion'%20and%20name%20eq%20'Active%20CM%20%7C%20TBL%20%7C%20Asignacions'&\$select=savedqueryid" | jq -r '.value[0].savedqueryid')
          echo "formid cuenta=$FID  vista asignacion=$AVIEW"
          TEXT='{4273EDBD-AC1D-40d3-9FB2-095C621B552D}'; MEMO='{E0DECE4B-6FC8-4a8f-A065-082708572369}'; LOOKUP='{270BD3DB-D9AF-4782-9025-509E298DEC0A}'; DEC='{C3EFE0C3-0EC6-42be-8349-CBD9079DFD8E}'; INT='{C6D124CA-7EDA-4a60-AAD6-1F44BC4A6D5B}'; SUB='{E7A81278-8635-4d9e-8D4D-59480B391C5B}'
          uid(){ echo "{$(uuidgen)}"; }
          row(){ printf '<row><cell id="%s"><labels><label description="%s" languagecode="1033" /></labels><control id="%s" classid="%s" datafieldname="%s" disabled="false" /></cell></row>' "$(uid)" "$3" "$1" "$2" "$1"; }
          section(){ printf '<section name="%s" showlabel="true" showbar="false" id="%s" columns="11" labelwidth="140" celllabelalignment="Left" celllabelposition="Left"><labels><label description="%s" languagecode="1033" /></labels><rows>%s</rows></section>' "$1" "$(uid)" "$2" "$3"; }
          DATOS="$(row sanic_cm_ct_clienteid "$LOOKUP" 'Cliente')$(row sanic_cm_ct_numerodecuenta "$TEXT" 'Número de cuenta')$(row sanic_cm_ct_productoid "$LOOKUP" 'Producto')$(row sanic_cm_ct_tipoproducto "$TEXT" 'Tipo de producto')$(row sanic_cm_ct_fiador "$LOOKUP" 'Fiador')$(row sanic_cm_ct_nota "$MEMO" 'Nota')"
          MONTOS="$(row sanic_cm_ct_retironio "$DEC" 'Retiro C$')$(row sanic_cm_ct_retirousd "$DEC" 'Retiro US$')$(row sanic_cm_ct_saldovencidonio "$DEC" 'Saldo vencido C$')$(row sanic_cm_ct_saldovencidousd "$DEC" 'Saldo vencido US$')$(row sanic_cm_ct_diasmora "$INT" 'Días mora')$(row sanic_cm_ct_nivelmora "$INT" 'Nivel mora')"
          SG=$(printf '<control id="sg_asig" classid="%s" indicationOfSubgrid="true" uniqueid="%s"><parameters><ViewId>{%s}</ViewId><IsUserView>false</IsUserView><RelationshipName>sanic_cm_tbl_asignacion_cm_as_cuentaid_sanic_cm_tbl_cuenta</RelationshipName><TargetEntityType>sanic_cm_tbl_asignacion</TargetEntityType><EnableQuickFind>false</EnableQuickFind><EnableViewPicker>false</EnableViewPicker><ViewIds /><EnableJumpBar>false</EnableJumpBar><ChartGridMode>Grid</ChartGridMode><VisualizationId /><IsUserChart>false</IsUserChart><EnableChartPicker>false</EnableChartPicker><RecordsPerPage>5</RecordsPerPage><AutoExpand>Fixed</AutoExpand></parameters></control>' "$SUB" "$(uid)" "$AVIEW")
          SGSEC=$(printf '<section name="sec_asig" showlabel="true" showbar="false" id="%s" columns="1" labelwidth="140" celllabelalignment="Left" celllabelposition="Left"><labels><label description="Asignaciones / Solicitudes" languagecode="1033" /></labels><rows><row><cell id="%s" showlabel="false" rowspan="6" colspan="1"><labels><label description="Asignaciones" languagecode="1033" /></labels>%s</cell></row></rows></section>' "$(uid)" "$(uid)" "$SG")
          SECTIONS="$(section sec_datos 'Datos del producto' "$DATOS")$(section sec_montos 'Montos y mora' "$MONTOS")${SGSEC}"
          FX="$(printf '<form><tabs><tab name="tab_cuenta" verticallayout="true" id="%s" IsUserDefined="0" locklevel="0" showlabel="true" expanded="true"><labels><label description="Producto / Cuenta" languagecode="1033" /></labels><columns><column width="100%%"><sections>%s</sections></column></columns></tab></tabs></form>' "$(uid)" "$SECTIONS")"
          echo "  formxml len=${#FX}"
          jq -n --arg fx "$FX" '{formxml:$fx}' > /tmp/f.json
          code=$(curl -s -o /tmp/r.txt -w "%{http_code}" -X PATCH "$API/systemforms($FID)" -H "$H_AUTH" -H "$JSON" -H "$A" -H "$SOL" --data @/tmp/f.json)
          echo "  PATCH HTTP $code"; [ "$code" -ge 300 ] && cat /tmp/r.txt
          curl -s -o /dev/null -w "  Publish HTTP %{http_code}\n" -X POST "$API/PublishAllXml" -H "$H_AUTH" -H "$JSON" -H "$A" -d '{}'
          g "systemforms($FID)?\$select=formxml" | jq -r '.formxml' | grep -oE 'datafieldname="[^"]*"|RelationshipName>[^<]+' | sort -u
