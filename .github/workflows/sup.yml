name: sup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - name: vistas supervisor + form aprobacion
        env:
          CID: ${{ secrets.PP_CLIENT_ID }}
          SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT: ${{ secrets.PP_TENANT_ID }}
          URL: ${{ secrets.DATAVERSE_URL }}
        run: |
          set +e
          URL="${URL%/}"
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token" -d "client_id=$CID" -d "client_secret=$SECRET" -d "grant_type=client_credentials" -d "scope=$URL/.default" | jq -r .access_token)
          API="$URL/api/data/v9.2"; H="Authorization: Bearer $TOKEN"; A="Accept: application/json"; J="Content-Type: application/json"; SOL="MSCRM.SolutionUniqueName: cm_core_cobranzamovil"
          g(){ curl -s -H "$H" -H "$A" "$API/$1"; }
          E='sanic_cm_tbl_asignacion'; OTC=$(g "EntityDefinitions(LogicalName='$E')?\$select=ObjectTypeCode" | jq -r '.ObjectTypeCode')

          echo "=== crear vista 'Especiales · Resueltas' ==="
          EX=$(g "savedqueries?\$filter=name%20eq%20'Especiales%20%C2%B7%20Resueltas'&\$select=savedqueryid" | jq -r '.value[0].savedqueryid // empty')
          [ -n "$EX" ] && curl -s -o /dev/null -X DELETE "$API/savedqueries($EX)" -H "$H" -H "$A"
          FR='<fetch version="1.0" mapping="logical" distinct="true"><entity name="sanic_cm_tbl_asignacion"><attribute name="sanic_cm_as_numero" /><attribute name="sanic_cm_as_cuentaid" /><attribute name="sanic_cm_as_estadoaprobacion" /><attribute name="sanic_cm_as_agenteid" /><attribute name="createdby" /><attribute name="modifiedon" /><attribute name="sanic_cm_tbl_asignacionid" /><order attribute="modifiedon" descending="true" /><filter type="and"><condition attribute="sanic_cm_as_tipo" operator="eq" value="3" /><condition attribute="sanic_cm_as_estadoaprobacion" operator="in"><value>3</value><value>4</value></condition></filter></entity></fetch>'
          LR=$(printf '<grid name="resultset" object="%s" jump="sanic_cm_as_numero" select="1" icon="1" preview="1"><row name="result" id="sanic_cm_tbl_asignacionid"><cell name="sanic_cm_as_numero" width="100" /><cell name="sanic_cm_as_cuentaid" width="130" /><cell name="sanic_cm_as_estadoaprobacion" width="140" /><cell name="sanic_cm_as_agenteid" width="140" /><cell name="createdby" width="140" /><cell name="modifiedon" width="130" /></row></grid>' "$OTC")
          jq -n --arg n "Especiales · Resueltas" --arg f "$FR" --arg l "$LR" '{name:$n, returnedtypecode:"sanic_cm_tbl_asignacion", fetchxml:$f, layoutxml:$l, querytype:0, description:"Especiales aprobadas o rechazadas"}' > /tmp/v.json
          echo "  crear Resueltas HTTP $(curl -s -o /dev/null -w "%{http_code}" -X POST "$API/savedqueries" -H "$H" -H "$J" -H "$A" -H "$SOL" --data @/tmp/v.json)"

          echo "=== form Aprobación: estadoaprobacion editable + Resuelto por = Modified By + notas ==="
          FA=$(g "systemforms?\$filter=objecttypecode%20eq%20'$E'%20and%20name%20eq%20'CM%20%7C%20Aprobaci%C3%B3n%20de%20Especial'&\$select=formid" | jq -r '.value[0].formid')
          TEXT='{4273EDBD-AC1D-40d3-9FB2-095C621B552D}'; MEMO='{E0DECE4B-6FC8-4a8f-A065-082708572369}'; LOOKUP='{270BD3DB-D9AF-4782-9025-509E298DEC0A}'; PICK='{3EF39988-22BB-4f0b-BBBE-64B5A3748AEE}'; DATE='{5B773807-9FB2-42db-97C3-7A91EFF8ADFF}'; DEC='{C3EFE0C3-0EC6-42be-8349-CBD9079DFD8E}'
          uid(){ echo "{$(uuidgen)}"; }
          row(){ printf '<row><cell id="%s"><labels><label description="%s" languagecode="1033" /></labels><control id="%s" classid="%s" datafieldname="%s" disabled="%s" /></cell></row>' "$(uid)" "$3" "$1" "$2" "$1" "$4"; }
          section(){ printf '<section name="%s" showlabel="true" showbar="false" id="%s" columns="11" labelwidth="150" celllabelalignment="Left" celllabelposition="Left"><labels><label description="%s" languagecode="1033" /></labels><rows>%s</rows></section>' "$1" "$(uid)" "$2" "$3"; }
          bf(){ printf '<form><tabs><tab name="t" verticallayout="true" id="%s" IsUserDefined="0" locklevel="0" showlabel="true" expanded="true"><labels><label description="Aprobación de Especial" languagecode="1033" /></labels><columns><column width="100%%"><sections>%s</sections></column></columns></tab></tabs></form>' "$(uid)" "$1"; }
          A1="$(row sanic_cm_as_cuentaid "$LOOKUP" 'Producto / Cuenta' true)$(row sanic_cm_as_retironio "$DEC" 'Retiro NIO' true)$(row sanic_cm_as_retirousd "$DEC" 'Retiro USD' true)$(row createdby "$LOOKUP" 'Solicitado por' true)$(row createdon "$DATE" 'Fecha de solicitud' true)$(row sanic_cm_as_motivo "$MEMO" 'Motivo de la solicitud' true)$(row sanic_cm_as_notas "$MEMO" 'Notas (para el localizador)' true)"
          A2="$(row sanic_cm_as_agenteid "$LOOKUP" 'Asignar localizador' false)$(row sanic_cm_as_estadoaprobacion "$PICK" 'Decisión (Aprobado / Rechazada)' false)$(row sanic_cm_as_motivorechazo "$MEMO" 'Motivo de rechazo (si rechaza)' false)"
          A3="$(row modifiedby "$LOOKUP" 'Resuelto por' true)"
          FXA="$(bf "$(section a1 'Solicitud a revisar' "$A1")$(section a2 'Decisión del supervisor' "$A2")$(section a3 'Estado' "$A3")")"
          jq -n --arg fx "$FXA" '{formxml:$fx}' > /tmp/f.json
          echo "  form Aprobación HTTP $(curl -s -o /dev/null -w "%{http_code}" -X PATCH "$API/systemforms($FA)" -H "$H" -H "$J" -H "$A" -H "$SOL" --data @/tmp/f.json)"
          curl -s -o /dev/null -w "  Publish HTTP %{http_code}\n" -X POST "$API/PublishAllXml" -H "$H" -H "$J" -H "$A" -d '{}'
          g "savedqueries?\$filter=startswith(name,'Especiales%20%C2%B7')&\$select=name" | jq -r '.value[]? | "  vista: " + .name'
