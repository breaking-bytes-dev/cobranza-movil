name: sol-esp-form2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - name: form especial (fix orden classid/label)
        env:
          CID: ${{ secrets.PP_CLIENT_ID }}
          SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT: ${{ secrets.PP_TENANT_ID }}
          URL: ${{ secrets.DATAVERSE_URL }}
        run: |
          set +e
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token" -d "client_id=$CID" -d "client_secret=$SECRET" -d "grant_type=client_credentials" -d "scope=$URL/.default" | jq -r .access_token)
          API="$URL/api/data/v9.2"; H_AUTH="Authorization: Bearer $TOKEN"; A="Accept: application/json"; JSON="Content-Type: application/json"
          SOL="MSCRM.SolutionUniqueName: cm_core_cobranzamovil"; E='sanic_cm_tbl_asignacion'
          g(){ curl -s -H "$H_AUTH" -H "$A" "$API/$1"; }
          # idempotente: si el form ya existe, borrarlo primero
          EX=$(g "systemforms?\$filter=objecttypecode%20eq%20'$E'%20and%20name%20eq%20'CM%20%7C%20Solicitud%20de%20Especial'&\$select=formid" | jq -r '.value[0].formid // empty')
          if [ -n "$EX" ]; then echo "  (existe, lo borro: $EX)"; curl -s -o /dev/null -w "  del HTTP %{http_code}\n" -X DELETE "$API/systemforms($EX)" -H "$H_AUTH" -H "$A"; fi
          TEXT='{4273EDBD-AC1D-40d3-9FB2-095C621B552D}'; MEMO='{E0DECE4B-6FC8-4a8f-A065-082708572369}'; LOOKUP='{270BD3DB-D9AF-4782-9025-509E298DEC0A}'; PICK='{3EF39988-22BB-4f0b-BBBE-64B5A3748AEE}'; DATE='{5B773807-9FB2-42db-97C3-7A91EFF8ADFF}'
          uid(){ echo "{$(uuidgen)}"; }
          # row FIELD CLASSID LABEL DISABLED  (description=$3 label, classid=$2)
          row(){ printf '<row><cell id="%s"><labels><label description="%s" languagecode="1033" /></labels><control id="%s" classid="%s" datafieldname="%s" disabled="%s" /></cell></row>' "$(uid)" "$3" "$1" "$2" "$1" "$4"; }
          section(){ printf '<section name="%s" showlabel="true" showbar="false" id="%s" columns="11" labelwidth="140" celllabelalignment="Left" celllabelposition="Left"><labels><label description="%s" languagecode="1033" /></labels><rows>%s</rows></section>' "$1" "$(uid)" "$2" "$3"; }
          SOLIC="$(row sanic_cm_as_cuentaid "$LOOKUP" 'Producto / Cuenta' false)$(row sanic_cm_as_motivo "$MEMO" 'Motivo de la solicitud' false)"
          ESTADO="$(row sanic_cm_as_tipo "$PICK" 'Tipo' true)$(row sanic_cm_as_estadoaprobacion "$PICK" 'Estado de aprobación' true)$(row sanic_cm_as_solicitadopor "$LOOKUP" 'Solicitado por' true)$(row sanic_cm_as_fechasignacion "$DATE" 'Fecha de solicitud' true)"
          RESOL="$(row sanic_cm_as_agenteid "$LOOKUP" 'Localizador asignado' true)$(row sanic_cm_as_resolutorid "$LOOKUP" 'Resuelto por' true)$(row sanic_cm_as_motivorechazo "$MEMO" 'Motivo de rechazo' true)"
          SECTIONS="$(section sec_solic 'Solicitud' "$SOLIC")$(section sec_estado 'Estado' "$ESTADO")$(section sec_resol 'Resolución (supervisor)' "$RESOL")"
          FX="$(printf '<form><tabs><tab name="tab_esp" verticallayout="true" id="%s" IsUserDefined="0" locklevel="0" showlabel="true" expanded="true"><labels><label description="Solicitud de Especial" languagecode="1033" /></labels><columns><column width="100%%"><sections>%s</sections></column></columns></tab></tabs></form>' "$(uid)" "$SECTIONS")"
          echo "  formxml len=${#FX}"
          jq -n --arg n "CM | Solicitud de Especial" --arg fx "$FX" '{name:$n, description:"Formulario del Solicitante para pedir un Especial", type:2, objecttypecode:"sanic_cm_tbl_asignacion", formxml:$fx, formactivationstate:1, isdefault:false}' > /tmp/form.json
          code=$(curl -s -o /tmp/rf.txt -w "%{http_code}" -X POST "$API/systemforms" -H "$H_AUTH" -H "$JSON" -H "$A" -H "$SOL" --data @/tmp/form.json)
          echo "  crear form HTTP $code"; [ "$code" -ge 300 ] && cat /tmp/rf.txt
          curl -s -o /dev/null -w "  Publish HTTP %{http_code}\n" -X POST "$API/PublishAllXml" -H "$H_AUTH" -H "$JSON" -H "$A" -d '{}'
          g "systemforms?\$filter=objecttypecode%20eq%20'$E'%20and%20name%20eq%20'CM%20%7C%20Solicitud%20de%20Especial'&\$select=name,type" | jq -r '.value[]? | "  OK form: \(.name) (type \(.type))"'
          g "systemforms($(g "systemforms?\$filter=objecttypecode%20eq%20'$E'%20and%20name%20eq%20'CM%20%7C%20Solicitud%20de%20Especial'&\$select=formid" | jq -r '.value[0].formid'))?\$select=formxml" | jq -r '.formxml' | grep -oE 'datafieldname="[^"]*" disabled="[^"]*"'
