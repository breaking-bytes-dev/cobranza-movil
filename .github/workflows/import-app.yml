name: import-app

# ONE-SHOT: importa la solución con la app localizador rediseñada (offline) al entorno Dev,
# autenticando con el Service Principal. Baja el zip del release sol-v1.0.0.0. Borrable tras aplicar.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Instalar Power Platform CLI
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Bajar el zip de la app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p _dl
          gh release download sol-v1.0.0.0 --repo ${{ github.repository }} --dir _dl --pattern "*offline-v2.zip"
          ls -la _dl/
      - name: Autenticar + importar solución
        run: |
          pac auth create \
            --applicationId "${{ secrets.PP_CLIENT_ID }}" \
            --clientSecret "${{ secrets.PP_CLIENT_SECRET }}" \
            --tenant "${{ secrets.PP_TENANT_ID }}" \
            --environment "${{ secrets.DATAVERSE_URL }}"
          ZIP=$(ls _dl/*offline-v2.zip | head -1)
          echo "Importando $ZIP ..."
          pac solution import --path "$ZIP" --force-overwrite --publish-changes --activate-plugins
