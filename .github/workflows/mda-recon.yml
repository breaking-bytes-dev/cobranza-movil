name: mda-recon

# Read-only: qué existe ya en el entorno antes de construir la MDA (roles, apps, vistas, forms).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Recon
        env:
          CID: ${{ secrets.PP_CLIENT_ID }}
          SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT: ${{ secrets.PP_TENANT_ID }}
          URL: ${{ secrets.DATAVERSE_URL }}
        run: |
          set -uo pipefail
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token" \
            -d "client_id=$CID" -d "client_secret=$SECRET" -d "grant_type=client_credentials" -d "scope=$URL/.default" | jq -r .access_token)
          API="$URL/api/data/v9.2"; H="Authorization: Bearer $TOKEN"; A="Accept: application/json"
          g(){ curl -s -H "$H" -H "$A" "$API/$1"; }

          echo "===================== ROLES (SR | CM | ...) ====================="
          g "roles?\$select=name,roleid&\$filter=startswith(name,'SR')&\$orderby=name" | jq -r '.value[]? | "  " + .name + "   [" + .roleid + "]"'
          echo "  -- (todos los custom, por si el prefijo difiere) --"
          g "roles?\$select=name&\$filter=iscustomizable/Value eq true&\$orderby=name" | jq -r '.value[]? | "  " + .name' | grep -iE 'cm|cobranza|localizador|backoffice|supervisor|solicit|admin|servicio' || echo "  (ninguno con esas palabras)"

          echo "===================== BUSINESS UNIT raíz ====================="
          g "businessunits?\$select=name,businessunitid&\$filter=_parentbusinessunitid_value%20eq%20null" | jq -r '.value[]? | "  " + .name + "   [" + .businessunitid + "]"'

          echo "===================== APPS model-driven (appmodule) ====================="
          g "appmodules?\$select=name,uniquename,appmoduleid" | jq -r '.value[]? | "  " + .name + "  (" + .uniquename + ")"'

          echo "===================== VISTAS de interaccion (savedquery) ====================="
          g "savedqueries?\$select=name,querytype,savedqueryid&\$filter=returnedtypecode%20eq%20'sanic_cm_tbl_interaccion'&\$orderby=name" | jq -r '.value[]? | "  " + .name + "  (type " + (.querytype|tostring) + ")"'

          echo "===================== FORMS de interaccion (systemform) ====================="
          g "systemforms?\$select=name,type&\$filter=objecttypecode%20eq%20'sanic_cm_tbl_interaccion'&\$orderby=name" | jq -r '.value[]? | "  " + .name + "  (type " + (.type|tostring) + ")"'

          echo "===================== ¿Existe la solución cm_core_cobranzamovil? ====================="
          g "solutions?\$select=uniquename,friendlyname&\$filter=uniquename%20eq%20'cm_core_cobranzamovil'" | jq -r '.value[]? | "  " + .friendlyname + "  (" + .uniquename + ")"'
