name: fix
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - name: fix forms + default + views
        env:
          CID: ${{ secrets.PP_CLIENT_ID }}
          SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT: ${{ secrets.PP_TENANT_ID }}
          URL: ${{ secrets.DATAVERSE_URL }}
        run: |
          set +e
          URL="${URL%/}"
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token" -d "client_id=$CID" -d "client_secret=$SECRET" -d "grant_type=client_credentials" -d "scope=$URL/.default" | jq -r .access_token)
          API="$URL/api/data/v9.2"; H="Authorization: Bearer $TOKEN"; A="Accept: application/json"; J="Content-Type: application/json"; SOL="MSCRM.SolutionUniqueName: cm_core_cobranzamovil"
          g(){ curl -s -H "$H" -H "$A" "$API/$1"; }
          E='sanic_cm_tbl_asignacion'
          TEXT='{4273EDBD-AC1D-40d3-9FB2-095C621B552D}'; MEMO='{E0DECE4B-6FC8-4a8f-A065-082708572369}'; LOOKUP='{270BD3DB-D9AF-4782-9025-509E298DEC0A}'; PICK='{3EF39988-22BB-4f0b-BBBE-64B5A3748AEE}'; DATE='{5B773807-9FB2-42db-97C3-7A91EFF8ADFF}'; DEC='{C3EFE0C3-0EC6-42be-8349-CBD9079DFD8E}'
          uid(){ echo "{$(uuidgen)}"; }
          row(){ printf '<row><cell id="%s"><labels><label description="%s" languagecode="1033" /></labels><control id="%s" classid="%s" datafieldname="%s" disabled="%s" /></cell></row>' "$(uid)" "$3" "$1" "$2" "$1" "$4"; }
          section(){ printf '<section name="%s" showlabel="true" showbar="false" id="%s" columns="11" labelwidth="150" celllabelalignment="Left" celllabelposition="Left"><labels><label description="%s" languagecode="1033" /></labels><rows>%s</rows></section>' "$1" "$(uid)" "$2" "$3"; }
          buildform(){ printf '<form><tabs><tab name="t" verticallayout="true" id="%s" IsUserDefined="0" locklevel="0" showlabel="true" expanded="true"><labels><label description="%s" languagecode="1033" /></labels><columns><column width="100%%"><sections>%s</sections></column></columns></tab></tabs></form>' "$(uid)" "$1" "$2"; }
          patchform(){ jq -n --arg fx "$2" '{formxml:$fx}' > /tmp/f.json; local c=$(curl -s -o /tmp/r.txt -w "%{http_code}" -X PATCH "$API/systemforms($1)" -H "$H" -H "$J" -H "$A" -H "$SOL" --data @/tmp/f.json); echo "  form $1 HTTP $c"; [ "$c" -ge 300 ] && head -c 150 /tmp/r.txt; }

          echo "=== 1) default estadoaprobacion -> 2 (Pendiente) ==="
          M=$(g "EntityDefinitions(LogicalName='$E')/Attributes(LogicalName='sanic_cm_as_estadoaprobacion')/Microsoft.Dynamics.CRM.PicklistAttributeMetadata")
          echo "$M" | jq 'del(.OptionSet,.GlobalOptionSet) | .DefaultFormValue=2' > /tmp/attr.json
          c=$(curl -s -o /tmp/ra.txt -w "%{http_code}" -X PUT "$API/EntityDefinitions(LogicalName='$E')/Attributes(LogicalName='sanic_cm_as_estadoaprobacion')" -H "$H" -H "$J" -H "$A" -H "$SOL" -H "MSCRM.MergeLabels: true" --data @/tmp/attr.json)
          echo "  PUT default HTTP $c"; [ "$c" -ge 300 ] && grep -o '"message":"[^"]*"' /tmp/ra.txt | head -1

          echo "=== 2) form Solicitud (createdby/on, estado RO) ==="
          FS=$(g "systemforms?\$filter=objecttypecode%20eq%20'$E'%20and%20name%20eq%20'CM%20%7C%20Solicitud%20de%20Especial'&\$select=formid" | jq -r '.value[0].formid')
          SOL1="$(row sanic_cm_as_cuentaid "$LOOKUP" 'Cuenta (existente)' false)$(row sanic_cm_as_retironio "$DEC" 'Retiro NIO' false)$(row sanic_cm_as_retirousd "$DEC" 'Retiro USD' false)$(row sanic_cm_as_motivo "$MEMO" 'Motivo de la solicitud' false)"
          SOL2="$(row sanic_cm_as_tipo "$PICK" 'Tipo' false)$(row sanic_cm_as_estadoaprobacion "$PICK" 'Estado de aprobación' true)"
          SOL3="$(row createdby "$LOOKUP" 'Creado por' true)$(row createdon "$DATE" 'Creado el' true)"
          SOL4="$(row sanic_cm_as_agenteid "$LOOKUP" 'Localizador asignado' true)$(row sanic_cm_as_resolutorid "$LOOKUP" 'Resuelto por' true)$(row sanic_cm_as_motivorechazo "$MEMO" 'Motivo de rechazo' true)"
          FXS="$(buildform 'Solicitud de Especial' "$(section s1 'Solicitud (llená vos)' "$SOL1")$(section s2 'Clasificación' "$SOL2")$(section s3 'Info' "$SOL3")$(section s4 'Resolución (supervisor)' "$SOL4")")"
          patchform "$FS" "$FXS"

          echo "=== 3) form Aprobación (createdby/on + retiro visible) ==="
          FA=$(g "systemforms?\$filter=objecttypecode%20eq%20'$E'%20and%20name%20eq%20'CM%20%7C%20Aprobaci%C3%B3n%20de%20Especial'&\$select=formid" | jq -r '.value[0].formid')
          AP1="$(row sanic_cm_as_cuentaid "$LOOKUP" 'Producto / Cuenta' true)$(row sanic_cm_as_retironio "$DEC" 'Retiro NIO' true)$(row sanic_cm_as_retirousd "$DEC" 'Retiro USD' true)$(row createdby "$LOOKUP" 'Solicitado por (creado por)' true)$(row createdon "$DATE" 'Fecha de solicitud' true)$(row sanic_cm_as_motivo "$MEMO" 'Motivo de la solicitud' true)"
          AP2="$(row sanic_cm_as_agenteid "$LOOKUP" 'Asignar localizador' false)$(row sanic_cm_as_motivorechazo "$MEMO" 'Motivo de rechazo (si rechaza)' false)"
          AP3="$(row sanic_cm_as_estadoaprobacion "$PICK" 'Estado de aprobación' true)$(row sanic_cm_as_resolutorid "$LOOKUP" 'Resuelto por' true)"
          FXA="$(buildform 'Aprobación de Especial' "$(section a1 'Solicitud a revisar' "$AP1")$(section a2 'Decisión del supervisor' "$AP2")$(section a3 'Estado' "$AP3")")"
          patchform "$FA" "$FXA"

          echo "=== 4) vistas: usar createdby ==="
          OTC=$(g "EntityDefinitions(LogicalName='$E')?\$select=ObjectTypeCode" | jq -r '.ObjectTypeCode')
          # Mis solicitudes: filtro tipo=3 + createdby eq-userid
          MS=$(g "savedqueries?\$filter=name%20eq%20'Especiales%20%C2%B7%20Mis%20solicitudes'&\$select=savedqueryid" | jq -r '.value[0].savedqueryid')
          FMS='<fetch version="1.0" mapping="logical" distinct="true"><entity name="sanic_cm_tbl_asignacion"><attribute name="sanic_cm_as_numero" /><attribute name="sanic_cm_as_cuentaid" /><attribute name="sanic_cm_as_estadoaprobacion" /><attribute name="sanic_cm_as_retironio" /><attribute name="sanic_cm_as_retirousd" /><attribute name="createdon" /><attribute name="sanic_cm_as_motivo" /><attribute name="sanic_cm_tbl_asignacionid" /><order attribute="createdon" descending="true" /><filter type="and"><condition attribute="sanic_cm_as_tipo" operator="eq" value="3" /><condition attribute="createdby" operator="eq-userid" /></filter></entity></fetch>'
          LMS=$(printf '<grid name="resultset" object="%s" jump="sanic_cm_as_numero" select="1" icon="1" preview="1"><row name="result" id="sanic_cm_tbl_asignacionid"><cell name="sanic_cm_as_numero" width="100" /><cell name="sanic_cm_as_cuentaid" width="130" /><cell name="sanic_cm_as_estadoaprobacion" width="140" /><cell name="sanic_cm_as_retironio" width="100" /><cell name="sanic_cm_as_retirousd" width="100" /><cell name="createdon" width="120" /><cell name="sanic_cm_as_motivo" width="220" /></row></grid>' "$OTC")
          jq -n --arg f "$FMS" --arg l "$LMS" '{fetchxml:$f, layoutxml:$l}' > /tmp/v.json
          echo "  Mis solicitudes PATCH HTTP $(curl -s -o /dev/null -w "%{http_code}" -X PATCH "$API/savedqueries($MS)" -H "$H" -H "$J" -H "$A" -H "$SOL" --data @/tmp/v.json)"
          # Aprobaciones pendientes: columna createdby
          AS=$(g "savedqueries?\$filter=name%20eq%20'Especiales%20%C2%B7%20Aprobaciones%20pendientes'&\$select=savedqueryid" | jq -r '.value[0].savedqueryid')
          FAS='<fetch version="1.0" mapping="logical" distinct="true"><entity name="sanic_cm_tbl_asignacion"><attribute name="sanic_cm_as_numero" /><attribute name="sanic_cm_as_cuentaid" /><attribute name="createdby" /><attribute name="sanic_cm_as_retironio" /><attribute name="sanic_cm_as_retirousd" /><attribute name="createdon" /><attribute name="sanic_cm_as_motivo" /><attribute name="sanic_cm_tbl_asignacionid" /><order attribute="createdon" descending="false" /><filter type="and"><condition attribute="sanic_cm_as_tipo" operator="eq" value="3" /><condition attribute="sanic_cm_as_estadoaprobacion" operator="eq" value="2" /></filter></entity></fetch>'
          LAS=$(printf '<grid name="resultset" object="%s" jump="sanic_cm_as_numero" select="1" icon="1" preview="1"><row name="result" id="sanic_cm_tbl_asignacionid"><cell name="sanic_cm_as_numero" width="100" /><cell name="sanic_cm_as_cuentaid" width="130" /><cell name="createdby" width="140" /><cell name="sanic_cm_as_retironio" width="100" /><cell name="sanic_cm_as_retirousd" width="100" /><cell name="sanic_cm_as_motivo" width="220" /></row></grid>' "$OTC")
          jq -n --arg f "$FAS" --arg l "$LAS" '{fetchxml:$f, layoutxml:$l}' > /tmp/v2.json
          echo "  Aprobaciones PATCH HTTP $(curl -s -o /dev/null -w "%{http_code}" -X PATCH "$API/savedqueries($AS)" -H "$H" -H "$J" -H "$A" -H "$SOL" --data @/tmp/v2.json)"

          curl -s -o /dev/null -w "  Publish HTTP %{http_code}\n" -X POST "$API/PublishAllXml" -H "$H" -H "$J" -H "$A" -d '{}'
          g "EntityDefinitions(LogicalName='$E')/Attributes(LogicalName='sanic_cm_as_estadoaprobacion')/Microsoft.Dynamics.CRM.PicklistAttributeMetadata?\$select=DefaultFormValue" | jq -r '"  estadoaprobacion DefaultFormValue = \(.DefaultFormValue)"'
