name: mda-audit

# Read-only: auditoría a fondo de la MDA existente (App - CM - Backoffice) vs diseño doc 07/09.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Auditoría MDA
        env:
          CID: ${{ secrets.PP_CLIENT_ID }}
          SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT: ${{ secrets.PP_TENANT_ID }}
          URL: ${{ secrets.DATAVERSE_URL }}
        run: |
          set -uo pipefail
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token" \
            -d "client_id=$CID" -d "client_secret=$SECRET" -d "grant_type=client_credentials" -d "scope=$URL/.default" | jq -r .access_token)
          API="$URL/api/data/v9.2"; H="Authorization: Bearer $TOKEN"; A="Accept: application/json"
          g(){ curl -s -H "$H" -H "$A" "$API/$1"; }
          ENT='sanic_cm_tbl_interaccion'

          echo "############### A) SITEMAP de la app (áreas / grupos / subáreas) ###############"
          APPID=$(g "appmodules?\$filter=uniquename%20eq%20'sanic_AppCMBackoffice'&\$select=appmoduleid" | jq -r '.value[0].appmoduleid')
          echo "  appmoduleid=$APPID"
          SMID=$(g "appmodulecomponents?\$filter=_appmoduleid_value%20eq%20$APPID%20and%20componenttype%20eq%2062&\$select=objectid" | jq -r '.value[0].objectid // empty')
          SMXML=""
          if [ -n "$SMID" ]; then SMXML=$(g "sitemaps($SMID)?\$select=sitemapxml" | jq -r '.sitemapxml // empty'); fi
          if [ -z "$SMXML" ]; then
            echo "  (no encontré sitemap por componente; busco por contenido)"
            SMXML=$(g "sitemaps?\$select=sitemapxml" | jq -r '.value[] | .sitemapxml' | grep -l . 2>/dev/null; g "sitemaps?\$select=sitemapname,sitemapxml" | jq -r '.value[] | select(.sitemapxml|test("sanic_cm_tbl_interaccion")) | .sitemapxml' | head -1)
          fi
          echo "  -- Áreas --";    echo "$SMXML" | grep -oE '<Area[^>]*Id="[^"]*"' | grep -oE 'Id="[^"]*"' | head -20
          echo "  -- Grupos --";   echo "$SMXML" | grep -oE '<Group[^>]*Id="[^"]*"' | grep -oE 'Id="[^"]*"' | head -30
          echo "  -- SubÁreas (Entity / Id) --"; echo "$SMXML" | grep -oE '<SubArea[^>]*/?>' | grep -oE '(Id|Entity|Url)="[^"]*"' | head -60
          echo "  -- Titles (es/en) --"; echo "$SMXML" | grep -oE 'Title="[^"]*"' | sort -u | head -40

          echo "############### B) VISTA 'Por Transcribir' (filtro + columnas) ###############"
          V=$(g "savedqueries?\$filter=returnedtypecode%20eq%20'$ENT'%20and%20name%20eq%20'Por%20Transcribir'&\$select=name,fetchxml,layoutxml")
          echo "$V" | jq -r '.value[0].fetchxml // "  (sin fetchxml)"'
          echo "  -- columnas (layout) --"; echo "$V" | jq -r '.value[0].layoutxml // ""' | grep -oE 'name="[^"]*"' | head -30

          echo "############### C) FORM Main (type 2) — tabs/sections/campos ###############"
          F=$(g "systemforms?\$filter=objecttypecode%20eq%20'$ENT'%20and%20type%20eq%202&\$select=name,formxml")
          echo "$F" | jq -r '.value[] | "  form: " + .name'
          FX=$(echo "$F" | jq -r '.value[0].formxml // ""')
          echo "  -- labels de tabs/sections --"; echo "$FX" | grep -oE 'description="[^"]*"' | sort -u | head -40
          echo "  -- campos en el form (datafieldname) --"; echo "$FX" | grep -oE 'datafieldname="[^"]*"' | sort -u | head -60

          echo "############### D) ROL 'SR | CM | BackOffice' — privilegios sobre tablas sanic_cm_tbl_ ###############"
          RID='e56809a5-fc76-f111-ab0e-70a8a5b226fd'
          g "RetrieveRolePrivilegesRole(RoleId=$RID)" | jq -r '.RolePrivileges[]? | .PrivilegeId + " " + (.Depth|tostring)' | sort > /tmp/rolepriv.txt
          g "privileges?\$select=name,privilegeid&\$filter=contains(name,'sanic_cm_tbl_')" | jq -r '.value[] | .privilegeid + " " + .name' | sort > /tmp/privnames.txt
          echo "  (Depth: 1=User 2=BU 4=ParentChild 8=Org)"
          join /tmp/rolepriv.txt /tmp/privnames.txt 2>/dev/null | awk '{d=$2; name=$3; sub(/^prv/,"",name); printf "  %-40s depth=%s\n", name, d}' | sort | head -80
          echo "  total privilegios del rol (todas las tablas): $(wc -l < /tmp/rolepriv.txt)"

          echo "############### E) FIELD SECURITY (columnas protegidas en interaccion) ###############"
          g "EntityDefinitions(LogicalName='$ENT')/Attributes?\$select=LogicalName,IsSecured&\$filter=IsSecured%20eq%20true" | jq -r '.value[]? | "  secured: " + .LogicalName'
          echo "  -- perfiles de field security --"
          g "fieldsecurityprofiles?\$select=name" | jq -r '.value[]? | "  profile: " + .name'

          echo "############### F) PROCESOS / reglas de negocio sobre interaccion ###############"
          g "workflows?\$select=name,category,statecode,type&\$filter=primaryentity%20eq%20'$ENT'" | jq -r '.value[]? | "  " + .name + "  (cat " + (.category|tostring) + ", type " + (.type|tostring) + ", state " + (.statecode|tostring) + ")"'
