name: planb
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - name: tipo default Especial + estadoaprobacion editable
        env:
          CID: ${{ secrets.PP_CLIENT_ID }}
          SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT: ${{ secrets.PP_TENANT_ID }}
          URL: ${{ secrets.DATAVERSE_URL }}
        run: |
          set +e
          URL="${URL%/}"
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token" -d "client_id=$CID" -d "client_secret=$SECRET" -d "grant_type=client_credentials" -d "scope=$URL/.default" | jq -r .access_token)
          API="$URL/api/data/v9.2"; H="Authorization: Bearer $TOKEN"; A="Accept: application/json"; J="Content-Type: application/json"; SOL="MSCRM.SolutionUniqueName: cm_core_cobranzamovil"
          g(){ curl -s -H "$H" -H "$A" "$API/$1"; }
          echo "=== 1) tipo DefaultFormValue = 3 (Especial) ==="
          code=$(curl -s -o /tmp/r.txt -w "%{http_code}" -X PATCH "$API/EntityDefinitions(LogicalName='sanic_cm_tbl_asignacion')/Attributes(LogicalName='sanic_cm_as_tipo')" -H "$H" -H "$J" -H "$A" -H "$SOL" --data '{"@odata.type":"Microsoft.Dynamics.CRM.PicklistAttributeMetadata","DefaultFormValue":3}')
          echo "  PATCH HTTP $code"; [ "$code" -ge 300 ] && head -c 250 /tmp/r.txt
          echo "=== 2) estadoaprobacion editable en form 'CM | Solicitud de Especial' ==="
          FID=$(g "systemforms?\$filter=objecttypecode%20eq%20'sanic_cm_tbl_asignacion'%20and%20name%20eq%20'CM%20%7C%20Solicitud%20de%20Especial'&\$select=formid" | jq -r '.value[0].formid')
          FX=$(g "systemforms($FID)?\$select=formxml" | jq -r '.formxml')
          NEWFX=$(echo "$FX" | sed 's#datafieldname="sanic_cm_as_estadoaprobacion" disabled="true"#datafieldname="sanic_cm_as_estadoaprobacion" disabled="false"#')
          jq -n --arg fx "$NEWFX" '{formxml:$fx}' > /tmp/f.json
          code=$(curl -s -o /tmp/r2.txt -w "%{http_code}" -X PATCH "$API/systemforms($FID)" -H "$H" -H "$J" -H "$A" -H "$SOL" --data @/tmp/f.json)
          echo "  PATCH form HTTP $code"; [ "$code" -ge 300 ] && head -c 250 /tmp/r2.txt
          curl -s -o /dev/null -w "  Publish HTTP %{http_code}\n" -X POST "$API/PublishAllXml" -H "$H" -H "$J" -H "$A" -d '{}'
          echo "=== verificación ==="
          g "EntityDefinitions(LogicalName='sanic_cm_tbl_asignacion')/Attributes(LogicalName='sanic_cm_as_tipo')/Microsoft.Dynamics.CRM.PicklistAttributeMetadata?\$select=DefaultFormValue" | jq -r '"  tipo DefaultFormValue = \(.DefaultFormValue)"'
          g "systemforms($FID)?\$select=formxml" | jq -r '.formxml' | grep -oE 'datafieldname="sanic_cm_as_(tipo|estadoaprobacion)" disabled="[^"]*"'
