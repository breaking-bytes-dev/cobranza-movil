name: mda-verify-final

# Verificación final de los 4 fixes de la MDA.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar
        env:
          CID: ${{ secrets.PP_CLIENT_ID }}
          SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT: ${{ secrets.PP_TENANT_ID }}
          URL: ${{ secrets.DATAVERSE_URL }}
        run: |
          set +e
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token" \
            -d "client_id=$CID" -d "client_secret=$SECRET" -d "grant_type=client_credentials" -d "scope=$URL/.default" | jq -r .access_token)
          API="$URL/api/data/v9.2"; H="Authorization: Bearer $TOKEN"; A="Accept: application/json"
          ENT='sanic_cm_tbl_interaccion'
          g(){ curl -s -H "$H" -H "$A" "$API/$1"; }

          echo "===== FIX 2: filtro de la vista 'Por Transcribir' ====="
          g "savedqueries?\$filter=returnedtypecode%20eq%20'$ENT'%20and%20name%20eq%20'Por%20Transcribir'&\$select=fetchxml" \
            | jq -r '.value[0].fetchxml' | grep -oE '<filter.*</filter>' || echo "  SIN FILTRO"

          echo "===== FIX 4: business rule de bloqueo ====="
          g "workflows?\$filter=primaryentity%20eq%20'$ENT'%20and%20category%20eq%202&\$select=name,statecode" \
            | jq -r '.value[] | "  \(.name): state=\(.statecode) (1=Activada)"'

          echo "===== FIX 1+3: formulario (secciones, subgrid, editables vs read-only) ====="
          FX=$(g "systemforms?\$filter=objecttypecode%20eq%20'$ENT'%20and%20type%20eq%202&\$select=formxml" | jq -r '.value[0].formxml')
          echo "  -- secciones --"; echo "$FX" | grep -oE '<label description="[^"]*"' | grep -iE 'Gestión|Pagos|Transcripción|Auditoría' | sed 's/<label description=/  /'
          echo "  -- ¿subgrid de pagos? --"; echo "$FX" | grep -qi 'E7A81278' && echo "  SÍ (subgrid presente)" || echo "  NO"
          echo "  -- campos EDITABLES (disabled=false) --"; echo "$FX" | grep -oE 'datafieldname="[^"]*" disabled="false"' | sed 's/ disabled.*//; s/datafieldname=/  /'
          echo "  -- campos READ-ONLY (disabled=true), muestra 3 --"; echo "$FX" | grep -oE 'datafieldname="[^"]*" disabled="true"' | sed 's/ disabled.*//; s/datafieldname=/  /' | head -3
          echo "  total campos: $(echo "$FX" | grep -oE 'datafieldname="[^"]*"' | sort -u | wc -l)"
