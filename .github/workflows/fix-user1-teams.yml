name: fix-user1-teams
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Sacar a User 1 de equipos ajenos
        env:
          DATAVERSE_URL: ${{ secrets.DATAVERSE_URL }}
          CLIENT_ID: ${{ secrets.PP_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT_ID: ${{ secrets.PP_TENANT_ID }}
        run: |
          set -uo pipefail
          URL="${DATAVERSE_URL%/}"
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/token" \
            --data-urlencode "grant_type=client_credentials" --data-urlencode "client_id=${CLIENT_ID}" \
            --data-urlencode "client_secret=${CLIENT_SECRET}" --data-urlencode "scope=${URL}/.default" | jq -r '.access_token // empty')
          [ -n "$TOKEN" ] || { echo "::error::No token"; exit 1; }
          AUTH="Authorization: Bearer $TOKEN"
          SUID="592f1177-6116-f111-8342-000d3a316609"

          echo "== Equipos de User 1 que dan roles (no default, no access-team de records) =="
          curl -s "${URL}/api/data/v9.2/systemusers(${SUID})/teammembership_association?\$select=name,teamid,teamtype&\$top=200" -H "$AUTH" \
            | jq -r '.value[] | "\(.teamid)\t\(.teamtype)\t\(.name)"' > /tmp/teams.tsv
          echo "  (id / type / name):"
          grep -iE "Satellite|Sigil|Proc|Demo" /tmp/teams.tsv | sed 's/^/    /' || echo "    (ninguno por nombre — revisar todos)"

          echo ""
          echo "== Removiendo a User 1 de esos equipos =="
          while IFS=$'\t' read -r tid ttype tname; do
            if echo "$tname" | grep -qiE "Satellite|Sigil|Proc|Demo"; then
              code=$(curl -s -o /tmp/d.json -w "%{http_code}" -X DELETE \
                "${URL}/api/data/v9.2/systemusers(${SUID})/teammembership_association(${tid})/\$ref" -H "$AUTH")
              if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
                echo "    ✓ removido de: $tname"
              else
                echo "    ✗ HTTP $code en: $tname"; jq -r '.error.message // .' /tmp/d.json 2>/dev/null | head -1
              fi
            fi
          done < /tmp/teams.tsv

          echo ""
          echo "== Roles efectivos de User 1 AHORA (directos + equipos restantes) =="
          echo "  Directos:"
          curl -s "${URL}/api/data/v9.2/systemusers(${SUID})/systemuserroles_association?\$select=name" -H "$AUTH" | jq -r '.value[] | "    - \(.name)"'
          echo "  Por equipos restantes:"
          for t in $(curl -s "${URL}/api/data/v9.2/systemusers(${SUID})/teammembership_association?\$select=teamid" -H "$AUTH" | jq -r '.value[].teamid'); do
            curl -s "${URL}/api/data/v9.2/teams(${t})/teamroles_association?\$select=name" -H "$AUTH" | jq -r '.value[]? | "    - \(.name) (equipo)"'
          done
