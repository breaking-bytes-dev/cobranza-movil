name: def2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: default estadoaprobacion Pendiente
        env:
          CID: ${{ secrets.PP_CLIENT_ID }}
          SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT: ${{ secrets.PP_TENANT_ID }}
          URL: ${{ secrets.DATAVERSE_URL }}
        run: |
          set +e
          URL="${URL%/}"
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token" -d "client_id=$CID" -d "client_secret=$SECRET" -d "grant_type=client_credentials" -d "scope=$URL/.default" | jq -r .access_token)
          API="$URL/api/data/v9.2"; H="Authorization: Bearer $TOKEN"; A="Accept: application/json"; J="Content-Type: application/json"; SOL="MSCRM.SolutionUniqueName: cm_core_cobranzamovil"
          AT="EntityDefinitions(LogicalName='sanic_cm_tbl_asignacion')/Attributes(LogicalName='sanic_cm_as_estadoaprobacion')"
          MID=$(curl -s -H "Authorization: Bearer $TOKEN" -H "$A" "$API/$AT?\$select=MetadataId" | jq -r '.MetadataId')
          echo "MetadataId=$MID"
          # payload minimo con @odata.type de picklist
          jq -n --arg id "$MID" '{"@odata.type":"Microsoft.Dynamics.CRM.PicklistAttributeMetadata", MetadataId:$id, DefaultFormValue:2}' > /tmp/a.json
          c=$(curl -s -o /tmp/r.txt -w "%{http_code}" -X PUT "$API/$AT" -H "Authorization: Bearer $TOKEN" -H "$J" -H "$A" -H "$SOL" -H "MSCRM.MergeLabels: true" --data @/tmp/a.json)
          echo "  PUT HTTP $c"; [ "$c" -ge 300 ] && grep -o '"message":"[^"]*"' /tmp/r.txt | head -1
          curl -s -o /dev/null -w "  Publish HTTP %{http_code}\n" -X POST "$API/PublishAllXml" -H "Authorization: Bearer $TOKEN" -H "$J" -H "$A" -d '{}'
          curl -s -H "Authorization: Bearer $TOKEN" -H "$A" "$API/$AT/Microsoft.Dynamics.CRM.PicklistAttributeMetadata?\$select=DefaultFormValue" | jq -r '"  DefaultFormValue = \(.DefaultFormValue)"'
