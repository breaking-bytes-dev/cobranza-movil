name: diag-owners
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Distribución de owners
        env:
          DATAVERSE_URL: ${{ secrets.DATAVERSE_URL }}
          CLIENT_ID: ${{ secrets.PP_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT_ID: ${{ secrets.PP_TENANT_ID }}
        run: |
          set -uo pipefail
          URL="${DATAVERSE_URL%/}"
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/token" \
            --data-urlencode "grant_type=client_credentials" --data-urlencode "client_id=${CLIENT_ID}" \
            --data-urlencode "client_secret=${CLIENT_SECRET}" --data-urlencode "scope=${URL}/.default" | jq -r '.access_token // empty')
          [ -n "$TOKEN" ] || { echo "::error::No token"; exit 1; }
          AUTH="Authorization: Bearer $TOKEN"
          ANN='Prefer: odata.include-annotations="OData.Community.Display.V1.FormattedValue"'

          echo "== DISTRIBUCIÓN DE OWNER de las 1000 asignaciones =="
          curl -s "${URL}/api/data/v9.2/sanic_cm_tbl_asignacions?\$select=sanic_cm_tbl_asignacionid,_ownerid_value&\$top=5000" \
            -H "$AUTH" -H "$ANN" -H "Prefer: odata.maxpagesize=5000" \
            | jq -r '.value | group_by(._ownerid_value) | map({owner: (.[0]["_ownerid_value@OData.Community.Display.V1.FormattedValue"] // "?"), oid: .[0]._ownerid_value, n: length}) | sort_by(-.n)[] | "  \(.n) asignaciones  → \(.owner)  (\(.oid))"'

          echo ""
          echo "== Roles asignados a EQUIPOS de tipo Owner/Default (no access teams) =="
          curl -s "${URL}/api/data/v9.2/teams?\$select=name,teamtype&\$filter=teamtype eq 0&\$expand=teamroles_association(\$select=name)&\$top=50" \
            -H "$AUTH" \
            | jq -r '.value[] | select((.teamroles_association|length) > 0) | "  equipo: \(.name)  → roles: \([.teamroles_association[].name]|join(", "))"'

          echo ""
          echo "== ¿User 1 tiene asignaciones propias? =="
          U1=$(curl -s "${URL}/api/data/v9.2/systemusers?\$select=systemuserid,fullname&\$filter=startswith(domainname,'User1')" -H "$AUTH" | jq -r '.value[0].systemuserid // empty')
          echo "  User1 systemuserid: $U1"
          if [ -n "$U1" ]; then
            CNT=$(curl -s "${URL}/api/data/v9.2/sanic_cm_tbl_asignacions?\$filter=_ownerid_value eq $U1&\$count=true&\$top=1" -H "$AUTH" | jq -r '."@odata.count" // "?"')
            echo "  asignaciones OWNED por User1: $CNT"
          fi
