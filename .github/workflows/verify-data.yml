name: verify-data

# Diagnóstico de VOLUMEN y COMPLETITUD de datos, para decidir la estrategia de carga.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Token + consultas
        env:
          CID: ${{ secrets.PP_CLIENT_ID }}
          SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT: ${{ secrets.PP_TENANT_ID }}
          URL: ${{ secrets.DATAVERSE_URL }}
        run: |
          set -e
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token" \
            -d "client_id=$CID" -d "client_secret=$SECRET" -d "grant_type=client_credentials" -d "scope=$URL/.default" | jq -r .access_token)
          H="Authorization: Bearer $TOKEN"; A="Accept: application/json"; P='Prefer: odata.maxpagesize=1'
          cnt(){ curl -s -H "$H" -H "$A" -H "$P" "$URL/api/data/v9.2/$1?\$count=true&\$top=1" | jq -r '.["@odata.count"]'; }

          echo "===================== VOLUMEN TOTAL POR TABLA ====================="
          for t in sanic_cm_tbl_cuentas sanic_cm_tbl_clientes sanic_cm_tbl_direccions sanic_cm_tbl_telefonos \
                   sanic_cm_tbl_asignacions sanic_cm_tbl_interaccions sanic_cm_tbl_pagos \
                   sanic_cm_tbl_agentes sanic_cm_tbl_productos sanic_cm_tbl_fiadors; do
            printf "  %-30s %s\n" "$t" "$(cnt $t)"
          done


          echo "===================== COMPLETITUD: nulls en campos clave ====================="
          echo -n "  cuentas SIN cifcliente: "; cnt 'sanic_cm_tbl_cuentas?$filter=sanic_cm_ct_cifcliente eq null'
          echo -n "  cuentas SIN saldovencidonio: "; cnt 'sanic_cm_tbl_cuentas?$filter=sanic_cm_ct_saldovencidonio eq null'
          echo -n "  direcciones SIN cif: "; cnt 'sanic_cm_tbl_direccions?$filter=sanic_cm_dr_cif eq null'
          echo -n "  telefonos SIN cif: "; cnt 'sanic_cm_tbl_telefonos?$filter=sanic_cm_tl_cif eq null'
          echo -n "  asignaciones owner=SYSTEM/sin-owner activas: "; cnt 'sanic_cm_tbl_asignacions?$filter=sanic_cm_as_estado eq true'
