name: verify-data

# Diagnóstico de datos: tipos de direccion (¿hay Trabajo?), direccion de Martha,
# y cuentas con nombrecliente/cifcliente en blanco (la card sin nombre).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Token + consultas Web API
        env:
          CID: ${{ secrets.PP_CLIENT_ID }}
          SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT: ${{ secrets.PP_TENANT_ID }}
          URL: ${{ secrets.DATAVERSE_URL }}
        run: |
          set -e
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token" \
            -d "client_id=$CID" -d "client_secret=$SECRET" \
            -d "grant_type=client_credentials" -d "scope=$URL/.default" | jq -r .access_token)
          H="Authorization: Bearer $TOKEN"; A="Accept: application/json"

          echo "===================== 1) DIRECCION: distribución por TIPO (¿hay Trabajo?) ====================="
          curl -s -H "$H" -H "$A" \
            "$URL/api/data/v9.2/sanic_cm_tbl_direccions?\$apply=groupby((sanic_cm_dr_tipo),aggregate(\$count%20as%20cnt))" \
            | jq '.value'

          echo "===================== 2) MARTHA: su cuenta (CIF) ====================="
          MARTHA=$(curl -s -H "$H" -H "$A" \
            "$URL/api/data/v9.2/sanic_cm_tbl_cuentas?\$filter=contains(sanic_cm_ct_nombrecliente,'Martha%20Sandra')&\$select=sanic_cm_ct_cifcliente,sanic_cm_ct_nombrecliente&\$top=2")
          echo "$MARTHA" | jq '.value'
          CIF=$(echo "$MARTHA" | jq -r '.value[0].sanic_cm_ct_cifcliente // empty')
          echo "CIF de Martha: '$CIF'"

          echo "===================== 3) MARTHA: ¿tiene direccion con ese CIF? ====================="
          if [ -n "$CIF" ]; then
            curl -s -H "$H" -H "$A" \
              "$URL/api/data/v9.2/sanic_cm_tbl_direccions?\$filter=sanic_cm_dr_cif%20eq%20'$CIF'&\$select=sanic_cm_dr_tipo,sanic_cm_dr_cif,sanic_cm_dr_direccion" \
              | jq '.value'
          else
            echo "sin CIF, no consulto"
          fi

          echo "===================== 4) CUENTAS con nombrecliente NULO (la card sin nombre) ====================="
          curl -s -H "$H" -H "$A" \
            "$URL/api/data/v9.2/sanic_cm_tbl_cuentas?\$filter=sanic_cm_ct_nombrecliente%20eq%20null&\$count=true&\$top=1" \
            | jq '{cuentas_sin_nombrecliente:.["@odata.count"]}'
          curl -s -H "$H" -H "$A" \
            "$URL/api/data/v9.2/sanic_cm_tbl_cuentas?\$filter=sanic_cm_ct_cifcliente%20eq%20null&\$count=true&\$top=1" \
            | jq '{cuentas_sin_cifcliente:.["@odata.count"]}'

          echo "===================== 5) DIRECCION: total y cuántos CIF distintos ====================="
          curl -s -H "$H" -H "$A" "$URL/api/data/v9.2/sanic_cm_tbl_direccions?\$count=true&\$top=1" | jq '{total_direcciones:.["@odata.count"]}'
