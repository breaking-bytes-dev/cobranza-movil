name: sup-build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - name: supervisor vista+form+rol
        env:
          CID: ${{ secrets.PP_CLIENT_ID }}
          SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT: ${{ secrets.PP_TENANT_ID }}
          URL: ${{ secrets.DATAVERSE_URL }}
        run: |
          set +e
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token" -d "client_id=$CID" -d "client_secret=$SECRET" -d "grant_type=client_credentials" -d "scope=$URL/.default" | jq -r .access_token)
          API="$URL/api/data/v9.2"; H_AUTH="Authorization: Bearer $TOKEN"; A="Accept: application/json"; JSON="Content-Type: application/json"
          SOL="MSCRM.SolutionUniqueName: cm_core_cobranzamovil"; E='sanic_cm_tbl_asignacion'
          g(){ curl -s -H "$H_AUTH" -H "$A" "$API/$1"; }
          OTC=$(g "EntityDefinitions(LogicalName='$E')?\$select=ObjectTypeCode" | jq -r '.ObjectTypeCode')

          echo "===== 1) Vista 'Aprobaciones pendientes' ====="
          FETCH='<fetch version="1.0" mapping="logical" distinct="true"><entity name="sanic_cm_tbl_asignacion"><attribute name="sanic_cm_as_numero" /><attribute name="sanic_cm_as_cuentaid" /><attribute name="sanic_cm_as_solicitadopor" /><attribute name="sanic_cm_as_fechasignacion" /><attribute name="sanic_cm_as_motivo" /><attribute name="sanic_cm_tbl_asignacionid" /><order attribute="sanic_cm_as_fechasignacion" descending="false" /><filter type="and"><condition attribute="sanic_cm_as_tipo" operator="eq" value="3" /><condition attribute="sanic_cm_as_estadoaprobacion" operator="eq" value="2" /></filter></entity></fetch>'
          LAYOUT=$(printf '<grid name="resultset" object="%s" jump="sanic_cm_as_numero" select="1" icon="1" preview="1"><row name="result" id="sanic_cm_tbl_asignacionid"><cell name="sanic_cm_as_numero" width="110" /><cell name="sanic_cm_as_cuentaid" width="150" /><cell name="sanic_cm_as_solicitadopor" width="150" /><cell name="sanic_cm_as_fechasignacion" width="140" /><cell name="sanic_cm_as_motivo" width="260" /></row></grid>' "$OTC")
          jq -n --arg n "Especiales · Aprobaciones pendientes" --arg f "$FETCH" --arg l "$LAYOUT" '{name:$n, returnedtypecode:"sanic_cm_tbl_asignacion", fetchxml:$f, layoutxml:$l, querytype:0, description:"Especiales pendientes de aprobacion (Supervisor)"}' > /tmp/v.json
          code=$(curl -s -o /tmp/rv.txt -w "%{http_code}" -X POST "$API/savedqueries" -H "$H_AUTH" -H "$JSON" -H "$A" -H "$SOL" --data @/tmp/v.json)
          echo "  vista HTTP $code"; [ "$code" -ge 300 ] && cat /tmp/rv.txt

          echo "===== 2) Form 'CM | Aprobación de Especial' ====="
          EX=$(g "systemforms?\$filter=objecttypecode%20eq%20'$E'%20and%20name%20eq%20'CM%20%7C%20Aprobaci%C3%B3n%20de%20Especial'&\$select=formid" | jq -r '.value[0].formid // empty')
          [ -n "$EX" ] && curl -s -o /dev/null -X DELETE "$API/systemforms($EX)" -H "$H_AUTH" -H "$A"
          MEMO='{E0DECE4B-6FC8-4a8f-A065-082708572369}'; LOOKUP='{270BD3DB-D9AF-4782-9025-509E298DEC0A}'; PICK='{3EF39988-22BB-4f0b-BBBE-64B5A3748AEE}'; DATE='{5B773807-9FB2-42db-97C3-7A91EFF8ADFF}'
          uid(){ echo "{$(uuidgen)}"; }
          row(){ printf '<row><cell id="%s"><labels><label description="%s" languagecode="1033" /></labels><control id="%s" classid="%s" datafieldname="%s" disabled="%s" /></cell></row>' "$(uid)" "$3" "$1" "$2" "$1" "$4"; }
          section(){ printf '<section name="%s" showlabel="true" showbar="false" id="%s" columns="11" labelwidth="150" celllabelalignment="Left" celllabelposition="Left"><labels><label description="%s" languagecode="1033" /></labels><rows>%s</rows></section>' "$1" "$(uid)" "$2" "$3"; }
          REV="$(row sanic_cm_as_cuentaid "$LOOKUP" 'Producto / Cuenta' true)$(row sanic_cm_as_solicitadopor "$LOOKUP" 'Solicitado por' true)$(row sanic_cm_as_fechasignacion "$DATE" 'Fecha de solicitud' true)$(row sanic_cm_as_motivo "$MEMO" 'Motivo de la solicitud' true)"
          DEC="$(row sanic_cm_as_agenteid "$LOOKUP" 'Asignar localizador' false)$(row sanic_cm_as_motivorechazo "$MEMO" 'Motivo de rechazo (si rechaza)' false)"
          EST="$(row sanic_cm_as_estadoaprobacion "$PICK" 'Estado de aprobación' true)$(row sanic_cm_as_resolutorid "$LOOKUP" 'Resuelto por' true)"
          SECTIONS="$(section sec_rev 'Solicitud a revisar' "$REV")$(section sec_dec 'Decisión del supervisor' "$DEC")$(section sec_est 'Estado' "$EST")"
          FX="$(printf '<form><tabs><tab name="tab_apr" verticallayout="true" id="%s" IsUserDefined="0" locklevel="0" showlabel="true" expanded="true"><labels><label description="Aprobación de Especial" languagecode="1033" /></labels><columns><column width="100%%"><sections>%s</sections></column></columns></tab></tabs></form>' "$(uid)" "$SECTIONS")"
          jq -n --arg n "CM | Aprobación de Especial" --arg fx "$FX" '{name:$n, description:"Formulario del Supervisor para aprobar/rechazar", type:2, objecttypecode:"sanic_cm_tbl_asignacion", formxml:$fx, formactivationstate:1, isdefault:false}' > /tmp/form.json
          code=$(curl -s -o /tmp/rf.txt -w "%{http_code}" -X POST "$API/systemforms" -H "$H_AUTH" -H "$JSON" -H "$A" -H "$SOL" --data @/tmp/form.json)
          echo "  form HTTP $code"; [ "$code" -ge 300 ] && cat /tmp/rf.txt
          curl -s -o /dev/null -w "  Publish HTTP %{http_code}\n" -X POST "$API/PublishAllXml" -H "$H_AUTH" -H "$JSON" -H "$A" -d '{}'

          echo "===== 3) AUDIT rol Supervisor ====="
          RID='0ed5c9cb-fd76-f111-ab0e-70a8a5b226fd'
          g "RetrieveRolePrivilegesRole(RoleId=$RID)" | jq -r '.RolePrivileges[]? | .PrivilegeId' | sort > /tmp/rp.txt
          g "privileges?\$select=name,privilegeid&\$filter=contains(name,'sanic_cm_tbl_')" | jq -r '.value[] | .privilegeid + " " + .name' | sort > /tmp/pn.txt
          join /tmp/rp.txt /tmp/pn.txt 2>/dev/null | awk '{n=$2; sub(/^prv/,"",n); match(n,/sanic_cm_tbl_[a-z]+/); tbl=substr(n,RSTART,RLENGTH); act=substr(n,1,RSTART-1); printf "%s|%s\n", tbl, act}' | sort | awk -F'|' '{a[$1]=a[$1]" "$2} END {for(t in a) printf "  %-26s :%s\n", t, a[t]}' | sort

          echo "===== verificación ====="
          g "savedqueries?\$filter=name%20eq%20'Especiales%20%C2%B7%20Aprobaciones%20pendientes'&\$select=name" | jq -r '.value[]? | "  vista OK: " + .name'
          g "systemforms?\$filter=objecttypecode%20eq%20'$E'%20and%20name%20eq%20'CM%20%7C%20Aprobaci%C3%B3n%20de%20Especial'&\$select=name" | jq -r '.value[]? | "  form OK: " + .name'
