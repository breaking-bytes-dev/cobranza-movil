name: rol2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - name: ReplacePrivilegesRole sin Create/Write cliente-cuenta
        env:
          CID: ${{ secrets.PP_CLIENT_ID }}
          SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT: ${{ secrets.PP_TENANT_ID }}
          URL: ${{ secrets.DATAVERSE_URL }}
        run: |
          set +e
          URL="${URL%/}"
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token" -d "client_id=$CID" -d "client_secret=$SECRET" -d "grant_type=client_credentials" -d "scope=$URL/.default" | jq -r .access_token)
          API="$URL/api/data/v9.2"; H="Authorization: Bearer $TOKEN"; A="Accept: application/json"; J="Content-Type: application/json"
          g(){ curl -s -H "$H" -H "$A" "$API/$1"; }
          RID='d9f0f107-fd76-f111-ab0e-70a8a5b226fd'
          echo "=== IDs de los 8 privilegios a sacar ==="
          : > /tmp/targets.txt
          for t in cliente cuenta direccion telefono; do for a in Create Write; do
            p=$(g "privileges?\$select=privilegeid&\$filter=name%20eq%20'prv${a}sanic_cm_tbl_$t'" | jq -r '.value[0].privilegeid // empty')
            [ -n "$p" ] && echo "$p" >> /tmp/targets.txt && echo "  prv${a}sanic_cm_tbl_$t = $p"
          done; done
          TARGETS=$(jq -R . /tmp/targets.txt | jq -s .)
          echo "=== construir set nuevo (todo menos esos 8) ==="
          g "RetrieveRolePrivilegesRole(RoleId=$RID)" | jq --argjson tg "$TARGETS" '{Privileges: [.RolePrivileges[] | select((.PrivilegeId as $p | $tg|index($p))|not) | {PrivilegeId, Depth}]}' > /tmp/repl.json
          echo "  privilegios que quedan: $(jq '.Privileges|length' /tmp/repl.json) (antes eran $(g "RetrieveRolePrivilegesRole(RoleId=$RID)" | jq '.RolePrivileges|length'))"
          echo "=== ReplacePrivilegesRole ==="
          code=$(curl -s -o /tmp/r.txt -w "%{http_code}" -X POST "$API/roles($RID)/Microsoft.Dynamics.CRM.ReplacePrivilegesRole" -H "$H" -H "$J" -H "$A" --data @/tmp/repl.json)
          echo "  HTTP $code"; [ "$code" -ge 300 ] && grep -o '"message":"[^"]*"' /tmp/r.txt | head -1
          echo "=== verificación: Solicitante en cliente/cuenta/direccion/telefono ==="
          g "RetrieveRolePrivilegesRole(RoleId=$RID)" | jq -r '.RolePrivileges[]? | .PrivilegeId' | sort > /tmp/rp.txt
          g "privileges?\$select=name,privilegeid&\$filter=contains(name,'sanic_cm_tbl_cliente')%20or%20contains(name,'sanic_cm_tbl_cuenta')%20or%20contains(name,'sanic_cm_tbl_direccion')%20or%20contains(name,'sanic_cm_tbl_telefono')" | jq -r '.value[] | .privilegeid + " " + .name' | sort > /tmp/pn.txt
          join /tmp/rp.txt /tmp/pn.txt 2>/dev/null | awk '{n=$2; sub(/^prv/,"",n); match(n,/sanic_cm_tbl_[a-z]+/); tbl=substr(n,RSTART,RLENGTH); a=substr(n,1,RSTART-1); printf "%s|%s\n",tbl,a}' | sort | awk -F'|' '{x[$1]=x[$1]" "$2} END {for(t in x) printf "  %-26s :%s\n",t,x[t]}' | sort
