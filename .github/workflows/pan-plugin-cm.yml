name: pan-plugin-cm

# Fase 2 PAN/PCI · paso 5: compila y prueba el ensamblado Sanic.CobranzaMovil.Plugins y, SOLO si
# `registrar` es true, lo registra en DEV (ensamblado + pasos, idempotente, dentro de la solucion).
#
# Manual: Actions -> pan-plugin-cm -> Run workflow.
#   registrar            false (defecto): solo compila y corre las pruebas. No toca Dataverse.
#   activar_panguard     true: ademas ACTIVA los pasos PanGuard. Hacerlo SOLO en el paso 8 del plan
#                        (docs/auditoria/fase2-pan-diseno.md §4), cuando la carga ya enmascara el PAN.
#   desactivar_panguard  true: los desactiva (rollback). Excluyente con activar_panguard.
#   Sin ninguno de los dos, los pasos PanGuard NUEVOS se crean desactivados y los existentes conservan su estado.
#
# Secrets (los mismos que solution-release / diag-*): DATAVERSE_URL, PP_CLIENT_ID, PP_CLIENT_SECRET, PP_TENANT_ID.
# Secret adicional SOLO para registrar: PLUGIN_SNK_BASE64 = clave de nombre seguro (.snk) en base64.
#   Dataverse exige que cada actualizacion del ensamblado use la MISMA clave: guardar el .snk en un gestor de secretos.
#   Ver plugins/Sanic.CobranzaMovil.Plugins/README.md.

on:
  # push a la rama: compila, prueba y deja la dll FIRMADA como artefacto (nunca registra). Sirve mientras el
  # workflow no este en main (workflow_dispatch solo se ve desde la rama por defecto): el registro se hace
  # en local con scripts/pan/paso5_plugins.py --dll <artefacto>.
  push:
    branches: [feat/pan-plugin-cm]
    paths: ['plugins/**', '.github/workflows/pan-plugin-cm.yml']
  workflow_dispatch:
    inputs:
      registrar:
        description: "Registrar/actualizar el ensamblado y los pasos en DEV (si es false, solo compila y prueba)"
        type: boolean
        default: false
      activar_panguard:
        description: "Activar los pasos PanGuard (SOLO en el paso 8 del plan de migracion)"
        type: boolean
        default: false
      desactivar_panguard:
        description: "Desactivar los pasos PanGuard (rollback)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pan-plugin-cm
  cancel-in-progress: false

env:
  SOLUCION: cm_core_cobranzamovil
  DLL: Sanic.CobranzaMovil.Plugins.dll

jobs:
  construir-y-probar:
    # Windows: las pruebas corren en net462 (el mismo runtime que el sandbox de Dataverse).
    runs-on: windows-latest
    outputs:
      version: ${{ steps.firmado.outputs.version }}
      token: ${{ steps.firmado.outputs.token }}
    steps:
      - name: Validar combinacion de inputs
        shell: pwsh
        run: |
          $registrar = '${{ inputs.registrar }}' -eq 'true'
          $activar = '${{ inputs.activar_panguard }}' -eq 'true'
          $desactivar = '${{ inputs.desactivar_panguard }}' -eq 'true'
          if ($activar -and $desactivar) { throw 'activar_panguard y desactivar_panguard son excluyentes.' }
          if (($activar -or $desactivar) -and -not $registrar) { throw 'activar/desactivar_panguard requieren registrar=true.' }

      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Pruebas (net462, sin firmar)
        shell: pwsh
        run: >
          dotnet test plugins/Sanic.CobranzaMovil.Plugins.Tests/Sanic.CobranzaMovil.Plugins.Tests.csproj
          -c Release --logger "trx;LogFileName=resultados.trx" --results-directory out/pruebas

      - name: Resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: out/pruebas
          if-no-files-found: ignore

      - name: Compilar firmado (para registrar, o en push para dejar el artefacto)
        id: firmado
        if: ${{ inputs.registrar || github.event_name == 'push' }}
        shell: pwsh
        env:
          SNK_B64: ${{ secrets.PLUGIN_SNK_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SNK_B64)) {
            throw 'Falta el secret PLUGIN_SNK_BASE64 (clave .snk en base64). Sin ella no se puede registrar.'
          }
          $snk = Join-Path $env:RUNNER_TEMP 'plugins.snk'
          [IO.File]::WriteAllBytes($snk, [Convert]::FromBase64String($env:SNK_B64))
          dotnet build plugins/Sanic.CobranzaMovil.Plugins/Sanic.CobranzaMovil.Plugins.csproj `
            -c Release --no-incremental "-p:AssemblyOriginatorKeyFile=$snk" -o out/dll
          if ($LASTEXITCODE -ne 0) { throw 'Fallo la compilacion firmada.' }
          Remove-Item $snk -Force

          $ruta = Join-Path (Get-Location) "out/dll/$env:DLL"
          $an = [System.Reflection.AssemblyName]::GetAssemblyName($ruta)
          $token = ($an.GetPublicKeyToken() | ForEach-Object { $_.ToString('x2') }) -join ''
          if ($token.Length -ne 16) { throw 'El ensamblado no quedo firmado (sin PublicKeyToken).' }
          Write-Host "Ensamblado: $($an.Name) $($an.Version)  PublicKeyToken=$token"
          "version=$($an.Version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "token=$token" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Subir la dll firmada
        if: ${{ inputs.registrar || github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: plugin-dll
          path: out/dll/${{ env.DLL }}
          if-no-files-found: error

  registrar:
    if: ${{ inputs.registrar }}
    needs: construir-y-probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: plugin-dll
          path: dll

      - name: Registrar ensamblado y pasos en DEV (idempotente)
        env:
          DATAVERSE_URL: ${{ secrets.DATAVERSE_URL }}
          PP_CLIENT_ID: ${{ secrets.PP_CLIENT_ID }}
          PP_CLIENT_SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          PP_TENANT_ID: ${{ secrets.PP_TENANT_ID }}
          VERSION: ${{ needs.construir-y-probar.outputs.version }}
          TOKEN_CLAVE: ${{ needs.construir-y-probar.outputs.token }}
          ACTIVAR: ${{ inputs.activar_panguard }}
          DESACTIVAR: ${{ inputs.desactivar_panguard }}
        run: |
          set -euo pipefail
          args=(--dll "dll/$DLL" --version "$VERSION" --public-key-token "$TOKEN_CLAVE" --solucion "$SOLUCION" --aplicar)
          if [ "$ACTIVAR" = "true" ]; then args+=(--activar-panguard); fi
          if [ "$DESACTIVAR" = "true" ]; then args+=(--desactivar-panguard); fi
          python3 scripts/pan/paso5_plugins.py "${args[@]}"
