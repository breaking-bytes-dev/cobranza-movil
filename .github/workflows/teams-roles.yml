name: teams-roles
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: asignar roles + owner (URL fix)
        env:
          CID: ${{ secrets.PP_CLIENT_ID }}
          SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT: ${{ secrets.PP_TENANT_ID }}
          URL: ${{ secrets.DATAVERSE_URL }}
        run: |
          set +e
          URL="${URL%/}"   # <- fix: sin trailing slash
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token" -d "client_id=$CID" -d "client_secret=$SECRET" -d "grant_type=client_credentials" -d "scope=$URL/.default" | jq -r .access_token)
          API="$URL/api/data/v9.2"; H="Authorization: Bearer $TOKEN"; A="Accept: application/json"; J="Content-Type: application/json"
          g(){ curl -s -H "$H" -H "$A" "$API/$1"; }
          LOCT=7b0f4531-a38a-f111-8076-70a8a59c703e; BOT=7e0f4531-a38a-f111-8076-70a8a59c703e
          SOLT=810f4531-a38a-f111-8076-70a8a59c703e; SUPT=840f4531-a38a-f111-8076-70a8a59c703e; ACT=870f4531-a38a-f111-8076-70a8a59c703e
          LOC=c1736ff3-fb76-f111-ab0e-70a8a5b226fd; BO=e56809a5-fc76-f111-ab0e-70a8a5b226fd
          SOL=d9f0f107-fd76-f111-ab0e-70a8a5b226fd; SUP=0ed5c9cb-fd76-f111-ab0e-70a8a5b226fd; ADM=b2884281-f573-f111-ab0e-000d3a3483e7
          OPER=8c46a8d4-808a-f111-8076-70a8a59c703e; TPL=dcb61b79-e66d-f111-ab0e-0022480a5be8
          addrole(){ # team role
            local code=$(curl -s -o /tmp/r.txt -w "%{http_code}" -X POST "$API/teams($1)/teamroles_association/\$ref" -H "$H" -H "$J" -H "$A" --data "{\"@odata.id\":\"$API/roles($2)\"}")
            printf "  team %s + role %s -> HTTP %s\n" "${1:0:8}" "${2:0:8}" "$code"; [ "$code" -ge 300 ] && grep -o '"message":"[^"]*"' /tmp/r.txt | head -1
          }
          echo "=== asignar roles ==="
          addrole "$LOCT" "$LOC"; addrole "$BOT" "$BO"; addrole "$SOLT" "$SOL"; addrole "$SUPT" "$SUP"
          addrole "$ACT" "$ADM"; addrole "$ACT" "$OPER"
          echo "=== owner template -> Admin y Carga ==="
          code=$(curl -s -o /tmp/r2.txt -w "%{http_code}" -X PATCH "$API/sanic_tbl_smlt_importtemplates($TPL)" -H "$H" -H "$J" -H "$A" --data "{\"ownerid@odata.bind\":\"/teams($ACT)\"}")
          echo "  PATCH owner HTTP $code"; [ "$code" -ge 300 ] && grep -o '"message":"[^"]*"' /tmp/r2.txt | head -1
          echo "=== VERIFICACIÓN ==="
          for t in "$LOCT" "$BOT" "$SOLT" "$SUPT" "$ACT"; do
            g "teams($t)?\$select=name&\$expand=teamroles_association(\$select=name)" | jq -r '"  \(.name): " + ([.teamroles_association[]?.name]|join(", "))'
          done
          g "sanic_tbl_smlt_importtemplates($TPL)?\$select=sanic_smlt_it_name,_ownerid_value" -H "Prefer: odata.include-annotations=\"*\"" | jq -r '"  template \"\(.sanic_smlt_it_name)\" owner = \(.["_ownerid_value@OData.Community.Display.V1.FormattedValue"])"'
