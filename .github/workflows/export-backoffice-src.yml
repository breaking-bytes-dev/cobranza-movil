name: export-backoffice-src

# Baja la canvas app del backoffice (cascarón del usuario), la desempaqueta (pac canvas unpack)
# y commitea el fuente a apps/backoffice-canvas/ en deploy/rediseno-tokens.
# Es el "pull" del ciclo de pegue del paso 5.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: export-backoffice-src
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/rediseno-tokens
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Instalar Power Platform CLI
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Localizar la app y meterla a la solución (AddSolutionComponent)
        id: app
        env:
          CID: ${{ secrets.PP_CLIENT_ID }}
          SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT: ${{ secrets.PP_TENANT_ID }}
          URL: ${{ secrets.DATAVERSE_URL }}
        run: |
          set -e
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token" \
            -d "client_id=$CID" -d "client_secret=$SECRET" -d "grant_type=client_credentials" -d "scope=$URL/.default" | jq -r .access_token)
          H="Authorization: Bearer $TOKEN"
          curl -s -H "$H" -H "Accept: application/json" \
            "$URL/api/data/v9.2/canvasapps?\$select=canvasappid,name,displayname&\$filter=contains(displayname,'Backoffice')" \
            | jq -r '.value[] | "\(.canvasappid)\t\(.name)\t\(.displayname)"' | tee /tmp/apps.txt
          LINE=$(grep -iv 'commandlibrary' /tmp/apps.txt | head -1)
          if [ -z "$LINE" ]; then echo "ERROR: no encontré la canvas del backoffice"; exit 1; fi
          APPID=$(echo "$LINE" | cut -f1); LOGICAL=$(echo "$LINE" | cut -f2)
          echo "logical=$LOGICAL" >> "$GITHUB_OUTPUT"
          echo "App: $LOGICAL ($APPID)"
          # Meterla a la solución (idempotente: si ya está, el error se tolera)
          CODE=$(curl -s -o /tmp/add.out -w "%{http_code}" -X POST -H "$H" -H "Content-Type: application/json" \
            "$URL/api/data/v9.2/AddSolutionComponent" \
            -d "{\"ComponentType\": 300, \"ComponentId\": \"$APPID\", \"SolutionUniqueName\": \"cm_core_cobranzamovil\", \"AddRequiredComponents\": false}")
          echo "AddSolutionComponent HTTP $CODE"; [ "$CODE" = "200" ] || [ "$CODE" = "204" ] || cat /tmp/add.out
      - name: Autenticar pac
        run: |
          pac auth create \
            --applicationId "${{ secrets.PP_CLIENT_ID }}" \
            --clientSecret "${{ secrets.PP_CLIENT_SECRET }}" \
            --tenant "${{ secrets.PP_TENANT_ID }}" \
            --environment "${{ secrets.DATAVERSE_URL }}" \
            --accept-cleartext-caching
      - name: Exportar solución y desempaquetar el msapp
        run: |
          set -e
          pac solution export --name cm_core_cobranzamovil --path /tmp/sol.zip --managed false --overwrite
          unzip -o /tmp/sol.zip 'CanvasApps/*' -d /tmp/sol >/dev/null
          echo "--- msapps en la solución:"; ls /tmp/sol/CanvasApps/ | grep msapp || true
          MSAPP=$(ls /tmp/sol/CanvasApps/ | grep -i backoffice | grep -iv commandlibrary | grep '_DocumentUri.msapp' | head -1)
          if [ -z "$MSAPP" ]; then echo "ERROR: el msapp del backoffice no está en el export"; exit 1; fi
          echo "msapp: $MSAPP"
          rm -rf apps/backoffice-canvas
          pac canvas unpack --msapp "/tmp/sol/CanvasApps/$MSAPP" --sources apps/backoffice-canvas --layout SourceCode
          find apps/backoffice-canvas -maxdepth 2 | sort | head -40
      - name: Commit del fuente
        run: |
          git config user.name "bitBreaker"
          git config user.email "randyekg@gmail.com"
          git add apps/backoffice-canvas
          git diff --cached --quiet && echo "sin cambios" || {
            git commit -m "feat(canvas): fuente del cascaron backoffice (export desde Dev)"
            git push origin deploy/rediseno-tokens
          }
