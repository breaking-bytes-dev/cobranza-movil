name: smlt-fix-cm
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - name: agregar column mappings faltantes
        env:
          CID: ${{ secrets.PP_CLIENT_ID }}
          SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT: ${{ secrets.PP_TENANT_ID }}
          URL: ${{ secrets.DATAVERSE_URL }}
        run: |
          set +e
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token" -d "client_id=$CID" -d "client_secret=$SECRET" -d "grant_type=client_credentials" -d "scope=$URL/.default" | jq -r .access_token)
          API="$URL/api/data/v9.2"; H_AUTH="Authorization: Bearer $TOKEN"; A="Accept: application/json"; JSON="Content-Type: application/json"; SOL="MSCRM.SolutionUniqueName: cm_core_cobranzamovil"
          g(){ curl -s -H "$H_AUTH" -H "$A" "$API/$1"; }
          TID='dcb61b79-e66d-f111-ab0e-0022480a5be8'
          tmid(){ g "sanic_tbl_smlt_tablemappings?\$filter=_sanic_smlt_tm_importtemplateid_value%20eq%20$TID%20and%20sanic_smlt_tm_name%20eq%20'$1'&\$select=sanic_tbl_smlt_tablemappingid" | jq -r '.value[0].sanic_tbl_smlt_tablemappingid'; }
          CTA=$(tmid Cuenta); CD=$(tmid 'Carga%20Diaria'); AS=$(tmid Asignacion)
          echo "TMIDs cuenta=$CTA cargadiaria=$CD asignacion=$AS"
          # addcm TMID SOURCE TARGET DATATYPE
          addcm(){
            jq -n --arg tm "$1" --arg s "$2" --arg t "$3" --argjson dt "$4" '{("sanic_smlt_cm_tablemappingid@odata.bind"):("/sanic_tbl_smlt_tablemappings("+$tm+")"), sanic_smlt_cm_name:$t, sanic_smlt_cm_sourcecolumn:$s, sanic_smlt_cm_targetcolumn:$t, sanic_smlt_cm_datatype:$dt}' > /tmp/cm.json
            local code=$(curl -s -o /tmp/r.txt -w "%{http_code}" -X POST "$API/sanic_tbl_smlt_columnmappings" -H "$H_AUTH" -H "$JSON" -H "$A" -H "$SOL" --data @/tmp/cm.json)
            printf "  %-45s HTTP %s\n" "$3 <- [$2]" "$code"; [ "$code" -ge 300 ] && head -c 200 /tmp/r.txt && echo
          }
          echo "=== CUENTA (denormalizadas para offline) ==="
          addcm "$CTA" CIF sanic_cm_ct_cifcliente 0
          addcm "$CTA" Cliente sanic_cm_ct_nombrecliente 0
          addcm "$CTA" TipoProducto sanic_cm_ct_tipoproducto 0
          addcm "$CTA" NombreFianza sanic_cm_ct_nombrefiador 0
          addcm "$CTA" DireccionFianza sanic_cm_ct_direccionfiador 0
          addcm "$CTA" Nota sanic_cm_ct_nota 0
          echo "=== CARGA DIARIA (snapshot montos/mora) ==="
          addcm "$CD" SaldoVencidoNIO sanic_cm_cd_saldovencidonio 2
          addcm "$CD" SaldoVencidoUSD sanic_cm_cd_saldovencidousd 2
          addcm "$CD" TotalSaldoVencido sanic_cm_cd_totalsaldovencido 2
          addcm "$CD" ContagiadoUSD sanic_cm_cd_contagiadousd 2
          addcm "$CD" PagoMinimoNIO sanic_cm_cd_pagominimonio 2
          addcm "$CD" PagoMinimoUSD sanic_cm_cd_pagominimousd 2
          addcm "$CD" RetiroNIO sanic_cm_cd_retironio 2
          addcm "$CD" RetiroUSD sanic_cm_cd_retirousd 2
          addcm "$CD" DiasMora sanic_cm_cd_diasmora 1
          addcm "$CD" NivelMora sanic_cm_cd_nivelmora 1
          echo "=== ASIGNACION (ultimacarga para reconciliacion DEC-018) ==="
          addcm "$AS" FechaCarga sanic_cm_as_ultimacarga 3
          echo "=== estado de asignacion: default actual ==="
          g "EntityDefinitions(LogicalName='sanic_cm_tbl_asignacion')/Attributes(LogicalName='sanic_cm_as_estado')/Microsoft.Dynamics.CRM.BooleanAttributeMetadata?\$select=DefaultValue" | jq -r '"  DefaultValue actual = \(.DefaultValue)"'
          echo "=== Relationship Mappings existentes (parent -> child) ==="
          g "sanic_tbl_smlt_relationshipmappings?\$filter=_sanic_smlt_rm_importtemplateid_value%20eq%20$TID&\$select=sanic_smlt_rm_name" | jq -r '.value[]? | "  \(.sanic_smlt_rm_name)"'
