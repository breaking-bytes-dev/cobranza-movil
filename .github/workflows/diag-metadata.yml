name: diag-metadata

# READ-ONLY: display names reales de columnas y choices para las guías de la canvas backoffice.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - name: Metadata
        env:
          CID: ${{ secrets.PP_CLIENT_ID }}
          SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT: ${{ secrets.PP_TENANT_ID }}
          URL: ${{ secrets.DATAVERSE_URL }}
        run: |
          set -e
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token" \
            -d "client_id=$CID" -d "client_secret=$SECRET" -d "grant_type=client_credentials" -d "scope=$URL/.default" | jq -r .access_token)
          H="Authorization: Bearer $TOKEN"; A="Accept: application/json"

          echo "===================== CHOICES GLOBALES ====================="
          for C in sanic_choice_cm_rolbackoffice; do
            curl -s -H "$H" -H "$A" \
              "$URL/api/data/v9.2/GlobalOptionSetDefinitions(Name='$C')" \
              | jq -r '"  \(.Name)  display=\"\(.DisplayName.UserLocalizedLabel.Label // "?")\"  " , (.Options[] | "     \(.Value) = \"\(.Label.UserLocalizedLabel.Label)\"")'
          done

          echo "===================== APPS CANVAS EN EL ENTORNO ====================="
          curl -s -H "$H" -H "$A" "$URL/api/data/v9.2/canvasapps?\$select=name,displayname&\$filter=contains(name,'sanic')" \
            | jq -r '.value[] | "  \(.name)  \"\(.displayname)\""'
