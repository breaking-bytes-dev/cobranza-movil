name: smlt-recon
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - name: recon smelter en Dev
        env:
          CID: ${{ secrets.PP_CLIENT_ID }}
          SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT: ${{ secrets.PP_TENANT_ID }}
          URL: ${{ secrets.DATAVERSE_URL }}
        run: |
          set +e
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token" -d "client_id=$CID" -d "client_secret=$SECRET" -d "grant_type=client_credentials" -d "scope=$URL/.default" | jq -r .access_token)
          API="$URL/api/data/v9.2"; H="Authorization: Bearer $TOKEN"; A="Accept: application/json"
          g(){ curl -s -H "$H" -H "$A" "$API/$1"; }
          echo "===== ¿solución Smelter instalada? ====="
          g "solutions?\$select=uniquename,friendlyname,version&\$filter=contains(uniquename,'smlt')%20or%20contains(uniquename,'smelter')" | jq -r '.value[]? | "  \(.friendlyname) (\(.uniquename)) v\(.version)"'
          echo "===== ¿tablas smelter existen? (metadata) ====="
          for t in sanic_tbl_smlt_importtemplate sanic_tbl_smlt_tablemapping sanic_tbl_smlt_importjob; do
            r=$(g "EntityDefinitions(LogicalName='$t')?\$select=LogicalName" | jq -r '.LogicalName // "NO existe"'); echo "  $t -> $r"
          done
          echo "===== ¿templates existentes? ====="
          g "sanic_tbl_smlt_importtemplates?\$select=sanic_smlt_it_name&\$top=20" | jq -r '.value[]? | "  template: \(.sanic_smlt_it_name)"' 2>/dev/null || echo "  (no pude leer / tabla ausente)"
          echo "===== roles Smelter + teams ====="
          g "roles?\$select=name&\$filter=contains(name,'Smelter')" | jq -r '.value[]? | "  rol: \(.name)"'
          g "teams?\$select=name&\$filter=contains(name,'Cobranza')%20or%20contains(name,'Smelter')" | jq -r '.value[]? | "  team: \(.name)"'
