name: diag-ownership
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnóstico de ownership de asignaciones
        env:
          DATAVERSE_URL: ${{ secrets.DATAVERSE_URL }}
          CLIENT_ID: ${{ secrets.PP_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT_ID: ${{ secrets.PP_TENANT_ID }}
        run: |
          set -uo pipefail
          URL="${DATAVERSE_URL%/}"
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/token" \
            --data-urlencode "grant_type=client_credentials" --data-urlencode "client_id=${CLIENT_ID}" \
            --data-urlencode "client_secret=${CLIENT_SECRET}" --data-urlencode "scope=${URL}/.default" | jq -r '.access_token // empty')
          [ -n "$TOKEN" ] || { echo "::error::No token"; exit 1; }
          AUTH="Authorization: Bearer $TOKEN"
          PREF="Prefer: odata.include-annotations=*"

          echo "== 1) Distribución de OWNER de las asignaciones =="
          curl -s "${URL}/api/data/v9.2/sanic_cm_tbl_asignacions?\$select=sanic_cm_tbl_asignacionid&\$expand=ownerid(\$select=fullname,domainname)&\$top=5000" \
            -H "$AUTH" -H "Prefer: odata.maxpagesize=5000" \
            | jq -r '.value | group_by(.ownerid.ownerid // .["_ownerid_value"] // "SIN OWNER") | map({owner: (.[0].ownerid.fullname // .[0].ownerid.domainname // "?"), count: length}) | sort_by(-.count)[] | "  \(.count) asignaciones  → owner: \(.owner)"' 2>/dev/null || echo "  (revisar formato de ownerid)"

          echo ""
          echo "== 2) Total asignaciones =="
          curl -s "${URL}/api/data/v9.2/sanic_cm_tbl_asignacions?\$count=true&\$top=1" -H "$AUTH" | jq -r '"  total: " + (."@odata.count"|tostring)'

          echo ""
          echo "== 3) Agentes y su usuario vinculado (sanic_cm_ag_usuarioid) =="
          curl -s "${URL}/api/data/v9.2/sanic_cm_tbl_agentes?\$select=sanic_cm_ag_nombre,sanic_cm_ag_emailusuario,_sanic_cm_ag_usuarioid_value&\$top=20" \
            -H "$AUTH" -H "$PREF" \
            | jq -r '.value[] | "  agente: \(.sanic_cm_ag_nombre // "?")  | usuario vinculado: \(.["_sanic_cm_ag_usuarioid_value@OData.Community.Display.V1.FormattedValue"] // "❌ SIN VINCULAR")  | email: \(.sanic_cm_ag_emailusuario // "vacío")"'

          echo ""
          echo "== 4) sanic_cm_as_agenteid seteado en asignaciones? (primeras 5) =="
          curl -s "${URL}/api/data/v9.2/sanic_cm_tbl_asignacions?\$select=sanic_cm_as_numerocuenta&\$expand=sanic_cm_as_agenteid(\$select=sanic_cm_ag_nombre)&\$top=5" \
            -H "$AUTH" \
            | jq -r '.value[] | "  cuenta \(.sanic_cm_as_numerocuenta // "?") → agente: \(.sanic_cm_as_agenteid.sanic_cm_ag_nombre // "❌ SIN AGENTE")"'
