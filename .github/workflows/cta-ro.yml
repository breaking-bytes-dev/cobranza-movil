name: cta-ro
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - name: financieros de cuenta read-only
        env:
          CID: ${{ secrets.PP_CLIENT_ID }}
          SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT: ${{ secrets.PP_TENANT_ID }}
          URL: ${{ secrets.DATAVERSE_URL }}
        run: |
          set +e
          URL="${URL%/}"
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token" -d "client_id=$CID" -d "client_secret=$SECRET" -d "grant_type=client_credentials" -d "scope=$URL/.default" | jq -r .access_token)
          API="$URL/api/data/v9.2"; H="Authorization: Bearer $TOKEN"; A="Accept: application/json"; J="Content-Type: application/json"; SOL="MSCRM.SolutionUniqueName: cm_core_cobranzamovil"
          g(){ curl -s -H "$H" -H "$A" "$API/$1"; }
          FID=$(g "systemforms?\$filter=objecttypecode%20eq%20'sanic_cm_tbl_cuenta'%20and%20type%20eq%202&\$select=formid" | jq -r '.value[0].formid')
          FX=$(g "systemforms($FID)?\$select=formxml" | jq -r '.formxml')
          # financieros/core-sourced -> read-only
          for f in sanic_cm_ct_retironio sanic_cm_ct_retirousd sanic_cm_ct_saldovencidonio sanic_cm_ct_saldovencidousd sanic_cm_ct_diasmora sanic_cm_ct_nivelmora sanic_cm_ct_tipoproducto; do
            FX=$(echo "$FX" | sed "s#datafieldname=\"$f\" disabled=\"false\"#datafieldname=\"$f\" disabled=\"true\"#")
          done
          jq -n --arg fx "$FX" '{formxml:$fx}' > /tmp/f.json
          code=$(curl -s -o /tmp/r.txt -w "%{http_code}" -X PATCH "$API/systemforms($FID)" -H "$H" -H "$J" -H "$A" -H "$SOL" --data @/tmp/f.json)
          echo "  PATCH HTTP $code"; [ "$code" -ge 300 ] && head -c 200 /tmp/r.txt
          curl -s -o /dev/null -w "  Publish HTTP %{http_code}\n" -X POST "$API/PublishAllXml" -H "$H" -H "$J" -H "$A" -d '{}'
          echo "  -- estado de campos de cuenta --"
          g "systemforms($FID)?\$select=formxml" | jq -r '.formxml' | grep -oE 'datafieldname="sanic_cm_ct_[a-z]+" disabled="[^"]*"' | sort -u
