name: wf-recon
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - name: recon workflows
        env:
          CID: ${{ secrets.PP_CLIENT_ID }}
          SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT: ${{ secrets.PP_TENANT_ID }}
          URL: ${{ secrets.DATAVERSE_URL }}
        run: |
          set +e
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token" -d "client_id=$CID" -d "client_secret=$SECRET" -d "grant_type=client_credentials" -d "scope=$URL/.default" | jq -r .access_token)
          API="$URL/api/data/v9.2"; H="Authorization: Bearer $TOKEN"; A="Accept: application/json"
          g(){ curl -s -H "$H" -H "$A" "$API/$1"; }
          echo "===== workflows CLÁSICOS (category=0, type=1 definición) ====="
          g "workflows?\$filter=category%20eq%200%20and%20type%20eq%201&\$select=name,mode,scope,primaryentity,statecode,workflowid&\$orderby=name" | jq -r '.value[]? | "  \(.name) | entity=\(.primaryentity) mode=\(.mode) scope=\(.scope) state=\(.statecode)"'
          echo "===== ¿hay alguno en interaccion o simple para molde? (dump xaml del 1ro) ====="
          WF=$(g "workflows?\$filter=category%20eq%200%20and%20type%20eq%201&\$select=name,xaml&\$top=1")
          echo "$WF" | jq -r '.value[0].name // "  (no hay workflows clásicos)"'
          echo "----- XAML (primeros 4000 chars) -----"
          echo "$WF" | jq -r '.value[0].xaml // ""' | head -c 4000
          echo ""
          echo "===== valores del optionset estadograbacion ====="
          OSID=$(g "GlobalOptionSetDefinitions(Name='sanic_cm_choice_estadograbacioninteraccion')" | jq -r '.Options[] | "  \(.Value) = \(.Label.LocalizedLabels[0].Label)"')
          echo "$OSID"
