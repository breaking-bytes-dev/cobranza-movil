name: gov
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g:
    runs-on: ubuntu-latest
    steps:
      - name: Write User + auditoria
        env:
          CID: ${{ secrets.PP_CLIENT_ID }}
          SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT: ${{ secrets.PP_TENANT_ID }}
          URL: ${{ secrets.DATAVERSE_URL }}
        run: |
          set +e
          URL="${URL%/}"
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/$TENANT/oauth2/v2.0/token" -d "client_id=$CID" -d "client_secret=$SECRET" -d "grant_type=client_credentials" -d "scope=$URL/.default" | jq -r .access_token)
          API="$URL/api/data/v9.2"; H="Authorization: Bearer $TOKEN"; A="Accept: application/json"; J="Content-Type: application/json"; SOL="MSCRM.SolutionUniqueName: cm_core_cobranzamovil"
          g(){ curl -s -H "$H" -H "$A" "$API/$1"; }
          RID='d9f0f107-fd76-f111-ab0e-70a8a5b226fd'
          echo "=== bajar Write de Org->User (Basic) en cliente/cuenta/direccion/telefono ==="
          for t in cliente cuenta direccion telefono; do
            PID=$(g "privileges?\$select=privilegeid&\$filter=name%20eq%20'prvWritesanic_cm_tbl_$t'" | jq -r '.value[0].privilegeid')
            curl -s -o /dev/null -w "  $t: remove HTTP %{http_code}" -X POST "$API/roles($RID)/Microsoft.Dynamics.CRM.RemovePrivilegeRole" -H "$H" -H "$J" -H "$A" --data "{\"PrivilegeId\":\"$PID\"}"
            code=$(curl -s -o /tmp/r.txt -w "%{http_code}" -X POST "$API/roles($RID)/Microsoft.Dynamics.CRM.AddPrivilegesRole" -H "$H" -H "$J" -H "$A" --data "{\"Privileges\":[{\"PrivilegeId\":\"$PID\",\"Depth\":\"Basic\"}]}")
            echo "  · add Basic HTTP $code"; [ "$code" -ge 300 ] && head -c 200 /tmp/r.txt
          done
          echo "=== verificar depth de Write ahora ==="
          g "RetrieveRolePrivilegesRole(RoleId=$RID)" | jq -r '.RolePrivileges[]? | .PrivilegeId + " " + (.Depth|tostring)' | sort > /tmp/rp.txt
          g "privileges?\$select=name,privilegeid&\$filter=contains(name,'Write')%20and%20(contains(name,'cliente')%20or%20contains(name,'cuenta')%20or%20contains(name,'direccion')%20or%20contains(name,'telefono'))" | jq -r '.value[] | .privilegeid + " " + .name' | sort > /tmp/pn.txt
          join /tmp/rp.txt /tmp/pn.txt 2>/dev/null | awk '{printf "  %s depth=%s\n",$3,$2}'
          echo "=== activar auditoria por tabla ==="
          for e in sanic_cm_tbl_cliente sanic_cm_tbl_cuenta sanic_cm_tbl_direccion sanic_cm_tbl_telefono; do
            code=$(curl -s -o /tmp/a.txt -w "%{http_code}" -X PUT "$API/EntityDefinitions(LogicalName='$e')" -H "$H" -H "$J" -H "$A" -H "$SOL" -H "MSCRM.MergeLabels: true" --data "$(g "EntityDefinitions(LogicalName='$e')" | jq '.IsAuditEnabled.Value=true | {"@odata.type":"Microsoft.Dynamics.CRM.EntityMetadata", MetadataId, LogicalName, IsAuditEnabled}')")
            echo "  $e audit PUT HTTP $code"; [ "$code" -ge 300 ] && head -c 160 /tmp/a.txt && echo
          done
          curl -s -o /dev/null -w "  PublishAllXml HTTP %{http_code}\n" -X POST "$API/PublishAllXml" -H "$H" -H "$J" -H "$A" -d '{}'
          echo "=== verificar audit ==="
          for e in sanic_cm_tbl_cliente sanic_cm_tbl_cuenta; do g "EntityDefinitions(LogicalName='$e')?\$select=LogicalName,IsAuditEnabled" | jq -r '"  \(.LogicalName) audit=\(.IsAuditEnabled.Value)"'; done
