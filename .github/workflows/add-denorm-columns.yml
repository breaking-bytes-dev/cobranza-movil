name: add-denorm-columns

# ONE-SHOT: 5 columnas denormalizadas en sanic_cm_tbl_cuenta (para que la app offline no navegue
# relaciones). Smelter las llena del CSV. Manual: Actions → add-denorm-columns → Run. Borrable tras aplicar.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  add-columns:
    runs-on: ubuntu-latest
    steps:
      - name: Crear columnas denormalizadas (Web API)
        env:
          DATAVERSE_URL: ${{ secrets.DATAVERSE_URL }}
          CLIENT_ID: ${{ secrets.PP_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          TENANT_ID: ${{ secrets.PP_TENANT_ID }}
        run: |
          set -uo pipefail
          URL="${DATAVERSE_URL%/}"; SOL="cm_core_cobranzamovil"; ENT="sanic_cm_tbl_cuenta"
          TOKEN=$(curl -s -X POST "https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/token" \
            --data-urlencode "grant_type=client_credentials" --data-urlencode "client_id=${CLIENT_ID}" \
            --data-urlencode "client_secret=${CLIENT_SECRET}" --data-urlencode "scope=${URL}/.default" | jq -r '.access_token // empty')
          [ -n "$TOKEN" ] || { echo "::error::No token"; exit 1; }
          echo "Token OK."
          str() { jq -nc --arg sn "$1" --arg dn "$2" '{"@odata.type":"Microsoft.Dynamics.CRM.StringAttributeMetadata",SchemaName:$sn,RequiredLevel:{Value:"None"},MaxLength:250,FormatName:{Value:"Text"},DisplayName:{"@odata.type":"Microsoft.Dynamics.CRM.Label","LocalizedLabels":[{"@odata.type":"Microsoft.Dynamics.CRM.LocalizedLabel",Label:$dn,LanguageCode:1033}]}}'; }
          rc=0
          create() {
            echo "→ $1"
            code=$(curl -s -o /tmp/r.json -w "%{http_code}" -X POST \
              "${URL}/api/data/v9.2/EntityDefinitions(LogicalName='${ENT}')/Attributes" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              -H "MSCRM.SolutionUniqueName: ${SOL}" -H "OData-MaxVersion: 4.0" -H "OData-Version: 4.0" -d "$2")
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then echo "   ✓ HTTP $code"; else echo "   ✗ HTTP $code"; jq -r '.error.message // .' /tmp/r.json 2>/dev/null || cat /tmp/r.json; rc=1; fi
          }
          create sanic_cm_ct_nombrecliente   "$(str sanic_cm_ct_nombrecliente   'Nombre Cliente')"
          create sanic_cm_ct_cifcliente      "$(str sanic_cm_ct_cifcliente      'CIF Cliente')"
          create sanic_cm_ct_tipoproducto    "$(str sanic_cm_ct_tipoproducto    'Tipo Producto')"
          create sanic_cm_ct_nombrefiador    "$(str sanic_cm_ct_nombrefiador    'Nombre Fiador')"
          create sanic_cm_ct_direccionfiador "$(str sanic_cm_ct_direccionfiador 'Direccion Fiador')"
          echo "→ PublishAllXml"
          curl -s -o /dev/null -w "   publish HTTP %{http_code}\n" -X POST "${URL}/api/data/v9.2/PublishAllXml" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -H "OData-MaxVersion: 4.0" -H "OData-Version: 4.0" -d '{}'
          echo "=== Verificación ==="
          for c in sanic_cm_ct_nombrecliente sanic_cm_ct_cifcliente sanic_cm_ct_tipoproducto sanic_cm_ct_nombrefiador sanic_cm_ct_direccionfiador; do
            curl -s "${URL}/api/data/v9.2/EntityDefinitions(LogicalName='${ENT}')/Attributes(LogicalName='${c}')?%24select=LogicalName,AttributeType" \
              -H "Authorization: Bearer $TOKEN" | jq -r '"   " + (.LogicalName // "NO ENCONTRADA") + "  [" + ((.AttributeType|tostring)//"?") + "]"'
          done
          exit $rc
