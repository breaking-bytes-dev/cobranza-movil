                      Properties:
                        AutoHeight: =true
                        Color: =gblC.teal
                        FontWeight: =FontWeight.Bold
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =gblT.fbig
                        Text: =Moneda(varCuenta.'[CT] Saldo Vencido NIO', varCuenta.'[CT] Saldo Vencido USD')
                  - lblPagoMinimo_1:
