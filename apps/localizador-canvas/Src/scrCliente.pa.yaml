Screens:
  scrCliente:
    Properties:
      OnVisible: =Set(varCliCuentas, AddColumns(Filter('CM | TBL | Asignacions', LookUp(colCuentas, 'CM | TBL | Cuenta' = '[AS] Cuenta'.'CM | TBL | Cuenta').'CIF Cliente' = varCliente, '[AS] Estado'=true), cta, LookUp(colCuentas, 'CM | TBL | Cuenta' = '[AS] Cuenta'.'CM | TBL | Cuenta')))
    Children:
      - conMaster_2:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =gblC.screen
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =20
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            Width: =Parent.Width
          Children:
            - conHeaderBac:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Center
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =If(gblScale = 1, 120,gblScale = 1.2,130,gblScale = 1.45,140,150)
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                Children:
                  - cmpHeaderBack_1:
                      Control: CanvasComponent
                      ComponentName: cmpHeaderBack
                      Properties:
                        Height: =Parent.Height
                        Subtitulo: ="CIF  " & varCliente
                        Titulo: =LookUp(colClientes, cid = varCliente).cliNom
                        Width: =Parent.Width
                  - Button1_3:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderStyle: =BorderStyle.None
                        Color: =gblC.white
                        Fill: =RGBA(255,255,255,0.18)
                        FontWeight: =FontWeight.Bold
                        Height: =If(gblScale = 1, 30,gblScale = 1.2,34,gblScale = 1.45,40,46)
                        OnSelect: =Set(varSheetEscala, true)
                        PaddingBottom: =7
                        PaddingLeft: =11
                        PaddingRight: =11
                        PaddingTop: =7
                        RadiusBottomLeft: =9
                        RadiusBottomRight: =9
                        RadiusTopLeft: =9
                        RadiusTopRight: =9
                        Size: =gblT.fmd
                        Text: ="Aa"
                        Width: =If(gblScale = 1, 50,gblScale = 1.2,60,gblScale = 1.45,70,80)
                        X: =Parent.Width - Self.Width - 14
                        Y: =Self.Height - 20
            - conTabs:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =gblC.surface
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - Button6:
                      Control: Classic/Button@2.2.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        BorderStyle: =BorderStyle.None
                        Color: =If(varCliTab="cuentas", gblC.white, gblC.ink2)
                        Fill: =If(varCliTab="cuentas", gblC.teal, gblC.chipBg)
                        FillPortions: =1
                        HoverBorderColor: =Self.BorderColor
                        HoverColor: =Self.Color
                        HoverFill: =Self.Fill
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: =Set(varCliTab,"cuentas")
                        RadiusBottomLeft: =
                        RadiusBottomRight: =
                        RadiusTopLeft: =
                        RadiusTopRight: =
                        Size: =gblT.fsm
                        Text: ="Cuentas (" & CountRows(varCliCuentas) & ")"
                  - Button6_1:
                      Control: Classic/Button@2.2.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        BorderStyle: =BorderStyle.None
                        Color: =If(varCliTab="cuentas", gblC.white, gblC.ink2)
                        Fill: =If(varCliTab="inter", gblC.teal, gblC.chipBg)
                        FillPortions: =1
                        HoverBorderColor: =Self.BorderColor
                        HoverColor: =Self.Color
                        HoverFill: =Self.Fill
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: =Set(varCliTab,"inter")
                        RadiusBottomLeft: =
                        RadiusBottomRight: =
                        RadiusTopLeft: =
                        RadiusTopRight: =
                        Size: =gblT.fsm
                        Text: ="Interacciones (" & CountRows(Filter('CM | TBL | Interaccions', LookUp(colCuentas, 'CM | TBL | Cuenta' = '[IN] Cuenta'.'CM | TBL | Cuenta').'CIF Cliente' = varCliente)) &")"
            - cardTotalCli:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =gblC.accentBorder
                  BorderThickness: =1
                  Fill: =gblC.accentBg
                  FillPortions: =0
                  Height: =lblTL.Height + lblTB.Height + 30
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =14
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =14
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  Visible: =varCliTab = "cuentas"
                  X: =40
                  Y: =40
                Children:
                  - lblTL:
                      Control: Label@2.5.1
                      Properties:
                        AutoHeight: =true
                        Color: =gblC.muted2
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =gblT.fxs
                        Text: ="Total a cobrar del cliente"
                  - lblTB:
                      Control: Label@2.5.1
                      Properties:
                        AutoHeight: =true
                        Color: =gblC.accent
                        FontWeight: =FontWeight.Bold
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =gblT.fbig
                        Text: =Moneda(Sum(varCliCuentas, cta.'[CT] Saldo Vencido NIO'), Sum(varCliCuentas, cta.'[CT] Saldo Vencido USD'))
            - Container16:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =gblC.surface
                  FillPortions: =0
                  Height: =lblSecTel.Height + galTels.Height + lblSecDir.Height + galDirs.Height + If(galTels.AllItemsCount = 0, 28, 0) + If(galDirs.AllItemsCount = 0, 28, 0) + 16
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  Visible: =varCliTab = "cuentas"
                Children:
                  - lblSecTel:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =gblC.muted2
                        FontWeight: =FontWeight.Bold
                        LayoutMinHeight: =16
                        LayoutMinWidth: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                        Size: =gblT.fxs
                        Text: ="CONTACTO"
                  - galTels:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        FillPortions: =0
                        Height: =CountRows(Self.AllItems)*Self.TemplateHeight
                        Items: =Filter(colTelefonos, '[TL] CIF' = varCliente)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                        TemplatePadding: =
                        TemplateSize: =If(gblScale = 1, 60,gblScale = 1.2,64,gblScale = 1.45,70,76)
                      Children:
                        - conFilaTel:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Height: =Parent.TemplateHeight
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                              PaddingBottom: =8
                              PaddingTop: =8
                              Width: =App.Width - 48
                            Children:
                              - lblTelTipo:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    Color: =gblC.muted2
                                    FillPortions: =1
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Size: =gblT.f2xs
                                    Text: =ThisItem.'[TL] Tipo'
                              - lblTelVal:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    Color: =gblC.ink
                                    FillPortions: =1
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Size: =gblT.fbase
                                    Text: =ThisItem.'[TL] Numero'
                              - Button7:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    BorderStyle: =BorderStyle.None
                                    Fill: =gblC.teal
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: =Launch("tel:" & ThisItem.'[TL] Numero')
                                    RadiusBottomLeft: =9
                                    RadiusBottomRight: =9
                                    RadiusTopLeft: =9
                                    RadiusTopRight: =9
                                    Size: =gblT.fsm
                                    Text: ="Llamar"
                                    Width: =120
                  - lblSinTel:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =gblC.muted
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =6
                        PaddingTop: =4
                        Size: =gblT.fxs
                        Text: ="Sin teléfonos registrados"
                        Visible: =galTels.AllItemsCount = 0
                  - lblSecDir:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =gblC.muted2
                        FontWeight: =FontWeight.Bold
                        LayoutMinHeight: =16
                        LayoutMinWidth: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                        PaddingTop: =12
                        Size: =gblT.fxs
                        Text: ="DIRECCIONES"
                  - galDirs:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        FillPortions: =0
                        Height: =CountRows(Self.AllItems)*Self.TemplateHeight
                        Items: =Filter(colDirecciones, '[DR] CIF' = varCliente)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                        TemplatePadding: =
                        TemplateSize: =If(gblScale = 1, 158,gblScale = 1.2,176,gblScale = 1.45,204,228)
                      Children:
                        - conFilaDir:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =3
                              DropShadow: =DropShadow.None
                              Height: =Parent.TemplateHeight
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                              PaddingBottom: =8
                              PaddingTop: =8
                              Width: =App.Width - 48
                            Children:
                              - lblDirTipo:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    Color: =gblC.muted2
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Size: =gblT.f2xs
                                    Text: =ThisItem.'[DR] Tipo'
                                    Width: =If(gblScale = 1, 90,gblScale = 1.2,104,gblScale = 1.45,122,140)
                              - lblDirVal:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    Color: =gblC.ink
                                    FillPortions: =1
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Size: =gblT.fbase
                                    Text: =ThisItem.'[DR] Direccion'
                              - btnMapa:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    BorderStyle: =BorderStyle.None
                                    Color: =gblC.accent
                                    Fill: =gblC.chipBg
                                    Height: =If(gblScale = 1, 60,gblScale = 1.2,65,gblScale = 1.45,70,70)
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: =Launch("https://www.google.com/maps/search/?api=1&query=" & EncodeUrl(ThisItem.'[DR] Direccion'))
                                    RadiusBottomLeft: =9
                                    RadiusBottomRight: =9
                                    RadiusTopLeft: =9
                                    RadiusTopRight: =9
                                    Size: =gblT.fsm
                                    Text: ="Mapa"
                                    Width: =90
                  - lblSinDir:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =gblC.muted
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =6
                        PaddingTop: =4
                        Size: =gblT.fxs
                        Text: ="Sin direcciones registradas"
                        Visible: =galDirs.AllItemsCount = 0
            - lblSecCtas:
                Control: Label@2.5.1
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  AutoHeight: =true
                  Color: =gblC.muted2
                  FontWeight: =FontWeight.Bold
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Size: =gblT.fxs
                  Text: ="CUENTAS A COBRAR (" & CountRows(varCliCuentas) & ")"
                  Visible: =varCliTab = "cuentas"
            - galInterCli:
                Control: Gallery@2.15.0
                Variant: VariableHeight
                Properties:
                  AlignInContainer: =AlignInContainer.Center
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =3
                  Items: =Sort(Filter('CM | TBL | Interaccions', LookUp(colCuentas, 'CM | TBL | Cuenta' = '[IN] Cuenta'.'CM | TBL | Cuenta').'CIF Cliente' = varCliente), 'Created On', SortOrder.Descending)
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Visible: =varCliTab = "inter"
                  Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                Children:
                  - conICard_1:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =gblC.cardBorder
                        BorderThickness: =1
                        Fill: =gblC.surface
                        Height: =lblITime_1.Height + lblIAcct_1.Height + lblICom_1.Height + If(lblTagPago_1.Visible,lblTagPago_1.Height + 10) + If(lblTagDatos_1.Visible,lblTagDatos_1.Height + 10) + Label7_1.Height + 45
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        PaddingBottom: =12
                        PaddingLeft: =14
                        PaddingRight: =14
                        PaddingTop: =12
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        Width: =Parent.TemplateWidth - 20
                        X: =10
                        Y: =10
                      Children:
                        - conIHead_1:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =Parent.Height - 20
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =4
                              LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              LayoutWrap: =true
                              PaddingBottom: =8
                              PaddingLeft: =8
                              PaddingRight: =8
                              PaddingTop: =8
                              Width: =App.Width - 72
                            Children:
                              - lblITime_1:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    Color: =gblC.muted
                                    FontWeight: =FontWeight.Semibold
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Size: =gblT.fxs
                                    Text: |-
                                      ="🕘 " & Text(ThisItem.'Created On',"dd/mm · hh:mm")
                                    Width: =Parent.Width - 16
                              - lblIAcct_1:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    Color: =gblC.muted2
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =0
                                    PaddingTop: =0
                                    Size: =gblT.fxs
                                    Text: |-
                                      =With({ c: LookUp(colCuentas, 'CM | TBL | Cuenta' = ThisItem.'[IN] Cuenta'.'CM | TBL | Cuenta') }, c.'Tipo Producto' & " · " & PanMasc(c.'Últimos 4'))
                                    Width: =Parent.Width - 16
                              - lblICom_1:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    Color: =gblC.ink
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =0
                                    PaddingTop: =0
                                    Size: =gblT.fbase
                                    Text: =ThisItem.'[IN] Comentario'
                                    Width: =Parent.Width - 16
                              - lblTagPago_1:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    Color: =gblC.accentInk
                                    Fill: =gblC.accentBg
                                    FontWeight: =FontWeight.Semibold
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Size: =gblT.fxs
                                    Text: |-
                                      ="💵 " & Concat(Filter('CM | TBL | Pagos', Not(IsBlank('[PG] Numero Interaccion')) && '[PG] Numero Interaccion' = ThisItem.'[IN] Numero de Interaccion'),If(Text('[PG] Moneda')="USD","US$ ","C$ ") & Text('[PG] Monto',"#,##0.00") &
                                                  " (rec. " & '[PG] Numero recibo' & ")", " · ")
                                    Visible: =CountRows(Filter('CM | TBL | Pagos', Not(IsBlank('[PG] Numero Interaccion')) && '[PG] Numero Interaccion' = ThisItem.'[IN] Numero de Interaccion'))>0
                                    Width: =Parent.Width - 16
                              - lblTagDatos_1:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    Color: =gblC.diariaInk
                                    Fill: =gblC.datosBg
                                    FontWeight: =FontWeight.Semibold
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =4
                                    PaddingLeft: =10
                                    PaddingRight: =10
                                    PaddingTop: =4
                                    Size: =gblT.fxs
                                    Text: ="✏️ Datos actualizados"
                                    Visible: =ThisItem.'[IN] Actualiza info'
                                    Width: =Parent.Width - 16
                              - Label7_1:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    Color: =gblC.muted
                                    Fill: =gblC.screen
                                    FontWeight: =FontWeight.Semibold
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =4
                                    PaddingLeft: =10
                                    PaddingRight: =10
                                    PaddingTop: =4
                                    Size: =gblT.fxs
                                    Text: |-
                                      ="📍 Ubicación"
                                    Width: =Parent.Width - 16
            - galMini:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  AlignInContainer: =AlignInContainer.Center
                  FillPortions: =0
                  Height: =Self.TemplateHeight * Self.AllItemsCount
                  Items: =varCliCuentas
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  TemplatePadding: =
                  TemplateSize: =If(gblScale = 1, 150,gblScale = 1.2,165,gblScale = 1.45,185,205)
                  Visible: =varCliTab = "cuentas"
                  Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                Children:
                  - conMini:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =gblC.cardBorder
                        BorderThickness: =1
                        DropShadow: =DropShadow.Regular
                        Fill: =gblC.surface
                        Height: =conMiniBody.Height + conMiniFoot.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        Width: =Parent.TemplateWidth - 20
                        X: =10
                        Y: =10
                      Children:
                        - conMiniBody:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =If(gblScale = 1, 66,gblScale = 1.2,74,gblScale = 1.45,90,100)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =10
                              PaddingLeft: =15
                              PaddingRight: =13
                              PaddingTop: =12
                            Children:
                              - conName:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                  Children:
                                    - Label9:
                                        Control: Label@2.5.1
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          AutoHeight: =true
                                          Color: =gblC.ink
                                          FontWeight: =FontWeight.Bold
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          PaddingBottom: =0
                                          Size: =gblT.fbase
                                          Text: =ThisItem.cta.'Tipo Producto'
                                    - Label10:
                                        Control: Label@2.5.1
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          AutoHeight: =true
                                          Color: =gblC.muted
                                          FontWeight: =FontWeight.Semibold
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          PaddingTop: =0
                                          Size: =gblT.fxs
                                          Text: =PanMasc(ThisItem.cta.'Últimos 4')
                              - Text1:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Center
                                    AutoHeight: =true
                                    Color: =Switch(Text(ThisItem.'[AS] Tipo'), "Diaria",gblC.diariaInk, "Incobrable",gblC.incobInk, gblC.espInk)
                                    Fill: =Switch(Text(ThisItem.'[AS] Tipo'), "Diaria",gblC.diariaBg, "Incobrable",gblC.incobBg, gblC.espBg)
                                    FontWeight: =FontWeight.Bold
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    RadiusBottomLeft: =20
                                    RadiusBottomRight: =20
                                    RadiusTopLeft: =20
                                    RadiusTopRight: =20
                                    Size: =gblT.f2xs
                                    Text: =ThisItem.'[AS] Tipo'
                                    Width: =If(gblScale = 1, 92,gblScale = 1.2,104,gblScale = 1.45,120,132)
                        - conMiniFoot:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =gblC.chipBg
                              FillPortions: =0
                              Height: =If(gblScale = 1, 64,gblScale = 1.2,72,gblScale = 1.45,84,96)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =8
                              PaddingLeft: =15
                              PaddingRight: =13
                              PaddingTop: =8
                              RadiusBottomLeft: =14
                              RadiusBottomRight: =14
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - conSaldo:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =1
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                  Children:
                                    - lblSaldoLblCta:
                                        Control: Label@2.5.1
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          AutoHeight: =true
                                          Color: =gblC.muted2
                                          FontWeight: =FontWeight.Bold
                                          LayoutMinHeight: =16
