                        PaddingTop: =8
                      Children:
                        - blGeoT:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              Color: =gblC.accentInk
                              FontWeight: =FontWeight.Semibold
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Size: =gblT.fbase
                              Text: |-
                                =If(IsBlank(Location.Latitude), "Sin ubicación: activá el GPS", "Ubicación capturada")
                        - Label8:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              Color: =gblC.accentInk2
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Size: =gblT.fxs
                              Text: =If(IsBlank(Location.Latitude), "Al guardar te va a pedir confirmación", Text(Location.Latitude, "0.00000", "en-US") & ", " & Text(Location.Longitude, "0.00000", "en-US") & " · automática")
            - btnRegistrar_1:
                Control: Classic/Button@2.2.0
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  BorderStyle: =BorderStyle.None
                  Color: =gblC.white
                  DisplayMode: |-
                    =// APP-02/09/10: todo pago con monto y recibo válido, recibos sin repetir, al menos un producto, y no mientras se guarda.
                    With({
                        faltaComent:   IsBlank(Trim(txtComentario.Text)),
                        sinLineas:     tpPago.Value && CountRows(colLineasPago) = 0,
                        lineaIncompl:  tpPago.Value && CountRows(Filter(colLineasPago, monto <= 0 || IsBlank(Trim(recibo)))) > 0,
                        reciboLargo:   tpPago.Value && CountRows(Filter(colLineasPago, Len(Trim(recibo)) > 30)) > 0,
                        reciboRepet:   tpPago.Value && CountRows(colLineasPago) <> CountRows(Distinct(colLineasPago, Upper(Trim(recibo)))),
                        faltaDato:     tgDatos.Value && And(IsBlank(inTelCasa.Text), IsBlank(inTelCel.Text), IsBlank(inTelTrab.Text),
                                                            IsBlank(inDirCasa.Text), IsBlank(inDirEC.Text), IsBlank(inDirTrab.Text), IsBlank(inCorreo.Text)),
                        datoInval:     tgDatos.Value && Or(
                                           !IsBlank(Trim(inTelCasa.Text)) && !IsMatch(Trim(inTelCasa.Text), "^[0-9 +()-]{7,20}$"),
                                           !IsBlank(Trim(inTelCel.Text))  && !IsMatch(Trim(inTelCel.Text),  "^[0-9 +()-]{7,20}$"),
                                           !IsBlank(Trim(inTelTrab.Text)) && !IsMatch(Trim(inTelTrab.Text), "^[0-9 +()-]{7,20}$"),
                                           !IsBlank(Trim(inCorreo.Text))  && !IsMatch(Trim(inCorreo.Text), Match.Email)),
                        sinProducto:   If(tpPago.Value || tgDatos.Value, IsBlank(varCuenta), CountRows(Filter(colProdInt, sel)) = 0)
                      },
                      If(!locGuardando && !faltaComent && !sinLineas && !lineaIncompl && !reciboLargo && !reciboRepet && !faltaDato && !datoInval && !sinProducto,
                         DisplayMode.Edit, DisplayMode.Disabled))
                  Fill: =gblC.teal
                  FontWeight: =FontWeight.Bold
                  Height: =If(gblScale = 1, 54,gblScale = 1.2,60,gblScale = 1.45,68,76)
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnSelect: |-
                    =// APP-04/09: guardado con manejo de errores, una sola ejecución a la vez, y reintento idempotente:
                    // el rol del cobrador no puede borrar, así que lo ya guardado (interacción, pagos, datos) no se vuelve a crear al reintentar.
                    If(!locGuardando,
                    UpdateContext({locGuardando: true});
                    With({
                        excesoNio:   tpPago.Value && Sum(Filter(colLineasPago, moneda = "NIO"), monto) > Coalesce(varCuenta.'[CT] Saldo Vencido NIO', 0),
                        excesoUsd:   tpPago.Value && Sum(Filter(colLineasPago, moneda = "USD"), monto) > Coalesce(varCuenta.'[CT] Saldo Vencido USD', 0),
                        /* F6: el recibo es único GLOBAL (talonario físico), sin importar cuenta ni moneda. Offline el teléfono solo ve
                           sus pagos (perfil: 90 días); el servidor completa el control contra todos */
                        reciboUsado: tpPago.Value && CountRows(Filter(colLineasPago As Lx, !(Lx.id in colPagosGuardados.id) &&
                                        With({ rec: Trim(Lx.recibo) },
                                            !IsBlank(LookUp('CM | TBL | Pagos', '[PG] Numero recibo' = rec))))) > 0
                      },
                      If(
                        /* APP-43: localizador desactivado por el Admin → no se registra (el servidor también lo rechaza) */
                        gblAgenteInactivo,
                            UpdateContext({locGuardando: false});
                            Notify("Tu localizador está desactivado: no podés registrar visitas ni pagos. Hablá con tu supervisor.", NotificationType.Error),
                        /* APP-11: sin coordenadas del GPS → se avisa y hay que confirmarlo con un segundo toque */
                        IsBlank(Location.Latitude) && !locConfirmaSinGps,
                            UpdateContext({locGuardando: false, locConfirmaSinGps: true});
                            Notify("No hay ubicación del GPS. Activalo y esperá unos segundos; si igual querés guardar, tocá «Guardar sin ubicación».", NotificationType.Warning),
                        /* APP-10: monto mayor que el saldo vencido → hay que confirmarlo con un segundo toque */
                        (excesoNio || excesoUsd) && !locConfirmaExceso,
                            UpdateContext({locGuardando: false, locConfirmaExceso: true});
                            Notify("El pago es mayor que el saldo vencido de la cuenta. Revisá el monto; si está bien, tocá «Confirmar pago».", NotificationType.Warning),
                        /* APP-10 + F6: el mismo recibo ya está registrado (en cualquier cuenta) */
                        reciboUsado,
                            UpdateContext({locGuardando: false});
                            Notify("Ese número de recibo ya está registrado. Revisalo antes de guardar.", NotificationType.Error),
                        /* UNA cuenta (pago o datos) */
                        tpPago.Value || tgDatos.Value,
                            ClearCollect(colPagosPend, Filter(colLineasPago, !(id in colPagosGuardados.id)));
                            IfError(
                                If(IsBlank(locIntCreada),
                                    /* F7: la misma fecha de captura viaja en la actualización de datos; offline el lookup a esta
                                       interacción llega vacío y el servidor la vincula por cuenta + captura (plugin 1.0.8.6) */
                                    UpdateContext({locFechaCaptura: Now()});
                                    With({ r: Patch('CM | TBL | Interaccions', Defaults('CM | TBL | Interaccions'), {
                                        '[IN] Cuenta': varCuenta,
                                        '[IN] Agente': gblAgente,
                                        '[IN] Comentario': txtComentario.Text,
                                        '[IN] Aplica pago': tpPago.Value,
                                        '[IN] Actualiza info': tgDatos.Value,
                                        '[IN] Latitud': Location.Latitude,
                                        '[IN] Longitud': Location.Longitude,
                                        'Fecha de captura': locFechaCaptura,
                                        '[IN] NombreAgente': Coalesce(gblAgente.'[AG] Nombre', "Sin nombre")
                                        }) },
                                        IfError(r, Error(FirstError), UpdateContext({locIntCreada: r})))),
                                UpdateContext({locGuardando: false});
                                Notify("No se pudo guardar la interacción: " & FirstError.Message, NotificationType.Error),

                                If(tpPago.Value, ForAll(colPagosPend As L,
                                    IfError(
                                        Patch('CM | TBL | Pagos', Defaults('CM | TBL | Pagos'), {
                                            '[PG] Interaccion': locIntCreada,
                                            '[PG] Numero Interaccion': locIntCreada.'[IN] Numero de Interaccion',
                                            Cuenta: varCuenta,
                                            '[PG] Monto': L.monto,
                                            '[PG] Moneda': Switch(L.moneda, "USD", 'Choice | CM | Monedas en Pago'.USD, 'Choice | CM | Monedas en Pago'.NIO),
                                            '[PG] Numero recibo': Trim(L.recibo),
                        'Fecha del pago': Now() }),
                                        Error(FirstError),
                                        Collect(colPagosGuardados, {id: L.id})))),
                                UpdateContext({locGuardando: false});
                                Notify("La interacción se guardó, pero no todos los pagos (" & FirstError.Message & "). Corregí y tocá Guardar: solo se guardan los que faltan.", NotificationType.Error),

                                If(tgDatos.Value && !locADGuardada,
                                    IfError(
                                        Patch('CM | TBL | Actualizacion de datos', Defaults('CM | TBL | Actualizacion de datos'), {
                                            '[AD] Interaccion': locIntCreada,
                                            '[AD] Cuenta': varCuenta,
                                            '[AD] Fecha de captura': locFechaCaptura,
                                            '[AD] Telefono Casa': inTelCasa.Text,
                                            '[AD] Telefono Celular': inTelCel.Text,
                                            '[AD] Telefono trabajo': inTelTrab.Text,
                                            '[AD] Direccion casa': inDirCasa.Text,
                                            '[AD] Direccion EC': inDirEC.Text,
                                            '[AD] Direccion trabajo': inDirTrab.Text,
                                            '[AD] Correo electronico': inCorreo.Text }),
                                        Error(FirstError),
                                        UpdateContext({locADGuardada: true}))),
                                UpdateContext({locGuardando: false});
                                Notify("La interacción se guardó, pero no la actualización de datos (" & FirstError.Message & "). Tocá Guardar de nuevo.", NotificationType.Error),

                                Set(varCom, "");
                                Notify(If(Connection.Connected, "✓ Guardado. Se sube en la próxima sincronización.", "✓ Guardado en el teléfono. Se sube cuando vuelva la señal."), NotificationType.Success);
                                Back()),
                        /* MULTI: una interacción por producto tildado, sin pago ni datos */
                            ClearCollect(colIntPend, Filter(colProdInt, sel && !('CM | TBL | Asignacion' in colIntGuardadas.aid)));
                            IfError(
                                ForAll(colIntPend As P,
                                    IfError(
                                        Patch('CM | TBL | Interaccions', Defaults('CM | TBL | Interaccions'), {
                                            '[IN] Cuenta': P.cta,
                                            '[IN] Agente': gblAgente,
                                            '[IN] Comentario': txtComentario.Text,
                                            '[IN] Aplica pago': false,
                                            '[IN] Actualiza info': false,
                                            '[IN] Latitud': Location.Latitude,
                                            '[IN] Longitud': Location.Longitude,
                                            'Fecha de captura': Now(),
                                            '[IN] NombreAgente': Coalesce(gblAgente.'[AG] Nombre', "Sin nombre") }),
                                        Error(FirstError),
                                        Collect(colIntGuardadas, {aid: P.'CM | TBL | Asignacion'}))),
                                UpdateContext({locGuardando: false});
                                Notify("No se pudieron guardar todas las interacciones (" & FirstError.Message & "). Tocá Guardar de nuevo: solo se guardan las que faltan.", NotificationType.Error),
                                Set(varCom, "");
                                Notify(If(Connection.Connected, "✓ Guardado. Se sube en la próxima sincronización.", "✓ Guardado en el teléfono. Se sube cuando vuelva la señal."), NotificationType.Success);
                                Back())
                      )))
                  PaddingBottom: =14
                  PaddingLeft: =14
                  PaddingRight: =14
                  PaddingTop: =14
                  Size: =gblT.fmd
                  Text: |-
                    =If(locGuardando, "Guardando…",
                        locConfirmaSinGps && IsBlank(Location.Latitude), "Guardar sin ubicación",
                        locConfirmaExceso, "Confirmar pago",
                        tpPago.Value || tgDatos.Value, "Guardar interacción" & If(tpPago.Value," + pago","") & If(tgDatos.Value," + datos",""),
                        "Guardar en " & CountRows(Filter(colProdInt, sel)) & " producto" & If(CountRows(Filter(colProdInt, sel))>1,"s",""))
            - lblHint:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  AutoHeight: =true
                  Color: =gblC.hint
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Size: =gblT.fxs
                  Text: |-
                    =With({
                        faltaComent:   IsBlank(Trim(txtComentario.Text)),
                        sinLineas:     tpPago.Value && CountRows(colLineasPago) = 0,
                        lineaIncompl:  tpPago.Value && CountRows(Filter(colLineasPago, monto <= 0 || IsBlank(Trim(recibo)))) > 0,
                        reciboLargo:   tpPago.Value && CountRows(Filter(colLineasPago, Len(Trim(recibo)) > 30)) > 0,
                        reciboRepet:   tpPago.Value && CountRows(colLineasPago) <> CountRows(Distinct(colLineasPago, Upper(Trim(recibo)))),
                        faltaDato:     tgDatos.Value && And(IsBlank(inTelCasa.Text), IsBlank(inTelCel.Text), IsBlank(inTelTrab.Text),
                                                            IsBlank(inDirCasa.Text), IsBlank(inDirEC.Text), IsBlank(inDirTrab.Text), IsBlank(inCorreo.Text)),
                        datoInval:     tgDatos.Value && Or(
                                           !IsBlank(Trim(inTelCasa.Text)) && !IsMatch(Trim(inTelCasa.Text), "^[0-9 +()-]{7,20}$"),
                                           !IsBlank(Trim(inTelCel.Text))  && !IsMatch(Trim(inTelCel.Text),  "^[0-9 +()-]{7,20}$"),
                                           !IsBlank(Trim(inTelTrab.Text)) && !IsMatch(Trim(inTelTrab.Text), "^[0-9 +()-]{7,20}$"),
                                           !IsBlank(Trim(inCorreo.Text))  && !IsMatch(Trim(inCorreo.Text), Match.Email)),
                        sinProducto:   If(tpPago.Value || tgDatos.Value, IsBlank(varCuenta), CountRows(Filter(colProdInt, sel)) = 0)
                      },
                      With({ falta: Concat(Filter(Table(
                                  {c: faltaComent,  t: "comentario"},
                                  {c: sinLineas,    t: "un pago"},
                                  {c: lineaIncompl, t: "monto y recibo en cada pago"},
                                  {c: reciboLargo,  t: "recibo de hasta 30 caracteres"},
                                  {c: reciboRepet,  t: "recibos sin repetir"},
                                  {c: faltaDato,    t: "un dato del cliente"},
                    {c: datoInval,    t: "teléfonos de 7 a 20 dígitos y un correo válido"},
                                  {c: sinProducto,  t: "un producto"}), c), t, " · ") },
                          If(IsBlank(falta), "", "Falta: " & falta)))
      - cmpSheet_5:
          Control: CanvasComponent
          ComponentName: cmpSheet
          Properties:
            Height: =Parent.Height
            Visible: =varSheetEscala
            Width: =Parent.Width
