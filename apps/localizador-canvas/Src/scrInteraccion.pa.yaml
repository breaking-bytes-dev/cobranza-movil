Screens:
  scrInteraccion:
    Properties:
      OnHidden: |-
        =UpdateContext({locPan: Blank()});
        Reset(txtComentario);
        Reset(tpPago);
        Clear(colLineasPago);
        Reset(tgDatos);
        Reset(inTelCasa);
        Reset(inTelCel);
        Reset(inTelTrab);
        Reset(inDirCasa);
        Reset(inDirEC);
        Reset(inDirTrab);
        Reset(inCorreo);
      OnVisible: |-
        =UpdateContext({locPan: Blank()});
        ClearCollect(colProdInt,
            AddColumns(
                Filter(colAsig, cid = varCuenta.'CIF Cliente' && '[AS] Estado' = true),
                esActual, '[AS] Cuenta'.'CM | TBL | Cuenta' = varCuenta.'CM | TBL | Cuenta',
                sel,      '[AS] Cuenta'.'CM | TBL | Cuenta' = varCuenta.'CM | TBL | Cuenta'))
    Children:
      - conMaster_4:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =gblC.screen
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =20
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            Width: =Parent.Width
          Children:
            - conHeaderBac_2:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Start
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =If(gblScale = 1, 120,gblScale = 1.2,130,gblScale = 1.45,150,170)
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                Children:
                  - cmpHeaderBack_3:
                      Control: CanvasComponent
                      ComponentName: cmpHeaderBack
                      Properties:
                        Height: =Parent.Height
                        Subtitulo: =varCuenta.'Tipo Producto' & " · " & If(IsBlank(locPan), PanMasc(varCuenta.'Últimos 4'), locPan)
                        Titulo: =varCuenta.'Nombre Cliente'
                        Width: =Parent.Width
                  - Button1_5:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderStyle: =BorderStyle.None
                        Color: =gblC.white
                        Fill: =RGBA(255,255,255,0.18)
                        FontWeight: =FontWeight.Bold
                        Height: =If(gblScale = 1, 30,gblScale = 1.2,34,gblScale = 1.45,40,46)
                        OnSelect: =Set(varSheetEscala, true)
                        PaddingBottom: =7
                        PaddingLeft: =11
                        PaddingRight: =11
                        PaddingTop: =7
                        RadiusBottomLeft: =9
                        RadiusBottomRight: =9
                        RadiusTopLeft: =9
                        RadiusTopRight: =9
                        Size: =gblT.fmd
                        Text: ="Aa"
                        Width: =If(gblScale = 1, 50,gblScale = 1.2,60,gblScale = 1.45,70,80)
                        X: =Parent.Width - Self.Width - 14
                        Y: =Self.Height - 20
                  - Text1_2:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AutoHeight: =true
                        Color: =Switch(Text(varAsig.'[AS] Tipo'), "Diaria",gblC.diariaInk, "Incobrable",gblC.incobInk, gblC.espInk)
                        Fill: =Switch(Text(varAsig.'[AS] Tipo'), "Diaria",gblC.diariaBg, "Incobrable",gblC.incobBg, gblC.espBg)
                        FontWeight: =FontWeight.Bold
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Size: =gblT.fxs
                        Text: =varAsig.'[AS] Tipo'
                        Width: =If(gblScale = 1, 100,gblScale = 1.2,110,gblScale = 1.45,124,140)
                        X: =Parent.Width - 18  - Self.Width
                        Y: =Button1_5.Y + Button1_5.Height + 20
                  - btnVerPan_IN:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderStyle: =BorderStyle.None
                        Color: =gblC.white
                        DisplayMode: =If(IsBlank(varCuenta), DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =RGBA(255,255,255,0.18)
                        FontWeight: =FontWeight.Bold
                        Height: =If(gblScale = 1, 28,gblScale = 1.2,30,gblScale = 1.45,34,38)
                        OnSelect: |-
                          =// Número completo SOLO en variable de contexto (nunca en colecciones, SaveData ni globales).
                          // Un solo nivel de lookup: funciona offline. El Timer lo oculta a los 30 s.
                          If(!IsBlank(locPan),
                              UpdateContext({locPan: Blank()}),
                              With({ pan: LookUp('CM | TBL | PAN de cuentas', Cuenta.'CM | TBL | Cuenta' = varCuenta.'CM | TBL | Cuenta').PAN },
                                  If(IsBlank(pan),
                                      Notify("El número de tarjeta no está disponible en este dispositivo. Sincronizá y volvé a intentar.", NotificationType.Warning),
                                      UpdateContext({locPan: pan}))))
                        PaddingBottom: =4
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =4
                        RadiusBottomLeft: =9
                        RadiusBottomRight: =9
                        RadiusTopLeft: =9
                        RadiusTopRight: =9
                        Size: =gblT.fxs
                        Text: =If(IsBlank(locPan), "Ver número", "Ocultar")
                        Width: =If(gblScale = 1, 84,gblScale = 1.2,96,gblScale = 1.45,112,124)
                        X: =Parent.Width - Self.Width - 14
                        Y: =Max(Parent.Height - Self.Height - 6, Text1_2.Y + Text1_2.Height + 4)
                  - tmrVerPan_IN:
                      Control: Timer@2.1.0
                      Properties:
                        AutoPause: =false
                        Duration: =30000
                        OnTimerEnd: |-
                          =UpdateContext({locPan: Blank()})
                        Repeat: =false
                        Start: =!IsBlank(locPan)
                        Visible: =false
            - cardTotalCli_2:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =gblC.accentBorder
                  BorderThickness: =1
                  Fill: =gblC.accentBg
                  FillPortions: =0
                  Height: =lblTL_2.Height + lblTB_2.Height + 30 + lblPagoMinimo_1.Height + lblTotalDolarizaod_1.Height + lblContagiado_1.Height
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =14
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =14
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  X: =40
                  Y: =40
                Children:
                  - lblTL_2:
                      Control: Label@2.5.1
                      Properties:
                        AutoHeight: =true
                        Color: =gblC.muted2
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =gblT.fxs
                        Text: ="A cobrar"
                  - lblTB_2:
                      Control: Label@2.5.1
                      Properties:
                        AutoHeight: =true
                        Color: =gblC.accent
                        FontWeight: =FontWeight.Bold
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =gblT.fbig
                        Text: =Moneda(varCuenta.'[CT] Saldo Vencido NIO', varCuenta.'[CT] Saldo Vencido USD')
                  - lblPagoMinimo_1:
                      Control: Label@2.5.1
                      Properties:
                        AutoHeight: =true
                        Color: =gblC.accent
                        FontWeight: =FontWeight.Bold
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =gblT.fxs
                        Text: |-
                          ="Pago Minimo: "&Moneda(varCuenta.'[CT] Pago Minimo NIO', varCuenta.'[CT] Pago Minimo USD')
                  - lblTotalDolarizaod_1:
                      Control: Label@2.5.1
                      Properties:
                        AutoHeight: =true
                        Color: =gblC.accent
                        FontWeight: =FontWeight.Bold
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =gblT.fxs
                        Text: |-
                          ="Total dolarizado: " & If(IsBlank(varCuenta.'[CT] Total saldo vencido'), "—", "US$ " & Text(varCuenta.'[CT] Total saldo vencido', "#,##0.00"))
                  - lblContagiado_1:
                      Control: Label@2.5.1
                      Properties:
                        AutoHeight: =true
                        Color: =gblC.accent
                        FontWeight: =FontWeight.Bold
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =gblT.fxs
                        Text: |-
                          ="En riesgo (contagiado): " & If(IsBlank(varCuenta.'[CT] Contagiado USD'), "—", "US$ " & Text(varCuenta.'[CT] Contagiado USD', "#,##0.00"))
            - lblComL:
                Control: Label@2.5.1
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  AutoHeight: =true
                  Color: =gblC.ink2
                  FontWeight: =FontWeight.Bold
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Size: =gblT.fsm
                  Text: ="¿Qué pasó? *"
            - txtComentario:
                Control: ModernTextInput@1.1.1
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  BorderColor: =gblC.borderSoft
                  BorderStyle: =BorderStyle.Solid
                  BorderThickness: =1
                  Color: =gblC.ink
                  Default: =varCom
                  Fill: =gblC.surface
                  Height: =160
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Placeholder: ="Escribí el comentario de la interacción…"
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Size: =gblT.fbase
                  Type: =TextInputType.Multiline
            - galChips:
                Control: Gallery@2.15.0
                Variant: Horizontal
                Properties:
                  FillPortions: =0
                  Height: =180
                  Items: =["Promesa de pago","No localizado","Cliente pagó","No tiene dinero hoy","Negocio cerrado","Pidió arreglo"]
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  ShowScrollbar: =false
                  TemplatePadding: =10
                  TemplateSize: =Parent.Width / 2 - 30
                  WrapCount: =3
                Children:
                  - Button11:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =gblC.accent
                        DisabledFill: =RGBA(244, 244, 244, 0)
                        Fill: =Color.Transparent
                        Height: =Parent.TemplateHeight
                        OnSelect: =Set(varCom, If(IsBlank(varCom), ThisItem.Value, Trim(varCom) & ". " & ThisItem.Value))
                        PaddingBottom: =7
                        PaddingLeft: =13
                        PaddingRight: =13
                        PaddingTop: =7
                        RadiusBottomLeft: =16
                        RadiusBottomRight: =16
                        RadiusTopLeft: =16
                        RadiusTopRight: =16
                        Size: =gblT.fxs
                        Text: =ThisItem.Value
                        Width: =Parent.TemplateWidth
            - cardSelProd:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =gblC.cardBorder
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =gblC.surface
                  FillPortions: =0
                  Height: =lblSelTitulo.Height + galProd.Height + lblSelNota.Height + 26
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =6
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =10
                  PaddingLeft: =14
                  PaddingRight: =14
                  PaddingTop: =12
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                Children:
                  - lblSelTitulo:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =gblC.muted2
                        FontWeight: =FontWeight.Bold
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =gblT.fxs
                        Text: ="APLICAR A ESTOS PRODUCTOS"
                  - galProd:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        FillPortions: =0
                        Height: =CountRows(colProdInt) * If(gblScale = 1, 52,gblScale = 1.2,58,gblScale = 1.45,66,74)
                        Items: =colProdInt
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        ShowScrollbar: =false
                        TemplatePadding: =0
                        TemplateSize: =If(gblScale = 1, 52,gblScale = 1.2,58,gblScale = 1.45,66,74)
                      Children:
                        - conProdRow:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Height: =Parent.TemplateHeight
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =11
                              PaddingLeft: =2
                              PaddingRight: =2
                              Width: =Parent.TemplateWidth
                            Children:
                              - icoChk:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    Color: =If(ThisItem.sel, gblC.accent, gblC.muted)
                                    Height: =Parent.Height
                                    Size: =20*gblScale
                                    Text: =If(ThisItem.sel, "☑", "☐")
                                    Width: =If(gblScale = 1 , 30, 50)
                              - conProdInfo:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =1
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                  Children:
                                    - lblProdName:
                                        Control: Label@2.5.1
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          AutoHeight: =true
                                          Color: =gblC.ink
                                          FillPortions: =1
                                          FontWeight: =FontWeight.Bold
                                          LayoutMinHeight: =20
                                          LayoutMinWidth: =16
                                          Size: =gblT.fbase
                                          Text: =ThisItem.cta.sanic_cm_ct_tipoproducto
                                    - lblProdNum:
                                        Control: Label@2.5.1
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          AutoHeight: =true
                                          Color: =gblC.muted
                                          FillPortions: =1
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          Size: =gblT.fxs
                                          Text: =PanMasc(ThisItem.cta.sanic_cm_ct_ultimos4)
                              - lblActBadge:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Color: =gblC.accentInk
                                    Fill: =gblC.accentBg
                                    FontWeight: =FontWeight.Bold
                                    RadiusBottomLeft: =12
                                    RadiusBottomRight: =12
                                    RadiusTopLeft: =12
                                    RadiusTopRight: =12
                                    Size: =gblT.f2xs
                                    Text: ="ACTUAL"
                                    Visible: =ThisItem.esActual
                                    Width: =90
                        - btnRow:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =ButtonAppearance.Transparent
                              DisplayMode: =If(ThisItem.esActual || tpPago.Value || tgDatos.Value, DisplayMode.Disabled, DisplayMode.Edit)
                              Height: =Parent.TemplateHeight
                              OnSelect: |-
                                =With(
                                    { tn: ThisItem.'CM | TBL | Asignacion', ts: ThisItem.sel },
                                    UpdateIf(colProdInt, 'CM | TBL | Asignacion' = tn, { sel: !ts }))
                              Text: =
                              Width: =Parent.TemplateWidth
                  - lblSelNota:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =gblC.muted
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingTop: =2
                        Size: =gblT.f2xs
                        Text: |-
                          =If(tpPago.Value || tgDatos.Value, "🔒 Con pago o datos, solo aplica a esta cuenta.", If(CountRows(Filter(colProdInt, sel)) > 1, "Pago y actualización de datos quedan deshabilitados (son por 1 cuenta).", CountRows(Filter(colProdInt, sel)) & " producto(s) seleccionado(s)."))
            - Container16_4:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =gblC.surface
                  FillPortions: =0
                  Height: =lblPagoT.Height + conFila_DiasMora_3.Height + If(secPago.Visible, secPago.Height) +  16
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                Children:
                  - conFila_DiasMora_3:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =If(gblScale = 1, 35,gblScale = 1.2,40,gblScale = 1.45,45,50)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                        PaddingBottom: =8
                        PaddingTop: =8
                        Width: =Parent.Width
                      Children:
                        - lblPagoT:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              AutoHeight: =true
                              Color: =gblC.ink
                              FillPortions: =1
                              FontWeight: =FontWeight.Semibold
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Size: =gblT.fbase
                              Text: |-
                                ="💵 Aplica pago"
                        - tpPago:
                            Control: Classic/Toggle@2.1.0
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              DisplayMode: =If(CountRows(Filter(colProdInt, sel)) > 1, DisplayMode.Disabled, DisplayMode.Edit)
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnCheck: |-
                                =UpdateIf(colProdInt, !esActual, {sel: false})
                              ShowLabel: =false
                              Width: =70
                  - lblPagoD:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =gblC.muted2
                        FontWeight: =FontWeight.Semibold
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =gblT.fxs
                        Text: ="El cliente pagó algo en esta visita"
                  - secPago:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =gblC.accent
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =3
                        DropShadow: =DropShadow.None
                        FillPortions: =
                        Height: =lblPagoTit.Height + btnAddPago.Height + galLineasPago.Height + 40
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =2
                        PaddingLeft: =12
                        PaddingTop: =2
                        Visible: =tpPago.Value
                      Children:
                        - lblPagoTit:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =gblC.accent
                              FontWeight: =FontWeight.Bold
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Size: =gblT.fsm
                              Text: ="Pago(s)"
                        - galLineasPago:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              BorderThickness: =3
                              FillPortions: =0
                              Height: =Self.AllItemsCount * Self.TemplateHeight
                              Items: =colLineasPago
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              TemplatePadding: =
                              TemplateSize: =170
                              Width: =App.Width - 64
                            Children:
                              - conLinea:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =gblC.cardBorder
                                    BorderThickness: =2
                                    DropShadow: =DropShadow.None
                                    Fill: =gblC.surface
                                    Height: =Parent.TemplateHeight - 10
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =8
                                    PaddingBottom: =10
                                    PaddingLeft: =10
                                    PaddingRight: =10
                                    PaddingTop: =10
                                    RadiusBottomLeft: =10
                                    RadiusBottomRight: =10
                                    RadiusTopLeft: =10
                                    RadiusTopRight: =10
                                    Width: =App.Width - 68
                                  Children:
                                    - fila 1:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          PaddingBottom: =8
                                          PaddingLeft: =8
                                          PaddingRight: =8
                                          PaddingTop: =8
                                        Children:
                                          - txtMonto:
                                              Control: ModernNumberInput@1.1.1
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Default: =ThisItem.monto
                                                FillPortions: =1
                                                LayoutMinHeight: =16
                                                LayoutMinWidth: =16
                                                OnChange: |-
                                                  =Patch(colLineasPago, ThisItem, {monto: Value(Self.Value)})
                                          - Dropdown1:
                                              Control: ModernDropdown@1.0.2
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Default: |-
                                                  ={Value: ThisItem.moneda}
                                                FillPortions: =1
                                                ItemDisplayText: =ThisItem.Value
                                                Items: =["NIO","USD"]
                                                LayoutMinHeight: =16
                                                LayoutMinWidth: =16
                                                OnChange: |-
                                                  =Patch(colLineasPago, ThisItem, {moneda: Self.Selected.Value})
                                    - fila 2:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          PaddingBottom: =8
                                          PaddingLeft: =8
                                          PaddingRight: =8
                                          PaddingTop: =8
                                        Children:
                                          - txtRecibo:
                                              Control: ModernTextInput@1.1.1
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Default: =ThisItem.recibo
                                                FillPortions: =1
                                                LayoutMinHeight: =16
                                                LayoutMinWidth: =16
                                                OnChange: |-
                                                  =Patch(colLineasPago, ThisItem, {recibo: Self.Text})
                                                Placeholder: ="N° de recibo"
                                          - btnQuitar:
                                              Control: Classic/Button@2.2.0
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                BorderStyle: =BorderStyle.None
                                                Color: =gblC.redInk
                                                Fill: =gblC.redBg
                                                LayoutMinHeight: =16
                                                LayoutMinWidth: =16
                                                OnSelect: =Remove(colLineasPago, ThisItem)
                                                Text: ="✕"
                                                Width: =42
                        - btnAddPago:
                            Control: Classic/Button@2.2.0
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              BorderColor: =gblC.cardBorder
                              BorderStyle: =BorderStyle.Dashed
                              Color: =gblC.accent
                              Fill: =gblC.chipBg
                              Height: =60
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnSelect: =Collect(colLineasPago, {monto:0, moneda:"NIO", recibo:""})
                              PaddingBottom: =11
                              PaddingLeft: =11
                              PaddingRight: =11
                              PaddingTop: =11
                              Text: ="＋ Agregar pago"
            - rowDatos:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =gblC.surface
                  FillPortions: =0
                  Height: =lblPagoT_1.Height + conFila_DiasMora_4.Height + If(secDatos.Visible, secDatos.Height) +  48
                  LayoutAlignItems: =LayoutAlignItems.Center
