            - btnRegistrar_1:
                Control: Classic/Button@2.2.0
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  BorderStyle: =BorderStyle.None
                  Color: =gblC.white
                  DisplayMode: |
                    =If(!IsBlank(txtComentario.Text)
                          && (!tpPago.Value || CountRows(Filter(colLineasPago, monto>0 && !IsBlank(Trim(recibo))))>0)
                          && (!tgDatos.Value || Or(!IsBlank(inTelCasa.Text), !IsBlank(inTelCel.Text), !IsBlank(inTelTrab.Text),
                                                   !IsBlank(inDirCasa.Text), !IsBlank(inDirEC.Text), !IsBlank(inDirTrab.Text),
                                                   !IsBlank(inCorreo.Text))),
                          DisplayMode.Edit, DisplayMode.Disabled)
                  Fill: =gblC.teal
                  FontWeight: =FontWeight.Bold
                  Height: =If(gblScale = 1, 54,gblScale = 1.2,60,gblScale = 1.45,68,76)
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnSelect: |-
                    =If(tpPago.Value || tgDatos.Value,
                        /* UNA cuenta (pago o datos) */
                        Set(varInt, Patch('CM | TBL | Interaccions', Defaults('CM | TBL | Interaccions'), {
                            '[IN] Cuenta': varCuenta,
                            '[IN] Agente': gblAgente,
                            '[IN] Comentario': txtComentario.Text,
                            '[IN] Aplica pago': tpPago.Value,
                            '[IN] Actualiza info': tgDatos.Value,
                            '[IN] Latitud': Location.Latitude,
                            '[IN] Longitud': Location.Longitude,
                            'Fecha de captura': Now(),
                            '[IN] NombreAgente': Coalesce(gblAgente.'[AG] Nombre', "Sin nombre") }));
                        If(tpPago.Value, ForAll(Filter(colLineasPago, monto > 0) As L,
                            Patch('CM | TBL | Pagos', Defaults('CM | TBL | Pagos'), {
                                '[PG] Interaccion': varInt,
                                '[PG] Numero Interaccion': varInt.'[IN] Numero de Interaccion',
                                Cuenta: varCuenta,
                                '[PG] Monto': L.monto,
                                '[PG] Moneda': Switch(L.moneda, "USD", 'Choice | CM | Monedas en Pago'.USD, 'Choice | CM | Monedas en Pago'.NIO),
                                '[PG] Numero recibo': L.recibo })));
                        If(tgDatos.Value, Patch('CM | TBL | Actualizacion de datos', Defaults('CM | TBL | Actualizacion de datos'), {
                            '[AD] Interaccion': varInt,
                            '[AD] Telefono Casa': inTelCasa.Text,
                            '[AD] Telefono Celular': inTelCel.Text,
                            '[AD] Telefono trabajo': inTelTrab.Text,
                            '[AD] Direccion casa': inDirCasa.Text,
                            '[AD] Direccion EC': inDirEC.Text,
                            '[AD] Direccion trabajo': inDirTrab.Text,
                            '[AD] Correo electronico': inCorreo.Text })),
                        /* MULTI: una interacción por producto tildado, sin pago/datos */
                        ForAll(Filter(colProdInt, sel) As P,
                            Patch('CM | TBL | Interaccions', Defaults('CM | TBL | Interaccions'), {
                                '[IN] Cuenta': P.cta,
                                '[IN] Agente': gblAgente,
                                '[IN] Comentario': txtComentario.Text,
                                '[IN] Aplica pago': false,
                                '[IN] Actualiza info': false,
                                '[IN] Latitud': Location.Latitude,
                                '[IN] Longitud': Location.Longitude,
                                'Fecha de captura': Now(),
                                '[IN] NombreAgente': Coalesce(gblAgente.'[AG] Nombre', "Sin nombre") })));
                    Set(varCom, "");
                    Notify(If(Connection.Connected, "✓ Guardado. Se sube en la próxima sincronización.", "✓ Guardado en el teléfono. Se sube cuando vuelva la señal."), NotificationType.Success);
                    Back()
                  PaddingBottom: =14
                  PaddingLeft: =14
                  PaddingRight: =14
                  PaddingTop: =14
                  Size: =gblT.fmd
                  Text: =If(tpPago.Value || tgDatos.Value, "Guardar interacción" & If(tpPago.Value," + pago","") & If(tgDatos.Value," + datos",""), "Guardar en " & CountRows(Filter(colProdInt, sel)) & " producto" & If(CountRows(Filter(colProdInt, sel))>1,"s",""))
            - lblHint:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  AutoHeight: =true
                  Color: =gblC.hint
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Size: =gblT.fxs
                  Text: |-
                    =With(
                        {
                            varCondicionPago: ((tpPago.Value && CountRows(
                                Filter(
                                    colLineasPago,
                                    monto <= 0 || IsBlank(Trim(recibo))
                                )
                            ) > 0) || (tpPago.Value && CountRows(colLineasPago) = 0)),
                            varCondicionInteracion: IsBlank(txtComentario.Text),
                            varCondicionActualizacion: tgDatos.Value && And(
                                IsBlank(inTelCasa.Text),
                                IsBlank(inTelCel.Text),
                                IsBlank(inTelTrab.Text),
                                IsBlank(inDirCasa.Text),
                                IsBlank(inDirEC.Text),
                                IsBlank(inDirTrab.Text),
                                IsBlank(inCorreo.Text)
                            )
                        },
                        If(
                            varCondicionPago || varCondicionInteracion || varCondicionActualizacion,
                            "Falta: "
                        ) & If(
                            IsBlank(txtComentario.Text),
                            "comentario ",
                            ""
                        ) & If(
                            ((tpPago.Value && CountRows(
                                Filter(
                                    colLineasPago,
                                    monto <= 0 || IsBlank(Trim(recibo))
                                )
                            ) > 0) || (tpPago.Value && CountRows(colLineasPago) = 0)),
                            "· Información de pago "
                        ) & If(
                            tgDatos.Value && And(
                                IsBlank(inTelCasa.Text),
                                IsBlank(inTelCel.Text),
                                IsBlank(inTelTrab.Text),
                                IsBlank(inDirCasa.Text),
                                IsBlank(inDirEC.Text),
                                IsBlank(inDirTrab.Text),
                                IsBlank(inCorreo.Text)
                            ),
                            "· Información personal a actualizar"
                        )
