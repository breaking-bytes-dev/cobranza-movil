ComponentDefinitions:
  cmpNav:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    Properties:
      Height: =64
    Children:
      - Container1:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderColor: =gblC.cardBorder
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =gblC.white
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            Width: =Parent.Width
            Y: =1
          Children:
            - contHome:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =3
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                Children:
                  - icoHome:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: |-
                          ="Inicio"
                        Color: =If(App.ActiveScreen = scrInicio, gblC.teal, gblC.muted2)
                        FillPortions: =1
                        Icon: =Icon.Home
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: =If(App.ActiveScreen = scrCartera, Back(), App.ActiveScreen <> scrInicio, Navigate(scrInicio))
                        TabIndex: =0
                  - lblHome:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =If(App.ActiveScreen = scrInicio, gblC.teal, gblC.muted2)
                        FontWeight: =If(App.ActiveScreen = scrInicio, FontWeight.Bold, FontWeight.Normal)
                        Height: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =16
                        OnSelect: =If(App.ActiveScreen = scrCartera, Back(), App.ActiveScreen <> scrInicio, Navigate(scrInicio))
                        PaddingBottom: =0
                        PaddingTop: =0
                        Size: =gblT.f2xs
                        Text: ="Inicio"
            - contCartera:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =3
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                Children:
                  - icoLedger:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: |-
                          ="Cartera"
                        Color: =If(App.ActiveScreen = scrCartera, gblC.teal, gblC.muted2)
                        FillPortions: =1
                        Icon: =Icon.Hamburger
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: =If(App.ActiveScreen <> scrCartera, Navigate(scrCartera))
                        TabIndex: =0
                  - lblLedger:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =If(App.ActiveScreen = scrCartera, gblC.teal, gblC.muted2)
                        FontWeight: =If(App.ActiveScreen = scrCartera, FontWeight.Bold, FontWeight.Normal)
                        Height: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =16
                        OnSelect: =If(App.ActiveScreen <> scrCartera, Navigate(scrCartera))
                        PaddingBottom: =0
                        PaddingTop: =0
                        Size: =gblT.f2xs
                        Text: ="Cartera"
