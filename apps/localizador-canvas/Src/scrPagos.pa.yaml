Screens:
  scrPagos:
    Children:
      - conMaster_5:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =gblC.screen
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =20
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            Width: =Parent.Width
          Children:
            - conHeaderBac_3:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Start
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =If(gblScale = 1, 120,gblScale = 1.2,130,gblScale = 1.45,150,170)
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Width: =Parent.Width - Parent.PaddingLeft * 2
                Children:
                  - cmpHeaderBack_4:
                      Control: CanvasComponent
                      ComponentName: cmpHeaderBack
                      Properties:
                        Height: =Parent.Height
                        Subtitulo: ="Por cuenta y por moneda"
                        Titulo: ="Pagos de Hoy"
                        Width: =Parent.Width
                  - Button1_6:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Ajustes de tema y tamaño de letra"
                        Appearance: =ButtonAppearance.Transparent
                        BorderColor: =RGBA(255,255,255,0.45)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        Color: =gblC.white
                        FontWeight: =FontWeight.Bold
                        Height: =If(gblScale = 1, 30,gblScale = 1.2,34,gblScale = 1.45,40,46)
                        OnSelect: =Set(varSheetEscala, true)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        RadiusBottomLeft: =9
                        RadiusBottomRight: =9
                        RadiusTopLeft: =9
                        RadiusTopRight: =9
                        Size: =gblT.fmd
                        Text: ="Aa"
                        Width: =If(gblScale = 1, 50,gblScale = 1.2,60,gblScale = 1.45,70,80)
                        X: =Parent.Width - Self.Width - 14
                        Y: =Self.Height - 20
            - cardTotalCli_3:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =gblC.accentBorder
                  BorderThickness: =1
                  Fill: =gblC.accentBg
                  FillPortions: =0
                  Height: '=lblTL_3.Height + lblTB_3.Height + 30 '
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =14
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =14
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  X: =40
                  Y: =40
                Children:
                  - lblTL_3:
                      Control: Label@2.5.1
                      Properties:
                        AutoHeight: =true
                        Color: =gblC.muted2
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =gblT.fxs
                        Text: ="Total cobrado"
                  - lblTB_3:
                      Control: Label@2.5.1
                      Properties:
                        AutoHeight: =true
                        Color: =gblC.accent
                        FontWeight: =FontWeight.Bold
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =gblT.fbig
                        Text: =Moneda(colCobN, colCobU)
            - galGrupos:
                Control: Gallery@2.15.0
                Variant: VariableHeight
                Properties:
                  AlignInContainer: =AlignInContainer.Center
                  TemplatePadding: =0
                  TemplateSize: |-
                    =// En una galería de alto variable es el alto MÍNIMO de la fila: chico para que cada tarjeta mida lo que su contenido
                    20
                  Items: |-
                    =GroupBy(AddColumns(AddColumns(AddColumns(colPagHoy,
                               ctaId,  Cuenta.'CM | TBL | Cuenta'),
                               ctaRec, LookUp('CM | TBL | Cuentas', 'CM | TBL | Cuenta' = ctaId)),
                               cliNom, ctaRec.'Nombre Cliente',
                               prod,   ctaRec.'Tipo Producto',
                               u4,     ctaRec.'Últimos 4'),
                             cliNom,prod,ctaId,u4,Lineas)
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Width: =Parent.Width - Parent.PaddingLeft*2
                Children:
                  - cmpTarjeta:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =gblC.surface
                        Height: =lblGCli.Height + lblGProd.Height + galLineas.Height + 20
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        Width: =App.Width - 20 - 32
                        X: =10
                        Y: =10
                      Children:
                        - lblGCli:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =gblC.muted2
                              FontWeight: =FontWeight.Bold
                              LayoutMinWidth: =
                              Size: =gblT.fxs
                              Text: =ThisItem.cliNom
                              X: =40
                              Y: =40
                        - lblGProd:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =gblC.muted
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Size: =gblT.fxs
                              Text: =If(IsBlank(ThisItem.prod), "", ThisItem.prod & " · ") & PanMasc(ThisItem.u4)
                        - galLineas:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              FillPortions: =0
                              Height: |-
                                =// Mismo alto que TemplateSize: si no coinciden quedan huecos entre los pagos y al pie de la tarjeta
                                Self.AllItemsCount * Self.TemplateHeight
                              Items: =ThisItem.Lineas
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              TemplatePadding: =0
                              TemplateSize: =If(gblScale = 1, 52,gblScale = 1.2,60,gblScale = 1.45,72,84)
                            Children:
                              - conLin:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Height: =Parent.TemplateHeight
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    PaddingBottom: =4
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =4
                                    Width: =Parent.TemplateWidth
                                  Children:
                                    - lblLV:
                                        Control: Label@2.5.1
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Start
                                          AutoHeight: =true
                                          Color: =gblC.ink
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          PaddingBottom: =0
                                          PaddingTop: =0
                                          Size: =gblT.fbase
                                          Text: =If(Text(ThisItem.'[PG] Moneda')="USD","US$ ","C$ ") & Text(ThisItem.'[PG] Monto',"#,##0.00", "en-US")
                                          VerticalAlign: =VerticalAlign.Top
                                          Width: =Parent.Width - 16
                                    - lblLR:
                                        Control: Label@2.5.1
                                        Properties:
                                          AutoHeight: =true
                                          Color: =gblC.muted2
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          PaddingBottom: =0
                                          PaddingTop: =0
                                          Size: =gblT.f2xs
                                          Text: ="Recibo " & ThisItem.'[PG] Numero recibo' & " · " & Text(ThisItem.'Fecha del pago', "hh:mm")
                                          VerticalAlign: =VerticalAlign.Top
                                          Width: =Parent.Width - 16
      - cmpSheet_6:
          Control: CanvasComponent
          ComponentName: cmpSheet
          Properties:
            Height: =Parent.Height
            Visible: =varSheetEscala
            Width: =Parent.Width
