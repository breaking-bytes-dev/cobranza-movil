                              OnSelect: |-
                                =// APP-13: primero el orden; si no se pudo guardar, no se recarga (se perdería) y se avisa.
                                // Cada escritura se verifica aparte (ver scrCargaArchivo): okOrden es true solo si NINGÚN UpdateIf falló.
                                UpdateContext({okOrden: IfError(
                                    With({ p: Max(Filter(colClientes, dirty), orden) },
                                        If(IsBlank(p), true,
                                            With({ fallas: Concat(
                                                    ForAll(Filter(colClientes, orden <= p && Coalesce(ordGuardado, 0) <> orden) As C,
                                                        Concat(
                                                            ForAll(Filter(colAsig, cid = C.cid) As A,
                                                                IfError(
                                                                    UpdateIf('CM | TBL | Asignacions',
                                                                        'CM | TBL | Asignacion' = A.'CM | TBL | Asignacion',
                                                                        { '[AS] Orden': C.orden }),
                                                                    Coalesce(FirstError.Message, "sin detalle") & " ",
                                                                    "")),
                                                            Value)),
                                                    Value) },
                                                // Solo si TODAS las escrituras salieron bien se marca el tramo como guardado (dirty = false); si no, se reintenta.
                                                If(IsBlank(fallas), UpdateIf(colClientes, orden <= p, { ordGuardado: orden, dirty: false }));
                                                IsBlank(fallas)))),
                                    false)});
                                If(okOrden,
                                    Select(btnCargarCartera),
                                    Notify("No se pudo guardar el orden de la cartera; no se recargó para no perderlo. Reintentá con señal.", NotificationType.Warning))
