      - btnCargarCartera:
          Control: Classic/Button@2.2.0
          Properties:
            OnSelect: |-
              =// ESCALA: la cartera se trae por TRAMOS (el servidor reparte asignaciones y cuentas en 20, TramoCartera). Una sola
              // consulta se cortaba en el límite de filas de la app (2000): con 2.340 asignaciones faltaban clientes y cada carga
              // mostraba un trozo distinto. Cada tramo queda muy por debajo del límite (hasta 40.000 por cobrador). Las
              // direcciones y los teléfonos ya no se copian: se leen de la base del teléfono al mostrarlos.
              UpdateContext({varshowLoader: true});
              Clear(colAsigRaw);
              Clear(colCuentas);
              ForAll(Sequence(20, 0) As T,
                  Collect(colAsigRaw, Filter('CM | TBL | Asignacions', '[AS] Tramo' = T.Value && '[AS] Estado' = true && ('[AS] Tipo' <> 'Choice | CM | Tipo asignacion'.Especial || '[AS] Estado de aprobacion' = 'Choice | CM | Estado aprobacion especial'.Aprobado)));
                  Collect(colCuentas, Filter('CM | TBL | Cuentas', '[CT] Tramo' = T.Value)));
              // Lo que todavía no tiene tramo (anterior al plugin, o la cuenta recién creada: su tramo se pone en segundo plano).
              Collect(colAsigRaw, Filter('CM | TBL | Asignacions', '[AS] Tramo' = Blank() && '[AS] Estado' = true && ('[AS] Tipo' <> 'Choice | CM | Tipo asignacion'.Especial || '[AS] Estado de aprobacion' = 'Choice | CM | Estado aprobacion especial'.Aprobado)));
              Collect(colCuentas, Filter('CM | TBL | Cuentas', '[CT] Tramo' = Blank()));
              // APP-01: si una consulta llegó al límite, falta cartera: se avisa la verdad (sincronizar no lo arregla).
              Set(varCarteraIncompleta,
                  Max(ForAll(Sequence(21, 0) As T,
                      CountRows(Filter(colAsigRaw, If(T.Value = 20, IsBlank('[AS] Tramo'), '[AS] Tramo' = T.Value)))), Value) >= 2000
                  || Max(ForAll(Sequence(21, 0) As T,
                      CountRows(Filter(colCuentas, If(T.Value = 20, IsBlank('[CT] Tramo'), '[CT] Tramo' = T.Value)))), Value) >= 2000);
              If(varCarteraIncompleta,
                  Notify("Tu cartera es más grande de lo que la app puede mostrar y faltan clientes. Avisá a soporte.", NotificationType.Error));
              // APP-08: las Especiales solo se gestionan aprobadas (el servidor tampoco deja asignar agente antes).
              ClearCollect(colAsig,
                  AddColumns(
                     AddColumns(colAsigRaw,
                        cta, LookUp(colCuentas, 'CM | TBL | Cuenta' = '[AS] Cuenta'.'CM | TBL | Cuenta')),
                     cid,      cta.'CIF Cliente',
                     cliNom,   cta.'Nombre Cliente',
                     // Studio tipa el registro anidado cta solo con las columnas referenciadas acá: ult4 se calcula aquí.
                     ult4,     cta.'Últimos 4',
                     saldoNio, cta.'[CT] Saldo Vencido NIO',
                     saldoUsd, cta.'[CT] Saldo Vencido USD',
                     diasMora, cta.'[CT] Dias Mora',
                     ctaId,    cta.'CM | TBL | Cuenta',
                     ord,      '[AS] Orden',
                     ultCarga, 'Última carga'));
              // DAT-15: el saldo se suma por CUENTA distinta (una cuenta con Diaria y Especial aprobada tiene 2 asignaciones con el
              // mismo saldo). F4: nCuentas también cuenta CUENTAS distintas, igual que la pestaña Cuentas del Cliente.
              ClearCollect(colClientes,
                  AddColumns(
                     GroupBy(Filter(colAsig, !IsBlank(cid)), cid, cliNom, Asigs),
                     orden,    Min(Asigs, ord),
                     totNio,   Sum(ForAll(Distinct(Asigs, ctaId) As C, LookUp(Asigs, ctaId = C.Value).saldoNio), Value),
                     totUsd,   Sum(ForAll(Distinct(Asigs, ctaId) As C, LookUp(Asigs, ctaId = C.Value).saldoUsd), Value),
                     maxDias,  Max(Asigs, diasMora),
                     nCuentas, CountRows(Distinct(Asigs, ctaId)),
                     ordGuardado, Min(Asigs, ord),
                     dirty,   false));
              // APP-15: una asignación cuya cuenta no llegó al teléfono no se agrupa con otras; se avisa.
              If(CountRows(Filter(colAsig, IsBlank(cid))) > 0,
                 Notify(CountRows(Filter(colAsig, IsBlank(cid))) & " asignación(es) sin datos de la cuenta. Sincronizá para completarlas.", NotificationType.Warning));
              // Orden 1..n sin empates ni vacíos (APP-23). Los que no tienen orden (asignaciones nuevas; Min() de vacíos da 0)
              // van al final, alfabéticos. La numeración NO marca dirty: solo ▲▼ marcan, y al guardar se escribe el tramo de arriba.
              With({ lista: SortByColumns(AddColumns(colClientes, sinOrden, Coalesce(orden, 0) <= 0),
                                          "sinOrden", SortOrder.Ascending, "orden", SortOrder.Ascending, "cliNom", SortOrder.Ascending) },
                 ForAll(Sequence(CountRows(lista)) As N,
                    With({ r: Index(lista, N.Value) },
                       If(Coalesce(r.orden, 0) <> N.Value,
                          Patch(colClientes, LookUp(colClientes, cid = r.cid), { orden: N.Value })))));
              Set(varCarteraLista, true);
              Set(varRecargarCartera, false);
              Set(varNAsigCartera, CountRows(colAsigRaw));
              Set(varFechaUltimaActualizacion, Now());
              UpdateContext({varshowLoader: false})
            Visible: =false
