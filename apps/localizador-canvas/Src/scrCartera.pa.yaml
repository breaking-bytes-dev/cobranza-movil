Screens:
  scrCartera:
    Properties:
      Fill: =gblC.screen
      OnHidden: |-
        =// ESCALA: el orden 1..n vive en memoria; solo se guarda cuando el cobrador movió un cliente (dirty), y solo el tramo de
        // arriba hasta la posición más baja que movió (p). Lo de abajo ya tiene un orden guardado mayor o va al final alfabético,
        // así que la lista se ve igual en la próxima carga. Antes se reescribía toda la cartera (2.336 escrituras, más de 10 min).
        // Cada escritura se verifica aparte (ver scrCargaArchivo): ForAll devuelve el error de cada UpdateIf (texto vacío = salió bien)
        // y el orden NO se marca como guardado si alguna falló (antes se marcaba igual y se perdía sin aviso).
        If(!IfError(
            With({ p: Max(Filter(colClientes, dirty), orden) },
                If(IsBlank(p), true,
                    With({ fallas: Concat(
                            ForAll(Filter(colClientes, orden <= p && Coalesce(ordGuardado, 0) <> orden) As C,
                                Concat(
                                    ForAll(Filter(colAsig, cid = C.cid) As A,
                                        IfError(
                                            UpdateIf('CM | TBL | Asignacions',
                                                'CM | TBL | Asignacion' = A.'CM | TBL | Asignacion',
                                                { '[AS] Orden': C.orden }),
                                            Coalesce(FirstError.Message, "sin detalle") & " ",
                                            "")),
                                    Value)),
                            Value) },
                        // Solo si TODAS las escrituras salieron bien se marca el tramo como guardado (dirty = false); si no, se reintenta.
                        If(IsBlank(fallas), UpdateIf(colClientes, orden <= p, { ordGuardado: orden, dirty: false }));
                        IsBlank(fallas)))),
            false),
            Notify("No se pudo guardar el orden de la cartera. Se reintenta al salir de nuevo.", NotificationType.Warning))
      OnVisible: |-
        =// La cartera se arma en btnCargarCartera (también la usan ↻ y Sincronización): al entrar la primera vez o si se pidió recargar.
        // O5: la lista es una foto; si la base del teléfono ya tiene otra cantidad de asignaciones (el delta sync trajo una
        // aprobada o quitó una cerrada), se rearma. Con la cartera truncada (varCarteraIncompleta) nunca coincidiría: no se compara.
        If(!varCarteraLista || varRecargarCartera
            || (!varCarteraIncompleta && varNAsigCartera <> CountRows(Filter('CM | TBL | Asignacions', '[AS] Estado' = true && ('[AS] Tipo' <> 'Choice | CM | Tipo asignacion'.Especial || '[AS] Estado de aprobacion' = 'Choice | CM | Estado aprobacion especial'.Aprobado)))),
            Select(btnCargarCartera))
    Children:
      - cmpNav_2:
          Control: CanvasComponent
          ComponentName: cmpNav
          Properties:
            Height: =64
            Y: =Parent.Height - Self.Height
      - tmrSync_Cart:
          Control: Timer@2.1.0
          Properties:
            AutoPause: =false
            AutoStart: =true
            Duration: =5000
            OnTimerEnd: |-
              =// O5: ninguna función de Power Fx baja datos; los trae el reproductor (al abrir, cada ~5 min o con «Actualizar»
              // del Estado del dispositivo). Cuando una sincronización termina (gblSync deja "sync"), la cartera y el cliente
              // se rearman con lo que llegó. AutoPause false: sigue mirando aunque el cobrador esté en otra pantalla.
              // Con cambios de orden sin guardar no se rearma acá (se perderían): queda marcado y se rearma al volver.
              If(varSyncPrev = "sync" && gblSync <> "sync",
                  Set(varCliCargado, Blank());
                  If(App.ActiveScreen = scrCartera && CountIf(colClientes, dirty) = 0,
                      Select(btnCargarCartera),
                      Set(varRecargarCartera, true)));
              Set(varSyncPrev, gblSync)
            Repeat: =true
            Visible: =false
