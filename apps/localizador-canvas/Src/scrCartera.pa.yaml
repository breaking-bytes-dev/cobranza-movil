Screens:
  scrCartera:
    Properties:
      Fill: =gblC.screen
      OnHidden: |-
        =IfError(
            ForAll(Filter(colClientes, dirty) As C,
                 ForAll(Filter(colAsig, cid = C.cid) As A,
                    UpdateIf('CM | TBL | Asignacions',
                       'CM | TBL | Asignacion' = A.'CM | TBL | Asignacion',
                       { '[AS] Orden': C.orden })));
              UpdateIf(colClientes, dirty, { dirty: false }),
            Notify("No se pudo guardar el orden de la cartera. Se reintenta al salir de nuevo.", NotificationType.Warning))
      OnVisible: |-
        =  If(!varCarteraLista || varRecargarCartera,
          UpdateContext({varshowLoader: true});
         ClearCollect(colAsigRaw, Filter('CM | TBL | Asignacions', '[AS] Estado' = true));
         ClearCollect(colAsig,
             AddColumns(
                AddColumns(colAsigRaw,
                   cta, LookUp(colCuentas, 'CM | TBL | Cuenta' = '[AS] Cuenta'.'CM | TBL | Cuenta')),
                cid,      cta.'CIF Cliente',
                cliNom,   cta.'Nombre Cliente',
                // Studio tipa el registro anidado cta solo con las columnas referenciadas acá: ult4 se calcula aquí.
                ult4,     cta.'Últimos 4',
                saldoNio, cta.'[CT] Saldo Vencido NIO',
                saldoUsd, cta.'[CT] Saldo Vencido USD',
                diasMora, cta.'[CT] Dias Mora',
                ord,      '[AS] Orden'));

          ClearCollect(colClientes,
             AddColumns(
                GroupBy(colAsig, cid, cliNom, Asigs),
                orden,    Min(Asigs, ord),
                totNio,   Sum(Asigs, saldoNio),
                totUsd,   Sum(Asigs, saldoUsd),
                maxDias,  Max(Asigs, diasMora),
                nCuentas, CountRows(Asigs),
                dirCasa,  LookUp(colDirecciones, '[DR] CIF' = cid && '[DR] Tipo'="Casa").'[DR] Direccion',
                dirTrab,  LookUp(colDirecciones, '[DR] CIF' = cid && '[DR] Tipo'="Trabajo").'[DR] Direccion',
                dirty,   false));
          // Clientes sin [AS] Orden (asignaciones nuevas de la carga): se les asigna un orden único al final de la lista,
          // si no las flechas no tienen con quién intercambiar. dirty → se guarda en Dataverse al salir (OnHidden).
          With({ base: Coalesce(Max(colClientes, orden), 0),
                 sinOrden: SortByColumns(Filter(colClientes, IsBlank(orden)), "cliNom", SortOrder.Ascending) },
             ForAll(Sequence(CountRows(sinOrden)) As N,
                Patch(colClientes, LookUp(colClientes, cid = Index(sinOrden, N.Value).cid), { orden: base + N.Value, dirty: true })));
            Set(varCarteraLista, true);
             Set(varRecargarCartera, false);
             Set(varFechaUltimaActualizacion, Now());
             UpdateContext({varshowLoader: false});
          )
    Children:
