Screens:
  scrSincronizacion:
    Properties:
      Fill: =gblC.screen
      OnVisible: |-
        =Set(varPend, CountRows(Filter('CM | TBL | Interaccions', IsBlank('[IN] Numero de Interaccion')))
                      + CountRows(Filter('CM | TBL | Pagos', IsBlank('[PG] Numero'))));
           // APP-20: capturas de hoy por la fecha de CAPTURA (la pone el teléfono; 'Created On' de un registro offline
           // lo pone el servidor al sincronizar, y comparar fecha y hora contra Today() solo matcheaba las 00:00).
           Set(varCapHoy, Sort(Filter('CM | TBL | Interaccions', 'Fecha de captura' >= Today() && 'Fecha de captura' < DateAdd(Today(), 1)), 'Fecha de captura', SortOrder.Descending))
    Children:
      - conMaster_6:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =gblC.screen
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =20
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            Width: =Parent.Width
          Children:
            - conHeaderBac_4:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Center
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =If(gblScale = 1, 120,gblScale = 1.2,130,gblScale = 1.45,150,170)
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                Children:
                  - cmpHeaderBack_5:
                      Control: CanvasComponent
                      ComponentName: cmpHeaderBack
                      Properties:
                        Height: =Parent.Height
                        Subtitulo: ="Estado de tus capturas"
                        Titulo: ="Sincronización"
                        Width: =Parent.Width
                  - Button1_7:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Ajustes de tema y tamaño de letra"
                        Appearance: =ButtonAppearance.Transparent
                        BorderColor: =RGBA(255,255,255,0.45)
                        BorderStyle: =BorderStyle.Solid
                        BorderThickness: =1
                        Color: =gblC.white
                        FontWeight: =FontWeight.Bold
                        Height: =If(gblScale = 1, 30,gblScale = 1.2,34,gblScale = 1.45,40,46)
                        OnSelect: =Set(varSheetEscala, true)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        RadiusBottomLeft: =9
                        RadiusBottomRight: =9
                        RadiusTopLeft: =9
                        RadiusTopRight: =9
                        Size: =gblT.fmd
                        Text: ="Aa"
                        Width: =If(gblScale = 1, 50,gblScale = 1.2,60,gblScale = 1.45,70,80)
                        X: =Parent.Width - Self.Width - 14
                        Y: =Self.Height - 20
            - cardEstado:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =Switch(gblSync, "ok", gblC.teal, "sync", gblC.teal, "pend", gblC.incobInk, "warn", gblC.incobInk, "error", gblC.redInk, gblC.offGray)
                  FillPortions: =0
                  Height: =Max(lblEico.Height,lblE1.Height + Label19.Height + 28)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
                  RadiusTopLeft: =16
                  RadiusTopRight: =16
                Children:
                  - lblEico:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.white
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =28*gblScale
                        Text: |-
                          =Switch(gblSync, "ok", "✓", "sync", "⟳", "pend", "🔼", "warn", "⚠", "error", "⚠", "📴")
                        Width: =55
                  - conEst:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                      Children:
                        - lblE1:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =gblC.white
                              FontWeight: =FontWeight.Bold
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =0
                              Size: =gblT.flg
                              Text: =Switch(gblSync, "ok", "Todo subido", "sync", "Sincronizando…", "pend", "Pendiente de subir", "warn", "Sincronizado con avisos", "error", "Error al sincronizar", "Sin conexión")
                              VerticalAlign: =VerticalAlign.Bottom
                        - Label19:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =gblC.white
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingTop: =0
                              Size: =gblT.fsm
                              Text: =Switch(gblSync, "ok", "No hay capturas por subir. Los cambios del servidor bajan solos cada ~5 min", "sync", "Intercambiando datos con el servidor…", "pend", "Hay capturas por subir", "warn", "Tocá «Actualizar todo desde el servidor» para ver el aviso", "error", "Tocá «Actualizar todo desde el servidor» para ver el error", "Se suben cuando vuelva la señal")
                              VerticalAlign: =VerticalAlign.Top
            - cardDet:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =gblC.cardBorder
                  BorderThickness: =1
                  Fill: =gblC.white
                  FillPortions: =0
                  Height: =cmpKV.Height + cmpKV_1.Height + cmpKV_2.Height + 20
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                Children:
                  - cmpKV:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =Max(lblK.Height, lblV.Height)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                      Children:
                        - lblK:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              Color: =gblC.muted
                              FillPortions: =1
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Size: =gblT.fbase
                              Text: =" Conexión"
                        - lblV:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Right
                              AutoHeight: =true
                              Color: =gblC.ink
                              FillPortions: =1
                              FontWeight: =FontWeight.Semibold
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Size: =gblT.fbase
                              Text: =If(Connection.Connected,"En línea","Sin señal")
                  - cmpKV_1:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =Max(lblK_1.Height, lblV_1.Height)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                      Children:
                        - lblK_1:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              Color: =gblC.muted
                              FillPortions: =1
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Size: =gblT.fbase
                              Text: ="Última sincronización"
                        - lblV_1:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Right
                              AutoHeight: =true
                              Color: =gblC.ink
                              FillPortions: =1
                              FontWeight: =FontWeight.Semibold
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Size: =gblT.fbase
                              Text: ="ver en «Actualizar todo desde el servidor»"
                  - cmpKV_2:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =Max(lblK_2.Height, lblV_2.Height)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                      Children:
                        - lblK_2:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              Color: =gblC.muted
                              FillPortions: =1
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Size: =gblT.fbase
                              Text: ="Pendientes por subir"
                        - lblV_2:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Right
                              AutoHeight: =true
                              Color: =gblC.ink
                              FillPortions: =1
                              FontWeight: =FontWeight.Semibold
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Size: =gblT.fbase
                              Text: =varPend & " captura(s)"
            - btnBuscar:
                Control: Classic/Button@2.2.0
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  BorderStyle: =BorderStyle.None
                  Color: =gblC.ink2
                  Fill: =gblC.chipBg
                  Height: =54
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnSelect: |-
                    =// O5: Refresh relee la base del TELÉFONO (no baja nada del servidor): rearma las pantallas con lo que ya llegó.
                    // Funciona sin señal. Lo que baja del servidor es «Actualizar todo desde el servidor».
                    Refresh('CM | TBL | Interaccions'); Refresh('CM | TBL | Pagos'); Refresh('CM | TBL | Actualizacion de datos'); Refresh('CM | TBL | Asignacions'); Refresh('CM | TBL | Cuentas'); Refresh('CM | TBL | PAN de cuentas'); Set(varRecargarCartera, true); Set(varCliCargado, Blank()); Set(varPend, CountRows(Filter('CM | TBL | Interaccions', IsBlank('[IN] Numero de Interaccion')))); Notify("Lista recargada con los datos del teléfono.", NotificationType.Information)
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  Text: ="↻ Recargar la lista"
            - btnSyncCompleta:
                Control: Classic/Button@2.2.0
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  BorderStyle: =BorderStyle.None
                  Color: =gblC.white
                  DisplayMode: =If(Connection.Connected, DisplayMode.Edit, DisplayMode.Disabled)
                  Fill: =gblC.teal
                  Height: =54
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnSelect: |-
                    =// O5: Power Fx no tiene una función que baje datos. Esto abre el Estado del dispositivo, cuyo botón de actualizar
                    // hace la sincronización completa (revisa cada registro del teléfono). Al terminar, tmrSync_Cart rearma la cartera.
                    ShowHostInfo(HostInfo.OfflineSync)
                  RadiusBottomLeft: =14
                  RadiusBottomRight: =14
                  RadiusTopLeft: =14
                  RadiusTopRight: =14
                  Text: =If(Connection.Connected, "⟳ Actualizar todo desde el servidor", "Sin conexión — no se puede actualizar")
                  Visible: =Host.OfflineEnabled
            - lblSyncCompletaHint:
                Control: Label@2.5.1
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  AutoHeight: =true
                  Color: =gblC.muted
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Size: =gblT.fxs
                  Text: ="Abre el estado del dispositivo; ahí tocá «Buscar actualizaciones» (Check for updates) para bajar todo lo nuevo y quitar lo que ya no te corresponde. Al volver, tu cartera se recarga sola."
                  Visible: =Host.OfflineEnabled
            - lblVersionSync:
                Control: Label@2.5.1
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  AutoHeight: =true
                  Color: =gblC.muted
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Size: =gblT.fxs
                  Text: |-
                    ="Versión de la app: " & nfVersion
            - lblCapTit:
                Control: Label@2.5.1
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  AutoHeight: =true
                  Color: =gblC.muted2
                  FontWeight: =FontWeight.Bold
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Size: =gblT.fxs
                  Text: ="Capturas de hoy"
                  Visible: =galCap.AllItemsCount>0
            - galCap:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  FillPortions: =0
                  Height: =Self.AllItemsCount * Self.TemplateHeight
                  Items: =varCapHoy
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  TemplatePadding: =
                  TemplateSize: =If(gblScale = 1, 100,gblScale = 1.2,116,gblScale = 1.45,136,156)
                  Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                Children:
                  - conCapRow:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =gblC.white
                        BorderThickness: =1
                        Fill: =gblC.white
                        Height: =Parent.TemplateHeight-20
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                        PaddingBottom: =12
                        PaddingLeft: =14
                        PaddingRight: =14
                        PaddingTop: =12
                        Width: =scrSincronizacion.Width - 36
                        X: =10
                        Y: =10
                      Children:
                        - Container25:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =1
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =8
                              PaddingLeft: =8
                              PaddingRight: =8
                              PaddingTop: =8
                            Children:
                              - lblCapN:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    FontWeight: =FontWeight.Semibold
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Size: =gblT.fbase
                                    Text: |-
                                      =// APP-50: sin la cuenta (borrada o ya no compartida) se muestran los últimos 4 que guardó la interacción
                                      With({ c: LookUp('CM | TBL | Cuentas', 'CM | TBL | Cuenta' = ThisItem.'[IN] Cuenta'.'CM | TBL | Cuenta') },
                                          If(IsBlank(c), "(cuenta ya no asignada) · " & PanMasc(ThisItem.'[IN] Últimos 4'),
                                              c.'Nombre Cliente' & If(IsBlank(c.'Tipo Producto'), "", " · " & c.'Tipo Producto')))
                                    Width: =Parent.Width
                              - lblCapH:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    Color: =gblC.muted
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Size: =gblT.fxs
                                    Text: =Text(ThisItem.'Fecha de captura', "hh:mm")
                                    Width: =Parent.Width
                        - Container26:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              FillPortions: =0
                              Height: =lblPendTag.Height
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              Width: =140
                            Children:
                              - lblPendTag:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =If(IsBlank(ThisItem.'[IN] Numero de Interaccion'), gblC.incobInk, ((ThisItem.'[IN] Aplica pago' && IsBlank(LookUp('CM | TBL | Pagos', '[PG] Interaccion'.'CM | TBL | Interaccion' = ThisItem.'CM | TBL | Interaccion'))) || (ThisItem.'[IN] Actualiza info' && IsBlank(LookUp('CM | TBL | Actualizacion de datos', '[AD] Interaccion'.'CM | TBL | Interaccion' = ThisItem.'CM | TBL | Interaccion')))), gblC.redInk, gblC.accentInk)
                                    Fill: =If(IsBlank(ThisItem.'[IN] Numero de Interaccion'), gblC.incobBg, ((ThisItem.'[IN] Aplica pago' && IsBlank(LookUp('CM | TBL | Pagos', '[PG] Interaccion'.'CM | TBL | Interaccion' = ThisItem.'CM | TBL | Interaccion'))) || (ThisItem.'[IN] Actualiza info' && IsBlank(LookUp('CM | TBL | Actualizacion de datos', '[AD] Interaccion'.'CM | TBL | Interaccion' = ThisItem.'CM | TBL | Interaccion')))), gblC.redBg, gblC.accentBg)
                                    FontWeight: =FontWeight.Bold
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Size: =gblT.fxs
                                    # F8: «subida» exige que también hayan llegado el pago y la actualización de datos; el teléfono
                                    # descarta en silencio lo que el servidor rechaza, así que la interacción sola no alcanza
                                    Text: =If(IsBlank(ThisItem.'[IN] Numero de Interaccion'), "pendiente de subir", ((ThisItem.'[IN] Aplica pago' && IsBlank(LookUp('CM | TBL | Pagos', '[PG] Interaccion'.'CM | TBL | Interaccion' = ThisItem.'CM | TBL | Interaccion'))) || (ThisItem.'[IN] Actualiza info' && IsBlank(LookUp('CM | TBL | Actualizacion de datos', '[AD] Interaccion'.'CM | TBL | Interaccion' = ThisItem.'CM | TBL | Interaccion')))), "⚠ incompleta", "subida")
            - cardNota:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =gblC.cardBorder
                  BorderThickness: =1
                  Fill: =gblC.noteBg
                  FillPortions: =0
                  Height: =lblNota.Height + 24
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =12
                  PaddingLeft: =14
                  PaddingRight: =14
                  PaddingTop: =12
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                Children:
                  - lblNota:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Justify
                        AutoHeight: =true
                        Color: =gblC.muted
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =gblT.fxs
                        Text: |-
                          ="El número de interacción (INT-) y de pago (PAG-) lo asigna el servidor cuando la captura se sube. Hasta entonces se ve «pendiente de subir». «⚠ incompleta»: la visita subió, pero falta su pago o su actualización de datos; tocá «Actualizar todo desde el servidor» y, si sigue así, avisá a BackOffice."
      - cmpSheet_7:
          Control: CanvasComponent
          ComponentName: cmpSheet
          Properties:
            Height: =Parent.Height
            Visible: =varSheetEscala
            Width: =Parent.Width
