                  Font: =Font.'Segoe UI'
                  Height: =24
                  PaddingLeft: =0
                  Size: =10
                  Text: =varSelTsc.clienteTsc
                  Width: =Parent.Width - gblE.Pad - Self.X
                  Wrap: =false
