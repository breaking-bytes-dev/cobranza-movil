                  Y: =84
            - lblKClienteTsc:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.muted
                  Font: =Font.'Segoe UI'
                  Height: =24
                  PaddingLeft: =0
                  Size: =9
                  Text: ="Cliente"
                  Width: =110
                  Wrap: =false
                  X: =gblE.Pad
                  Y: =104
            - lblVClienteTsc:
                Control: Label@2.5.1
                Properties:
