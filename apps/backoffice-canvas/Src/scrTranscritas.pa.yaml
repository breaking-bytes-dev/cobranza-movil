            - galPagosPanelTsc:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  Height: =108
                  Items: |-
                    =Filter('CM | TBL | Pagos',
                        '[PG] Numero Interaccion' = varSelTsc.'[IN] Numero de Interaccion')
                  ShowScrollbar: =false
                  TemplatePadding: =0
                  TemplateSize: =36
                  Visible: =varSelTsc.'[IN] Aplica pago'
                  Width: =Parent.Width - 2*gblE.Pad
                  X: =gblE.Pad
                  Y: =404
                Children:
                  - lblMontoPagoTsc:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.okInk
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        PaddingLeft: =0
                        Size: =10
                        Text: |-
                          =If(varSelTsc.'[IN] Aplica pago',
                              If(ThisItem.'[PG] Moneda' = 'Choice | CM | Monedas en Pago'.USD, "US$ ", "C$ ")
