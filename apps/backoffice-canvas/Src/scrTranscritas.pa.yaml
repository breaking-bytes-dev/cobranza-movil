Screens:
  scrTranscritas:
    Properties:
      Fill: =gblC.pantalla
      OnVisible: |-
        =// Transcritas (2026-10-24): lo grabado el día elegido por cualquier BackOffice; por defecto HOY y YO (el arqueo
        // de siempre). La fecha, el que grabó y la búsqueda se conservan al volver a la pantalla.
        If(IsBlank(varFechaTsc), Set(varFechaTsc, Today()));
        // Quién grabó: varGrabTsc vacío = YO. No se fija acá: gblUsuarioDV puede no estar resuelto al abrir (B-06, App) y
        // quedaba "Todos"; las fórmulas usan Coalesce(varGrabTsc, gblUsuarioDV.'Full Name', "Todos").
        Set(varAvisoTsc, false);
        Select(btnCargarTsc)
    Children:
      - cmpEncTsc:
          Control: CanvasComponent
          ComponentName: cmpEncabezado
          Properties:
            Height: =If(nfMovil, gblE.AltoBarra + 84, 84)
            Subtitulo: ="Arqueo por día y por quién grabó — código grabado y auditoría sellada."
            Titulo: ="Transcritas"
            Width: =Parent.Width - Self.X
            X: =If(nfMovil, 0, gblE.AnchoNav)
      - btnActualizarTsc:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =gblC.borde
            BorderThickness: =1
            Color: =gblC.ink2
            Fill: =gblC.card
            FocusedBorderColor: =gblC.teal
            FocusedBorderThickness: =2
            Font: =Font.'Segoe UI'
            Height: =gblE.AltoInput
            DisplayMode: =If(varCargandoTsc, DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: =Set(varAvisoTsc, true); Select(btnCargarTsc)
            Size: =10
            Text: ="↻ Actualizar"
            Width: =140
            X: =conKpisTsc.X + conKpisTsc.Width - Self.Width
            Y: =cmpEncTsc.Y + (cmpEncTsc.Height - Self.Height)/2
      - conKpisTsc:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =If(nfMovil, 2*96 + gblE.PadSm, 96)
            Width: =Min(gblE.AnchoMax, Parent.Width - If(nfMovil, 0, gblE.AnchoNav) - 2*gblE.Pad)
            X: |-
              =If(nfMovil, 0, gblE.AnchoNav)
                  + Max(gblE.Pad, (Parent.Width - If(nfMovil, 0, gblE.AnchoNav) - gblE.AnchoMax) / 2)
            Y: =cmpEncTsc.Y + cmpEncTsc.Height
          Children:
            - cmpKpiTransTsc:
                Control: CanvasComponent
                ComponentName: cmpKpi
                Properties:
                  Detalle: =""
                  EsHero: =false
                  Etiqueta: ="TRANSCRITAS"
                  Height: =96
                  Valor: =Text(galTscTsc.AllItemsCount)
                  Width: =If(nfMovil, Parent.Width, (Parent.Width - gblE.PadSm)/2)
            - cmpKpiPagosTsc:
                Control: CanvasComponent
                ComponentName: cmpKpi
                Properties:
                  Detalle: =""
                  EsHero: =false
                  Etiqueta: ="PAGOS TRANSCRITOS"
                  Height: =96
                  Valor: |-
                    =// Suma de las filas que muestra la lista (día, quién grabó y búsqueda).
                    Moneda(Sum(galTscTsc.AllItems, pagosNioTsc), Sum(galTscTsc.AllItems, pagosUsdTsc))
                  Width: =If(nfMovil, Parent.Width, (Parent.Width - gblE.PadSm)/2)
                  X: =If(nfMovil, 0, cmpKpiTransTsc.Width + gblE.PadSm)
                  Y: =If(nfMovil, 96 + gblE.PadSm, 0)
      - conFiltrosTsc:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =If(nfMovil, 3 * gblE.AltoInput + 2 * gblE.PadSm, gblE.AltoInput)
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =gblE.PadSm
            LayoutWrap: =nfMovil
            Width: =conKpisTsc.Width
            X: =conKpisTsc.X
            Y: =conKpisTsc.Y + conKpisTsc.Height + gblE.Pad
          Children:
            - dtpFechaTsc:
                Control: Classic/DatePicker@2.6.0
                Properties:
                  AccessibleLabel: ="Día de grabación"
                  BorderColor: =gblC.borde
                  Color: =gblC.ink
                  DefaultDate: =varFechaTsc
                  Fill: =gblC.card
                  FillPortions: =0
                  DisplayMode: =If(varCargandoTsc, DisplayMode.Disabled, DisplayMode.Edit)
                  Font: =Font.'Segoe UI'
                  Height: =gblE.AltoInput
                  OnChange: |-
                    =// UN día (el arqueo es por jornada). Sin fecha (borrada a mano) vuelve a hoy.
                    Set(varFechaTsc, Coalesce(Self.SelectedDate, Today()));
                    Select(btnCargarTsc)
                  Size: =10
                  StartOfWeek: =StartOfWeek.Monday
                  Width: =If(nfMovil, (Parent.Width - gblE.PadSm) * 0.6, 170)
            - btnHoyTsc:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =gblC.borde
                  BorderThickness: =1
                  Color: =If(varFechaTsc = Today(), gblC.muted, gblC.teal)
                  Fill: =gblC.card
                  FillPortions: =0
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  DisplayMode: =If(varCargandoTsc, DisplayMode.Disabled, DisplayMode.Edit)
                  Font: =Font.'Segoe UI'
                  Height: =gblE.AltoInput
                  OnSelect: =Set(varFechaTsc, Today()); Reset(dtpFechaTsc); Select(btnCargarTsc)
                  Size: =10
                  Text: ="Hoy"
                  Width: =If(nfMovil, (Parent.Width - gblE.PadSm) * 0.4, 70)
            - txtBuscaTsc:
                Control: Classic/TextInput@2.3.2
                Properties:
                  AccessibleLabel: ="Buscar por CIF, cliente, tarjeta o localizador"
                  BorderColor: =gblC.borde
                  Default: =""
                  DelayOutput: =true
                  Fill: =gblC.card
                  FillPortions: =1
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =gblE.AltoInput
                  HintText: ="🔍 CIF, cliente, últimos dígitos de la tarjeta o localizador"
                  LayoutMinWidth: =220
                  OnChange: =Set(varBuscaTsc, Trim(Self.Text))
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Size: =10
                  Width: =If(nfMovil, Parent.Width, 320)
            - drpGrabTsc:
                Control: Classic/DropDown@2.3.1
                Properties:
                  AccessibleLabel: ="Quién la grabó"
                  BorderColor: =gblC.borde
                  BorderThickness: =1
                  ChevronBackground: =gblC.card
                  ChevronFill: =gblC.ink2
                  ChevronHoverBackground: =gblC.pantalla
                  ChevronHoverFill: =gblC.teal
                  Color: =gblC.ink
                  Default: |-
                    =// Vacío = YO (gblUsuarioDV puede resolverse después de abrir, B-06).
                    Coalesce(varGrabTsc, gblUsuarioDV.'Full Name', "Todos")
                  Fill: =gblC.card
                  FillPortions: =0
                  Font: =Font.'Segoe UI'
                  Height: =gblE.AltoInput
                  HoverColor: =gblC.ink
                  HoverFill: =gblC.pantalla
                  Items: |-
                    =// Todos, yo y los demás que grabaron ese día (colGrabTsc, de btnCargarTsc). DropDown clásico con Items.Value:
                    // el ComboBox clásico editado por YAML mostraba las filas en blanco (2026-10-24).
                    colGrabTsc
                  Items.Value: =nom
                  OnChange: =Set(varGrabTsc, Coalesce(Self.Selected.nom, "Todos"))
                  PressedColor: =gblC.card
                  PressedFill: =gblC.teal
                  SelectionColor: =gblC.card
                  SelectionFill: =gblC.teal
                  Size: =10
                  Width: =If(nfMovil, Parent.Width, 260)
      - conListaTsc:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =gblC.borde
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =gblC.card
            Height: =Parent.Height - Self.Y - gblE.Pad
            RadiusBottomLeft: =gblE.Radio
            RadiusBottomRight: =gblE.Radio
            RadiusTopLeft: =gblE.Radio
            RadiusTopRight: =gblE.Radio
            Width: =conKpisTsc.Width
            X: =conKpisTsc.X
            Y: =conFiltrosTsc.Y + conFiltrosTsc.Height + gblE.PadSm
          Children:
            - galTscTsc:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  AccessibleLabel: ="Interacciones transcritas"
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Height: =Parent.Height - 2*gblE.PadSm
                  Items: |-
                    =// Quién grabó (combo) y búsqueda: CIF, cliente o localizador (contiene), tarjeta (últimos dígitos) o N° INT.
                    Sort(Filter(colTscTsc,
                            (Coalesce(varGrabTsc, gblUsuarioDV.'Full Name', "Todos") = "Todos" || grabTsc = Coalesce(varGrabTsc, gblUsuarioDV.'Full Name', "Todos")) &&
                            (IsBlank(varBuscaTsc) || varBuscaTsc in cifTsc || varBuscaTsc in clienteTsc ||
                             EndsWith(ult4Tsc, varBuscaTsc) || varBuscaTsc in '[IN] NombreAgente' ||
                             varBuscaTsc in '[IN] Numero de Interaccion')),
                         '[IN] Fecha grabacion', SortOrder.Descending)
                  OnSelect: =Set(varSelTsc, ThisItem); Set(varPanelTsc, true)
                  ShowScrollbar: =false
                  TemplateFill: =If(ThisItem.IsSelected, gblC.tealSuave, gblC.card)
                  TemplatePadding: =0
                  TemplateSize: =gblE.AltoFila
                  Width: =Parent.Width - 2*gblE.Pad
                  X: =gblE.Pad
                  Y: =gblE.PadSm
                Children:
                  - lblClienteTsc:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.ink
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        PaddingLeft: =0
                        Size: =10
                        Text: =ThisItem.clienteTsc
                        Width: =If(nfMovil, Parent.TemplateWidth*0.55, Parent.TemplateWidth*0.32)
                        Wrap: =false
                        X: =gblE.PadSm
                        Y: =6
                  - lblCuentaTsc:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.muted
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =18
                        PaddingLeft: =0
                        Size: =9
                        Text: =CuentaMasc(ThisItem.ult4Tsc) & If(ThisItem.prodTsc = "—", "", " · " & ThisItem.prodTsc)
                        Width: =lblClienteTsc.Width
                        Wrap: =false
                        X: =gblE.PadSm
                        Y: =26
                  - lblAgenteTsc:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.muted2
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =16
                        PaddingLeft: =0
                        Size: =8
                        Text: |-
                          =ThisItem.'[IN] Numero de Interaccion' & " · 🏍️ " & ThisItem.'[IN] NombreAgente' & " · " & Text(ThisItem.'Fecha de captura', "HH:mm") &
                              " · ✍️ " & ThisItem.grabTsc
                        Width: =lblClienteTsc.Width
                        Wrap: =false
                        X: =gblE.PadSm
                        Y: =44
                  - lblComentTsc:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.ink2
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =Parent.TemplateHeight
                        PaddingLeft: =0
                        Size: =9
                        Text: =ThisItem.'[IN] Comentario'
                        Visible: =!nfMovil
                        Width: =Parent.TemplateWidth*0.32
                        Wrap: =false
                        X: =Parent.TemplateWidth*0.34
                  - chpDatosTsc:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =If(ThisItem.datosTsc = "ok", gblC.espInk, gblC.redInk)
                        Fill: =If(ThisItem.datosTsc = "ok", gblC.espBg, gblC.redBg)
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =26
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =8
                        Text: =Switch(ThisItem.datosTsc, "ok", "✏️ Datos nuevos", "sinv", "⚠ Datos sin vincular", "⚠ Datos no llegaron")
                        Visible: =ThisItem.'[IN] Actualiza info'
                        Width: =14 + 7*Len(Self.Text)
                        X: =chpGrabTsc.X - If(chpPagoTsc.Visible, chpPagoTsc.Width + 6, 0) - Self.Width - 6
                        Y: =chpGrabTsc.Y
                  - chpPagoTsc:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =gblC.okInk
                        Fill: =gblC.okBg
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =26
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =8
                        Text: |-
                          ="💵 " & Moneda(ThisItem.pagosNioTsc, ThisItem.pagosUsdTsc)
                        Visible: =ThisItem.'[IN] Aplica pago'
                        Width: =14 + 7*Len(Self.Text)
                        X: =chpGrabTsc.X - Self.Width - 6
                        Y: =chpGrabTsc.Y
                  - chpGrabTsc:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =gblC.okInk
                        Fill: =gblC.okBg
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =26
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =8
                        Text: ="✓ Grabada · " & ThisItem.'[IN] Codigo Grabacion'
                        Width: =14 + 7*Len(Self.Text)
                        X: =Parent.TemplateWidth - Self.Width - gblE.PadSm
                        Y: =(Parent.TemplateHeight - Self.Height)/2
                  - recSepTsc:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderThickness: =0
                        DropShadow: =DropShadow.None
                        Fill: =gblC.hairline
                        Height: =1
                        Width: =Parent.TemplateWidth
                        Y: =Parent.TemplateHeight - 1
                  - btnFilaTsc:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =Color.Transparent
                        Fill: =Color.Transparent
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Height: =Parent.TemplateHeight
                        HoverFill: =RGBA(15, 107, 107, 0.06)
                        OnSelect: =Select(Parent)
                        PressedFill: =RGBA(15, 107, 107, 0.12)
                        TabIndex: =0
                        Text: ="Ver interacción transcrita de " & ThisItem.clienteTsc
                        Width: =Parent.TemplateWidth
                        X: =0
                        Y: =0
            - cmpVacioTsc:
                Control: CanvasComponent
                ComponentName: cmpVacio
                Properties:
                  Height: =140
                  Icono: |-
                    ="🗒️"
                  Mensaje: |-
                    =If(!IsBlank(varBuscaTsc), "Nada coincide con «" & varBuscaTsc & "».",
                        "No hay transcritas " & If(varFechaTsc = Today(), "hoy", "el " & Text(varFechaTsc, "dd/mm/yyyy")) &
                        If(Coalesce(varGrabTsc, gblUsuarioDV.'Full Name', "Todos") = "Todos", ".", " grabadas por " & Coalesce(varGrabTsc, gblUsuarioDV.'Full Name', "Todos") & "."))
                  Titulo: ="Nada para mostrar."
                  Visible: =galTscTsc.AllItemsCount = 0
                  Width: =Parent.Width
                  Y: =(Parent.Height - Self.Height)/2
            - lblCargandoTsc:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =gblC.teal
                  Fill: =RGBA(255, 255, 255, 0.88)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =Parent.Height
                  Size: =12
                  Text: |-
                    ="⏳ Cargando las transcritas " & If(varFechaTsc = Today(), "de hoy", "del " & Text(varFechaTsc, "dd/mm/yyyy")) & "…"
                  Visible: =varCargandoTsc
                  Width: =Parent.Width
      - btnCargarTsc:
          Control: Classic/Button@2.2.0
          Properties:
            OnSelect: |-
              =// Transcritas del día varFechaTsc, de TODOS los que graban: el filtro por quién grabó y la búsqueda son en memoria
              // (galTscTsc.Items). Comparaciones de fecha con variables y choice por valor = delegable (00 §4.2).
              // Aviso «Cargando…» sobre la lista mientras se leen los datos (tarda unos segundos; 2026-10-24).
              Set(varCargandoTsc, true);
              Set(varFinTsc, DateAdd(varFechaTsc, 1));
              // ESCALA: los pagos del día (de todos los cobradores) se traen por tramos (TramoCartera, de su interacción), cada
              // consulta bajo el límite de 2000 filas: hasta unos 30.000 pagos por día. El tramo va CONSTANTE (T.Value): un If,
              // DateAdd o un campo de colección en el Filter no delega y trae la tabla entera. El último Collect: pagos sin tramo.
              Clear(colPagosHoyTsc);
              ForAll(Sequence(20, 0) As T,
                  Collect(colPagosHoyTsc, Filter('CM | TBL | Pagos', 'Fecha del pago' >= varFechaTsc && 'Fecha del pago' < varFinTsc && '[PG] Tramo' = T.Value)));
              Collect(colPagosHoyTsc, Filter('CM | TBL | Pagos', 'Fecha del pago' >= varFechaTsc && 'Fecha del pago' < varFinTsc && '[PG] Tramo' = Blank()));
              If(CountRows(colPagosHoyTsc) >= 30000,
                  Notify("Ese día hay más de 30.000 pagos: el arqueo de esta pantalla puede estar incompleto. Avisá a soporte.", NotificationType.Warning));
              // La lectura principal se verifica aparte (ver scrCargaArchivo): sin esto, el ✓ salía aunque la lectura fallara.
              // Datos de la cuenta navegando el lookup '[IN] Cuenta' (lo resuelve el servidor). IntTsc y no ThisRecord: adentro
              // del LookUp, ThisRecord es la ACTUALIZACIÓN.
              Set(varErrTsc, IfError(Left(Text(CountRows(ClearCollect(colTscTmpTsc,
                  AddColumns(
                      Filter('CM | TBL | Interaccions',
                          '[IN] Estado grabacion' = 'Choice | CM | Estado grabacion Interaccio'.Grabado
                          && '[IN] Fecha grabacion' >= varFechaTsc && '[IN] Fecha grabacion' < varFinTsc) As IntTsc,
                      clienteTsc, Upper(Coalesce(IntTsc.'[IN] Cuenta'.'Nombre Cliente', If(IsBlank(IntTsc.'[IN] Cuenta'), "(cuenta fuera de cartera)", "—"))),   // LED-01
                      cifTsc, Coalesce(IntTsc.'[IN] Cuenta'.'CIF Cliente', IntTsc.'[IN] CIF cliente', "—"),   // APP-50: respaldo de la interacción
                      prodTsc, Coalesce(IntTsc.'[IN] Cuenta'.'Tipo Producto', "—"),
                      ult4Tsc, Coalesce(IntTsc.'[IN] Cuenta'.'Últimos 4', IntTsc.'[IN] Últimos 4', ""),
                      cuentaIdTsc, IntTsc.'[IN] Cuenta'.'CM | TBL | Cuenta',
                      grabTsc, Coalesce(IntTsc.'[IN] Grabado por'.'Full Name', "—"),
                      // F10: "ok" la actualización vinculada existe; "sinv" entró sin vincular (F8); "falta" no llegó.
                      datosTsc, If(!IntTsc.'[IN] Actualiza info', "",
                          !IsBlank(LookUp('CM | TBL | Actualizacion de datos', '[AD] Interaccion'.'CM | TBL | Interaccion' = IntTsc.'CM | TBL | Interaccion')), "ok",
                          !IsBlank(IntTsc.'[IN] Cuenta') && !IsBlank(LookUp('CM | TBL | Actualizacion de datos', '[AD] Sin vincular' = true && '[AD] Cuenta'.'CM | TBL | Cuenta' = IntTsc.'[IN] Cuenta'.'CM | TBL | Cuenta')), "sinv",
                          "falta")
                  )
              ))), 0), Coalesce(FirstError.Message, "sin detalle")));
              If(CountRows(colTscTmpTsc) >= 2000,
                  Notify("Ese día hay 2.000 o más transcritas: la lista puede estar incompleta. Avisá a soporte.", NotificationType.Warning));
              // Pagos del arqueo = pagos del día (ya en memoria) ∩ las transcritas del día. Todo sobre colecciones (00 §4.1).
              ClearCollect(colPagosTsc,
                  Filter(colPagosHoyTsc,
                      !IsBlank(LookUp(colTscTmpTsc, '[IN] Numero de Interaccion' = '[PG] Numero Interaccion'))));
              // Montos por interacción HORNEADOS una vez (R1-02). La base es colTscTmpTsc (SIN pagos*): si AddColumns leyera
              // colTscTsc, su esquema ya trae pagosNioTsc → "A column named 'pagosNioTsc' already exists".
              ClearCollect(colTscTsc,
                  AddColumns(colTscTmpTsc,
                      pagosNioTsc, Sum(Filter(colPagosTsc,
                          '[PG] Numero Interaccion' = '[IN] Numero de Interaccion'
                          && '[PG] Moneda' = 'Choice | CM | Monedas en Pago'.NIO), '[PG] Monto'),
                      pagosUsdTsc, Sum(Filter(colPagosTsc,
                          '[PG] Numero Interaccion' = '[IN] Numero de Interaccion'
                          && '[PG] Moneda' = 'Choice | CM | Monedas en Pago'.USD), '[PG] Monto')
                  )
              );
              // Opciones del combo «Grabó»: Todos, yo (aunque ese día no haya grabado) y los demás que grabaron ese día.
              ClearCollect(colGrabTsc, {nom: "Todos"});
              If(!IsBlank(gblUsuarioDV.'Full Name'), Collect(colGrabTsc, {nom: gblUsuarioDV.'Full Name'}));
              ForAll(Sort(GroupBy(colTscTmpTsc, grabTsc, filasTsc), grabTsc) As G,
                  If(G.grabTsc <> Coalesce(gblUsuarioDV.'Full Name', ""), Collect(colGrabTsc, {nom: G.grabTsc})));
              // El DropDown aplica Default una sola vez (antes de tener opciones y usuario): se fija YO y se reinicia.
              If(IsBlank(varGrabTsc) && !IsBlank(gblUsuarioDV.'Full Name'), Set(varGrabTsc, gblUsuarioDV.'Full Name'));
              Reset(drpGrabTsc);
              Set(varSelTsc, Blank());
              Set(varPanelTsc, false);
              If(!IsBlank(varErrTsc),
                  Notify("No se pudo leer las transcritas: " & TextoError(varErrTsc), NotificationType.Error),
                 varAvisoTsc,
                  Notify("✓ Arqueo actualizado", NotificationType.Success, 2500));   // LED-05
              Set(varAvisoTsc, false);
              Set(varCargandoTsc, false)
            Visible: =false
      - recScrimTsc:
          Control: Rectangle@2.3.0
          Properties:
            AccessibleLabel: ="Cerrar panel"
            Fill: =gblC.scrim
            FocusedBorderColor: =gblC.teal
            FocusedBorderThickness: =2
