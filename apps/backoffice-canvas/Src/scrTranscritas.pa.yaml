                        Wrap: =false
                        Y: =8
                  - lblReciboPagoTsc:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        Color: =gblC.muted
                        Font: =Font.'Segoe UI'
                        Height: =20
                        PaddingRight: =0
                        Size: =9
                        Text: ="Recibo " & ThisItem.'[PG] Numero recibo'
                        Width: =Parent.TemplateWidth*0.45
                        Wrap: =false
                        X: =Parent.TemplateWidth*0.55
                        Y: =8
