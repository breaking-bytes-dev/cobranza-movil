                  - chpDatosTsc:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =gblC.espInk
                        Fill: =gblC.espBg
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =26
                        OnSelect: =Select(Parent)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =8
                        Text: ="✏️ Datos nuevos"
                        Visible: =ThisItem.'[IN] Actualiza info'
                        Width: =14 + 7*Len(Self.Text)
                        X: =chpGrabTsc.X - If(chpPagoTsc.Visible, chpPagoTsc.Width + 6, 0) - Self.Width - 6
                        Y: =chpGrabTsc.Y
                  - chpPagoTsc:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =gblC.okInk
                        Fill: =gblC.okBg
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =26
                        OnSelect: =Select(Parent)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =8
                        Text: |-
                          ="💵 " & Moneda(ThisItem.pagosNioTsc, ThisItem.pagosUsdTsc)
                        Visible: =ThisItem.'[IN] Aplica pago'
                        Width: =14 + 7*Len(Self.Text)
                        X: =chpGrabTsc.X - Self.Width - 6
                        Y: =chpGrabTsc.Y
                  - chpGrabTsc:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =gblC.okInk
                        Fill: =gblC.okBg
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =26
                        OnSelect: =Select(Parent)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =8
                        Text: ="✓ Grabada · " & ThisItem.'[IN] Codigo Grabacion'
                        Width: =14 + 7*Len(Self.Text)
                        X: =Parent.TemplateWidth - Self.Width - gblE.PadSm
                        Y: =(Parent.TemplateHeight - Self.Height)/2
                  - recSepTsc:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =gblC.hairline
                        Height: =1
                        OnSelect: =Select(Parent)
                        Width: =Parent.TemplateWidth
                        Y: =Parent.TemplateHeight - 1
            - cmpVacioTsc:
                Control: CanvasComponent
                ComponentName: cmpVacio
                Properties:
                  Height: =140
                  Icono: |-
                    ="🗒️"
                  Mensaje: ="Lo que transcribas hoy aparece acá — tu arqueo del día."
                  Titulo: ="Nada todavía."
                  Visible: =CountRows(colTscTsc) = 0
                  Width: =Parent.Width
                  Y: =(Parent.Height - Self.Height)/2
      - recScrimTsc:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gblC.scrim
            Height: =Parent.Height
            OnSelect: =Set(varPanelTsc, false)
            Visible: =varPanelTsc
            Width: =Parent.Width
      - conPanelTsc:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =gblC.borde
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =gblC.card
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =varPanelTsc
            Width: =If(nfMovil, Parent.Width, Min(480, Parent.Width*0.45))
            X: =Parent.Width - Self.Width
          Children:
            - lblTituloPanelTsc:
                Control: Label@2.5.1
