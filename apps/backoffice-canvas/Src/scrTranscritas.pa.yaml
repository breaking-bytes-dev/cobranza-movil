                        Width: =lblClienteTsc.Width
                        Wrap: =false
                        X: =gblE.PadSm
                        Y: =26
                  - lblAgenteTsc:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.muted2
                        Font: =Font.'Segoe UI'
                        Height: =16
                        OnSelect: =Select(Parent)
