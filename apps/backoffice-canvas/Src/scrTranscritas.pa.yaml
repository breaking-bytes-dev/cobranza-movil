Screens:
  scrTranscritas:
    Properties:
      Fill: =gblC.pantalla
      OnVisible: |-
        =// 2) Fuentes independientes en paralelo (ambas delegables)
        Concurrent(
            ClearCollect(colCtasTsc, 'CM | TBL | Cuentas'),
            ClearCollect(colPagosHoyTsc,
                Filter('CM | TBL | Pagos', 'Fecha del pago' >= Today()))
        );
        // 3) Arqueo del día (base en colTscTmpTsc): SOLO lo grabado HOY por MÍ.
        //    choice por valor + comparación de fecha + lookup por registro = delegable (00 §4.2).
        //    El join del cliente se hornea acá (7.7) → va DESPUÉS de colCtasTsc, NUNCA en el Concurrent.
        ClearCollect(colTscTmpTsc,
            AddColumns(
                Filter('CM | TBL | Interaccions',
                    '[IN] Estado grabacion' = 'Choice | CM | Estado grabacion Interaccio'.Grabado
                    && '[IN] Fecha grabacion' >= Today()
                    && '[IN] Grabado por'.User = gblUsuarioDV.User),
                clienteTsc, Upper(Coalesce(LookUp(colCtasTsc, '[CT] Numero de cuenta' = '[IN] Numerocuenta').'Nombre Cliente', "—")),   // LED-01
                cifTsc, Coalesce(LookUp(colCtasTsc, '[CT] Numero de cuenta' = '[IN] Numerocuenta').'CIF Cliente', "—"),
                prodTsc, Coalesce(LookUp(colCtasTsc, '[CT] Numero de cuenta' = '[IN] Numerocuenta').'Tipo Producto', "—")
            )
        );
        // 4) Pagos del arqueo = pagos de HOY (ya en memoria) ∩ mis transcritas.
        //    Filter sobre COLECCIÓN → cero delegación involucrada: permitido (00 §4.1).
        ClearCollect(colPagosTsc,
            Filter(colPagosHoyTsc,
                !IsBlank(LookUp(colTscTmpTsc, '[IN] Numero de Interaccion' = '[PG] Numero Interaccion'))));
        // 5) Chip 💵 de la fila: montos por interacción HORNEADOS una vez (todo sobre colecciones,
        //    en memoria — R1-02). La base vive en colTscTmpTsc (SIN pagos*) y colTscTsc se escribe
        //    UNA sola vez ya con pagos*: si AddColumns leyera colTscTsc, su esquema ya trae
        //    pagosNioTsc → "A column named 'pagosNioTsc' already exists".
        ClearCollect(colTscTsc,
            AddColumns(colTscTmpTsc,
                pagosNioTsc, Sum(Filter(colPagosTsc,
                    '[PG] Numero Interaccion' = '[IN] Numero de Interaccion'
                    && '[PG] Moneda' = 'Choice | CM | Monedas en Pago'.NIO), '[PG] Monto'),
                pagosUsdTsc, Sum(Filter(colPagosTsc,
                    '[PG] Numero Interaccion' = '[IN] Numero de Interaccion'
                    && '[PG] Moneda' = 'Choice | CM | Monedas en Pago'.USD), '[PG] Monto')
            )
        );
        // 6) Estado del panel
        Set(varSelTsc, Blank());
        Set(varPanelTsc, false)
    Children:
      - cmpEncTsc:
          Control: CanvasComponent
          ComponentName: cmpEncabezado
          Properties:
            Height: =If(nfMovil, gblE.AltoBarra + 84, 84)
            Subtitulo: ="Tu arqueo del día — código grabado y auditoría sellada."
            Titulo: ="Transcritas hoy"
            Width: =Parent.Width - Self.X
            X: =If(nfMovil, 0, gblE.AnchoNav)
      - btnActualizarTsc:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =gblC.borde
            BorderThickness: =1
            Color: =gblC.ink2
            Fill: =gblC.card
            Font: =Font.'Segoe UI'
            Height: =gblE.AltoInput
            OnSelect: |-
              =Concurrent(
                  ClearCollect(colCtasTsc, 'CM | TBL | Cuentas'),
                  ClearCollect(colPagosHoyTsc,
                      Filter('CM | TBL | Pagos', 'Fecha del pago' >= Today()))
              );
              ClearCollect(colTscTmpTsc,
                  AddColumns(
                      Filter('CM | TBL | Interaccions',
                          '[IN] Estado grabacion' = 'Choice | CM | Estado grabacion Interaccio'.Grabado
                          && '[IN] Fecha grabacion' >= Today()
                          && '[IN] Grabado por'.User = gblUsuarioDV.User),
                      clienteTsc, Upper(Coalesce(LookUp(colCtasTsc, '[CT] Numero de cuenta' = '[IN] Numerocuenta').'Nombre Cliente', "—")),
                      cifTsc, Coalesce(LookUp(colCtasTsc, '[CT] Numero de cuenta' = '[IN] Numerocuenta').'CIF Cliente', "—"),
                      prodTsc, Coalesce(LookUp(colCtasTsc, '[CT] Numero de cuenta' = '[IN] Numerocuenta').'Tipo Producto', "—")
                  )
              );
              ClearCollect(colPagosTsc,
                  Filter(colPagosHoyTsc,
                      !IsBlank(LookUp(colTscTmpTsc, '[IN] Numero de Interaccion' = '[PG] Numero Interaccion'))));
              ClearCollect(colTscTsc,
                  AddColumns(colTscTmpTsc,
                      pagosNioTsc, Sum(Filter(colPagosTsc,
                          '[PG] Numero Interaccion' = '[IN] Numero de Interaccion'
                          && '[PG] Moneda' = 'Choice | CM | Monedas en Pago'.NIO), '[PG] Monto'),
                      pagosUsdTsc, Sum(Filter(colPagosTsc,
                          '[PG] Numero Interaccion' = '[IN] Numero de Interaccion'
                          && '[PG] Moneda' = 'Choice | CM | Monedas en Pago'.USD), '[PG] Monto')
                  )
              );
              Notify("✓ Arqueo actualizado", NotificationType.Success, 2500)   // LED-05
            Size: =10
            Text: ="↻ Actualizar"
            Width: =140
            X: =conKpisTsc.X + conKpisTsc.Width - Self.Width
            Y: =cmpEncTsc.Y + (cmpEncTsc.Height - Self.Height)/2
      - conKpisTsc:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =If(nfMovil, 2*96 + gblE.PadSm, 96)
            Width: =Min(gblE.AnchoMax, Parent.Width - If(nfMovil, 0, gblE.AnchoNav) - 2*gblE.Pad)
            X: |-
              =If(nfMovil, 0, gblE.AnchoNav)
                  + Max(gblE.Pad, (Parent.Width - If(nfMovil, 0, gblE.AnchoNav) - gblE.AnchoMax) / 2)
            Y: =cmpEncTsc.Y + cmpEncTsc.Height
          Children:
            - cmpKpiTransTsc:
                Control: CanvasComponent
                ComponentName: cmpKpi
                Properties:
                  Detalle: =""
                  EsHero: =false
                  Etiqueta: ="TRANSCRITAS"
                  Height: =96
                  Valor: =Text(CountRows(colTscTsc))
                  Width: =If(nfMovil, Parent.Width, (Parent.Width - gblE.PadSm)/2)
            - cmpKpiPagosTsc:
                Control: CanvasComponent
                ComponentName: cmpKpi
                Properties:
                  Detalle: =""
                  EsHero: =false
                  Etiqueta: ="PAGOS TRANSCRITOS"
                  Height: =96
                  Valor: |-
                    =Moneda(
                        Sum(Filter(colPagosTsc, '[PG] Moneda' = 'Choice | CM | Monedas en Pago'.NIO), '[PG] Monto'),
                        Sum(Filter(colPagosTsc, '[PG] Moneda' = 'Choice | CM | Monedas en Pago'.USD), '[PG] Monto'))
                  Width: =If(nfMovil, Parent.Width, (Parent.Width - gblE.PadSm)/2)
                  X: =If(nfMovil, 0, cmpKpiTransTsc.Width + gblE.PadSm)
                  Y: =If(nfMovil, 96 + gblE.PadSm, 0)
      - conListaTsc:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =gblC.borde
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =gblC.card
            Height: =Parent.Height - Self.Y - gblE.Pad
            RadiusBottomLeft: =gblE.Radio
            RadiusBottomRight: =gblE.Radio
            RadiusTopLeft: =gblE.Radio
            RadiusTopRight: =gblE.Radio
            Width: =conKpisTsc.Width
            X: =conKpisTsc.X
            Y: =conKpisTsc.Y + conKpisTsc.Height + gblE.Pad
          Children:
            - galTscTsc:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  Height: =Parent.Height - 2*gblE.PadSm
                  Items: =Sort(colTscTsc, '[IN] Fecha grabacion', SortOrder.Descending)
                  OnSelect: =Set(varSelTsc, ThisItem); Set(varPanelTsc, true)
                  ShowScrollbar: =false
                  TemplateFill: =If(ThisItem.IsSelected, gblC.tealSuave, gblC.card)
                  TemplatePadding: =0
                  TemplateSize: =gblE.AltoFila
                  Width: =Parent.Width - 2*gblE.Pad
                  X: =gblE.Pad
                  Y: =gblE.PadSm
                Children:
                  - recFilaTsc:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =Color.Transparent
                        Height: =Parent.TemplateHeight
                        OnSelect: =Select(Parent)
                        Width: =Parent.TemplateWidth
                  - lblClienteTsc:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.ink
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        OnSelect: =Select(Parent)
                        PaddingLeft: =0
                        Size: =10
                        Text: =ThisItem.clienteTsc
                        Width: =If(nfMovil, Parent.TemplateWidth*0.55, Parent.TemplateWidth*0.32)
                        Wrap: =false
                        X: =gblE.PadSm
                        Y: =6
                  - lblCuentaTsc:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.muted
                        Font: =Font.'Segoe UI'
                        Height: =18
                        OnSelect: =Select(Parent)
                        PaddingLeft: =0
