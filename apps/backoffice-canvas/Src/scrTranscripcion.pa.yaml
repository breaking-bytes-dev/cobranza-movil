Screens:
  scrTranscripcion:
    Properties:
      Fill: =gblC.pantalla
      OnVisible: |-
        =// 3) pendientes del día + join horneado UNA vez (receta 7.7); nombre en Upper (LED-01).
        //    Datos de la cuenta navegando el lookup '[IN] Cuenta' (lo resuelve el servidor, sin
        //    catálogo de cuentas truncable al Data row limit).
        ClearCollect(colPendTrx,
            AddColumns(
                // FIFO EN EL SERVIDOR: si la cola pasa del límite de filas (2000), entran las MÁS ANTIGUAS (las que van primero).
                Sort(Filter('CM | TBL | Interaccions',
                    '[IN] Estado grabacion' = 'Choice | CM | Estado grabacion Interaccio'.Pendiente),
                    'Fecha de captura', SortOrder.Ascending),
                clienteTrx, Upper(Coalesce(
                    ThisRecord.'[IN] Cuenta'.'Nombre Cliente', "—")),
                cifTrx, Coalesce(
                    ThisRecord.'[IN] Cuenta'.'CIF Cliente', "—"),
                productoTrx, Coalesce(
                    ThisRecord.'[IN] Cuenta'.'Tipo Producto', "—"),
                ult4Trx, Coalesce(
                    ThisRecord.'[IN] Cuenta'.'Últimos 4', ""),
                cuentaIdTrx, ThisRecord.'[IN] Cuenta'.'CM | TBL | Cuenta'
            )
        );
        // 4) columna de localizadores materializada
        // "Todos" = conteo EXACTO al datasource (CountIf delega); por localizador: de la cola cargada, o CountIf al servidor si la cola vino cortada
        ClearCollect(colLocsTrx, Table({locTrx: "Todos", nTrx: CountIf('CM | TBL | Interaccions', '[IN] Estado grabacion' = 'Choice | CM | Estado grabacion Interaccio'.Pendiente)}));
        Set(varPendCortadaTrx, CountRows(colPendTrx) < LookUp(colLocsTrx, locTrx = "Todos").nTrx);
        Collect(colLocsTrx,
            RenameColumns(
                ShowColumns(
                    Sort(
                        AddColumns(
                            GroupBy(AddColumns(colPendTrx, agenteTrx, '[IN] NombreAgente'),
                                agenteTrx, grpTrx),
                            nTrx, If(varPendCortadaTrx, CountIf('CM | TBL | Interaccions', '[IN] Estado grabacion' = 'Choice | CM | Estado grabacion Interaccio'.Pendiente && '[IN] NombreAgente' = agenteTrx), CountRows(grpTrx))
                        ),
                        nTrx, SortOrder.Descending
                    ),
                    agenteTrx, nTrx
                ),
                agenteTrx, locTrx
            )
        );
        // 5) estado inicial
        Set(varLocSelTrx, "Todos");
        Set(varActualTrx, Blank());
        // 6) selección inicial (First de la cola "Todos")
        Set(varActualTrx,
            First(Sort(
                Filter(colPendTrx, varLocSelTrx = "Todos" || '[IN] NombreAgente' = varLocSelTrx),
                'Fecha de captura', SortOrder.Ascending)));
        If(!IsBlank(varActualTrx) && varActualTrx.'[IN] Actualiza info',
            Set(varADTrx, LookUp('CM | TBL | Actualizacion de datos',
                '[AD] Interaccion'.'CM | TBL | Interaccion' = varActualTrx.'CM | TBL | Interaccion'));
            // F10: sin la vinculada, la que entró SIN VINCULAR (F8) de la misma cuenta; si tampoco, no llegó nada
            Set(varADSinVincTrx, IsBlank(varADTrx));
            If(varADSinVincTrx, Set(varADTrx, LookUp('CM | TBL | Actualizacion de datos',
                '[AD] Sin vincular' = true && '[AD] Cuenta'.'CM | TBL | Cuenta' = varActualTrx.'[IN] Cuenta'.'CM | TBL | Cuenta')));
            ClearCollect(colTelAntesTrx, Filter('CM | TBL | Telefonos', '[TL] CIF' = varActualTrx.cifTrx));
            ClearCollect(colDirAntesTrx, Filter('CM | TBL | Direccions', '[DR] CIF' = varActualTrx.cifTrx));
            ClearCollect(colCambiosTrx, Filter(Table(
                {campoTrx: "TELÉFONO CASA",     antesTrx: LookUp(colTelAntesTrx, '[TL] Tipo' = "Casa").'[TL] Numero',    nuevoTrx: varADTrx.'[AD] Telefono Casa'},
                {campoTrx: "TELÉFONO CELULAR",  antesTrx: LookUp(colTelAntesTrx, '[TL] Tipo' = "Celular").'[TL] Numero', nuevoTrx: varADTrx.'[AD] Telefono Celular'},
                {campoTrx: "TELÉFONO TRABAJO",  antesTrx: LookUp(colTelAntesTrx, '[TL] Tipo' = "Trabajo").'[TL] Numero', nuevoTrx: varADTrx.'[AD] Telefono trabajo'},
                {campoTrx: "DIRECCIÓN CASA",    antesTrx: LookUp(colDirAntesTrx, '[DR] Tipo' = "Casa").'[DR] Direccion', nuevoTrx: varADTrx.'[AD] Direccion casa'},
                {campoTrx: "DIRECCIÓN EC",      antesTrx: LookUp(colDirAntesTrx, '[DR] Tipo' = "EC").'[DR] Direccion',   nuevoTrx: varADTrx.'[AD] Direccion EC'},
                {campoTrx: "DIRECCIÓN TRABAJO", antesTrx: LookUp(colDirAntesTrx, '[DR] Tipo' = "Trabajo").'[DR] Direccion', nuevoTrx: varADTrx.'[AD] Direccion trabajo'},
                {campoTrx: "CORREO ELECTRÓNICO", antesTrx: Blank(), nuevoTrx: varADTrx.'[AD] Correo electronico'}
            ), !IsBlank(nuevoTrx))),
            Set(varADTrx, Blank()); Clear(colCambiosTrx)
        )
    Children:
      - cmpEncTrx:
          Control: CanvasComponent
          ComponentName: cmpEncabezado
          Properties:
            Height: =If(nfMovil, gblE.AltoBarra + 84, 84)
            Subtitulo: ="Localizador → pendientes → detalle. Grabá en el core y seguí de corrido."
            Titulo: ="Por transcribir"
            Width: =Parent.Width - Self.X
            X: =If(nfMovil, 0, gblE.AnchoNav)
      - btnActualizarTrx:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =gblC.borde
            BorderThickness: =1
            Color: =gblC.ink2
            Fill: =gblC.card
            FocusedBorderColor: =gblC.teal
            FocusedBorderThickness: =2
            Font: =Font.'Segoe UI'
            Height: =36
            OnSelect: |-
              =// 2) pendientes del día + join horneado (idéntico al paso 3 del OnVisible)
              ClearCollect(colPendTrx,
                  AddColumns(
                      // FIFO EN EL SERVIDOR: si la cola pasa del límite de filas (2000), entran las MÁS ANTIGUAS (las que van primero).
                      Sort(Filter('CM | TBL | Interaccions',
                          '[IN] Estado grabacion' = 'Choice | CM | Estado grabacion Interaccio'.Pendiente),
                          'Fecha de captura', SortOrder.Ascending),
                      clienteTrx, Upper(Coalesce(
                          ThisRecord.'[IN] Cuenta'.'Nombre Cliente', "—")),
                      cifTrx, Coalesce(
                          ThisRecord.'[IN] Cuenta'.'CIF Cliente', "—"),
                      productoTrx, Coalesce(
                          ThisRecord.'[IN] Cuenta'.'Tipo Producto', "—"),
                      ult4Trx, Coalesce(
                          ThisRecord.'[IN] Cuenta'.'Últimos 4', ""),
                      cuentaIdTrx, ThisRecord.'[IN] Cuenta'.'CM | TBL | Cuenta'
                  )
              );
              // 3) columna de localizadores
              // "Todos" = conteo EXACTO al datasource (CountIf delega); por localizador: de la cola cargada, o CountIf al servidor si la cola vino cortada
              ClearCollect(colLocsTrx, Table({locTrx: "Todos", nTrx: CountIf('CM | TBL | Interaccions', '[IN] Estado grabacion' = 'Choice | CM | Estado grabacion Interaccio'.Pendiente)}));
              Set(varPendCortadaTrx, CountRows(colPendTrx) < LookUp(colLocsTrx, locTrx = "Todos").nTrx);
              Collect(colLocsTrx,
                  RenameColumns(
                      ShowColumns(
                          Sort(
                              AddColumns(
                                  GroupBy(AddColumns(colPendTrx, agenteTrx, '[IN] NombreAgente'),
                                      agenteTrx, grpTrx),
                                  nTrx, If(varPendCortadaTrx, CountIf('CM | TBL | Interaccions', '[IN] Estado grabacion' = 'Choice | CM | Estado grabacion Interaccio'.Pendiente && '[IN] NombreAgente' = agenteTrx), CountRows(grpTrx))
                              ),
                              nTrx, SortOrder.Descending
                          ),
                          agenteTrx, nTrx
                      ),
                      agenteTrx, locTrx
                  )
              );
              // 4) reselección sobre la cola refrescada (varLocSelTrx queda como estaba)
              Set(varActualTrx,
                  First(Sort(
                      Filter(colPendTrx, varLocSelTrx = "Todos" || '[IN] NombreAgente' = varLocSelTrx),
                      'Fecha de captura', SortOrder.Ascending)));
              If(!IsBlank(varActualTrx) && varActualTrx.'[IN] Actualiza info',
                  Set(varADTrx, LookUp('CM | TBL | Actualizacion de datos',
                      '[AD] Interaccion'.'CM | TBL | Interaccion' = varActualTrx.'CM | TBL | Interaccion'));
                  // F10: sin la vinculada, la que entró SIN VINCULAR (F8) de la misma cuenta; si tampoco, no llegó nada
                  Set(varADSinVincTrx, IsBlank(varADTrx));
                  If(varADSinVincTrx, Set(varADTrx, LookUp('CM | TBL | Actualizacion de datos',
                      '[AD] Sin vincular' = true && '[AD] Cuenta'.'CM | TBL | Cuenta' = varActualTrx.'[IN] Cuenta'.'CM | TBL | Cuenta')));
                  ClearCollect(colTelAntesTrx, Filter('CM | TBL | Telefonos', '[TL] CIF' = varActualTrx.cifTrx));
                  ClearCollect(colDirAntesTrx, Filter('CM | TBL | Direccions', '[DR] CIF' = varActualTrx.cifTrx));
                  ClearCollect(colCambiosTrx, Filter(Table(
                      {campoTrx: "TELÉFONO CASA",     antesTrx: LookUp(colTelAntesTrx, '[TL] Tipo' = "Casa").'[TL] Numero',    nuevoTrx: varADTrx.'[AD] Telefono Casa'},
                      {campoTrx: "TELÉFONO CELULAR",  antesTrx: LookUp(colTelAntesTrx, '[TL] Tipo' = "Celular").'[TL] Numero', nuevoTrx: varADTrx.'[AD] Telefono Celular'},
                      {campoTrx: "TELÉFONO TRABAJO",  antesTrx: LookUp(colTelAntesTrx, '[TL] Tipo' = "Trabajo").'[TL] Numero', nuevoTrx: varADTrx.'[AD] Telefono trabajo'},
                      {campoTrx: "DIRECCIÓN CASA",    antesTrx: LookUp(colDirAntesTrx, '[DR] Tipo' = "Casa").'[DR] Direccion', nuevoTrx: varADTrx.'[AD] Direccion casa'},
                      {campoTrx: "DIRECCIÓN EC",      antesTrx: LookUp(colDirAntesTrx, '[DR] Tipo' = "EC").'[DR] Direccion',   nuevoTrx: varADTrx.'[AD] Direccion EC'},
                      {campoTrx: "DIRECCIÓN TRABAJO", antesTrx: LookUp(colDirAntesTrx, '[DR] Tipo' = "Trabajo").'[DR] Direccion', nuevoTrx: varADTrx.'[AD] Direccion trabajo'},
                      {campoTrx: "CORREO ELECTRÓNICO", antesTrx: Blank(), nuevoTrx: varADTrx.'[AD] Correo electronico'}
                  ), !IsBlank(nuevoTrx))),
                  Set(varADTrx, Blank()); Clear(colCambiosTrx)
              )
            Size: =9
            Text: ="↻ Actualizar"
            Width: =130
            X: =Parent.Width - gblE.Pad - Self.Width
            Y: =If(nfMovil, gblE.AltoBarra + 8, 24)
      - conContenidoTrx:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height - Self.Y - gblE.Pad
            Width: =Min(gblE.AnchoMax, Parent.Width - If(nfMovil, 0, gblE.AnchoNav) - 2*gblE.Pad)
            X: |-
              =If(nfMovil, 0, gblE.AnchoNav)
                  + Max(gblE.Pad, (Parent.Width - If(nfMovil, 0, gblE.AnchoNav) - gblE.AnchoMax) / 2)
            Y: =cmpEncTrx.Y + cmpEncTrx.Height
          Children:
            - lblHeadLocsTrx:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.muted
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =18
                  PaddingLeft: =0
                  Size: =8
                  Text: ="LOCALIZADORES"
                  Visible: =!nfMovil
                  Width: =If(Parent.Width < 1080, 150, 185)
                  Wrap: =false
            - galLocsTrx:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  AccessibleLabel: ="Localizadores con pendientes"
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Height: =Parent.Height - 22
                  Items: =colLocsTrx
                  OnSelect: |-
                    =Set(varLocSelTrx, ThisItem.locTrx);
                    Set(varActualTrx, Blank());
                    Set(varActualTrx,
                        First(Sort(
                            Filter(colPendTrx, varLocSelTrx = "Todos" || '[IN] NombreAgente' = varLocSelTrx),
                            'Fecha de captura', SortOrder.Ascending)));
                    If(!IsBlank(varActualTrx) && varActualTrx.'[IN] Actualiza info',
                        Set(varADTrx, LookUp('CM | TBL | Actualizacion de datos',
                            '[AD] Interaccion'.'CM | TBL | Interaccion' = varActualTrx.'CM | TBL | Interaccion'));
                        // F10: sin la vinculada, la que entró SIN VINCULAR (F8) de la misma cuenta; si tampoco, no llegó nada
                        Set(varADSinVincTrx, IsBlank(varADTrx));
                        If(varADSinVincTrx, Set(varADTrx, LookUp('CM | TBL | Actualizacion de datos',
                            '[AD] Sin vincular' = true && '[AD] Cuenta'.'CM | TBL | Cuenta' = varActualTrx.'[IN] Cuenta'.'CM | TBL | Cuenta')));
                        ClearCollect(colTelAntesTrx, Filter('CM | TBL | Telefonos', '[TL] CIF' = varActualTrx.cifTrx));
                        ClearCollect(colDirAntesTrx, Filter('CM | TBL | Direccions', '[DR] CIF' = varActualTrx.cifTrx));
                        ClearCollect(colCambiosTrx, Filter(Table(
                            {campoTrx: "TELÉFONO CASA",     antesTrx: LookUp(colTelAntesTrx, '[TL] Tipo' = "Casa").'[TL] Numero',    nuevoTrx: varADTrx.'[AD] Telefono Casa'},
                            {campoTrx: "TELÉFONO CELULAR",  antesTrx: LookUp(colTelAntesTrx, '[TL] Tipo' = "Celular").'[TL] Numero', nuevoTrx: varADTrx.'[AD] Telefono Celular'},
                            {campoTrx: "TELÉFONO TRABAJO",  antesTrx: LookUp(colTelAntesTrx, '[TL] Tipo' = "Trabajo").'[TL] Numero', nuevoTrx: varADTrx.'[AD] Telefono trabajo'},
                            {campoTrx: "DIRECCIÓN CASA",    antesTrx: LookUp(colDirAntesTrx, '[DR] Tipo' = "Casa").'[DR] Direccion', nuevoTrx: varADTrx.'[AD] Direccion casa'},
                            {campoTrx: "DIRECCIÓN EC",      antesTrx: LookUp(colDirAntesTrx, '[DR] Tipo' = "EC").'[DR] Direccion',   nuevoTrx: varADTrx.'[AD] Direccion EC'},
                            {campoTrx: "DIRECCIÓN TRABAJO", antesTrx: LookUp(colDirAntesTrx, '[DR] Tipo' = "Trabajo").'[DR] Direccion', nuevoTrx: varADTrx.'[AD] Direccion trabajo'},
                            {campoTrx: "CORREO ELECTRÓNICO", antesTrx: Blank(), nuevoTrx: varADTrx.'[AD] Correo electronico'}
                        ), !IsBlank(nuevoTrx))),
                        Set(varADTrx, Blank()); Clear(colCambiosTrx)
                    );
                    If(!nfMovil, SetFocus(txtCodigoTrx))
                  ShowScrollbar: =false
                  TemplatePadding: =0
                  TemplateSize: =54
                  Visible: =!nfMovil
                  Width: =If(Parent.Width < 1080, 150, 185)
                  Y: =22
                Children:
                  - conLocCardTrx:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =gblC.borde
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =If(ThisItem.locTrx = varLocSelTrx, gblC.teal, gblC.card)
                        Height: =46
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Width: =Parent.TemplateWidth
                  - lblLocNomTrx:
                      Control: Label@2.5.1
                      Properties:
                        Color: =If(ThisItem.locTrx = varLocSelTrx, Color.White, gblC.ink)
                        FocusedBorderColor: =If(ThisItem.locTrx = varLocSelTrx, Color.White, gblC.teal)
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =26
                        PaddingLeft: =0
                        Size: =9
                        Text: |-
                          =If(ThisItem.locTrx = "Todos", "Todos", "🏍️ " & ThisItem.locTrx)
                        Width: =Parent.TemplateWidth - 66
                        Wrap: =false
                        X: =gblE.PadSm
                        Y: =10
                  - chpLocNTrx:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =If(ThisItem.locTrx = varLocSelTrx, Color.White, gblC.ink2)
                        Fill: =If(ThisItem.locTrx = varLocSelTrx, gblC.blancoTr, gblC.hairline)
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =26
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =8
                        Text: =Text(ThisItem.nTrx)
                        Width: =14 + 7*Len(Self.Text)
                        X: =Parent.TemplateWidth - Self.Width - gblE.PadSm
                        Y: =10
                  - btnFilaLocsTrx:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =Color.Transparent
                        Fill: =Color.Transparent
                        FocusedBorderColor: =If(ThisItem.locTrx = varLocSelTrx, Color.White, gblC.teal)
                        FocusedBorderThickness: =2
                        Height: =Parent.TemplateHeight
                        HoverFill: =RGBA(15, 107, 107, 0.06)
                        OnSelect: =Select(Parent)
                        PressedFill: =RGBA(15, 107, 107, 0.12)
                        TabIndex: =0
                        Text: =If(ThisItem.locTrx = "Todos", "Todos los localizadores", "Localizador " & ThisItem.locTrx) & " (" & ThisItem.nTrx & " pendientes)" & If(ThisItem.locTrx = "Todos" && varPendCortadaTrx, " · ⚠ se muestran las " & CountRows(colPendTrx) & " más antiguas", "")
                        Width: =Parent.TemplateWidth
                        X: =0
                        Y: =0
            - galLocsMovTrx:
                Control: Gallery@2.15.0
                Variant: Horizontal
                Properties:
                  AccessibleLabel: ="Localizadores con pendientes"
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Height: =56
                  Items: =colLocsTrx
                  OnSelect: |-
                    =Set(varLocSelTrx, ThisItem.locTrx);
                    Set(varActualTrx, Blank());
                    Set(varActualTrx,
                        First(Sort(
                            Filter(colPendTrx, varLocSelTrx = "Todos" || '[IN] NombreAgente' = varLocSelTrx),
                            'Fecha de captura', SortOrder.Ascending)));
                    If(!IsBlank(varActualTrx) && varActualTrx.'[IN] Actualiza info',
                        Set(varADTrx, LookUp('CM | TBL | Actualizacion de datos',
                            '[AD] Interaccion'.'CM | TBL | Interaccion' = varActualTrx.'CM | TBL | Interaccion'));
                        // F10: sin la vinculada, la que entró SIN VINCULAR (F8) de la misma cuenta; si tampoco, no llegó nada
                        Set(varADSinVincTrx, IsBlank(varADTrx));
                        If(varADSinVincTrx, Set(varADTrx, LookUp('CM | TBL | Actualizacion de datos',
                            '[AD] Sin vincular' = true && '[AD] Cuenta'.'CM | TBL | Cuenta' = varActualTrx.'[IN] Cuenta'.'CM | TBL | Cuenta')));
                        ClearCollect(colTelAntesTrx, Filter('CM | TBL | Telefonos', '[TL] CIF' = varActualTrx.cifTrx));
                        ClearCollect(colDirAntesTrx, Filter('CM | TBL | Direccions', '[DR] CIF' = varActualTrx.cifTrx));
                        ClearCollect(colCambiosTrx, Filter(Table(
                            {campoTrx: "TELÉFONO CASA",     antesTrx: LookUp(colTelAntesTrx, '[TL] Tipo' = "Casa").'[TL] Numero',    nuevoTrx: varADTrx.'[AD] Telefono Casa'},
                            {campoTrx: "TELÉFONO CELULAR",  antesTrx: LookUp(colTelAntesTrx, '[TL] Tipo' = "Celular").'[TL] Numero', nuevoTrx: varADTrx.'[AD] Telefono Celular'},
                            {campoTrx: "TELÉFONO TRABAJO",  antesTrx: LookUp(colTelAntesTrx, '[TL] Tipo' = "Trabajo").'[TL] Numero', nuevoTrx: varADTrx.'[AD] Telefono trabajo'},
                            {campoTrx: "DIRECCIÓN CASA",    antesTrx: LookUp(colDirAntesTrx, '[DR] Tipo' = "Casa").'[DR] Direccion', nuevoTrx: varADTrx.'[AD] Direccion casa'},
                            {campoTrx: "DIRECCIÓN EC",      antesTrx: LookUp(colDirAntesTrx, '[DR] Tipo' = "EC").'[DR] Direccion',   nuevoTrx: varADTrx.'[AD] Direccion EC'},
                            {campoTrx: "DIRECCIÓN TRABAJO", antesTrx: LookUp(colDirAntesTrx, '[DR] Tipo' = "Trabajo").'[DR] Direccion', nuevoTrx: varADTrx.'[AD] Direccion trabajo'},
                            {campoTrx: "CORREO ELECTRÓNICO", antesTrx: Blank(), nuevoTrx: varADTrx.'[AD] Correo electronico'}
                        ), !IsBlank(nuevoTrx))),
                        Set(varADTrx, Blank()); Clear(colCambiosTrx)
                    )
                  ShowScrollbar: =false
                  TemplatePadding: =0
                  TemplateSize: =150
                  Visible: =nfMovil
                  Width: =Parent.Width
                Children:
                  - conLocCardMovTrx:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =gblC.borde
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =If(ThisItem.locTrx = varLocSelTrx, gblC.teal, gblC.card)
                        Height: =46
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Width: =Parent.TemplateWidth - 8
                  - lblLocNomMovTrx:
                      Control: Label@2.5.1
                      Properties:
                        Color: =If(ThisItem.locTrx = varLocSelTrx, Color.White, gblC.ink)
                        FocusedBorderColor: =If(ThisItem.locTrx = varLocSelTrx, Color.White, gblC.teal)
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =26
                        PaddingLeft: =0
                        Size: =9
                        Text: |-
                          =If(ThisItem.locTrx = "Todos", "Todos", "🏍️ " & ThisItem.locTrx)
                        Width: =Parent.TemplateWidth - 60
                        Wrap: =false
                        X: =gblE.PadSm
                        Y: =10
                  - chpLocNMovTrx:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =If(ThisItem.locTrx = varLocSelTrx, Color.White, gblC.ink2)
                        Fill: =If(ThisItem.locTrx = varLocSelTrx, gblC.blancoTr, gblC.hairline)
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
