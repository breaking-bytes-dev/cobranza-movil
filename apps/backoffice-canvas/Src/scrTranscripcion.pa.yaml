Screens:
  scrTranscripcion:
    Properties:
      Fill: =gblC.pantalla
      OnVisible: |-
        =// 2) cuentas para el join (cota 2000 declarada — 00 §4.1)
        ClearCollect(colCtasTrx, 'CM | TBL | Cuentas');
        // 3) pendientes del día + join horneado UNA vez (receta 7.7); nombre en Upper (LED-01)
        ClearCollect(colPendTrx,
            AddColumns(
                Filter('CM | TBL | Interaccions',
                    '[IN] Estado grabacion' = 'Choice | CM | Estado grabacion Interaccio'.Pendiente),
                clienteTrx, Upper(Coalesce(
                    LookUp(colCtasTrx, '[CT] Numero de cuenta' = '[IN] Numerocuenta').'Nombre Cliente', "—")),
                cifTrx, Coalesce(
                    LookUp(colCtasTrx, '[CT] Numero de cuenta' = '[IN] Numerocuenta').'CIF Cliente', "—"),
                productoTrx, Coalesce(
                    LookUp(colCtasTrx, '[CT] Numero de cuenta' = '[IN] Numerocuenta').'Tipo Producto', "—")
            )
        );
        // 4) columna de localizadores materializada
        ClearCollect(colLocsTrx, Table({locTrx: "Todos", nTrx: CountRows(colPendTrx)}));
        Collect(colLocsTrx,
            RenameColumns(
                ShowColumns(
                    SortByColumns(
                        AddColumns(
                            GroupBy(AddColumns(colPendTrx, agenteTrx, '[IN] NombreAgente'),
                                agenteTrx, grpTrx),
                            nTrx, CountRows(grpTrx)
                        ),
                        nTrx, SortOrder.Descending
                    ),
                    agenteTrx, nTrx
                ),
                agenteTrx, locTrx
            )
        );
        // 5) estado inicial
        Set(varLocSelTrx, "Todos");
        Set(varActualTrx, Blank());
        // 6) selección inicial (First de la cola "Todos")
        Set(varActualTrx,
            First(SortByColumns(
                Filter(colPendTrx, varLocSelTrx = "Todos" || '[IN] NombreAgente' = varLocSelTrx),
                'Fecha de captura', SortOrder.Ascending)));
        If(!IsBlank(varActualTrx) && varActualTrx.'[IN] Actualiza info',
            Set(varADTrx, LookUp('CM | TBL | Actualizacion de datos',
                '[AD] Interaccion'.'CM | TBL | Interaccion' = varActualTrx.'CM | TBL | Interaccion'));
            ClearCollect(colTelAntesTrx, Filter('CM | TBL | Telefonos', '[TL] CIF' = varActualTrx.cifTrx));
            ClearCollect(colDirAntesTrx, Filter('CM | TBL | Direccions', '[DR] CIF' = varActualTrx.cifTrx));
            ClearCollect(colCambiosTrx, Filter(Table(
                {campoTrx: "TELÉFONO CASA",     antesTrx: LookUp(colTelAntesTrx, '[TL] Tipo' = "Casa").'[TL] Numero',    nuevoTrx: varADTrx.'[AD] Telefono Casa'},
                {campoTrx: "TELÉFONO CELULAR",  antesTrx: LookUp(colTelAntesTrx, '[TL] Tipo' = "Celular").'[TL] Numero', nuevoTrx: varADTrx.'[AD] Telefono Celular'},
                {campoTrx: "TELÉFONO TRABAJO",  antesTrx: LookUp(colTelAntesTrx, '[TL] Tipo' = "Trabajo").'[TL] Numero', nuevoTrx: varADTrx.'[AD] Telefono trabajo'},
                {campoTrx: "DIRECCIÓN CASA",    antesTrx: LookUp(colDirAntesTrx, '[DR] Tipo' = "Casa").'[DR] Direccion', nuevoTrx: varADTrx.'[AD] Direccion casa'},
                {campoTrx: "DIRECCIÓN EC",      antesTrx: LookUp(colDirAntesTrx, '[DR] Tipo' = "EC").'[DR] Direccion',   nuevoTrx: varADTrx.'[AD] Direccion EC'},
                {campoTrx: "DIRECCIÓN TRABAJO", antesTrx: LookUp(colDirAntesTrx, '[DR] Tipo' = "Trabajo").'[DR] Direccion', nuevoTrx: varADTrx.'[AD] Direccion trabajo'},
                {campoTrx: "CORREO ELECTRÓNICO", antesTrx: Blank(), nuevoTrx: varADTrx.'[AD] Correo electronico'}
            ), !IsBlank(nuevoTrx))),
            Set(varADTrx, Blank()); Clear(colCambiosTrx)
        )
    Children:
      - cmpEncTrx:
          Control: CanvasComponent
          ComponentName: cmpEncabezado
          Properties:
            Height: =If(nfMovil, gblE.AltoBarra + 84, 84)
            Subtitulo: ="Localizador → pendientes → detalle. Grabá en el core y seguí de corrido."
            Titulo: ="Por transcribir"
            Width: =Parent.Width - Self.X
            X: =If(nfMovil, 0, gblE.AnchoNav)
      - btnActualizarTrx:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =gblC.borde
            BorderThickness: =1
            Color: =gblC.ink2
            Fill: =gblC.card
            Font: =Font.'Segoe UI'
            Height: =36
            OnSelect: |-
              =// 1) cuentas para el join (idéntico al paso 2 del OnVisible)
              ClearCollect(colCtasTrx, 'CM | TBL | Cuentas');
              // 2) pendientes del día + join horneado (idéntico al paso 3 del OnVisible)
              ClearCollect(colPendTrx,
                  AddColumns(
                      Filter('CM | TBL | Interaccions',
                          '[IN] Estado grabacion' = 'Choice | CM | Estado grabacion Interaccio'.Pendiente),
                      clienteTrx, Upper(Coalesce(
                          LookUp(colCtasTrx, '[CT] Numero de cuenta' = '[IN] Numerocuenta').'Nombre Cliente', "—")),
                      cifTrx, Coalesce(
                          LookUp(colCtasTrx, '[CT] Numero de cuenta' = '[IN] Numerocuenta').'CIF Cliente', "—"),
                      productoTrx, Coalesce(
                          LookUp(colCtasTrx, '[CT] Numero de cuenta' = '[IN] Numerocuenta').'Tipo Producto', "—")
                  )
              );
              // 3) columna de localizadores
              ClearCollect(colLocsTrx, Table({locTrx: "Todos", nTrx: CountRows(colPendTrx)}));
              Collect(colLocsTrx,
                  RenameColumns(
                      ShowColumns(
                          SortByColumns(
                              AddColumns(
                                  GroupBy(AddColumns(colPendTrx, agenteTrx, '[IN] NombreAgente'),
                                      agenteTrx, grpTrx),
                                  nTrx, CountRows(grpTrx)
                              ),
                              nTrx, SortOrder.Descending
                          ),
                          agenteTrx, nTrx
                      ),
                      agenteTrx, locTrx
                  )
              );
              // 4) reselección sobre la cola refrescada (varLocSelTrx queda como estaba)
              Set(varActualTrx,
                  First(SortByColumns(
                      Filter(colPendTrx, varLocSelTrx = "Todos" || '[IN] NombreAgente' = varLocSelTrx),
                      'Fecha de captura', SortOrder.Ascending)));
              If(!IsBlank(varActualTrx) && varActualTrx.'[IN] Actualiza info',
                  Set(varADTrx, LookUp('CM | TBL | Actualizacion de datos',
                      '[AD] Interaccion'.'CM | TBL | Interaccion' = varActualTrx.'CM | TBL | Interaccion'));
                  ClearCollect(colTelAntesTrx, Filter('CM | TBL | Telefonos', '[TL] CIF' = varActualTrx.cifTrx));
                  ClearCollect(colDirAntesTrx, Filter('CM | TBL | Direccions', '[DR] CIF' = varActualTrx.cifTrx));
                  ClearCollect(colCambiosTrx, Filter(Table(
                      {campoTrx: "TELÉFONO CASA",     antesTrx: LookUp(colTelAntesTrx, '[TL] Tipo' = "Casa").'[TL] Numero',    nuevoTrx: varADTrx.'[AD] Telefono Casa'},
                      {campoTrx: "TELÉFONO CELULAR",  antesTrx: LookUp(colTelAntesTrx, '[TL] Tipo' = "Celular").'[TL] Numero', nuevoTrx: varADTrx.'[AD] Telefono Celular'},
                      {campoTrx: "TELÉFONO TRABAJO",  antesTrx: LookUp(colTelAntesTrx, '[TL] Tipo' = "Trabajo").'[TL] Numero', nuevoTrx: varADTrx.'[AD] Telefono trabajo'},
                      {campoTrx: "DIRECCIÓN CASA",    antesTrx: LookUp(colDirAntesTrx, '[DR] Tipo' = "Casa").'[DR] Direccion', nuevoTrx: varADTrx.'[AD] Direccion casa'},
                      {campoTrx: "DIRECCIÓN EC",      antesTrx: LookUp(colDirAntesTrx, '[DR] Tipo' = "EC").'[DR] Direccion',   nuevoTrx: varADTrx.'[AD] Direccion EC'},
                      {campoTrx: "DIRECCIÓN TRABAJO", antesTrx: LookUp(colDirAntesTrx, '[DR] Tipo' = "Trabajo").'[DR] Direccion', nuevoTrx: varADTrx.'[AD] Direccion trabajo'},
                      {campoTrx: "CORREO ELECTRÓNICO", antesTrx: Blank(), nuevoTrx: varADTrx.'[AD] Correo electronico'}
                  ), !IsBlank(nuevoTrx))),
                  Set(varADTrx, Blank()); Clear(colCambiosTrx)
              )
            Size: =9
            Text: ="↻ Actualizar"
            Width: =130
            X: =Parent.Width - gblE.Pad - Self.Width
            Y: =If(nfMovil, gblE.AltoBarra + 8, 24)
      - conContenidoTrx:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height - Self.Y - gblE.Pad
            Width: =Min(gblE.AnchoMax, Parent.Width - If(nfMovil, 0, gblE.AnchoNav) - 2*gblE.Pad)
            X: |-
              =If(nfMovil, 0, gblE.AnchoNav)
                  + Max(gblE.Pad, (Parent.Width - If(nfMovil, 0, gblE.AnchoNav) - gblE.AnchoMax) / 2)
            Y: =cmpEncTrx.Y + cmpEncTrx.Height
          Children:
            - lblHeadLocsTrx:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.muted
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =18
                  PaddingLeft: =0
                  Size: =8
                  Text: ="LOCALIZADORES"
                  Visible: =!nfMovil
                  Width: =If(Parent.Width < 1080, 150, 185)
                  Wrap: =false
            - galLocsTrx:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  Height: =Parent.Height - 22
                  Items: =colLocsTrx
                  OnSelect: |-
                    =Set(varLocSelTrx, ThisItem.locTrx);
                    Set(varActualTrx, Blank());
                    Set(varActualTrx,
                        First(SortByColumns(
                            Filter(colPendTrx, varLocSelTrx = "Todos" || '[IN] NombreAgente' = varLocSelTrx),
                            'Fecha de captura', SortOrder.Ascending)));
                    If(!IsBlank(varActualTrx) && varActualTrx.'[IN] Actualiza info',
                        Set(varADTrx, LookUp('CM | TBL | Actualizacion de datos',
                            '[AD] Interaccion'.'CM | TBL | Interaccion' = varActualTrx.'CM | TBL | Interaccion'));
                        ClearCollect(colTelAntesTrx, Filter('CM | TBL | Telefonos', '[TL] CIF' = varActualTrx.cifTrx));
                        ClearCollect(colDirAntesTrx, Filter('CM | TBL | Direccions', '[DR] CIF' = varActualTrx.cifTrx));
                        ClearCollect(colCambiosTrx, Filter(Table(
                            {campoTrx: "TELÉFONO CASA",     antesTrx: LookUp(colTelAntesTrx, '[TL] Tipo' = "Casa").'[TL] Numero',    nuevoTrx: varADTrx.'[AD] Telefono Casa'},
                            {campoTrx: "TELÉFONO CELULAR",  antesTrx: LookUp(colTelAntesTrx, '[TL] Tipo' = "Celular").'[TL] Numero', nuevoTrx: varADTrx.'[AD] Telefono Celular'},
                            {campoTrx: "TELÉFONO TRABAJO",  antesTrx: LookUp(colTelAntesTrx, '[TL] Tipo' = "Trabajo").'[TL] Numero', nuevoTrx: varADTrx.'[AD] Telefono trabajo'},
                            {campoTrx: "DIRECCIÓN CASA",    antesTrx: LookUp(colDirAntesTrx, '[DR] Tipo' = "Casa").'[DR] Direccion', nuevoTrx: varADTrx.'[AD] Direccion casa'},
                            {campoTrx: "DIRECCIÓN EC",      antesTrx: LookUp(colDirAntesTrx, '[DR] Tipo' = "EC").'[DR] Direccion',   nuevoTrx: varADTrx.'[AD] Direccion EC'},
                            {campoTrx: "DIRECCIÓN TRABAJO", antesTrx: LookUp(colDirAntesTrx, '[DR] Tipo' = "Trabajo").'[DR] Direccion', nuevoTrx: varADTrx.'[AD] Direccion trabajo'},
                            {campoTrx: "CORREO ELECTRÓNICO", antesTrx: Blank(), nuevoTrx: varADTrx.'[AD] Correo electronico'}
                        ), !IsBlank(nuevoTrx))),
                        Set(varADTrx, Blank()); Clear(colCambiosTrx)
                    );
                    If(!nfMovil, SetFocus(txtCodigoTrx))
                  ShowScrollbar: =false
                  TemplatePadding: =0
                  TemplateSize: =54
                  Visible: =!nfMovil
                  Width: =If(Parent.Width < 1080, 150, 185)
                  Y: =22
                Children:
                  - btnLocCardTrx:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =gblC.borde
                        BorderThickness: =1
                        Fill: =If(ThisItem.locTrx = varLocSelTrx, gblC.teal, gblC.card)
                        Font: =Font.'Segoe UI'
                        Height: =46
                        HoverFill: =ColorFade(Self.Fill, 5%)
                        OnSelect: =Select(Parent)
                        Text: =""
                        Width: =Parent.TemplateWidth
                  - lblLocNomTrx:
                      Control: Label@2.5.1
                      Properties:
                        Color: =If(ThisItem.locTrx = varLocSelTrx, Color.White, gblC.ink)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =26
                        OnSelect: =Select(Parent)
                        PaddingLeft: =0
                        Size: =9
                        Text: |-
                          =If(ThisItem.locTrx = "Todos", "Todos", "🏍️ " & ThisItem.locTrx)
                        Width: =Parent.TemplateWidth - 66
                        Wrap: =false
                        X: =gblE.PadSm
                        Y: =10
                  - chpLocNTrx:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =If(ThisItem.locTrx = varLocSelTrx, Color.White, gblC.ink2)
                        Fill: =If(ThisItem.locTrx = varLocSelTrx, gblC.blancoTr, gblC.hairline)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =26
                        OnSelect: =Select(Parent)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =8
                        Text: =Text(ThisItem.nTrx)
                        Width: =14 + 7*Len(Self.Text)
                        X: =Parent.TemplateWidth - Self.Width - gblE.PadSm
                        Y: =10
            - galLocsMovTrx:
                Control: Gallery@2.15.0
                Variant: Horizontal
                Properties:
                  Height: =56
                  Items: =colLocsTrx
                  OnSelect: |-
                    =Set(varLocSelTrx, ThisItem.locTrx);
                    Set(varActualTrx, Blank());
                    Set(varActualTrx,
                        First(SortByColumns(
                            Filter(colPendTrx, varLocSelTrx = "Todos" || '[IN] NombreAgente' = varLocSelTrx),
                            'Fecha de captura', SortOrder.Ascending)));
                    If(!IsBlank(varActualTrx) && varActualTrx.'[IN] Actualiza info',
                        Set(varADTrx, LookUp('CM | TBL | Actualizacion de datos',
                            '[AD] Interaccion'.'CM | TBL | Interaccion' = varActualTrx.'CM | TBL | Interaccion'));
                        ClearCollect(colTelAntesTrx, Filter('CM | TBL | Telefonos', '[TL] CIF' = varActualTrx.cifTrx));
                        ClearCollect(colDirAntesTrx, Filter('CM | TBL | Direccions', '[DR] CIF' = varActualTrx.cifTrx));
                        ClearCollect(colCambiosTrx, Filter(Table(
                            {campoTrx: "TELÉFONO CASA",     antesTrx: LookUp(colTelAntesTrx, '[TL] Tipo' = "Casa").'[TL] Numero',    nuevoTrx: varADTrx.'[AD] Telefono Casa'},
                            {campoTrx: "TELÉFONO CELULAR",  antesTrx: LookUp(colTelAntesTrx, '[TL] Tipo' = "Celular").'[TL] Numero', nuevoTrx: varADTrx.'[AD] Telefono Celular'},
                            {campoTrx: "TELÉFONO TRABAJO",  antesTrx: LookUp(colTelAntesTrx, '[TL] Tipo' = "Trabajo").'[TL] Numero', nuevoTrx: varADTrx.'[AD] Telefono trabajo'},
                            {campoTrx: "DIRECCIÓN CASA",    antesTrx: LookUp(colDirAntesTrx, '[DR] Tipo' = "Casa").'[DR] Direccion', nuevoTrx: varADTrx.'[AD] Direccion casa'},
                            {campoTrx: "DIRECCIÓN EC",      antesTrx: LookUp(colDirAntesTrx, '[DR] Tipo' = "EC").'[DR] Direccion',   nuevoTrx: varADTrx.'[AD] Direccion EC'},
                            {campoTrx: "DIRECCIÓN TRABAJO", antesTrx: LookUp(colDirAntesTrx, '[DR] Tipo' = "Trabajo").'[DR] Direccion', nuevoTrx: varADTrx.'[AD] Direccion trabajo'},
                            {campoTrx: "CORREO ELECTRÓNICO", antesTrx: Blank(), nuevoTrx: varADTrx.'[AD] Correo electronico'}
                        ), !IsBlank(nuevoTrx))),
                        Set(varADTrx, Blank()); Clear(colCambiosTrx)
                    )
                  ShowScrollbar: =false
                  TemplatePadding: =0
                  TemplateSize: =150
                  Visible: =nfMovil
                  Width: =Parent.Width
                Children:
                  - btnLocCardMovTrx:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =gblC.borde
                        BorderThickness: =1
                        Fill: =If(ThisItem.locTrx = varLocSelTrx, gblC.teal, gblC.card)
                        Font: =Font.'Segoe UI'
                        Height: =46
                        HoverFill: =ColorFade(Self.Fill, 5%)
                        OnSelect: =Select(Parent)
                        Text: =""
                        Width: =Parent.TemplateWidth - 8
                  - lblLocNomMovTrx:
                      Control: Label@2.5.1
                      Properties:
                        Color: =If(ThisItem.locTrx = varLocSelTrx, Color.White, gblC.ink)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =26
                        OnSelect: =Select(Parent)
                        PaddingLeft: =0
                        Size: =9
                        Text: |-
                          =If(ThisItem.locTrx = "Todos", "Todos", "🏍️ " & ThisItem.locTrx)
                        Width: =Parent.TemplateWidth - 60
                        Wrap: =false
                        X: =gblE.PadSm
                        Y: =10
                  - chpLocNMovTrx:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =If(ThisItem.locTrx = varLocSelTrx, Color.White, gblC.ink2)
                        Fill: =If(ThisItem.locTrx = varLocSelTrx, gblC.blancoTr, gblC.hairline)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =26
                        OnSelect: =Select(Parent)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =8
                        Text: =Text(ThisItem.nTrx)
                        Width: =14 + 7*Len(Self.Text)
                        X: =Parent.TemplateWidth - Self.Width - 14
                        Y: =10
            - lblHeadColaTrx:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.muted
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =18
                  PaddingLeft: =0
                  Size: =8
                  Text: |-
                    ="PENDIENTES"
                        & If(varLocSelTrx <> "Todos", " · " & Upper(First(Split(varLocSelTrx, " ")).Value), "")
                        & " · " & CountRows(galColaTrx.AllItems) & " · FIFO"
                  Width: =If(Parent.Width < 1080, 210, 255)
                  Wrap: =false
                  X: =If(nfMovil, 0, If(Parent.Width < 1080, 150, 185) + 12)
                  Y: =If(nfMovil, conDetalleTrx.Y + conDetalleTrx.Height + 8, 0)
            - galColaTrx:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  Height: =Parent.Height - Self.Y
                  Items: |-
                    =SortByColumns(
                        Filter(colPendTrx, varLocSelTrx = "Todos" || '[IN] NombreAgente' = varLocSelTrx),
                        'Fecha de captura', SortOrder.Ascending)
                  OnSelect: |-
                    =Set(varActualTrx, ThisItem);
                    If(!IsBlank(varActualTrx) && varActualTrx.'[IN] Actualiza info',
                        Set(varADTrx, LookUp('CM | TBL | Actualizacion de datos',
                            '[AD] Interaccion'.'CM | TBL | Interaccion' = varActualTrx.'CM | TBL | Interaccion'));
                        ClearCollect(colTelAntesTrx, Filter('CM | TBL | Telefonos', '[TL] CIF' = varActualTrx.cifTrx));
                        ClearCollect(colDirAntesTrx, Filter('CM | TBL | Direccions', '[DR] CIF' = varActualTrx.cifTrx));
                        ClearCollect(colCambiosTrx, Filter(Table(
                            {campoTrx: "TELÉFONO CASA",     antesTrx: LookUp(colTelAntesTrx, '[TL] Tipo' = "Casa").'[TL] Numero',    nuevoTrx: varADTrx.'[AD] Telefono Casa'},
                            {campoTrx: "TELÉFONO CELULAR",  antesTrx: LookUp(colTelAntesTrx, '[TL] Tipo' = "Celular").'[TL] Numero', nuevoTrx: varADTrx.'[AD] Telefono Celular'},
                            {campoTrx: "TELÉFONO TRABAJO",  antesTrx: LookUp(colTelAntesTrx, '[TL] Tipo' = "Trabajo").'[TL] Numero', nuevoTrx: varADTrx.'[AD] Telefono trabajo'},
                            {campoTrx: "DIRECCIÓN CASA",    antesTrx: LookUp(colDirAntesTrx, '[DR] Tipo' = "Casa").'[DR] Direccion', nuevoTrx: varADTrx.'[AD] Direccion casa'},
                            {campoTrx: "DIRECCIÓN EC",      antesTrx: LookUp(colDirAntesTrx, '[DR] Tipo' = "EC").'[DR] Direccion',   nuevoTrx: varADTrx.'[AD] Direccion EC'},
                            {campoTrx: "DIRECCIÓN TRABAJO", antesTrx: LookUp(colDirAntesTrx, '[DR] Tipo' = "Trabajo").'[DR] Direccion', nuevoTrx: varADTrx.'[AD] Direccion trabajo'},
                            {campoTrx: "CORREO ELECTRÓNICO", antesTrx: Blank(), nuevoTrx: varADTrx.'[AD] Correo electronico'}
                        ), !IsBlank(nuevoTrx))),
                        Set(varADTrx, Blank()); Clear(colCambiosTrx)
                    );
                    If(!nfMovil, SetFocus(txtCodigoTrx))
                  ShowScrollbar: =false
                  TemplateFill: |-
                    =If(!IsBlank(varActualTrx)
                        && ThisItem.'[IN] Numero de Interaccion' = varActualTrx.'[IN] Numero de Interaccion',
                        gblC.tealSuave, gblC.card)
                  TemplatePadding: =0
                  TemplateSize: =gblE.AltoFila
                  Width: =If(nfMovil, Parent.Width, If(Parent.Width < 1080, 210, 255))
                  X: =If(nfMovil, 0, If(Parent.Width < 1080, 150, 185) + 12)
                  Y: =lblHeadColaTrx.Y + 22
                Children:
                  - lblColaNomTrx:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.ink
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =20
                        OnSelect: =Select(Parent)
                        PaddingLeft: =0
                        Size: =9
                        Text: =ThisItem.clienteTrx
                        Width: =Parent.TemplateWidth - 2*gblE.PadSm
                        Wrap: =false
                        X: =gblE.PadSm
                        Y: =8
                  - lblColaMetaTrx:
                      Control: Label@2.5.1
                      Properties:
