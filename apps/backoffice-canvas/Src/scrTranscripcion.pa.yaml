                                // Sin rol, sin permiso o sin fila en la bóveda → solo "•••• 1234"; nunca se cae al
                                // número de la cuenta. Copy() (OnSelect) existe SOLO acá (D8).
                                If(IsBlank(varActualTrx), "",
                                    "Backoffice" in gblRol,
                                    Coalesce(
                                        IfError(
                                            LookUp('CM | TBL | PAN de cuentas',
                                                Cuenta.'CM | TBL | Cuenta' = varActualTrx.cuentaIdTrx).PAN,
                                            Blank()),
                                        CuentaMasc(varActualTrx.ult4Trx)),
                                    CuentaMasc(varActualTrx.ult4Trx))
