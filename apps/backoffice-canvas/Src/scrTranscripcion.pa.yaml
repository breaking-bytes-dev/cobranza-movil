                              - galCambiosTrx:
                                  Control: Gallery@2.15.0
                                  Variant: Vertical
                                  Properties:
                                    AccessibleLabel: ="Cambios de datos propuestos"
                                    FocusedBorderColor: =gblC.teal
                                    FocusedBorderThickness: =2
                                    Height: =Parent.Height - 10
                                    Items: =colCambiosTrx
                                    ShowScrollbar: =false
                                    TemplatePadding: =0
                                    TemplateSize: =52
                                    Width: =Parent.Width - 8
                                    X: =4
                                    Y: =5
                                  Children:
                                    - lblCamKTrx:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =gblC.espInk
                                          FocusedBorderColor: =gblC.teal
                                          FocusedBorderThickness: =2
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Bold
                                          Height: =14
                                          PaddingLeft: =0
                                          Size: =8
                                          Text: =ThisItem.campoTrx
                                          Width: =Parent.TemplateWidth - 2*gblE.PadSm
                                          Wrap: =false
                                          X: =gblE.PadSm
                                          Y: =4
                                    - lblCamAntesTrx:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =gblC.muted
                                          FocusedBorderColor: =gblC.teal
                                          FocusedBorderThickness: =2
                                          Font: =Font.'Segoe UI'
                                          Height: =28
                                          PaddingLeft: =0
                                          Size: =9
                                          Strikethrough: =true
                                          Text: =ThisItem.antesTrx
                                          Visible: =!IsBlank(ThisItem.antesTrx)
                                          Width: =Parent.TemplateWidth * 0.38
                                          X: =gblE.PadSm
                                          Y: =20
                                    - lblCamFlechaTrx:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =gblC.espInk
                                          FocusedBorderColor: =gblC.teal
                                          FocusedBorderThickness: =2
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Bold
                                          Height: =28
                                          PaddingLeft: =0
                                          Size: =10
                                          Text: ="→"
                                          Visible: =!IsBlank(ThisItem.antesTrx)
                                          Width: =20
                                          Wrap: =false
                                          X: =gblE.PadSm + Parent.TemplateWidth * 0.38
                                          Y: =20
                                    - chpCamNuevoTrx:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderThickness: =0
                                          Color: =Color.White
                                          DisplayMode: =DisplayMode.View
                                          Fill: =gblC.espInk
                                          FocusedBorderColor: =gblC.teal
                                          FocusedBorderThickness: =2
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Bold
                                          Height: =22
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Size: =8
                                          Text: ="NUEVO"
                                          Visible: =IsBlank(ThisItem.antesTrx)
                                          Width: =14 + 7*Len(Self.Text)
                                          X: =gblE.PadSm
                                          Y: =22
                                    - lblCamNuevoTrx:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =gblC.ink
                                          FocusedBorderColor: =gblC.teal
                                          FocusedBorderThickness: =2
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Bold
                                          Height: =28
                                          PaddingLeft: =0
                                          Size: =10
                                          Text: =ThisItem.nuevoTrx
                                          Width: =Parent.TemplateWidth * 0.5
                                          X: |-
                                            =If(IsBlank(ThisItem.antesTrx), gblE.PadSm + 64,
                                                gblE.PadSm + Parent.TemplateWidth * 0.38 + 24)
                                          Y: =20
                  - cmpVacioDetTrx:
                      Control: CanvasComponent
                      ComponentName: cmpVacio
                      Properties:
                        Height: =160
                        Icono: ="✨"
                        Mensaje: ="Elegí un localizador con pendientes."
                        Titulo: ="Nada seleccionado"
                        Visible: =IsBlank(varActualTrx) && CountRows(colPendTrx) > 0
                        Width: =Parent.Width - 2*gblE.Pad
                        X: =gblE.Pad
                        Y: =Parent.Height/2 - 80
                  - conCodigoTrx:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =gblC.card
                        Height: =64
                        Width: =Parent.Width
                        Y: =Parent.Height - 64
                      Children:
                        - recHairTrx:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderThickness: =0
                              DropShadow: =DropShadow.None
                              Fill: =gblC.hairline
                              Height: =1
                              Width: =Parent.Width
                        - lblCodigoTrx:
                            Control: Label@2.5.1
                            Properties:
                              Color: =gblC.muted
                              FocusedBorderColor: =gblC.teal
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              PaddingLeft: =0
                              Size: =9
                              Text: ="Código del core"
                              Width: =104
                              Wrap: =false
                              X: =gblE.Pad
                              Y: =20
                        - txtCodigoTrx:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              AccessibleLabel: ="Código del core"
                              BorderColor: =gblC.borde
                              Default: =""
                              Fill: =gblC.card
                              FocusedBorderColor: =gblC.teal
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =gblE.AltoInput
                              HintText: ="PAG01"
                              MaxLength: =10
                              OnChange: |-
                                =// Power Apps no distingue Enter de Tab ni de un clic afuera: los tres confirman el valor y disparan OnChange.
                                // Por eso NO se graba acá (antes un Tab o un clic grababan sin querer): el foco pasa a "Grabar" y se graba
                                // con Enter (o clic) sobre el botón.
                                If(!IsBlank(Trim(Self.Text)) && !IsBlank(varActualTrx), SetFocus(btnGrabarTrx))
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              Size: =10
                              Width: =Max(110, Parent.Width * 0.15)
                              X: =gblE.Pad + 110
                              Y: =12
                        - btnGrabarTrx:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Color: =Color.White
                              DisabledColor: =Color.White
                              DisabledFill: =ColorFade(gblC.teal, 60%)
                              DisplayMode: |-
                                =If(!IsBlank(Trim(txtCodigoTrx.Text)) && !IsBlank(varActualTrx),
                                    DisplayMode.Edit, DisplayMode.Disabled)
                              Fill: =gblC.teal
                              FocusedBorderColor: =gblC.ink
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              HoverFill: =ColorFade(gblC.teal, 10%)
                              OnSelect: |-
                                =// 1) foto de la cola filtrada y posición del actual (colVistaTrx materializada)
                                ClearCollect(colVistaTrx,
                                    Sort(
                                        Filter(colPendTrx, varLocSelTrx = "Todos" || '[IN] NombreAgente' = varLocSelTrx),
                                        'Fecha de captura', SortOrder.Ascending));
                                Set(varPosTrx,
                                    CountRows(Filter(colVistaTrx, 'Fecha de captura' < varActualTrx.'Fecha de captura')) + 1);
                                Set(varNumTrx, varActualTrx.'[IN] Numero de Interaccion');
                                // 2) patch (receta 7.8) — LA única llamada de escritura
                                // IfError (B-03): si el Patch falla se muestra el detalle y NO se saca de la cola,
                                // no se avanza ni se limpia el input. Si sale bien, el flujo 3..8 de siempre.
                                IfError(
                                    // DAT-11: la fecha y el usuario de grabación los pone el servidor (plugin GrabacionInteraccion),
                                    // que además rechaza grabar una interacción que otra persona ya grabó.
                                    // DAT-31: se busca por el id, no por el número autonumérico.
                                    Patch('CM | TBL | Interaccions',
                                        LookUp('CM | TBL | Interaccions',
                                            'CM | TBL | Interaccion' = varActualTrx.'CM | TBL | Interaccion'),
                                        {
                                            '[IN] Estado grabacion': 'Choice | CM | Estado grabacion Interaccio'.Grabado,
                                            '[IN] Codigo Grabacion': Upper(Trim(txtCodigoTrx.Text))
                                        }),
                                    Notify("No se pudo grabar " & varNumTrx & ": " & FirstError.Message, NotificationType.Error),
                                    // 3) sacar de la cola local (00 §5: cero re-consulta)
                                    Remove(colPendTrx, LookUp(colPendTrx,
                                        '[IN] Numero de Interaccion' = varNumTrx));
                                    // 4) refrescar la columna de localizadores
                                    // "Todos" = conteo EXACTO al datasource (CountIf delega); por localizador: de la cola cargada, o CountIf al servidor si la cola vino cortada
                                    ClearCollect(colLocsTrx, Table({locTrx: "Todos", nTrx: CountIf('CM | TBL | Interaccions', '[IN] Estado grabacion' = 'Choice | CM | Estado grabacion Interaccio'.Pendiente)}));
                                    Set(varPendCortadaTrx, CountRows(colPendTrx) < LookUp(colLocsTrx, locTrx = "Todos").nTrx);
                                    Collect(colLocsTrx,
                                        RenameColumns(
                                            ShowColumns(
                                                Sort(
                                                    AddColumns(
                                                        GroupBy(AddColumns(colPendTrx, agenteTrx, '[IN] NombreAgente'),
                                                            agenteTrx, grpTrx),
                                                        nTrx, If(varPendCortadaTrx, CountIf('CM | TBL | Interaccions', '[IN] Estado grabacion' = 'Choice | CM | Estado grabacion Interaccio'.Pendiente && '[IN] NombreAgente' = agenteTrx), CountRows(grpTrx))
                                                    ),
                                                    nTrx, SortOrder.Descending
                                                ),
                                                agenteTrx, nTrx
                                            ),
                                            agenteTrx, locTrx
                                        )
                                    );
                                    // 5) reselección: siguiente de la MISMA cola filtrada en la MISMA posición
                                    //    (la anterior si era la última; Blank si quedó vacía)
                                    ClearCollect(colVistaTrx,
                                        Sort(
                                            Filter(colPendTrx, varLocSelTrx = "Todos" || '[IN] NombreAgente' = varLocSelTrx),
                                            'Fecha de captura', SortOrder.Ascending));
                                    Set(varActualTrx,
                                        If(CountRows(colVistaTrx) = 0, Blank(),
                                            Index(colVistaTrx, Min(varPosTrx, CountRows(colVistaTrx)))));
                                    If(!IsBlank(varActualTrx) && varActualTrx.'[IN] Actualiza info',
                                        Set(varADTrx, LookUp('CM | TBL | Actualizacion de datos',
                                            '[AD] Interaccion'.'CM | TBL | Interaccion' = varActualTrx.'CM | TBL | Interaccion'));
                                        // F10: sin la vinculada, la que entró SIN VINCULAR (F8) de la misma cuenta; si tampoco, no llegó nada
                                        Set(varADSinVincTrx, IsBlank(varADTrx));
                                        If(varADSinVincTrx, Set(varADTrx, LookUp('CM | TBL | Actualizacion de datos',
                                            '[AD] Sin vincular' = true && '[AD] Cuenta'.'CM | TBL | Cuenta' = varActualTrx.'[IN] Cuenta'.'CM | TBL | Cuenta')));
                                        ClearCollect(colTelAntesTrx, Filter('CM | TBL | Telefonos', '[TL] CIF' = varActualTrx.cifTrx));
                                        ClearCollect(colDirAntesTrx, Filter('CM | TBL | Direccions', '[DR] CIF' = varActualTrx.cifTrx));
                                        ClearCollect(colCambiosTrx, Filter(Table(
                                            {campoTrx: "TELÉFONO CASA",     antesTrx: LookUp(colTelAntesTrx, '[TL] Tipo' = "Casa").'[TL] Numero',    nuevoTrx: varADTrx.'[AD] Telefono Casa'},
                                            {campoTrx: "TELÉFONO CELULAR",  antesTrx: LookUp(colTelAntesTrx, '[TL] Tipo' = "Celular").'[TL] Numero', nuevoTrx: varADTrx.'[AD] Telefono Celular'},
                                            {campoTrx: "TELÉFONO TRABAJO",  antesTrx: LookUp(colTelAntesTrx, '[TL] Tipo' = "Trabajo").'[TL] Numero', nuevoTrx: varADTrx.'[AD] Telefono trabajo'},
                                            {campoTrx: "DIRECCIÓN CASA",    antesTrx: LookUp(colDirAntesTrx, '[DR] Tipo' = "Casa").'[DR] Direccion', nuevoTrx: varADTrx.'[AD] Direccion casa'},
                                            {campoTrx: "DIRECCIÓN EC",      antesTrx: LookUp(colDirAntesTrx, '[DR] Tipo' = "EC").'[DR] Direccion',   nuevoTrx: varADTrx.'[AD] Direccion EC'},
                                            {campoTrx: "DIRECCIÓN TRABAJO", antesTrx: LookUp(colDirAntesTrx, '[DR] Tipo' = "Trabajo").'[DR] Direccion', nuevoTrx: varADTrx.'[AD] Direccion trabajo'},
                                            {campoTrx: "CORREO ELECTRÓNICO", antesTrx: Blank(), nuevoTrx: varADTrx.'[AD] Correo electronico'}
                                        ), !IsBlank(nuevoTrx))),
                                        Set(varADTrx, Blank()); Clear(colCambiosTrx)
                                    );
                                    // 6) limpiar el input
                                    Reset(txtCodigoTrx);
                                    // 7) confirmar ANUNCIANDO el siguiente (la reselección del paso 5 ya corrió — R1-06)
                                    Notify("✓ " & varNumTrx & " grabada" &
                                            If(IsBlank(varActualTrx), " — ¡cola vacía!",
                                                " — siguiente: " & varActualTrx.clienteTrx),
                                        NotificationType.Success, 2500);
                                    // 8) devolver el foco al input — la fluidez de la estación (solo desktop; R1-04)
                                    If(!nfMovil, SetFocus(txtCodigoTrx))
                                )
                              Size: =9
                              Text: ="✓ y siguiente"
                              Width: =120
                              X: =txtCodigoTrx.X + txtCodigoTrx.Width + 8
                              Y: =12
                        - btnSaltarTrx:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =gblC.borde
                              BorderThickness: =1
                              Color: =gblC.ink2
                              Fill: =gblC.card
                              FocusedBorderColor: =gblC.teal
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              OnSelect: |-
                                =ClearCollect(colVistaTrx,
                                    Sort(
                                        Filter(colPendTrx, varLocSelTrx = "Todos" || '[IN] NombreAgente' = varLocSelTrx),
                                        'Fecha de captura', SortOrder.Ascending));
                                If(CountRows(colVistaTrx) >= 2,
                                    Set(varPosTrx,
                                        CountRows(Filter(colVistaTrx, 'Fecha de captura' < varActualTrx.'Fecha de captura')) + 1);
                                    Set(varActualTrx,
                                        Index(colVistaTrx, Mod(varPosTrx, CountRows(colVistaTrx)) + 1));
                                    If(!IsBlank(varActualTrx) && varActualTrx.'[IN] Actualiza info',
                                        Set(varADTrx, LookUp('CM | TBL | Actualizacion de datos',
                                            '[AD] Interaccion'.'CM | TBL | Interaccion' = varActualTrx.'CM | TBL | Interaccion'));
                                        // F10: sin la vinculada, la que entró SIN VINCULAR (F8) de la misma cuenta; si tampoco, no llegó nada
                                        Set(varADSinVincTrx, IsBlank(varADTrx));
                                        If(varADSinVincTrx, Set(varADTrx, LookUp('CM | TBL | Actualizacion de datos',
                                            '[AD] Sin vincular' = true && '[AD] Cuenta'.'CM | TBL | Cuenta' = varActualTrx.'[IN] Cuenta'.'CM | TBL | Cuenta')));
                                        ClearCollect(colTelAntesTrx, Filter('CM | TBL | Telefonos', '[TL] CIF' = varActualTrx.cifTrx));
                                        ClearCollect(colDirAntesTrx, Filter('CM | TBL | Direccions', '[DR] CIF' = varActualTrx.cifTrx));
                                        ClearCollect(colCambiosTrx, Filter(Table(
                                            {campoTrx: "TELÉFONO CASA",     antesTrx: LookUp(colTelAntesTrx, '[TL] Tipo' = "Casa").'[TL] Numero',    nuevoTrx: varADTrx.'[AD] Telefono Casa'},
                                            {campoTrx: "TELÉFONO CELULAR",  antesTrx: LookUp(colTelAntesTrx, '[TL] Tipo' = "Celular").'[TL] Numero', nuevoTrx: varADTrx.'[AD] Telefono Celular'},
                                            {campoTrx: "TELÉFONO TRABAJO",  antesTrx: LookUp(colTelAntesTrx, '[TL] Tipo' = "Trabajo").'[TL] Numero', nuevoTrx: varADTrx.'[AD] Telefono trabajo'},
                                            {campoTrx: "DIRECCIÓN CASA",    antesTrx: LookUp(colDirAntesTrx, '[DR] Tipo' = "Casa").'[DR] Direccion', nuevoTrx: varADTrx.'[AD] Direccion casa'},
                                            {campoTrx: "DIRECCIÓN EC",      antesTrx: LookUp(colDirAntesTrx, '[DR] Tipo' = "EC").'[DR] Direccion',   nuevoTrx: varADTrx.'[AD] Direccion EC'},
                                            {campoTrx: "DIRECCIÓN TRABAJO", antesTrx: LookUp(colDirAntesTrx, '[DR] Tipo' = "Trabajo").'[DR] Direccion', nuevoTrx: varADTrx.'[AD] Direccion trabajo'},
                                            {campoTrx: "CORREO ELECTRÓNICO", antesTrx: Blank(), nuevoTrx: varADTrx.'[AD] Correo electronico'}
                                        ), !IsBlank(nuevoTrx))),
                                        Set(varADTrx, Blank()); Clear(colCambiosTrx)
                                    )
                                );
                                // devolver el foco al input — la fluidez de la estación (solo desktop; R1-04)
                                If(!nfMovil, SetFocus(txtCodigoTrx))
                              Size: =9
                              Text: ="Saltar →"
                              Width: =96
                              X: =btnGrabarTrx.X + btnGrabarTrx.Width + 8
                              Y: =12
                        - lblHintTrx:
                            Control: Label@2.5.1
                            Properties:
                              Color: =gblC.muted2
                              FocusedBorderColor: =gblC.teal
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              Height: =28
                              PaddingLeft: =0
                              Size: =8
                              Text: ="Enter lleva a Grabar · Enter otra vez graba y avanza · la cola se navega con clic"
                              Width: =Parent.Width - Self.X - gblE.Pad
                              X: =btnSaltarTrx.X + btnSaltarTrx.Width + 8
                              Y: =20
      - cmpNavTrx:
          Control: CanvasComponent
          ComponentName: cmpNavLateral
          Properties:
            Height: =Parent.Height
            RutaActiva: ="trx"
            Visible: =!nfMovil || gblNavMovilAbierta
            Width: =gblE.AnchoNav
