Screens:
  scrCarga:
    Properties:
      Fill: =ColorValue("#F2F4F7")
      OnVisible: |-
        =Set(varVueltasCga, 0);
        // Perfiles de CM efectivos del usuario (roles directos y de cualquier equipo, también de grupo de Entra ID), que
        // resuelve el servidor: "BackOffice|Admin"; vacío = sin acceso. Una sola vez por sesión. Va aquí y no en OnStart:
        // si la foto de "Environment" no conoce la API, solo esta fórmula queda inerte (los tokens de OnStart no).
        // El error se lee aparte (ver scrCargaArchivo): dentro de una cadena IfError no se ve.
        If(!gblRolListo,
            Set(varRespRolCga, Blank());
            Set(varRespRolCga, Environment.sanic_cm_MisRoles());
            Set(gblRolError, IfError(Left(Text(varRespRolCga.Roles), 0), TextoError(Coalesce(FirstError.Message, "sin detalle"))));
            Set(gblRol, If(IsBlank(gblRolError), Coalesce(Text(varRespRolCga.Roles), ""), ""));
            // Versión de la solución cm_core_cobranzamovil (la misma API la devuelve); "—" si no llegó.
            Set(gblVersion, IfError(Coalesce(Text(varRespRolCga.Version), "—"), "—"));
            Set(gblRolListo, true)
        )
    Children:
      # Pantalla de carga (StartScreen). Su OnVisible pide los perfiles del usuario a la Custom API sanic_cm_MisRoles
      # (gblRol) y marca gblRolListo al terminar. Se entra a Inicio recién entonces, así su OnVisible calcula los KPIs
      # con el rol ya resuelto.
      # Colores literales: gblC se arma en OnStart, que puede no haber terminado todavía.
      - conCentroCga:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =140
            Width: =Min(Parent.Width - 32, 320)
            X: =(Parent.Width - Self.Width) / 2
            Y: =(Parent.Height - Self.Height) / 2
          Children:
            - conLogoCga:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =ColorValue("#0F6B6B")
                  Height: =56
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  Width: =56
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =0
                Children:
                  - lblLogoCga:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =Color.White
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =Parent.Height
                        PaddingLeft: =0
                        PaddingRight: =0
                        Size: =20
                        Text: ="₡"
                        Width: =Parent.Width
            - lblMarcaCga:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =ColorValue("#101828")
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =28
                  Size: =14
                  Text: ="Cobranza Móvil"
                  Width: =Parent.Width
                  Y: =68
            - lblCargandoCga:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =ColorValue("#667085")
                  Font: =Font.'Segoe UI'
                  Height: =24
                  Live: =Live.Polite
                  Size: =10
                  Text: ="Cargando tus permisos" & Left("...", Mod(varVueltasCga, 4))
                  Width: =Parent.Width
                  Y: =100
      - tmrCarga:
          Control: Timer@2.1.0
          Properties:
            AutoStart: =true
            Duration: =500
            OnTimerEnd: |-
              =Set(varVueltasCga, varVueltasCga + 1);
              // Entra cuando terminó de leer los perfiles (con rol, sin rol o con error: Inicio muestra cada caso). Tope de
              // 30 s para no quedar nunca trabado aquí: entra con el aviso de que no se pudo verificar el acceso.
              If(!gblRolListo && varVueltasCga >= 60,
                  Set(gblRolError, "el servidor no respondió a tiempo");
                  Set(gblRol, "");
                  Set(gblRolListo, true)
              );
              If(gblRolListo, Navigate(scrInicio, ScreenTransition.None))
            Repeat: =true
            Visible: =false
