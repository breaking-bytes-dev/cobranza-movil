                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =Parent.Height - 2*gblE.PadSm
                        PaddingLeft: =0
                        Size: =9
                        Text: |-
                          ="Motivo de rechazo: " & Coalesce(galHes.Selected.'Motivo de rechazo', "—")
