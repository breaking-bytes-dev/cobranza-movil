                  RadiusTopRight: =gblE.RadioSm
                  Visible: =galHes.Selected.'[AS] Estado de aprobacion' = 'Choice | CM | Estado aprobacion especial'.Rechazada
                  Width: =Parent.Width - 2*gblE.Pad
