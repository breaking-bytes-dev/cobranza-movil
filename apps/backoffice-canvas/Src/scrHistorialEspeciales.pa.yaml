      - btnBuscarHes:
          Control: Classic/Button@2.2.0
          Properties:
            OnSelect: |-
              =// Búsqueda por CIF (empieza con), nombre del cliente (contiene) o últimos 4: primero las cuentas (una consulta a
              // Cuentas, hasta 50) y después sus Especiales resueltas, una consulta por cuenta (delegables). El resto de los filtros
              // (estado, vigencia, días, localizador, solicitante) los aplica la galería en memoria sobre colBuscaHes.
              Set(varPanelHes, false);
              Clear(colBuscaHes);
              If(!IsBlank(varBuscaHes),
                  Set(varCargandoHes, true);
                  ClearCollect(colCtaHes,
                      FirstN(Filter('CM | TBL | Cuentas',
                          StartsWith('CIF Cliente', varBuscaHes) || varBuscaHes in 'Nombre Cliente' || 'Últimos 4' = varBuscaHes), 51));
                  ForAll(FirstN(colCtaHes, 50) As C,
                      Collect(colBuscaHes,
                          Filter('CM | TBL | Asignacions',
                              '[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Especial
                              && ('[AS] Estado de aprobacion' = 'Choice | CM | Estado aprobacion especial'.Aprobado
                                  || '[AS] Estado de aprobacion' = 'Choice | CM | Estado aprobacion especial'.Rechazada)
                              && '[AS] Cuenta'.'CM | TBL | Cuenta' = C.'CM | TBL | Cuenta')));
                  If(CountRows(colCtaHes) > 50,
                      Notify("Más de 50 cuentas coinciden con la búsqueda: se buscó en las primeras 50. Escribí más del CIF o del nombre.", NotificationType.Warning));
                  Set(varCargandoHes, false)
              )
            Height: =1
            Visible: =false
            Width: =1
