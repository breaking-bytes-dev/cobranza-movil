Screens:
  scrHistorialEspeciales:
    Properties:
      Fill: =gblC.pantalla
      OnVisible: |-
        =// Historial de Especiales RESUELTAS (Aprobadas o Rechazadas). Supervisor, SOLO LECTURA.
        // Cada filtro es un PAR de valores que entra al Filter como constante: "Todas" = los dos
        // valores; "Aprobadas"/"Rechazadas" (o "Activas"/"Cerradas") = el mismo valor dos veces.
        // Así la consulta queda siempre igual (dos igualdades con ||) y delega entera en Dataverse.
        Set(varEstHes, "todas");
        Set(varAprAHes, 'Choice | CM | Estado aprobacion especial'.Aprobado);
        Set(varAprBHes, 'Choice | CM | Estado aprobacion especial'.Rechazada);
        Set(varDiasHes, 30);
        Set(varDesdeHes, DateAdd(Today(), -30, TimeUnit.Days));
        Set(varVigHes, "todas");
        Set(varVigAHes, true);
        Set(varVigBHes, false);
        // APP-42: localizador, solicitante y buscador (CIF, cliente o últimos 4). Localizador y solicitante entran al Filter
        // DIRECTO de la galería (delegable, sin tope de 2000); la búsqueda trae las Especiales resueltas de las cuentas que
        // coinciden (btnBuscarHes) y sobre ellas aplica el resto de los filtros en memoria.
        Set(varAgHes, "Todos los localizadores"); Set(varAgRecHes, Blank());
        Set(varPideHes, "Todos los solicitantes"); Set(varPideRecHes, Blank());
        Set(varBuscaHes, ""); Clear(colBuscaHes);
        ClearCollect(colAgHes, {nom: "Todos los localizadores"});
        Collect(colAgHes, ForAll(Sort('CM | TBL | Agentes', '[AG] Nombre'), {nom: ThisRecord.'[AG] Nombre'}));
        // Solicitantes: el Filter delega; el Distinct sobre el lookup corre en memoria (hasta 2000 resueltas).
        ClearCollect(colPideHes, {nom: "Todos los solicitantes"});
        Collect(colPideHes, ForAll(Sort(Filter(Distinct(
            Filter('CM | TBL | Asignacions',
                '[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Especial
                && ('[AS] Estado de aprobacion' = 'Choice | CM | Estado aprobacion especial'.Aprobado
                    || '[AS] Estado de aprobacion' = 'Choice | CM | Estado aprobacion especial'.Rechazada)),
            '[AS] Solicitado por'.'Full Name') As D, !IsBlank(D.Value)), Value), {nom: Value}));
        Reset(drpAgHes); Reset(drpPideHes); Reset(txtBuscaHes);
        Set(varPanelHes, false)
    Children:
      - cmpEncHes:
          Control: CanvasComponent
          ComponentName: cmpEncabezado
          Properties:
            Height: =If(nfMovil, gblE.AltoBarra + 84, 84)
            Subtitulo: |-
              ="Especiales ya resueltas: quién la pidió, quién la resolvió y a qué localizador fue."
            Titulo: ="Historial de Especiales"
            Width: =Parent.Width - Self.X
            X: =If(nfMovil, 0, gblE.AnchoNav)
      - conContenidoHes:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height - Self.Y - gblE.Pad
            Width: =Min(gblE.AnchoMax, Parent.Width - If(nfMovil, 0, gblE.AnchoNav) - 2*gblE.Pad)
            X: |-
              =If(nfMovil, 0, gblE.AnchoNav)
                  + Max(gblE.Pad, (Parent.Width - If(nfMovil, 0, gblE.AnchoNav) - gblE.AnchoMax) / 2)
            Y: =cmpEncHes.Y + cmpEncHes.Height
          Children:
            - chpTodasHes:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =gblC.borde
                  BorderThickness: =If(varEstHes = "todas", 0, 1)
                  Color: =If(varEstHes = "todas", Color.White, gblC.ink2)
                  Fill: =If(varEstHes = "todas", gblC.teal, gblC.card)
                  FocusedBorderColor: =gblC.ink
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =32
                  HoverFill: =ColorFade(Self.Fill, 10%)
                  OnSelect: |-
                    =Set(varEstHes, "todas");
                    Set(varAprAHes, 'Choice | CM | Estado aprobacion especial'.Aprobado);
                    Set(varAprBHes, 'Choice | CM | Estado aprobacion especial'.Rechazada);
                    Set(varPanelHes, false)
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
                  RadiusTopLeft: =16
                  RadiusTopRight: =16
                  Size: =9
                  Text: ="Todas"
                  Width: =84
                  X: =0
                  Y: =0
            - chpAprobHes:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =gblC.borde
                  BorderThickness: =If(varEstHes = "apr", 0, 1)
                  Color: =If(varEstHes = "apr", Color.White, gblC.ink2)
                  Fill: =If(varEstHes = "apr", gblC.teal, gblC.card)
                  FocusedBorderColor: =gblC.ink
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =32
                  HoverFill: =ColorFade(Self.Fill, 10%)
                  OnSelect: |-
                    =Set(varEstHes, "apr");
                    Set(varAprAHes, 'Choice | CM | Estado aprobacion especial'.Aprobado);
                    Set(varAprBHes, 'Choice | CM | Estado aprobacion especial'.Aprobado);
                    Set(varPanelHes, false)
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
                  RadiusTopLeft: =16
                  RadiusTopRight: =16
                  Size: =9
                  Text: ="Aprobadas"
                  Width: =110
                  X: =chpTodasHes.X + chpTodasHes.Width + 6
                  Y: =chpTodasHes.Y
            - chpRechHes:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =gblC.borde
                  BorderThickness: =If(varEstHes = "rech", 0, 1)
                  Color: =If(varEstHes = "rech", Color.White, gblC.ink2)
                  Fill: =If(varEstHes = "rech", gblC.teal, gblC.card)
                  FocusedBorderColor: =gblC.ink
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =32
                  HoverFill: =ColorFade(Self.Fill, 10%)
                  OnSelect: |-
                    =Set(varEstHes, "rech");
                    Set(varAprAHes, 'Choice | CM | Estado aprobacion especial'.Rechazada);
                    Set(varAprBHes, 'Choice | CM | Estado aprobacion especial'.Rechazada);
                    Set(varPanelHes, false)
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
                  RadiusTopLeft: =16
                  RadiusTopRight: =16
                  Size: =9
                  Text: ="Rechazadas"
                  Width: =116
                  X: =chpAprobHes.X + chpAprobHes.Width + 6
                  Y: =chpTodasHes.Y
            - chp7Hes:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =gblC.borde
                  BorderThickness: =If(varDiasHes = 7, 0, 1)
                  Color: =If(varDiasHes = 7, Color.White, gblC.ink2)
                  Fill: =If(varDiasHes = 7, gblC.teal, gblC.card)
                  FocusedBorderColor: =gblC.ink
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =32
                  HoverFill: =ColorFade(Self.Fill, 10%)
                  OnSelect: |-
                    =Set(varDiasHes, 7);
                    Set(varDesdeHes, DateAdd(Today(), -7, TimeUnit.Days));
                    Set(varPanelHes, false)
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
                  RadiusTopLeft: =16
                  RadiusTopRight: =16
                  Size: =9
                  Text: ="7 días"
                  Width: =76
                  X: =If(nfMovil, 0, chpRechHes.X + chpRechHes.Width + 2*gblE.Pad)
                  Y: =If(nfMovil, chpTodasHes.Y + chpTodasHes.Height + 8, chpTodasHes.Y)
            - chp30Hes:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =gblC.borde
                  BorderThickness: =If(varDiasHes = 30, 0, 1)
                  Color: =If(varDiasHes = 30, Color.White, gblC.ink2)
                  Fill: =If(varDiasHes = 30, gblC.teal, gblC.card)
                  FocusedBorderColor: =gblC.ink
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =32
                  HoverFill: =ColorFade(Self.Fill, 10%)
                  OnSelect: |-
                    =Set(varDiasHes, 30);
                    Set(varDesdeHes, DateAdd(Today(), -30, TimeUnit.Days));
                    Set(varPanelHes, false)
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
                  RadiusTopLeft: =16
                  RadiusTopRight: =16
                  Size: =9
                  Text: ="30 días"
                  Width: =82
                  X: =chp7Hes.X + chp7Hes.Width + 6
                  Y: =chp7Hes.Y
            - chp90Hes:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =gblC.borde
                  BorderThickness: =If(varDiasHes = 90, 0, 1)
                  Color: =If(varDiasHes = 90, Color.White, gblC.ink2)
                  Fill: =If(varDiasHes = 90, gblC.teal, gblC.card)
                  FocusedBorderColor: =gblC.ink
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =32
                  HoverFill: =ColorFade(Self.Fill, 10%)
                  OnSelect: |-
                    =Set(varDiasHes, 90);
                    Set(varDesdeHes, DateAdd(Today(), -90, TimeUnit.Days));
                    Set(varPanelHes, false)
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
                  RadiusTopLeft: =16
                  RadiusTopRight: =16
                  Size: =9
                  Text: ="90 días"
                  Width: =82
                  X: =chp30Hes.X + chp30Hes.Width + 6
                  Y: =chp7Hes.Y
            - chpVigTodasHes:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =gblC.borde
                  BorderThickness: =If(varVigHes = "todas", 0, 1)
                  Color: =If(varVigHes = "todas", Color.White, gblC.ink2)
                  Fill: =If(varVigHes = "todas", gblC.teal, gblC.card)
                  FocusedBorderColor: =gblC.ink
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =32
                  HoverFill: =ColorFade(Self.Fill, 10%)
                  OnSelect: |-
                    =Set(varVigHes, "todas");
                    Set(varVigAHes, true);
                    Set(varVigBHes, false);
                    Set(varPanelHes, false)
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
                  RadiusTopLeft: =16
                  RadiusTopRight: =16
                  Size: =9
                  Text: ="Activas y cerradas"
                  Width: =150
                  X: =If(nfMovil, 0, chp90Hes.X + chp90Hes.Width + 2*gblE.Pad)
                  Y: =If(nfMovil, chp7Hes.Y + chp7Hes.Height + 8, chpTodasHes.Y)
            - chpVigActHes:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =gblC.borde
                  BorderThickness: =If(varVigHes = "act", 0, 1)
                  Color: =If(varVigHes = "act", Color.White, gblC.ink2)
                  Fill: =If(varVigHes = "act", gblC.teal, gblC.card)
                  FocusedBorderColor: =gblC.ink
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =32
                  HoverFill: =ColorFade(Self.Fill, 10%)
                  OnSelect: |-
                    =Set(varVigHes, "act");
                    Set(varVigAHes, true);
                    Set(varVigBHes, true);
                    Set(varPanelHes, false)
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
                  RadiusTopLeft: =16
                  RadiusTopRight: =16
                  Size: =9
                  Text: ="Activas"
                  Width: =84
                  X: =chpVigTodasHes.X + chpVigTodasHes.Width + 6
                  Y: =chpVigTodasHes.Y
            - chpVigCerHes:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =gblC.borde
                  BorderThickness: =If(varVigHes = "cer", 0, 1)
                  Color: =If(varVigHes = "cer", Color.White, gblC.ink2)
                  Fill: =If(varVigHes = "cer", gblC.teal, gblC.card)
                  FocusedBorderColor: =gblC.ink
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =32
                  HoverFill: =ColorFade(Self.Fill, 10%)
                  OnSelect: |-
                    =Set(varVigHes, "cer");
                    Set(varVigAHes, false);
                    Set(varVigBHes, false);
                    Set(varPanelHes, false)
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
                  RadiusTopLeft: =16
                  RadiusTopRight: =16
                  Size: =9
                  Text: ="Cerradas"
                  Width: =92
                  X: =chpVigActHes.X + chpVigActHes.Width + 6
                  Y: =chpVigTodasHes.Y
            - conFiltrosHes:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  Height: =If(nfMovil, 4 * gblE.AltoInput + 3 * gblE.PadSm, gblE.AltoInput)
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =gblE.PadSm
                  LayoutWrap: =nfMovil
                  Width: =Parent.Width
                  Y: =chpVigTodasHes.Y + chpVigTodasHes.Height + gblE.PadSm
                Children:
                  - drpAgHes:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        AccessibleLabel: ="Localizador"
                        BorderColor: =gblC.borde
                        BorderThickness: =1
                        ChevronBackground: =gblC.card
                        ChevronFill: =gblC.ink2
                        ChevronHoverBackground: =gblC.pantalla
                        ChevronHoverFill: =gblC.teal
                        Color: =gblC.ink
                        Default: =Coalesce(varAgHes, "Todos los localizadores")
                        DisplayMode: =If(varCargandoHes, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =gblC.card
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoInput
                        HoverColor: =gblC.ink
                        HoverFill: =gblC.pantalla
                        Items: =colAgHes
                        Items.Value: =nom
                        OnChange: |-
                          =Set(varAgHes, Coalesce(Self.Selected.nom, "Todos los localizadores"));
                          Set(varAgRecHes, If(varAgHes = "Todos los localizadores", Blank(), LookUp('CM | TBL | Agentes', '[AG] Nombre' = varAgHes)));
                          Set(varPanelHes, false)
                        PressedColor: =gblC.card
                        PressedFill: =gblC.teal
                        SelectionColor: =gblC.card
                        SelectionFill: =gblC.teal
                        Size: =10
                        Width: =If(nfMovil, Parent.Width, 250)
                  - drpPideHes:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        AccessibleLabel: ="Solicitante"
                        BorderColor: =gblC.borde
                        BorderThickness: =1
                        ChevronBackground: =gblC.card
                        ChevronFill: =gblC.ink2
                        ChevronHoverBackground: =gblC.pantalla
                        ChevronHoverFill: =gblC.teal
                        Color: =gblC.ink
                        Default: =Coalesce(varPideHes, "Todos los solicitantes")
                        DisplayMode: =If(varCargandoHes, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =gblC.card
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoInput
                        HoverColor: =gblC.ink
                        HoverFill: =gblC.pantalla
                        Items: =colPideHes
                        Items.Value: =nom
                        OnChange: |-
                          =Set(varPideHes, Coalesce(Self.Selected.nom, "Todos los solicitantes"));
                          Set(varPideRecHes, If(varPideHes = "Todos los solicitantes", Blank(), LookUp(Users, 'Full Name' = varPideHes)));
                          Set(varPanelHes, false)
                        PressedColor: =gblC.card
                        PressedFill: =gblC.teal
                        SelectionColor: =gblC.card
                        SelectionFill: =gblC.teal
                        Size: =10
                        Width: =If(nfMovil, Parent.Width, 230)
                  - txtBuscaHes:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        AccessibleLabel: ="Buscar por CIF, nombre del cliente o últimos 4 de la cuenta"
                        BorderColor: =gblC.borde
                        Default: =""
                        DelayOutput: =true
                        DisplayMode: =If(varCargandoHes, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =gblC.card
                        FillPortions: =1
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoInput
                        HintText: ="🔍 CIF, nombre del cliente o últimos 4 de la cuenta"
                        LayoutMinWidth: =220
                        OnChange: =Set(varBuscaHes, Trim(Self.Text)); Select(btnBuscarHes)
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Size: =10
                        Width: =If(nfMovil, Parent.Width, 300)
                  - btnLimpiarHes:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =gblC.borde
                        BorderThickness: =1
                        Color: =gblC.teal
                        DisplayMode: =If(varCargandoHes, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =gblC.card
                        FillPortions: =0
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoInput
                        OnSelect: |-
                          =Set(varAgHes, "Todos los localizadores"); Set(varAgRecHes, Blank());
                          Set(varPideHes, "Todos los solicitantes"); Set(varPideRecHes, Blank());
                          Set(varBuscaHes, ""); Clear(colBuscaHes);
                          Reset(drpAgHes); Reset(drpPideHes); Reset(txtBuscaHes);
                          Set(varPanelHes, false)
                        Size: =10
                        Text: ="Limpiar"
                        Tooltip: ="Todos los localizadores y solicitantes, sin búsqueda"
                        Width: =If(nfMovil, Parent.Width, 90)
            - lblTotalHes:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.ink2
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =24
                  PaddingLeft: =0
                  Size: =10
                  Text: |-
                    =// Conteo EXACTO directo al datasource (CountIf delega): mismo predicado que la galería. Con búsqueda, lo que muestra.
                    If(IsBlank(varBuscaHes),
                        CountIf('CM | TBL | Asignacions',
                            '[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Especial
                            && ('[AS] Estado de aprobacion' = varAprAHes || '[AS] Estado de aprobacion' = varAprBHes)
                            && ('[AS] Estado' = varVigAHes || '[AS] Estado' = varVigBHes)
                            && 'Modified On' >= varDesdeHes
                            && (IsBlank(varAgRecHes) || '[AS] Agente'.'CM | TBL | Agente' = varAgRecHes.'CM | TBL | Agente')
                            && (IsBlank(varPideRecHes) || '[AS] Solicitado por'.User = varPideRecHes.User)),
                        galHes.AllItemsCount)
                    & " especiales resueltas · últimos " & varDiasHes & " días"
                  Width: =Parent.Width
                  Wrap: =false
                  Y: =conFiltrosHes.Y + conFiltrosHes.Height + gblE.PadSm
            - conListaHes:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =gblC.borde
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =gblC.card
                  Height: =Parent.Height - Self.Y
                  RadiusBottomLeft: =gblE.Radio
                  RadiusBottomRight: =gblE.Radio
                  RadiusTopLeft: =gblE.Radio
                  RadiusTopRight: =gblE.Radio
                  Width: =Parent.Width
                  Y: =lblTotalHes.Y + lblTotalHes.Height + gblE.PadSm
                Children:
                  - galHes:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        AccessibleLabel: ="Especiales resueltas"
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Height: =Parent.Height - 2*gblE.PadSm
                        Items: |-
                          =// Todo delegable: choice/booleano contra constantes (pares de variables), fecha >=
                          // constante y Sort por columna. El rango va sobre 'Modified On' (siempre presente: en una
                          // Especial resuelta el último cambio es la resolución o el cierre); '[AS] Fecha de
                          // Asignacion' puede venir vacía y la pisa la carga diaria (DAT-31).
                          // APP-42: sin búsqueda, consulta DIRECTA con localizador y solicitante (pagina sola, sin tope); con búsqueda,
                          // las Especiales de las cuentas que coinciden (colBuscaHes) con los mismos filtros en memoria.
                          If(IsBlank(varBuscaHes),
                              Sort(
                                  Filter('CM | TBL | Asignacions',
                                      '[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Especial
                                      && ('[AS] Estado de aprobacion' = varAprAHes || '[AS] Estado de aprobacion' = varAprBHes)
                                      && ('[AS] Estado' = varVigAHes || '[AS] Estado' = varVigBHes)
                                      && 'Modified On' >= varDesdeHes
                                      && (IsBlank(varAgRecHes) || '[AS] Agente'.'CM | TBL | Agente' = varAgRecHes.'CM | TBL | Agente')
                                      && (IsBlank(varPideRecHes) || '[AS] Solicitado por'.User = varPideRecHes.User)),
                                  'Modified On', SortOrder.Descending),
                              Sort(
                                  Filter(colBuscaHes,
                                      '[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Especial
                                      && ('[AS] Estado de aprobacion' = varAprAHes || '[AS] Estado de aprobacion' = varAprBHes)
                                      && ('[AS] Estado' = varVigAHes || '[AS] Estado' = varVigBHes)
                                      && 'Modified On' >= varDesdeHes
                                      && (IsBlank(varAgRecHes) || '[AS] Agente'.'CM | TBL | Agente' = varAgRecHes.'CM | TBL | Agente')
                                      && (IsBlank(varPideRecHes) || '[AS] Solicitado por'.User = varPideRecHes.User)),
                                  'Modified On', SortOrder.Descending))
                        OnSelect: =Set(varPanelHes, true)
                        ShowScrollbar: =false
                        TemplateFill: =If(ThisItem.IsSelected && varPanelHes, gblC.tealSuave, gblC.card)
                        TemplatePadding: =0
                        TemplateSize: =If(nfMovil, 176, 92)
                        Width: =Parent.Width - 2*gblE.PadSm
                        X: =gblE.PadSm
                        Y: =gblE.PadSm
                      Children:
                        - lblCliFilaHes:
                            Control: Label@2.5.1
                            Properties:
                              Color: =gblC.ink
                              FocusedBorderColor: =gblC.teal
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =18
                              PaddingLeft: =0
                              Size: =10
