App:
  Properties:
    Formulas: |-
      =// ===== App.Formulas (fórmulas con nombre) =====
      // Bimoneda: "C$ X · US$ Y", omite la moneda en cero. Igual que la app del localizador.
      Moneda(nio:Number, usd:Number): Text =
          Coalesce(
              // Filter saca las entradas en blanco: sin él, Concat(0,0) devuelve " · " (no vacío)
              // y el Coalesce nunca dispara.
              Concat(
                  Filter(
                      Table(
                          {t: If(Coalesce(nio,0) > 0, "C$ " & Text(nio, "#,##0.00"))},
                          {t: If(Coalesce(usd,0) > 0, "US$ " & Text(usd, "#,##0.00"))}
                      ),
                      !IsBlank(t)
                  ),
                  t, " · "
              ),
              "C$ 0.00"
          );

      // Cuenta enmascarada (PCI): ninguna pantalla muestra el número completo; se muestra
      // "•••• " + 'Últimos 4' (columna de la cuenta). Solo el rol BackOffice lee el PAN completo (bóveda, scrTranscripcion/Transcritas).
      CuentaMasc(ult4:Text): Text =
          If(IsBlank(ult4), "••••", "•••• " & ult4);

      // Texto legible de un error del servidor. FirstError.Message de una Custom API trae el JSON crudo:
      // 'Environment.sanic_cm_PartirCarga failed: {"error":{"code":"0x80040265","message":"PartirCarga: …"}}'.
      // Devuelve solo el "message" (sin el prefijo "<Plugin>: "); si no hay JSON, el texto tal cual.
      TextoError(e:Text): Text =
          With(
              {m: Match(e, """message""\s*:\s*""(?<t>[^""]*)""")},
              If(IsBlank(m), e, Trim(Substitute(m.t, "PartirCarga:", "")))
          );

      // Monto de retiro de una Especial: obligatorio, número, 0 o más (vacío, texto o negativo no).
      RetiroOk(t:Text): Boolean = IfError(With({v: Value(Trim(t))}, !IsBlank(Trim(t)) && !IsBlank(v) && v >= 0), false);

      // Alta de cuenta: dígitos de la tarjeta (sin espacios, guiones ni puntos) y dígito verificador (Luhn), en vivo.
      SoloDigitos(t:Text): Text = Substitute(Substitute(Substitute(t, " ", ""), "-", ""), ".", "");
      LuhnOk(d:Text): Boolean =
          IsMatch(d, "\d{13,19}") &&
          Mod(Sum(ForAll(Sequence(Len(d)) As i,
                  With({x: Value(Mid(d, Len(d) - i.Value + 1, 1))},
                      {v: If(Mod(i.Value, 2) = 0, If(x * 2 > 9, x * 2 - 9, x * 2), x)})), v), 10) = 0;

      // Alerta de carga: Cartera por localizador marca en rojo al localizador con más asignaciones activas que esto.
      // Es un criterio de operación (no un límite técnico: el teléfono trae la cartera por tramos). Cambiarlo aquí.
      nfUmbralCarga = 500;

      // Carga paralela (Cargar archivo, carga real): la Custom API sanic_cm_PartirCarga deja un job de padres (producto,
      // fiador y agente; corre primero y solo) y estas partes por CIF, que corren en paralelo. 3 y no más: Dataverse
      // limita la ejecución a 1.200 s cada 5 min por usuario (service protection) y cada parte consume ~100 s por lote:
      // con 4 se queda al borde. La API acepta de 1 a 4 y con menos de 300 filas hace una sola.
      nfPartesCarga = 3;

      // Interruptor de la carga paralela. false = la carga real va en UN job, en serie. Pasar a true SOLO
      // después de refrescar la fuente "Environment" en Studio (la foto de las Custom APIs del .msapr no conoce
      // sanic_cm_PartirCarga hasta entonces, y la fórmula de btnPartirCar queda inerte).
      nfCargaParalela = true;
      // Interruptor del cierre en lote de Reconciliación en el servidor (Custom API sanic_cm_CerrarFueraDeCartera, por
      // lotes y sin el tope de 2000 filas). false = Patch masivo desde la app. Pasar a true SOLO después de refrescar "Environment"
      // en Studio (hasta entonces la foto de las Custom APIs no conoce la API y tmrCierreRec queda inerte).
      nfCierreServidor = true;

      // Interruptor de la validación de largo en la prueba en seco y la carga en serie (btnValidarCar llama a
      // sanic_cm_PartirCarga con SoloValidar = true antes de poner el job en cola). Pasar a true SOLO después de refrescar
      // "Environment" en Studio: la foto del .msapr no conoce el parámetro SoloValidar y la fórmula de
      // btnValidarCar queda inerte; con true y la fórmula inerte, la carga quedaría sin lanzar.
      nfValidarLargo = true;

      // Breakpoint responsive único del proyecto.
      // Si Studio rechaza App.ActiveScreen aquí, mover nfMovil a cada pantalla como Parent.Width < 920.
      nfMovil = App.ActiveScreen.Width < 920;

      // Última carga registrada (delegable: Sort + First). La usan Monitoreo y Reconciliación.
      nfUltimaCarga = First(
          Sort('CM | TBL | Carga diarias', '[CD] FechaCarga', SortOrder.Descending)
      ).'[CD] FechaCarga';

      // Usuario de Dataverse: fórmula con nombre (y no Set en OnStart) para que esté disponible aunque una pantalla corra
      // antes de que termine el arranque. Por el id de Entra y no por correo: User().Email devuelve el UPN, que puede no
      // coincidir con el correo principal (ver plugin EmailDesdeUsuario). El id no cambia nunca.
      // Los perfiles del usuario (gblRol) los pone scrCarga con la Custom API sanic_cm_MisRoles.
      gblUsuarioDV = LookUp(
          Users,
          'Azure AD Object ID' = User().EntraObjectId
      );
    OnStart: |-
      =// ===== App.OnStart =====
      // 1) Tokens de color (identidad de la familia, modo día)
      Set(
          gblC,
          {
              teal: ColorValue("#0F6B6B"),
              tealOscuro: ColorValue("#0B5252"),
              tealSuave: ColorValue("#E0EEEE"),
              pantalla: ColorValue("#F2F4F7"),
              card: ColorValue("#FFFFFF"),
              borde: ColorValue("#E4E7EC"),
              hairline: ColorValue("#F0F2F5"),
              ink: ColorValue("#101828"),
              ink2: ColorValue("#475467"),
              muted: ColorValue("#667085"),
              muted2: ColorValue("#98A2B3"),
              okBg: ColorValue("#ECFDF5"),
              okInk: ColorValue("#067647"),
              pendBg: ColorValue("#FEF3C7"),
              pendInk: ColorValue("#B45309"),
              redBg: ColorValue("#FEE2E2"),
              redInk: ColorValue("#DC2626"),
              diariaBg: ColorValue("#DBEAFE"),
              diariaInk: ColorValue("#2563EB"),
              incobBg: ColorValue("#FEF3C7"),
              incobInk: ColorValue("#B45309"),
              espBg: ColorValue("#EDE9FE"),
              espInk: ColorValue("#7C3AED"),
              blancoTr: RGBA(
                  255,
                  255,
                  255,
                  0.18
              ),
              scrim: RGBA(
                  16,
                  24,
                  40,
                  0.45
              )
          }
      );
      // 2) Tokens de medida (los ÚNICOS números "absolutos" permitidos en las guías)
      Set(
          gblE,
          {
              Pad: 16,
              PadSm: 10,
              AnchoNav: 240,
              Radio: 12,
              RadioSm: 9,
              AltoBarra: 56,
              AltoFila: 64,
              AltoInput: 40,
              AltoBoton: 44,
              AnchoMax: 1600
          }
      );
      // 4) La navegación por rol vive en cmpNavLateral (galNavCmp.Items, catálogo local).
      Set(
          gblNavMovilAbierta,
          false
      )
    StartScreen: =scrCarga
    Theme: =PowerAppsTheme
