App:
  Properties:
    Formulas: |-
      =// ===== App.Formulas (fórmulas con nombre — guía 01 §3) =====
      // Bimoneda: "C$ X · US$ Y", omite la moneda en cero. Igual que la app del localizador.
      Moneda(nio:Number, usd:Number): Text =
          Coalesce(
              // Filter saca las entradas en blanco: sin él, Concat(0,0) devuelve " · " (no vacío)
              // y el Coalesce nunca dispara.
              Concat(
                  Filter(
                      Table(
                          {t: If(Coalesce(nio,0) > 0, "C$ " & Text(nio, "#,##0.00"))},
                          {t: If(Coalesce(usd,0) > 0, "US$ " & Text(usd, "#,##0.00"))}
                      ),
                      !IsBlank(t)
                  ),
                  t, " · "
              ),
              "C$ 0.00"
          );

      // Cuenta enmascarada (PCI, fase 2): ninguna pantalla muestra el número completo; se muestra
      // "•••• " + 'Últimos 4' (columna de la cuenta). Solo el rol BackOffice lee el PAN completo (bóveda, scrTranscripcion/Transcritas).
      CuentaMasc(ult4:Text): Text =
          If(IsBlank(ult4), "••••", "•••• " & ult4);

      // F7: versión desplegada. paso7_desplegar reemplaza "dev" por "<commit> <aaaa-mm-dd HH:MM UTC>" al empaquetar;
      // las suites la leen en la app servida para no probar una versión vieja.
      nfVersion = "dev";

      // Alerta de carga: Cartera por localizador marca en rojo al cobrador con más asignaciones activas que esto.
      // Es un criterio de operación (no un límite técnico: el teléfono trae la cartera por tramos). Cambiarlo acá.
      nfUmbralCarga = 500;

      // Carga paralela (Cargar archivo, carga real): la Custom API sanic_cm_PartirCarga deja un job de padres (producto,
      // fiador y agente; corre primero y solo) y estas partes por CIF, que corren en paralelo. 3 y no más: Dataverse
      // limita la ejecución a 1.200 s cada 5 min por usuario (service protection) y cada parte consume ~100 s por lote:
      // con 4 se queda al borde. La API acepta de 1 a 4 y con menos de 300 filas hace una sola.
      nfPartesCarga = 3;

      // Interruptor de la carga paralela. false = la carga real va en UN job, en serie, como antes. Pasar a true SOLO
      // después de refrescar la fuente "Environment" en Studio (la foto de las Custom APIs del .msapr no conoce
      // sanic_cm_PartirCarga hasta entonces, y la fórmula de btnPartirCar queda inerte).
      nfCargaParalela = true;

      // Interruptor de la validación de largo en la prueba en seco y la carga en serie (btnValidarCar llama a
      // sanic_cm_PartirCarga con SoloValidar = true antes de poner el job en cola). Pasar a true SOLO después de refrescar
      // "Environment" en Studio: la foto del .msapr no conoce el parámetro SoloValidar (1.0.9.9) y la fórmula de
      // btnValidarCar queda inerte; con true y la fórmula inerte, la carga quedaría sin lanzar.
      nfValidarLargo = true;

      // Breakpoint responsive único del proyecto (00 §7).
      // Si Studio rechaza App.ActiveScreen acá, mover nfMovil a cada pantalla como Parent.Width < 920.
      nfMovil = App.ActiveScreen.Width < 920;

      // Última carga registrada (delegable: Sort + First). La usan Monitoreo y Reconciliación.
      nfUltimaCarga = First(
          Sort('CM | TBL | Carga diarias', '[CD] FechaCarga', SortOrder.Descending)
      ).'[CD] FechaCarga';

      // Identidad (B-01, ronda 6): fórmulas con nombre y NO Set en OnStart — el OnVisible de
      // scrInicio corría antes de que OnStart terminara y los KPIs salían vacíos la 1ª vez.
      // Se evalúan a demanda y siempre están disponibles. Nombres gbl* conservados (referencias).
      // gblRol derivado de la seguridad REAL (00 §3.1 — sin tabla extra).
      // a) Roles DIRECTOS del usuario: "SR | CM | Admin" -> "Admin".
      // b) Roles por TEAM: en este proyecto el rol se asigna por membresía al team
      //    "CM · <perfil> · <ENV>". Canvas no deja navegar Team -> Security Roles dentro de un
      //    ForAll ("not accessible in this context", verificado en Studio), así que el perfil
      //    sale del segmento del medio del nombre del team (el sufijo DEV/PRD se ignora).
      //    ⚠ Renombrar un team CM rompe este mapeo (mismo acople que el prefijo "SR | CM | ").
      // Por el id de Entra y no por correo: User().Email devuelve el UPN, que puede no coincidir con el correo
      // principal (en la app del cobrador ya se corrigió; ver plugin EmailDesdeUsuario). El id no cambia nunca.
      gblUsuarioDV = LookUp(
          Users,
          'Azure AD Object ID' = User().EntraObjectId
      );

      // Expresión pura (Concat/Split/Distinct, sin Collect/Set): válida en fórmula con nombre.
      // B-06: guarda de Blank. Si el LookUp de gblUsuarioDV todavía no resolvió (carrera al abrir) o el
      // usuario no existe en Users, sus relaciones son Blank y Filter/Concat fallaban con
      // "expected a table" (banner en Inicio). Sin usuario => "" => estado "sin acceso".
      gblRol = If(IsBlank(gblUsuarioDV), "", With(
          {
              // a) roles directos "SR | CM | Admin" -> "Admin"
              rolesDirectos: Concat(
                  Filter(
                      gblUsuarioDV.'Security Roles (systemuserroles_association)',
                      StartsWith(
                          Name,
                          "SR | CM | "
                      )
                  ),
                  Substitute(
                      Name,
                      "SR | CM | ",
                      ""
                  ),
                  "|"
              ),
              // b) roles por team "CM · <perfil> · <ENV>" -> perfil (segmento del medio)
              //    (mismo recorrido que el ForAll original: If por fila, sin Filter sobre la relación)
              rolesTeam: Concat(
                  gblUsuarioDV.'Teams (teammembership_association)',
                  If(
                      StartsWith(
                          'Team Name',
                          "CM · "
                      ),
                      Switch(
                          Index(
                              Split(
                                  'Team Name',
                                  " · "
                              ),
                              2
                          ).Value,
                          "Backoffice",
                          "BackOffice",
                          "Solicitantes",
                          "Solicitante",
                          "Supervisores",
                          "Supervisor",
                          "Admin y Carga",
                          "Admin",
                          ""
                      )
                  ),
                  "|"
              )
          },
          // Multi-rol => "BackOffice|Admin". El `in` de los guards/nav es case-insensitive.
          // Sin ningún rol CM => gblRol vacío => estado "sin acceso" de scrInicio.
          Concat(
              Distinct(
                  Filter(
                      Split(
                          rolesDirectos & "|" & rolesTeam,
                          "|"
                      ),
                      !IsBlank(Value)
                  ),
                  Value
              ),
              Value,
              "|"
          )
      ));
    OnStart: |-
      =// ===== App.OnStart =====
      // F7: la nav (componente) no ve las fórmulas con nombre que solo usa ella (nfVersion llegaba vacía): va por variable.
      Set(gblVersion, nfVersion);
      // 1) Tokens de color (identidad de la familia, modo día)
      Set(
          gblC,
          {
              teal: ColorValue("#0F6B6B"),
              tealOscuro: ColorValue("#0B5252"),
              tealSuave: ColorValue("#E0EEEE"),
              pantalla: ColorValue("#F2F4F7"),
              card: ColorValue("#FFFFFF"),
              borde: ColorValue("#E4E7EC"),
              hairline: ColorValue("#F0F2F5"),
              ink: ColorValue("#101828"),
              ink2: ColorValue("#475467"),
              muted: ColorValue("#667085"),
              muted2: ColorValue("#98A2B3"),
              okBg: ColorValue("#ECFDF5"),
              okInk: ColorValue("#067647"),
              pendBg: ColorValue("#FEF3C7"),
              pendInk: ColorValue("#B45309"),
              redBg: ColorValue("#FEE2E2"),
              redInk: ColorValue("#DC2626"),
              diariaBg: ColorValue("#DBEAFE"),
              diariaInk: ColorValue("#2563EB"),
              incobBg: ColorValue("#FEF3C7"),
              incobInk: ColorValue("#B45309"),
              espBg: ColorValue("#EDE9FE"),
              espInk: ColorValue("#7C3AED"),
              blancoTr: RGBA(
                  255,
                  255,
                  255,
                  0.18
              ),
              scrim: RGBA(
                  16,
                  24,
                  40,
                  0.45
              )
          }
      );
      // 2) Tokens de medida (los ÚNICOS números "absolutos" permitidos en las guías)
      Set(
          gblE,
          {
              Pad: 16,
              PadSm: 10,
              AnchoNav: 240,
              Radio: 12,
              RadioSm: 9,
              AltoBarra: 56,
              AltoFila: 64,
              AltoInput: 40,
              AltoBoton: 44,
              AnchoMax: 1600
          }
      );
      // 4) La navegación por rol vive en cmpNavLateral (galNavCmp.Items, catálogo local — B-06).
      Set(
          gblNavMovilAbierta,
          false
      )
    StartScreen: =scrInicio
    Theme: =PowerAppsTheme
