                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.Width - 2*gblE.Pad
                              Wrap: =true
                              X: =gblE.Pad
                              Y: =58
                        - btnAccArqIni:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =Color.Transparent
                              BorderThickness: =1
