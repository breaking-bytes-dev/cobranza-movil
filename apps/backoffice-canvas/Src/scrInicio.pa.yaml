                        EsHero: =false
                        Etiqueta: ="AGENTES SIN USUARIO"
                        Height: =96
                        Valor: =Text(varNAgSinUsrIni)
                        Width: =If(nfMovil, (Parent.Width - gblE.PadSm) / 2, (Parent.Width - 3*gblE.PadSm) / 4)
                        X: =If(nfMovil, 0, 2*((Parent.Width - 3*gblE.PadSm)/4 + gblE.PadSm))
                        Y: =If(nfMovil, 96 + gblE.PadSm, 0)
            - lblSecAccIni:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.muted
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =18
