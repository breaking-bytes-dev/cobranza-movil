Screens:
  scrInicio:
    Properties:
      Fill: =gblC.pantalla
      OnVisible: |-
        =// 1) Cobrado hoy por los localizadores (subtítulo del encabezado) — común a todos los roles.
        //    Filtro delegable por fecha (00 §4.2); cota 2000 declarada (00 §4.1).
        If(!IsBlank(gblRol),
            ClearCollect(colPagosHoyIni,
                Filter('CM | TBL | Pagos', 'Fecha del pago' >= Today()));
            // Los Sum van sobre la colección, EN MEMORIA — jamás Sum directo al datasource (00 §4.3).
            // Por eso NO van en Concurrent con el ClearCollect: dependen de él (secuencial con ;).
            Set(varCobNioIni,
                Sum(Filter(colPagosHoyIni, '[PG] Moneda' = 'Choice | CM | Monedas en Pago'.NIO), '[PG] Monto'));
            Set(varCobUsdIni,
                Sum(Filter(colPagosHoyIni, '[PG] Moneda' = 'Choice | CM | Monedas en Pago'.USD), '[PG] Monto'))
        );
        // 2) Backoffice: cola pendiente + transcritas hoy por mí (independientes → Concurrent).
        If("Backoffice" in gblRol,
            Concurrent(
                // Delegable: igualdad de choice (00 §4.2). Cota 2000 declarada (00 §4.1).
                ClearCollect(colPendIni,
                    Filter('CM | TBL | Interaccions',
                        '[IN] Estado grabacion' = 'Choice | CM | Estado grabacion Interaccio'.Pendiente)),
                // Delegable: choice + fecha + lookup por registro (00 §4.2).
                ClearCollect(colTscIni,
                    Filter('CM | TBL | Interaccions',
                        '[IN] Estado grabacion' = 'Choice | CM | Estado grabacion Interaccio'.Grabado
                        && '[IN] Fecha grabacion' >= Today()
                        && '[IN] Grabado por' = gblUsuarioDV))
            )
        );
        // 3) Solicitante: TODAS mis Especiales (los 3 KPIs se cuentan en memoria sobre esta colección).
        If("Solicitante" in gblRol,
            ClearCollect(colSolIni,
                Filter('CM | TBL | Asignacions',
                    '[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Especial
                    && '[AS] Solicitado por' = gblUsuarioDV))
        );
        // 4) Supervisor: Especiales pendientes de aprobación (cota real: unidades — 00 §4.1).
        If("Supervisor" in gblRol,
            ClearCollect(colAprobIni,
                Filter('CM | TBL | Asignacions',
                    '[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Especial
                    && '[AS] Estado de aprobacion' = 'Choice | CM | Estado aprobacion especial'.'Pendiente aprobacion'))
        );
        // 5) Admin: diarias fuera de cartera + agentes (independientes → Concurrent).
        If("Admin" in gblRol,
            Concurrent(
                // Delegable: choice + booleano + comparación de fecha (00 §4.2, patrón colDesap de 00 §4.1).
                ClearCollect(colDesapIni,
                    Filter('CM | TBL | Asignacions',
                        '[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Diaria
                        && '[AS] Estado' = true
                        && 'Última carga' < nfUltimaCarga)),
                // Tabla chica (decenas de filas, org completa): se trae entera.
                ClearCollect(colAgIni, 'CM | TBL | Agentes')
            )
        )
    Children:
      # ── Encabezado (receta 01 §7.5) ───────────────────────────────────────────────
      - cmpEncIni:
          Control: CanvasComponent
          ComponentName: cmpEncabezado
          Properties:
            Height: =If(nfMovil, gblE.AltoBarra + 84, 84)
            Subtitulo: |-
              ="Cobrado hoy por los localizadores: " & Moneda(varCobNioIni, varCobUsdIni)
            Titulo: |-
              ="Hola, " & First(Split(User().FullName, " ")).Value
            Visible: =!IsBlank(gblRol)
            Width: =Parent.Width - Self.X
            X: =If(nfMovil, 0, gblE.AnchoNav)
            Y: =0
      # ── Contenido con rol ─────────────────────────────────────────────────────────
      - conContenidoIni:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height - Self.Y
            Visible: =!IsBlank(gblRol)
            Width: =Parent.Width - Self.X
            X: =If(nfMovil, 0, gblE.AnchoNav)
            Y: =cmpEncIni.Y + cmpEncIni.Height
          Children:
            # ── KPIs Backoffice ───────────────────────────────────────────────────
            - conKpisBoIni:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  Height: =If(nfMovil, 2*96 + gblE.PadSm, 96)
                  Visible: ="Backoffice" in gblRol
                  Width: =Min(Parent.Width - 2*gblE.Pad, gblE.AnchoMax)
                  X: =Max(gblE.Pad, (Parent.Width - gblE.AnchoMax) / 2)
                  Y: =gblE.PadSm
                Children:
                  - cmpKpiColaIni:
                      Control: CanvasComponent
                      ComponentName: cmpKpi
                      Properties:
                        Detalle: ="interacciones por transcribir"
                        EsHero: =true
                        Etiqueta: ="EN COLA"
                        Height: =96
                        Valor: =Text(CountRows(colPendIni))
                        Width: |-
                          =If(nfMovil, (Parent.Width - gblE.PadSm) / 2, (Parent.Width - 3*gblE.PadSm) / 4)
                        X: =0
                        Y: =0
                  - cmpKpiTscIni:
                      Control: CanvasComponent
                      ComponentName: cmpKpi
                      Properties:
                        Detalle: ="por vos"
                        EsHero: =false
                        Etiqueta: ="TRANSCRITAS HOY"
                        Height: =96
                        Valor: =Text(CountRows(colTscIni))
                        Width: |-
                          =If(nfMovil, (Parent.Width - gblE.PadSm) / 2, (Parent.Width - 3*gblE.PadSm) / 4)
                        X: |-
                          =If(nfMovil, (Parent.Width - gblE.PadSm)/2 + gblE.PadSm, (Parent.Width - 3*gblE.PadSm)/4 + gblE.PadSm)
                        Y: =0
                  - cmpKpiPagoIni:
                      Control: CanvasComponent
                      ComponentName: cmpKpi
                      Properties:
                        Detalle: ="priorizá estas"
                        EsHero: =false
                        Etiqueta: ="CON PAGO"
                        Height: =96
                        Valor: =Text(CountRows(Filter(colPendIni, '[IN] Aplica pago')))
                        Width: |-
                          =If(nfMovil, (Parent.Width - gblE.PadSm) / 2, (Parent.Width - 3*gblE.PadSm) / 4)
                        X: |-
                          =If(nfMovil, 0, 2*((Parent.Width - 3*gblE.PadSm)/4 + gblE.PadSm))
                        Y: =If(nfMovil, 96 + gblE.PadSm, 0)
            # ── KPIs Solicitante ──────────────────────────────────────────────────
            - conKpisSolIni:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  Height: =If(nfMovil, 2*96 + gblE.PadSm, 96)
                  Visible: ="Solicitante" in gblRol
                  Width: =Min(Parent.Width - 2*gblE.Pad, gblE.AnchoMax)
                  X: =Max(gblE.Pad, (Parent.Width - gblE.AnchoMax) / 2)
                  Y: |-
                    =conKpisBoIni.Y + If(conKpisBoIni.Visible, conKpisBoIni.Height + gblE.PadSm, 0)
                Children:
                  - cmpKpiSpenIni:
                      Control: CanvasComponent
                      ComponentName: cmpKpi
                      Properties:
                        Detalle: ="esperando aprobación"
                        EsHero: =true
                        Etiqueta: ="PENDIENTES"
                        Height: =96
                        Valor: |-
                          =Text(CountRows(Filter(colSolIni, '[AS] Estado de aprobacion' = 'Choice | CM | Estado aprobacion especial'.'Pendiente aprobacion')))
                        Width: |-
                          =If(nfMovil, (Parent.Width - gblE.PadSm) / 2, (Parent.Width - 3*gblE.PadSm) / 4)
                        X: =0
                        Y: =0
                  - cmpKpiSaprIni:
                      Control: CanvasComponent
                      ComponentName: cmpKpi
                      Properties:
                        Detalle: ="en gestión de campo"
                        EsHero: =false
                        Etiqueta: ="APROBADAS"
                        Height: =96
                        Valor: |-
                          =Text(CountRows(Filter(colSolIni, '[AS] Estado de aprobacion' = 'Choice | CM | Estado aprobacion especial'.Aprobado)))
                        Width: |-
                          =If(nfMovil, (Parent.Width - gblE.PadSm) / 2, (Parent.Width - 3*gblE.PadSm) / 4)
                        X: |-
                          =If(nfMovil, (Parent.Width - gblE.PadSm)/2 + gblE.PadSm, (Parent.Width - 3*gblE.PadSm)/4 + gblE.PadSm)
                        Y: =0
                  - cmpKpiSrecIni:
                      Control: CanvasComponent
                      ComponentName: cmpKpi
                      Properties:
                        Detalle: ="revisá el motivo"
                        EsHero: =false
                        Etiqueta: ="RECHAZADAS"
                        Height: =96
                        Valor: |-
                          =Text(CountRows(Filter(colSolIni, '[AS] Estado de aprobacion' = 'Choice | CM | Estado aprobacion especial'.Rechazada)))
                        Width: |-
                          =If(nfMovil, (Parent.Width - gblE.PadSm) / 2, (Parent.Width - 3*gblE.PadSm) / 4)
                        X: |-
