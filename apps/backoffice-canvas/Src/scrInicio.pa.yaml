                        X: |-
                          =If(nfMovil, (Parent.Width - gblE.PadSm)/2 + gblE.PadSm, (Parent.Width - 3*gblE.PadSm)/4 + gblE.PadSm)
                        Y: =0
                  - cmpKpiAgeIni:
                      Control: CanvasComponent
                      ComponentName: cmpKpi
                      Properties:
                        Detalle: ="no pueden entrar a la app"
                        EsHero: =false
                        Etiqueta: ="AGENTES SIN USUARIO"
                        Height: =96
                        Valor: |-
                          =Text(CountRows(Filter(colAgIni, '[AG] Activo' && IsBlank('[AG] Usuario'))))
                        Width: |-
                          =If(nfMovil, (Parent.Width - gblE.PadSm) / 2, (Parent.Width - 3*gblE.PadSm) / 4)
                        X: |-
                          =If(nfMovil, 0, 2*((Parent.Width - 3*gblE.PadSm)/4 + gblE.PadSm))
                        Y: =If(nfMovil, 96 + gblE.PadSm, 0)
            # ── Sección ACCESOS ───────────────────────────────────────────────────
            - lblSecAccIni:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.muted
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =18
                  PaddingLeft: =0
                  Size: =8
                  Text: ="ACCESOS"
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =200
                  Wrap: =false
                  X: =conKpisBoIni.X
                  Y: |-
                    =conKpisAdmIni.Y + If(conKpisAdmIni.Visible, conKpisAdmIni.Height + gblE.PadSm, 0) + gblE.Pad
            # ── Accesos Backoffice ────────────────────────────────────────────────
            - conAccBoIni:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  Height: =If(nfMovil, 3*104 + 2*gblE.PadSm, 104)
                  Visible: ="Backoffice" in gblRol
                  Width: =conKpisBoIni.Width
                  X: =conKpisBoIni.X
                  Y: =lblSecAccIni.Y + lblSecAccIni.Height + gblE.PadSm
                Children:
                  - conAccColaIni:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =gblC.borde
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =gblC.card
                        Height: =104
                        RadiusBottomLeft: =gblE.Radio
                        RadiusBottomRight: =gblE.Radio
                        RadiusTopLeft: =gblE.Radio
                        RadiusTopRight: =gblE.Radio
                        Width: |-
                          =If(nfMovil, Parent.Width, (Parent.Width - 2*gblE.PadSm) / 3)
                        X: =0
                        Y: =0
                      Children:
                        - lblAccColaIcoIni:
                            Control: Label@2.5.1
                            Properties:
                              Font: =Font.'Segoe UI'
                              Height: =28
                              PaddingLeft: =0
                              Size: =13
                              Text: ="📥"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =40
                              Wrap: =false
                              X: =gblE.Pad
                              Y: =8
                        - lblAccColaTitIni:
                            Control: Label@2.5.1
                            Properties:
                              Color: =gblC.ink
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =22
                              PaddingLeft: =0
                              Size: =11
                              Text: ="Ir a la cola"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =Parent.Width - 2*gblE.Pad
                              Wrap: =false
                              X: =gblE.Pad
                              Y: =36
                        - lblAccColaDesIni:
                            Control: Label@2.5.1
                            Properties:
                              Color: =gblC.muted
                              Font: =Font.'Segoe UI'
                              Height: =36
                              PaddingLeft: =0
                              Size: =9
                              Text: ="FIFO — la más vieja primero"
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.Width - 2*gblE.Pad
                              Wrap: =true
                              X: =gblE.Pad
                              Y: =58
                        - btnAccColaIni:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =Color.Transparent
                              BorderThickness: =1
                              Fill: =Color.Transparent
                              Height: =Parent.Height
                              HoverBorderColor: =gblC.teal
                              HoverFill: =Color.Transparent
                              OnSelect: =Navigate(scrTranscripcion)
                              PressedBorderColor: =gblC.teal
                              PressedFill: =Color.Transparent
                              RadiusBottomLeft: =gblE.Radio
                              RadiusBottomRight: =gblE.Radio
                              RadiusTopLeft: =gblE.Radio
                              RadiusTopRight: =gblE.Radio
                              Text: =""
                              Width: =Parent.Width
                              X: =0
                              Y: =0
                  - conAccArqIni:
                      Control: GroupContainer@1.5.0
