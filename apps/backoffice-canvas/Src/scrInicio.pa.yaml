                        EsHero: =false
                        Etiqueta: ="DIARIAS FUERA DE CARTERA"
                        Height: =96
                        Valor: =Text(varNDesapIni)
                        Width: =If(nfMovil, (Parent.Width - gblE.PadSm) / 2, (Parent.Width - 3*gblE.PadSm) / 4)
                        X: =If(nfMovil, (Parent.Width - gblE.PadSm)/2 + gblE.PadSm, (Parent.Width - 3*gblE.PadSm)/4 + gblE.PadSm)
                  - cmpKpiAgeIni:
