Screens:
  scrInicio:
    Properties:
      Fill: =gblC.pantalla
      OnVisible: |-
        =// 1) Cobrado hoy por los localizadores (subtítulo del encabezado) — SOLO BackOffice, Admin y
        //    Supervisor: el Solicitante puro no tiene lectura de Pagos (mínimo privilegio → 403, B-05).
        //    Sum DIRECTO al datasource: delega en Dataverse para columnas numéricas (docs oficiales,
        //    hasta 50.000 filas) — sin colección intermedia truncable al Data row limit.
        If("BackOffice" in gblRol || "Admin" in gblRol || "Supervisor" in gblRol,
            Set(varCobNioIni,
                Sum(Filter('CM | TBL | Pagos', 'Fecha del pago' >= Today() &&
                    '[PG] Moneda' = 'Choice | CM | Monedas en Pago'.NIO), '[PG] Monto'));
            Set(varCobUsdIni,
                Sum(Filter('CM | TBL | Pagos', 'Fecha del pago' >= Today() &&
                    '[PG] Moneda' = 'Choice | CM | Monedas en Pago'.USD), '[PG] Monto'))
        );
        // 2..5) KPIs = conteos EXACTOS directo al datasource: CountIf delega en Dataverse (exacto
        //    hasta 50.000). NO colección + CountRows: la colección se trunca al Data row limit.
        //    Condiciones idénticas a los Filter de las pantallas destino; lookups comparados por PK.
        // 2) Backoffice: cola pendiente + transcritas hoy por mí (independientes → Concurrent).
        If("Backoffice" in gblRol,
            Concurrent(
                Set(varNPendIni,
                    CountIf('CM | TBL | Interaccions',
                        '[IN] Estado grabacion' = 'Choice | CM | Estado grabacion Interaccio'.Pendiente)),
                Set(varNPagoIni,
                    CountIf('CM | TBL | Interaccions',
                        '[IN] Estado grabacion' = 'Choice | CM | Estado grabacion Interaccio'.Pendiente
                        && '[IN] Aplica pago')),
                Set(varNTscIni,
                    CountIf('CM | TBL | Interaccions',
                        '[IN] Estado grabacion' = 'Choice | CM | Estado grabacion Interaccio'.Grabado
                        && '[IN] Fecha grabacion' >= Today()
                        && '[IN] Grabado por'.User = gblUsuarioDV.User))
            )
        );
        // 3) Solicitante: mis Especiales por estado de aprobación.
        If("Solicitante" in gblRol,
            Concurrent(
                Set(varNSpenIni,
                    CountIf('CM | TBL | Asignacions',
                        '[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Especial
                        && '[AS] Solicitado por'.User = gblUsuarioDV.User
                        && '[AS] Estado de aprobacion' = 'Choice | CM | Estado aprobacion especial'.'Pendiente aprobacion')),
                Set(varNSaprIni,
                    CountIf('CM | TBL | Asignacions',
                        '[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Especial
                        && '[AS] Solicitado por'.User = gblUsuarioDV.User
                        && '[AS] Estado de aprobacion' = 'Choice | CM | Estado aprobacion especial'.Aprobado)),
                Set(varNSrecIni,
                    CountIf('CM | TBL | Asignacions',
                        '[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Especial
                        && '[AS] Solicitado por'.User = gblUsuarioDV.User
                        && '[AS] Estado de aprobacion' = 'Choice | CM | Estado aprobacion especial'.Rechazada))
            )
        );
        // 4) Supervisor: Especiales pendientes de aprobación.
        If("Supervisor" in gblRol,
            Set(varNAprbIni,
                CountIf('CM | TBL | Asignacions',
                    '[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Especial
                    && '[AS] Estado' = true  // B-18: misma regla que la cola de Aprobaciones
                    && '[AS] Estado de aprobacion' = 'Choice | CM | Estado aprobacion especial'.'Pendiente aprobacion'))
        );
        // 5) Admin: diarias fuera de cartera + agentes sin usuario (independientes → Concurrent).
        //    Fuera de cartera se compara por FECHA (corte 00:00 del día de la última carga), igual que
        //    Reconciliación — fecha+hora marcaba como desaparecidas las cargadas segundos antes del máximo.
        If("Admin" in gblRol,
            // nfUltimaCarga lee Carga diarias (solo Admin): se materializa acá para que el KPI "CARGA DE HOY"
            // no la evalúe para otros roles aunque su contenedor esté oculto (403, B-05).
            Set(varUltCargaIni, nfUltimaCarga);
            // Corte = 00:00 UTC del día de la última carga. 'Última carga' es UserLocal y el import la graba
            // a medianoche UTC; [CD] FechaCarga es DateOnly. Sin este ajuste, en UTC-6 todo parece "desaparecido".
            Set(varCorteIni, With({d0: DateTime(Year(varUltCargaIni), Month(varUltCargaIni), Day(varUltCargaIni), 0, 0, 0)},
                DateAdd(d0, -TimeZoneOffset(d0), TimeUnit.Minutes)));
            Concurrent(
                Set(varNDesapIni,
                    CountIf('CM | TBL | Asignacions',
                        '[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Diaria
                        && '[AS] Estado' = true
                        && 'Última carga' < varCorteIni)),
                Set(varNAgSinUsrIni,
                    CountIf('CM | TBL | Agentes', '[AG] Activo' && 'Email Usuario' = Blank()))
            )
        )
    Children:
      - cmpEncIni:
          Control: CanvasComponent
          ComponentName: cmpEncabezado
          Properties:
            Height: =If(nfMovil, gblE.AltoBarra + 84, 84)
            Subtitulo: |-
              =If("BackOffice" in gblRol || "Admin" in gblRol || "Supervisor" in gblRol,
                  "Cobrado hoy por los localizadores: " & Moneda(varCobNioIni, varCobUsdIni),
                  "Tus solicitudes Especiales")
            Titulo: ="Hola, " & First(Split(User().FullName, " ")).Value
            Visible: =!IsBlank(gblRol)
            Width: =Parent.Width - Self.X
            X: =If(nfMovil, 0, gblE.AnchoNav)
      - conContenidoIni:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height - Self.Y
            Visible: =!IsBlank(gblRol)
            Width: =Parent.Width - Self.X
            X: =If(nfMovil, 0, gblE.AnchoNav)
            Y: =cmpEncIni.Y + cmpEncIni.Height
          Children:
            - conKpisBoIni:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  Height: =If(nfMovil, 2*96 + gblE.PadSm, 96)
                  Visible: ="Backoffice" in gblRol
                  Width: =Min(Parent.Width - 2*gblE.Pad, gblE.AnchoMax)
                  X: =Max(gblE.Pad, (Parent.Width - gblE.AnchoMax) / 2)
                  Y: =gblE.PadSm
                Children:
                  - cmpKpiColaIni:
                      Control: CanvasComponent
                      ComponentName: cmpKpi
                      Properties:
                        Detalle: ="interacciones por transcribir"
                        EsHero: =true
                        Etiqueta: ="EN COLA"
                        Height: =96
                        Valor: =Text(varNPendIni)
                        Width: =If(nfMovil, (Parent.Width - gblE.PadSm) / 2, (Parent.Width - 3*gblE.PadSm) / 4)
                  - cmpKpiTscIni:
                      Control: CanvasComponent
                      ComponentName: cmpKpi
                      Properties:
                        Detalle: ="por vos"
                        EsHero: =false
                        Etiqueta: ="TRANSCRITAS HOY"
                        Height: =96
                        Valor: =Text(varNTscIni)
                        Width: =If(nfMovil, (Parent.Width - gblE.PadSm) / 2, (Parent.Width - 3*gblE.PadSm) / 4)
                        X: =If(nfMovil, (Parent.Width - gblE.PadSm)/2 + gblE.PadSm, (Parent.Width - 3*gblE.PadSm)/4 + gblE.PadSm)
                  - cmpKpiPagoIni:
                      Control: CanvasComponent
                      ComponentName: cmpKpi
                      Properties:
                        Detalle: ="priorizá estas"
                        EsHero: =false
                        Etiqueta: ="CON PAGO"
                        Height: =96
                        Valor: =Text(varNPagoIni)
                        Width: =If(nfMovil, (Parent.Width - gblE.PadSm) / 2, (Parent.Width - 3*gblE.PadSm) / 4)
                        X: =If(nfMovil, 0, 2*((Parent.Width - 3*gblE.PadSm)/4 + gblE.PadSm))
                        Y: =If(nfMovil, 96 + gblE.PadSm, 0)
            - conKpisSolIni:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  Height: =If(nfMovil, 2*96 + gblE.PadSm, 96)
                  Visible: ="Solicitante" in gblRol
                  Width: =Min(Parent.Width - 2*gblE.Pad, gblE.AnchoMax)
                  X: =Max(gblE.Pad, (Parent.Width - gblE.AnchoMax) / 2)
                  Y: =conKpisBoIni.Y + If(conKpisBoIni.Visible, conKpisBoIni.Height + gblE.PadSm, 0)
                Children:
                  - cmpKpiSpenIni:
                      Control: CanvasComponent
                      ComponentName: cmpKpi
                      Properties:
                        Detalle: ="esperando aprobación"
                        EsHero: =true
                        Etiqueta: ="PENDIENTES"
                        Height: =96
                        Valor: =Text(varNSpenIni)
                        Width: =If(nfMovil, (Parent.Width - gblE.PadSm) / 2, (Parent.Width - 3*gblE.PadSm) / 4)
                  - cmpKpiSaprIni:
