                  X: =conKpisBoIni.X
                  Y: =conKpisAdmIni.Y + If(conKpisAdmIni.Visible, conKpisAdmIni.Height + gblE.PadSm, 0) + gblE.Pad
            - conAccBoIni:
                Control: GroupContainer@1.5.0
