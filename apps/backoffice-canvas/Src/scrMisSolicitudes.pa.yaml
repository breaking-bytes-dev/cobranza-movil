Screens:
  scrMisSolicitudes:
    Properties:
      Fill: =gblC.pantalla
      OnVisible: |-
        =If(!("Solicitante" in gblRol), Navigate(scrInicio));
        // SIN Concurrent: el join de colSolSol necesita colCtasSol ya cargada (gotcha 7.7)
        ClearCollect(colCtasSol, ShowColumns('CM | TBL | Cuentas',
            '[CT] Numero de cuenta', 'Nombre Cliente', 'CIF Cliente', 'Tipo Producto',
            '[CT] Saldo Vencido NIO', '[CT] Saldo Vencido USD', '[CT] Dias Mora'));
        // Mis Especiales — Filter delegable (choice por valor + lookup por registro, 00 §4.2);
        // AddColumns y Sort corren EN MEMORIA sobre el resultado (cota 2000, 00 §4.1)
        ClearCollect(colSolSol,
            Sort(
                AddColumns(
                    Filter('CM | TBL | Asignacions',
                        '[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Especial
                        && '[AS] Solicitado por' = gblUsuarioDV),
                    clienteSol, Upper(Coalesce(
                        LookUp(colCtasSol, '[CT] Numero de cuenta' = '[AS] NumeroCuenta').'Nombre Cliente', "—")),
                    prodSol, Coalesce(
                        LookUp(colCtasSol, '[CT] Numero de cuenta' = '[AS] NumeroCuenta').'Tipo Producto', "—"),
                    saldoNioSol, Coalesce(
                        LookUp(colCtasSol, '[CT] Numero de cuenta' = '[AS] NumeroCuenta').'[CT] Saldo Vencido NIO', 0),
                    saldoUsdSol, Coalesce(
                        LookUp(colCtasSol, '[CT] Numero de cuenta' = '[AS] NumeroCuenta').'[CT] Saldo Vencido USD', 0),
                    moraSol, Coalesce(
                        LookUp(colCtasSol, '[CT] Numero de cuenta' = '[AS] NumeroCuenta').'[CT] Dias Mora', 0),
                    agenteSol, '[AS] Agente'.'[AG] Nombre'
                ),
                '[AS] Fecha de Asignacion', SortOrder.Descending
            )
        );
        Set(varPanelSol, false)
    Children:
      # ── Encabezado (receta 01 §7.5) ───────────────────────────────────────────────
      - cmpEncSol:
          Control: CanvasComponent
          ComponentName: cmpEncabezado
          Properties:
            Height: =If(nfMovil, gblE.AltoBarra + 84, 84)
            Subtitulo: ="Estado de tus asignaciones Especiales."
            Titulo: ="Mis solicitudes"
            Width: =Parent.Width - Self.X
            X: =If(nfMovil, 0, gblE.AnchoNav)
            Y: =0
      # ── Acciones del encabezado ───────────────────────────────────────────────────
      - btnActualizarSol:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =gblC.borde
            BorderThickness: =1
            Color: =gblC.ink2
            Fill: =gblC.card
            Font: =Font.'Segoe UI'
            Height: =gblE.AltoBoton
            OnSelect: |-
              =ClearCollect(colCtasSol, ShowColumns('CM | TBL | Cuentas',
                  '[CT] Numero de cuenta', 'Nombre Cliente', 'CIF Cliente', 'Tipo Producto',
                  '[CT] Saldo Vencido NIO', '[CT] Saldo Vencido USD', '[CT] Dias Mora'));
              ClearCollect(colSolSol,
                  Sort(
                      AddColumns(
                          Filter('CM | TBL | Asignacions',
                              '[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Especial
                              && '[AS] Solicitado por' = gblUsuarioDV),
                          clienteSol, Upper(Coalesce(
                              LookUp(colCtasSol, '[CT] Numero de cuenta' = '[AS] NumeroCuenta').'Nombre Cliente', "—")),
                          prodSol, Coalesce(
                              LookUp(colCtasSol, '[CT] Numero de cuenta' = '[AS] NumeroCuenta').'Tipo Producto', "—"),
                          saldoNioSol, Coalesce(
                              LookUp(colCtasSol, '[CT] Numero de cuenta' = '[AS] NumeroCuenta').'[CT] Saldo Vencido NIO', 0),
                          saldoUsdSol, Coalesce(
                              LookUp(colCtasSol, '[CT] Numero de cuenta' = '[AS] NumeroCuenta').'[CT] Saldo Vencido USD', 0),
                          moraSol, Coalesce(
                              LookUp(colCtasSol, '[CT] Numero de cuenta' = '[AS] NumeroCuenta').'[CT] Dias Mora', 0),
                          agenteSol, '[AS] Agente'.'[AG] Nombre'
                      ),
                      '[AS] Fecha de Asignacion', SortOrder.Descending
                  )
              );
              Notify("✓ Lista actualizada", NotificationType.Success, 2500)
            Size: =9
            Text: ="↻ Actualizar"
            Width: =130
            X: =btnNuevaSol.X - Self.Width - gblE.PadSm
            Y: =btnNuevaSol.Y
      - btnNuevaSol:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =Color.White
            DisabledColor: =Color.White
            DisabledFill: =ColorFade(gblC.teal, 60%)
            Fill: =gblC.teal
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =gblE.AltoBoton
            HoverFill: =ColorFade(gblC.teal, 10%)
            OnSelect: =Navigate(scrNuevaSolicitud)
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Size: =9
            Text: ="✨ Nueva solicitud"
            Visible: =true
            Width: =170
            X: =Parent.Width - Self.Width - gblE.Pad
            Y: |-
              =cmpEncSol.Y + If(nfMovil, gblE.AltoBarra, 0) + (84 - Self.Height) / 2
      # ── Contenido centrado (receta 01 §7.13) ──────────────────────────────────────
      - conContenidoSol:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderThickness: =0
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height - Self.Y
            Width: =Min(gblE.AnchoMax, Parent.Width - If(nfMovil, 0, gblE.AnchoNav) - 2*gblE.Pad)
            X: |-
              =If(nfMovil, 0, gblE.AnchoNav)
                  + Max(gblE.Pad, (Parent.Width - If(nfMovil, 0, gblE.AnchoNav) - gblE.AnchoMax) / 2)
            Y: =cmpEncSol.Y + cmpEncSol.Height
          Children:
            # ── Card de la lista (receta 01 §7.1) ─────────────────────────────────
            - conListaSol:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =gblC.borde
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =gblC.card
                  Height: =Parent.Height - 2*gblE.Pad
                  RadiusBottomLeft: =gblE.Radio
                  RadiusBottomRight: =gblE.Radio
                  RadiusTopLeft: =gblE.Radio
                  RadiusTopRight: =gblE.Radio
                  Width: =Min(Parent.Width - 2*gblE.Pad, gblE.AnchoMax)
                  X: =gblE.Pad
                  Y: =gblE.Pad
                Children:
                  - galSolSol:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        Height: =Parent.Height - 2*gblE.PadSm
                        Items: =colSolSol
                        OnSelect: =Set(varPanelSol, true)
                        ShowScrollbar: =false
                        TemplateFill: |-
                          =If(ThisItem.IsSelected, gblC.tealSuave, gblC.card)
                        TemplatePadding: =0
                        TemplateSize: =If(nfMovil, 132, 84)
                        Visible: =CountRows(colSolSol) > 0
                        Width: =Parent.Width - 2*gblE.PadSm
                        X: =gblE.PadSm
                        Y: =gblE.PadSm
                      Children:
                        # overlay clicable — PRIMERO (al fondo del z-order, receta 7.3)
                        - recFilaSol:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =Color.Transparent
                              Height: =Parent.TemplateHeight
                              OnSelect: =Select(Parent)
                              Width: =Parent.TemplateWidth
                              X: =0
                              Y: =0
                        - lblClienteFilaSol:
                            Control: Label@2.5.1
                            Properties:
                              Color: =gblC.ink
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =18
                              OnSelect: =Select(Parent)
                              PaddingLeft: =0
                              Size: =10
                              Text: =ThisItem.clienteSol
                              VerticalAlign: =VerticalAlign.Middle
                              Width: |-
                                =If(nfMovil, Parent.TemplateWidth - 2*gblE.PadSm, (Parent.TemplateWidth - 2*gblE.PadSm) * 0.34)
                              Wrap: =false
                              X: =gblE.PadSm
                              Y: =6
                        - lblCuentaFilaSol:
                            Control: Label@2.5.1
                            Properties:
                              Color: =gblC.muted
                              Font: =Font.'Segoe UI'
                              Height: =16
                              OnSelect: =Select(Parent)
                              PaddingLeft: =0
                              Size: =9
                              Text: =ThisItem.'[AS] NumeroCuenta'
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =lblClienteFilaSol.Width
                              Wrap: =false
                              X: =gblE.PadSm
                              Y: =26
                        - lblMetaFilaSol:
                            Control: Label@2.5.1
                            Properties:
                              Color: =gblC.muted2
                              Font: =Font.'Segoe UI'
                              Height: =16
                              OnSelect: =Select(Parent)
                              PaddingLeft: =0
                              Size: =8
                              Text: |-
                                =ThisItem.'[AS] Numero' & " · " & Text(ThisItem.'[AS] Fecha de Asignacion', "dd/mm HH:mm")
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =lblClienteFilaSol.Width
                              Wrap: =false
                              X: =gblE.PadSm
                              Y: =44
                        - lblNotasFilaSol:
                            Control: Label@2.5.1
                            Properties:
                              Color: =gblC.ink2
                              Font: =Font.'Segoe UI'
                              Height: |-
                                =If(nfMovil, 34, Parent.TemplateHeight - 14)
                              OnSelect: =Select(Parent)
                              PaddingLeft: =0
                              Size: =9
                              Text: |-
                                =If(Len(ThisItem.Notas) > 90, Left(ThisItem.Notas, 90) & "…", ThisItem.Notas)
                              VerticalAlign: =VerticalAlign.Top
                              Width: |-
                                =(Parent.TemplateWidth - 2*gblE.PadSm) * If(nfMovil, 1, 0.32)
                              Wrap: =true
                              X: |-
                                =If(nfMovil, gblE.PadSm, gblE.PadSm + (Parent.TemplateWidth - 2*gblE.PadSm) * 0.36)
                              Y: =If(nfMovil, 64, 6)
                        - lblMontoFilaSol:
                            Control: Label@2.5.1
                            Properties:
                              Align: =If(nfMovil, Align.Left, Align.Right)
                              Color: =gblC.ink
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =18
                              OnSelect: =Select(Parent)
                              PaddingLeft: =0
                              PaddingRight: =0
                              Size: =10
                              Text: |-
                                =Moneda(ThisItem.'Retiro NIO', ThisItem.'Retiro USD')
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =220
                              Wrap: =false
                              X: |-
                                =If(nfMovil, gblE.PadSm, Parent.TemplateWidth - Self.Width - gblE.PadSm)
                              Y: =If(nfMovil, 100, 8)
                        # chips dentro de fila clicable: SIN DisplayMode.View (excepción receta 7.2)
                        - chpEstadoFilaSol:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderThickness: =0
                              Color: |-
                                =If(ThisItem.'[AS] Estado' = false, gblC.ink2,
                                    Switch(ThisItem.'[AS] Estado de aprobacion',
                                        'Choice | CM | Estado aprobacion especial'.'Pendiente aprobacion', gblC.pendInk,
                                        'Choice | CM | Estado aprobacion especial'.Aprobado, gblC.okInk,
                                        'Choice | CM | Estado aprobacion especial'.Rechazada, gblC.redInk,
                                        gblC.ink2))
                              Fill: |-
                                =If(ThisItem.'[AS] Estado' = false, gblC.hairline,
                                    Switch(ThisItem.'[AS] Estado de aprobacion',
                                        'Choice | CM | Estado aprobacion especial'.'Pendiente aprobacion', gblC.pendBg,
                                        'Choice | CM | Estado aprobacion especial'.Aprobado, gblC.okBg,
                                        'Choice | CM | Estado aprobacion especial'.Rechazada, gblC.redBg,
                                        gblC.hairline))
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =26
                              OnSelect: =Select(Parent)
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =8
                              Text: |-
                                =If(ThisItem.'[AS] Estado' = false, "Cerrada",
                                    Switch(ThisItem.'[AS] Estado de aprobacion',
                                        'Choice | CM | Estado aprobacion especial'.'Pendiente aprobacion', "Pendiente aprobación",
                                        'Choice | CM | Estado aprobacion especial'.Aprobado, "Aprobada",
                                        'Choice | CM | Estado aprobacion especial'.Rechazada, "Rechazada",
                                        'Choice | CM | Estado aprobacion especial'.Borrador, "Borrador",
                                        "—"))
                              Width: =14 + 7*Len(Self.Text)
                              X: =Parent.TemplateWidth - Self.Width - gblE.PadSm
                              Y: =If(nfMovil, 98, 32)
                        - chpAgenteFilaSol:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderThickness: =0
                              Color: =gblC.ink2
                              Fill: =gblC.hairline
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =26
                              OnSelect: =Select(Parent)
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =8
                              Text: ="🏍️ " & ThisItem.agenteSol
                              Visible: =!IsBlank(ThisItem.agenteSol)
                              Width: =14 + 7*Len(Self.Text)
                              X: =chpEstadoFilaSol.X - Self.Width - gblE.PadSm
                              Y: =chpEstadoFilaSol.Y
                        - recSepSol:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =gblC.hairline
                              Height: =1
                              OnSelect: =Select(Parent)
                              Width: =Parent.TemplateWidth
                              X: =0
                              Y: =Parent.TemplateHeight - 1
            # ── Estado vacío (receta 01 §7.12) ────────────────────────────────────
            - cmpVacioSol:
                Control: CanvasComponent
                ComponentName: cmpVacio
                Properties:
                  Height: =200
                  Icono: ="🗂️"
                  Mensaje: |-
                    ="Creá la primera con el botón «✨ Nueva solicitud», arriba a la derecha."
                  Titulo: ="Sin solicitudes todavía"
                  Visible: =CountRows(colSolSol) = 0
                  Width: =Min(420, Parent.Width - 2*gblE.Pad)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
      # ── Panel de detalle SOLO LECTURA (receta 01 §7.4) ────────────────────────────
      - recScrimSol:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =gblC.scrim
            Height: =Parent.Height
            OnSelect: =Set(varPanelSol, false)
            Visible: =varPanelSol
            Width: =Parent.Width
            X: =0
            Y: =0
      - conPanelSol:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =gblC.borde
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =gblC.card
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =varPanelSol
            Width: =If(nfMovil, Parent.Width, Min(480, Parent.Width * 0.45))
            X: =Parent.Width - Self.Width
            Y: =0
          Children:
            - lblTituloPanSol:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.ink
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =22
                  PaddingLeft: =0
                  Size: =13
                  Text: |-
                    ="Solicitud " & galSolSol.Selected.'[AS] Numero'
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =Parent.Width - 2*gblE.Pad
                  Wrap: =false
                  X: =gblE.Pad
                  Y: =16
            - icoCerrarSol:
                Control: Classic/Icon@2.5.0
                Properties:
                  Color: =gblC.muted
                  Height: =22
                  Icon: =Icon.Cancel
                  OnSelect: =Set(varPanelSol, false)
                  Width: =22
                  X: =Parent.Width - Self.Width - gblE.Pad
                  Y: =16
            - lblSecCtaSol:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.muted
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =22
                  PaddingLeft: =0
                  Size: =8
                  Text: ="CUENTA"
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =Parent.Width - 2*gblE.Pad
                  Wrap: =false
                  X: =gblE.Pad
                  Y: =58
            - lblKCliSol:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.muted
                  Font: =Font.'Segoe UI'
                  Height: =22
                  PaddingLeft: =0
                  Size: =9
                  Text: ="Cliente"
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =110
                  Wrap: =false
                  X: =gblE.Pad
                  Y: =80
            - lblVCliSol:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: =gblC.ink
                  Font: =Font.'Segoe UI'
                  Height: =22
                  PaddingLeft: =0
                  PaddingRight: =0
                  Size: =10
                  Text: =galSolSol.Selected.clienteSol
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =Parent.Width - 2*gblE.Pad - 110
                  Wrap: =false
                  X: =gblE.Pad + 110
                  Y: =80
            - lblKCtaSol:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.muted
                  Font: =Font.'Segoe UI'
                  Height: =22
                  PaddingLeft: =0
                  Size: =9
                  Text: ="Cuenta"
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =110
                  Wrap: =false
                  X: =gblE.Pad
                  Y: =104
            - lblVCtaSol:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: =gblC.ink
                  Font: =Font.'Segoe UI'
                  Height: =22
                  PaddingLeft: =0
                  PaddingRight: =0
                  Size: =10
                  Text: |-
                    =galSolSol.Selected.'[AS] NumeroCuenta' & " · " & galSolSol.Selected.prodSol
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =Parent.Width - 2*gblE.Pad - 110
                  Wrap: =false
                  X: =gblE.Pad + 110
                  Y: =104
            - lblKSaldoSol:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.muted
                  Font: =Font.'Segoe UI'
                  Height: =22
                  PaddingLeft: =0
                  Size: =9
                  Text: ="Saldo vencido"
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =110
                  Wrap: =false
                  X: =gblE.Pad
                  Y: =128
            - lblVSaldoSol:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: =gblC.ink
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =22
                  PaddingLeft: =0
                  PaddingRight: =0
                  Size: =10
                  Text: |-
                    =Moneda(galSolSol.Selected.saldoNioSol, galSolSol.Selected.saldoUsdSol)
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =Parent.Width - 2*gblE.Pad - 110
                  Wrap: =false
                  X: =gblE.Pad + 110
                  Y: =128
            - lblKMoraSol:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.muted
                  Font: =Font.'Segoe UI'
                  Height: =22
                  PaddingLeft: =0
                  Size: =9
                  Text: ="Mora"
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =110
                  Wrap: =false
                  X: =gblE.Pad
                  Y: =152
            - lblVMoraSol:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: =gblC.ink
                  Font: =Font.'Segoe UI'
                  Height: =22
                  PaddingLeft: =0
                  PaddingRight: =0
                  Size: =10
                  Text: =galSolSol.Selected.moraSol & " días"
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =Parent.Width - 2*gblE.Pad - 110
                  Wrap: =false
                  X: =gblE.Pad + 110
                  Y: =152
            - lblSecSolSol:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.muted
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =22
                  PaddingLeft: =0
                  Size: =8
                  Text: ="SOLICITUD"
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =Parent.Width - 2*gblE.Pad
                  Wrap: =false
                  X: =gblE.Pad
                  Y: =190
            - lblKRetiroSol:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.muted
                  Font: =Font.'Segoe UI'
                  Height: =22
                  PaddingLeft: =0
                  Size: =9
                  Text: ="Retiro pedido"
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =110
                  Wrap: =false
                  X: =gblE.Pad
                  Y: =212
            - lblVRetiroSol:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: =gblC.ink
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =22
                  PaddingLeft: =0
                  PaddingRight: =0
                  Size: =10
                  Text: |-
                    =Moneda(galSolSol.Selected.'Retiro NIO', galSolSol.Selected.'Retiro USD')
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =Parent.Width - 2*gblE.Pad - 110
                  Wrap: =false
                  X: =gblE.Pad + 110
                  Y: =212
            - lblKFechaSol:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.muted
                  Font: =Font.'Segoe UI'
                  Height: =22
                  PaddingLeft: =0
                  Size: =9
                  Text: ="Solicitada"
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =110
                  Wrap: =false
                  X: =gblE.Pad
                  Y: =236
            - lblVFechaSol:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: =gblC.ink
                  Font: =Font.'Segoe UI'
                  Height: =22
                  PaddingLeft: =0
                  PaddingRight: =0
                  Size: =10
                  Text: |-
                    =Text(galSolSol.Selected.'[AS] Fecha de Asignacion', "dd/mm HH:mm")
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =Parent.Width - 2*gblE.Pad - 110
                  Wrap: =false
                  X: =gblE.Pad + 110
                  Y: =236
            - conNotasPanSol:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderThickness: =0
                  DropShadow: =DropShadow.None
                  Fill: =gblC.pantalla
                  Height: =96
                  RadiusBottomLeft: =gblE.RadioSm
                  RadiusBottomRight: =gblE.RadioSm
                  RadiusTopLeft: =gblE.RadioSm
                  RadiusTopRight: =gblE.RadioSm
                  Width: =Parent.Width - 2*gblE.Pad
                  X: =gblE.Pad
                  Y: =266
                Children:
                  - lblNotasPanSol:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.ink
                        Font: =Font.'Segoe UI'
                        Height: =Parent.Height - 2*gblE.PadSm
                        PaddingLeft: =0
                        Size: =9
                        Text: =galSolSol.Selected.Notas
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Parent.Width - 2*gblE.PadSm
                        Wrap: =true
                        X: =gblE.PadSm
