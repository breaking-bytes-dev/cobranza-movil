Screens:
  scrMisSolicitudes:
    Properties:
      Fill: =gblC.pantalla
      OnVisible: |-
        =// Filtros (APP-39): por defecto el último mes (de hace un mes a hoy), todos los estados, sin cobrador, CIF ni cuenta.
        // Se conservan entre visitas de la misma sesión; «Limpiar» vuelve a los valores por defecto.
        If(IsBlank(varDesdeSol), Set(varDesdeSol, DateAdd(Today(), -1, TimeUnit.Months)));
        If(IsBlank(varHastaSol), Set(varHastaSol, Today()));
        If(IsBlank(varEstSol), Set(varEstSol, "Todos los estados"));
        If(IsBlank(varAgSol), Set(varAgSol, "Todos los localizadores"));
        // Cobradores del filtro (todos, por nombre). El DropDown aplica Default una sola vez: Reset después de cargar.
        ClearCollect(colAgSol, {nom: "Todos los localizadores"});
        Collect(colAgSol, ForAll(Sort('CM | TBL | Agentes', '[AG] Nombre'), {nom: ThisRecord.'[AG] Nombre'}));
        Reset(drpAgSol);
        Set(varPanelSol, false);
        Set(varAvisoSol, false);
        Select(btnCargarSol)
    Children:
      - cmpEncSol:
          Control: CanvasComponent
          ComponentName: cmpEncabezado
          Properties:
            Height: =If(nfMovil, gblE.AltoBarra + 84, 84)
            Subtitulo: ="Estado de tus asignaciones Especiales · " & CountRows(colSolSol) & If(CountRows(colSolSol) = 1, " solicitud", " solicitudes") & " con estos filtros."
            Titulo: ="Mis solicitudes"
            Width: =Parent.Width - Self.X
            X: =If(nfMovil, 0, gblE.AnchoNav)
      - btnActualizarSol:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =gblC.borde
            BorderThickness: =1
            Color: =gblC.ink2
            Fill: =gblC.card
            FocusedBorderColor: =gblC.teal
            FocusedBorderThickness: =2
            Font: =Font.'Segoe UI'
            Height: =gblE.AltoBoton
            OnSelect: =Set(varAvisoSol, true); Select(btnCargarSol)
            Size: =9
            Text: ="↻ Actualizar"
            Width: =130
            X: =btnNuevaSol.X - Self.Width - gblE.PadSm
            Y: =btnNuevaSol.Y
      - btnNuevaSol:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =Color.White
            DisabledColor: =Color.White
            DisabledFill: =ColorFade(gblC.teal, 60%)
            Fill: =gblC.teal
            FocusedBorderColor: =gblC.ink
            FocusedBorderThickness: =2
            Font: =Font.'Segoe UI'
            Height: =gblE.AltoBoton
            HoverFill: =ColorFade(gblC.teal, 10%)
            OnSelect: =Navigate(scrNuevaSolicitud)
            Size: =9
            Text: ="✨ Nueva solicitud"
            Width: =170
            X: =Parent.Width - Self.Width - gblE.Pad
            Y: =cmpEncSol.Y + If(nfMovil, gblE.AltoBarra, 0) + (84 - Self.Height) / 2
      - conContenidoSol:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height - Self.Y
            Width: =Min(gblE.AnchoMax, Parent.Width - If(nfMovil, 0, gblE.AnchoNav) - 2*gblE.Pad)
            X: |-
              =If(nfMovil, 0, gblE.AnchoNav)
                  + Max(gblE.Pad, (Parent.Width - If(nfMovil, 0, gblE.AnchoNav) - gblE.AnchoMax) / 2)
            Y: =cmpEncSol.Y + cmpEncSol.Height
          Children:
            - conFiltrosSol:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  Height: =If(nfMovil, 4 * gblE.AltoInput + 3 * gblE.PadSm, If(Self.Width >= 1400, gblE.AltoInput, 2 * gblE.AltoInput + gblE.PadSm))
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =gblE.PadSm
                  LayoutWrap: =true
                  Width: =Min(Parent.Width - 2*gblE.Pad, gblE.AnchoMax)
                  X: =gblE.Pad
                  Y: =gblE.Pad
                Children:
                  - lblDesdeSol:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.muted
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoInput
                        PaddingLeft: =0
                        Size: =9
                        Text: ="Creadas del"
                        Visible: =!nfMovil
                        Width: =78
                  - dtpDesdeSol:
                      Control: Classic/DatePicker@2.6.0
                      Properties:
                        AccessibleLabel: ="Creadas desde"
                        BorderColor: =gblC.borde
                        Color: =gblC.ink
                        DefaultDate: =varDesdeSol
                        DisplayMode: =If(varCargandoSol, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =gblC.card
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoInput
                        OnChange: |-
                          =Set(varDesdeSol, Coalesce(Self.SelectedDate, DateAdd(Today(), -1, TimeUnit.Months)));
                          If(varDesdeSol > varHastaSol, Set(varHastaSol, varDesdeSol); Reset(dtpHastaSol));
                          Select(btnCargarSol)
                        Size: =10
                        StartOfWeek: =StartOfWeek.Monday
                        Width: =If(nfMovil, (Parent.Width - gblE.PadSm) / 2, 150)
                  - lblHastaSol:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.muted
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoInput
                        PaddingLeft: =0
                        Size: =9
                        Text: ="al"
                        Visible: =!nfMovil
                        Width: =18
                  - dtpHastaSol:
                      Control: Classic/DatePicker@2.6.0
                      Properties:
                        AccessibleLabel: ="Creadas hasta"
                        BorderColor: =gblC.borde
                        Color: =gblC.ink
                        DefaultDate: =varHastaSol
                        DisplayMode: =If(varCargandoSol, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =gblC.card
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoInput
                        OnChange: |-
                          =Set(varHastaSol, Coalesce(Self.SelectedDate, Today()));
                          If(varHastaSol < varDesdeSol, Set(varDesdeSol, varHastaSol); Reset(dtpDesdeSol));
                          Select(btnCargarSol)
                        Size: =10
                        StartOfWeek: =StartOfWeek.Monday
                        Width: =If(nfMovil, (Parent.Width - gblE.PadSm) / 2, 150)
                  - drpEstSol:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        AccessibleLabel: ="Estado de la solicitud"
                        BorderColor: =gblC.borde
                        BorderThickness: =1
                        ChevronBackground: =gblC.card
                        ChevronFill: =gblC.ink2
                        ChevronHoverBackground: =gblC.pantalla
                        ChevronHoverFill: =gblC.teal
                        Color: =gblC.ink
                        DisplayMode: =If(varCargandoSol, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =gblC.card
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoInput
                        HoverColor: =gblC.ink
                        HoverFill: =gblC.pantalla
                        PressedColor: =gblC.card
                        PressedFill: =gblC.teal
                        SelectionColor: =gblC.card
                        SelectionFill: =gblC.teal
                        Size: =10
                        Default: =Coalesce(varEstSol, "Todos los estados")
                        Items: =["Todos los estados", "Pendiente aprobación", "Aprobada", "Rechazada", "Cerrada"]
                        Items.Value: =Value
                        OnChange: =Set(varEstSol, Coalesce(Self.Selected.Value, "Todos los estados")); Select(btnCargarSol)
                        Width: =If(nfMovil, (Parent.Width - gblE.PadSm) / 2, 200)
                  - drpAgSol:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        AccessibleLabel: ="Localizador"
                        BorderColor: =gblC.borde
                        BorderThickness: =1
                        ChevronBackground: =gblC.card
                        ChevronFill: =gblC.ink2
                        ChevronHoverBackground: =gblC.pantalla
                        ChevronHoverFill: =gblC.teal
                        Color: =gblC.ink
                        DisplayMode: =If(varCargandoSol, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =gblC.card
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoInput
                        HoverColor: =gblC.ink
                        HoverFill: =gblC.pantalla
                        PressedColor: =gblC.card
                        PressedFill: =gblC.teal
                        SelectionColor: =gblC.card
                        SelectionFill: =gblC.teal
                        Size: =10
                        Default: =Coalesce(varAgSol, "Todos los localizadores")
                        Items: =colAgSol
                        Items.Value: =nom
                        OnChange: =Set(varAgSol, Coalesce(Self.Selected.nom, "Todos los localizadores")); Select(btnCargarSol)
                        Width: =If(nfMovil, (Parent.Width - gblE.PadSm) / 2, 240)
                  - txtCifSol:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        AccessibleLabel: ="CIF del cliente"
                        BorderColor: =gblC.borde
                        Default: =varCifSol
                        DelayOutput: =true
                        DisplayMode: =If(varCargandoSol, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =gblC.card
                        FillPortions: =0
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoInput
                        HintText: ="CIF"
                        OnChange: =Set(varCifSol, Trim(Self.Text)); Select(btnCargarSol)
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Size: =10
                        Width: =If(nfMovil, (Parent.Width - gblE.PadSm) / 2, 170)
                  - txtCtaSol:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        AccessibleLabel: ="Últimos 4 dígitos de la cuenta"
                        BorderColor: =gblC.borde
                        Default: =varCtaSol
                        DelayOutput: =true
                        DisplayMode: =If(varCargandoSol, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =gblC.card
                        FillPortions: =0
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoInput
                        HintText: ="Cuenta (últimos 4)"
                        OnChange: =Set(varCtaSol, Trim(Self.Text)); Select(btnCargarSol)
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Size: =10
                        Width: =If(nfMovil, (Parent.Width - gblE.PadSm) / 2, 150)
                  - btnLimpiarSol:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =gblC.borde
                        BorderThickness: =1
                        Color: =gblC.teal
                        DisplayMode: =If(varCargandoSol, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =gblC.card
                        FillPortions: =0
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoInput
                        OnSelect: |-
                          =Set(varDesdeSol, DateAdd(Today(), -1, TimeUnit.Months)); Set(varHastaSol, Today());
                          Set(varEstSol, "Todos los estados"); Set(varAgSol, "Todos los localizadores"); Set(varCifSol, ""); Set(varCtaSol, "");
                          Reset(dtpDesdeSol); Reset(dtpHastaSol); Reset(drpEstSol); Reset(drpAgSol); Reset(txtCifSol); Reset(txtCtaSol);
                          Select(btnCargarSol)
                        Size: =10
                        Text: ="Limpiar"
                        Tooltip: ="Último mes, todos los estados, sin localizador, CIF ni cuenta"
                        Width: =If(nfMovil, Parent.Width, 90)
            - conListaSol:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =gblC.borde
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =gblC.card
                  Height: =Parent.Height - Self.Y - gblE.Pad
                  RadiusBottomLeft: =gblE.Radio
                  RadiusBottomRight: =gblE.Radio
                  RadiusTopLeft: =gblE.Radio
                  RadiusTopRight: =gblE.Radio
                  Width: =Min(Parent.Width - 2*gblE.Pad, gblE.AnchoMax)
                  X: =gblE.Pad
                  Y: =conFiltrosSol.Y + conFiltrosSol.Height + gblE.PadSm
                Children:
                  - galSolSol:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        AccessibleLabel: ="Mis solicitudes"
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Height: =Parent.Height - 2*gblE.PadSm
                        Items: =colSolSol
                        OnSelect: =Set(varPanelSol, true)
                        ShowScrollbar: =false
                        TemplateFill: =If(ThisItem.IsSelected, gblC.tealSuave, gblC.card)
                        TemplatePadding: =0
                        TemplateSize: =If(nfMovil, 132, 84)
                        Visible: =CountRows(colSolSol) > 0
                        Width: =Parent.Width - 2*gblE.PadSm
                        X: =gblE.PadSm
                        Y: =gblE.PadSm
                      Children:
                        - lblClienteFilaSol:
                            Control: Label@2.5.1
                            Properties:
                              Color: =gblC.ink
                              FocusedBorderColor: =gblC.teal
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =18
                              PaddingLeft: =0
                              Size: =10
                              Text: =ThisItem.clienteSol
                              Width: =If(nfMovil, Parent.TemplateWidth - 2*gblE.PadSm, (Parent.TemplateWidth - 2*gblE.PadSm) * 0.34)
                              Wrap: =false
                              X: =gblE.PadSm
                              Y: =6
                        - lblCuentaFilaSol:
                            Control: Label@2.5.1
                            Properties:
                              Color: =gblC.muted
                              FocusedBorderColor: =gblC.teal
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              Height: =16
                              PaddingLeft: =0
                              Size: =9
                              Text: =CuentaMasc(ThisItem.ult4Sol)
                              Width: =lblClienteFilaSol.Width
                              Wrap: =false
                              X: =gblE.PadSm
                              Y: =26
                        - lblMetaFilaSol:
                            Control: Label@2.5.1
                            Properties:
                              Color: =gblC.muted2
                              FocusedBorderColor: =gblC.teal
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              Height: =16
                              PaddingLeft: =0
                              Size: =8
                              Text: =ThisItem.'[AS] Numero' & " · " & Text(ThisItem.'[AS] Fecha asignada', "dd/mm/yyyy")
                              Width: =lblClienteFilaSol.Width
                              Wrap: =false
                              X: =gblE.PadSm
                              Y: =44
                        - lblNotasFilaSol:
                            Control: Label@2.5.1
                            Properties:
                              Color: =gblC.ink2
                              FocusedBorderColor: =gblC.teal
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              Height: =If(nfMovil, 34, Parent.TemplateHeight - 14)
                              PaddingLeft: =0
                              Size: =9
                              Text: =If(Len(ThisItem.Notas) > 90, Left(ThisItem.Notas, 90) & "…", ThisItem.Notas)
                              VerticalAlign: =VerticalAlign.Top
                              Width: =(Parent.TemplateWidth - 2*gblE.PadSm) * If(nfMovil, 1, 0.32)
                              X: =If(nfMovil, gblE.PadSm, gblE.PadSm + (Parent.TemplateWidth - 2*gblE.PadSm) * 0.36)
                              Y: =If(nfMovil, 64, 6)
                        - lblMontoFilaSol:
                            Control: Label@2.5.1
                            Properties:
                              Align: =If(nfMovil, Align.Left, Align.Right)
                              Color: =gblC.ink
                              FocusedBorderColor: =gblC.teal
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =18
                              PaddingLeft: =0
                              PaddingRight: =0
                              Size: =10
                              Text: =Moneda(ThisItem.'Retiro NIO', ThisItem.'Retiro USD')
                              Width: =220
                              Wrap: =false
                              X: =If(nfMovil, gblE.PadSm, Parent.TemplateWidth - Self.Width - gblE.PadSm)
                              Y: =If(nfMovil, 100, 8)
                        - chpEstadoFilaSol:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderThickness: =0
                              Color: |-
                                =// DAT-14: una Rechazada ahora queda cerrada; se sigue mostrando como Rechazada.
                                If(ThisItem.'[AS] Estado' = false && ThisItem.'[AS] Estado de aprobacion' <> 'Choice | CM | Estado aprobacion especial'.Rechazada, gblC.ink2,
                                    Switch(ThisItem.'[AS] Estado de aprobacion',
                                        'Choice | CM | Estado aprobacion especial'.'Pendiente aprobacion', gblC.pendInk,
                                        'Choice | CM | Estado aprobacion especial'.Aprobado, gblC.okInk,
                                        'Choice | CM | Estado aprobacion especial'.Rechazada, gblC.redInk,
                                        gblC.ink2))
                              Fill: |-
                                =If(ThisItem.'[AS] Estado' = false && ThisItem.'[AS] Estado de aprobacion' <> 'Choice | CM | Estado aprobacion especial'.Rechazada, gblC.hairline,
                                    Switch(ThisItem.'[AS] Estado de aprobacion',
                                        'Choice | CM | Estado aprobacion especial'.'Pendiente aprobacion', gblC.pendBg,
                                        'Choice | CM | Estado aprobacion especial'.Aprobado, gblC.okBg,
                                        'Choice | CM | Estado aprobacion especial'.Rechazada, gblC.redBg,
                                        gblC.hairline))
                              FocusedBorderColor: =gblC.teal
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =26
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =8
                              Text: |-
                                =If(ThisItem.'[AS] Estado' = false && ThisItem.'[AS] Estado de aprobacion' <> 'Choice | CM | Estado aprobacion especial'.Rechazada, "Cerrada",
                                    Switch(ThisItem.'[AS] Estado de aprobacion',
                                        'Choice | CM | Estado aprobacion especial'.'Pendiente aprobacion', "Pendiente aprobación",
                                        'Choice | CM | Estado aprobacion especial'.Aprobado, "Aprobada",
                                        'Choice | CM | Estado aprobacion especial'.Rechazada, "Rechazada",
                                        'Choice | CM | Estado aprobacion especial'.Borrador, "Borrador",
                                        "—"))
                              Width: =14 + 7*Len(Self.Text)
                              X: =Parent.TemplateWidth - Self.Width - gblE.PadSm
                              Y: =If(nfMovil, 98, 32)
                        - chpAgenteFilaSol:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderThickness: =0
                              Color: =gblC.ink2
                              Fill: =gblC.hairline
                              FocusedBorderColor: =gblC.teal
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =26
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =8
                              Text: |-
                                ="🏍️ " & ThisItem.agenteSol
                              Visible: =!IsBlank(ThisItem.agenteSol)
                              Width: =14 + 7*Len(Self.Text)
                              X: =chpEstadoFilaSol.X - Self.Width - gblE.PadSm
                              Y: =chpEstadoFilaSol.Y
                        - recSepSol:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderThickness: =0
                              DropShadow: =DropShadow.None
                              Fill: =gblC.hairline
                              Height: =1
                              Width: =Parent.TemplateWidth
                              Y: =Parent.TemplateHeight - 1
                        - btnFilaSol:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderThickness: =0
                              Color: =Color.Transparent
                              Fill: =Color.Transparent
                              FocusedBorderColor: =gblC.teal
                              FocusedBorderThickness: =2
                              Height: =Parent.TemplateHeight
                              HoverFill: =RGBA(15, 107, 107, 0.06)
                              OnSelect: =Select(Parent)
                              PressedFill: =RGBA(15, 107, 107, 0.12)
                              TabIndex: =0
                              Text: ="Ver solicitud de " & ThisItem.clienteSol
                              Width: =Parent.TemplateWidth
                              X: =0
                              Y: =0
                  - lblCargandoSol:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =gblC.teal
                        Fill: =RGBA(255, 255, 255, 0.88)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.Height
                        Size: =12
                        Text: ="⏳ Cargando tus solicitudes…"
                        Visible: =varCargandoSol
                        Width: =Parent.Width
            - cmpVacioSol:
                Control: CanvasComponent
                ComponentName: cmpVacio
                Properties:
                  Height: =200
                  Icono: |-
                    ="🗂️"
                  Mensaje: |-
                    ="No hay solicitudes creadas del " & Text(varDesdeSol, "dd/mm/yyyy") & " al " & Text(varHastaSol, "dd/mm/yyyy") &
                        " con estos filtros. Probá con otras fechas o «Limpiar»."
                  Titulo: ="Sin solicitudes"
                  Visible: =CountRows(colSolSol) = 0 && !varCargandoSol
                  Width: =Min(420, Parent.Width - 2*gblE.Pad)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =conListaSol.Y + 80
      - btnCargarSol:
          Control: Classic/Button@2.2.0
          Properties:
            OnSelect: |-
              =// Mis Especiales con TODOS los filtros en el servidor (APP-39): cada cambio de filtro vuelve a consultar Dataverse, así el
              // límite de 2000 filas aplica a lo que coincide con los filtros y no a todo el historial. Delegable: choice y booleano por
              // valor, fechas y lookups contra variables; las partes «IsBlank(var) ||» y «var = "x" &&» no tocan columnas.
              // CIF y cuenta viven en la CUENTA, no en la asignación: primero las cuentas que coinciden (Cuentas, delegable; hasta 50)
              // y después sus Especiales, una consulta por cuenta. AddColumns directo sobre el Filter (los datos de la cuenta los
              // resuelve el servidor navegando '[AS] Cuenta').
              Set(varCargandoSol, true);
              Set(varFinSol, DateAdd(varHastaSol, 1));
              Set(varAgRecSol, If(IsBlank(varAgSol) || varAgSol = "Todos los localizadores", Blank(), LookUp('CM | TBL | Agentes', '[AG] Nombre' = varAgSol)));
              Set(varErrSol, Blank());
              Clear(colSolRawSol);
              Clear(colCtaSol);
              IfError(
                  If(IsBlank(varCifSol) && IsBlank(varCtaSol),
                      Collect(colSolRawSol,
                          AddColumns(
                              Filter('CM | TBL | Asignacions',
                                  '[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Especial
                                  && '[AS] Solicitado por'.User = gblUsuarioDV.User
                                  && 'Created On' >= varDesdeSol && 'Created On' < varFinSol
                                  && (IsBlank(varAgRecSol) || '[AS] Agente'.'CM | TBL | Agente' = varAgRecSol.'CM | TBL | Agente')
                                  && (varEstSol = "Todos los estados"
                                      || (varEstSol = "Pendiente aprobación" && '[AS] Estado de aprobacion' = 'Choice | CM | Estado aprobacion especial'.'Pendiente aprobacion')
                                      || (varEstSol = "Aprobada" && '[AS] Estado de aprobacion' = 'Choice | CM | Estado aprobacion especial'.Aprobado && '[AS] Estado' = true)
                                      || (varEstSol = "Rechazada" && '[AS] Estado de aprobacion' = 'Choice | CM | Estado aprobacion especial'.Rechazada)
                                      || (varEstSol = "Cerrada" && '[AS] Estado' = false && '[AS] Estado de aprobacion' <> 'Choice | CM | Estado aprobacion especial'.Rechazada))),
                              clienteSol, Upper(Coalesce(ThisRecord.'[AS] Cuenta'.'Nombre Cliente', "—")),
                              ult4Sol, Coalesce(ThisRecord.'[AS] Cuenta'.'Últimos 4', ""),
                              prodSol, Coalesce(ThisRecord.'[AS] Cuenta'.'Tipo Producto', "—"),
                              saldoNioSol, Coalesce(ThisRecord.'[AS] Cuenta'.'[CT] Saldo Vencido NIO', 0),
                              saldoUsdSol, Coalesce(ThisRecord.'[AS] Cuenta'.'[CT] Saldo Vencido USD', 0),
                              moraSol, Coalesce(ThisRecord.'[AS] Cuenta'.'[CT] Dias Mora', 0),
                              agenteSol, '[AS] Agente'.'[AG] Nombre'
                          )
                      ),
                      ClearCollect(colCtaSol,
                          FirstN(Filter('CM | TBL | Cuentas',
                              (IsBlank(varCifSol) || StartsWith('CIF Cliente', varCifSol))
                              && (IsBlank(varCtaSol) || 'Últimos 4' = varCtaSol)), 51));
                      ForAll(FirstN(colCtaSol, 50) As C,
                          Collect(colSolRawSol,
                              AddColumns(
                                  Filter('CM | TBL | Asignacions',
                                      '[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Especial
                                      && '[AS] Solicitado por'.User = gblUsuarioDV.User
                                      && 'Created On' >= varDesdeSol && 'Created On' < varFinSol
                                      && (IsBlank(varAgRecSol) || '[AS] Agente'.'CM | TBL | Agente' = varAgRecSol.'CM | TBL | Agente')
                                      && (varEstSol = "Todos los estados"
                                          || (varEstSol = "Pendiente aprobación" && '[AS] Estado de aprobacion' = 'Choice | CM | Estado aprobacion especial'.'Pendiente aprobacion')
                                          || (varEstSol = "Aprobada" && '[AS] Estado de aprobacion' = 'Choice | CM | Estado aprobacion especial'.Aprobado && '[AS] Estado' = true)
                                          || (varEstSol = "Rechazada" && '[AS] Estado de aprobacion' = 'Choice | CM | Estado aprobacion especial'.Rechazada)
                                          || (varEstSol = "Cerrada" && '[AS] Estado' = false && '[AS] Estado de aprobacion' <> 'Choice | CM | Estado aprobacion especial'.Rechazada))
                                      && '[AS] Cuenta'.'CM | TBL | Cuenta' = C.'CM | TBL | Cuenta'),
                                  clienteSol, Upper(Coalesce(ThisRecord.'[AS] Cuenta'.'Nombre Cliente', "—")),
                                  ult4Sol, Coalesce(ThisRecord.'[AS] Cuenta'.'Últimos 4', ""),
                                  prodSol, Coalesce(ThisRecord.'[AS] Cuenta'.'Tipo Producto', "—"),
                                  saldoNioSol, Coalesce(ThisRecord.'[AS] Cuenta'.'[CT] Saldo Vencido NIO', 0),
                                  saldoUsdSol, Coalesce(ThisRecord.'[AS] Cuenta'.'[CT] Saldo Vencido USD', 0),
                                  moraSol, Coalesce(ThisRecord.'[AS] Cuenta'.'[CT] Dias Mora', 0),
                                  agenteSol, '[AS] Agente'.'[AG] Nombre'
                              )
                          )
                      )
                  ),
                  Set(varErrSol, Coalesce(FirstError.Message, "sin detalle"))
              );
              ClearCollect(colSolSol, Sort(colSolRawSol, 'Created On', SortOrder.Descending));
              If(CountRows(colSolRawSol) >= 2000,
                  Notify("Hay 2.000 o más solicitudes con estos filtros y se muestran 2.000. Acotá las fechas o filtrá por estado, localizador, CIF o cuenta.", NotificationType.Warning));
              If(CountRows(colCtaSol) > 50,
                  Notify("Más de 50 cuentas coinciden con ese CIF o cuenta: se buscó en las primeras 50. Escribí el CIF completo.", NotificationType.Warning));
              If(!IsBlank(varErrSol),
                  Notify("No se pudo leer la lista: " & TextoError(varErrSol), NotificationType.Error),
                  varAvisoSol,
                  Notify("✓ Lista actualizada", NotificationType.Success, 2500));
              Set(varPanelSol, false);
              Set(varAvisoSol, false);
              Set(varCargandoSol, false)
            Height: =1
            Visible: =false
            Width: =1
