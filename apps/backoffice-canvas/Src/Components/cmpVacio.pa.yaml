ComponentDefinitions:
  cmpVacio:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      Icono:
        PropertyKind: Input
        DisplayName: Icono
        Description: A custom property
        DataType: Text
        Default: ="Text"
      Mensaje:
        PropertyKind: Input
        DisplayName: Mensaje
        Description: A custom property
        DataType: Text
        Default: ="Text"
      Titulo:
        PropertyKind: Input
        DisplayName: Titulo
        Description: A custom property
        DataType: Text
        Default: ="Text"
    Children:
      - conRaizVacioCmp:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            Width: =Parent.Width
          Children:
            - lblIconoVacioCmp:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  PaddingLeft: =0
                  PaddingRight: =0
                  Size: =24
                  Text: =cmpVacio.Icono
                  Width: =Parent.Width
                  Wrap: =false
                  Y: =gblE.Pad
            - lblTituloVacioCmp:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =gblC.ink
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =22
                  PaddingLeft: =0
                  PaddingRight: =0
                  Size: =11
                  Text: =cmpVacio.Titulo
                  Width: =Parent.Width
                  Wrap: =false
                  Y: =gblE.Pad + 44
            - lblMensajeVacioCmp:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =gblC.muted
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =Max(36, Parent.Height - (gblE.Pad + 70) - gblE.Pad)
                  PaddingLeft: =0
                  PaddingRight: =0
                  Size: =9
                  Text: =cmpVacio.Mensaje
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Min(Parent.Width - 2*gblE.Pad, 360)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =gblE.Pad + 70
