ComponentDefinitions:
  cmpNavLateral:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      RutaActiva:
        PropertyKind: Input
        DisplayName: RutaActiva
        Description: A custom property
        DataType: Text
        Default: ="Text"
    Properties:
      Height: =App.Height
      Width: =gblE.AnchoNav
    Children:
      - conRaizNavCmp:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =gblC.teal
            Height: =Parent.Height
            Width: =Parent.Width
          Children:
            - conMarcaNavCmp:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  Height: =gblE.AltoBarra + gblE.Pad
                  Width: =Parent.Width
                Children:
                  - conLogoNavCmp:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =gblC.tealOscuro
                        Height: =40
                        RadiusBottomLeft: =gblE.RadioSm
                        RadiusBottomRight: =gblE.RadioSm
                        RadiusTopLeft: =gblE.RadioSm
                        RadiusTopRight: =gblE.RadioSm
                        Width: =40
                        X: =gblE.Pad
                        Y: =gblE.Pad
                      Children:
                        - lblLogoNavCmp:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =Color.White
                              FocusedBorderColor: =Color.White
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =Parent.Height
                              PaddingLeft: =0
                              PaddingRight: =0
                              Size: =15
                              Text: ="₡"
                              Width: =Parent.Width
                  - lblMarcaNavCmp:
                      Control: Label@2.5.1
                      Properties:
                        Color: =Color.White
                        FocusedBorderColor: =Color.White
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =20
                        PaddingLeft: =0
                        Size: =11
                        Text: ="Cobranza Móvil"
                        Width: =Parent.Width - (gblE.Pad + 40 + gblE.PadSm) - gblE.PadSm
                        Wrap: =false
                        X: =gblE.Pad + 40 + gblE.PadSm
                        Y: =gblE.Pad + 2
                  - lblMarcaSubNavCmp:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255,255,255,0.70)
                        FocusedBorderColor: =Color.White
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =16
                        PaddingLeft: =0
                        Size: =8
                        Text: ="BACKOFFICE"
                        Width: =Parent.Width - (gblE.Pad + 40 + gblE.PadSm) - gblE.PadSm
                        Wrap: =false
                        X: =gblE.Pad + 40 + gblE.PadSm
                        Y: =gblE.Pad + 22
            - galNavCmp:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  AccessibleLabel: ="Menú de navegación"
                  FocusedBorderColor: =Color.White
                  FocusedBorderThickness: =2
                  Height: =Parent.Height - (gblE.AltoBarra + gblE.Pad) - (gblE.AltoFila + gblE.PadSm)
                  Items: |-
                    =// B-06 (verificado por telemetría del player: Filter · galNavCmp.Items · "expected a table"):
                    // leer la fórmula con nombre de la APP (nfNav) desde el componente fallaba en la 1.ª
                    // evaluación al abrir. El catálogo es local al componente: una tabla literal siempre es tabla.
                    // Un rol solo VE su navegación (Roles ∩ gblRol). Todo en memoria, cero delegación.
                    Sort(
                        Filter(
                            Table(
                            {
                                Orden: 1,
                                Icono: "🏠",
                                Titulo: "Inicio",
                                Ruta: "ini",
                                Roles: "Backoffice|Solicitante|Supervisor|Admin"
                            },
                            {
                                Orden: 2,
                                Icono: "📥",
                                Titulo: "Por transcribir",
                                Ruta: "trx",
                                Roles: "Backoffice"
                            },
                            {
                                Orden: 3,
                                Icono: "✅",
                                Titulo: "Transcritas hoy",
                                Ruta: "tsc",
                                Roles: "Backoffice"
                            },
                            {
                                Orden: 4,
                                Icono: "✨",
                                Titulo: "Nueva solicitud",
                                Ruta: "nva",
                                Roles: "Solicitante"
                            },
                            {
                                Orden: 5,
                                Icono: "🗂️",
                                Titulo: "Mis solicitudes",
                                Ruta: "sol",
                                Roles: "Solicitante"
                            },
                            {
                                Orden: 6,
                                Icono: "⚖️",
                                Titulo: "Aprobaciones",
                                Ruta: "aprb",
                                Roles: "Supervisor"
                            },
                            {
                                Orden: 7,
                                Icono: "🔁",
                                Titulo: "Reasignar",
                                Ruta: "rea",
                                Roles: "Supervisor|Admin"
                            },
                            {
                                Orden: 8,
                                Icono: "🏍️",
                                Titulo: "Cartera por localizador",
                                Ruta: "cpl",
                                Roles: "Supervisor"
                            },
                            {
                                Orden: 9,
                                Icono: "📜",
                                Titulo: "Historial de Especiales",
                                Ruta: "hes",
                                Roles: "Supervisor"
                            },
                            {
                                Orden: 10,
                                Icono: "📡",
                                Titulo: "Monitoreo de carga",
                                Ruta: "mon",
                                Roles: "Admin"
                            },
                            {
                                Orden: 11,
                                Icono: "📤",
                                Titulo: "Cargar archivo",
                                Ruta: "car",
                                Roles: "Admin"
                            },
                            {
                                Orden: 12,
                                Icono: "🪪",
                                Titulo: "Alta de cuenta",
                                Ruta: "alt",
                                Roles: "Admin"
                            },
                            {
                                Orden: 13,
                                Icono: "🧹",
                                Titulo: "Reconciliación",
                                Ruta: "rec",
                                Roles: "Admin"
                            },
                            {
                                Orden: 14,
                                Icono: "🔒",
                                Titulo: "Cierres",
                                Ruta: "cie",
                                Roles: "Admin"
                            },
                            {
                                Orden: 15,
                                Icono: "🏍️",
                                Titulo: "Agentes y usuarios",
                                Ruta: "age",
                                Roles: "Admin"
                            },
                            {
                                Orden: 16,
                                Icono: "👥",
                                Titulo: "Datos maestros",
                                Ruta: "mae",
                                Roles: "Admin"
                            }
                        ),
                            CountRows(Filter(Split(Roles, "|"), Value in gblRol)) > 0
                        ),
                        Orden
                    )
                  OnSelect: |-
                    =Switch(ThisItem.Ruta,
                        "ini",  Navigate(scrInicio),
                        "trx",  Navigate(scrTranscripcion),
                        "tsc",  Navigate(scrTranscritas),
                        "nva",  Navigate(scrNuevaSolicitud),
                        "sol",  Navigate(scrMisSolicitudes),
                        "aprb", Navigate(scrAprobaciones),
                        "rea",  Navigate(scrReasignar),
                        "cpl",  Navigate(scrCarteraLocalizador),
                        "hes",  Navigate(scrHistorialEspeciales),
                        "mon",  Navigate(scrMonitoreo),
                        "car",  Navigate(scrCargaArchivo),
                        "alt",  Navigate(scrAltaCuenta),
                        "rec",  Navigate(scrReconciliacion),
                        "cie",  Navigate(scrCierres),
                        "age",  Navigate(scrAgentes),
                        "mae",  Navigate(scrMaestros)
                    );
                    Set(gblNavMovilAbierta, false)
                  ShowScrollbar: =false
                  TemplateFill: =If(ThisItem.Ruta = cmpNavLateral.RutaActiva, gblC.blancoTr, Color.Transparent)
                  TemplatePadding: =0
                  TemplateSize: =44
                  Width: =Parent.Width
                  Y: =gblE.AltoBarra + gblE.Pad
                Children:
                  - lblIconoNavCmp:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        FocusedBorderColor: =Color.White
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =Parent.TemplateHeight
                        PaddingLeft: =0
                        PaddingRight: =0
                        Size: =11
                        Text: =ThisItem.Icono
                        Width: =24
                        Wrap: =false
                        X: =gblE.Pad
                  - lblTituloNavCmp:
                      Control: Label@2.5.1
                      Properties:
                        Color: =Color.White
                        FocusedBorderColor: =Color.White
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =If(ThisItem.Ruta = cmpNavLateral.RutaActiva, FontWeight.Bold, FontWeight.Normal)
                        Height: =Parent.TemplateHeight
                        PaddingLeft: =0
                        Size: =10
                        Text: =ThisItem.Titulo
                        Width: =Parent.TemplateWidth - (gblE.Pad + 24 + gblE.PadSm) - gblE.PadSm
                        Wrap: =false
                        X: =gblE.Pad + 24 + gblE.PadSm
                  - btnFilaNavCmp:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =Color.Transparent
                        Fill: =Color.Transparent
                        FocusedBorderColor: =Color.White
                        FocusedBorderThickness: =2
                        Height: =Parent.TemplateHeight
                        HoverFill: =RGBA(255, 255, 255, 0.08)
                        OnSelect: =Select(Parent)
                        PressedFill: =RGBA(255, 255, 255, 0.14)
                        TabIndex: =0
                        Text: =ThisItem.Titulo
                        Width: =Parent.TemplateWidth
                        X: =0
                        Y: =0
            - conPieNavCmp:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  Height: =gblE.AltoFila + gblE.PadSm
                  Width: =Parent.Width
                  Y: =Parent.Height - (gblE.AltoFila + gblE.PadSm)
                Children:
                  - conSepPieNavCmp:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =gblC.blancoTr
                        Height: =1
                        Width: =Parent.Width - 2*gblE.Pad
                        X: =gblE.Pad
                  - conAvatarNavCmp:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =gblC.blancoTr
                        Height: =36
                        RadiusBottomLeft: =18
                        RadiusBottomRight: =18
                        RadiusTopLeft: =18
                        RadiusTopRight: =18
                        Width: =36
                        X: =gblE.Pad
                        Y: =gblE.PadSm + 4
                      Children:
                        - lblAvatarNavCmp:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =Color.White
                              FocusedBorderColor: =Color.White
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =Parent.Height
                              PaddingLeft: =0
                              PaddingRight: =0
                              Size: =10
                              Text: =Concat(FirstN(Split(User().FullName, " "), 2), Left(Value, 1))
                              Width: =Parent.Width
                  - lblNombreNavCmp:
                      Control: Label@2.5.1
                      Properties:
                        Color: =Color.White
                        FocusedBorderColor: =Color.White
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =18
                        PaddingLeft: =0
                        Size: =9
                        Text: =User().FullName
                        Width: =Parent.Width - (gblE.Pad + 36 + gblE.PadSm) - gblE.PadSm
                        Wrap: =false
                        X: =gblE.Pad + 36 + gblE.PadSm
                        Y: =gblE.PadSm + 5
                  - lblRolNavCmp:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255,255,255,0.70)
                        FocusedBorderColor: =Color.White
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =16
                        PaddingLeft: =0
                        Size: =8
                        Text: =If(IsBlank(gblRol), "Sin acceso", Substitute(gblRol, "|", " · "))
                        Width: =Parent.Width - (gblE.Pad + 36 + gblE.PadSm) - gblE.PadSm
                        Wrap: =false
                        X: =gblE.Pad + 36 + gblE.PadSm
                        Y: =gblE.PadSm + 23
