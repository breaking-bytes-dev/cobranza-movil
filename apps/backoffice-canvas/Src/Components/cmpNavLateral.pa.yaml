ComponentDefinitions:
  cmpNavLateral:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      RutaActiva:
        PropertyKind: Input
        DisplayName: RutaActiva
        Description: A custom property
        DataType: Text
        Default: ="Text"
    Properties:
      Height: =App.Height
      Width: =gblE.AnchoNav
    Children:
      - Container1:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            X: =40
            Y: =40
      - Gallery1:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            X: =60
            Y: =60
          Children:
            - Label1:
                Control: Label@2.5.1
                Properties:
                  OnSelect: =Select(Parent)
                  Text: =ThisItem.SampleHeading
                  X: =40
                  Y: =40
            - Icon1:
                Control: Classic/Icon@2.5.0
                Properties:
                  Icon: =Icon.Printing3D
                  X: =40
                  Y: =40
