ComponentDefinitions:
  cmpNavLateral:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      RutaActiva:
        PropertyKind: Input
        DisplayName: RutaActiva
        Description: A custom property
        DataType: Text
        Default: ="Text"
    Properties:
      Height: =App.Height
      Width: =gblE.AnchoNav
    Children:
      - conRaizNavCmp:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =gblC.teal
            Height: =Parent.Height
            Width: =Parent.Width
          Children:
            - conMarcaNavCmp:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  Height: =gblE.AltoBarra + gblE.Pad
                  Width: =Parent.Width
                Children:
                  - conLogoNavCmp:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =gblC.tealOscuro
                        Height: =40
                        RadiusBottomLeft: =gblE.RadioSm
                        RadiusBottomRight: =gblE.RadioSm
                        RadiusTopLeft: =gblE.RadioSm
                        RadiusTopRight: =gblE.RadioSm
                        Width: =40
                        X: =gblE.Pad
                        Y: =gblE.Pad
                      Children:
                        - lblLogoNavCmp:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =Color.White
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =Parent.Height
                              PaddingLeft: =0
                              PaddingRight: =0
                              Size: =15
                              Text: ="₡"
                              Width: =Parent.Width
                  - lblMarcaNavCmp:
                      Control: Label@2.5.1
                      Properties:
                        Color: =Color.White
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =20
                        PaddingLeft: =0
                        Size: =11
                        Text: ="Cobranza Móvil"
                        Width: =Parent.Width - (gblE.Pad + 40 + gblE.PadSm) - gblE.PadSm
                        Wrap: =false
                        X: =gblE.Pad + 40 + gblE.PadSm
                        Y: =gblE.Pad + 2
                  - lblMarcaSubNavCmp:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255,255,255,0.70)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =16
                        PaddingLeft: =0
                        Size: =8
                        Text: ="BACKOFFICE"
                        Width: =Parent.Width - (gblE.Pad + 40 + gblE.PadSm) - gblE.PadSm
                        Wrap: =false
                        X: =gblE.Pad + 40 + gblE.PadSm
                        Y: =gblE.Pad + 22
            - galNavCmp:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  Height: =Parent.Height - (gblE.AltoBarra + gblE.Pad) - (gblE.AltoFila + gblE.PadSm)
                  Items: |-
                    =SortByColumns(
                        Filter(colNav, CountRows(Filter(Split(Roles, "|"), Value in gblRol)) > 0),
                        "Orden"
                    )
                  OnSelect: |-
                    =Switch(ThisItem.Ruta,
                        "ini",  Navigate(scrInicio),
                        "trx",  Navigate(scrTranscripcion),
                        "tsc",  Navigate(scrTranscritas),
                        "nva",  Navigate(scrNuevaSolicitud),
                        "sol",  Navigate(scrMisSolicitudes),
                        "aprb", Navigate(scrAprobaciones),
                        "mon",  Navigate(scrMonitoreo),
                        "rec",  Navigate(scrReconciliacion),
                        "cie",  Navigate(scrCierres),
                        "age",  Navigate(scrAgentes),
                        "mae",  Navigate(scrMaestros)
                    );
                    Set(gblNavMovilAbierta, false)
                  ShowScrollbar: =false
                  TemplateFill: =If(ThisItem.Ruta = cmpNavLateral.RutaActiva, gblC.blancoTr, Color.Transparent)
                  TemplatePadding: =0
                  TemplateSize: =44
                  Width: =Parent.Width
                  Y: =gblE.AltoBarra + gblE.Pad
                Children:
                  - lblIconoNavCmp:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Font: =Font.'Segoe UI'
                        Height: =Parent.TemplateHeight
                        OnSelect: =Select(Parent)
                        PaddingLeft: =0
                        PaddingRight: =0
                        Size: =11
                        Text: =ThisItem.Icono
                        Width: =24
                        Wrap: =false
                        X: =gblE.Pad
                  - lblTituloNavCmp:
                      Control: Label@2.5.1
                      Properties:
                        Color: =Color.White
                        Font: =Font.'Segoe UI'
                        FontWeight: =If(ThisItem.Ruta = cmpNavLateral.RutaActiva, FontWeight.Bold, FontWeight.Normal)
                        Height: =Parent.TemplateHeight
                        OnSelect: =Select(Parent)
                        PaddingLeft: =0
                        Size: =10
                        Text: =ThisItem.Titulo
                        Width: =Parent.TemplateWidth - (gblE.Pad + 24 + gblE.PadSm) - gblE.PadSm
                        Wrap: =false
                        X: =gblE.Pad + 24 + gblE.PadSm
            - conPieNavCmp:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  Height: =gblE.AltoFila + gblE.PadSm
                  Width: =Parent.Width
                  Y: =Parent.Height - (gblE.AltoFila + gblE.PadSm)
                Children:
                  - conSepPieNavCmp:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =gblC.blancoTr
                        Height: =1
                        Width: =Parent.Width - 2*gblE.Pad
                        X: =gblE.Pad
                  - conAvatarNavCmp:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =gblC.blancoTr
                        Height: =36
                        RadiusBottomLeft: =18
                        RadiusBottomRight: =18
                        RadiusTopLeft: =18
                        RadiusTopRight: =18
                        Width: =36
                        X: =gblE.Pad
                        Y: =gblE.PadSm + 4
                      Children:
                        - lblAvatarNavCmp:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =Color.White
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =Parent.Height
                              PaddingLeft: =0
                              PaddingRight: =0
                              Size: =10
                              Text: =Concat(FirstN(Split(User().FullName, " "), 2), Left(Value, 1))
                              Width: =Parent.Width
                  - lblNombreNavCmp:
                      Control: Label@2.5.1
                      Properties:
                        Color: =Color.White
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =18
                        PaddingLeft: =0
                        Size: =9
                        Text: =User().FullName
                        Width: =Parent.Width - (gblE.Pad + 36 + gblE.PadSm) - gblE.PadSm
                        Wrap: =false
                        X: =gblE.Pad + 36 + gblE.PadSm
                        Y: =gblE.PadSm + 5
                  - lblRolNavCmp:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(255,255,255,0.70)
                        Font: =Font.'Segoe UI'
                        Height: =16
                        PaddingLeft: =0
                        Size: =8
                        Text: =If(IsBlank(gblRol), "Sin acceso", Substitute(gblRol, "|", " · "))
                        Width: =Parent.Width - (gblE.Pad + 36 + gblE.PadSm) - gblE.PadSm
                        Wrap: =false
                        X: =gblE.Pad + 36 + gblE.PadSm
                        Y: =gblE.PadSm + 23
