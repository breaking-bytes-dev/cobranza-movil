ComponentDefinitions:
  cmpEncabezado:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      Subtitulo:
        PropertyKind: Input
        DisplayName: Subtitulo
        Description: A custom property
        DataType: Text
        Default: ="Text"
      Titulo:
        PropertyKind: Input
        DisplayName: Titulo
        Description: A custom property
        DataType: Text
        Default: ="Text"
    Children:
      - Container2:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            X: =40
            Y: =40
      - Label2:
          Control: Label@2.5.1
          Properties:
            X: =60
            Y: =60
