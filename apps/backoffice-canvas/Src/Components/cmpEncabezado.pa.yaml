ComponentDefinitions:
  cmpEncabezado:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      Subtitulo:
        PropertyKind: Input
        DisplayName: Subtitulo
        Description: A custom property
        DataType: Text
        Default: ="Text"
      Titulo:
        PropertyKind: Input
        DisplayName: Titulo
        Description: A custom property
        DataType: Text
        Default: ="Text"
    Children:
      - conRaizEncCmp:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            Width: =Parent.Width
          Children:
            - conBarraMovilEncCmp:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =gblC.teal
                  Height: =gblE.AltoBarra
                  Visible: =nfMovil
                  Width: =Parent.Width
                Children:
                  - icoMenuEncCmp:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: ="Abrir menú"
                        Color: =Color.White
                        FocusedBorderColor: =Color.White
                        FocusedBorderThickness: =2
                        Height: =24
                        Icon: =Icon.Hamburger
                        OnSelect: =Set(gblNavMovilAbierta, true)
                        TabIndex: =0
                        Width: =24
                        X: =gblE.Pad
                        Y: =(gblE.AltoBarra - 24) / 2
                  - lblTituloMovilEncCmp:
                      Control: Label@2.5.1
                      Properties:
                        Color: =Color.White
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.Height
                        PaddingLeft: =0
                        Size: =11
                        Text: =cmpEncabezado.Titulo
                        Width: =Parent.Width - (gblE.Pad + 24 + gblE.PadSm) - (gblE.Pad + 32 + gblE.PadSm)
                        Wrap: =false
                        X: =gblE.Pad + 24 + gblE.PadSm
                  - conAvatarEncCmp:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =gblC.blancoTr
                        Height: =32
                        RadiusBottomLeft: =16
                        RadiusBottomRight: =16
                        RadiusTopLeft: =16
                        RadiusTopRight: =16
                        Width: =32
                        X: =Parent.Width - gblE.Pad - 32
                        Y: =(gblE.AltoBarra - 32) / 2
                      Children:
                        - lblAvatarEncCmp:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =Color.White
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =Parent.Height
                              PaddingLeft: =0
                              PaddingRight: =0
                              Size: =9
                              Text: =Concat(FirstN(Split(User().FullName, " "), 2), Left(Value, 1))
                              Width: =Parent.Width
            - lblTituloEncCmp:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.ink
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =30
                  PaddingLeft: =0
                  Size: =18
                  Text: =cmpEncabezado.Titulo
                  Width: =Parent.Width - 2*gblE.Pad
                  Wrap: =false
                  X: =gblE.Pad
                  Y: =If(nfMovil, gblE.AltoBarra + gblE.PadSm, gblE.Pad)
            - lblSubEncCmp:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.muted
                  Font: =Font.'Segoe UI'
                  Height: =18
                  PaddingLeft: =0
                  Size: =9
                  Text: =cmpEncabezado.Subtitulo
                  Visible: =!IsBlank(Self.Text)
                  Width: =Parent.Width - 2*gblE.Pad
                  Wrap: =false
                  X: =gblE.Pad
                  Y: =If(nfMovil, gblE.AltoBarra + gblE.PadSm, gblE.Pad) + 30
