Screens:
  scrAgentes:
    Properties:
      Fill: =gblC.pantalla
      OnVisible: |-
        =If(!("Admin" in gblRol), Navigate(scrInicio));
        // Tabla chica y organizacional: la cota no delegable de 2000 filas es trivial acá.
        // Sort sobre columna escalar delega — una sola llamada a Dataverse por visita.
        ClearCollect(colAgentesAge, Sort('CM | TBL | Agentes', '[AG] Nombre'))
    Children:
      - cmpEncabezadoAge:
          Control: CanvasComponent
          ComponentName: cmpEncabezado
          Properties:
            Height: =If(nfMovil, gblE.AltoBarra + 84, 84)
            Subtitulo: ="Ligá cada localizador a su usuario. Sin usuario = no entra a la app del celular."
            Titulo: ="Agentes y usuarios"
            Width: =Parent.Width - Self.X
            X: =If(nfMovil, 0, gblE.AnchoNav)
      - conContenidoAge:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height - Self.Y - gblE.Pad
            Width: =Min(gblE.AnchoMax, Parent.Width - If(nfMovil, 0, gblE.AnchoNav) - 2*gblE.Pad)
            X: |-
              =If(nfMovil, 0, gblE.AnchoNav)
                  + Max(gblE.Pad, (Parent.Width - If(nfMovil, 0, gblE.AnchoNav) - gblE.AnchoMax) / 2)
            Y: =cmpEncabezadoAge.Y + cmpEncabezadoAge.Height
          Children:
            - btnActualizarAge:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =gblC.borde
                  BorderThickness: =1
                  Color: =gblC.ink2
                  Fill: =gblC.card
                  Font: =Font.'Segoe UI'
                  Height: =gblE.AltoBoton
                  HoverFill: =ColorFade(gblC.card, 10%)
                  OnSelect: |-
                    =ClearCollect(colAgentesAge, Sort('CM | TBL | Agentes', '[AG] Nombre'));
                    Notify("Lista actualizada", NotificationType.Success, 2000)
                  Size: =10
                  Text: ="↻ Actualizar"
                  Width: =150
                  X: =Parent.Width - Self.Width
            - conAlertaAge:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =gblC.pendBg
                  Height: =96
                  RadiusBottomLeft: =gblE.Radio
                  RadiusBottomRight: =gblE.Radio
                  RadiusTopLeft: =gblE.Radio
                  RadiusTopRight: =gblE.Radio
                  Visible: =CountRows(Filter(colAgentesAge, '[AG] Activo' && IsBlank('[AG] Usuario'))) > 0
                  Width: =Parent.Width
                  Y: =btnActualizarAge.Y + btnActualizarAge.Height + gblE.PadSm
                Children:
                  - recBordeAlertaAge:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =gblC.pendInk
                        Height: =Parent.Height
                        Width: =4
                  - lblAlertaTituloAge:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.pendInk
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =22
                        PaddingLeft: =0
                        Size: =11
                        Text: |-
                          ="⚠ " &
                              CountRows(Filter(colAgentesAge,
                                  '[AG] Activo' && IsBlank('[AG] Usuario'))) &
                              " agente(s) activo(s) sin usuario vinculado"
                        Width: =Parent.Width - 2*gblE.Pad
                        Wrap: =false
                        X: =gblE.Pad
                        Y: =gblE.PadSm
                  - lblAlertaDetalleAge:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.pendInk
                        Font: =Font.'Segoe UI'
                        Height: =Parent.Height - Self.Y - gblE.PadSm
                        PaddingLeft: =0
                        Size: =9
                        Text: |-
                          =Concat(
                              Filter(colAgentesAge, '[AG] Activo' && IsBlank('[AG] Usuario')),
                              '[AG] Nombre', ", ") &
                              ". Esta lista debe estar VACÍA antes de operar: sin usuario no entran a la app del celular y Comp-14 no aísla sus asignaciones."
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Parent.Width - 2*gblE.Pad
                        X: =gblE.Pad
                        Y: =lblAlertaTituloAge.Y + lblAlertaTituloAge.Height + 4
            - conListaAge:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =gblC.borde
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =gblC.card
                  Height: =Parent.Height - Self.Y - 28 - gblE.PadSm
                  RadiusBottomLeft: =gblE.Radio
                  RadiusBottomRight: =gblE.Radio
                  RadiusTopLeft: =gblE.Radio
                  RadiusTopRight: =gblE.Radio
                  Width: =Parent.Width
                  Y: |-
                    =If(conAlertaAge.Visible,
                        conAlertaAge.Y + conAlertaAge.Height + gblE.Pad,
                        conAlertaAge.Y)
                Children:
                  - galAgentesAge:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        Height: =Parent.Height - 2*gblE.PadSm
                        Items: =colAgentesAge
                        ShowScrollbar: =false
                        TemplateFill: =gblC.card
                        TemplatePadding: =0
                        TemplateSize: =If(nfMovil, 148, 72)
                        Width: =Parent.Width - 2*gblE.PadSm
                        X: =gblE.PadSm
                        Y: =gblE.PadSm
                      Children:
                        - lblNombreAge:
                            Control: Label@2.5.1
                            Properties:
                              Color: =gblC.ink
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =22
                              PaddingLeft: =0
                              Size: =11
                              Text: =ThisItem.'[AG] Nombre'
                              Width: |-
                                =If(nfMovil,
                                    Parent.TemplateWidth - 2*gblE.Pad,
                                    Parent.TemplateWidth*32% - gblE.Pad)
                              Wrap: =false
                              X: =gblE.Pad
                              Y: =If(nfMovil, 8, 12)
                        - lblEmailAge:
                            Control: Label@2.5.1
                            Properties:
                              Color: =gblC.muted
                              Font: =Font.'Segoe UI'
                              Height: =18
                              PaddingLeft: =0
                              Size: =9
                              Text: |-
                                =If(IsBlank(ThisItem.'Email Usuario'),
                                    "sin correo",
                                    ThisItem.'Email Usuario')
                              Width: =lblNombreAge.Width
                              Wrap: =false
                              X: =gblE.Pad
                              Y: =lblNombreAge.Y + lblNombreAge.Height
                        - cmbUsuarioAge:
                            Control: Classic/ComboBox@2.4.0
                            Properties:
                              BorderColor: =gblC.borde
                              DefaultSelectedItems: |-
                                =// Si Studio subraya Table(<registro lookup>), la forma equivalente
                                // documentada es: Filter(Users, 'Primary Email' = ThisItem.'Email Usuario')
                                If(!IsBlank(ThisItem.'[AG] Usuario'), Table(ThisItem.'[AG] Usuario'))
                              DisplayFields: =["fullname", "internalemailaddress"]
                              Fill: =gblC.card
                              Font: =Font.'Segoe UI'
                              Height: =gblE.AltoInput
                              InputTextPlaceholder: ="— Sin usuario —"
                              Items: =Users
                              OnChange: |-
                                =// Se escriben las DOS columnas SIEMPRE juntas: '[AG] Usuario' (lookup,
                                // lo usa Comp-14 para el owner) y 'Email Usuario' (texto en minúsculas,
                                // lo usa la canvas del localizador para el login). Patchear una sola deja
                                // al agente inconsistente. Si tocás esta fórmula, mantené las dos.
                                If(!IsBlank(Self.Selected),
                                    Patch('CM | TBL | Agentes',
                                        LookUp('CM | TBL | Agentes', '[AG] Nombre' = ThisItem.'[AG] Nombre'),
                                        {
                                            '[AG] Usuario': Self.Selected,
                                            'Email Usuario': Lower(Self.Selected.'Primary Email')
                                        }
                                    );
                                    Notify("✓ " & ThisItem.'[AG] Nombre' & " vinculado", NotificationType.Success, 2500),

                                    Patch('CM | TBL | Agentes',
                                        LookUp('CM | TBL | Agentes', '[AG] Nombre' = ThisItem.'[AG] Nombre'),
                                        {
                                            '[AG] Usuario': Blank(),
                                            'Email Usuario': Blank()
                                        }
                                    );
                                    Notify("Vínculo quitado", NotificationType.Warning)
                                );
                                ClearCollect(colAgentesAge, Sort('CM | TBL | Agentes', '[AG] Nombre'))
                              SearchFields: =["fullname", "internalemailaddress"]
                              SelectMultiple: =false
                              Size: =10
                              Width: |-
                                =If(nfMovil,
                                    Parent.TemplateWidth - 2*gblE.Pad,
                                    Parent.TemplateWidth*30%)
                              X: =If(nfMovil, gblE.Pad, Parent.TemplateWidth*32%)
                              Y: =If(nfMovil, 54, (Parent.TemplateSize - gblE.AltoInput)/2)
                        - chpVinculoAge:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderThickness: =0
                              Color: =If(IsBlank(ThisItem.'[AG] Usuario'), gblC.redInk, gblC.okInk)
                              DisplayMode: =DisplayMode.View
                              Fill: =If(IsBlank(ThisItem.'[AG] Usuario'), gblC.redBg, gblC.okBg)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =26
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =8
                              Text: =If(IsBlank(ThisItem.'[AG] Usuario'), "Sin usuario", "✓ Vinculado")
                              Width: =14 + 7*Len(Self.Text)
                              X: =If(nfMovil, gblE.Pad, Parent.TemplateWidth*64% + gblE.PadSm)
                              Y: =If(nfMovil, 106, (Parent.TemplateSize - Self.Height)/2)
                        - chpEstadoAge:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderThickness: =0
                              Color: =If(ThisItem.'[AG] Activo', gblC.ink2, gblC.redInk)
                              DisplayMode: =DisplayMode.View
                              Fill: =If(ThisItem.'[AG] Activo', gblC.hairline, gblC.redBg)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =26
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =8
                              Text: =If(ThisItem.'[AG] Activo', "Activo", "Inactivo")
                              Width: =14 + 7*Len(Self.Text)
                              X: =chpVinculoAge.X + chpVinculoAge.Width + gblE.PadSm
                              Y: =chpVinculoAge.Y
                        - btnToggleAge:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =gblC.borde
                              BorderThickness: =If(ThisItem.'[AG] Activo', 1, 0)
                              Color: =If(ThisItem.'[AG] Activo', gblC.ink2, gblC.teal)
                              Fill: =If(ThisItem.'[AG] Activo', gblC.card, gblC.tealSuave)
                              Font: =Font.'Segoe UI'
                              Height: =34
                              OnSelect: |-
                                =// El If del Notify lee el valor VIEJO de ThisItem (el Patch ya lo invirtió
                                // en Dataverse pero la colección aún no se refrescó) — "activo → desactivado"
                                // queda correcto tal cual.
                                Patch('CM | TBL | Agentes',
                                    LookUp('CM | TBL | Agentes', '[AG] Nombre' = ThisItem.'[AG] Nombre'),
                                    { '[AG] Activo': !ThisItem.'[AG] Activo' }
                                );
                                Notify(ThisItem.'[AG] Nombre' & If(ThisItem.'[AG] Activo', " desactivado", " activado"),
                                    NotificationType.Success, 2500);
                                ClearCollect(colAgentesAge, Sort('CM | TBL | Agentes', '[AG] Nombre'))
                              Size: =10
                              Text: =If(ThisItem.'[AG] Activo', "Desactivar", "Activar")
                              Width: =110
                              X: =Parent.TemplateWidth - Self.Width - gblE.Pad
                              Y: =If(nfMovil, 102, (Parent.TemplateSize - Self.Height)/2)
                        - recSepAge:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =gblC.hairline
                              Height: =1
                              Width: =Parent.TemplateWidth
                              Y: =Parent.TemplateHeight - 1
                  - cmpVacioAge:
                      Control: CanvasComponent
                      ComponentName: cmpVacio
                      Properties:
                        Height: =200
                        Icono: |-
                          ="🏍️"
                        Mensaje: ="El import diario todavía no creó localizadores."
                        Titulo: ="Sin agentes"
                        Visible: =CountRows(colAgentesAge) = 0
                        Width: =Min(420, Parent.Width - 2*gblE.Pad)
                        X: =(Parent.Width - Self.Width) / 2
                        Y: =(Parent.Height - Self.Height) / 2
            - lblAdvertenciaAge:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.muted
                  Font: =Font.'Segoe UI'
                  Height: =28
                  PaddingLeft: =0
                  Size: =9
                  Text: ="Desactivar un agente NO cierra sus asignaciones — eso se hace en Cierres/Reconciliación."
                  Width: =Parent.Width
                  Y: =conListaAge.Y + conListaAge.Height + gblE.PadSm
      - cmpNavAge:
          Control: CanvasComponent
          ComponentName: cmpNavLateral
          Properties:
            Height: =Parent.Height
            RutaActiva: ="age"
            Visible: =!nfMovil || gblNavMovilAbierta
            Width: =gblE.AnchoNav
