                  FocusedBorderColor: =gblC.ink
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =gblE.AltoBoton
                  HoverFill: =ColorFade(gblC.teal, 10%)
                  OnSelect: |-
                    =// Alta manual de un localizador (solo Admin). Nombre requerido y recortado.
                    // 1) Duplicado: LookUp delegable por igualdad de texto (Dataverse compara sin distinguir
                    //    mayúsculas, igual que la alt key del nombre, que además lo rechaza en el servidor).
                    // 2) Patch con Defaults: Activo = true y el usuario elegido (o Blank). 'Email Usuario' NO se
                    //    escribe: lo deriva el plugin EmailDesdeUsuario desde el usuario vinculado.
                    // IfError (B-03): si el Patch falla, detalle y el panel queda abierto (sin éxito).
                    If(
                        Len(Trim(txtNombreNueAge.Text)) = 0,
                        Notify("Escribí el nombre del agente.", NotificationType.Warning),
                        !IsBlank(LookUp('CM | TBL | Agentes', '[AG] Nombre' = Trim(txtNombreNueAge.Text))),
