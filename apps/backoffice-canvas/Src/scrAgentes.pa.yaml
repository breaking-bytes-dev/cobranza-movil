                        IfError(
                            Patch('CM | TBL | Agentes', Defaults('CM | TBL | Agentes'),
                                {
                                    '[AG] Nombre': Trim(txtNombreNueAge.Text),
                                    '[AG] Activo': true,
                                    '[AG] Usuario': varUsrNueAge
                                }
                            ),
                            Notify("No se pudo crear el agente " & Trim(txtNombreNueAge.Text) & ": " & FirstError.Message,
                                NotificationType.Error),
                            Notify("✓ Agente " & Trim(txtNombreNueAge.Text) & " creado" &
                                If(IsBlank(varUsrNueAge), " sin usuario", " y vinculado a " & Lower(varUsrNueAge.'Primary Email')),
                                NotificationType.Success, 2500);
                            Set(varNuevoAge, false);
                            Set(varUsrNueAge, Blank());
                            Reset(txtNombreNueAge);
                            Reset(txtBuscarUsrNueAge);
                            ClearCollect(colAgentesAge, Sort('CM | TBL | Agentes', '[AG] Nombre'))
                        )
