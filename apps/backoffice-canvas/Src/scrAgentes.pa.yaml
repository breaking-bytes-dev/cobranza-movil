                  AccessibleLabel: ="Usuarios que coinciden con la búsqueda"
                  BorderColor: =gblC.borde
                  BorderThickness: =1
                  Fill: =gblC.card
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Height: |-
                    =// Alto acotado: hasta 3 filas (mín. 1 para el aviso "sin coincidencias").
                    Min(Max(Self.AllItemsCount, 1), 3) * Self.TemplateHeight
                  Items: |-
                    =// Mismo patrón que galUsrAge (B-04/B-19): Filter directo sobre Users, delegable
                    // (StartsWith en ambas columnas); con menos de 2 caracteres, centinela "§§".
                    // SIN With (cortaba la delegación — ver scrNuevaSolicitud.galCtaNva).
                    Filter(Users,
                        StartsWith('Full Name', If(Len(Trim(txtBuscarUsrNueAge.Text)) < 2, "§§", Trim(txtBuscarUsrNueAge.Text)))
                        || StartsWith('Primary Email', If(Len(Trim(txtBuscarUsrNueAge.Text)) < 2, "§§", Trim(txtBuscarUsrNueAge.Text))))
                  OnSelect: |-
                    =// Solo ELIGE el usuario (no escribe nada). Sin correo principal no hay login en el
