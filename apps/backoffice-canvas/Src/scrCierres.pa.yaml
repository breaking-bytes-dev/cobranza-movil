Screens:
  scrCierres:
    Properties:
      Fill: =gblC.pantalla
      OnVisible: |-
        =// Motivos de cierre desde 'CM | TBL | Opciones de lista' (los edita el Admin en «Listas»), activos y en orden.
        // Si la lectura falla o una lista está vacía, se usan los de respaldo.
        ClearCollect(colMotIncCie,
            IfError(ForAll(Sort(Filter('CM | TBL | Opciones de lista',
                '[OL] Lista' = '[OL] Lista (CM | TBL | Opciones de lista)'.'Motivo de cierre Incobrable' && '[OL] Activa' = true), '[OL] Orden'),
                {Value: ThisRecord.'[OL] Texto'}), Blank()));
        If(CountRows(colMotIncCie) = 0, ClearCollect(colMotIncCie, ["Recuperada", "Baja / castigada", "Fuera de cartera"]));
        ClearCollect(colMotEspCie,
            IfError(ForAll(Sort(Filter('CM | TBL | Opciones de lista',
                '[OL] Lista' = '[OL] Lista (CM | TBL | Opciones de lista)'.'Motivo de cierre Especial' && '[OL] Activa' = true), '[OL] Orden'),
                {Value: ThisRecord.'[OL] Texto'}), Blank()));
        If(CountRows(colMotEspCie) = 0, ClearCollect(colMotEspCie, ["Gestión completada", "Ya no aplica", "Solicitud errónea"]));
        // Asignaciones activas Incobrable/Especial + joins calculados una vez.
        // Solo las Especiales APROBADAS; una pendiente se resuelve en Aprobaciones (aprobar o rechazar).
        // Datos de la cuenta navegando el lookup '[AS] Cuenta' (lo resuelve el servidor, sin
        // catálogo de cuentas truncable al límite de filas).
        // Filtro DELEGABLE: OR de igualdades de choice por valor + booleano.
        Clear(colCierresCie);
        // ESCALA: por tramos (TramoCartera); el tramo va CONSTANTE en cada consulta para que delegue (límite de 2000 filas).
        ForAll(Sequence(20, 0) As T, Collect(colCierresCie,
            AddColumns(
                Filter('CM | TBL | Asignacions',
                    (('[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Incobrable
                      || ('[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Especial
                          && '[AS] Estado de aprobacion' = 'Choice | CM | Estado aprobacion especial'.Aprobado))
                    && '[AS] Estado' = true)
                    && '[AS] Tramo' = T.Value),
                clienteCie, Upper(Coalesce(
                    ThisRecord.'[AS] Cuenta'.'Nombre Cliente', "—")),
                ult4Cie, Coalesce(
                    ThisRecord.'[AS] Cuenta'.'Últimos 4', ""),
                cifCie, Coalesce(ThisRecord.'[AS] Cuenta'.'CIF Cliente', ""),
                locCie, Coalesce(ThisRecord.'[AS] Agente'.'[AG] Nombre', "—"),
                diasCie, Coalesce(
                    ThisRecord.'[AS] Cuenta'.'[CT] Dias Mora', 0),
                nioCie, Coalesce(
                    ThisRecord.'[AS] Cuenta'.'[CT] Saldo Vencido NIO', 0),
                usdCie, Coalesce(
                    ThisRecord.'[AS] Cuenta'.'[CT] Saldo Vencido USD', 0),
                montoCie, If('[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Especial
                        && (Coalesce('Retiro NIO', 0) > 0 || Coalesce('Retiro USD', 0) > 0),
                    Moneda('Retiro NIO', 'Retiro USD'),
                    Moneda(
                        Coalesce(ThisRecord.'[AS] Cuenta'.'[CT] Saldo Vencido NIO', 0),
                        Coalesce(ThisRecord.'[AS] Cuenta'.'[CT] Saldo Vencido USD', 0)))
            )
        ));
        Collect(colCierresCie,
            AddColumns(
                Filter('CM | TBL | Asignacions',
                    (('[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Incobrable
                      || ('[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Especial
                          && '[AS] Estado de aprobacion' = 'Choice | CM | Estado aprobacion especial'.Aprobado))
                    && '[AS] Estado' = true)
                    && '[AS] Tramo' = Blank()),
                clienteCie, Upper(Coalesce(
                    ThisRecord.'[AS] Cuenta'.'Nombre Cliente', "—")),
                ult4Cie, Coalesce(
                    ThisRecord.'[AS] Cuenta'.'Últimos 4', ""),
                cifCie, Coalesce(ThisRecord.'[AS] Cuenta'.'CIF Cliente', ""),
                locCie, Coalesce(ThisRecord.'[AS] Agente'.'[AG] Nombre', "—"),
                diasCie, Coalesce(
                    ThisRecord.'[AS] Cuenta'.'[CT] Dias Mora', 0),
                nioCie, Coalesce(
                    ThisRecord.'[AS] Cuenta'.'[CT] Saldo Vencido NIO', 0),
                usdCie, Coalesce(
                    ThisRecord.'[AS] Cuenta'.'[CT] Saldo Vencido USD', 0),
                montoCie, If('[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Especial
                        && (Coalesce('Retiro NIO', 0) > 0 || Coalesce('Retiro USD', 0) > 0),
                    Moneda('Retiro NIO', 'Retiro USD'),
                    Moneda(
                        Coalesce(ThisRecord.'[AS] Cuenta'.'[CT] Saldo Vencido NIO', 0),
                        Coalesce(ThisRecord.'[AS] Cuenta'.'[CT] Saldo Vencido USD', 0)))
            )
        );
        // Estado de pantalla (resetea pestaña y panel: las variables persisten entre visitas).
        Set(varTabCie, "incob");
        Set(varBuscaCie, "");
        Reset(txtBuscaCie);
        Set(varSelCie, Blank());
        Set(varPanelCie, false)
    Children:
      - cmpEncabezadoCie:
          Control: CanvasComponent
          ComponentName: cmpEncabezado
          Properties:
            Height: =If(nfMovil, gblE.AltoBarra + 84, 84)
            Subtitulo: ="Incobrables y Especiales se cierran a mano, con motivo. Nunca el localizador."
            Titulo: ="Cierres"
            Width: =Parent.Width - Self.X
            X: =If(nfMovil, 0, gblE.AnchoNav)
      - conContenidoCie:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height - Self.Y
            Width: =Min(gblE.AnchoMax, Parent.Width - If(nfMovil, 0, gblE.AnchoNav) - 2*gblE.Pad)
            X: |-
              =If(nfMovil, 0, gblE.AnchoNav)
                  + Max(gblE.Pad, (Parent.Width - If(nfMovil, 0, gblE.AnchoNav) - gblE.AnchoMax) / 2)
            Y: =cmpEncabezadoCie.Y + cmpEncabezadoCie.Height
          Children:
            - conTabsCie:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =gblC.hairline
                  Height: =44
                  RadiusBottomLeft: =11
                  RadiusBottomRight: =11
                  RadiusTopLeft: =11
                  RadiusTopRight: =11
                  Width: =356
                  X: =gblE.Pad
                  Y: =gblE.PadSm
                Children:
                  - btnTabIncobCie:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =If(varTabCie = "incob", gblC.teal, gblC.muted)
                        Fill: =If(varTabCie = "incob", gblC.card, Color.Transparent)
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =36
                        HoverFill: =Self.Fill
                        OnSelect: =Set(varTabCie, "incob")
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =9
                        Text: |-
                          ="🟠 Incobrables (" &
                              CountIf('CM | TBL | Asignacions',
                                  '[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Incobrable
                                  && '[AS] Estado' = true) & ")"
                        Width: =170
                        X: =4
                        Y: =4
                  - btnTabEspCie:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =If(varTabCie = "esp", gblC.teal, gblC.muted)
                        Fill: =If(varTabCie = "esp", gblC.card, Color.Transparent)
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =36
                        HoverFill: =Self.Fill
                        OnSelect: =Set(varTabCie, "esp")
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =9
                        Text: |-
                          ="🟣 Especiales (" &
                              CountIf('CM | TBL | Asignacions',
                                  '[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Especial
                                  && '[AS] Estado de aprobacion' = 'Choice | CM | Estado aprobacion especial'.Aprobado  // mismo filtro que la lista
                                  && '[AS] Estado' = true) & ")"
                        Width: =170
                        X: =178
                        Y: =4
            - btnActualizarCie:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =gblC.borde
                  BorderThickness: =1
                  Color: =gblC.ink2
                  Fill: =gblC.card
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =44
                  OnSelect: |-
                    =// Re-colecta y cierra el panel (mismo bloque del OnVisible)
                    Clear(colCierresCie);
                    // ESCALA: por tramos (TramoCartera); el tramo va CONSTANTE en cada consulta para que delegue (límite de 2000 filas).
                    ForAll(Sequence(20, 0) As T, Collect(colCierresCie,
                        AddColumns(
                            Filter('CM | TBL | Asignacions',
                                (('[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Incobrable
                                  || ('[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Especial
                                      && '[AS] Estado de aprobacion' = 'Choice | CM | Estado aprobacion especial'.Aprobado))
                                && '[AS] Estado' = true)
                                && '[AS] Tramo' = T.Value),
                            clienteCie, Upper(Coalesce(
                                ThisRecord.'[AS] Cuenta'.'Nombre Cliente', "—")),
                            ult4Cie, Coalesce(
                                ThisRecord.'[AS] Cuenta'.'Últimos 4', ""),
                            cifCie, Coalesce(ThisRecord.'[AS] Cuenta'.'CIF Cliente', ""),
                            locCie, Coalesce(ThisRecord.'[AS] Agente'.'[AG] Nombre', "—"),
                            diasCie, Coalesce(
                                ThisRecord.'[AS] Cuenta'.'[CT] Dias Mora', 0),
                            nioCie, Coalesce(
                                ThisRecord.'[AS] Cuenta'.'[CT] Saldo Vencido NIO', 0),
                            usdCie, Coalesce(
                                ThisRecord.'[AS] Cuenta'.'[CT] Saldo Vencido USD', 0),
                            montoCie, If('[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Especial
                                    && (Coalesce('Retiro NIO', 0) > 0 || Coalesce('Retiro USD', 0) > 0),
                                Moneda('Retiro NIO', 'Retiro USD'),
                                Moneda(
                                    Coalesce(ThisRecord.'[AS] Cuenta'.'[CT] Saldo Vencido NIO', 0),
                                    Coalesce(ThisRecord.'[AS] Cuenta'.'[CT] Saldo Vencido USD', 0)))
                        )
                    ));
                    Collect(colCierresCie,
                        AddColumns(
                            Filter('CM | TBL | Asignacions',
                                (('[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Incobrable
                                  || ('[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Especial
                                      && '[AS] Estado de aprobacion' = 'Choice | CM | Estado aprobacion especial'.Aprobado))
                                && '[AS] Estado' = true)
                                && '[AS] Tramo' = Blank()),
                            clienteCie, Upper(Coalesce(
                                ThisRecord.'[AS] Cuenta'.'Nombre Cliente', "—")),
                            ult4Cie, Coalesce(
                                ThisRecord.'[AS] Cuenta'.'Últimos 4', ""),
                            cifCie, Coalesce(ThisRecord.'[AS] Cuenta'.'CIF Cliente', ""),
                            locCie, Coalesce(ThisRecord.'[AS] Agente'.'[AG] Nombre', "—"),
                            diasCie, Coalesce(
                                ThisRecord.'[AS] Cuenta'.'[CT] Dias Mora', 0),
                            nioCie, Coalesce(
                                ThisRecord.'[AS] Cuenta'.'[CT] Saldo Vencido NIO', 0),
                            usdCie, Coalesce(
                                ThisRecord.'[AS] Cuenta'.'[CT] Saldo Vencido USD', 0),
                            montoCie, If('[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Especial
                                    && (Coalesce('Retiro NIO', 0) > 0 || Coalesce('Retiro USD', 0) > 0),
                                Moneda('Retiro NIO', 'Retiro USD'),
                                Moneda(
                                    Coalesce(ThisRecord.'[AS] Cuenta'.'[CT] Saldo Vencido NIO', 0),
                                    Coalesce(ThisRecord.'[AS] Cuenta'.'[CT] Saldo Vencido USD', 0)))
                        )
                    );
                    Set(varSelCie, Blank());
                    Set(varPanelCie, false)
                  Size: =9
                  Text: ="↻ Actualizar"
                  Width: =140
                  X: =Parent.Width - Self.Width - gblE.Pad
                  Y: =gblE.PadSm
            - txtBuscaCie:
                Control: Classic/TextInput@2.3.2
                Properties:
                  AccessibleLabel: ="Buscar por cliente, CIF, tarjeta o localizador"
                  BorderColor: =gblC.borde
                  Default: =""
                  DelayOutput: =true
                  Fill: =gblC.card
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =44
                  HintText: ="🔍 Cliente, CIF, últimos dígitos de la tarjeta o localizador"
                  OnChange: =Set(varBuscaCie, Trim(Self.Text))
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Size: =10
                  Width: =If(nfMovil, Parent.Width - 2*gblE.Pad, Max(200, btnActualizarCie.X - Self.X - gblE.PadSm))
                  X: =If(nfMovil, gblE.Pad, conTabsCie.X + conTabsCie.Width + gblE.PadSm)
                  Y: =If(nfMovil, conTabsCie.Y + conTabsCie.Height + gblE.PadSm, gblE.PadSm)
            - galCierresCie:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  AccessibleLabel: ="Asignaciones activas para cerrar"
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Height: =Parent.Height - Self.Y - gblE.Pad
                  Items: |-
                    =// Búsqueda en memoria sobre colCierresCie (ya cargada): cliente, CIF, últimos dígitos de la tarjeta o localizador.
                    Filter(colCierresCie,
                        If(varTabCie = "incob",
                            '[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Incobrable,
                            '[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Especial)
                        && (IsBlank(varBuscaCie)
                            || varBuscaCie in clienteCie || varBuscaCie in cifCie
                            || EndsWith(ult4Cie, varBuscaCie) || varBuscaCie in locCie))
                  OnSelect: |-
                    =Set(varSelCie, ThisItem);
                    Set(varPanelCie, true);
                    Reset(cmbMotivoCie);
                    Reset(txtDetalleCie)
                  ShowScrollbar: =false
                  TemplateFill: =If(ThisItem.IsSelected && varPanelCie, gblC.tealSuave, gblC.card)
                  TemplatePadding: =0
                  TemplateSize: =gblE.AltoFila
                  Width: =Min(gblE.AnchoMax, Parent.Width - 2*gblE.Pad)
                  X: =gblE.Pad
                  Y: =If(nfMovil, txtBuscaCie.Y + txtBuscaCie.Height, conTabsCie.Y + conTabsCie.Height) + gblE.PadSm
                Children:
                  - lblNombreCie:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.ink
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =22
                        PaddingLeft: =0
                        Size: =11
                        Text: =ThisItem.clienteCie
                        Width: =Parent.TemplateWidth * 0.38
                        Wrap: =false
                        X: =gblE.Pad
                        Y: =8
                  - lblMetaCie:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.muted
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =20
                        PaddingLeft: =0
                        Size: =9
                        Text: |-
                          =CuentaMasc(ThisItem.ult4Cie) & If(IsBlank(ThisItem.cifCie), "", " · CIF " & ThisItem.cifCie) & " · 🏍️ " & ThisItem.locCie
                        Width: =Parent.TemplateWidth * 0.38
                        Wrap: =false
                        X: =gblE.Pad
                        Y: =32
                  - lblMoraCie:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.ink2
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =24
                        PaddingLeft: =0
                        Size: =10
                        Text: =Text(ThisItem.diasCie) & " días de mora"
                        Width: =Parent.TemplateWidth * 0.22
                        Wrap: =false
                        X: =Parent.TemplateWidth * 0.40
                        Y: =20
                  - lblMontoCie:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        Color: =gblC.teal
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =22
                        PaddingLeft: =0
                        PaddingRight: =0
                        Size: =10
                        Text: =ThisItem.montoCie
                        Width: =260
                        Wrap: =false
                        X: =Parent.TemplateWidth - 260 - gblE.Pad
                        Y: =8
                  - chpTipoCie:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: |-
                          =If(ThisItem.'[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Incobrable,
                              gblC.incobInk, gblC.espInk)
                        Fill: |-
                          =If(ThisItem.'[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Incobrable,
                              gblC.incobBg, gblC.espBg)
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =26
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =8
                        Text: |-
                          =If(ThisItem.'[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Incobrable,
                              "Incobrable", "Especial")
                        Width: =14 + 7*Len(Self.Text)
                        X: =Parent.TemplateWidth - Self.Width - gblE.Pad
                        Y: =32
                  - recSepCie:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderThickness: =0
                        DropShadow: =DropShadow.None
                        Fill: =gblC.hairline
                        Height: =1
                        Width: =Parent.TemplateWidth
                        Y: =Parent.TemplateHeight - 1
                  - btnFilaCie:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =Color.Transparent
                        Fill: =Color.Transparent
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Height: =Parent.TemplateHeight
                        HoverFill: =RGBA(15, 107, 107, 0.06)
                        OnSelect: =Select(Parent)
                        PressedFill: =RGBA(15, 107, 107, 0.12)
                        TabIndex: =0
                        Text: ="Cerrar asignación de " & ThisItem.clienteCie
                        Width: =Parent.TemplateWidth
                        X: =0
                        Y: =0
            - cmpVacioCie:
                Control: CanvasComponent
                ComponentName: cmpVacio
                Properties:
                  Height: =200
                  Icono: ="✨"
                  Mensaje: |-
                    =If(IsBlank(varBuscaCie),
                        "No hay " & If(varTabCie = "incob", "Incobrables", "Especiales") & " activas para cerrar.",
                        "Ninguna " & If(varTabCie = "incob", "Incobrable", "Especial") & " coincide con «" & varBuscaCie & "».")
                  Titulo: =If(IsBlank(varBuscaCie), "Nada activo", "Sin resultados")
                  Visible: =galCierresCie.AllItemsCount = 0
                  Width: =Min(420, Parent.Width - 2*gblE.Pad)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =galCierresCie.Y + 80
      - recScrimCie:
          Control: Rectangle@2.3.0
          Properties:
            AccessibleLabel: ="Cerrar panel"
            Fill: =gblC.scrim
            FocusedBorderColor: =gblC.teal
            FocusedBorderThickness: =2
            Height: =Parent.Height
            OnSelect: =Set(varPanelCie, false)
            TabIndex: =0
            Visible: =varPanelCie
            Width: =Parent.Width
      - conPanelCie:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =gblC.borde
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =gblC.card
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =varPanelCie
            Width: =If(nfMovil, Parent.Width, Min(480, Parent.Width * 0.45))
            X: =Parent.Width - Self.Width
          Children:
            - lblTituloPanCie:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.ink
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =28
                  PaddingLeft: =0
                  Text: ="Cerrar asignación"
                  Width: =Parent.Width - 2*gblE.Pad
                  Wrap: =false
                  X: =gblE.Pad
                  Y: =gblE.Pad
            - icoCerrarCie:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: ="Cerrar panel"
                  Color: =gblC.muted
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Height: =28
                  Icon: =Icon.Cancel
                  OnSelect: =Set(varPanelCie, false)
                  TabIndex: =0
                  Width: =40
                  X: =Parent.Width - 40 - gblE.PadSm
                  Y: =gblE.Pad
            - lblK1Cie:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.muted
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =36
                  PaddingLeft: =0
                  Size: =9
                  Text: ="Cliente"
                  Width: =120
                  Wrap: =false
                  X: =gblE.Pad
                  Y: =56
            - lblV1Cie:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: =gblC.ink
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =36
                  PaddingLeft: =0
                  PaddingRight: =0
                  Size: =10
                  Text: =varSelCie.clienteCie
                  Width: =Parent.Width - 3*gblE.Pad - 120
                  Wrap: =false
                  X: =gblE.Pad + 120
                  Y: =56
            - recKvSep1Cie:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderThickness: =0
                  DropShadow: =DropShadow.None
                  Fill: =gblC.hairline
                  Height: =1
                  Width: =Parent.Width - 2*gblE.Pad
                  X: =gblE.Pad
                  Y: =91
            - lblK2Cie:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.muted
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =36
