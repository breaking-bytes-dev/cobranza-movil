            - btnCancelarCie:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =gblC.borde
                  BorderThickness: =1
                  Color: =gblC.ink2
                  Fill: =gblC.card
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =gblE.AltoBoton
                  OnSelect: =Set(varPanelCie, false)
                  Size: =10
                  Text: ="Cancelar"
                  Width: =(Parent.Width - 3*gblE.Pad) / 2
                  X: =gblE.Pad
                  Y: =Parent.Height - gblE.AltoBoton - gblE.Pad
            - btnCerrarCie:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  Color: =gblC.redInk
                  DisabledColor: =Color.White
                  DisabledFill: =ColorFade(gblC.redBg, 60%)
                  DisplayMode: =If(!IsBlank(cmbMotivoCie.Selected), DisplayMode.Edit, DisplayMode.Disabled)
                  Fill: =gblC.redBg
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =gblE.AltoBoton
                  HoverFill: =ColorFade(gblC.redBg, 10%)
                  OnSelect: |-
                    =// Un solo Patch delegable (LookUp por el id)
                    // más limpieza local: cero recargas. IfError: si falla, detalle y sin limpieza.
                    IfError(
                        Patch('CM | TBL | Asignacions',
                            LookUp('CM | TBL | Asignacions', 'CM | TBL | Asignacion' = varSelCie.'CM | TBL | Asignacion'),
                            {
                                '[AS] Estado': false,
                                '[AS] Motivo': cmbMotivoCie.Selected.Value &
                                    If(!IsBlank(Trim(txtDetalleCie.Text)), " — " & Trim(txtDetalleCie.Text), ""),
                                'Fecha de cierre': Now()
                            }
                        ),
                        Notify("No se pudo cerrar " & varSelCie.'[AS] Numero' & ": " & FirstError.Message,
                            NotificationType.Error),
                        Remove(colCierresCie,
                            LookUp(colCierresCie, '[AS] Numero' = varSelCie.'[AS] Numero'));
                        Set(varPanelCie, false);
                        Set(varSelCie, Blank());
                        Notify("🔒 Asignación cerrada — " & cmbMotivoCie.Selected.Value,
                            NotificationType.Success, 2500)
                    )
                  Size: =10
                  Text: |-
                    ="🔒 Cerrar asignación"
                  Width: =btnCancelarCie.Width
                  X: =btnCancelarCie.X + btnCancelarCie.Width + gblE.Pad
                  Y: =btnCancelarCie.Y
