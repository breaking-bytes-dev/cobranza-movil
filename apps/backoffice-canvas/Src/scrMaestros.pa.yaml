                Control: Classic/TextInput@2.3.2
                Properties:
                  AccessibleLabel: ="Dirección de casa"
                  BorderColor: =gblC.borde
                  Default: =""
                  Fill: =gblC.card
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =gblE.AltoInput
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Size: =10
                  Visible: =varModoMae = "crear"
                  Width: =Parent.Width - 2*gblE.Pad
                  X: =gblE.Pad
                  Y: =342
            - lblNvDirTrabMae:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.muted
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =16
                  PaddingLeft: =0
                  Size: =9
                  Text: ="Dirección trabajo"
                  Visible: =varModoMae = "crear"
                  Width: =Parent.Width - 2*gblE.Pad
                  Wrap: =false
                  X: =gblE.Pad
                  Y: =390
            - txtDirTrabNvoMae:
                Control: Classic/TextInput@2.3.2
                Properties:
                  AccessibleLabel: ="Dirección de trabajo"
                  BorderColor: =gblC.borde
                  Default: =""
                  Fill: =gblC.card
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =gblE.AltoInput
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Size: =10
                  Visible: =varModoMae = "crear"
                  Width: =Parent.Width - 2*gblE.Pad
                  X: =gblE.Pad
                  Y: =408
            - lblHintCifMae:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.pendInk
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  PaddingLeft: =0
                  Size: =9
                  Text: ="⚠ El CIF debe ser el del core. Un CIF equivocado duplica el cliente en el próximo import."
                  VerticalAlign: =VerticalAlign.Top
                  Visible: =varModoMae = "crear"
