Screens:
  scrMaestros:
    Properties:
      Fill: =gblC.pantalla
      OnVisible: |-
        =// Estado limpio de la pantalla. NO se colecciona nada acá: la búsqueda va directa
        // al datasource (receta 01 §7.9) y las colecciones del cliente nacen al clic en la fila.
        Set(varPanelMae, false);
        Set(varModoMae, "ver");
        Reset(txtBuscarMae)
    Children:
      - cmpEncMae:
          Control: CanvasComponent
          ComponentName: cmpEncabezado
          Properties:
            Height: =If(nfMovil, gblE.AltoBarra + 84, 84)
            Subtitulo: ="Clientes y cuentas. Solo el Admin crea y edita; el Solicitante los referencia."
            Titulo: ="Datos maestros"
            Width: =Parent.Width - Self.X
            X: =If(nfMovil, 0, gblE.AnchoNav)
      - conToolbarMae:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =gblE.AltoInput
            Width: =Min(gblE.AnchoMax, Parent.Width - If(nfMovil, 0, gblE.AnchoNav) - 2*gblE.Pad)
            X: |-
              =If(nfMovil, 0, gblE.AnchoNav)
                  + Max(gblE.Pad, (Parent.Width - If(nfMovil, 0, gblE.AnchoNav) - gblE.AnchoMax) / 2)
            Y: =cmpEncMae.Y + cmpEncMae.Height
          Children:
            - txtBuscarMae:
                Control: Classic/TextInput@2.3.2
                Properties:
                  AccessibleLabel: ="Buscar cliente por CIF o nombre"
                  BorderColor: =gblC.borde
                  Default: =""
                  DelayOutput: =true
                  Fill: =gblC.card
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =gblE.AltoInput
                  HintText: ="CIF o nombre…"
                  PaddingLeft: =34
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Size: =10
                  Width: =Parent.Width - 170 - gblE.PadSm
            - icoBuscarMae:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: ="Buscar cliente"
                  Color: =gblC.muted
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Height: =20
                  Icon: =Icon.Search
                  Width: =20
                  X: =8
                  Y: =10
            - btnNuevoMae:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  Color: =Color.White
                  DisabledColor: =Color.White
                  DisabledFill: =ColorFade(gblC.teal, 60%)
                  Fill: =gblC.teal
                  FocusedBorderColor: =gblC.ink
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =gblE.AltoInput
                  HoverFill: =ColorFade(gblC.teal, 10%)
                  OnSelect: |-
                    =// Abre el panel en modo crear, con el form limpio.
                    Set(varCliMae, Blank());
                    Set(varModoMae, "crear");
                    Reset(txtCifNvoMae); Reset(txtNombreNvoMae); Reset(txtDeptoNvoMae); Reset(txtDistritoNvoMae);
                    Reset(txtTrabajoNvoMae); Reset(txtTelCelNvoMae); Reset(txtTelCasNvoMae);
                    Reset(txtDirCasaNvoMae); Reset(txtDirTrabNvoMae);
                    Set(varPanelMae, true)
                  Size: =10
                  Text: ="＋ Nuevo cliente"
                  Width: =170
                  X: =Parent.Width - 170
      - galClientesMae:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            AccessibleLabel: ="Lista de clientes"
            FocusedBorderColor: =gblC.teal
            FocusedBorderThickness: =2
            Height: =Parent.Height - Self.Y - gblE.Pad
            Items: |-
              =// Ambas ramas delegables: Sort por columna escalar y StartsWith (00 §4.2).
              // La galería pagina sola contra Dataverse; por eso NO hay colección de clientes.
              If(
                  IsBlank(Trim(txtBuscarMae.Text)),
                  Sort('CM | TBL | Clientes', '[CL] Nombre'),
                  Filter('CM | TBL | Clientes',
                      StartsWith('[CL] CIF', Trim(txtBuscarMae.Text)) ||
                      StartsWith('[CL] Nombre', Trim(txtBuscarMae.Text)))
              )
            OnSelect: |-
              =// Carga las colecciones del cliente elegido (los filtros delegables: texto exacto
              // por CIF y lookup por registro — 00 §4.2) y abre el panel en modo ver.
              Set(varCliMae, ThisItem);
              Set(varModoMae, "ver");
              Concurrent(
                  ClearCollect(colTelMae, Filter('CM | TBL | Telefonos', '[TL] CIF' = ThisItem.'[CL] CIF')),
                  ClearCollect(colDirMae, Filter('CM | TBL | Direccions', '[DR] CIF' = ThisItem.'[CL] CIF'))
              );
              // Las cuentas NO se coleccionan: galCtasMae lee el datasource directo (mismo filtro
              // delegable, por varCliMae). Sin colección "inicializada y nunca actualizada".
              Set(varPanelMae, true)
            ShowScrollbar: =false
            TemplateFill: =If(ThisItem.IsSelected && varPanelMae, gblC.tealSuave, gblC.card)
            TemplatePadding: =0
            TemplateSize: =gblE.AltoFila
            Width: =conToolbarMae.Width
            X: =conToolbarMae.X
            Y: =conToolbarMae.Y + conToolbarMae.Height + gblE.PadSm
          Children:
            - lblNomFilaMae:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.ink
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =22
                  PaddingLeft: =0
                  Size: =10
                  Text: =ThisItem.'[CL] Nombre'
                  Width: =Parent.TemplateWidth * 0.45
                  Wrap: =false
                  X: =gblE.Pad
                  Y: =8
            - lblSubFilaMae:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.muted
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =20
                  PaddingLeft: =0
                  Size: =9
                  Text: =ThisItem.'[CL] CIF' & " · " & Coalesce(ThisItem.'[CL] Departamento', "—")
                  Width: =Parent.TemplateWidth * 0.45
                  Wrap: =false
                  X: =gblE.Pad
                  Y: =32
            - lblTrabFilaMae:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.ink2
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =22
                  PaddingLeft: =0
                  Size: =10
                  Text: |-
                    =// Una línea; si excede el ancho, se trunca (divergencia aceptada, guía 12 §3).
                    If(IsBlank(ThisItem.'[CL] Trabajo'), "sin trabajo registrado", ThisItem.'[CL] Trabajo')
                  Width: =Parent.TemplateWidth * 0.5 - 2*gblE.Pad
                  Wrap: =false
                  X: =gblE.Pad + Parent.TemplateWidth * 0.45
                  Y: =20
            - recSepMae:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderThickness: =0
                  DropShadow: =DropShadow.None
                  Fill: =gblC.hairline
                  Height: =1
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - 1
            - btnFilaMae:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  Color: =Color.Transparent
                  Fill: =Color.Transparent
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Height: =Parent.TemplateHeight
                  HoverFill: =RGBA(15, 107, 107, 0.06)
                  OnSelect: =Select(Parent)
                  PressedFill: =RGBA(15, 107, 107, 0.12)
                  TabIndex: =0
                  Text: ="Ver cliente " & ThisItem.'[CL] Nombre'
                  Width: =Parent.TemplateWidth
                  X: =0
                  Y: =0
      - cmpVacioMae:
          Control: CanvasComponent
          ComponentName: cmpVacio
          Properties:
            Height: =140
            Icono: |-
              ="🔎"
            Mensaje: |-
              =If(IsBlank(Trim(txtBuscarMae.Text)),
                  "Todavía no hay clientes cargados.",
                  "Ningún CIF ni nombre empieza con «" & Trim(txtBuscarMae.Text) & "».")
            Titulo: ="Sin resultados"
            Visible: |-
              =// AllItemsCount es client-side: cuenta la página cargada — para "¿hay cero resultados?"
              // alcanza y no delega nada.
              galClientesMae.AllItemsCount = 0
            Width: =320
            X: =galClientesMae.X + (galClientesMae.Width - 320) / 2
            Y: =galClientesMae.Y + 60
      - recScrimMae:
          Control: Rectangle@2.3.0
          Properties:
            AccessibleLabel: ="Cerrar panel"
            Fill: =gblC.scrim
            FocusedBorderColor: =gblC.teal
            FocusedBorderThickness: =2
            Height: =Parent.Height
            OnSelect: =Set(varPanelMae, false)
            TabIndex: =0
            Visible: =varPanelMae
            Width: =Parent.Width
      - conPanelMae:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =gblC.borde
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =gblC.card
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =varPanelMae
            Width: =If(nfMovil, Parent.Width, Min(480, Parent.Width * 0.45))
            X: =Parent.Width - Self.Width
          Children:
            - lblTituloPanelMae:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.ink
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =28
                  PaddingLeft: =0
                  Text: |-
                    =Switch(varModoMae,
                        "crear", "Nuevo cliente",
                        "editar", "✏️ " & varCliMae.'[CL] Nombre',
                        varCliMae.'[CL] Nombre')
                  Width: =Parent.Width - 2*gblE.Pad - 32
                  Wrap: =false
                  X: =gblE.Pad
                  Y: =gblE.Pad
            - icoCerrarPanelMae:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: ="Cerrar panel"
                  Color: =gblC.muted
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Height: =24
                  Icon: =Icon.Cancel
                  OnSelect: =Set(varPanelMae, false)
                  TabIndex: =0
                  Width: =24
                  X: =Parent.Width - gblE.Pad - 24
                  Y: =gblE.Pad + 2
            - lblKCifMae:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.muted
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =26
                  PaddingLeft: =0
                  Size: =8
                  Text: ="CIF"
                  Visible: =varModoMae = "ver"
                  Width: =120
                  Wrap: =false
                  X: =gblE.Pad
                  Y: =60
            - lblVCifMae:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: =gblC.ink
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =26
                  PaddingLeft: =0
                  PaddingRight: =0
                  Size: =10
                  Text: =varCliMae.'[CL] CIF'
                  Visible: =varModoMae = "ver"
                  Width: =Parent.Width - 2*gblE.Pad - 120
                  Wrap: =false
                  X: =gblE.Pad + 120
                  Y: =60
            - lblKDeptoMae:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.muted
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =26
                  PaddingLeft: =0
                  Size: =8
                  Text: ="DEPARTAMENTO"
                  Visible: =varModoMae = "ver"
                  Width: =120
                  Wrap: =false
                  X: =gblE.Pad
                  Y: =86
            - lblVDeptoMae:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: =gblC.ink
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =26
                  PaddingLeft: =0
                  PaddingRight: =0
                  Size: =10
                  Text: =Coalesce(varCliMae.'[CL] Departamento', "—") & " · " & Coalesce(varCliMae.'[CL] Distrito', "—")
                  Visible: =varModoMae = "ver"
                  Width: =Parent.Width - 2*gblE.Pad - 120
                  Wrap: =false
                  X: =gblE.Pad + 120
                  Y: =86
            - lblKTrabMae:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.muted
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =26
                  PaddingLeft: =0
                  Size: =8
                  Text: ="TRABAJO"
                  Visible: =varModoMae = "ver"
                  Width: =120
                  Wrap: =false
                  X: =gblE.Pad
                  Y: =112
            - lblVTrabMae:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: =gblC.ink
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =26
                  PaddingLeft: =0
                  PaddingRight: =0
                  Size: =10
                  Text: =Coalesce(varCliMae.'[CL] Trabajo', "—")
                  Visible: =varModoMae = "ver"
                  Width: =Parent.Width - 2*gblE.Pad - 120
                  Wrap: =false
                  X: =gblE.Pad + 120
                  Y: =112
            - lblSecTelMae:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.muted
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =18
                  PaddingLeft: =0
                  Size: =8
                  Text: ="TELÉFONOS"
                  Visible: =varModoMae = "ver"
                  Width: =Parent.Width - 2*gblE.Pad
                  Wrap: =false
                  X: =gblE.Pad
                  Y: =148
            - galTelMae:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  AccessibleLabel: ="Teléfonos del cliente"
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Height: =84
                  Items: =colTelMae
                  ShowScrollbar: =false
                  TemplateFill: =Color.Transparent
                  TemplatePadding: =0
                  TemplateSize: =28
                  Visible: =varModoMae = "ver"
                  Width: =Parent.Width - 2*gblE.Pad
                  X: =gblE.Pad
                  Y: =170
                Children:
                  - lblTelFilaMae:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.ink
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =20
                        PaddingLeft: =0
                        Size: =9
                        Text: |-
                          ="📞 " & ThisItem.'[TL] Numero' &
                              If(IsBlank(ThisItem.'[TL] Tipo'), "", " (" & ThisItem.'[TL] Tipo' & ")")
                        Width: =Parent.TemplateWidth
                        Wrap: =false
                        Y: =4
            - lblTelVacioMae:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.muted2
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =24
                  PaddingLeft: =0
                  Size: =10
                  Text: ="—"
                  Visible: =varModoMae = "ver" && CountRows(colTelMae) = 0
                  Width: =Parent.Width - 2*gblE.Pad
                  Wrap: =false
                  X: =gblE.Pad
                  Y: =170
            - lblSecDirMae:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.muted
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =18
                  PaddingLeft: =0
                  Size: =8
                  Text: ="DIRECCIONES"
                  Visible: =varModoMae = "ver"
                  Width: =Parent.Width - 2*gblE.Pad
                  Wrap: =false
                  X: =gblE.Pad
                  Y: =266
            - galDirMae:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  AccessibleLabel: ="Direcciones del cliente"
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Height: =84
                  Items: =colDirMae
                  ShowScrollbar: =false
                  TemplateFill: =Color.Transparent
                  TemplatePadding: =0
                  TemplateSize: =28
                  Visible: =varModoMae = "ver"
                  Width: =Parent.Width - 2*gblE.Pad
                  X: =gblE.Pad
                  Y: =288
                Children:
                  - lblDirFilaMae:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.ink
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =20
                        PaddingLeft: =0
                        Size: =9
                        Text: |-
                          ="📍 " & ThisItem.'[DR] Direccion' &
                              If(IsBlank(ThisItem.'[DR] Tipo'), "", " (" & ThisItem.'[DR] Tipo' & ")")
                        Width: =Parent.TemplateWidth
                        Wrap: =false
                        Y: =4
            - lblDirVacioMae:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.muted2
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =24
                  PaddingLeft: =0
                  Size: =10
                  Text: ="—"
                  Visible: =varModoMae = "ver" && CountRows(colDirMae) = 0
                  Width: =Parent.Width - 2*gblE.Pad
                  Wrap: =false
                  X: =gblE.Pad
                  Y: =288
            - lblSecCtasMae:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.muted
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =18
                  PaddingLeft: =0
                  Size: =8
                  Text: ="CUENTAS (" & galCtasMae.AllItemsCount & ")"
                  Visible: =varModoMae = "ver"
                  Width: =Parent.Width - 2*gblE.Pad
                  Wrap: =false
                  X: =gblE.Pad
                  Y: =384
            - galCtasMae:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  AccessibleLabel: ="Cuentas del cliente"
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Height: =112
                  Items: |-
                    =// Directo al datasource (delegable: lookup por PK del cliente elegido).
                    Filter('CM | TBL | Cuentas', '[CT] Cliente'.'CM | TBL | Cliente' = varCliMae.'CM | TBL | Cliente')
                  ShowScrollbar: =false
                  TemplateFill: =Color.Transparent
                  TemplatePadding: =0
                  TemplateSize: =28
                  Visible: =varModoMae = "ver"
                  Width: =Parent.Width - 2*gblE.Pad
                  X: =gblE.Pad
                  Y: =406
                Children:
                  - lblCtaFilaMae:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.ink
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =20
                        PaddingLeft: =0
                        Size: =9
                        Text: |-
                          =// Si IntelliSense marca 'Tipo Producto' como choice, envolvelo en
                          // Text(ThisItem.'Tipo Producto') dentro del concatenado.
                          ThisItem.'[CT] Numero de cuenta' & " · " & ThisItem.'Tipo Producto' & " · " &
                              Moneda(ThisItem.'[CT] Saldo Vencido NIO', ThisItem.'[CT] Saldo Vencido USD')
                        Width: =Parent.TemplateWidth
                        Wrap: =false
                        Y: =4
            - lblCtasVacioMae:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.muted2
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =24
                  PaddingLeft: =0
                  Size: =10
                  Text: ="Sin cuentas en mora."
                  Visible: =varModoMae = "ver" && galCtasMae.AllItemsCount = 0
                  Width: =Parent.Width - 2*gblE.Pad
                  Wrap: =false
                  X: =gblE.Pad
                  Y: =406
            - btnCerrarPanelMae:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =gblC.borde
                  BorderThickness: =1
                  Color: =gblC.ink2
                  Fill: =gblC.card
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =gblE.AltoBoton
                  OnSelect: =Set(varPanelMae, false)
                  Size: =10
                  Text: ="Cerrar"
                  Visible: =varModoMae = "ver"
                  Width: =(Parent.Width - 3*gblE.Pad) / 2
                  X: =gblE.Pad
                  Y: =Parent.Height - gblE.AltoBoton - gblE.Pad
            - btnEditarMae:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  Color: =gblC.teal
                  DisabledColor: =Color.White
                  DisabledFill: =ColorFade(gblC.teal, 60%)
                  Fill: =gblC.tealSuave
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =gblE.AltoBoton
                  HoverFill: =ColorFade(gblC.tealSuave, 10%)
                  OnSelect: |-
                    =// Los inputs de edición tienen Default = varCliMae.*; el Reset los re-evalúa.
                    // Sin estos Reset, el panel reusado entre clientes muestra el texto viejo.
                    Set(varModoMae, "editar");
                    Reset(txtNombreMae); Reset(txtDeptoMae); Reset(txtDistritoMae); Reset(txtTrabajoMae);
                    Reset(txtNuevoTelMae); Reset(cmbTipoTelMae); Reset(txtNuevaDirMae); Reset(cmbTipoDirMae)
                  Size: =10
                  Text: ="✏️ Editar"
                  Visible: =varModoMae = "ver"
                  Width: =(Parent.Width - 3*gblE.Pad) / 2
                  X: =2*gblE.Pad + Self.Width
                  Y: =Parent.Height - gblE.AltoBoton - gblE.Pad
            - lblEdNombreMae:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.muted
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =16
                  PaddingLeft: =0
                  Size: =9
                  Text: ="Nombre completo"
                  Visible: =varModoMae = "editar"
                  Width: =Parent.Width - 2*gblE.Pad
                  Wrap: =false
                  X: =gblE.Pad
                  Y: =60
            - txtNombreMae:
                Control: Classic/TextInput@2.3.2
                Properties:
                  AccessibleLabel: ="Nombre del cliente"
                  BorderColor: =gblC.borde
