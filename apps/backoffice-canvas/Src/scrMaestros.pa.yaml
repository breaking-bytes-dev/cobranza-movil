            - btnCancelarNvoMae:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =gblC.borde
                  BorderThickness: =1
                  Color: =gblC.ink2
                  Fill: =gblC.card
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =gblE.AltoBoton
                  OnSelect: =Set(varPanelMae, false)
                  Size: =10
                  Text: ="Cancelar"
                  Visible: =varModoMae = "crear"
                  Width: =(Parent.Width - 3*gblE.Pad) / 2
                  X: =gblE.Pad
                  Y: =Parent.Height - gblE.AltoBoton - gblE.Pad
            - btnCrearMae:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  Color: =Color.White
                  DisabledColor: =Color.White
                  DisabledFill: =ColorFade(gblC.teal, 60%)
                  DisplayMode: |-
                    =If(IsBlank(Trim(txtCifNvoMae.Text)) || IsBlank(Trim(txtNombreNvoMae.Text)),
                        DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =gblC.teal
                  FocusedBorderColor: =gblC.ink
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =gblE.AltoBoton
                  HoverFill: =ColorFade(gblC.teal, 10%)
                  OnSelect: |-
                    =// Anti-duplicado primero (LookUp delegable por CIF; el Trim va sobre el argumento
                    // local, no sobre la columna — 00 §4.2). Si el CIF ya existe, el CSV lo fusionaría
                    // por upsert (DEC-013): acá NO se crea y se manda al Admin a buscarlo.
                    If(
                        !IsBlank(LookUp('CM | TBL | Clientes', '[CL] CIF' = Trim(txtCifNvoMae.Text))),
                        Notify("Ya existe un cliente con CIF " & Trim(txtCifNvoMae.Text) &
                               " — buscalo y editalo, no lo dupliques.", NotificationType.Warning),

                        // IfError (B-03): si el cliente no se crea, detalle y el formulario NO se limpia.
                        IfError(
                            Patch('CM | TBL | Clientes', Defaults('CM | TBL | Clientes'),
                                {
                                    '[CL] CIF': Trim(txtCifNvoMae.Text),
                                    '[CL] Nombre': Trim(txtNombreNvoMae.Text),
                                    '[CL] Departamento': Trim(txtDeptoNvoMae.Text),
                                    '[CL] Distrito': Trim(txtDistritoNvoMae.Text),
                                    '[CL] Trabajo': Trim(txtTrabajoNvoMae.Text)
                                }
                            ),
                            Notify("No se pudo crear el cliente " & Trim(txtCifNvoMae.Text) & ": " & FirstError.Message,
                                NotificationType.Error),
                            // Registro creado (para los lookups hijos): LookUp delegable por CIF.
                            Set(varNuevoCliMae, LookUp('CM | TBL | Clientes', '[CL] CIF' = Trim(txtCifNvoMae.Text)));
                            // Hijos opcionales: un Patch por cada tel/dir NO vacío, con lookup + CIF denormalizado.
                            // IfError por pares: se corta en el primer hijo que falle y avisa (el cliente YA existe).
                            IfError(
                                If(!IsBlank(Trim(txtTelCelNvoMae.Text)),
                                    Patch('CM | TBL | Telefonos', Defaults('CM | TBL | Telefonos'),
                                        {'[TL] Cliente': varNuevoCliMae, '[TL] CIF': varNuevoCliMae.'[CL] CIF',
                                         '[TL] Numero': Trim(txtTelCelNvoMae.Text), '[TL] Tipo': "Celular"})),
                                Notify("Cliente creado, pero no se pudo grabar el celular " & Trim(txtTelCelNvoMae.Text) & ": " & FirstError.Message,
                                    NotificationType.Error),
                                If(!IsBlank(Trim(txtTelCasNvoMae.Text)),
                                    Patch('CM | TBL | Telefonos', Defaults('CM | TBL | Telefonos'),
                                        {'[TL] Cliente': varNuevoCliMae, '[TL] CIF': varNuevoCliMae.'[CL] CIF',
                                         '[TL] Numero': Trim(txtTelCasNvoMae.Text), '[TL] Tipo': "Casa"})),
                                Notify("Cliente creado, pero no se pudo grabar el teléfono de casa " & Trim(txtTelCasNvoMae.Text) & ": " & FirstError.Message,
                                    NotificationType.Error),
                                If(!IsBlank(Trim(txtDirCasaNvoMae.Text)),
                                    Patch('CM | TBL | Direccions', Defaults('CM | TBL | Direccions'),
                                        {'[DR] Cliente': varNuevoCliMae, '[DR] CIF': varNuevoCliMae.'[CL] CIF',
                                         '[DR] Direccion': Trim(txtDirCasaNvoMae.Text), '[DR] Tipo': "Casa"})),
                                Notify("Cliente creado, pero no se pudo grabar la dirección de casa: " & FirstError.Message,
                                    NotificationType.Error),
                                If(!IsBlank(Trim(txtDirTrabNvoMae.Text)),
                                    Patch('CM | TBL | Direccions', Defaults('CM | TBL | Direccions'),
                                        {'[DR] Cliente': varNuevoCliMae, '[DR] CIF': varNuevoCliMae.'[CL] CIF',
                                         '[DR] Direccion': Trim(txtDirTrabNvoMae.Text), '[DR] Tipo': "Trabajo"})),
                                Notify("Cliente creado, pero no se pudo grabar la dirección de trabajo: " & FirstError.Message,
                                    NotificationType.Error),
                                Notify("✓ Cliente " & varNuevoCliMae.'[CL] Nombre' & " creado", NotificationType.Success, 2500)
                            );
                            // Cerrar limpio (el cliente existe; si falló un hijo, se agrega desde editar).
                            Reset(txtCifNvoMae); Reset(txtNombreNvoMae); Reset(txtDeptoNvoMae); Reset(txtDistritoNvoMae);
                            Reset(txtTrabajoNvoMae); Reset(txtTelCelNvoMae); Reset(txtTelCasNvoMae);
                            Reset(txtDirCasaNvoMae); Reset(txtDirTrabNvoMae);
                            Set(varPanelMae, false)
                        )
                    )
                  Size: =10
                  Text: ="＋ Crear cliente"
                  Visible: =varModoMae = "crear"
                  Width: =(Parent.Width - 3*gblE.Pad) / 2
                  X: =2*gblE.Pad + Self.Width
                  Y: =Parent.Height - gblE.AltoBoton - gblE.Pad
