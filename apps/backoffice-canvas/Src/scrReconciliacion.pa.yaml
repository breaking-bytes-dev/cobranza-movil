Screens:
  scrReconciliacion:
    Properties:
      Fill: =gblC.pantalla
      OnVisible: |-
        =// Corte = el DÍA de la última carga (se compara por fecha, no fecha+hora): una Diaria cargada
        // segundos antes del máximo NO es "desaparecida". Lado derecho constante, así la comparación delega.
        // 'Última carga' es DateOnly: la comparación es día contra día, sin zona.
        // Refresh antes de leer nfUltimaCarga: sin él se usaría la carga anterior a la de hoy.
        Refresh('CM | TBL | Carga diarias');
        // Carga en curso: alcanza una fila de carga diaria de hoy para habilitar el cierre aunque la carga siga a medias
        // (mientras corren las partes, las Diarias que faltan se verían «fuera de cartera»). Por eso además se exige que
        // no haya un Import Job real (no prueba en seco) de las plantillas de Cobranza en cola, procesando o sin estado
        // creado en las últimas 12 h (los que espera la pantalla Cargar archivo antes de ponerlos en cola).
        // Falla CERRADO: si el Admin no ve la plantilla principal o la consulta falla, el resultado sería «0 en curso»
        // sin serlo, así que el cierre se deshabilita con un mensaje.
        // Plantillas por ID (GUID): comparar el lookup con un REGISTRO (varTpl = LookUp(...)) da ErrIncompatibleTypesForEquality
        // en Studio y, empaquetado con pac, deja TODO el OnVisible inerte sin aviso.
        // Delegación: '[IJ] Status' = opción delega; IsBlank sobre una opción NO, así que los «sin estado»
        // se buscan entre los jobs creados desde varDesdeRec (consulta delegable por fecha, pocos registros) y se cuentan aquí.
        // Cada lectura se verifica aparte (ver scrCargaArchivo): IfError sobre una cadena solo ve el último paso.
        // Si algo no se pudo leer queda en blanco/false y varVerifCargaRec bloquea el cierre.
        Set(varDesdeRec, DateAdd(Now(), -12, TimeUnit.Hours));
        Set(varTplPrinRec, IfError(LookUp('TBL | SMLT | Import Templates', '[IT] Name' = "Cobranza movil").'TBL | SMLT | Import Template', Blank()));
        Set(varTplPadRec, IfError(Coalesce(LookUp('TBL | SMLT | Import Templates', '[IT] Name' = "Cobranza movil · padres").'TBL | SMLT | Import Template', varTplPrinRec), Blank()));
        Set(varTplParRec, IfError(Coalesce(LookUp('TBL | SMLT | Import Templates', '[IT] Name' = "Cobranza movil · partes").'TBL | SMLT | Import Template', varTplPrinRec), Blank()));
        Set(varEnColaRec,
            IfError(
                !IsBlank(LookUp('TBL | SMLT | Import Jobs',
                    '[IJ] Is Dry Run' = false
                    && ('[IJ] Import Template'.'TBL | SMLT | Import Template' = varTplPrinRec || '[IJ] Import Template'.'TBL | SMLT | Import Template' = varTplPadRec || '[IJ] Import Template'.'TBL | SMLT | Import Template' = varTplParRec)
                    && ('[IJ] Status' = '[IJ] Status (TBL | SMLT | Import Jobs)'.Queued
                        || '[IJ] Status' = '[IJ] Status (TBL | SMLT | Import Jobs)'.Processing)
                )),
                Blank()
            )
        );
        Set(varLeyoJobsRec,
            IfError(
                CountRows(ClearCollect(colJobsRec,
                    Filter('TBL | SMLT | Import Jobs',
                        '[IJ] Is Dry Run' = false
                        && ('[IJ] Import Template'.'TBL | SMLT | Import Template' = varTplPrinRec || '[IJ] Import Template'.'TBL | SMLT | Import Template' = varTplPadRec || '[IJ] Import Template'.'TBL | SMLT | Import Template' = varTplParRec)
                        && 'Created On' >= varDesdeRec
                    )
                )) >= 0,
                false
            )
        );
        Set(varEnCursoRec, Coalesce(varEnColaRec, false) || CountIf(colJobsRec, IsBlank('[IJ] Status')) > 0);
        Set(varVerifCargaRec, !IsBlank(varTplPrinRec) && !IsBlank(varTplPadRec) && !IsBlank(varTplParRec) && !IsBlank(varEnColaRec) && varLeyoJobsRec);
        Set(varCargaBloqRec, !varVerifCargaRec || varEnCursoRec);
        Set(varCorteRec, Date(Year(nfUltimaCarga), Month(nfUltimaCarga), Day(nfUltimaCarga)));
        // Lista de desaparecidas + conteos EXACTOS, en paralelo. Filtros delegables (choice por valor, booleano y fecha).
        // El nombre del cliente sale navegando el lookup '[AS] Cuenta' (lo resuelve el servidor, sin catálogo de cuentas truncable).
        // Lista acotada a 2000; el conteo es exacto (CountIf).
        Concurrent(
            ClearCollect(colDesapRec,
                AddColumns(
                    Filter('CM | TBL | Asignacions',
                        '[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Diaria
                        && '[AS] Estado' = true
                        && 'Última carga' < varCorteRec
                    ),
                    clienteRec,
                    Upper(Coalesce(ThisRecord.'[AS] Cuenta'.'Nombre Cliente', "—")),
                    ult4Rec,
                    Coalesce(ThisRecord.'[AS] Cuenta'.'Últimos 4', "")
                )
            ),
            Set(varNDesapRec,
                CountIf('CM | TBL | Asignacions',
                    '[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Diaria
                    && '[AS] Estado' = true
                    && 'Última carga' < varCorteRec
                )
            ),
            Set(varNDiariasRec,
                CountIf('CM | TBL | Asignacions',
                    '[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Diaria
                    && '[AS] Estado' = true
                )
            )
        );
        // Estado de pantalla. El Reset es obligatorio: el valor de la casilla PERSISTE entre
        // visitas y, sin él, un cierre confirmado antes deja el botón armado.
        Set(varPctRec, Round(100 * varNDesapRec / Max(1, varNDiariasRec), 0));
        Set(varRojoRec, varPctRec > 30);
        Reset(chkConfirmarRec);
        Reset(txtConfirmarRec);
        Set(varCerrandoRec, false);
        Set(varEnVueloRec, false)
    Children:
      - cmpEncabezadoRec:
          Control: CanvasComponent
          ComponentName: cmpEncabezado
          Properties:
            Height: =If(nfMovil, gblE.AltoBarra + 84, 84)
            Subtitulo: ="Cuentas Diarias activas que NO vinieron en la última carga."
            Titulo: ="Reconciliación de Diarias"
            Width: =Parent.Width - Self.X
            X: =If(nfMovil, 0, gblE.AnchoNav)
      - conContenidoRec:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height - Self.Y
            Width: =Min(gblE.AnchoMax, Parent.Width - If(nfMovil, 0, gblE.AnchoNav) - 2*gblE.Pad)
            X: |-
              =If(nfMovil, 0, gblE.AnchoNav)
                  + Max(gblE.Pad, (Parent.Width - If(nfMovil, 0, gblE.AnchoNav) - gblE.AnchoMax) / 2)
            Y: =cmpEncabezadoRec.Y + cmpEncabezadoRec.Height
          Children:
            - conBloqueoRec:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =gblC.redInk
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =gblC.redBg
                  Height: =64
                  RadiusBottomLeft: =gblE.Radio
                  RadiusBottomRight: =gblE.Radio
                  RadiusTopLeft: =gblE.Radio
                  RadiusTopRight: =gblE.Radio
                  Visible: =nfUltimaCarga < Today()
                  Width: =Min(gblE.AnchoMax, Parent.Width - 2*gblE.Pad)
                  X: =gblE.Pad
                  Y: =gblE.PadSm
                Children:
                  - lblBloqueoRec:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.redInk
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.Height
                        PaddingLeft: =0
                        Size: =10
                        Text: ="⛔ Todavía no llegó la carga de HOY — la reconciliación se corre DESPUÉS del import."
                        Width: =Parent.Width - 2*gblE.Pad
                        X: =gblE.Pad
            - conCargaRec:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =gblC.redInk
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =gblC.redBg
                  Height: =If(nfMovil, 88, 64)
                  RadiusBottomLeft: =gblE.Radio
                  RadiusBottomRight: =gblE.Radio
                  RadiusTopLeft: =gblE.Radio
                  RadiusTopRight: =gblE.Radio
                  Visible: =varCargaBloqRec
                  Width: =Min(gblE.AnchoMax, Parent.Width - 2*gblE.Pad)
                  X: =gblE.Pad
                  Y: =conBloqueoRec.Y + If(conBloqueoRec.Visible, conBloqueoRec.Height + gblE.PadSm, 0)
                Children:
                  - lblCargaRec:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.redInk
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.Height
                        PaddingLeft: =0
                        Size: =10
                        Text: |-
                          =If(!varVerifCargaRec,
                              "⛔ No se puede verificar si hay una carga del banco en curso (tu usuario no tiene permiso para ver las cargas o la consulta falló): el cierre en lote queda deshabilitado. Avisá a soporte.",
                              "⛔ Hay una carga del banco en curso (en cola, procesando o preparándose): esperá a que termine para cerrar en lote. Mientras tanto, las Diarias que todavía no se cargaron se ven «fuera de cartera».")
                        Width: =Parent.Width - 2*gblE.Pad
                        X: =gblE.Pad
            - conUmbralRec:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderThickness: =0
                  DropShadow: =DropShadow.None
                  Fill: =gblC.redInk
                  Height: =If(nfMovil, 150, 96)
                  RadiusBottomLeft: =gblE.Radio
                  RadiusBottomRight: =gblE.Radio
                  RadiusTopLeft: =gblE.Radio
                  RadiusTopRight: =gblE.Radio
                  Visible: =varRojoRec
                  Width: =Min(gblE.AnchoMax, Parent.Width - 2*gblE.Pad)
                  X: =gblE.Pad
                  Y: =conCargaRec.Y + If(conCargaRec.Visible, conCargaRec.Height + gblE.PadSm, 0)
                Children:
                  - lblUmbralAlertaRec:
                      Control: Label@2.5.1
                      Properties:
                        Color: =Color.White
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =Parent.Height
                        PaddingLeft: =0
                        Size: =11
                        Text: |-
                          =// Umbral de cordura (alerta, no bloqueo): más del 30% suele ser un archivo truncado o una
                          // carga incompleta, pero puede ser real (el banco sacó media cartera). El Admin decide con la confirmación.
                          "🚨 ATENCIÓN: el " & varPctRec & "% de las Diarias (" & varNDesapRec & " de " & varNDiariasRec &
                              ") NO vino en la carga de hoy. Lo normal es mucho menos: suele ser un archivo TRUNCADO o una carga incompleta. " &
                              "Revisá el Monitoreo de carga antes de cerrar. Si cerrás, desaparecen del teléfono de los localizadores " &
                              "(si el banco las vuelve a mandar, se reabren solas)."
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =Parent.Width - 2*gblE.Pad
                        X: =gblE.Pad
            - conResumenRec:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =If(varRojoRec, gblC.redInk, gblC.borde)
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =gblC.card
                  Height: =116 + If(varNDesapRec > CountRows(colDesapRec), 22, 0)
                  RadiusBottomLeft: =gblE.Radio
                  RadiusBottomRight: =gblE.Radio
                  RadiusTopLeft: =gblE.Radio
                  RadiusTopRight: =gblE.Radio
                  Width: =Min(gblE.AnchoMax, Parent.Width - 2*gblE.Pad)
                  X: =gblE.Pad
                  Y: =conUmbralRec.Y + If(conUmbralRec.Visible, conUmbralRec.Height + gblE.PadSm, 0)
                Children:
                  - lblResumenRec:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.ink
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =24
                        PaddingLeft: =0
                        Size: =11
                        Text: =varNDesapRec & " de " & varNDiariasRec & " Diarias activas (" & varPctRec & "%) quedaron fuera de la cartera"
                        Width: =Parent.Width - 2*gblE.Pad
                        Wrap: =false
                        X: =gblE.Pad
                        Y: =gblE.PadSm
                  - conMeterRec:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =gblC.hairline
                        Height: =8
                        RadiusBottomLeft: =99
                        RadiusBottomRight: =99
                        RadiusTopLeft: =99
                        RadiusTopRight: =99
                        Width: =Parent.Width - 2*gblE.Pad
                        X: =gblE.Pad
                        Y: =lblResumenRec.Y + lblResumenRec.Height + gblE.PadSm
                      Children:
                        - recMeterRec:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderThickness: =0
                              DropShadow: =DropShadow.None
                              Fill: =If(varRojoRec, gblC.redInk, gblC.teal)
                              Height: =8
                              Width: =Parent.Width * Min(varPctRec, 100) / 100
                  - lblUmbralRec:
                      Control: Label@2.5.1
                      Properties:
                        Color: =If(varRojoRec, gblC.redInk, gblC.muted)
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =34
                        PaddingLeft: =0
                        Size: =9
                        Text: |-
                          =If(varRojoRec,
                              "🚨 Supera el umbral de cordura (30%). Podés cerrar, pero solo si confirmaste que la carga está completa.",
                              "Umbral de cordura: si superara el 30%, se muestra una alerta antes de cerrar.")
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Parent.Width - 2*gblE.Pad
                        X: =gblE.Pad
                        Y: =conMeterRec.Y + conMeterRec.Height + gblE.PadSm
                  - lblTopeRec:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.muted
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =22
                        PaddingLeft: =0
                        Size: =9
                        Text: |-
                          =If(nfCierreServidor,
                              "Mostrando las primeras " & CountRows(colDesapRec) & " de " & varNDesapRec & " — el cierre en lote cierra las " & varNDesapRec,
                              "Mostrando las primeras " & CountRows(colDesapRec) & " — el cierre en lote procesa lo listado; repetí hasta vaciar")
                        Visible: =varNDesapRec > CountRows(colDesapRec)
                        Width: =Parent.Width - 2*gblE.Pad
                        Wrap: =false
                        X: =gblE.Pad
                        Y: =lblUmbralRec.Y + lblUmbralRec.Height
            - conListaRec:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =gblC.borde
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =gblC.card
                  Height: =Parent.Height - Self.Y - If(CountRows(colDesapRec) > 0, conAccionRec.Height + gblE.PadSm, 0) - gblE.Pad
                  RadiusBottomLeft: =gblE.Radio
                  RadiusBottomRight: =gblE.Radio
                  RadiusTopLeft: =gblE.Radio
                  RadiusTopRight: =gblE.Radio
                  Width: =Min(gblE.AnchoMax, Parent.Width - 2*gblE.Pad)
                  X: =gblE.Pad
                  Y: =conResumenRec.Y + conResumenRec.Height + gblE.PadSm
                Children:
                  - galDesapRec:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        AccessibleLabel: ="Diarias activas fuera de cartera"
                        DisplayMode: =DisplayMode.View
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Height: =Parent.Height
                        Items: =colDesapRec
                        ShowScrollbar: =false
                        TemplatePadding: =0
                        TemplateSize: =gblE.AltoFila
                        Width: =Parent.Width
                      Children:
                        - lblClienteRec:
                            Control: Label@2.5.1
                            Properties:
                              Color: =gblC.ink
                              FocusedBorderColor: =gblC.teal
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              PaddingLeft: =0
                              Size: =10
                              Text: =ThisItem.clienteRec
                              Width: =Parent.TemplateWidth * 0.4
                              Wrap: =false
                              X: =gblE.Pad
                              Y: =10
                        - lblCuentaRec:
                            Control: Label@2.5.1
                            Properties:
                              Color: =gblC.muted
                              FocusedBorderColor: =gblC.teal
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              Height: =20
                              PaddingLeft: =0
                              Size: =9
                              Text: =CuentaMasc(ThisItem.ult4Rec)
                              Width: =Parent.TemplateWidth * 0.4
                              Wrap: =false
                              X: =gblE.Pad
                              Y: =32
                        - lblAgenteRec:
                            Control: Label@2.5.1
                            Properties:
                              Color: =gblC.ink2
                              FocusedBorderColor: =gblC.teal
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              Height: =44
                              PaddingLeft: =0
                              Size: =9
                              Text: |-
                                ="🏍️ " & Coalesce(ThisItem.'[AS] Agente'.'[AG] Nombre', "sin localizador") & " · última carga " &
                                    If(IsBlank(ThisItem.'Última carga'), "—", Text(ThisItem.'Última carga', "dd/mm"))
                              Width: =Parent.TemplateWidth * 0.4
                              X: =gblE.Pad + Parent.TemplateWidth * 0.4
                              Y: =10
                        - chpDiariaRec:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderThickness: =0
                              Color: =gblC.diariaInk
                              DisplayMode: =DisplayMode.View
                              Fill: =gblC.diariaBg
                              FocusedBorderColor: =gblC.teal
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =26
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =8
                              Text: ="Diaria"
                              Width: =14 + 7*Len(Self.Text)
                              X: =Parent.TemplateWidth - Self.Width - gblE.Pad
                              Y: =(Parent.TemplateHeight - Self.Height) / 2
                        - recSepRec:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderThickness: =0
                              DropShadow: =DropShadow.None
                              Fill: =gblC.hairline
                              Height: =1
                              Width: =Parent.TemplateWidth
                              Y: =Parent.TemplateHeight - 1
                  - cmpVacioRec:
                      Control: CanvasComponent
                      ComponentName: cmpVacio
                      Properties:
                        Height: =200
                        Icono: ="✨"
                        Mensaje: ="Todas las Diarias activas vinieron en la carga."
                        Titulo: ="Cartera cuadrada"
                        Visible: =CountRows(colDesapRec) = 0
                        Width: =Min(420, Parent.Width - 2*gblE.Pad)
                        X: =(Parent.Width - Self.Width) / 2
                        Y: =(Parent.Height - Self.Height) / 2
            - conAccionRec:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =gblC.borde
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =gblC.card
                  Height: =If(nfMovil && varRojoRec, 180, 156) + If(varRojoRec, gblE.AltoInput + gblE.PadSm, 0)
                  RadiusBottomLeft: =gblE.Radio
                  RadiusBottomRight: =gblE.Radio
                  RadiusTopLeft: =gblE.Radio
                  RadiusTopRight: =gblE.Radio
                  Visible: =CountRows(colDesapRec) > 0
                  Width: =Min(gblE.AnchoMax, Parent.Width - 2*gblE.Pad)
                  X: =gblE.Pad
                  Y: =conListaRec.Y + conListaRec.Height + gblE.PadSm
                Children:
                  - chkConfirmarRec:
                      Control: Classic/CheckBox@2.1.0
                      Properties:
                        Color: =gblC.ink
                        DisplayMode: =If(nfUltimaCarga < Today() || varCargaBloqRec, DisplayMode.Disabled, DisplayMode.Edit)
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =If(nfMovil && varRojoRec, 72, 48)
                        OnCheck: |-
                          =// Habilitación fresca: al confirmar se vuelve a mirar si hay una carga en curso (pudo empezar con la pantalla
                          // abierta). Mismo bloque que el OnVisible: cada lectura se verifica aparte y, si algo no se pudo leer,
                          // varVerifCargaRec bloquea el cierre.
                          Set(varDesdeRec, DateAdd(Now(), -12, TimeUnit.Hours));
                          Set(varTplPrinRec, IfError(LookUp('TBL | SMLT | Import Templates', '[IT] Name' = "Cobranza movil").'TBL | SMLT | Import Template', Blank()));
                          Set(varTplPadRec, IfError(Coalesce(LookUp('TBL | SMLT | Import Templates', '[IT] Name' = "Cobranza movil · padres").'TBL | SMLT | Import Template', varTplPrinRec), Blank()));
                          Set(varTplParRec, IfError(Coalesce(LookUp('TBL | SMLT | Import Templates', '[IT] Name' = "Cobranza movil · partes").'TBL | SMLT | Import Template', varTplPrinRec), Blank()));
                          Set(varEnColaRec,
                              IfError(
                                  !IsBlank(LookUp('TBL | SMLT | Import Jobs',
                                      '[IJ] Is Dry Run' = false
                                      && ('[IJ] Import Template'.'TBL | SMLT | Import Template' = varTplPrinRec || '[IJ] Import Template'.'TBL | SMLT | Import Template' = varTplPadRec || '[IJ] Import Template'.'TBL | SMLT | Import Template' = varTplParRec)
                                      && ('[IJ] Status' = '[IJ] Status (TBL | SMLT | Import Jobs)'.Queued
                                          || '[IJ] Status' = '[IJ] Status (TBL | SMLT | Import Jobs)'.Processing)
                                  )),
                                  Blank()
                              )
                          );
                          Set(varLeyoJobsRec,
                              IfError(
                                  CountRows(ClearCollect(colJobsRec,
                                      Filter('TBL | SMLT | Import Jobs',
                                          '[IJ] Is Dry Run' = false
                                          && ('[IJ] Import Template'.'TBL | SMLT | Import Template' = varTplPrinRec || '[IJ] Import Template'.'TBL | SMLT | Import Template' = varTplPadRec || '[IJ] Import Template'.'TBL | SMLT | Import Template' = varTplParRec)
                                          && 'Created On' >= varDesdeRec
                                      )
                                  )) >= 0,
                                  false
                              )
                          );
                          Set(varEnCursoRec, Coalesce(varEnColaRec, false) || CountIf(colJobsRec, IsBlank('[IJ] Status')) > 0);
                          Set(varVerifCargaRec, !IsBlank(varTplPrinRec) && !IsBlank(varTplPadRec) && !IsBlank(varTplParRec) && !IsBlank(varEnColaRec) && varLeyoJobsRec);
                          Set(varCargaBloqRec, !varVerifCargaRec || varEnCursoRec);
                          If(varRojoRec,
                              Notify("🚨 Vas a cerrar el " & varPctRec & "% de las Diarias. Si la carga vino truncada, esto vacía la cartera de los localizadores.",
                                  NotificationType.Warning, 6000))
                        Size: =9
                        Text: |-
                          =If(varRojoRec,
                              "Confirmo que el " & varPctRec & "% es REAL: revisé el Monitoreo de carga, el archivo de hoy está completo y el banco sacó estas " & varNDesapRec & " Diarias",
                              "Confirmo: revisé la lista y la carga de hoy es correcta (cierre con motivo ""fuera de cartera"")")
                        Width: =Parent.Width - 2*gblE.Pad
                        X: =gblE.Pad
                        Y: =gblE.PadSm
                  - txtConfirmarRec:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        AccessibleLabel: ="Cantidad de Diarias a cerrar"
                        BorderColor: =gblC.redInk
                        Default: =""
                        DisplayMode: =If(chkConfirmarRec.Value && !varCerrandoRec, DisplayMode.Edit, DisplayMode.Disabled)
                        Fill: =gblC.card
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoInput
                        HintText: ="Para cerrar, escribí " & varNDesapRec & " (la cantidad de Diarias que se cierran)"
                        MaxLength: =7
                        Size: =10
                        Visible: =varRojoRec
                        Width: =Parent.Width - 2*gblE.Pad
                        X: =gblE.Pad
                        Y: =chkConfirmarRec.Y + chkConfirmarRec.Height + gblE.PadSm
                  - btnCerrarRec:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =If(varRojoRec, Color.White, gblC.redInk)
                        DisabledColor: =ColorFade(gblC.redInk, 25%)
                        DisabledFill: =ColorFade(gblC.redBg, 60%)
                        DisplayMode: |-
                          =// Con la alerta roja (más del 30%) hay que escribir la cantidad para poder cerrar.
                          If(chkConfirmarRec.Value && nfUltimaCarga >= Today() && !varCargaBloqRec && !varCerrandoRec
                                  && (!varRojoRec || Trim(txtConfirmarRec.Text) = Text(varNDesapRec)),
                              DisplayMode.Edit, DisplayMode.Disabled)
                        Fill: =If(varRojoRec, gblC.redInk, gblC.redBg)
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoBoton
                        HoverFill: =ColorFade(Self.Fill, 10%)
                        OnSelect: |-
                          =// Con nfCierreServidor el cierre lo hace la Custom API por lotes (tmrCierreRec), sin el tope de 2000 filas.
                          // Si no, un Patch masivo desde la app. En los dos casos, overlay «⏳ Cerrando…» y botón deshabilitado mientras dura.
                          If(nfCierreServidor,
                              Set(varTotalCierreRec, varNDesapRec);
                              Set(varRestRec, varNDesapRec);
                              Set(varCerradasRec, 0);
                              Set(varEnVueloRec, false);
                              Set(varCerrandoRec, true),
                              Set(varTotalCierreRec, CountRows(colDesapRec));
                              Set(varCerradasRec, 0);
                              Set(varCerrandoRec, true);
                              // Un solo Patch masivo: ForAll DEVUELVE la tabla de cambios (no muta adentro) y
                              // cada registro lleva la PK ('CM | TBL | Asignacion') → Patch actualiza esas filas.
                              // Sin LookUp por fila: colDesapRec ya trae la PK desde el Filter del OnVisible.
                              // IfError: si el Patch masivo falla, detalle y sin aviso de éxito ni recarga.
                              IfError(
                                  Patch('CM | TBL | Asignacions',
                                      ForAll(colDesapRec As D,
                                          {
                                              'CM | TBL | Asignacion': D.'CM | TBL | Asignacion',
                                              '[AS] Estado': false,
                                              '[AS] Motivo': "fuera de cartera",
                                              'Fecha de cierre': Now()
                                          }
                                      )
                                  ),
                                  Notify("No se pudo cerrar el lote de " & CountRows(colDesapRec) & " Diarias: " & FirstError.Message,
                                      NotificationType.Error),
                                  Notify("🧹 " & CountRows(colDesapRec) & " Diarias cerradas — motivo: fuera de cartera",
                                      NotificationType.Success, 2500);
                                  // Recarga, mismo bloque del OnVisible (corte del día recalculado).
                                  // Corte = el día de la última carga ('Última carga' es DateOnly: día contra día, sin zona).
                                  Set(varCorteRec, Date(Year(nfUltimaCarga), Month(nfUltimaCarga), Day(nfUltimaCarga)));
                                  // Lista acotada a 2000; el conteo es exacto (CountIf).
                                  Concurrent(
                                      ClearCollect(colDesapRec,
                                          AddColumns(
                                              Filter('CM | TBL | Asignacions',
                                                  '[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Diaria
                                                  && '[AS] Estado' = true
                                                  && 'Última carga' < varCorteRec
                                              ),
                                              clienteRec,
                                              Upper(Coalesce(ThisRecord.'[AS] Cuenta'.'Nombre Cliente', "—")),
                                              ult4Rec,
                                              Coalesce(ThisRecord.'[AS] Cuenta'.'Últimos 4', "")
                                          )
                                      ),
                                      Set(varNDesapRec,
                                          CountIf('CM | TBL | Asignacions',
                                              '[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Diaria
                                              && '[AS] Estado' = true
                                              && 'Última carga' < varCorteRec
                                          )
                                      ),
                                      Set(varNDiariasRec,
                                          CountIf('CM | TBL | Asignacions',
                                              '[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Diaria
                                              && '[AS] Estado' = true
                                          )
                                      )
                                  );
                                  Set(varPctRec, Round(100 * varNDesapRec / Max(1, varNDiariasRec), 0));
                                  Set(varRojoRec, varPctRec > 30);
                                  Reset(chkConfirmarRec)
                              );
                              Set(varCerrandoRec, false)
                          )
                        Size: =10
                        Text: |-
                          =If(varRojoRec,
                              "⚠ Cerrar " & If(nfCierreServidor, varNDesapRec, CountRows(colDesapRec)) & " en lote IGUAL (" & varPctRec & "%)",
                              "🧹 Cerrar " & If(nfCierreServidor, varNDesapRec, CountRows(colDesapRec)) & " asignaciones en lote")
                        Width: =Parent.Width - 2*gblE.Pad
                        X: =gblE.Pad
                        Y: =If(varRojoRec, txtConfirmarRec.Y + txtConfirmarRec.Height, chkConfirmarRec.Y + chkConfirmarRec.Height) + gblE.PadSm
      - cmpNavRec:
          Control: CanvasComponent
          ComponentName: cmpNavLateral
          Properties:
            Height: =Parent.Height
            RutaActiva: ="rec"
            Visible: =!nfMovil || gblNavMovilAbierta
            Width: =gblE.AnchoNav
      - tmrCierreRec:
          Control: Timer@2.1.0
          Properties:
            AutoPause: =false
            Duration: =300
            OnTimerEnd: |-
              =// Una vuelta = un llamado a la Custom API (hasta 250 filas, bajo el límite de 2 min de un plugin). Sigue mientras
              // queden; Esperadas = las que quedaban (si aparecen más, el servidor no cierra y avisa). varEnVueloRec evita dos
              // llamados a la vez si el temporizador vuelve a disparar antes de la respuesta.
              If(nfCierreServidor && varCerrandoRec && !varEnVueloRec,
                  Set(varEnVueloRec, true);
                  Set(varRespCierreRec, Blank());
                  Set(varRespCierreRec,
                      Environment.sanic_cm_CerrarFueraDeCartera({
                          Corte: Text(varCorteRec, "yyyy-mm-dd"),
                          Esperadas: varRestRec,
                          Lote: 250
                      })
                  );
                  Set(varErrCierreRec, IfError(If(IsBlank(varRespCierreRec.Corte), "el servidor no respondió", ""), Coalesce(FirstError.Message, "sin detalle")));
                  If(IsBlank(varErrCierreRec),
                      Set(varCerradasRec, varCerradasRec + varRespCierreRec.Cerradas);
                      Set(varRestRec, varRespCierreRec.Restantes)
                  );
                  If(!IsBlank(varErrCierreRec) || varRestRec <= 0 || varRespCierreRec.Cerradas = 0,
                      Set(varCerrandoRec, false);
                      If(IsBlank(varErrCierreRec),
                          Notify("🧹 " & varCerradasRec & " Diarias cerradas — motivo: fuera de cartera", NotificationType.Success, 3000),
                          Notify("Se cerraron " & varCerradasRec & " de " & varTotalCierreRec & ". " & varErrCierreRec, NotificationType.Error)
                      );
                      // Recarga, mismo bloque del OnVisible (corte del día recalculado).
                      // Corte = el día de la última carga ('Última carga' es DateOnly: día contra día, sin zona).
                      Set(varCorteRec, Date(Year(nfUltimaCarga), Month(nfUltimaCarga), Day(nfUltimaCarga)));
                      // Lista acotada a 2000; el conteo es exacto (CountIf).
                      Concurrent(
                          ClearCollect(colDesapRec,
                              AddColumns(
                                  Filter('CM | TBL | Asignacions',
                                      '[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Diaria
                                      && '[AS] Estado' = true
                                      && 'Última carga' < varCorteRec
                                  ),
                                  clienteRec,
                                  Upper(Coalesce(ThisRecord.'[AS] Cuenta'.'Nombre Cliente', "—")),
                                  ult4Rec,
                                  Coalesce(ThisRecord.'[AS] Cuenta'.'Últimos 4', "")
                              )
                          ),
                          Set(varNDesapRec,
                              CountIf('CM | TBL | Asignacions',
                                  '[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Diaria
                                  && '[AS] Estado' = true
                                  && 'Última carga' < varCorteRec
                              )
                          ),
                          Set(varNDiariasRec,
                              CountIf('CM | TBL | Asignacions',
                                  '[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Diaria
                                  && '[AS] Estado' = true
                              )
                          )
                      );
                      Set(varPctRec, Round(100 * varNDesapRec / Max(1, varNDiariasRec), 0));
                      Set(varRojoRec, varPctRec > 30);
                      Reset(chkConfirmarRec);
                      Reset(txtConfirmarRec)
                  );
                  Set(varEnVueloRec, false)
              )
            Repeat: =true
            Start: =nfCierreServidor && varCerrandoRec
            Visible: =false
      - lblCerrandoRec:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =gblC.teal
            Fill: =RGBA(255, 255, 255, 0.88)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =Parent.Height
            Size: =13
            Text: |-
              ="⏳ Cerrando " & varTotalCierreRec & " asignaciones fuera de la carga…" & Char(10)
                  & If(nfCierreServidor, varCerradasRec & " de " & varTotalCierreRec & " cerradas. ", "")
                  & "No cierres ni cambies de pantalla."
            Visible: =varCerrandoRec
            Width: =Parent.Width
