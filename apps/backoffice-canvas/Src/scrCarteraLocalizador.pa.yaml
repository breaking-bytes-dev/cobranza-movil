Screens:
  scrCarteraLocalizador:
    Properties:
      Fill: =gblC.pantalla
      OnVisible: |-
        =// Cartera por localizador (Supervisor, SOLO LECTURA). La lista de agentes y los conteos por
        // tipo van DIRECTO a Dataverse (Filter + StartsWith + CountIf, todo delegable): sin colección
        // intermedia truncable al Data row limit. La cartera del agente elegido se carga al tocarlo.
        Set(varPanelCpl, false);
        Set(varAgeCpl, Blank());
        Set(varInactCpl, false);
        Reset(txtBuscarCpl)
    Children:
      - cmpEncCpl:
          Control: CanvasComponent
          ComponentName: cmpEncabezado
          Properties:
            Height: =If(nfMovil, gblE.AltoBarra + 84, 84)
            Subtitulo: ="Asignaciones ACTIVAS de cada localizador, por tipo. Tocá uno para ver su cartera."
            Titulo: ="Cartera por localizador"
            Width: =Parent.Width - Self.X
            X: =If(nfMovil, 0, gblE.AnchoNav)
      - conContenidoCpl:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height - Self.Y - gblE.Pad
            Width: =Min(gblE.AnchoMax, Parent.Width - If(nfMovil, 0, gblE.AnchoNav) - 2*gblE.Pad)
            X: |-
              =If(nfMovil, 0, gblE.AnchoNav)
                  + Max(gblE.Pad, (Parent.Width - If(nfMovil, 0, gblE.AnchoNav) - gblE.AnchoMax) / 2)
            Y: =cmpEncCpl.Y + cmpEncCpl.Height
          Children:
            - txtBuscarCpl:
                Control: Classic/TextInput@2.3.2
                Properties:
                  AccessibleLabel: ="Buscar localizador por nombre"
                  BorderColor: =gblC.borde
                  Default: =""
                  DelayOutput: =true
                  Fill: =gblC.card
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =gblE.AltoInput
                  HintText: ="Buscar localizador por nombre"
                  PaddingLeft: =34
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Size: =10
                  Width: |-
                    =If(nfMovil, Parent.Width - btnActualizarCpl.Width - gblE.PadSm,
                        Min(420, Parent.Width - btnActualizarCpl.Width - btnInactivosCpl.Width - 2*gblE.PadSm))
                  Y: =2
            - icoBuscarCpl:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: ="Buscar localizador"
                  Color: =gblC.muted
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Height: =20
                  Icon: =Icon.Search
                  Width: =20
                  X: =txtBuscarCpl.X + 8
                  Y: =txtBuscarCpl.Y + (txtBuscarCpl.Height - Self.Height) / 2
            - btnInactivosCpl:
                Control: Classic/Button@2.2.0
                Properties:
                  AccessibleLabel: =If(varInactCpl, "Ocultar localizadores inactivos", "Incluir localizadores inactivos")
                  BorderColor: =If(varInactCpl, gblC.teal, gblC.borde)
                  BorderThickness: =1
                  Color: =If(varInactCpl, gblC.teal, gblC.ink2)
                  Fill: =If(varInactCpl, gblC.tealSuave, gblC.card)
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =gblE.AltoBoton
                  HoverFill: =ColorFade(Self.Fill, 10%)
                  OnSelect: |-
                    =// APP-43: un localizador desactivado puede quedar con cartera abierta (desactivar no la cierra ni la
                    // mueve). Con este chip el supervisor lo ve y la reasigna.
                    Set(varInactCpl, !varInactCpl)
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Size: =10
                  Text: =If(varInactCpl, "✓ Incluye inactivos", "Incluir inactivos")
                  Width: =160
                  X: =If(nfMovil, 0, txtBuscarCpl.X + txtBuscarCpl.Width + gblE.PadSm)
                  Y: =If(nfMovil, txtBuscarCpl.Y + txtBuscarCpl.Height + gblE.PadSm, 2)
            - btnActualizarCpl:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =gblC.borde
                  BorderThickness: =1
                  Color: =gblC.ink2
                  Fill: =gblC.card
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =gblE.AltoBoton
                  HoverFill: =ColorFade(gblC.card, 10%)
                  OnSelect: |-
                    =// Vuelve a pedir agentes y conteos (los CountIf de cada fila se recalculan).
                    Refresh('CM | TBL | Agentes');
                    Refresh('CM | TBL | Asignacions');
                    // Refresh no devuelve el error: se confirma con una lectura mínima de cada tabla (ver scrCargaArchivo).
                    IfError(
                        CountRows(FirstN('CM | TBL | Agentes', 1)) + CountRows(FirstN('CM | TBL | Asignacions', 1)) >= 0,
                        Notify("No se pudo actualizar la lista: " & TextoError(Coalesce(FirstError.Message, "sin detalle")), NotificationType.Error),
                        Notify("Lista actualizada", NotificationType.Success, 2000))
                  Size: =10
                  Text: ="↻ Actualizar"
                  Width: =150
                  X: =Parent.Width - Self.Width
            - conListaCpl:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =gblC.borde
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =gblC.card
                  Height: =Parent.Height - Self.Y
                  RadiusBottomLeft: =gblE.Radio
                  RadiusBottomRight: =gblE.Radio
                  RadiusTopLeft: =gblE.Radio
                  RadiusTopRight: =gblE.Radio
                  Width: =Parent.Width
                  Y: =Max(btnActualizarCpl.Y + btnActualizarCpl.Height, btnInactivosCpl.Y + btnInactivosCpl.Height) + gblE.PadSm
                Children:
                  - galAgentesCpl:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        AccessibleLabel: =If(varInactCpl, "Localizadores activos e inactivos", "Localizadores activos")
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Height: =Parent.Height - 2*gblE.PadSm
                        Items: |-
                          =// Directo a Dataverse, todo delegable: igualdad booleana + StartsWith + Sort por
                          // columna. Sin With (cortaba la delegación — ver scrNuevaSolicitud.galCtaNva).
                          // APP-43: «Incluir inactivos» se resuelve antes de enviar (cláusula plegada).
                          Sort(
                              Filter('CM | TBL | Agentes',
                                  (varInactCpl || '[AG] Activo' = true)
                                  && StartsWith('[AG] Nombre', Trim(txtBuscarCpl.Text))),
                              '[AG] Nombre')
                        OnSelect: |-
                          =// Cartera ACTIVA del agente elegido, por TRAMOS (TramoCartera, 0..19; el 20 = sin tramo todavía):
                          // una sola consulta se cortaba en el límite de filas (2000) y el panel mostraba "2000" con 3.499.
                          // Cada consulta es delegable (lookup por PK + booleano + tramo constante). Los datos de la cuenta
                          // se hornean navegando '[AS] Cuenta' (lo resuelve el servidor); el orden (tipo, cliente) es en memoria.
                          Set(varAgeCpl, ThisItem);
                          // El panel se abre ENSEGUIDA con «⏳ Cargando…» (la cartera tarda unos segundos) y los filtros en cero.
                          Set(varTipoCpl, "Todas"); Set(varBuscaAsigCpl, "");
                          Reset(drpTipoCpl); Reset(txtBuscaAsigCpl);
                          Set(varCargandoCpl, true);
                          Set(varPanelCpl, true);
                          Set(varNAsigCpl, CountIf('CM | TBL | Asignacions',
                              '[AS] Agente'.'CM | TBL | Agente' = varAgeCpl.'CM | TBL | Agente' && '[AS] Estado' = true));
                          Clear(colAsigCpl);
                          // El tramo va CONSTANTE en cada consulta (T.Value); un If() en el filtro la vuelve no delegable (1 consulta, cortada).
                          ForAll(Sequence(20, 0) As T, Collect(colAsigCpl,
                              AddColumns(
                                  Filter('CM | TBL | Asignacions',
                                      '[AS] Agente'.'CM | TBL | Agente' = varAgeCpl.'CM | TBL | Agente'
                                      && '[AS] Estado' = true
                                      && '[AS] Tramo' = T.Value),
                                  clienteCpl, Upper(Coalesce(ThisRecord.'[AS] Cuenta'.'Nombre Cliente', "—")),
                                  ult4Cpl, Coalesce(ThisRecord.'[AS] Cuenta'.'Últimos 4', ""),
                                  cifCpl, Coalesce(ThisRecord.'[AS] Cuenta'.'CIF Cliente', ""),
                                  moraCpl, Coalesce(ThisRecord.'[AS] Cuenta'.'[CT] Dias Mora', 0),
                                  nioCpl, Coalesce(ThisRecord.'[AS] Cuenta'.'[CT] Saldo Vencido NIO', 0),
                                  usdCpl, Coalesce(ThisRecord.'[AS] Cuenta'.'[CT] Saldo Vencido USD', 0),
                                  ordCpl, Switch(ThisRecord.'[AS] Tipo',
                                      'Choice | CM | Tipo asignacion'.Diaria, 1,
                                      'Choice | CM | Tipo asignacion'.Incobrable, 2,
                                      'Choice | CM | Tipo asignacion'.Especial, 3,
                                      4)
                              )));
                          Collect(colAsigCpl,
                              AddColumns(
                                  Filter('CM | TBL | Asignacions',
                                      '[AS] Agente'.'CM | TBL | Agente' = varAgeCpl.'CM | TBL | Agente'
                                      && '[AS] Estado' = true
                                      && '[AS] Tramo' = Blank()),
                                  clienteCpl, Upper(Coalesce(ThisRecord.'[AS] Cuenta'.'Nombre Cliente', "—")),
                                  ult4Cpl, Coalesce(ThisRecord.'[AS] Cuenta'.'Últimos 4', ""),
                                  cifCpl, Coalesce(ThisRecord.'[AS] Cuenta'.'CIF Cliente', ""),
                                  moraCpl, Coalesce(ThisRecord.'[AS] Cuenta'.'[CT] Dias Mora', 0),
                                  nioCpl, Coalesce(ThisRecord.'[AS] Cuenta'.'[CT] Saldo Vencido NIO', 0),
                                  usdCpl, Coalesce(ThisRecord.'[AS] Cuenta'.'[CT] Saldo Vencido USD', 0),
                                  ordCpl, Switch(ThisRecord.'[AS] Tipo',
                                      'Choice | CM | Tipo asignacion'.Diaria, 1,
                                      'Choice | CM | Tipo asignacion'.Incobrable, 2,
                                      'Choice | CM | Tipo asignacion'.Especial, 3,
                                      4)
                              )
                          );
                          Set(varCargandoCpl, false)
                        ShowScrollbar: =false
                        TemplateFill: =If(ThisItem.IsSelected && varPanelCpl, gblC.tealSuave, gblC.card)
                        TemplatePadding: =0
                        TemplateSize: =If(nfMovil, 128, 72)
                        Width: =Parent.Width - 2*gblE.PadSm
                        X: =gblE.PadSm
                        Y: =gblE.PadSm
                      Children:
                        - lblNombreCpl:
                            Control: Label@2.5.1
                            Properties:
                              Color: =gblC.ink
                              FocusedBorderColor: =gblC.teal
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =22
                              PaddingLeft: =0
                              Size: =11
                              Text: =ThisItem.'[AG] Nombre'
                              Width: |-
                                =If(nfMovil,
                                    Parent.TemplateWidth - 2*gblE.Pad,
                                    Parent.TemplateWidth*34% - gblE.Pad)
                              Wrap: =false
                              X: =gblE.Pad
                              Y: =If(nfMovil, 8, 12)
                        - lblEmailCpl:
                            Control: Label@2.5.1
                            Properties:
                              Color: =If(IsBlank(ThisItem.'Email Usuario') || !ThisItem.'[AG] Activo', gblC.redInk, gblC.muted)
                              FocusedBorderColor: =gblC.teal
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              Height: =18
                              PaddingLeft: =0
                              Size: =9
                              Text: |-
                                =// Vínculo con el usuario de Entra: sin usuario, sus asignaciones no llegan a ningún celular.
                                If(!ThisItem.'[AG] Activo', "⛔ Inactivo · ", "") &
                                If(IsBlank(ThisItem.'Email Usuario'),
                                    "⚠ Sin usuario vinculado",
                                    ThisItem.'Email Usuario')
                              Width: =lblNombreCpl.Width
                              Wrap: =false
                              X: =gblE.Pad
                              Y: =lblNombreCpl.Y + lblNombreCpl.Height
                        - chpDiaCpl:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderThickness: =0
                              Color: =gblC.diariaInk
                              DisplayMode: =DisplayMode.View
                              Fill: =gblC.diariaBg
                              FocusedBorderColor: =gblC.teal
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =26
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =8
                              Text: |-
                                =// CountIf delegable (exacto): lookup por PK + booleano + choice.
                                "Diarias " &
                                    CountIf('CM | TBL | Asignacions',
                                        '[AS] Agente'.'CM | TBL | Agente' = ThisItem.'CM | TBL | Agente'
                                        && '[AS] Estado' = true
                                        && '[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Diaria)
                              Width: =14 + 7*Len(Self.Text)
                              X: =If(nfMovil, gblE.Pad, Parent.TemplateWidth*36%)
                              Y: =If(nfMovil, 60, (Parent.TemplateHeight - Self.Height)/2)
                        - chpIncCpl:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderThickness: =0
                              Color: =gblC.incobInk
                              DisplayMode: =DisplayMode.View
                              Fill: =gblC.incobBg
                              FocusedBorderColor: =gblC.teal
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =26
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =8
                              Text: |-
                                ="Incobrables " &
                                    CountIf('CM | TBL | Asignacions',
                                        '[AS] Agente'.'CM | TBL | Agente' = ThisItem.'CM | TBL | Agente'
                                        && '[AS] Estado' = true
                                        && '[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Incobrable)
                              Width: =14 + 7*Len(Self.Text)
                              X: =chpDiaCpl.X + chpDiaCpl.Width + gblE.PadSm
                              Y: =chpDiaCpl.Y
                        - chpEspCpl:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderThickness: =0
                              Color: =gblC.espInk
                              DisplayMode: =DisplayMode.View
                              Fill: =gblC.espBg
                              FocusedBorderColor: =gblC.teal
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =26
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =8
                              Text: |-
                                ="Especiales " &
                                    CountIf('CM | TBL | Asignacions',
                                        '[AS] Agente'.'CM | TBL | Agente' = ThisItem.'CM | TBL | Agente'
                                        && '[AS] Estado' = true
                                        && '[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Especial)
                              Width: =14 + 7*Len(Self.Text)
                              X: =chpIncCpl.X + chpIncCpl.Width + gblE.PadSm
                              Y: =chpDiaCpl.Y
                        - lblTotCpl:
                            Control: Label@2.5.1
                            Properties:
                              Height: =0
                              Text: |-
                                =// Alerta de carga: total ACTIVO del cobrador (CountIf delegable, exacto). Oculto: lo leen chpCargaCpl.
                                CountIf('CM | TBL | Asignacions',
                                    '[AS] Agente'.'CM | TBL | Agente' = ThisItem.'CM | TBL | Agente'
                                    && '[AS] Estado' = true)
                              Visible: =false
                              Width: =0
                        - chpCargaCpl:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderThickness: =0
                              Color: =gblC.redInk
                              DisplayMode: =DisplayMode.View
                              Fill: =gblC.redBg
                              FocusedBorderColor: =gblC.teal
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =26
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =8
                              Text: ="⚠ " & lblTotCpl.Text & " activas"
                              Tooltip: |-
                                ="Sobrecargado: más de " & nfUmbralCarga & " asignaciones activas"
                              Visible: =Value(lblTotCpl.Text) > nfUmbralCarga
                              Width: =14 + 7*Len(Self.Text)
                              X: =If(nfMovil, gblE.Pad + lblVerCpl.Width + gblE.PadSm, chpEspCpl.X + chpEspCpl.Width + gblE.PadSm)
                              Y: =If(nfMovil, lblVerCpl.Y - 2, chpDiaCpl.Y)
                        - lblVerCpl:
                            Control: Label@2.5.1
                            Properties:
                              Align: =If(nfMovil, Align.Left, Align.Right)
                              Color: =gblC.teal
                              FocusedBorderColor: =gblC.teal
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              PaddingLeft: =0
                              PaddingRight: =0
                              Size: =9
                              Text: ="Ver cartera ›"
                              Width: =120
                              Wrap: =false
                              X: =If(nfMovil, gblE.Pad, Parent.TemplateWidth - Self.Width - gblE.Pad)
                              Y: =If(nfMovil, 96, (Parent.TemplateHeight - Self.Height)/2)
                        - recSepCpl:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderThickness: =0
                              DropShadow: =DropShadow.None
                              Fill: =gblC.hairline
                              Height: =1
                              Width: =Parent.TemplateWidth
                              Y: =Parent.TemplateHeight - 1
                        - btnFilaCpl:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderThickness: =0
                              Color: =Color.Transparent
                              Fill: =Color.Transparent
                              FocusedBorderColor: =gblC.teal
                              FocusedBorderThickness: =2
                              Height: =Parent.TemplateHeight
                              HoverFill: =RGBA(15, 107, 107, 0.06)
                              OnSelect: =Select(Parent)
                              PressedFill: =RGBA(15, 107, 107, 0.12)
                              TabIndex: =0
                              Text: ="Ver cartera de " & ThisItem.'[AG] Nombre'
                              Width: =Parent.TemplateWidth
                              X: =0
                              Y: =0
                  - cmpVacioCpl:
                      Control: CanvasComponent
                      ComponentName: cmpVacio
                      Properties:
                        Height: =200
                        Icono: |-
                          ="🏍️"
                        Mensaje: |-
                          =If(IsBlank(Trim(txtBuscarCpl.Text)),
                              "Todavía no hay localizadores activos.",
                              "Ningún localizador activo empieza con «" & Trim(txtBuscarCpl.Text) & "».")
                        Titulo: ="Sin localizadores"
                        Visible: =galAgentesCpl.AllItemsCount = 0
                        Width: =Min(420, Parent.Width - 2*gblE.Pad)
                        X: =(Parent.Width - Self.Width) / 2
                        Y: =(Parent.Height - Self.Height) / 2
      - recScrimCpl:
          Control: Rectangle@2.3.0
          Properties:
            AccessibleLabel: ="Cerrar panel"
            Fill: =gblC.scrim
            FocusedBorderColor: =gblC.teal
            FocusedBorderThickness: =2
            Height: =Parent.Height
            OnSelect: =Set(varPanelCpl, false)
            TabIndex: =0
            Visible: =varPanelCpl
            Width: =Parent.Width
      - conPanelCpl:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =gblC.borde
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =gblC.card
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =varPanelCpl
            Width: =If(nfMovil, Parent.Width, Min(640, Parent.Width * 0.5))
            X: =Parent.Width - Self.Width
          Children:
            - lblTituloPanCpl:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.ink
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =28
                  PaddingLeft: =0
                  Text: ="Cartera de " & varAgeCpl.'[AG] Nombre'
                  Width: =Parent.Width - 2*gblE.Pad - 32
                  Wrap: =false
                  X: =gblE.Pad
                  Y: =gblE.Pad
            - icoCerrarCpl:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: ="Cerrar panel"
                  Color: =gblC.muted
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Height: =24
                  Icon: =Icon.Cancel
                  OnSelect: =Set(varPanelCpl, false)
                  TabIndex: =0
                  Width: =24
                  X: =Parent.Width - gblE.Pad - 24
                  Y: =gblE.Pad + 2
            - lblSubPanCpl:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.muted
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =20
                  PaddingLeft: =0
                  Size: =9
                  Text: |-
                    =// Conteo EXACTO (CountIf delegado al seleccionar); si la lista no trajo todo, se dice.
                    varNAsigCpl & " asignaciones activas" &
                        If(CountRows(colAsigCpl) < varNAsigCpl, " (⚠ se muestran " & CountRows(colAsigCpl) & ")", "") & " · " &
                        If(IsBlank(varAgeCpl.'Email Usuario'), "sin usuario vinculado", varAgeCpl.'Email Usuario')
                  Width: =Parent.Width - 2*gblE.Pad
                  Wrap: =false
                  X: =gblE.Pad
                  Y: =lblTituloPanCpl.Y + lblTituloPanCpl.Height + 4
            - lblNTotalCpl:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.ink
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =20
                  PaddingLeft: =0
                  Size: =9
                  Text: |-
                    =// Desglose de lo cargado en el panel (mismo origen que la lista de abajo).
                    "Diarias " & CountIf(colAsigCpl, ordCpl = 1) &
                        " · Incobrables " & CountIf(colAsigCpl, ordCpl = 2) &
                        " · Especiales " & CountIf(colAsigCpl, ordCpl = 3) &
                        If(varTipoCpl = "Todas" && IsBlank(varBuscaAsigCpl), "", " · mostrando " & galAsigCpl.AllItemsCount)
                  Width: =Parent.Width - 2*gblE.Pad
                  Wrap: =false
                  X: =gblE.Pad
                  Y: =lblSubPanCpl.Y + lblSubPanCpl.Height + 2
            - conFiltrosCpl:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  Height: =gblE.AltoInput
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =gblE.PadSm
                  Width: =Parent.Width - 2*gblE.Pad
                  X: =gblE.Pad
                  Y: =lblNTotalCpl.Y + lblNTotalCpl.Height + gblE.PadSm
                Children:
                  - drpTipoCpl:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        AccessibleLabel: ="Tipo de asignación"
                        BorderColor: =gblC.borde
                        BorderThickness: =1
                        ChevronBackground: =gblC.card
                        ChevronFill: =gblC.ink2
                        ChevronHoverBackground: =gblC.pantalla
                        ChevronHoverFill: =gblC.teal
                        Color: =gblC.ink
                        Default: =Coalesce(varTipoCpl, "Todas")
                        DisplayMode: =If(varCargandoCpl, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =gblC.card
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoInput
                        HoverColor: =gblC.ink
                        HoverFill: =gblC.pantalla
                        Items: =["Todas", "Diarias", "Incobrables", "Especiales"]
                        Items.Value: =Value
                        OnChange: =Set(varTipoCpl, Coalesce(Self.Selected.Value, "Todas"))
                        PressedColor: =gblC.card
                        PressedFill: =gblC.teal
                        SelectionColor: =gblC.card
                        SelectionFill: =gblC.teal
                        Size: =10
                        Width: =150
                  - txtBuscaAsigCpl:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        AccessibleLabel: ="Buscar por CIF, nombre del cliente o últimos 4 de la cuenta"
                        BorderColor: =gblC.borde
                        Default: =""
                        DelayOutput: =true
                        DisplayMode: =If(varCargandoCpl, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =gblC.card
                        FillPortions: =1
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoInput
                        HintText: ="🔍 CIF, cliente o últimos 4"
                        OnChange: =Set(varBuscaAsigCpl, Trim(Self.Text))
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Size: =10
            - galAsigCpl:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  AccessibleLabel: ="Asignaciones activas del localizador"
                  BorderColor: =gblC.borde
                  BorderThickness: =1
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Height: =btnCerrarPanCpl.Y - gblE.PadSm - Self.Y
                  Items: |-
                    =// En memoria (la colección ya trae la cartera COMPLETA por tramos): filtro de tipo y búsqueda por CIF, nombre del
                    // cliente o últimos 4 (APP-41); orden por tipo (Diaria, Incobrable, Especial) y después cliente.
                    Sort(
                        Filter(colAsigCpl,
                            (varTipoCpl = "Todas"
                                || (varTipoCpl = "Diarias" && ordCpl = 1)
                                || (varTipoCpl = "Incobrables" && ordCpl = 2)
                                || (varTipoCpl = "Especiales" && ordCpl = 3))
                            && (IsBlank(varBuscaAsigCpl)
                                || StartsWith(cifCpl, varBuscaAsigCpl) || varBuscaAsigCpl in clienteCpl
                                || EndsWith(ult4Cpl, varBuscaAsigCpl))),
                        Text(ordCpl) & "|" & clienteCpl)
                  ShowScrollbar: =false
                  TemplateFill: =gblC.card
                  TemplatePadding: =0
                  TemplateSize: =If(nfMovil, 108, 80)
                  Visible: =CountRows(colAsigCpl) > 0
                  Width: =Parent.Width - 2*gblE.Pad
                  X: =gblE.Pad
                  Y: =conFiltrosCpl.Y + conFiltrosCpl.Height + gblE.PadSm
                Children:
                  - lblCliFilaCpl:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.ink
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =18
                        PaddingLeft: =0
                        Size: =10
                        Text: =ThisItem.clienteCpl
                        Width: =If(nfMovil, Parent.TemplateWidth - 2*gblE.PadSm, Parent.TemplateWidth*0.6)
                        Wrap: =false
                        X: =gblE.PadSm
                        Y: =8
                  - lblCtaFilaCpl:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.muted
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =16
                        PaddingLeft: =0
                        Size: =9
                        Text: =CuentaMasc(ThisItem.ult4Cpl) & " · " & ThisItem.'[AS] Numero'
                        Width: =lblCliFilaCpl.Width
                        Wrap: =false
                        X: =gblE.PadSm
                        Y: =28
                  - chpTipoFilaCpl:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =Switch(ThisItem.ordCpl, 1, gblC.diariaInk, 2, gblC.incobInk, 3, gblC.espInk, gblC.ink2)
                        DisplayMode: =DisplayMode.View
                        Fill: =Switch(ThisItem.ordCpl, 1, gblC.diariaBg, 2, gblC.incobBg, 3, gblC.espBg, gblC.hairline)
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =24
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =8
                        Text: =Switch(ThisItem.ordCpl, 1, "Diaria", 2, "Incobrable", 3, "Especial", "—")
                        Width: =14 + 7*Len(Self.Text)
                        X: =gblE.PadSm
                        Y: =48
                  - chpAprFilaCpl:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: |-
                          =Switch(ThisItem.'[AS] Estado de aprobacion',
                              'Choice | CM | Estado aprobacion especial'.'Pendiente aprobacion', gblC.pendInk,
                              'Choice | CM | Estado aprobacion especial'.Aprobado, gblC.okInk,
                              'Choice | CM | Estado aprobacion especial'.Rechazada, gblC.redInk,
                              gblC.ink2)
                        DisplayMode: =DisplayMode.View
                        Fill: |-
                          =Switch(ThisItem.'[AS] Estado de aprobacion',
                              'Choice | CM | Estado aprobacion especial'.'Pendiente aprobacion', gblC.pendBg,
                              'Choice | CM | Estado aprobacion especial'.Aprobado, gblC.okBg,
                              'Choice | CM | Estado aprobacion especial'.Rechazada, gblC.redBg,
                              gblC.hairline)
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =24
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =8
                        Text: |-
                          =// El estado de aprobación solo aplica a las Especiales.
                          Switch(ThisItem.'[AS] Estado de aprobacion',
                              'Choice | CM | Estado aprobacion especial'.'Pendiente aprobacion', "Pendiente aprobación",
                              'Choice | CM | Estado aprobacion especial'.Aprobado, "Aprobada",
                              'Choice | CM | Estado aprobacion especial'.Rechazada, "Rechazada",
                              'Choice | CM | Estado aprobacion especial'.Borrador, "Borrador",
                              "Sin estado")
                        Visible: =ThisItem.ordCpl = 3
                        Width: =14 + 7*Len(Self.Text)
                        X: =chpTipoFilaCpl.X + chpTipoFilaCpl.Width + gblE.PadSm
                        Y: =chpTipoFilaCpl.Y
                  - lblSaldoFilaCpl:
                      Control: Label@2.5.1
                      Properties:
                        Align: =If(nfMovil, Align.Left, Align.Right)
                        Color: =gblC.ink
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =18
                        PaddingLeft: =0
                        PaddingRight: =0
                        Size: =10
                        Text: =Moneda(ThisItem.nioCpl, ThisItem.usdCpl)
                        Width: =If(nfMovil, Parent.TemplateWidth - 2*gblE.PadSm, Parent.TemplateWidth*0.36)
                        Wrap: =false
                        X: =If(nfMovil, gblE.PadSm, Parent.TemplateWidth - Self.Width - gblE.PadSm)
                        Y: =If(nfMovil, 78, 8)
                  - lblMoraFilaCpl:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        Color: =If(ThisItem.moraCpl > 90, gblC.redInk, gblC.muted)
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =16
                        PaddingLeft: =0
                        PaddingRight: =0
                        Size: =9
                        Text: =ThisItem.moraCpl & " días de mora"
                        Width: =140
                        Wrap: =false
                        X: =Parent.TemplateWidth - Self.Width - gblE.PadSm
                        Y: =If(nfMovil, 52, 30)
                  - recSepFilaCpl:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderThickness: =0
                        DropShadow: =DropShadow.None
                        Fill: =gblC.hairline
                        Height: =1
                        Width: =Parent.TemplateWidth
                        Y: =Parent.TemplateHeight - 1
            - lblSinAsigCpl:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.muted
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =40
                  PaddingLeft: =0
                  Size: =10
                  Text: |-
                    =If(CountRows(colAsigCpl) = 0, "Este localizador no tiene asignaciones activas.",
                        "Ninguna asignación coincide con el filtro.")
                  Visible: =!varCargandoCpl && galAsigCpl.AllItemsCount = 0
                  Width: =Parent.Width - 2*gblE.Pad
                  X: =gblE.Pad
                  Y: =galAsigCpl.Y
            - lblCargandoCpl:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =gblC.teal
                  Fill: =RGBA(255, 255, 255, 0.88)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =btnCerrarPanCpl.Y - Self.Y - gblE.PadSm
                  Size: =12
                  Text: ="⏳ Cargando la cartera de " & varAgeCpl.'[AG] Nombre' & "…"
                  Visible: =varCargandoCpl
                  Width: =Parent.Width - 2*gblE.Pad
                  X: =gblE.Pad
                  Y: =lblNTotalCpl.Y
            - btnCerrarPanCpl:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =gblC.borde
                  BorderThickness: =1
                  Color: =gblC.ink2
                  Fill: =gblC.card
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =gblE.AltoBoton
                  OnSelect: =Set(varPanelCpl, false)
                  Size: =10
                  Text: ="Cerrar"
                  Width: =Parent.Width - 2*gblE.Pad
                  X: =gblE.Pad
                  Y: =Parent.Height - gblE.AltoBoton - gblE.Pad
      - cmpNavCpl:
          Control: CanvasComponent
          ComponentName: cmpNavLateral
          Properties:
            Height: =Parent.Height
            RutaActiva: ="cpl"
            Visible: =!nfMovil || gblNavMovilAbierta
            Width: =gblE.AnchoNav
