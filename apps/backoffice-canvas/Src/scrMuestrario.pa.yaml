Screens:
  scrMuestrario:
    Children:
      - muestracmpEncabezado:
          Control: CanvasComponent
          ComponentName: cmpEncabezado
          Properties:
            Subtitulo: ="Text"
            Titulo: ="Text"
      - muestracmpKpi:
          Control: CanvasComponent
          ComponentName: cmpKpi
          Properties:
            Detalle: ="Text"
            EsHero: =true
            Etiqueta: ="Text"
            Valor: ="Text"
      - muestracmpNavLateral:
          Control: CanvasComponent
          ComponentName: cmpNavLateral
          Properties:
            Height: =App.Height
            RutaActiva: ="Text"
            Width: =gblE.AnchoNav
      - muestracmpVacio:
          Control: CanvasComponent
          ComponentName: cmpVacio
          Properties:
            Icono: ="Text"
            Mensaje: ="Text"
            Titulo: ="Text"
      - muestraContenedor:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            X: =40
            Y: =40
      - muestraEtiqueta:
          Control: Label@2.5.1
          Properties:
            FocusedBorderColor: =gblC.teal
            FocusedBorderThickness: =2
            X: =60
            Y: =60
      - muestraBoton:
          Control: Classic/Button@2.2.0
          Properties:
            FocusedBorderColor: =gblC.teal
            FocusedBorderThickness: =2
            X: =80
            Y: =80
      - muestraIcono:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: ="Ícono de muestra"
            FocusedBorderColor: =gblC.teal
            FocusedBorderThickness: =2
            Icon: =Icon.Printing3D
            X: =100
            Y: =100
      - muestraImagen:
          Control: Image@2.2.3
          Properties:
            AccessibleLabel: ="Imagen de muestra"
            FocusedBorderColor: =gblC.teal
            FocusedBorderThickness: =2
            X: =120
            Y: =120
      - muestraRectangulo:
          Control: Rectangle@2.3.0
          Properties:
            AccessibleLabel: =""
            FocusedBorderColor: =gblC.teal
            FocusedBorderThickness: =2
            TabIndex: =-1
            X: =140
            Y: =140
      - muestraEntradaTexto:
          Control: Classic/TextInput@2.3.2
          Properties:
            AccessibleLabel: ="Entrada de texto de muestra"
            FocusedBorderColor: =gblC.teal
            FocusedBorderThickness: =2
            X: =160
            Y: =160
      - muestraCombo:
          Control: Classic/ComboBox@2.4.0
          Properties:
            AccessibleLabel: ="Cuadro combinado de muestra"
            FocusedBorderColor: =gblC.teal
            FocusedBorderThickness: =2
            X: =180
            Y: =180
      - muestraCasilla:
          Control: Classic/CheckBox@2.1.0
          Properties:
            FocusedBorderColor: =gblC.teal
            FocusedBorderThickness: =2
            X: =200
            Y: =200
      - muestraAlternar:
          Control: Classic/Toggle@2.1.0
          Properties:
            FocusedBorderColor: =gblC.teal
            FocusedBorderThickness: =2
            X: =220
            Y: =220
      - muestraGaleriaV:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            AccessibleLabel: ="Galería vertical de muestra"
            FocusedBorderColor: =gblC.teal
            FocusedBorderThickness: =2
            X: =240
            Y: =193
      - muestraGaleriaH:
          Control: Gallery@2.15.0
          Variant: Horizontal
          Properties:
            AccessibleLabel: ="Galería horizontal de muestra"
            FocusedBorderColor: =gblC.teal
            FocusedBorderThickness: =2
            X: =260
            Y: =193
      - muestraTemporizador:
          Control: Timer@2.1.0
          Properties:
            FocusedBorderColor: =gblC.teal
            FocusedBorderThickness: =2
            X: =280
            Y: =280
