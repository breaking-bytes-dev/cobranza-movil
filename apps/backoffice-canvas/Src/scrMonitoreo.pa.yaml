Screens:
  scrMonitoreo:
    Properties:
      Fill: =gblC.pantalla
      OnVisible: |-
        =// nfUltimaCarga lee la tabla guardada en memoria: sin Refresh, si la app se abrió antes de la carga,
        // seguiría diciendo "Sin cargas registradas".
        Refresh('CM | TBL | Carga diarias');
        // Conteos EXACTOS directo al datasource: CountIf delega en Dataverse (exacto hasta 50.000).
        // NO colección + CountRows: la colección se trunca al Data row limit.
        // CountIf(tabla, true) en lugar de CountRows(tabla): CountRows sin filtro usa un valor cacheado.
        // [CD] FechaCarga es DateOnly: comparar contra Today() viaja como ge <hoy>T06:00Z y da 0 el día
        // de la carga. Lado derecho constante = 00:00 UTC de hoy, sigue delegable.
        Concurrent(
            Set(varNCargaHoyMon, CountIf('CM | TBL | Carga diarias', '[CD] FechaCarga' >= DateAdd(Today(), -TimeZoneOffset(Today()), TimeUnit.Minutes))),
            Set(varNCtasMon, CountIf('CM | TBL | Cuentas', true)),
            Set(varNCliMon, CountIf('CM | TBL | Clientes', true))
        );
        Set(varHayCargaMon, nfUltimaCarga >= Today());
        // Cuentas de la última carga en manos de agentes desactivados. Los agentes inactivos son pocos: por cada uno,
        // un CountIf delegable (lookup por id, booleano y fecha) sobre las asignaciones activas de ese día.
        // 'Última carga' es DateOnly: día contra día, igual que en Reconciliación.
        Set(varRevAgMon, true);
        If(IsBlank(nfUltimaCarga),
            Clear(colAgInactMon),
            Set(varCorteMon, Date(Year(nfUltimaCarga), Month(nfUltimaCarga), Day(nfUltimaCarga)));
            ClearCollect(colAgInactMon,
                Filter(
                    ForAll(Filter('CM | TBL | Agentes', '[AG] Activo' = false) As A,
                        {
                            nombreMon: A.'[AG] Nombre',
                            nCtasMon: CountIf('CM | TBL | Asignacions',
                                '[AS] Agente'.'CM | TBL | Agente' = A.'CM | TBL | Agente'
                                && '[AS] Estado' = true
                                && 'Última carga' = varCorteMon)
                        }
                    ),
                    nCtasMon > 0
                )
            )
        );
        Set(varRevAgMon, false)
    Children:
      - cmpEncMon:
          Control: CanvasComponent
          ComponentName: cmpEncabezado
          Properties:
            Height: =If(nfMovil, gblE.AltoBarra + 84, 84)
            Subtitulo: ="¿Llegó el archivo del core? ¿Cuadra el volumen?"
            Titulo: ="Monitoreo de carga"
            Width: =Parent.Width - Self.X
            X: =If(nfMovil, 0, gblE.AnchoNav)
      - conContenidoMon:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height - Self.Y - gblE.Pad
            Width: =Min(gblE.AnchoMax, Parent.Width - If(nfMovil, 0, gblE.AnchoNav) - 2*gblE.Pad)
            X: |-
              =If(nfMovil, 0, gblE.AnchoNav)
                  + Max(gblE.Pad, (Parent.Width - If(nfMovil, 0, gblE.AnchoNav) - gblE.AnchoMax) / 2)
            Y: =cmpEncMon.Y + cmpEncMon.Height + gblE.PadSm
          Children:
            - conEstadoOkMon:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =gblC.okBg
                  Height: =84
                  RadiusBottomLeft: =gblE.Radio
                  RadiusBottomRight: =gblE.Radio
                  RadiusTopLeft: =gblE.Radio
                  RadiusTopRight: =gblE.Radio
                  Visible: =varHayCargaMon
                  Width: =Parent.Width
                Children:
                  - recBordeOkMon:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderThickness: =0
                        DropShadow: =DropShadow.None
                        Fill: =gblC.okInk
                        Height: =Parent.Height
                        Width: =4
                  - lblEstadoOkTituloMon:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.okInk
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =26
                        PaddingLeft: =0
                        Size: =11
                        Text: ="✓ Carga de hoy completada · " & Text(DateAdd(nfUltimaCarga, TimeZoneOffset(nfUltimaCarga), TimeUnit.Minutes), "dd/mm/yyyy")
                        Width: =Parent.Width - 2*gblE.Pad
                        Wrap: =false
                        X: =gblE.Pad
                        Y: =gblE.PadSm
                  - lblEstadoOkDetalleMon:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.okInk
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =24
                        PaddingLeft: =0
                        Size: =9
                        Text: |-
                          =Text(varNCargaHoyMon, "#,##0") & " filas de carga · "
                              & Text(varNCtasMon, "#,##0") & " cuentas · "
                              & Text(varNCliMon, "#,##0") & " clientes en maestros"
                        Width: =Parent.Width - 2*gblE.Pad
                        Wrap: =false
                        X: =gblE.Pad
                        Y: =lblEstadoOkTituloMon.Y + lblEstadoOkTituloMon.Height
            - conEstadoAlertaMon:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =gblC.redBg
                  Height: =84
                  RadiusBottomLeft: =gblE.Radio
                  RadiusBottomRight: =gblE.Radio
                  RadiusTopLeft: =gblE.Radio
                  RadiusTopRight: =gblE.Radio
                  Visible: =!varHayCargaMon
                  Width: =Parent.Width
                Children:
                  - recBordeAlertaMon:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderThickness: =0
                        DropShadow: =DropShadow.None
                        Fill: =gblC.redInk
                        Height: =Parent.Height
                        Width: =4
                  - lblEstadoAlertaTituloMon:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.redInk
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =24
                        PaddingLeft: =0
                        Size: =11
                        Text: ="⛔ No ha llegado la carga de hoy"
                        Width: =Parent.Width - 2*gblE.Pad
                        Wrap: =false
                        X: =gblE.Pad
                        Y: =6
                  - lblEstadoAlertaUltimaMon:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.redInk
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =22
                        PaddingLeft: =0
                        Size: =9
                        Text: |-
                          =If(IsBlank(nfUltimaCarga),
                              "Sin cargas registradas en el sistema",
                              "Última carga: " & Text(DateAdd(nfUltimaCarga, TimeZoneOffset(nfUltimaCarga), TimeUnit.Minutes), "dd/mm/yyyy"))
                        Width: =Parent.Width - 2*gblE.Pad
                        Wrap: =false
                        X: =gblE.Pad
                        Y: =lblEstadoAlertaTituloMon.Y + lblEstadoAlertaTituloMon.Height
                  - lblEstadoAlertaAccionMon:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.ink2
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =22
                        PaddingLeft: =0
                        Size: =9
                        Text: ="Subí el archivo del banco en «Cargar archivo» y verificá la carga antes de operar la reconciliación."
                        Width: =Parent.Width - 2*gblE.Pad
                        Wrap: =false
                        X: =gblE.Pad
                        Y: =lblEstadoAlertaUltimaMon.Y + lblEstadoAlertaUltimaMon.Height
            # Aviso de localizadores desactivados: mientras revisa muestra «Revisando localizadores…»; después, solo si hay cuentas.
            - conAgInactMon:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =gblC.pendBg
                  Height: =If(varRevAgMon, lblAgInactTituloMon.Y + lblAgInactTituloMon.Height, lblAgInactAccionMon.Y + lblAgInactAccionMon.Height) + gblE.PadSm
                  RadiusBottomLeft: =gblE.Radio
                  RadiusBottomRight: =gblE.Radio
                  RadiusTopLeft: =gblE.Radio
                  RadiusTopRight: =gblE.Radio
                  Visible: =varRevAgMon || CountRows(colAgInactMon) > 0
                  Width: =Parent.Width
                  Y: =conEstadoOkMon.Y + conEstadoOkMon.Height + gblE.Pad
                Children:
                  - recBordeAgInactMon:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderThickness: =0
                        DropShadow: =DropShadow.None
                        Fill: =gblC.pendInk
                        Height: =Parent.Height
                        Width: =4
                  - lblAgInactTituloMon:
                      Control: Label@2.5.1
                      Properties:
                        AutoHeight: =true
                        Color: =gblC.pendInk
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =If(varRevAgMon, FontWeight.Normal, FontWeight.Bold)
                        PaddingLeft: =0
                        Size: =If(varRevAgMon, 9, 11)
                        Text: |-
                          =If(varRevAgMon,
                              "⏳ Revisando localizadores…",
                              "⚠ La última carga asignó " & Text(Sum(colAgInactMon, nCtasMon), "#,##0")
                                  & " cuenta(s) a localizador(es) desactivado(s): " & Concat(colAgInactMon, nombreMon, ", ") & ".")
                        Width: =Parent.Width - 2*gblE.Pad
                        X: =gblE.Pad
                        Y: =gblE.PadSm
                  - lblAgInactAccionMon:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.ink2
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =22
                        PaddingLeft: =0
                        Size: =9
                        Text: ="Reactivá el localizador en «Localizadores y usuarios» o pedí al banco que corrija el localizador en el archivo. Las Especiales e Incobrables también se pueden mover en «Reasignar»."
                        Visible: =!varRevAgMon
                        Width: =Parent.Width - 2*gblE.Pad
                        X: =gblE.Pad
                        Y: =lblAgInactTituloMon.Y + lblAgInactTituloMon.Height
            - cmpKpiFilasMon:
                Control: CanvasComponent
                ComponentName: cmpKpi
                Properties:
                  Detalle: ="desde las 00:00"
                  EsHero: =false
                  Etiqueta: ="FILAS DE CARGA HOY"
                  Height: =96
                  Valor: =Text(varNCargaHoyMon, "#,##0")
                  Width: =If(nfMovil, Parent.Width, (Parent.Width - 2*gblE.Pad) / 3)
                  Y: |-
                    =If(conAgInactMon.Visible,
                        conAgInactMon.Y + conAgInactMon.Height,
                        conEstadoOkMon.Y + conEstadoOkMon.Height) + gblE.Pad
            - cmpKpiCuentasMon:
                Control: CanvasComponent
                ComponentName: cmpKpi
                Properties:
                  Detalle: ="en maestros"
                  EsHero: =false
                  Etiqueta: ="CUENTAS TOTALES"
                  Height: =96
                  Valor: =Text(varNCtasMon, "#,##0")
                  Width: =cmpKpiFilasMon.Width
                  X: =If(nfMovil, 0, cmpKpiFilasMon.X + cmpKpiFilasMon.Width + gblE.Pad)
                  Y: |-
                    =If(nfMovil,
                        cmpKpiFilasMon.Y + cmpKpiFilasMon.Height + gblE.PadSm,
                        cmpKpiFilasMon.Y)
            - cmpKpiClientesMon:
                Control: CanvasComponent
                ComponentName: cmpKpi
                Properties:
                  Detalle: ="en maestros"
                  EsHero: =false
                  Etiqueta: ="CLIENTES TOTALES"
                  Height: =96
                  Valor: =Text(varNCliMon, "#,##0")
                  Width: =cmpKpiFilasMon.Width
                  X: =If(nfMovil, 0, cmpKpiCuentasMon.X + cmpKpiCuentasMon.Width + gblE.Pad)
                  Y: |-
                    =If(nfMovil,
                        cmpKpiCuentasMon.Y + cmpKpiCuentasMon.Height + gblE.PadSm,
                        cmpKpiFilasMon.Y)
            - conInfoMon:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =gblC.borde
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =gblC.card
                  Height: =72
                  RadiusBottomLeft: =gblE.Radio
                  RadiusBottomRight: =gblE.Radio
                  RadiusTopLeft: =gblE.Radio
                  RadiusTopRight: =gblE.Radio
                  Width: =Parent.Width
                  Y: =cmpKpiClientesMon.Y + cmpKpiClientesMon.Height + gblE.Pad
                Children:
                  - lblInfoMon:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.muted
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =Parent.Height - 2*gblE.PadSm
                        PaddingLeft: =0
                        Size: =9
                        Text: ="El archivo del banco se sube desde «Cargar archivo». Si una carga tuvo filas con error, pedile el detalle a soporte."
                        Width: =Parent.Width - 2*gblE.Pad
                        X: =gblE.Pad
                        Y: =gblE.PadSm
            - btnActualizarMon:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  Color: =gblC.teal
                  DisabledColor: =gblC.teal
                  DisabledFill: =ColorFade(gblC.tealSuave, 60%)
                  Fill: =gblC.tealSuave
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =gblE.AltoBoton
                  HoverFill: =ColorFade(gblC.tealSuave, 10%)
                  OnSelect: |-
                    =Refresh('CM | TBL | Carga diarias');
                    Concurrent(
                        Set(varNCargaHoyMon, CountIf('CM | TBL | Carga diarias', '[CD] FechaCarga' >= DateAdd(Today(), -TimeZoneOffset(Today()), TimeUnit.Minutes))),
                        Set(varNCtasMon, CountIf('CM | TBL | Cuentas', true)),
                        Set(varNCliMon, CountIf('CM | TBL | Clientes', true))
                    );
                    // nfUltimaCarga es fórmula con nombre: se reevalúa tras el Refresh de arriba;
                    // varHayCargaMon es variable normal, por eso el Set sigue siendo necesario.
                    Set(varHayCargaMon, nfUltimaCarga >= Today());
                    // Cuentas de la última carga en manos de agentes desactivados. Los agentes inactivos son pocos: por cada uno,
                    // un CountIf delegable (lookup por id, booleano y fecha) sobre las asignaciones activas de ese día.
                    // 'Última carga' es DateOnly: día contra día, igual que en Reconciliación.
                    Set(varRevAgMon, true);
                    If(IsBlank(nfUltimaCarga),
                        Clear(colAgInactMon),
                        Set(varCorteMon, Date(Year(nfUltimaCarga), Month(nfUltimaCarga), Day(nfUltimaCarga)));
                        ClearCollect(colAgInactMon,
                            Filter(
                                ForAll(Filter('CM | TBL | Agentes', '[AG] Activo' = false) As A,
                                    {
                                        nombreMon: A.'[AG] Nombre',
                                        nCtasMon: CountIf('CM | TBL | Asignacions',
                                            '[AS] Agente'.'CM | TBL | Agente' = A.'CM | TBL | Agente'
                                            && '[AS] Estado' = true
                                            && 'Última carga' = varCorteMon)
                                    }
                                ),
                                nCtasMon > 0
                            )
                        )
                    );
                    Set(varRevAgMon, false);
                    // Cada Set guardó el error de su lectura (si la hubo): se lee aparte (ver scrCargaArchivo).
                    IfError(
                        varNCargaHoyMon + varNCtasMon + varNCliMon >= 0 && (varHayCargaMon || true),
                        Notify("No se pudieron actualizar los datos: " & TextoError(Coalesce(FirstError.Message, "sin detalle")), NotificationType.Error),
                        Notify("✓ Datos actualizados", NotificationType.Success, 2500))
                  Size: =10
                  Text: ="↻ Actualizar"
                  X: =Parent.Width - Self.Width
                  Y: =conInfoMon.Y + conInfoMon.Height + gblE.Pad
            - btnCargarArchivoMon:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  Color: =Color.White
                  Fill: =gblC.teal
                  FocusedBorderColor: =gblC.ink
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =gblE.AltoBoton
                  HoverFill: =ColorFade(gblC.teal, 10%)
                  OnSelect: =Navigate(scrCargaArchivo)
                  Size: =10
                  Text: ="📤 Cargar archivo"
                  Visible: ="Admin" in gblRol
                  Width: =180
                  X: =btnActualizarMon.X - Self.Width - gblE.PadSm
                  Y: =btnActualizarMon.Y
      - recCierraNavMon:
          Control: Rectangle@2.3.0
          Properties:
            AccessibleLabel: ="Cerrar menú"
            Fill: =Color.Transparent
            FocusedBorderColor: =gblC.teal
            FocusedBorderThickness: =2
            Height: =Parent.Height
            OnSelect: |-
              =// Capa transparente detrás del menú en pantalla angosta: tocar afuera lo cierra.
              // Va justo antes de cmpNavMon para quedar debajo del menú y encima del resto.
              Set(gblNavMovilAbierta, false)
            TabIndex: =0
            Visible: =nfMovil && gblNavMovilAbierta
            Width: =Parent.Width
      - cmpNavMon:
          Control: CanvasComponent
          ComponentName: cmpNavLateral
          Properties:
            Height: =Parent.Height
            RutaActiva: ="mon"
            Visible: =!nfMovil || gblNavMovilAbierta
            Width: =gblE.AnchoNav
