                              Width: =Parent.TemplateWidth
                              X: =0
                              Y: =0
                  - lblSinAgeAlt:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.muted
                        Fill: =gblC.card
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =galAgeAlt.Height
                        PaddingLeft: =gblE.PadSm
                        Size: =9
