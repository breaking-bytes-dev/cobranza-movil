Screens:
  scrAltaCuenta:
    Properties:
      Fill: =gblC.pantalla
      OnVisible: |-
        =// El Admin da de alta UNA cuenta como una importación de una fila de Smelter (Custom API sanic_cm_AltaCuenta).
        // Solo Admin: la nav la muestra solo a ese rol y el servidor rechaza a cualquier otro.
        // Estado de pantalla limpio en cada visita; el número de tarjeta no sobrevive a salir de la pantalla.
        Set(varJobAlt, Blank());
        Set(varRespAlt, Blank());
        Set(varEstAlt, 0);
        Set(varArmarAlt, Blank());
        Set(varEsPruebaAlt, true);
        Set(varOcupadoAlt, false);
        Set(varPollAlt, false);
        Set(varVueltasAlt, 0);
        Set(varConfirmaAlt, false);
        Set(varValidoAlt, false);
        Set(varAvisosAlt, "");
        Set(varErrorAlt, "");
        Set(varHechaAlt, "");
        Set(varTipoHechaAlt, "");
        Set(varVerPanAlt, true);
        Set(varProdAlt, Blank());
        Set(varAgeAlt, Blank());
        // Desplegables: productos y agentes activos, ordenados, con una etiqueta legible. Tablas chicas.
        ClearCollect(colProdAlt, ForAll(Sort('CM | TBL | Productos', '[PR] Codigo') As P,
            {etq: P.'[PR] Codigo' & " · " & P.'[PR] Tipo', id: P.'CM | TBL | Producto'}));
        ClearCollect(colAgeAlt, ForAll(Sort(Filter('CM | TBL | Agentes', '[AG] Activo' = true), '[AG] Nombre') As A,
            {etq: A.'[AG] Nombre' & " · " & Coalesce(A.'Email Usuario', "sin usuario"), id: A.'CM | TBL | Agente'}));
        Reset(drpProdAlt); Reset(drpAgeAlt);
        Reset(txtPanAlt)
    Children:
      - cmpEncAlt:
          Control: CanvasComponent
          ComponentName: cmpEncabezado
          Properties:
            Height: =If(nfMovil, gblE.AltoBarra + 84, 84)
            Subtitulo: ="Una cuenta, como una carga de una sola fila. Primero la prueba en seco y, si sale limpia, la carga real."
            Titulo: ="Alta de cuenta"
            Width: =Parent.Width - Self.X
            X: =If(nfMovil, 0, gblE.AnchoNav)
      - conContenidoAlt:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height - Self.Y - gblE.Pad
            Width: =Min(gblE.AnchoMax, Parent.Width - If(nfMovil, 0, gblE.AnchoNav) - 2*gblE.Pad)
            X: |-
              =If(nfMovil, 0, gblE.AnchoNav)
                  + Max(gblE.Pad, (Parent.Width - If(nfMovil, 0, gblE.AnchoNav) - gblE.AnchoMax) / 2)
            Y: =cmpEncAlt.Y + cmpEncAlt.Height + gblE.PadSm
          Children:
            - conFormAlt:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =gblC.borde
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =gblC.card
                  Height: |-
                    =With({n: If(nfMovil, 2, 4)},
                        lblDatosAlt.Y + lblDatosAlt.Height + gblE.PadSm
                            + RoundUp(If(cmbTipoAlt.Selected.Value = "Especial", 23, 21) / n, 0) * (62 + gblE.PadSm) + gblE.Pad)
                  RadiusBottomLeft: =gblE.Radio
                  RadiusBottomRight: =gblE.Radio
                  RadiusTopLeft: =gblE.Radio
                  RadiusTopRight: =gblE.Radio
                  Width: =Parent.Width
                Children:
                  - lblDatosAlt:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.ink
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =24
                        PaddingLeft: =0
                        Size: =11
                        Text: ="1 · Datos de la cuenta (con * son obligatorios)"
                        Width: =Parent.Width - 2*gblE.Pad
                        Wrap: =false
                        X: =gblE.Pad
                        Y: =gblE.PadSm
                  - lblCifTitAlt:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.ink2
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =18
                        PaddingLeft: =0
                        Size: =9
                        Text: ="CIF del cliente *"
                        Width: |-
                          =With({n: If(nfMovil, 2, 4)},
                              (Parent.Width - 2*gblE.Pad - (n - 1)*gblE.PadSm) / n)
                        Wrap: =false
                        X: =gblE.Pad
                        Y: |-
                          =With({n: If(nfMovil, 2, 4)},
                              lblDatosAlt.Y + lblDatosAlt.Height + gblE.PadSm + RoundDown(0 / n, 0) * (62 + gblE.PadSm))
                  - txtCifAlt:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        AccessibleLabel: ="CIF del cliente"
                        BorderColor: =gblC.borde
                        Default: =""
                        DisplayMode: =If(varOcupadoAlt || varValidoAlt, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =gblC.card
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoInput
                        MaxLength: =20
                        HintText: ="CIF tal como lo manda el banco"
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Size: =10
                        Width: =lblCifTitAlt.Width
                        X: =lblCifTitAlt.X
                        Y: =lblCifTitAlt.Y + 22
                  - lblCliTitAlt:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.ink2
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =18
                        PaddingLeft: =0
                        Size: =9
                        Text: ="Nombre del cliente (si es nuevo)"
                        Width: =lblCifTitAlt.Width
                        Wrap: =false
                        X: |-
                          =With({n: If(nfMovil, 2, 4)},
                              gblE.Pad + Mod(1, n) * (lblCifTitAlt.Width + gblE.PadSm))
                        Y: |-
                          =With({n: If(nfMovil, 2, 4)},
                              lblDatosAlt.Y + lblDatosAlt.Height + gblE.PadSm + RoundDown(1 / n, 0) * (62 + gblE.PadSm))
                  - txtCliAlt:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        AccessibleLabel: ="Nombre del cliente"
                        BorderColor: =gblC.borde
                        Default: =""
                        DisplayMode: =If(varOcupadoAlt || varValidoAlt, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =gblC.card
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoInput
                        MaxLength: =200
                        HintText: ="Si el CIF ya existe se usa el de Dataverse"
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Size: =10
                        Width: =lblCifTitAlt.Width
                        X: =lblCliTitAlt.X
                        Y: =lblCliTitAlt.Y + 22
                  - lblPanTitAlt:
                      Control: Label@2.5.1
                      Properties:
                        Color: |-
                          =With({d: SoloDigitos(txtPanAlt.Text)},
                              If(IsBlank(d), gblC.ink2, LuhnOk(d), gblC.okInk, gblC.redInk))
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =18
                        PaddingLeft: =0
                        Size: =9
                        Text: |-
                          =// Ayuda en vivo: cuántos dígitos van y si pasa el dígito verificador (el servidor lo vuelve a controlar).
                          With({d: SoloDigitos(txtPanAlt.Text)},
                              "Número de tarjeta *" & If(IsBlank(d), "",
                                  " · " & Len(d) & " dígitos " &
                                  If(!IsMatch(d, "\d{13,19}"), "(van de 13 a 19)", LuhnOk(d), "✓ verificador OK", "✗ no pasa el verificador")))
                        Width: =lblCifTitAlt.Width
                        Wrap: =false
                        X: |-
                          =With({n: If(nfMovil, 2, 4)},
                              gblE.Pad + Mod(2, n) * (lblCifTitAlt.Width + gblE.PadSm))
                        Y: |-
                          =With({n: If(nfMovil, 2, 4)},
                              lblDatosAlt.Y + lblDatosAlt.Height + gblE.PadSm + RoundDown(2 / n, 0) * (62 + gblE.PadSm))
                  - txtPanAlt:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        AccessibleLabel: ="Número de tarjeta"
                        BorderColor: =gblC.borde
                        Default: =""
                        DisplayMode: =If(varOcupadoAlt || varValidoAlt, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =gblC.card
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoInput
                        HintText: ="13 a 19 dígitos"
                        MaxLength: =23
                        Mode: =If(varVerPanAlt && !varValidoAlt, TextMode.SingleLine, TextMode.Password)
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Size: =10
                        Width: =lblCifTitAlt.Width - btnVerPanAlt.Width - 4
                        X: =lblPanTitAlt.X
                        Y: =lblPanTitAlt.Y + 22
                  - btnVerPanAlt:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =gblC.borde
                        BorderThickness: =1
                        Color: =gblC.ink2
                        DisplayMode: =If(varOcupadoAlt || varValidoAlt, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =gblC.card
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoInput
                        HoverFill: =ColorFade(gblC.card, 10%)
                        OnSelect: =Set(varVerPanAlt, !varVerPanAlt)
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Size: =9
                        Text: =If(varVerPanAlt && !varValidoAlt, "Ocultar", "Mostrar")
                        Tooltip: ="Mostrar u ocultar el número de tarjeta"
                        Width: =80
                        X: =txtPanAlt.X + txtPanAlt.Width + 4
                        Y: =txtPanAlt.Y
                  - lblProdTitAlt:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.ink2
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =18
                        PaddingLeft: =0
                        Size: =9
                        Text: ="Producto *"
                        Width: =lblCifTitAlt.Width
                        Wrap: =false
                        X: |-
                          =With({n: If(nfMovil, 2, 4)},
                              gblE.Pad + Mod(3, n) * (lblCifTitAlt.Width + gblE.PadSm))
                        Y: |-
                          =With({n: If(nfMovil, 2, 4)},
                              lblDatosAlt.Y + lblDatosAlt.Height + gblE.PadSm + RoundDown(3 / n, 0) * (62 + gblE.PadSm))
                  - drpProdAlt:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        AccessibleLabel: ="Producto"
                        AllowEmptySelection: =true
                        BorderColor: =gblC.borde
                        BorderThickness: =1
                        ChevronBackground: =gblC.card
                        ChevronFill: =gblC.ink2
                        ChevronHoverBackground: =gblC.pantalla
                        ChevronHoverFill: =gblC.teal
                        Color: =gblC.ink
                        Default: =""
                        DisplayMode: =If(varOcupadoAlt || varValidoAlt, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =gblC.card
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoInput
                        HoverColor: =gblC.ink
                        HoverFill: =gblC.pantalla
                        Items: =colProdAlt
                        Items.Value: =etq
                        OnChange: |-
                          =Set(varProdAlt, If(IsBlank(Self.Selected.id), Blank(), LookUp('CM | TBL | Productos', 'CM | TBL | Producto' = Self.Selected.id)))
                        PressedColor: =gblC.card
                        PressedFill: =gblC.teal
                        SelectionColor: =gblC.card
                        SelectionFill: =gblC.teal
                        Size: =10
                        Width: =lblCifTitAlt.Width
                        X: =lblProdTitAlt.X
                        Y: =lblProdTitAlt.Y + 22
                  - lblAgeTitAlt:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.ink2
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =18
                        PaddingLeft: =0
                        Size: =9
                        Text: ="Localizador *"
                        Width: =lblCifTitAlt.Width
                        Wrap: =false
                        X: |-
                          =With({n: If(nfMovil, 2, 4)},
                              gblE.Pad + Mod(4, n) * (lblCifTitAlt.Width + gblE.PadSm))
                        Y: |-
                          =With({n: If(nfMovil, 2, 4)},
                              lblDatosAlt.Y + lblDatosAlt.Height + gblE.PadSm + RoundDown(4 / n, 0) * (62 + gblE.PadSm))
                  - drpAgeAlt:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        AccessibleLabel: ="Localizador (solo activos)"
                        AllowEmptySelection: =true
                        BorderColor: =gblC.borde
                        BorderThickness: =1
                        ChevronBackground: =gblC.card
                        ChevronFill: =gblC.ink2
                        ChevronHoverBackground: =gblC.pantalla
                        ChevronHoverFill: =gblC.teal
                        Color: =gblC.ink
                        Default: =""
                        DisplayMode: =If(varOcupadoAlt || varValidoAlt, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =gblC.card
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoInput
                        HoverColor: =gblC.ink
                        HoverFill: =gblC.pantalla
                        Items: =colAgeAlt
                        Items.Value: =etq
                        OnChange: |-
                          =// Solo activos (el servidor rechaza uno inactivo). Sin usuario es válido: la cuenta va a «Cartera sin cobrador».
                          Set(varAgeAlt, If(IsBlank(Self.Selected.id), Blank(), LookUp('CM | TBL | Agentes', 'CM | TBL | Agente' = Self.Selected.id)))
                        PressedColor: =gblC.card
                        PressedFill: =gblC.teal
                        SelectionColor: =gblC.card
                        SelectionFill: =gblC.teal
                        Size: =10
                        Width: =lblCifTitAlt.Width
                        X: =lblAgeTitAlt.X
                        Y: =lblAgeTitAlt.Y + 22
                  - lblTipoTitAlt:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.ink2
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =18
                        PaddingLeft: =0
                        Size: =9
                        Text: ="Tipo de asignación *"
                        Width: =lblCifTitAlt.Width
                        Wrap: =false
                        X: |-
                          =With({n: If(nfMovil, 2, 4)},
                              gblE.Pad + Mod(5, n) * (lblCifTitAlt.Width + gblE.PadSm))
                        Y: |-
                          =With({n: If(nfMovil, 2, 4)},
                              lblDatosAlt.Y + lblDatosAlt.Height + gblE.PadSm + RoundDown(5 / n, 0) * (62 + gblE.PadSm))
                  - cmbTipoAlt:
                      Control: Classic/ComboBox@2.4.0
                      Properties:
                        AccessibleLabel: ="Tipo de asignación"
                        BorderColor: =gblC.borde
                        DefaultSelectedItems: =["Especial"]
                        DisplayFields: =["Value"]
                        DisplayMode: =If(varOcupadoAlt || varValidoAlt, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =gblC.card
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoInput
                        IsSearchable: =false
                        Items: =["Especial", "Diaria", "Incobrable"]
                        SelectMultiple: =false
                        Size: =10
                        Width: =lblCifTitAlt.Width
                        X: =lblTipoTitAlt.X
                        Y: =lblTipoTitAlt.Y + 22
                  - lblSvNioTitAlt:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.ink2
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =18
                        PaddingLeft: =0
                        Size: =9
                        Text: ="Saldo vencido C$ *"
                        Width: =lblCifTitAlt.Width
                        Wrap: =false
                        X: |-
                          =With({n: If(nfMovil, 2, 4)},
                              gblE.Pad + Mod(6, n) * (lblCifTitAlt.Width + gblE.PadSm))
                        Y: |-
                          =With({n: If(nfMovil, 2, 4)},
                              lblDatosAlt.Y + lblDatosAlt.Height + gblE.PadSm + RoundDown(6 / n, 0) * (62 + gblE.PadSm))
                  - txtSvNioAlt:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        AccessibleLabel: ="Saldo vencido en córdobas"
                        BorderColor: =gblC.borde
                        Default: =""
                        DisplayMode: =If(varOcupadoAlt || varValidoAlt, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =gblC.card
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Format: =TextFormat.Number
                        Height: =gblE.AltoInput
                        MaxLength: =14
                        HintText: ="0.00"
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Size: =10
                        Width: =lblCifTitAlt.Width
                        X: =lblSvNioTitAlt.X
                        Y: =lblSvNioTitAlt.Y + 22
                  - lblSvUsdTitAlt:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.ink2
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =18
                        PaddingLeft: =0
                        Size: =9
                        Text: ="Saldo vencido US$ *"
                        Width: =lblCifTitAlt.Width
                        Wrap: =false
                        X: |-
                          =With({n: If(nfMovil, 2, 4)},
                              gblE.Pad + Mod(7, n) * (lblCifTitAlt.Width + gblE.PadSm))
                        Y: |-
                          =With({n: If(nfMovil, 2, 4)},
                              lblDatosAlt.Y + lblDatosAlt.Height + gblE.PadSm + RoundDown(7 / n, 0) * (62 + gblE.PadSm))
                  - txtSvUsdAlt:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        AccessibleLabel: ="Saldo vencido en dólares"
                        BorderColor: =gblC.borde
                        Default: =""
                        DisplayMode: =If(varOcupadoAlt || varValidoAlt, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =gblC.card
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Format: =TextFormat.Number
                        Height: =gblE.AltoInput
                        MaxLength: =14
                        HintText: ="0.00"
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Size: =10
                        Width: =lblCifTitAlt.Width
                        X: =lblSvUsdTitAlt.X
                        Y: =lblSvUsdTitAlt.Y + 22
                  - lblTotalTitAlt:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.ink2
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =18
                        PaddingLeft: =0
                        Size: =9
                        Text: ="Total saldo vencido *"
                        Width: =lblCifTitAlt.Width
                        Wrap: =false
                        X: |-
                          =With({n: If(nfMovil, 2, 4)},
                              gblE.Pad + Mod(8, n) * (lblCifTitAlt.Width + gblE.PadSm))
                        Y: |-
                          =With({n: If(nfMovil, 2, 4)},
                              lblDatosAlt.Y + lblDatosAlt.Height + gblE.PadSm + RoundDown(8 / n, 0) * (62 + gblE.PadSm))
                  - txtTotalAlt:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        AccessibleLabel: ="Total del saldo vencido"
                        BorderColor: =gblC.borde
                        Default: =""
                        DisplayMode: =If(varOcupadoAlt || varValidoAlt, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =gblC.card
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Format: =TextFormat.Number
                        Height: =gblE.AltoInput
                        MaxLength: =14
                        HintText: ="0.00"
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Size: =10
                        Width: =lblCifTitAlt.Width
                        X: =lblTotalTitAlt.X
                        Y: =lblTotalTitAlt.Y + 22
                  - lblDiasTitAlt:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.ink2
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =18
                        PaddingLeft: =0
                        Size: =9
                        Text: ="Días de mora *"
                        Width: =lblCifTitAlt.Width
                        Wrap: =false
                        X: |-
                          =With({n: If(nfMovil, 2, 4)},
                              gblE.Pad + Mod(9, n) * (lblCifTitAlt.Width + gblE.PadSm))
                        Y: |-
                          =With({n: If(nfMovil, 2, 4)},
                              lblDatosAlt.Y + lblDatosAlt.Height + gblE.PadSm + RoundDown(9 / n, 0) * (62 + gblE.PadSm))
                  - txtDiasAlt:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        AccessibleLabel: ="Días de mora"
                        BorderColor: =gblC.borde
                        Default: =""
                        DisplayMode: =If(varOcupadoAlt || varValidoAlt, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =gblC.card
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Format: =TextFormat.Number
                        Height: =gblE.AltoInput
                        MaxLength: =6
                        HintText: ="0"
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Size: =10
                        Width: =lblCifTitAlt.Width
                        X: =lblDiasTitAlt.X
                        Y: =lblDiasTitAlt.Y + 22
                  - lblNivelTitAlt:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.ink2
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =18
                        PaddingLeft: =0
                        Size: =9
                        Text: ="Nivel de mora *"
                        Width: =lblCifTitAlt.Width
