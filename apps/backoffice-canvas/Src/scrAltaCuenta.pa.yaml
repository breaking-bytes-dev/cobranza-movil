                        Height: =gblE.AltoBoton
                        HoverFill: =ColorFade(gblC.okInk, 10%)
                        OnSelect: |-
                          =// Paso 3 · CARGA REAL, con los mismos datos que pasaron la prueba en seco (el formulario está bloqueado).
                          Set(varConfirmaAlt, false);
                          Set(varOcupadoAlt, true);
                          Set(varEsPruebaAlt, false);
