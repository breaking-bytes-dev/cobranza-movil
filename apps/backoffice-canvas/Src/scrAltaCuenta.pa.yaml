                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Visible: =!IsBlank(varProdAlt)
                        Width: =lblCifTitAlt.Width
                        X: =lblProdTitAlt.X
                        Y: =lblProdTitAlt.Y + 22
                      Children:
                        - lblProdSelAlt:
                            Control: Label@2.5.1
                            Properties:
                              Color: =gblC.ink
                              FocusedBorderColor: =gblC.teal
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =Parent.Height
                              PaddingLeft: =0
                              Size: =10
                              Text: =varProdAlt.'[PR] Codigo' & " · " & varProdAlt.'[PR] Tipo'
                              Width: =Parent.Width - 3*gblE.PadSm - btnCambiarProdAlt.Width
                              Wrap: =false
                              X: =gblE.PadSm
                        - btnCambiarProdAlt:
                            Control: Classic/Button@2.2.0
