                              Text: ="Cambiar"
                              Tooltip: ="Elegir otro producto"
                              Width: =80
                              X: =Parent.Width - Self.Width - gblE.PadSm
                              Y: =(Parent.Height - Self.Height) / 2
                  - lblAgeTitAlt:
