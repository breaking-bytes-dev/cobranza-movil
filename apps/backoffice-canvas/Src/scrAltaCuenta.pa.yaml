                        Height: =gblE.AltoBoton
                        HoverFill: =ColorFade(gblC.card, 10%)
                        OnSelect: |-
                          =// Desbloquea el formulario: cualquier cambio exige otra prueba en seco.
                          Set(varValidoAlt, false);
                          Set(varConfirmaAlt, false)
                        Size: =10
                        Text: ="Corregir datos"
                        Visible: =varValidoAlt && !varOcupadoAlt
                        Width: =If(nfMovil, btnValidarAlt.Width, 160)
                        X: =If(nfMovil, gblE.Pad, btnCargarAlt.X + btnCargarAlt.Width + gblE.Pad)
                        Y: =If(nfMovil, btnValidarAlt.Y + btnValidarAlt.Height + gblE.PadSm, btnValidarAlt.Y)
                  - btnLimpiarAlt:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =gblC.ink2
                        DisplayMode: =If(varOcupadoAlt, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =gblC.hairline
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoBoton
                        HoverFill: =ColorFade(gblC.hairline, -5%)
                        OnSelect: |-
                          =// Limpia el formulario entero, el número de tarjeta incluido. No toca el resultado de la última carga.
                          Set(varValidoAlt, false);
                          Set(varConfirmaAlt, false);
                          Set(varProdAlt, Blank());
                          Set(varAgeAlt, Blank());
                          Reset(txtCifAlt); Reset(txtCliAlt); Reset(txtPanAlt); Reset(drpProdAlt); Reset(drpAgeAlt); Set(varVerPanAlt, true); Reset(cmbTipoAlt);
                          Reset(txtSvNioAlt); Reset(txtSvUsdAlt); Reset(txtTotalAlt); Reset(txtDiasAlt); Reset(txtNivelAlt); Reset(txtFPagoAlt);
                          Reset(txtCelAlt); Reset(txtDirCasaAlt); Reset(txtTelCasaAlt); Reset(txtDirTrabAlt); Reset(txtDeptoAlt); Reset(txtDistritoAlt); Reset(txtFiadorAlt); Reset(txtDirFiadorAlt); Reset(txtNotaAlt); Reset(txtRetNioAlt); Reset(txtRetUsdAlt)
                        Size: =10
                        Text: ="Limpiar formulario"
                        Width: =If(nfMovil, btnValidarAlt.Width, 180)
                        X: =If(nfMovil, btnCargarAlt.X, Parent.Width - Self.Width - gblE.Pad)
                        Y: =If(nfMovil, btnValidarAlt.Y + btnValidarAlt.Height + gblE.PadSm, btnValidarAlt.Y)
                  - lblFaltaAlt:
                      Control: Label@2.5.1
                      Properties:
                        Color: =If(StartsWith(Self.Text, "Falta"), gblC.pendInk, gblC.okInk)
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =If(Len(Self.Text) > 110, 36, 20)
                        PaddingLeft: =0
                        Size: =9
                        Text: |-
                          =With({_d: SoloDigitos(txtPanAlt.Text),
                                 _f: Trim(txtFPagoAlt.Text)},
                              With({_falta:
                                  Concat(
                                      Filter(
                                          Table(
                                              {t: If(IsBlank(Trim(txtCifAlt.Text)), "CIF")},
                                              {t: If(!IsMatch(_d, "\d{13,19}"), "número de tarjeta (13 a 19 dígitos)", !LuhnOk(_d), "número de tarjeta que pase el verificador")},
                                              {t: If(IsBlank(varProdAlt), "producto")},
                                              {t: If(IsBlank(varAgeAlt), "localizador")},
                                              {t: If(IsBlank(cmbTipoAlt.Selected.Value), "tipo")},
                                              {t: If(IsBlank(txtSvNioAlt.Text) || IsBlank(txtSvUsdAlt.Text) || IsBlank(txtTotalAlt.Text), "saldos")},
                                              {t: If(IsBlank(txtDiasAlt.Text) || IsBlank(txtNivelAlt.Text), "mora")},
                                              /* El formato numérico deja escribir «-»; el servidor lo rechaza, aquí se avisa antes */
                                              {t: If(Value(txtSvNioAlt.Text) < 0 || Value(txtSvUsdAlt.Text) < 0 || Value(txtTotalAlt.Text) < 0
                                                     || Value(txtRetNioAlt.Text) < 0 || Value(txtRetUsdAlt.Text) < 0, "montos sin negativos")},
                                              {t: If(Value(txtSvNioAlt.Text) > 1000000000 || Value(txtSvUsdAlt.Text) > 1000000000 || Value(txtTotalAlt.Text) > 1000000000
                                                     || Value(txtRetNioAlt.Text) > 1000000000 || Value(txtRetUsdAlt.Text) > 1000000000, "montos hasta 1.000.000.000")},
                                              {t: If(Value(txtDiasAlt.Text) < 0 || Value(txtNivelAlt.Text) < 0
                                                     || Value(txtDiasAlt.Text) > 100000 || Value(txtNivelAlt.Text) > 100000
                                                     || Value(txtDiasAlt.Text) <> RoundDown(Value(txtDiasAlt.Text), 0)
                                                     || Value(txtNivelAlt.Text) <> RoundDown(Value(txtNivelAlt.Text), 0), "mora en enteros de 0 a 100.000")},
                                              {t: If(!IsBlank(_f) && !IsMatch(_f, "\d{4}-\d{2}-\d{2}"), "fecha de pago como aaaa-mm-dd")}
                                          ),
                                          !IsBlank(t)
                                      ),
                                      t, " · "
                                  )},
                                  If(IsBlank(_falta), "✓ Datos completos", "Falta o corregí: " & _falta)
                              )
                          )
                        Width: =Parent.Width - 2*gblE.Pad
                        Wrap: =false
                        X: =gblE.Pad
                        Y: =If(nfMovil, btnLimpiarAlt.Y + btnLimpiarAlt.Height, btnValidarAlt.Y + btnValidarAlt.Height) + gblE.PadSm
                  - lblPasosAlt:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.muted
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =20
                        PaddingLeft: =0
                        Size: =9
                        Text: |-
                          =If(varOcupadoAlt, "⏳ Hay un alta en curso: esperá a que Smelter termine.",
                              If(varValidoAlt,
                                  "✓ Prueba en seco limpia. El formulario quedó bloqueado con estos datos: si son correctos, tocá «Cargar de verdad».",
                                  "Para habilitar «Cargar de verdad», validá primero los datos con la prueba en seco."))
                        Width: =Parent.Width - 2*gblE.Pad
                        Wrap: =false
                        X: =gblE.Pad
                        Y: =lblFaltaAlt.Y + lblFaltaAlt.Height
                  - lblTipoAvisoAlt:
                      Control: Label@2.5.1
                      Properties:
                        Color: =If(cmbTipoAlt.Selected.Value = "Especial", gblC.espInk, gblC.pendInk)
                        Fill: =If(cmbTipoAlt.Selected.Value = "Especial", gblC.espBg, gblC.pendBg)
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =28
                        PaddingLeft: =gblE.PadSm
                        Size: =9
                        Text: |-
                          =Switch(cmbTipoAlt.Selected.Value,
                              "Diaria", "⚠ Diaria: si el banco no la trae en su próximo archivo, la reconciliación la muestra fuera de cartera y se puede cerrar.",
                              "Incobrable", "⚠ Incobrable: la reconciliación no la cierra; queda activa hasta que alguien la cierre o el banco la mande como Diaria.",
                              "Especial: entra Pendiente de aprobación. El Supervisor la aprueba en Aprobaciones.")
                        Width: =Parent.Width - 2*gblE.Pad
                        Wrap: =false
                        X: =gblE.Pad
                        Y: =lblPasosAlt.Y + lblPasosAlt.Height + 4
            - btnEnviarAlt:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =10
                  OnSelect: |-
                    =// Camino ÚNICO (prueba en seco y carga real). La Custom API sanic_cm_AltaCuenta valida todo del lado del
                    // servidor (rol Admin, Luhn, agente activo, producto, cliente y cuenta existentes), arma la fila del archivo y crea el
                    // Import Job de Smelter SIN estado. Como en «Cargar archivo», el job se pone En cola recién 20 s después (tmrAvanceAlt):
                    // con el estado puesto en el mismo instante, Smelter lo procesaría varias veces en paralelo.
                    // PCI: el número de tarjeta va directo del cuadro (enmascarado) a la API; no pasa por ninguna variable ni se muestra.
                    // Los id van como texto: la fuente Environment declara los Guid de la API como texto.
                    Set(varJobAlt, Blank());
                    Set(varAvisosAlt, "");
                    Set(varErrorAlt, "");
                    Set(varEstAlt, -1);
                    // Cada acción se verifica aparte (ver scrCargaArchivo): IfError sobre una cadena solo ve el último paso, y un rechazo
                    // de la API pasaría de largo (la pantalla seguiría por el camino de éxito con una respuesta vieja). "" = salió bien.
                    Set(varRespAlt, Blank());
                    Set(varRespAlt,
                            Environment.sanic_cm_AltaCuenta({
                                CIF: Trim(txtCifAlt.Text),
                                Cliente: Trim(txtCliAlt.Text),
                                NumeroCuenta: txtPanAlt.Text,
                                ProductoId: Text(varProdAlt.'CM | TBL | Producto'),
                                AgenteId: Text(varAgeAlt.'CM | TBL | Agente'),
                                TipoAsignacion: cmbTipoAlt.Selected.Value,
                                SaldoVencidoNIO: Value(txtSvNioAlt.Text),
                                SaldoVencidoUSD: Value(txtSvUsdAlt.Text),
                                TotalSaldoVencido: Value(txtTotalAlt.Text),
                                DiasMora: RoundDown(Value(txtDiasAlt.Text), 0),
                                NivelMora: RoundDown(Value(txtNivelAlt.Text), 0),
                                FechaPago: Trim(txtFPagoAlt.Text),
                                NumeroCelular: Trim(txtCelAlt.Text),
                                DireccionCasa: Trim(txtDirCasaAlt.Text),
                                DireccionTrabajo: Trim(txtDirTrabAlt.Text),
                                Departamento: Trim(txtDeptoAlt.Text),
                                Distrito: Trim(txtDistritoAlt.Text),
                                NumeroCasa: Trim(txtTelCasaAlt.Text),
                                NombreFianza: Trim(txtFiadorAlt.Text),
                                DireccionFianza: Trim(txtDirFiadorAlt.Text),
                                Nota: Trim(txtNotaAlt.Text),
                                RetiroNIO: If(cmbTipoAlt.Selected.Value = "Especial", Value(txtRetNioAlt.Text), Blank()),
                                RetiroUSD: If(cmbTipoAlt.Selected.Value = "Especial", Value(txtRetUsdAlt.Text), Blank()),
                                EsPrueba: varEsPruebaAlt
                            })
                    );
                    Set(varErrorAlt, IfError(If(IsBlank(varRespAlt.JobId), "el servidor no devolvió el job", Left(Text(varRespAlt.JobId), 0)), Coalesce(FirstError.Message, "sin detalle")));
                    If(IsBlank(varErrorAlt),
                        Set(varAvisosAlt, varRespAlt.Advertencias);
                        Set(varJobAlt, LookUp('TBL | SMLT | Import Jobs', 'TBL | SMLT | Import Job' = GUID(varRespAlt.JobId)));
                        Set(varErrorAlt, If(IsBlank(varJobAlt), "no se encontró el job recién creado", ""))
                    );
                    // El mensaje del servidor nunca trae el número; igual, si apareciera una secuencia de 13 dígitos, no se muestra.
                    Set(varErrorAlt,
                        If(IsMatch(varErrorAlt, "\d{13}", MatchOptions.Contains),
                            "El servidor rechazó el alta. El detalle traía un número largo y no se muestra.",
                            varErrorAlt));
                    If(IsBlank(varErrorAlt),
                        Set(varArmarAlt, DateAdd(Now(), 20, TimeUnit.Seconds));
                        Set(varVueltasAlt, 0);
                        Set(varPollAlt, true),
                        Notify("No se pudo registrar el alta: " & varErrorAlt, NotificationType.Error);
                        Set(varEstAlt, 0);
                        Set(varOcupadoAlt, false)
                    )
                  Text: ="Enviar"
                  Visible: =false
                  Width: =10
            - conConfirmAlt:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =gblC.pendInk
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =gblC.pendBg
                  Height: =btnConfirmarAlt.Y + btnConfirmarAlt.Height + gblE.PadSm
                  RadiusBottomLeft: =gblE.Radio
                  RadiusBottomRight: =gblE.Radio
                  RadiusTopLeft: =gblE.Radio
                  RadiusTopRight: =gblE.Radio
                  Visible: =varConfirmaAlt
                  Width: =Parent.Width
                  Y: =conAccionAlt.Y + conAccionAlt.Height + gblE.PadSm
                Children:
                  - lblConfirmaAlt:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.pendInk
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        PaddingLeft: =0
                        Size: =10
                        Text: |-
                          ="Vas a dar de alta la cuenta de verdad (" & cmbTipoAlt.Selected.Value & ", CIF " & Trim(txtCifAlt.Text) & "). ¿Seguimos?"
                        Width: =Parent.Width - 2*gblE.Pad
                        Wrap: =false
                        X: =gblE.Pad
                        Y: =gblE.PadSm
                  - btnConfirmarAlt:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =Color.White
                        DisabledColor: =Color.White
                        DisabledFill: =ColorFade(gblC.okInk, 60%)
                        DisplayMode: =If(varOcupadoAlt, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =gblC.okInk
                        FocusedBorderColor: =gblC.ink
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =gblE.AltoBoton
                        HoverFill: =ColorFade(gblC.okInk, 10%)
                        OnSelect: |-
                          =// Paso 3 · CARGA REAL, con los mismos datos que pasaron la prueba en seco (el formulario está bloqueado).
                          Set(varConfirmaAlt, false);
                          Set(varOcupadoAlt, true);
                          Set(varEsPruebaAlt, false);
                          Set(varTipoHechaAlt, cmbTipoAlt.Selected.Value & " · CIF " & Trim(txtCifAlt.Text) & " · •••• "
                              & Right(Substitute(Substitute(txtPanAlt.Text, " ", ""), "-", ""), 4));
                          Select(btnEnviarAlt)
                        Size: =10
                        Text: ="Sí, dar de alta"
                        Width: =If(nfMovil, (Parent.Width - 3*gblE.Pad) / 2, 200)
                        X: =gblE.Pad
                        Y: =lblConfirmaAlt.Y + lblConfirmaAlt.Height + gblE.PadSm
                  - btnCancelarAlt:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =gblC.ink2
                        Fill: =gblC.hairline
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoBoton
                        HoverFill: =ColorFade(gblC.hairline, -5%)
                        OnSelect: =Set(varConfirmaAlt, false)
                        Size: =10
                        Text: ="Cancelar"
                        Width: =btnConfirmarAlt.Width
                        X: =btnConfirmarAlt.X + btnConfirmarAlt.Width + gblE.Pad
                        Y: =btnConfirmarAlt.Y
            - conResultadoAlt:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =gblC.borde
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =gblC.card
                  Height: =lblAvisosAlt.Y + If(lblAvisosAlt.Visible, lblAvisosAlt.Height, 0) + gblE.PadSm
                  RadiusBottomLeft: =gblE.Radio
                  RadiusBottomRight: =gblE.Radio
                  RadiusTopLeft: =gblE.Radio
                  RadiusTopRight: =gblE.Radio
                  Visible: =!IsBlank(varJobAlt) || !IsBlank(varHechaAlt)
                  Width: =Parent.Width
                  Y: =conConfirmAlt.Y + If(conConfirmAlt.Visible, conConfirmAlt.Height + gblE.PadSm, 0)
                Children:
                  - lblNombreJobAlt:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.ink
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =26
                        PaddingLeft: =0
                        Size: =10
                        Text: =Coalesce(varJobAlt.'[IJ] Name', "Última alta")
                        Width: =Parent.Width - 3*gblE.Pad - chpEstadoAlt.Width
                        Wrap: =false
                        X: =gblE.Pad
                        Y: =gblE.PadSm
                  - chpEstadoAlt:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: |-
                          =Switch(varEstAlt,
                              2, gblC.okInk, 3, gblC.pendInk, 4, gblC.redInk, gblC.diariaInk)
                        DisplayMode: =DisplayMode.View
                        Fill: |-
                          =Switch(varEstAlt,
                              2, gblC.okBg, 3, gblC.pendBg, 4, gblC.redBg, gblC.diariaBg)
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =26
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =9
                        Text: |-
                          =Switch(varEstAlt,
                              -1, "Preparando", 1, "Procesando", 2, "Terminada", 3, "Terminada con errores", 4, "Falló", "En cola")
                        Width: =14 + 7*Len(Self.Text)
                        X: =Parent.Width - Self.Width - gblE.Pad
                        Y: =gblE.PadSm
                  - lblContadoresAlt:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.ink2
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =22
                        PaddingLeft: =0
                        Size: =9
                        Text: |-
                          =If(varJobAlt.'[IJ] Is Dry Run', "Prueba en seco", "Carga real") & " · "
                              & Text(Coalesce(varJobAlt.'[IJ] Total Rows', 0), "#,##0") & " fila(s) · "
                              & Text(Coalesce(varJobAlt.'[IJ] Success Count', 0), "#,##0") & " éxito(s) · "
                              & Text(Coalesce(varJobAlt.'[IJ] Fail Count', 0), "#,##0") & " fallo(s)"
                        Visible: =!IsBlank(varJobAlt)
                        Width: =Parent.Width - 2*gblE.Pad
                        Wrap: =false
                        X: =gblE.Pad
                        Y: =lblNombreJobAlt.Y + lblNombreJobAlt.Height + 4
                  - lblEstadoAlt:
                      Control: Label@2.5.1
                      Properties:
                        Color: |-
                          =If(!IsBlank(varHechaAlt) && !varOcupadoAlt, gblC.okInk,
                              If(varEstAlt >= 3 || (varEstAlt = 2 && Coalesce(varJobAlt.'[IJ] Fail Count', 0) > 0), gblC.redInk, gblC.diariaInk))
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        PaddingLeft: =0
                        Size: =9
                        Text: |-
                          =If(varOcupadoAlt,
                              If(varEstAlt = -1, "⏳ Preparando: el job ya existe, en unos segundos se pone en cola.",
                                  "⏳ Smelter está trabajando; la pantalla consulta el avance cada 3 segundos."),
                              If(!IsBlank(varHechaAlt),
                                  "✓ Alta hecha: " & varHechaAlt & If(StartsWith(varHechaAlt, "Especial"), ". Quedó Pendiente de aprobación.", "."),
                                  If(varEstAlt >= 3 || (varEstAlt = 2 && Coalesce(varJobAlt.'[IJ] Fail Count', 0) > 0),
                                      "Smelter marcó la fila con error. Revisá los datos o avisá a soporte con el nombre: " & varJobAlt.'[IJ] Name',
                                      If(varValidoAlt, "✓ Prueba en seco limpia.", ""))))
                        Width: =Parent.Width - 2*gblE.Pad
                        Wrap: =false
                        X: =gblE.Pad
                        Y: =lblContadoresAlt.Y + lblContadoresAlt.Height
                  - lblAvisosAlt:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.pendInk
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =18 * Max(1, CountRows(Split(varAvisosAlt, Char(10)))) + 4
                        PaddingLeft: =0
                        Size: =9
                        Text: |-
                          =Concat(Split(varAvisosAlt, Char(10)), "⚠ " & Value, Char(10))
                        VerticalAlign: =VerticalAlign.Top
                        Visible: =!IsBlank(varAvisosAlt)
                        Width: =Parent.Width - 2*gblE.Pad
                        X: =gblE.Pad
                        Y: =lblEstadoAlt.Y + lblEstadoAlt.Height + 4
      - tmrAvanceAlt:
          Control: Timer@2.1.0
          Properties:
            AutoPause: =false
            Duration: =3000
            OnTimerEnd: |-
              =// Fase 1 · armado: pasados los 20 s desde que la API creó el job (btnEnviarAlt), estado = En cola (0).
              // Fase 2 · sondeo cada ~3 s hasta que Smelter lo termine (2 Completed, 3 CompletedWithErrors, 4 Failed).
              If(!IsBlank(varArmarAlt),
                  If(Now() >= varArmarAlt,
                      // Cada acción se verifica aparte (ver scrCargaArchivo): en una cadena IfError solo ve el último paso.
                      Set(varPatEncAlt,
                          Patch('TBL | SMLT | Import Jobs', varJobAlt,
                              {'[IJ] Status': '[IJ] Status (TBL | SMLT | Import Jobs)'.Queued}
                          )
                      );
                      Set(varErrEncAlt, IfError(Left(Text(varPatEncAlt.'TBL | SMLT | Import Job'), 0), Coalesce(FirstError.Message, "sin detalle")));
                      If(IsBlank(varErrEncAlt),
                          Set(varJobAlt, varPatEncAlt);
                          Set(varArmarAlt, Blank());
                          Set(varEstAlt, 0),
                          Notify("No se pudo poner el alta en cola: " & varErrEncAlt, NotificationType.Error);
                          Set(varArmarAlt, Blank());
                          Set(varPollAlt, false);
                          Set(varOcupadoAlt, false)
                      )
                  ),
                  Refresh('TBL | SMLT | Import Jobs');
                  Set(varLeidoAlt, LookUp('TBL | SMLT | Import Jobs', 'TBL | SMLT | Import Job' = varJobAlt.'TBL | SMLT | Import Job'));
                  Set(varErrLeeAlt, IfError(Left(Text(varLeidoAlt.'TBL | SMLT | Import Job'), 0), Coalesce(FirstError.Message, "sin detalle")));
                  If(IsBlank(varErrLeeAlt),
                      Set(varJobAlt, varLeidoAlt),
                      Notify("No se pudo consultar el avance: " & varErrLeeAlt, NotificationType.Warning)
                  );
                  Set(varEstAlt,
                      Switch(varJobAlt.'[IJ] Status',
                          '[IJ] Status (TBL | SMLT | Import Jobs)'.Processing, 1, '[IJ] Status (TBL | SMLT | Import Jobs)'.Completed, 2,
                          '[IJ] Status (TBL | SMLT | Import Jobs)'.CompletedWithErrors, 3, '[IJ] Status (TBL | SMLT | Import Jobs)'.Failed, 4, 0));
                  Set(varVueltasAlt, varVueltasAlt + 1);
                  If(varEstAlt >= 2 || varVueltasAlt > 400,
                      Set(varPollAlt, false);
                      Set(varOcupadoAlt, false);
                      If(varEsPruebaAlt,
                          // Prueba en seco limpia: el formulario queda bloqueado con ESTOS datos y se habilita «Cargar de verdad».
                          Set(varValidoAlt, varEstAlt = 2 && Coalesce(varJobAlt.'[IJ] Fail Count', 0) = 0),
                          // Carga real terminada: el formulario se limpia (también el número de tarjeta).
                          If(varEstAlt = 2 && Coalesce(varJobAlt.'[IJ] Fail Count', 0) = 0,
                              Set(varHechaAlt, varTipoHechaAlt);
                              // Smelter escribe por fuera de las fuentes de la app: las otras pantallas no ven la cuenta nueva sin Refresh.
                              Refresh('CM | TBL | Cuentas');
                              Refresh('CM | TBL | Asignacions');
                              Set(varValidoAlt, false);
                              Select(btnLimpiarAlt),
                              Set(varValidoAlt, false)
                          )
                      )
                  )
              )
            Repeat: =true
            Start: =varPollAlt
            Visible: =false
      - cmpNavAlt:
          Control: CanvasComponent
          ComponentName: cmpNavLateral
