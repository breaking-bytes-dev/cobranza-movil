                              gblE.Pad + Mod(2, n) * (lblCifTitAlt.Width + gblE.PadSm))
                        Y: |-
                          =With({n: If(nfMovil, 2, 4)},
                              lblDatosAlt.Y + lblDatosAlt.Height + gblE.PadSm + RoundDown(2 / n, 0) * (62 + gblE.PadSm))
                  - txtPanAlt:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        AccessibleLabel: ="Número de tarjeta"
                        BorderColor: =gblC.borde
                        Default: =""
                        DisplayMode: =If(varOcupadoAlt || varValidoAlt, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =gblC.card
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoInput
