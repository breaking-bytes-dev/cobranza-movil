Screens:
  scrAltaCuenta:
    Properties:
      Fill: =gblC.pantalla
      OnVisible: |-
        =// DAT-20: el Admin da de alta UNA cuenta como una importación de una fila de Smelter (Custom API sanic_cm_AltaCuenta).
        // Solo Admin: la nav la muestra solo a ese rol y el servidor rechaza a cualquier otro.
        // Estado de pantalla limpio en cada visita; el número de tarjeta no sobrevive a salir de la pantalla.
        Set(varJobAlt, Blank());
        Set(varRespAlt, Blank());
        Set(varEstAlt, 0);
        Set(varArmarAlt, Blank());
        Set(varEsPruebaAlt, true);
        Set(varOcupadoAlt, false);
        Set(varPollAlt, false);
        Set(varVueltasAlt, 0);
        Set(varConfirmaAlt, false);
        Set(varValidoAlt, false);
        Set(varAvisosAlt, "");
        Set(varErrorAlt, "");
        Set(varHechaAlt, "");
        Set(varTipoHechaAlt, "");
        Reset(txtPanAlt)
    Children:
      - cmpEncAlt:
          Control: CanvasComponent
          ComponentName: cmpEncabezado
          Properties:
            Height: =If(nfMovil, gblE.AltoBarra + 84, 84)
            Subtitulo: ="Una cuenta, como una carga de una sola fila. Primero la prueba en seco y, si sale limpia, la carga real."
            Titulo: ="Alta de cuenta"
            Width: =Parent.Width - Self.X
            X: =If(nfMovil, 0, gblE.AnchoNav)
      - conContenidoAlt:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height - Self.Y - gblE.Pad
            Width: =Min(gblE.AnchoMax, Parent.Width - If(nfMovil, 0, gblE.AnchoNav) - 2*gblE.Pad)
            X: |-
              =If(nfMovil, 0, gblE.AnchoNav)
                  + Max(gblE.Pad, (Parent.Width - If(nfMovil, 0, gblE.AnchoNav) - gblE.AnchoMax) / 2)
            Y: =cmpEncAlt.Y + cmpEncAlt.Height + gblE.PadSm
          Children:
            - conFormAlt:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =gblC.borde
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =gblC.card
                  Height: |-
                    =With({n: If(nfMovil, 2, 4)},
                        lblDatosAlt.Y + lblDatosAlt.Height + gblE.PadSm
                            + RoundUp(If(cmbTipoAlt.Selected.Value = "Especial", 23, 21) / n, 0) * (62 + gblE.PadSm) + gblE.Pad)
                  RadiusBottomLeft: =gblE.Radio
                  RadiusBottomRight: =gblE.Radio
                  RadiusTopLeft: =gblE.Radio
                  RadiusTopRight: =gblE.Radio
                  Width: =Parent.Width
                Children:
                  - lblDatosAlt:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.ink
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =24
                        PaddingLeft: =0
                        Size: =11
                        Text: ="1 · Datos de la cuenta (con * son obligatorios)"
                        Width: =Parent.Width - 2*gblE.Pad
                        Wrap: =false
                        X: =gblE.Pad
                        Y: =gblE.PadSm
                  - lblCifTitAlt:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.ink2
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =18
                        PaddingLeft: =0
                        Size: =9
                        Text: ="CIF del cliente *"
                        Width: |-
                          =With({n: If(nfMovil, 2, 4)},
                              (Parent.Width - 2*gblE.Pad - (n - 1)*gblE.PadSm) / n)
                        Wrap: =false
                        X: =gblE.Pad
                        Y: |-
                          =With({n: If(nfMovil, 2, 4)},
                              lblDatosAlt.Y + lblDatosAlt.Height + gblE.PadSm + RoundDown(0 / n, 0) * (62 + gblE.PadSm))
                  - txtCifAlt:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        AccessibleLabel: ="CIF del cliente"
                        BorderColor: =gblC.borde
                        Default: =""
                        DisplayMode: =If(varOcupadoAlt || varValidoAlt, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =gblC.card
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoInput
                        HintText: ="CIF tal como lo manda el banco"
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Size: =10
                        Width: =lblCifTitAlt.Width
                        X: =lblCifTitAlt.X
                        Y: =lblCifTitAlt.Y + 22
                  - lblCliTitAlt:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.ink2
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =18
                        PaddingLeft: =0
                        Size: =9
                        Text: ="Nombre del cliente (si es nuevo)"
                        Width: =lblCifTitAlt.Width
                        Wrap: =false
                        X: |-
                          =With({n: If(nfMovil, 2, 4)},
                              gblE.Pad + Mod(1, n) * (lblCifTitAlt.Width + gblE.PadSm))
                        Y: |-
                          =With({n: If(nfMovil, 2, 4)},
                              lblDatosAlt.Y + lblDatosAlt.Height + gblE.PadSm + RoundDown(1 / n, 0) * (62 + gblE.PadSm))
                  - txtCliAlt:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        AccessibleLabel: ="Nombre del cliente"
                        BorderColor: =gblC.borde
                        Default: =""
                        DisplayMode: =If(varOcupadoAlt || varValidoAlt, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =gblC.card
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoInput
                        HintText: ="Si el CIF ya existe se usa el de Dataverse"
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Size: =10
                        Width: =lblCifTitAlt.Width
                        X: =lblCliTitAlt.X
                        Y: =lblCliTitAlt.Y + 22
                  - lblPanTitAlt:
                      Control: Label@2.5.1
