                        Size: =9
                        Text: |-
                          =Switch(varEstAlt,
                              -1, "Preparando", 1, "Procesando", 2, "Terminada", 3, "Terminada con errores", 4, "Falló", "En cola")
                        Width: =14 + 7*Len(Self.Text)
                        X: =Parent.Width - Self.Width - gblE.Pad
                        Y: =gblE.PadSm
                  - lblContadoresAlt:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.ink2
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =22
                        PaddingLeft: =0
                        Size: =9
                        Text: |-
                          =If(varJobAlt.'[IJ] Is Dry Run', "Prueba en seco", "Carga real") & " · "
                              & Text(Coalesce(varJobAlt.'[IJ] Total Rows', 0), "#,##0") & " fila(s) · "
                              & Text(Coalesce(varJobAlt.'[IJ] Success Count', 0), "#,##0") & " éxito(s) · "
                              & Text(Coalesce(varJobAlt.'[IJ] Fail Count', 0), "#,##0") & " fallo(s)"
                        Visible: =!IsBlank(varJobAlt)
                        Width: =Parent.Width - 2*gblE.Pad
                        Wrap: =false
                        X: =gblE.Pad
                        Y: =lblNombreJobAlt.Y + lblNombreJobAlt.Height + 4
                  - lblEstadoAlt:
                      Control: Label@2.5.1
                      Properties:
                        Color: |-
                          =If(!IsBlank(varHechaAlt) && !varOcupadoAlt, gblC.okInk,
                              If(varEstAlt >= 3 || (varEstAlt = 2 && Coalesce(varJobAlt.'[IJ] Fail Count', 0) > 0), gblC.redInk, gblC.diariaInk))
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        PaddingLeft: =0
                        Size: =9
                        Text: |-
                          =If(varOcupadoAlt,
                              If(varEstAlt = -1, "⏳ Preparando: el job ya existe, en unos segundos se pone en cola.",
                                  "⏳ Smelter está trabajando; la pantalla consulta el avance cada 3 segundos."),
                              If(!IsBlank(varHechaAlt),
                                  "✓ Alta hecha: " & varHechaAlt & If(StartsWith(varHechaAlt, "Especial"), ". Quedó Pendiente de aprobación.", "."),
                                  If(varEstAlt >= 3 || (varEstAlt = 2 && Coalesce(varJobAlt.'[IJ] Fail Count', 0) > 0),
                                      "Smelter marcó la fila con error. Revisá los datos o avisá a soporte con el nombre: " & varJobAlt.'[IJ] Name',
                                      If(varValidoAlt, "✓ Prueba en seco limpia.", ""))))
                        Width: =Parent.Width - 2*gblE.Pad
                        Wrap: =false
                        X: =gblE.Pad
                        Y: =lblContadoresAlt.Y + lblContadoresAlt.Height
                  - lblAvisosAlt:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.pendInk
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =18 * Max(1, CountRows(Split(varAvisosAlt, Char(10)))) + 4
                        PaddingLeft: =0
                        Size: =9
                        Text: |-
                          =Concat(Split(varAvisosAlt, Char(10)), "⚠ " & Value, Char(10))
                        VerticalAlign: =VerticalAlign.Top
                        Visible: =!IsBlank(varAvisosAlt)
                        Width: =Parent.Width - 2*gblE.Pad
                        X: =gblE.Pad
                        Y: =lblEstadoAlt.Y + lblEstadoAlt.Height + 4
      - tmrAvanceAlt:
          Control: Timer@2.1.0
          Properties:
            AutoPause: =false
            Duration: =3000
            OnTimerEnd: |-
              =// Fase 1 · armado: pasados los 20 s desde que la API creó el job (btnEnviarAlt), estado = En cola (0).
              // Fase 2 · sondeo cada ~3 s hasta que Smelter lo termine (2 Completed, 3 CompletedWithErrors, 4 Failed).
              If(!IsBlank(varArmarAlt),
                  If(Now() >= varArmarAlt,
                      IfError(
                          Set(varJobAlt,
                              Patch('TBL | SMLT | Import Jobs', varJobAlt,
                                  {'[IJ] Status': '[IJ] Status (TBL | SMLT | Import Jobs)'.Queued}
                              )
                          );
                          Set(varArmarAlt, Blank());
                          Set(varEstAlt, 0),
                          Notify("No se pudo poner el alta en cola: " & FirstError.Message, NotificationType.Error);
                          Set(varArmarAlt, Blank());
                          Set(varPollAlt, false);
                          Set(varOcupadoAlt, false)
                      )
                  ),
                  Refresh('TBL | SMLT | Import Jobs');
                  IfError(
                      Set(varJobAlt, LookUp('TBL | SMLT | Import Jobs', 'TBL | SMLT | Import Job' = varJobAlt.'TBL | SMLT | Import Job')),
                      Notify("No se pudo consultar el avance: " & FirstError.Message, NotificationType.Warning)
                  );
                  Set(varEstAlt,
                      Switch(varJobAlt.'[IJ] Status',
                          '[IJ] Status (TBL | SMLT | Import Jobs)'.Processing, 1, '[IJ] Status (TBL | SMLT | Import Jobs)'.Completed, 2,
                          '[IJ] Status (TBL | SMLT | Import Jobs)'.CompletedWithErrors, 3, '[IJ] Status (TBL | SMLT | Import Jobs)'.Failed, 4, 0));
                  Set(varVueltasAlt, varVueltasAlt + 1);
                  If(varEstAlt >= 2 || varVueltasAlt > 400,
                      Set(varPollAlt, false);
                      Set(varOcupadoAlt, false);
                      If(varEsPruebaAlt,
                          // Prueba en seco limpia: el formulario queda bloqueado con ESTOS datos y se habilita «Cargar de verdad».
                          Set(varValidoAlt, varEstAlt = 2 && Coalesce(varJobAlt.'[IJ] Fail Count', 0) = 0),
                          // Carga real terminada: el formulario se limpia (también el número de tarjeta).
                          If(varEstAlt = 2 && Coalesce(varJobAlt.'[IJ] Fail Count', 0) = 0,
                              Set(varHechaAlt, varTipoHechaAlt);
                              // Smelter escribe por fuera de las fuentes de la app: las otras pantallas no ven la cuenta nueva sin Refresh.
                              Refresh('CM | TBL | Cuentas');
                              Refresh('CM | TBL | Asignacions');
                              Set(varValidoAlt, false);
                              Select(btnLimpiarAlt),
                              Set(varValidoAlt, false)
                          )
                      )
                  )
              )
            Repeat: =true
            Start: =varPollAlt
            Visible: =false
      - cmpNavAlt:
          Control: CanvasComponent
          ComponentName: cmpNavLateral
          Properties:
            Height: =Parent.Height
            RutaActiva: ="alt"
            Visible: =!nfMovil || gblNavMovilAbierta
            Width: =gblE.AnchoNav
