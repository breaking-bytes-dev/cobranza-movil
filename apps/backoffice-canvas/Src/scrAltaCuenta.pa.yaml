                          =// Productos: tabla chica. StartsWith delega; con el buscador vacío no se consulta (la galería no se ve).
                          Filter('CM | TBL | Productos',
                              StartsWith('[PR] Codigo', Trim(txtBuscarProdAlt.Text)) || StartsWith('[PR] Tipo', Trim(txtBuscarProdAlt.Text)))
