                        X: =btnValidarAlt.X + btnValidarAlt.Width + gblE.Pad
                        Y: =btnValidarAlt.Y
                  - btnCorregirAlt:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =gblC.borde
                        BorderThickness: =1
                        Color: =gblC.ink2
                        Fill: =gblC.card
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoBoton
                        HoverFill: =ColorFade(gblC.card, 10%)
                        OnSelect: |-
                          =// Desbloquea el formulario: cualquier cambio exige otra prueba en seco.
                          Set(varValidoAlt, false);
                          Set(varConfirmaAlt, false)
                        Size: =10
                        Text: ="Corregir datos"
                        Visible: =varValidoAlt && !varOcupadoAlt
                        Width: =If(nfMovil, btnValidarAlt.Width, 160)
                        X: =If(nfMovil, gblE.Pad, btnCargarAlt.X + btnCargarAlt.Width + gblE.Pad)
                        Y: =If(nfMovil, btnValidarAlt.Y + btnValidarAlt.Height + gblE.PadSm, btnValidarAlt.Y)
                  - btnLimpiarAlt:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =gblC.ink2
                        DisplayMode: =If(varOcupadoAlt, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =gblC.hairline
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoBoton
                        HoverFill: =ColorFade(gblC.hairline, -5%)
                        OnSelect: |-
                          =// Limpia el formulario entero, el número de tarjeta incluido. No toca el resultado de la última carga.
                          Set(varValidoAlt, false);
                          Set(varConfirmaAlt, false);
                          Set(varProdAlt, Blank());
                          Set(varAgeAlt, Blank());
                          Reset(txtCifAlt); Reset(txtCliAlt); Reset(txtPanAlt); Reset(txtBuscarProdAlt); Reset(txtBuscarAgeAlt); Reset(cmbTipoAlt);
                          Reset(txtSvNioAlt); Reset(txtSvUsdAlt); Reset(txtTotalAlt); Reset(txtDiasAlt); Reset(txtNivelAlt); Reset(txtFPagoAlt);
                          Reset(txtCelAlt); Reset(txtDirCasaAlt); Reset(txtTelCasaAlt); Reset(txtDirTrabAlt); Reset(txtDeptoAlt); Reset(txtDistritoAlt); Reset(txtFiadorAlt); Reset(txtDirFiadorAlt); Reset(txtNotaAlt); Reset(txtRetNioAlt); Reset(txtRetUsdAlt)
                        Size: =10
                        Text: ="Limpiar formulario"
                        Width: =If(nfMovil, btnValidarAlt.Width, 180)
                        X: =If(nfMovil, btnCargarAlt.X, Parent.Width - Self.Width - gblE.Pad)
                        Y: =If(nfMovil, btnValidarAlt.Y + btnValidarAlt.Height + gblE.PadSm, btnValidarAlt.Y)
                  - lblFaltaAlt:
                      Control: Label@2.5.1
                      Properties:
                        Color: =If(StartsWith(Self.Text, "Falta"), gblC.pendInk, gblC.okInk)
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        PaddingLeft: =0
                        Size: =9
                        Text: |-
                          =With({_d: Substitute(Substitute(Substitute(txtPanAlt.Text, " ", ""), "-", ""), ".", ""),
                                 _f: Trim(txtFPagoAlt.Text)},
                              With({_falta:
                                  Concat(
                                      Filter(
                                          Table(
                                              {t: If(IsBlank(Trim(txtCifAlt.Text)), "CIF")},
                                              {t: If(!IsMatch(_d, "\d{13,19}"), "número de tarjeta (13 a 19 dígitos)")},
                                              {t: If(IsBlank(varProdAlt), "producto")},
                                              {t: If(IsBlank(varAgeAlt), "localizador")},
                                              {t: If(IsBlank(cmbTipoAlt.Selected.Value), "tipo")},
                                              {t: If(IsBlank(txtSvNioAlt.Text) || IsBlank(txtSvUsdAlt.Text) || IsBlank(txtTotalAlt.Text), "saldos")},
                                              {t: If(IsBlank(txtDiasAlt.Text) || IsBlank(txtNivelAlt.Text), "mora")},
                                              {t: If(!IsBlank(_f) && !IsMatch(_f, "\d{4}-\d{2}-\d{2}"), "fecha de pago como aaaa-mm-dd")}
                                          ),
                                          !IsBlank(t)
                                      ),
                                      t, " · "
                                  )},
                                  If(IsBlank(_falta), "✓ Datos completos", "Falta: " & _falta)
                              )
                          )
                        Width: =Parent.Width - 2*gblE.Pad
                        Wrap: =false
                        X: =gblE.Pad
                        Y: =If(nfMovil, btnLimpiarAlt.Y + btnLimpiarAlt.Height, btnValidarAlt.Y + btnValidarAlt.Height) + gblE.PadSm
                  - lblPasosAlt:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.muted
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =20
                        PaddingLeft: =0
                        Size: =9
                        Text: |-
                          =If(varOcupadoAlt, "⏳ Hay un alta en curso: esperá a que Smelter termine.",
                              If(varValidoAlt,
                                  "✓ Prueba en seco limpia. El formulario quedó bloqueado con estos datos: si son correctos, tocá «Cargar de verdad».",
                                  "Para habilitar «Cargar de verdad», validá primero los datos con la prueba en seco."))
                        Width: =Parent.Width - 2*gblE.Pad
                        Wrap: =false
                        X: =gblE.Pad
                        Y: =lblFaltaAlt.Y + lblFaltaAlt.Height
                  - lblTipoAvisoAlt:
                      Control: Label@2.5.1
                      Properties:
                        Color: =If(cmbTipoAlt.Selected.Value = "Especial", gblC.espInk, gblC.pendInk)
                        Fill: =If(cmbTipoAlt.Selected.Value = "Especial", gblC.espBg, gblC.pendBg)
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =28
                        PaddingLeft: =gblE.PadSm
                        Size: =9
                        Text: |-
                          =Switch(cmbTipoAlt.Selected.Value,
                              "Diaria", "⚠ Diaria: si el banco no la trae en su próximo archivo, la reconciliación la muestra fuera de cartera y se puede cerrar.",
                              "Incobrable", "⚠ Incobrable: la reconciliación no la cierra; queda activa hasta que alguien la cierre o el banco la mande como Diaria.",
                              "Especial: entra Pendiente de aprobación. El Supervisor la aprueba en Aprobaciones.")
                        Width: =Parent.Width - 2*gblE.Pad
                        Wrap: =false
                        X: =gblE.Pad
                        Y: =lblPasosAlt.Y + lblPasosAlt.Height + 4
            - btnEnviarAlt:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =10
                  OnSelect: |-
                    =// Camino ÚNICO (prueba en seco y carga real). La Custom API sanic_cm_AltaCuenta (DAT-20) valida todo del lado del
                    // servidor (rol Admin, Luhn, agente activo, producto, cliente y cuenta existentes), arma la fila del archivo y crea el
                    // Import Job de Smelter SIN estado. Acá, como en «Cargar archivo», el job se pone En cola recién 20 s después (tmrAvanceAlt):
                    // con el estado puesto en el mismo instante, Smelter lo procesaba varias veces en paralelo (2026-10-12).
                    // PCI: el número de tarjeta va directo del cuadro (enmascarado) a la API; no pasa por ninguna variable ni se muestra.
                    // Los id van como texto: la fuente Environment declara los Guid de la API como texto.
                    Set(varJobAlt, Blank());
                    Set(varAvisosAlt, "");
                    Set(varErrorAlt, "");
                    Set(varEstAlt, -1);
                    IfError(
                        Set(varRespAlt,
                            Environment.sanic_cm_AltaCuenta({
                                CIF: Trim(txtCifAlt.Text),
                                Cliente: Trim(txtCliAlt.Text),
                                NumeroCuenta: txtPanAlt.Text,
                                ProductoId: Text(varProdAlt.'CM | TBL | Producto'),
                                AgenteId: Text(varAgeAlt.'CM | TBL | Agente'),
                                TipoAsignacion: cmbTipoAlt.Selected.Value,
                                SaldoVencidoNIO: Value(txtSvNioAlt.Text),
                                SaldoVencidoUSD: Value(txtSvUsdAlt.Text),
                                TotalSaldoVencido: Value(txtTotalAlt.Text),
                                DiasMora: RoundDown(Value(txtDiasAlt.Text), 0),
                                NivelMora: RoundDown(Value(txtNivelAlt.Text), 0),
                                FechaPago: Trim(txtFPagoAlt.Text),
                                NumeroCelular: Trim(txtCelAlt.Text),
                                DireccionCasa: Trim(txtDirCasaAlt.Text),
                                DireccionTrabajo: Trim(txtDirTrabAlt.Text),
                                Departamento: Trim(txtDeptoAlt.Text),
                                Distrito: Trim(txtDistritoAlt.Text),
                                NumeroCasa: Trim(txtTelCasaAlt.Text),
                                NombreFianza: Trim(txtFiadorAlt.Text),
                                DireccionFianza: Trim(txtDirFiadorAlt.Text),
                                Nota: Trim(txtNotaAlt.Text),
                                RetiroNIO: If(cmbTipoAlt.Selected.Value = "Especial", Value(txtRetNioAlt.Text), Blank()),
                                RetiroUSD: If(cmbTipoAlt.Selected.Value = "Especial", Value(txtRetUsdAlt.Text), Blank()),
                                EsPrueba: varEsPruebaAlt
                            })
                        );
                        Set(varAvisosAlt, varRespAlt.Advertencias);
                        Set(varJobAlt, LookUp('TBL | SMLT | Import Jobs', 'TBL | SMLT | Import Job' = GUID(varRespAlt.JobId)));
                        Set(varArmarAlt, DateAdd(Now(), 20, TimeUnit.Seconds));
                        Set(varVueltasAlt, 0);
                        Set(varPollAlt, true),
                        // El mensaje del servidor nunca trae el número; igual, si apareciera una secuencia de 13 dígitos, no se muestra.
                        Set(varErrorAlt,
                            If(IsMatch(FirstError.Message, "\d{13}", MatchOptions.Contains),
                                "El servidor rechazó el alta. El detalle traía un número largo y no se muestra.",
                                FirstError.Message));
                        Notify("No se pudo registrar el alta: " & varErrorAlt, NotificationType.Error);
                        Set(varEstAlt, 0);
                        Set(varOcupadoAlt, false)
                    )
                  Text: ="Enviar"
                  Visible: =false
                  Width: =10
            - conConfirmAlt:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =gblC.pendInk
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =gblC.pendBg
                  Height: =btnConfirmarAlt.Y + btnConfirmarAlt.Height + gblE.PadSm
