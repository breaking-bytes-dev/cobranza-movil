                          Select(btnEnviarAlt)
                        Size: =10
                        Text: ="Sí, dar de alta"
                        Width: =If(nfMovil, (Parent.Width - 3*gblE.Pad) / 2, 200)
                        X: =gblE.Pad
                        Y: =lblConfirmaAlt.Y + lblConfirmaAlt.Height + gblE.PadSm
                  - btnCancelarAlt:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =gblC.ink2
                        Fill: =gblC.hairline
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoBoton
                        HoverFill: =ColorFade(gblC.hairline, -5%)
                        OnSelect: =Set(varConfirmaAlt, false)
                        Size: =10
                        Text: ="Cancelar"
                        Width: =btnConfirmarAlt.Width
                        X: =btnConfirmarAlt.X + btnConfirmarAlt.Width + gblE.Pad
                        Y: =btnConfirmarAlt.Y
            - conResultadoAlt:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =gblC.borde
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =gblC.card
                  Height: =lblAvisosAlt.Y + If(lblAvisosAlt.Visible, lblAvisosAlt.Height, 0) + gblE.PadSm
                  RadiusBottomLeft: =gblE.Radio
                  RadiusBottomRight: =gblE.Radio
