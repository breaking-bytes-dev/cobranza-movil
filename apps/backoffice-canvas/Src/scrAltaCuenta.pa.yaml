                        Height: =gblE.AltoBoton
                        HoverFill: =ColorFade(gblC.teal, 10%)
                        OnSelect: |-
                          =// Paso 2 · PRUEBA EN SECO: Smelter procesa la fila sin crear nada en Cobranza Móvil.
                          Set(varOcupadoAlt, true);
                          Set(varConfirmaAlt, false);
                          Set(varEsPruebaAlt, true);
                          Set(varHechaAlt, "");
                          Select(btnEnviarAlt)
                        Size: =10
                        Text: ="Validar (prueba en seco)"
