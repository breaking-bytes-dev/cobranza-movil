                        Height: =26
                        PaddingLeft: =0
                        Size: =10
                        Text: ="Mis últimas cargas"
                        Width: =Parent.Width - 2*gblE.Pad
                        Wrap: =false
                        X: =gblE.Pad
                        Y: =gblE.PadSm
                  - galHistCar:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        AccessibleLabel: ="Mis últimas cargas de archivos del banco"
                        DisplayMode: =DisplayMode.View
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
