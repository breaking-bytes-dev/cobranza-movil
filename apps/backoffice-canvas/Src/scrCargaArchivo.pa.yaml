                              FocusedBorderColor: =gblC.teal
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              PaddingLeft: =0
                              Size: =10
                              Text: =ThisItem.'[IJ] Name'
                              Width: =Parent.TemplateWidth - 3*gblE.Pad - 150
                              Wrap: =false
                              X: =gblE.Pad
                              Y: =10
                        - lblHistContadoresCar:
                            Control: Label@2.5.1
                            Properties:
                              Color: =gblC.muted
                              FocusedBorderColor: =gblC.teal
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              Height: =20
                              PaddingLeft: =0
                              Size: =9
                              Text: |-
                                =If(IsBlank(ThisItem.'Created On'), "—", Text(ThisItem.'Created On', "dd/mm HH:mm")) & " · "
