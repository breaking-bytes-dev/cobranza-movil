                        VerticalAlign: =VerticalAlign.Top
                        Visible: =varEstCar >= 3 || (varEstCar = 2 && Coalesce(varJobCar.'[IJ] Fail Count', 0) > 0)
                        Width: =Parent.Width - 2*gblE.Pad
                        X: =gblE.Pad
                        Y: |-
                          =If(lblAvanceCar.Visible, lblAvanceCar.Y + lblAvanceCar.Height,
                              If(nfMovil, cmpKpiOmitCar.Y + cmpKpiOmitCar.Height, cmpKpiTotCar.Y + cmpKpiTotCar.Height)) + gblE.PadSm
                  - btnIrMonitoreoCar:
