                  - cmpVacioHistCar:
                      Control: CanvasComponent
                      ComponentName: cmpVacio
                      Properties:
                        Height: =160
                        Icono: ="📤"
                        Mensaje: ="Cuando cargues un archivo, queda anotado acá."
                        Titulo: ="Todavía no hay cargas tuyas"
                        Visible: =CountRows(colHistCar) = 0
                        Width: =Min(420, Parent.Width - 2*gblE.Pad)
                        X: =(Parent.Width - Self.Width) / 2
                        Y: =lblHistTituloCar.Y + lblHistTituloCar.Height + gblE.PadSm
      - tmrAvanceCar:
          Control: Timer@2.1.0
          Properties:
            AutoPause: =false
            Duration: =3000
            OnTimerEnd: |-
              =// Fase 1 · armado: pasados los 20 s desde que subió el archivo (ver btnEnviarCar), estado = En cola (0).
              // Fase 2 · sondeo cada ~3 s del job propio hasta que Smelter lo termine (2 Completed, 3 CompletedWithErrors, 4 Failed).
              // Se lee solo lo que el Operador puede leer: el job (contadores). Los logs de Smelter son del SYSTEM.
              If(!IsBlank(varArmarCar),
                  If(Now() >= varArmarCar,
                      IfError(
                          Set(varJobCar,
                              Patch('TBL | SMLT | Import Jobs', varJobCar,
                                  {'[IJ] Status': '[IJ] Status (TBL | SMLT | Import Jobs)'.Queued}
                              )
                          );
                          Set(varArmarCar, Blank());
                          Set(varEstCar, 0),
                          Notify("No se pudo poner la carga en cola: " & FirstError.Message, NotificationType.Error);
                          Set(varArmarCar, Blank());
                          Set(varPollCar, false);
                          Set(varOcupadoCar, false)
                      )
                  ),
              Refresh('TBL | SMLT | Import Jobs');
              IfError(
                  Set(varJobCar, LookUp('TBL | SMLT | Import Jobs', 'TBL | SMLT | Import Job' = varJobCar.'TBL | SMLT | Import Job')),
                  Notify("No se pudo consultar el avance: " & FirstError.Message, NotificationType.Warning)
              );
              Set(varEstCar,
                  Switch(varJobCar.'[IJ] Status',
                      '[IJ] Status (TBL | SMLT | Import Jobs)'.Processing, 1, '[IJ] Status (TBL | SMLT | Import Jobs)'.Completed, 2,
                      '[IJ] Status (TBL | SMLT | Import Jobs)'.CompletedWithErrors, 3, '[IJ] Status (TBL | SMLT | Import Jobs)'.Failed, 4, 0));
              Set(varVueltasCar, varVueltasCar + 1);
              If(varEstCar >= 2 || varVueltasCar > 400,
                  Set(varPollCar, false);
                  Set(varOcupadoCar, false);
                  // «Cargar» se habilita SOLO tras una prueba en seco Terminada y con 0 fallos, de ESTE archivo.
                  If(varEsPruebaCar,
                      If(varEstCar = 2 && Coalesce(varJobCar.'[IJ] Fail Count', 0) = 0,
                          Set(varValidadoCar, varArchivoCar),
                          Set(varValidadoCar, "")));
                  // Terminada la carga real, el archivo no se puede volver a cargar sin validarlo de nuevo.
                  If(!varEsPruebaCar, Set(varValidadoCar, ""); Reset(attArchivoCar));
                  ClearCollect(colHistCar,
                      FirstN(
                          Sort(
                              Filter('TBL | SMLT | Import Jobs', 'Created By'.User = gblUsuarioDV.User),
                              'Created On', SortOrder.Descending
                          ),
                          10
                      )
                  )
              )
              )
            Repeat: =true
            Start: =varPollCar
            Visible: =false
      - cmpNavCar:
          Control: CanvasComponent
          ComponentName: cmpNavLateral
          Properties:
            Height: =Parent.Height
            RutaActiva: ="car"
            Visible: =!nfMovil || gblNavMovilAbierta
            Width: =gblE.AnchoNav
