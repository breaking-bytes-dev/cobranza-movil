Screens:
  scrCargaArchivo:
    Properties:
      Fill: =gblC.pantalla
      OnVisible: |-
        =// Carga del archivo del banco por Smelter (sin la app model-driven de Smelter).
        // Smelter es de OTRO equipo: acá solo se LEE la plantilla y se crean/actualizan Import Jobs
        // (lo mismo que le permite el rol "Smelter Operador" a quien está en el team "CM · Admin y Carga").
        // Orden obligatorio: 1) crear el job SIN estado, 2) subir el archivo a '[IJ] Source File',
        // 3) recién ahí estado = En cola (0): el flow orquestador de Smelter dispara con estado = 0 al crear o
        // actualizar (es lo que hace el botón "Ejecutar" de Smelter).
        // Estado de pantalla limpio en cada visita (las variables persisten entre visitas).
        Set(varJobCar, Blank());
        Set(varEstCar, 0);
        Set(varArmarCar, Blank());
        Set(varEsPruebaCar, true);
        Set(varOcupadoCar, false);
        Set(varPollCar, false);
        Set(varVueltasCar, 0);
        Set(varSigueCar, false);
        Set(varConfirmaCar, false);
        Set(varValidadoCar, "");
        Set(varArchivoCar, "");
        Set(varNombreCar, "");
        Set(varNuevoCar, Blank());
        // Carga paralela (nfCargaParalela): fase del envío ("" | "partir" | "padres" | "partes" | "unico" | "fin"), jobs de
        // las partes y conteos que devuelve sanic_cm_PartirCarga. Los esquemas se definen acá, en fórmulas válidas: la de
        // btnPartirCar queda inerte mientras la foto de "Environment" no conozca la API, y no puede ser la única que los define.
        Set(varFaseCar, "");
        Set(varMsgCar, "");
        Set(varFilasArchCar, 0);
        Set(varFilasPadCar, 0);
        Set(varPartidoCar, Now());
        ClearCollect(colIdsParCar, {Id: GUID()});
        Clear(colIdsParCar);
        Clear(colPartesCar);
        // Plantilla "Cobranza movil" (igualdad sobre texto: delegable). Si no se ve, el usuario no está en el team.
        Set(varPlantillaCar, LookUp('TBL | SMLT | Import Templates', '[IT] Name' = "Cobranza movil"));
        // Historial propio: últimas 20 cargas que creó el usuario (Filter + Sort + FirstN: delegable). Va por 'Created By'
        // y no por dueño: el rol de Smelter llega por el team, así que el job queda a nombre del team «CM · Admin y Carga».
        // Una carga paralela son 1 + N jobs (padres y partes, con su nombre): por eso 20 y no 10.
        ClearCollect(colHistCar,
            FirstN(
                Sort(
                    Filter('TBL | SMLT | Import Jobs', 'Created By'.User = gblUsuarioDV.User),
                    'Created On', SortOrder.Descending
                ),
                20
            )
        );
        // Partes sin lanzar (opción b, 2026-10-22): las partes de una carga paralela las pone en cola ESTA pantalla cuando
        // terminan los padres. Si el usuario salió antes, quedan sin estado y Reconciliación las ve «en curso» (12 h).
        // Por cada job de padres del historial con partes sin estado: «relanzar» si los padres terminaron bien, «descartar»
        // si fallaron, terminaron con errores o nunca se pusieron en cola (más de 10 min sin estado). El vínculo es el
        // nombre que pone PartirCarga: «<nombre> · padres» y «<nombre> · parte i/N» (mismo creador: el historial es propio).
        ClearCollect(colAccionCar,
            Filter(
                ForAll(Filter(colHistCar, EndsWith('[IJ] Name', " · padres")) As J,
                    With({b: Left(J.'[IJ] Name', Len(J.'[IJ] Name') - Len(" · padres"))},
                        {
                            Id: J.'TBL | SMLT | Import Job',
                            Base: b,
                            SinLanzar: CountIf(colHistCar, StartsWith('[IJ] Name', b & " · parte ") && IsBlank('[IJ] Status')),
                            Accion: If(J.'[IJ] Status' = '[IJ] Status (TBL | SMLT | Import Jobs)'.Completed, "relanzar",
                                J.'[IJ] Status' = '[IJ] Status (TBL | SMLT | Import Jobs)'.Failed
                                    || J.'[IJ] Status' = '[IJ] Status (TBL | SMLT | Import Jobs)'.CompletedWithErrors
                                    || (IsBlank(J.'[IJ] Status') && J.'Created On' < DateAdd(Now(), -10, TimeUnit.Minutes)), "descartar",
                                "")
                        }
                    )
                ),
                SinLanzar > 0 && Accion <> ""
            ),
            // Carga de la plantilla principal (en serie, o cuya partición no terminó) que nunca se puso en cola: sin estado
            // hace más de 10 min (la pantalla la pone en cola a los 20 s). Bloquea Reconciliación 12 h: «descartar carga».
            ForAll(
                Filter(colHistCar,
                    '[IJ] Import Template'.'TBL | SMLT | Import Template' = varPlantillaCar.'TBL | SMLT | Import Template'
                        && IsBlank('[IJ] Status') && 'Created On' < DateAdd(Now(), -10, TimeUnit.Minutes)) As J,
                {Id: J.'TBL | SMLT | Import Job', Base: "", SinLanzar: 1, Accion: "cerrar"}
            )
        );
        Reset(attArchivoCar)
    Children:
      - cmpEncCar:
          Control: CanvasComponent
          ComponentName: cmpEncabezado
          Properties:
            Height: =If(nfMovil, gblE.AltoBarra + 84, 84)
            Subtitulo: ="Primero una prueba en seco; si sale limpia, la carga real."
            Titulo: ="Cargar archivo del banco"
            Width: =Parent.Width - Self.X
            X: =If(nfMovil, 0, gblE.AnchoNav)
      - conContenidoCar:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height - Self.Y - gblE.Pad
            Width: =Min(gblE.AnchoMax, Parent.Width - If(nfMovil, 0, gblE.AnchoNav) - 2*gblE.Pad)
            X: |-
              =If(nfMovil, 0, gblE.AnchoNav)
                  + Max(gblE.Pad, (Parent.Width - If(nfMovil, 0, gblE.AnchoNav) - gblE.AnchoMax) / 2)
            Y: =cmpEncCar.Y + cmpEncCar.Height + gblE.PadSm
          Children:
            - conArchivoCar:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =gblC.borde
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =gblC.card
                  Height: =212
                  RadiusBottomLeft: =gblE.Radio
                  RadiusBottomRight: =gblE.Radio
                  RadiusTopLeft: =gblE.Radio
                  RadiusTopRight: =gblE.Radio
                  Width: =Parent.Width
                Children:
                  - lblPaso1Car:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.ink
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =24
                        PaddingLeft: =0
                        Size: =11
                        Text: ="1 · Elegí el archivo del banco"
                        Width: =Parent.Width - 2*gblE.Pad
                        Wrap: =false
                        X: =gblE.Pad
                        Y: =gblE.PadSm
                  - lblReglasCar:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.muted
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =22
                        PaddingLeft: =0
                        Size: =9
                        Text: ="Un solo archivo .csv, de hasta 128 MB. Nunca se sube nada sin pasar antes por la prueba en seco."
                        Width: =Parent.Width - 2*gblE.Pad
                        Wrap: =false
                        X: =gblE.Pad
                        Y: =lblPaso1Car.Y + lblPaso1Car.Height
                  - attArchivoCar:
                      Control: Attachments@2.3.0
                      Properties:
                        AddAttachmentText: ="＋ Elegir el archivo .csv"
                        BorderColor: =gblC.borde
                        DisplayMode: =If(varOcupadoCar, DisplayMode.Disabled, DisplayMode.Edit)
                        Height: =96
                        Items: =Blank()
                        MaxAttachments: =1
                        MaxAttachmentSize: =128
                        MaxAttachmentsText: ="Un solo archivo por carga. Para cambiarlo, quitá el actual con la ✕."
                        NoAttachmentsText: ="Todavía no elegiste ningún archivo."
                        PaddingBottom: =5
                        PaddingLeft: =5
                        PaddingRight: =5
                        PaddingTop: =5
                        Tooltip: ="Archivo del banco (.csv)"
                        Width: =Parent.Width - 2*gblE.Pad
                        X: =gblE.Pad
                        Y: =lblReglasCar.Y + lblReglasCar.Height + 6
                  - lblArchivoMsgCar:
                      Control: Label@2.5.1
                      Properties:
                        Color: |-
                          =If(CountRows(attArchivoCar.Attachments) = 0, gblC.muted,
                              If(EndsWith(Lower(First(attArchivoCar.Attachments).Name), ".csv"), gblC.okInk, gblC.redInk))
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =22
                        PaddingLeft: =0
                        Size: =9
                        Text: |-
                          =If(CountRows(attArchivoCar.Attachments) = 0, "Todavía no elegiste ningún archivo.",
                              If(EndsWith(Lower(First(attArchivoCar.Attachments).Name), ".csv"),
                                  "✓ Listo para validar: " & First(attArchivoCar.Attachments).Name,
                                  "⛔ Tiene que ser un archivo .csv: " & First(attArchivoCar.Attachments).Name))
                        Width: =Parent.Width - 2*gblE.Pad
                        Wrap: =false
                        X: =gblE.Pad
                        Y: =attArchivoCar.Y + attArchivoCar.Height + gblE.PadSm
            - conAccionCar:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =gblC.borde
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =gblC.card
                  Height: =If(nfMovil, 2*gblE.AltoBoton + 3*gblE.Pad + 40, gblE.AltoBoton + 2*gblE.Pad + 40)
                  RadiusBottomLeft: =gblE.Radio
                  RadiusBottomRight: =gblE.Radio
                  RadiusTopLeft: =gblE.Radio
                  RadiusTopRight: =gblE.Radio
                  Width: =Parent.Width
                  Y: =conArchivoCar.Y + conArchivoCar.Height + gblE.PadSm
                Children:
                  - btnValidarCar:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =Color.White
                        DisabledColor: =Color.White
                        DisabledFill: =ColorFade(gblC.teal, 60%)
                        DisplayMode: |-
                          =If(!varOcupadoCar && !IsBlank(varPlantillaCar) && CountRows(attArchivoCar.Attachments) = 1
                              && EndsWith(Lower(First(attArchivoCar.Attachments).Name), ".csv"),
                              DisplayMode.Edit, DisplayMode.Disabled)
                        Fill: =gblC.teal
                        FocusedBorderColor: =gblC.ink
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =gblE.AltoBoton
                        HoverFill: =ColorFade(gblC.teal, 10%)
                        OnSelect: |-
                          =// Paso 2 · PRUEBA EN SECO: crea un job con '[IJ] Is Dry Run' = Sí, sube el archivo y lo pone En cola
                          // (btnEnviarCar). Cero filas nuevas en Cobranza Móvil.
                          Set(varOcupadoCar, true);
                          Set(varConfirmaCar, false);
                          Set(varEsPruebaCar, true);
                          Set(varArchivoCar, First(attArchivoCar.Attachments).Name);
                          Set(varNombreCar, "Carga " & Text(Now(), "yyyy-mm-dd HH:mm") & " · " & Left(varArchivoCar, 120) & " · prueba");
                          Select(btnEnviarCar)
                        Size: =10
                        Text: ="Validar (prueba en seco)"
                        Width: =If(nfMovil, Parent.Width - 2*gblE.Pad, (Parent.Width - 3*gblE.Pad) / 2)
                        X: =gblE.Pad
                        Y: =gblE.Pad
                  - btnCargarCar:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =gblC.okInk
                        DisabledColor: =Color.White
                        DisabledFill: =ColorFade(gblC.okBg, 60%)
                        DisplayMode: |-
                          =If(!varOcupadoCar && !IsBlank(varPlantillaCar) && !IsBlank(varValidadoCar)
                              && CountRows(attArchivoCar.Attachments) = 1
                              && First(attArchivoCar.Attachments).Name = varValidadoCar,
                              DisplayMode.Edit, DisplayMode.Disabled)
                        Fill: =gblC.okBg
                        FocusedBorderColor: =gblC.ink
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =gblE.AltoBoton
                        HoverFill: =ColorFade(gblC.okBg, 10%)
                        OnSelect: =Set(varConfirmaCar, true)
                        Size: =10
                        Text: ="Cargar"
                        Width: =btnValidarCar.Width
                        X: =If(nfMovil, gblE.Pad, btnValidarCar.X + btnValidarCar.Width + gblE.Pad)
                        Y: =If(nfMovil, btnValidarCar.Y + btnValidarCar.Height + gblE.Pad, btnValidarCar.Y)
                  - lblPasosCar:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.muted
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =40
                        PaddingLeft: =0
                        Size: =9
                        Text: |-
                          =If(IsBlank(varPlantillaCar),
                              "⛔ No se ve la plantilla de Smelter ""Cobranza movil"". Avisá a soporte: tu usuario no está en el equipo de carga.",
                              If(varOcupadoCar, "⏳ Hay una carga en curso: esperá a que termine para empezar otra.",
                                  If(IsBlank(varValidadoCar),
                                      "Para habilitar «Cargar», validá primero el archivo con la prueba en seco.",
                                      "✓ Prueba en seco limpia de «" & varValidadoCar & "». Si es el archivo correcto, tocá «Cargar».")))
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Parent.Width - 2*gblE.Pad
                        X: =gblE.Pad
                        Y: =If(nfMovil, btnCargarCar.Y + btnCargarCar.Height + gblE.PadSm, btnValidarCar.Y + btnValidarCar.Height + gblE.PadSm)
            - btnEnviarCar:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =10
                  OnSelect: |-
                    =// Camino ÚNICO de envío (lo usan la prueba en seco y la carga real). Orden obligatorio:
                    // 1) job SIN estado (con nombre, plantilla y marca de prueba), 2) archivo a la columna de archivo,
                    // 3) recién ahí estado = En cola (0), y NO en el mismo instante: lo hace tmrAvanceCar 20 s después.
                    // Por qué la espera: el disparador del orquestador de Smelter evalúa «estado = 0» sobre el registro
                    // como está CUANDO ARRANCA la corrida, no sobre el evento. Con los 3 Patch seguidos, el Create y el
                    // Update del archivo también veían estado 0 y el job se procesaba 3 veces EN PARALELO (2026-10-12:
                    // fila con «CIF duplicado»). Con la espera, esos eventos ya se evaluaron con el estado vacío.
                    // IfError (B-03): si algo falla, detalle y pantalla liberada. Un job sin estado NO dispara nada en Smelter.
                    Set(varJobCar, Blank());
                    Set(varEstCar, -1);
                    IfError(
                        Set(varNuevoCar,
                            Patch('TBL | SMLT | Import Jobs', Defaults('TBL | SMLT | Import Jobs'),
                                {
                                    '[IJ] Name': varNombreCar,
                                    '[IJ] Import Template': varPlantillaCar,
                                    '[IJ] Is Dry Run': varEsPruebaCar
                                }
                            )
                        );
                        Set(varNuevoCar,
                            Patch('TBL | SMLT | Import Jobs', varNuevoCar,
                                {
                                    '[IJ] Source File': {
                                        FileName: First(attArchivoCar.Attachments).Name,
                                        Value: First(attArchivoCar.Attachments).Value
                                    }
                                }
                            )
                        );
                        Set(varJobCar, varNuevoCar);
                        Set(varVueltasCar, 0);
                        Set(varSigueCar, false);
                        Set(varMsgCar, "");
                        Clear(colIdsParCar);
                        Clear(colPartesCar);
                        // Carga paralela: la carga REAL se parte en el servidor (btnPartirCar) antes de poner nada en cola.
                        // La prueba en seco (y la carga real con nfCargaParalela = false) sigue igual: un job, archivo entero.
                        If(!varEsPruebaCar && nfCargaParalela,
                            Set(varFaseCar, "partir");
                            Select(btnPartirCar),
                            Set(varFaseCar, "unico");
                            Set(varArmarCar, DateAdd(Now(), 20, TimeUnit.Seconds));
                            Set(varPollCar, true)
                        ),
                        Notify("No se pudo iniciar la carga: " & FirstError.Message, NotificationType.Error);
                        Set(varOcupadoCar, false)
                    )
                  Text: ="Enviar"
                  Visible: =false
                  Width: =10
            - btnPartirCar:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderThickness: =0
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =10
                  OnSelect: |-
                    =// Carga paralela, paso 1 (solo carga real con nfCargaParalela): el job ya existe SIN estado y con el
                    // archivo entero (btnEnviarCar). La Custom API sanic_cm_PartirCarga, en el servidor y con los permisos del
                    // usuario: convierte ESE job en el de PADRES (producto, fiador y agente: la última fila de cada uno; plantilla
                    // «Cobranza movil · padres», nombre «… · padres») y crea N jobs de PARTES por CIF, sin estado (plantilla
                    // «Cobranza movil · partes»). Nada queda en cola acá: el timer pone en cola los padres 20 s después
                    // (sus Create/Update ya se evaluaron con estado vacío; ver btnEnviarCar) y las partes SOLO si los padres
                    // terminan Completed. Es la ÚNICA fórmula que llama la API: si la foto de "Environment" no la conoce,
                    // queda inerte sola (las variables y colecciones se definen en OnVisible).
                    IfError(
                        Set(varRespParCar,
                            Environment.sanic_cm_PartirCarga({
                                JobId: Text(varJobCar.'TBL | SMLT | Import Job'),
                                Partes: nfPartesCarga
                            })
                        );
                        Set(varPartidoCar, Now());
                        Set(varFilasArchCar, varRespParCar.FilasArchivo);
                        Set(varFilasPadCar, varRespParCar.FilasPadres);
                        ClearCollect(colIdsParCar,
                            ForAll(Split(varRespParCar.PartesJobIds, ",") As P, {Id: GUID(P.Value)})
                        );
                        ClearCollect(colPartesCar,
                            ForAll(colIdsParCar As P,
                                LookUp('TBL | SMLT | Import Jobs', 'TBL | SMLT | Import Job' = P.Id)
                            )
                        );
                        Set(varJobCar, LookUp('TBL | SMLT | Import Jobs', 'TBL | SMLT | Import Job' = varJobCar.'TBL | SMLT | Import Job'));
                        Set(varFaseCar, "padres");
                        Set(varArmarCar, DateAdd(Now(), 20, TimeUnit.Seconds));
                        Set(varPollCar, true),
                        // Falló: la API deshace todo (el job queda como lo dejó btnEnviarCar: plantilla principal, archivo
                        // entero, sin estado). Se marca Falló para que no cuente como «carga en curso» en Reconciliación
                        // (el orquestador de Smelter solo arranca con estado = En cola, así que Falló no dispara nada).
                        Set(varErrCar,
                            If(IsMatch(FirstError.Message, "\d{13}", MatchOptions.Contains),
                                "el detalle traía un número largo y no se muestra.",
                                FirstError.Message));
                        Notify("No se pudo partir la carga: " & varErrCar, NotificationType.Error);
                        IfError(
                            With({j: LookUp('TBL | SMLT | Import Jobs', 'TBL | SMLT | Import Job' = varJobCar.'TBL | SMLT | Import Job')},
                                If(IsBlank(j.'[IJ] Status') && j.'[IJ] Import Template'.'TBL | SMLT | Import Template' = varPlantillaCar.'TBL | SMLT | Import Template',
                                    Set(varJobCar, Patch('TBL | SMLT | Import Jobs', j,
                                        {'[IJ] Status': '[IJ] Status (TBL | SMLT | Import Jobs)'.Failed}))
                                )
                            ),
                            Notify("Tampoco se pudo marcar la carga como fallida: " & FirstError.Message, NotificationType.Warning)
                        );
                        Set(varMsgCar, "No se pudo partir la carga y NO se cargó nada: " & varErrCar & " Probá de nuevo o avisá a soporte con el nombre de la carga.");
                        Set(varFaseCar, "fin");
                        Set(varEstCar, 4);
                        Set(varOcupadoCar, false)
                    )
                  Text: ="Partir"
                  Visible: =false
                  Width: =10
            - conConfirmCar:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =gblC.pendInk
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =gblC.pendBg
                  Height: =If(nfMovil, 2*gblE.AltoBoton + 3*gblE.Pad + 44, gblE.AltoBoton + 2*gblE.Pad + 44)
                  RadiusBottomLeft: =gblE.Radio
                  RadiusBottomRight: =gblE.Radio
                  RadiusTopLeft: =gblE.Radio
                  RadiusTopRight: =gblE.Radio
                  Visible: =varConfirmaCar
                  Width: =Parent.Width
                  Y: =conAccionCar.Y + conAccionCar.Height + gblE.PadSm
                Children:
                  - lblConfirmaCar:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.pendInk
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        PaddingLeft: =0
                        Size: =10
                        Text: |-
                          ="Vas a cargar «" & varValidadoCar & "» de verdad: crea y actualiza clientes, cuentas y asignaciones. ¿Seguimos?"
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Parent.Width - 2*gblE.Pad
                        X: =gblE.Pad
                        Y: =gblE.PadSm
                  - btnConfirmarCar:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =Color.White
                        DisabledColor: =Color.White
                        DisabledFill: =ColorFade(gblC.okInk, 60%)
                        DisplayMode: =If(varOcupadoCar, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =gblC.okInk
                        FocusedBorderColor: =gblC.ink
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =gblE.AltoBoton
                        HoverFill: =ColorFade(gblC.okInk, 10%)
                        OnSelect: |-
                          =// Paso 3 · CARGA REAL. Mismo camino que la prueba, con '[IJ] Is Dry Run' = No.
                          // Solo llega acá si «Cargar» estaba habilitado: el archivo elegido es el validado.
                          Set(varConfirmaCar, false);
                          Set(varOcupadoCar, true);
                          Set(varEsPruebaCar, false);
                          Set(varArchivoCar, First(attArchivoCar.Attachments).Name);
                          Set(varNombreCar, "Carga " & Text(Now(), "yyyy-mm-dd HH:mm") & " · " & Left(varArchivoCar, 120) & " · real");
                          Select(btnEnviarCar)
                        Size: =10
                        Text: ="Sí, cargar ahora"
                        Width: =If(nfMovil, Parent.Width - 2*gblE.Pad, (Parent.Width - 3*gblE.Pad) / 2)
                        X: =gblE.Pad
                        Y: =lblConfirmaCar.Y + lblConfirmaCar.Height + gblE.PadSm
                  - btnCancelarCar:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =gblC.ink2
                        Fill: =gblC.hairline
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoBoton
                        HoverFill: =ColorFade(gblC.hairline, -5%)
                        OnSelect: =Set(varConfirmaCar, false)
                        Size: =10
                        Text: ="Cancelar"
                        Width: =btnConfirmarCar.Width
                        X: =If(nfMovil, gblE.Pad, btnConfirmarCar.X + btnConfirmarCar.Width + gblE.Pad)
                        Y: =If(nfMovil, btnConfirmarCar.Y + btnConfirmarCar.Height + gblE.Pad, btnConfirmarCar.Y)
            - lblNoSalirCar:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =gblC.pendInk
                  BorderThickness: =1
                  Color: =gblC.pendInk
                  Fill: =gblC.pendBg
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =If(nfMovil, 92, 52)
                  PaddingLeft: =gblE.Pad
                  PaddingRight: =gblE.Pad
                  Size: =10
                  Text: |-
                    ="⚠ No salgas de esta pantalla hasta que arranquen las partes. Las pone en cola esta pantalla cuando termina la primera etapa; si salís antes, quedan sin lanzar y hay que relanzarlas desde «Mis últimas cargas»."
                  VerticalAlign: =VerticalAlign.Middle
                  Visible: |-
                    =// Carga paralela: desde que se parte el archivo hasta que las partes quedan en cola (fase «partes» o «fin»).
                    varFaseCar = "partir" || varFaseCar = "padres"
                  Width: =Parent.Width
                  Wrap: =true
                  Y: |-
                    =conConfirmCar.Y + If(conConfirmCar.Visible, conConfirmCar.Height + gblE.PadSm, 0)
            - conResultadoCar:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =gblC.borde
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =gblC.card
                  Height: |-
                    =gblE.PadSm + 26 + gblE.PadSm + If(nfMovil, 3*96 + 2*gblE.PadSm, 96) + gblE.PadSm
                        + If(lblFallosCar.Visible, lblFallosCar.Height + gblE.PadSm, 0)
                        + If(lblAvanceCar.Visible, lblAvanceCar.Height + gblE.PadSm, 0)
                        + If(btnIrMonitoreoCar.Visible, btnIrMonitoreoCar.Height + gblE.PadSm, 0)
                  RadiusBottomLeft: =gblE.Radio
                  RadiusBottomRight: =gblE.Radio
                  RadiusTopLeft: =gblE.Radio
                  RadiusTopRight: =gblE.Radio
                  Visible: =!IsBlank(varJobCar)
                  Width: =Parent.Width
                  Y: |-
                    =lblNoSalirCar.Y + If(lblNoSalirCar.Visible, lblNoSalirCar.Height + gblE.PadSm, 0)
                Children:
                  - lblNombreJobCar:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.ink
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =26
                        PaddingLeft: =0
                        Size: =10
                        Text: =Coalesce(varNombreCar, varJobCar.'[IJ] Name')
                        Width: =Parent.Width - 3*gblE.Pad - chpEstadoCar.Width
                        Wrap: =false
                        X: =gblE.Pad
                        Y: =gblE.PadSm
                  - chpEstadoCar:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: |-
                          =Switch(varEstCar,
                              2, gblC.okInk, 3, gblC.pendInk, 4, gblC.redInk, gblC.diariaInk)
                        DisplayMode: =DisplayMode.View
                        Fill: |-
                          =Switch(varEstCar,
                              2, gblC.okBg, 3, gblC.pendBg, 4, gblC.redBg, gblC.diariaBg)
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =26
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =9
                        Text: |-
                          =Switch(varEstCar,
                              -1, "Preparando", 1, "Procesando", 2, "Terminada", 3, "Terminada con errores", 4, "Falló", "En cola")
                        Width: =14 + 7*Len(Self.Text)
                        X: =Parent.Width - Self.Width - gblE.Pad
                        Y: =gblE.PadSm
                  - cmpKpiTotCar:
                      Control: CanvasComponent
                      ComponentName: cmpKpi
                      Properties:
                        Detalle: |-
                          =If(CountRows(colPartesCar) > 0,
                              "archivo " & Text(varFilasArchCar, "#,##0") & " · padres " & Text(varFilasPadCar, "#,##0"),
                              If(varJobCar.'[IJ] Is Dry Run', "prueba en seco", "carga real"))
                        EsHero: =false
                        Etiqueta: =If(CountRows(colPartesCar) > 0, "FILAS (PADRES + PARTES)", "FILAS DEL ARCHIVO")
                        Height: =96
                        Valor: |-
                          =// Carga paralela: suma del job de padres y de las partes (sin partes, el job único de siempre).
                          Text(Coalesce(varJobCar.'[IJ] Total Rows', 0) + Sum(colPartesCar, Coalesce('[IJ] Total Rows', 0)), "#,##0")
                        Width: =If(nfMovil, (Parent.Width - 2*gblE.Pad - gblE.PadSm) / 2, (Parent.Width - 2*gblE.Pad - 4*gblE.PadSm) / 5)
                        X: =gblE.Pad
                        Y: =lblNombreJobCar.Y + lblNombreJobCar.Height + gblE.PadSm
                  - cmpKpiProcCar:
                      Control: CanvasComponent
                      ComponentName: cmpKpi
                      Properties:
                        Detalle: ="ya leídas"
                        EsHero: =false
                        Etiqueta: ="PROCESADAS"
                        Height: =96
                        Valor: =Text(Coalesce(varJobCar.'[IJ] Processed Rows', 0) + Sum(colPartesCar, Coalesce('[IJ] Processed Rows', 0)), "#,##0")
                        Width: =cmpKpiTotCar.Width
                        X: =cmpKpiTotCar.X + cmpKpiTotCar.Width + gblE.PadSm
                        Y: =cmpKpiTotCar.Y
                  - cmpKpiOkCar:
                      Control: CanvasComponent
                      ComponentName: cmpKpi
                      Properties:
                        Detalle: ="sin problema"
                        EsHero: =false
                        Etiqueta: ="ÉXITOS"
                        Height: =96
                        Valor: =Text(Coalesce(varJobCar.'[IJ] Success Count', 0) + Sum(colPartesCar, Coalesce('[IJ] Success Count', 0)), "#,##0")
                        Width: =cmpKpiTotCar.Width
                        X: =If(nfMovil, cmpKpiTotCar.X, cmpKpiProcCar.X + cmpKpiProcCar.Width + gblE.PadSm)
                        Y: =If(nfMovil, cmpKpiTotCar.Y + cmpKpiTotCar.Height + gblE.PadSm, cmpKpiTotCar.Y)
                  - cmpKpiErrCar:
                      Control: CanvasComponent
                      ComponentName: cmpKpi
                      Properties:
                        Detalle: ="con error"
                        EsHero: =false
                        Etiqueta: ="FALLOS"
                        Height: =96
                        Valor: =Text(Coalesce(varJobCar.'[IJ] Fail Count', 0) + Sum(colPartesCar, Coalesce('[IJ] Fail Count', 0)), "#,##0")
                        Width: =cmpKpiTotCar.Width
                        X: =If(nfMovil, cmpKpiProcCar.X, cmpKpiOkCar.X + cmpKpiOkCar.Width + gblE.PadSm)
                        Y: =cmpKpiOkCar.Y
                  - cmpKpiOmitCar:
                      Control: CanvasComponent
                      ComponentName: cmpKpi
                      Properties:
                        Detalle: ="sin cambios"
                        EsHero: =false
                        Etiqueta: ="OMITIDAS"
                        Height: =96
                        Valor: =Text(Coalesce(varJobCar.'[IJ] Skipped Count', 0) + Sum(colPartesCar, Coalesce('[IJ] Skipped Count', 0)), "#,##0")
                        Width: =cmpKpiTotCar.Width
                        X: =If(nfMovil, cmpKpiTotCar.X, cmpKpiErrCar.X + cmpKpiErrCar.Width + gblE.PadSm)
                        Y: =If(nfMovil, cmpKpiOkCar.Y + cmpKpiOkCar.Height + gblE.PadSm, cmpKpiOkCar.Y)
                  - lblAvanceCar:
                      Control: Label@2.5.1
                      Properties:
                        Color: =If(varVueltasCar > 400, gblC.pendInk, gblC.diariaInk)
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =If(varVueltasCar > 400 || varFaseCar = "padres" || varFaseCar = "partes", If(nfMovil, 88, 44), 24)
                        PaddingLeft: =0
                        Size: =9
                        Text: |-
                          =If(varEstCar = -1 && varFaseCar = "partir", "⏳ Partiendo el archivo en el servidor: primero productos, fiadores y agentes; después las partes por cliente.",
                              varEstCar = -1, "⏳ Preparando la carga: el archivo ya subió, en unos segundos se pone en cola.",
                              varSigueCar, "⚠ La pantalla dejó de consultar después de 1 hora y media, pero la carga puede seguir en Smelter. Mirá su estado en «Mis últimas cargas» (se actualiza al volver a entrar) o avisá a soporte con el nombre de la carga.",
                              varVueltasCar > 400 && varFaseCar <> "padres", "⏳ Lleva más de 20 minutos y sigue en Smelter (una carga grande tarda). La pantalla consulta cada 30 segundos; si salís, el resultado queda en «Mis últimas cargas».",
                              varFaseCar = "padres", "⏳ Paso 1 de 2: productos, fiadores y agentes (" & Text(varFilasPadCar, "#,##0") & " filas), solo. Si termina bien, se lanzan las " & CountRows(colPartesCar) & " partes en paralelo.",
                              varFaseCar = "partes", "⏳ Paso 2 de 2: " & CountRows(colPartesCar) & " partes en paralelo (" & Text(varFilasArchCar, "#,##0") & " filas). La pantalla consulta el avance cada 3 segundos.",
                              "⏳ Smelter está trabajando; la pantalla consulta el avance cada 3 segundos.")
                        VerticalAlign: =VerticalAlign.Top
                        Visible: =varEstCar < 2
                        Width: =Parent.Width - 2*gblE.Pad
                        Wrap: =true
                        X: =gblE.Pad
                        Y: |-
                          =If(nfMovil, cmpKpiOmitCar.Y + cmpKpiOmitCar.Height, cmpKpiTotCar.Y + cmpKpiTotCar.Height) + gblE.PadSm
                  - lblFallosCar:
                      Control: Label@2.5.1
                      Properties:
                        Color: =If(varEstCar = 4, gblC.redInk, gblC.pendInk)
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: |-
                          =// El rechazo de PartirCarga por valores largos cita hasta 5 casos (fila, columna, largos): ~550 caracteres.
                          If(Len(varMsgCar) > 180, If(nfMovil, 240, 100), If(nfMovil, 80, 40))
                        PaddingLeft: =0
                        Size: =9
                        Text: |-
                          =With({fallos: Coalesce(varJobCar.'[IJ] Fail Count', 0) + Sum(colPartesCar, Coalesce('[IJ] Fail Count', 0))},
                              If(!IsBlank(varMsgCar), varMsgCar,
                                  fallos > 0,
                                  "Hay " & Text(fallos, "#,##0") & " filas con error. Avisá a soporte con el nombre de la carga: " & Coalesce(varNombreCar, varJobCar.'[IJ] Name'),
                                  "La carga falló antes de terminar. Avisá a soporte con el nombre de la carga: " & Coalesce(varNombreCar, varJobCar.'[IJ] Name')))
                        VerticalAlign: =VerticalAlign.Top
                        Visible: |-
                          =varEstCar >= 3 || !IsBlank(varMsgCar)
                              || (varEstCar = 2 && Coalesce(varJobCar.'[IJ] Fail Count', 0) + Sum(colPartesCar, Coalesce('[IJ] Fail Count', 0)) > 0)
                        Width: =Parent.Width - 2*gblE.Pad
                        X: =gblE.Pad
                        Y: |-
                          =If(lblAvanceCar.Visible, lblAvanceCar.Y + lblAvanceCar.Height,
                              If(nfMovil, cmpKpiOmitCar.Y + cmpKpiOmitCar.Height, cmpKpiTotCar.Y + cmpKpiTotCar.Height)) + gblE.PadSm
                  - btnIrMonitoreoCar:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =gblC.teal
                        Fill: =gblC.tealSuave
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoBoton
                        HoverFill: =ColorFade(gblC.tealSuave, 10%)
                        OnSelect: =Navigate(scrMonitoreo)
                        Size: =10
                        Text: ="📡 Ir a Monitoreo de carga"
                        Visible: =!varEsPruebaCar && varEstCar >= 2 && varEstCar <= 3
                        Width: =If(nfMovil, Parent.Width - 2*gblE.Pad, 260)
                        X: =gblE.Pad
                        Y: |-
                          =If(lblFallosCar.Visible, lblFallosCar.Y + lblFallosCar.Height,
                              If(lblAvanceCar.Visible, lblAvanceCar.Y + lblAvanceCar.Height,
                                  If(nfMovil, cmpKpiOmitCar.Y + cmpKpiOmitCar.Height, cmpKpiTotCar.Y + cmpKpiTotCar.Height))) + gblE.PadSm
            - conHistCar:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =gblC.borde
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =gblC.card
                  Height: =Max(gblE.AltoFila * 3 + 34, Parent.Height - Self.Y)
                  RadiusBottomLeft: =gblE.Radio
                  RadiusBottomRight: =gblE.Radio
                  RadiusTopLeft: =gblE.Radio
                  RadiusTopRight: =gblE.Radio
                  Width: =Parent.Width
                  Y: =conResultadoCar.Y + If(conResultadoCar.Visible, conResultadoCar.Height + gblE.PadSm, 0)
                Children:
                  - lblHistTituloCar:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.ink
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =26
                        PaddingLeft: =0
                        Size: =10
                        Text: ="Mis últimas cargas"
                        Width: =Parent.Width - 2*gblE.Pad
                        Wrap: =false
                        X: =gblE.Pad
                        Y: =gblE.PadSm
                  - galHistCar:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        AccessibleLabel: ="Mis últimas cargas de archivos del banco"
                        DisplayMode: =DisplayMode.Edit
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Height: =Parent.Height - Self.Y
                        Items: =colHistCar
                        ShowScrollbar: =false
                        TemplatePadding: =0
                        TemplateSize: =gblE.AltoFila
                        Width: =Parent.Width
                        Y: =lblHistTituloCar.Y + lblHistTituloCar.Height
                      Children:
                        - lblHistNombreCar:
                            Control: Label@2.5.1
                            Properties:
                              Color: =gblC.ink
                              FocusedBorderColor: =gblC.teal
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              PaddingLeft: =0
                              Size: =10
                              Text: =ThisItem.'[IJ] Name'
                              Width: =Parent.TemplateWidth - 3*gblE.Pad - 150 - If(btnHistAccionCar.Visible, btnHistAccionCar.Width + gblE.PadSm, 0)
                              Wrap: =false
                              X: =gblE.Pad
                              Y: =10
                        - lblHistContadoresCar:
                            Control: Label@2.5.1
                            Properties:
                              Color: =gblC.muted
                              FocusedBorderColor: =gblC.teal
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              Height: =20
                              PaddingLeft: =0
                              Size: =9
                              Text: |-
                                =If(IsBlank(ThisItem.'Created On'), "—", Text(ThisItem.'Created On', "dd/mm HH:mm")) & " · "
                                    & Text(Coalesce(ThisItem.'[IJ] Total Rows', 0), "#,##0") & " filas · "
                                    & Text(Coalesce(ThisItem.'[IJ] Success Count', 0), "#,##0") & " éxitos · "
                                    & Text(Coalesce(ThisItem.'[IJ] Fail Count', 0), "#,##0") & " fallos · "
                                    & Text(Coalesce(ThisItem.'[IJ] Skipped Count', 0), "#,##0") & " omitidas"
                              Width: =Parent.TemplateWidth - 3*gblE.Pad - 150 - If(btnHistAccionCar.Visible, btnHistAccionCar.Width + gblE.PadSm, 0)
                              Wrap: =false
                              X: =gblE.Pad
                              Y: =32
                        - chpHistEstadoCar:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderThickness: =0
                              Color: |-
                                =Switch(ThisItem.'[IJ] Status',
                                    '[IJ] Status (TBL | SMLT | Import Jobs)'.Completed, gblC.okInk, '[IJ] Status (TBL | SMLT | Import Jobs)'.CompletedWithErrors, gblC.pendInk,
                                    '[IJ] Status (TBL | SMLT | Import Jobs)'.Failed, gblC.redInk, gblC.diariaInk)
                              DisplayMode: =DisplayMode.View
                              Fill: |-
                                =Switch(ThisItem.'[IJ] Status',
                                    '[IJ] Status (TBL | SMLT | Import Jobs)'.Completed, gblC.okBg, '[IJ] Status (TBL | SMLT | Import Jobs)'.CompletedWithErrors, gblC.pendBg,
                                    '[IJ] Status (TBL | SMLT | Import Jobs)'.Failed, gblC.redBg, gblC.diariaBg)
                              FocusedBorderColor: =gblC.teal
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =26
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =8
                              Text: |-
                                =Switch(ThisItem.'[IJ] Status',
                                    '[IJ] Status (TBL | SMLT | Import Jobs)'.Processing, "Procesando", '[IJ] Status (TBL | SMLT | Import Jobs)'.Completed, "Terminada",
                                    '[IJ] Status (TBL | SMLT | Import Jobs)'.CompletedWithErrors, "Con errores", '[IJ] Status (TBL | SMLT | Import Jobs)'.Failed, "Falló",
                                    '[IJ] Status (TBL | SMLT | Import Jobs)'.Queued, "En cola", "Sin lanzar")
                              Width: =14 + 7*Len(Self.Text)
                              X: =Parent.TemplateWidth - Self.Width - gblE.Pad
                              Y: =(Parent.TemplateHeight - Self.Height) / 2
                        - btnHistAccionCar:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =If(LookUp(colAccionCar, Id = ThisItem.'TBL | SMLT | Import Job').Accion = "relanzar", gblC.teal, gblC.redInk)
                              BorderThickness: =1
                              Color: =If(LookUp(colAccionCar, Id = ThisItem.'TBL | SMLT | Import Job').Accion = "relanzar", gblC.teal, gblC.redInk)
                              DisplayMode: =If(varOcupadoCar || varPollCar, DisplayMode.Disabled, DisplayMode.Edit)
                              Fill: =If(LookUp(colAccionCar, Id = ThisItem.'TBL | SMLT | Import Job').Accion = "relanzar", gblC.tealSuave, gblC.redBg)
                              FocusedBorderColor: =gblC.ink
                              FocusedBorderThickness: =2
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =30
                              OnSelect: |-
                                =// Partes sin lanzar de una carga paralela (opción b, 2026-10-22). Se relee TODO del servidor antes de
                                // escribir: el job de padres y sus partes SIN estado (mismo creador, nombre «<nombre> · parte …»).
                                //  - Padres Terminada → partes En cola, igual que tmrAvanceCar (el orquestador de Smelter dispara con
                                //    estado = En cola; su archivo lo subió PartirCarga hace rato).
                                //  - Padres Falló / con errores / nunca en cola (> 10 min) → partes (y padres sin estado) Falló, como
                                //    hace tmrAvanceCar: Falló no dispara nada en Smelter y deja de contar «en curso» en Reconciliación.
                                //  - Carga de la plantilla principal (en serie o partición sin terminar) sin estado hace > 10 min
                                //    («cerrar»): el job mismo pasa a Falló, por el mismo motivo.
                                // Solo partes SIN estado: una parte ya en cola o procesando nunca se vuelve a tocar.
                                Set(varOcupadoCar, true);
                                Refresh('TBL | SMLT | Import Jobs');
                                Set(varAccSelCar, LookUp(colAccionCar, Id = ThisItem.'TBL | SMLT | Import Job'));
                                IfError(
                                    Set(varPadSelCar, LookUp('TBL | SMLT | Import Jobs', 'TBL | SMLT | Import Job' = varAccSelCar.Id));
                                    ClearCollect(colRelCar,
                                        If(varAccSelCar.Accion = "cerrar",
                                            // Carga de la plantilla principal sin lanzar: el job mismo, solo si sigue sin estado.
                                            Filter(
                                                Filter('TBL | SMLT | Import Jobs', 'TBL | SMLT | Import Job' = varAccSelCar.Id),
                                                IsBlank('[IJ] Status')
                                            ),
                                            Filter(
                                                Filter('TBL | SMLT | Import Jobs',
                                                    StartsWith('[IJ] Name', varAccSelCar.Base & " · parte ") && 'Created By'.User = gblUsuarioDV.User),
                                                IsBlank('[IJ] Status')
                                            )
                                        )
                                    );
                                    Set(varAccHoyCar,
                                        If(varAccSelCar.Accion = "cerrar",
                                            If(IsBlank(varPadSelCar.'[IJ] Status') && varPadSelCar.'Created On' < DateAdd(Now(), -10, TimeUnit.Minutes)
                                                && varPadSelCar.'[IJ] Import Template'.'TBL | SMLT | Import Template' = varPlantillaCar.'TBL | SMLT | Import Template',
                                                "cerrar", ""),
                                        varPadSelCar.'[IJ] Status' = '[IJ] Status (TBL | SMLT | Import Jobs)'.Completed, "relanzar",
                                            varPadSelCar.'[IJ] Status' = '[IJ] Status (TBL | SMLT | Import Jobs)'.Failed
                                                || varPadSelCar.'[IJ] Status' = '[IJ] Status (TBL | SMLT | Import Jobs)'.CompletedWithErrors
                                                || (IsBlank(varPadSelCar.'[IJ] Status') && varPadSelCar.'Created On' < DateAdd(Now(), -10, TimeUnit.Minutes)), "descartar",
                                            ""));
                                    If(varAccHoyCar <> varAccSelCar.Accion || CountRows(colRelCar) = 0,
                                        Notify("La carga cambió de estado desde que se abrió la pantalla: no se tocó nada. Revisá la lista actualizada.", NotificationType.Warning),
                                        varAccHoyCar = "relanzar",
                                        ForAll(colRelCar As P,
                                            Patch('TBL | SMLT | Import Jobs', P,
                                                {'[IJ] Status': '[IJ] Status (TBL | SMLT | Import Jobs)'.Queued})
                                        );
                                        Notify("Se pusieron en cola " & CountRows(colRelCar) & " partes. El avance se ve en esta lista al volver a entrar.", NotificationType.Success),
                                        varAccHoyCar = "cerrar",
                                        ForAll(colRelCar As P,
                                            Patch('TBL | SMLT | Import Jobs', P,
                                                {'[IJ] Status': '[IJ] Status (TBL | SMLT | Import Jobs)'.Failed})
                                        );
                                        Notify("Se descartó la carga sin lanzar: no se cargó nada de ella. Volvé a cargar el archivo.", NotificationType.Information),
                                        ForAll(colRelCar As P,
                                            Patch('TBL | SMLT | Import Jobs', P,
                                                {'[IJ] Status': '[IJ] Status (TBL | SMLT | Import Jobs)'.Failed})
                                        );
                                        If(IsBlank(varPadSelCar.'[IJ] Status'),
                                            Patch('TBL | SMLT | Import Jobs', varPadSelCar,
                                                {'[IJ] Status': '[IJ] Status (TBL | SMLT | Import Jobs)'.Failed}));
                                        Notify("Se descartaron " & CountRows(colRelCar) & " partes sin lanzar: no se cargó ninguna cuenta de esta carga. Volvé a cargar el archivo.", NotificationType.Information)
                                    ),
                                    Notify("No se pudo actualizar la carga: " & FirstError.Message, NotificationType.Error)
                                );
                                Refresh('TBL | SMLT | Import Jobs');
                                ClearCollect(colHistCar,
                                    FirstN(
                                        Sort(
                                            Filter('TBL | SMLT | Import Jobs', 'Created By'.User = gblUsuarioDV.User),
                                            'Created On', SortOrder.Descending
                                        ),
                                        20
                                    )
                                );
                                ClearCollect(colAccionCar,
                                    Filter(
                                        ForAll(Filter(colHistCar, EndsWith('[IJ] Name', " · padres")) As J,
                                            With({b: Left(J.'[IJ] Name', Len(J.'[IJ] Name') - Len(" · padres"))},
                                                {
                                                    Id: J.'TBL | SMLT | Import Job',
                                                    Base: b,
                                                    SinLanzar: CountIf(colHistCar, StartsWith('[IJ] Name', b & " · parte ") && IsBlank('[IJ] Status')),
                                                    Accion: If(J.'[IJ] Status' = '[IJ] Status (TBL | SMLT | Import Jobs)'.Completed, "relanzar",
                                                        J.'[IJ] Status' = '[IJ] Status (TBL | SMLT | Import Jobs)'.Failed
                                                            || J.'[IJ] Status' = '[IJ] Status (TBL | SMLT | Import Jobs)'.CompletedWithErrors
                                                            || (IsBlank(J.'[IJ] Status') && J.'Created On' < DateAdd(Now(), -10, TimeUnit.Minutes)), "descartar",
                                                        "")
                                                }
                                            )
                                        ),
                                        SinLanzar > 0 && Accion <> ""
                                    ),
                                    // Carga de la plantilla principal (en serie, o cuya partición no terminó) que nunca se puso en cola: sin estado
                                    // hace más de 10 min (la pantalla la pone en cola a los 20 s). Bloquea Reconciliación 12 h: «descartar carga».
                                    ForAll(
                                        Filter(colHistCar,
                                            '[IJ] Import Template'.'TBL | SMLT | Import Template' = varPlantillaCar.'TBL | SMLT | Import Template'
                                                && IsBlank('[IJ] Status') && 'Created On' < DateAdd(Now(), -10, TimeUnit.Minutes)) As J,
                                        {Id: J.'TBL | SMLT | Import Job', Base: "", SinLanzar: 1, Accion: "cerrar"}
                                    )
                                );
                                Set(varOcupadoCar, false)
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =9
                              Text: |-
                                =Switch(LookUp(colAccionCar, Id = ThisItem.'TBL | SMLT | Import Job').Accion,
                                    "relanzar", "▶ Relanzar partes (" & LookUp(colAccionCar, Id = ThisItem.'TBL | SMLT | Import Job').SinLanzar & ")",
                                    "cerrar", "✕ Descartar carga",
                                    "✕ Descartar partes (" & LookUp(colAccionCar, Id = ThisItem.'TBL | SMLT | Import Job').SinLanzar & ")")
                              Tooltip: |-
                                =Switch(LookUp(colAccionCar, Id = ThisItem.'TBL | SMLT | Import Job').Accion,
                                    "relanzar", "La primera etapa terminó bien, pero sus partes nunca se pusieron en cola (se salió de la pantalla). Las pone en cola ahora.",
                                    "cerrar", "Esta carga nunca se puso en cola (se salió de la pantalla antes de tiempo). La marca Falló para que no bloquee Reconciliación; no se cargó nada de ella.",
                                    "La primera etapa no terminó bien (o nunca arrancó): las partes no se pueden lanzar. Las marca Falló para que no bloqueen Reconciliación.")
                              Visible: =!IsBlank(LookUp(colAccionCar, Id = ThisItem.'TBL | SMLT | Import Job'))
                              Width: =14 + 7*Len(Self.Text)
                              X: =chpHistEstadoCar.X - Self.Width - gblE.PadSm
                              Y: =(Parent.TemplateHeight - Self.Height) / 2
                        - recSepHistCar:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderThickness: =0
                              DropShadow: =DropShadow.None
                              Fill: =gblC.hairline
                              Height: =1
                              Width: =Parent.TemplateWidth
                              Y: =Parent.TemplateHeight - 1
                  - cmpVacioHistCar:
                      Control: CanvasComponent
                      ComponentName: cmpVacio
                      Properties:
                        Height: =160
                        Icono: ="📤"
                        Mensaje: ="Cuando cargues un archivo, queda anotado acá."
                        Titulo: ="Todavía no hay cargas tuyas"
                        Visible: =CountRows(colHistCar) = 0
                        Width: =Min(420, Parent.Width - 2*gblE.Pad)
                        X: =(Parent.Width - Self.Width) / 2
                        Y: =lblHistTituloCar.Y + lblHistTituloCar.Height + gblE.PadSm
      - tmrAvanceCar:
          Control: Timer@2.1.0
          Properties:
            AutoPause: =false
            Duration: |-
              =// Los primeros 20 minutos cada 3 s; después cada 30 s (una carga grande sigue en Smelter: no se abandona).
              If(varVueltasCar > 400, 30000, 3000)
            OnTimerEnd: |-
              =// Fase 1 · armado: pasados los 20 s desde que subió el archivo (ver btnEnviarCar), estado = En cola (0) del job
              // único (prueba en seco, o carga real en serie) o del de PADRES (carga paralela: btnPartirCar).
              // Fase 2 · sondeo cada ~3 s hasta que Smelter termine (2 Completed, 3 CompletedWithErrors, 4 Failed).
              // Carga paralela: las PARTES se ponen en cola SOLO si los padres terminan Completed (2): producto y fiador
              // tienen que existir y estar al día antes de que las partes los busquen. Si los padres terminan con errores o
              // fallan, las partes NO se lanzan (quedan marcadas Falló, sin correr) y se avisa. Estado agregado de las partes:
              // Falló si alguna falló; Terminada con errores si alguna tuvo errores; Terminada si todas terminaron bien.
              // Se lee solo lo que el Operador puede leer: los jobs (contadores). Los logs de Smelter son del SYSTEM.
              If(!IsBlank(varArmarCar),
                  If(Now() >= varArmarCar,
                      IfError(
                          Set(varJobCar,
                              Patch('TBL | SMLT | Import Jobs', varJobCar,
                                  {'[IJ] Status': '[IJ] Status (TBL | SMLT | Import Jobs)'.Queued}
                              )
                          );
                          Set(varArmarCar, Blank());
                          Set(varEstCar, 0),
                          Notify("No se pudo poner la carga en cola: " & FirstError.Message, NotificationType.Error);
                          Set(varArmarCar, Blank());
                          Set(varPollCar, false);
                          Set(varOcupadoCar, false)
                      )
                  ),
              Refresh('TBL | SMLT | Import Jobs');
              IfError(
                  Set(varJobCar, LookUp('TBL | SMLT | Import Jobs', 'TBL | SMLT | Import Job' = varJobCar.'TBL | SMLT | Import Job'));
                  If(varFaseCar = "partes",
                      ClearCollect(colPartesCar,
                          ForAll(colIdsParCar As P,
                              LookUp('TBL | SMLT | Import Jobs', 'TBL | SMLT | Import Job' = P.Id)
                          )
                      )
                  ),
                  Notify("No se pudo consultar el avance: " & FirstError.Message, NotificationType.Warning)
              );
              // Estado del job único o del de padres.
              Set(varEstCar,
                  Switch(varJobCar.'[IJ] Status',
                      '[IJ] Status (TBL | SMLT | Import Jobs)'.Processing, 1, '[IJ] Status (TBL | SMLT | Import Jobs)'.Completed, 2,
                      '[IJ] Status (TBL | SMLT | Import Jobs)'.CompletedWithErrors, 3, '[IJ] Status (TBL | SMLT | Import Jobs)'.Failed, 4, 0));
              If(varFaseCar = "padres",
                  If(varEstCar = 2,
                      // Padres Completed: en cola las N partes, cada una al menos 20 s después de que se le subió el archivo
                      // (las subió PartirCarga, en varPartidoCar), por el mismo motivo que la espera de btnEnviarCar.
                      If(Now() >= DateAdd(varPartidoCar, 20, TimeUnit.Seconds),
                          IfError(
                              ForAll(colPartesCar As P,
                                  Patch('TBL | SMLT | Import Jobs', P,
                                      {'[IJ] Status': '[IJ] Status (TBL | SMLT | Import Jobs)'.Queued})
                              );
                              Set(varFaseCar, "partes");
                              Set(varEstCar, 0),
                              Set(varMsgCar, "Los productos, fiadores y agentes se cargaron, pero no se pudieron poner en cola las partes: " & FirstError.Message & " Avisá a soporte con el nombre de la carga.");
                              Set(varFaseCar, "fin");
                              Set(varEstCar, 4)
                          ),
                          Set(varEstCar, 1)
                      ),
                      If(varEstCar >= 3,
                          // Padres con errores o fallido: las partes NO se lanzan. Se marcan Falló (sin correr: el orquestador
                          // solo arranca con En cola) para que no queden «en curso» y bloqueen Reconciliación.
                          Set(varMsgCar,
                              "La primera etapa (productos, fiadores y agentes) " & If(varEstCar = 3, "terminó con errores", "falló")
                              & ": NO se lanzaron las " & CountRows(colPartesCar) & " partes y no se cargó ninguna cuenta. Avisá a soporte con el nombre de la carga.");
                          IfError(
                              ForAll(colPartesCar As P,
                                  Patch('TBL | SMLT | Import Jobs', P,
                                      {'[IJ] Status': '[IJ] Status (TBL | SMLT | Import Jobs)'.Failed})
                              ),
                              Notify("No se pudieron marcar las partes sin lanzar: " & FirstError.Message, NotificationType.Warning)
                          );
                          Set(varFaseCar, "fin");
                          Set(varEstCar, 4)
                      )
                  )
              );
              If(varFaseCar = "partes",
                  Set(varEstCar,
                      If(CountIf(colPartesCar,
                              '[IJ] Status' = '[IJ] Status (TBL | SMLT | Import Jobs)'.Completed
                              || '[IJ] Status' = '[IJ] Status (TBL | SMLT | Import Jobs)'.CompletedWithErrors
                              || '[IJ] Status' = '[IJ] Status (TBL | SMLT | Import Jobs)'.Failed) < CountRows(colPartesCar),
                          If(CountIf(colPartesCar, '[IJ] Status' = '[IJ] Status (TBL | SMLT | Import Jobs)'.Processing) > 0, 1, 0),
                          If(CountIf(colPartesCar, '[IJ] Status' = '[IJ] Status (TBL | SMLT | Import Jobs)'.Failed) > 0, 4,
                              If(CountIf(colPartesCar, '[IJ] Status' = '[IJ] Status (TBL | SMLT | Import Jobs)'.CompletedWithErrors) > 0, 3, 2))))
              );
              Set(varVueltasCar, varVueltasCar + 1);
              // Tope: 400 vueltas de 3 s (20 min) + 140 de 30 s (70 min) ≈ 1 h 30 min para TODA la carga (padres y partes).
              // Era 3 h 20 min con la carga en serie (6.000 filas ~100 min); con la paralela 1.000 filas tardaron ~5 min.
              // Antes se cortaba a los 20 min y la pantalla quedaba en "Procesando" sin avisar aunque Smelter seguía cargando.
              If(varEstCar < 2 && varVueltasCar > 540, Set(varSigueCar, true));
              If(varFaseCar = "fin" || (varFaseCar <> "padres" && varEstCar >= 2) || varVueltasCar > 540,
                  Set(varPollCar, false);
                  Set(varOcupadoCar, false);
                  // «Cargar» se habilita SOLO tras una prueba en seco Terminada y con 0 fallos, de ESTE archivo.
                  If(varEsPruebaCar,
                      If(varEstCar = 2 && Coalesce(varJobCar.'[IJ] Fail Count', 0) = 0,
                          Set(varValidadoCar, varArchivoCar),
                          Set(varValidadoCar, "")));
                  // Terminada la carga real, el archivo no se puede volver a cargar sin validarlo de nuevo.
                  If(!varEsPruebaCar, Set(varValidadoCar, ""); Reset(attArchivoCar));
                  ClearCollect(colHistCar,
                      FirstN(
                          Sort(
                              Filter('TBL | SMLT | Import Jobs', 'Created By'.User = gblUsuarioDV.User),
                              'Created On', SortOrder.Descending
                          ),
                          20
                      )
                  );
                  // Mismo cálculo que OnVisible (partes sin lanzar por job de padres).
                  ClearCollect(colAccionCar,
                      Filter(
                          ForAll(Filter(colHistCar, EndsWith('[IJ] Name', " · padres")) As J,
                              With({b: Left(J.'[IJ] Name', Len(J.'[IJ] Name') - Len(" · padres"))},
                                  {
                                      Id: J.'TBL | SMLT | Import Job',
                                      Base: b,
                                      SinLanzar: CountIf(colHistCar, StartsWith('[IJ] Name', b & " · parte ") && IsBlank('[IJ] Status')),
                                      Accion: If(J.'[IJ] Status' = '[IJ] Status (TBL | SMLT | Import Jobs)'.Completed, "relanzar",
                                          J.'[IJ] Status' = '[IJ] Status (TBL | SMLT | Import Jobs)'.Failed
                                              || J.'[IJ] Status' = '[IJ] Status (TBL | SMLT | Import Jobs)'.CompletedWithErrors
                                              || (IsBlank(J.'[IJ] Status') && J.'Created On' < DateAdd(Now(), -10, TimeUnit.Minutes)), "descartar",
                                          "")
                                  }
                              )
                          ),
                          SinLanzar > 0 && Accion <> ""
                      ),
                      // Carga de la plantilla principal (en serie, o cuya partición no terminó) que nunca se puso en cola: sin estado
                      // hace más de 10 min (la pantalla la pone en cola a los 20 s). Bloquea Reconciliación 12 h: «descartar carga».
                      ForAll(
                          Filter(colHistCar,
                              '[IJ] Import Template'.'TBL | SMLT | Import Template' = varPlantillaCar.'TBL | SMLT | Import Template'
                                  && IsBlank('[IJ] Status') && 'Created On' < DateAdd(Now(), -10, TimeUnit.Minutes)) As J,
                          {Id: J.'TBL | SMLT | Import Job', Base: "", SinLanzar: 1, Accion: "cerrar"}
                      )
                  )
              )
              )
            Repeat: =true
            Start: =varPollCar
            Visible: =false
      - cmpNavCar:
          Control: CanvasComponent
          ComponentName: cmpNavLateral
          Properties:
            Height: =Parent.Height
            RutaActiva: ="car"
            Visible: =!nfMovil || gblNavMovilAbierta
            Width: =gblE.AnchoNav
