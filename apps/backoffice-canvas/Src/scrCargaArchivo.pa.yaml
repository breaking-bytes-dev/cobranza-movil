                  RadiusTopLeft: =gblE.Radio
                  RadiusTopRight: =gblE.Radio
                  Width: =Parent.Width
                  Y: =conResultadoCar.Y + If(conResultadoCar.Visible, conResultadoCar.Height + gblE.PadSm, 0)
                Children:
                  - lblHistTituloCar:
