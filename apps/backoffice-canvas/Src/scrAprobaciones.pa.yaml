Screens:
  scrAprobaciones:
    Properties:
      Fill: =gblC.pantalla
      OnVisible: |-
        =// Localizador: buscador + galería (galAgeAprb, Filter directo delegado, B-04) — sin catálogo.
        // Filtros (APP-40): fecha de solicitud (por defecto SIN límite: es una cola FIFO y las más viejas van primero),
        // solicitante y un buscador de CIF, nombre del cliente o últimos 4 de la cuenta. Se conservan en la sesión.
        If(IsBlank(varPideAprb), Set(varPideAprb, "Todos los solicitantes"));
        // Solicitantes con Especiales pendientes: el Filter delega (tipo, estado y aprobación) y el Distinct sobre el lookup
        // corre en memoria sobre esas filas (hasta 2000 pendientes). Nada de «IsBlank(lookup)» en un Filter: rompe la
        // delegación de TODA la consulta (APP-40, visto en la red).
        ClearCollect(colPideAprb, {nom: "Todos los solicitantes"}, {nom: "Sin solicitante (carga)"});
        Collect(colPideAprb, ForAll(Sort(Filter(Distinct(
            Filter('CM | TBL | Asignacions',
                '[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Especial && '[AS] Estado' = true
                && '[AS] Estado de aprobacion' = 'Choice | CM | Estado aprobacion especial'.'Pendiente aprobacion'),
            '[AS] Solicitado por'.'Full Name') As D, !IsBlank(D.Value)), Value), {nom: Value}));
        Reset(drpPideAprb);
        Set(varAvisoAprb, false);
        Select(btnCargarAprb)
    Children:
      - cmpEncAprb:
          Control: CanvasComponent
          ComponentName: cmpEncabezado
          Properties:
            Height: =If(nfMovil, gblE.AltoBarra + 84, 84)
            Subtitulo: ="FIFO — asigná localizador y aprobá, o rechazá con motivo · " & CountRows(colAprobAprb) & If(CountRows(colAprobAprb) = 1, " pendiente", " pendientes") & " con estos filtros."
            Titulo: ="Aprobaciones pendientes"
            Width: =Parent.Width - Self.X
            X: =If(nfMovil, 0, gblE.AnchoNav)
      - conContenidoAprb:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height - Self.Y
            Width: =Min(gblE.AnchoMax, Parent.Width - If(nfMovil, 0, gblE.AnchoNav) - 2*gblE.Pad)
            X: |-
              =If(nfMovil, 0, gblE.AnchoNav)
                  + Max(gblE.Pad, (Parent.Width - If(nfMovil, 0, gblE.AnchoNav) - gblE.AnchoMax) / 2)
            Y: =cmpEncAprb.Y + cmpEncAprb.Height
          Children:
            - btnActualizarAprb:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =gblC.borde
                  BorderThickness: =1
                  Color: =gblC.ink2
                  Fill: =gblC.card
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  Height: =36
                  OnSelect: =Set(varAvisoAprb, true); Select(btnCargarAprb)
                  DisplayMode: =If(varCargandoAprb, DisplayMode.Disabled, DisplayMode.Edit)
                  Size: =9
                  Text: ="↻ Actualizar"
                  Width: =140
                  X: =Parent.Width - Self.Width - gblE.Pad
            - conFiltrosAprb:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  Height: =If(nfMovil, 4 * gblE.AltoInput + 3 * gblE.PadSm, If(Self.Width >= 1180, gblE.AltoInput, 2 * gblE.AltoInput + gblE.PadSm))
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =gblE.PadSm
                  LayoutWrap: =true
                  Width: =If(nfMovil, Parent.Width - 2*gblE.Pad, btnActualizarAprb.X - gblE.Pad - gblE.PadSm)
                  X: =gblE.Pad
                  Y: =If(nfMovil, btnActualizarAprb.Y + btnActualizarAprb.Height + gblE.PadSm, 0)
                Children:
                  - lblDesdeAprb:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.muted
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoInput
                        PaddingLeft: =0
                        Size: =9
                        Text: ="Pedidas del"
                        Visible: =!nfMovil
                        Width: =78
                  - dtpDesdeAprb:
                      Control: Classic/DatePicker@2.6.0
                      Properties:
                        AccessibleLabel: ="Pedidas desde (vacío = sin límite)"
                        BorderColor: =gblC.borde
                        Color: =gblC.ink
                        DefaultDate: =varDesdeAprb
                        DisplayMode: =If(varCargandoAprb, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =gblC.card
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoInput
                        OnChange: |-
                          =// Vacío = sin límite por ese lado.
                          Set(varDesdeAprb, Self.SelectedDate);
                          If(!IsBlank(varDesdeAprb) && !IsBlank(varHastaAprb) && varDesdeAprb > varHastaAprb, Set(varHastaAprb, varDesdeAprb); Reset(dtpHastaAprb));
                          Select(btnCargarAprb)
                        Size: =10
                        StartOfWeek: =StartOfWeek.Monday
                        Width: =If(nfMovil, (Parent.Width - gblE.PadSm) / 2, 150)
                  - lblHastaAprb:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.muted
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoInput
                        PaddingLeft: =0
                        Size: =9
                        Text: ="al"
                        Visible: =!nfMovil
                        Width: =18
                  - dtpHastaAprb:
                      Control: Classic/DatePicker@2.6.0
                      Properties:
                        AccessibleLabel: ="Pedidas hasta (vacío = sin límite)"
                        BorderColor: =gblC.borde
                        Color: =gblC.ink
                        DefaultDate: =varHastaAprb
                        DisplayMode: =If(varCargandoAprb, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =gblC.card
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoInput
                        OnChange: |-
                          =// Vacío = sin límite por ese lado.
                          Set(varHastaAprb, Self.SelectedDate);
                          If(!IsBlank(varDesdeAprb) && !IsBlank(varHastaAprb) && varHastaAprb < varDesdeAprb, Set(varDesdeAprb, varHastaAprb); Reset(dtpDesdeAprb));
                          Select(btnCargarAprb)
                        Size: =10
                        StartOfWeek: =StartOfWeek.Monday
                        Width: =If(nfMovil, (Parent.Width - gblE.PadSm) / 2, 150)
                  - drpPideAprb:
                      Control: Classic/DropDown@2.3.1
                      Properties:
                        AccessibleLabel: ="Solicitante"
                        BorderColor: =gblC.borde
                        BorderThickness: =1
                        ChevronBackground: =gblC.card
                        ChevronFill: =gblC.ink2
                        ChevronHoverBackground: =gblC.pantalla
                        ChevronHoverFill: =gblC.teal
                        Color: =gblC.ink
                        DisplayMode: =If(varCargandoAprb, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =gblC.card
                        FillPortions: =0
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoInput
                        HoverColor: =gblC.ink
                        HoverFill: =gblC.pantalla
                        PressedColor: =gblC.card
                        PressedFill: =gblC.teal
                        SelectionColor: =gblC.card
                        SelectionFill: =gblC.teal
                        Size: =10
                        Default: =Coalesce(varPideAprb, "Todos los solicitantes")
                        Items: =colPideAprb
                        Items.Value: =nom
                        OnChange: =Set(varPideAprb, Coalesce(Self.Selected.nom, "Todos los solicitantes")); Select(btnCargarAprb)
                        Width: =If(nfMovil, Parent.Width, 230)
                  - txtBuscaAprb:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        AccessibleLabel: ="Buscar por CIF, nombre del cliente o últimos 4 de la cuenta"
                        BorderColor: =gblC.borde
                        Default: =varBuscaAprb
                        DelayOutput: =true
                        DisplayMode: =If(varCargandoAprb, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =gblC.card
                        FillPortions: =1
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoInput
                        HintText: ="🔍 CIF, nombre del cliente o últimos 4 de la cuenta"
                        LayoutMinWidth: =240
                        OnChange: =Set(varBuscaAprb, Trim(Self.Text)); Select(btnCargarAprb)
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Size: =10
                        Width: =If(nfMovil, Parent.Width, 300)
                  - btnLimpiarAprb:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =gblC.borde
                        BorderThickness: =1
                        Color: =gblC.teal
                        DisplayMode: =If(varCargandoAprb, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =gblC.card
                        FillPortions: =0
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =gblE.AltoInput
                        OnSelect: |-
                          =Set(varDesdeAprb, Blank()); Set(varHastaAprb, Blank()); Set(varPideAprb, "Todos los solicitantes"); Set(varBuscaAprb, "");
                          Reset(dtpDesdeAprb); Reset(dtpHastaAprb); Reset(drpPideAprb); Reset(txtBuscaAprb);
                          Select(btnCargarAprb)
                        Size: =10
                        Text: ="Limpiar"
                        Tooltip: ="Sin fechas, todos los solicitantes y sin búsqueda"
                        Width: =If(nfMovil, Parent.Width, 90)
            - galAprobAprb:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  AccessibleLabel: ="Solicitudes pendientes de aprobación"
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Height: =Parent.Height - Self.Y - gblE.Pad
                  Items: =Sort(colAprobAprb, '[AS] Fecha de Asignacion', SortOrder.Ascending)
                  OnSelect: |-
                    =// Cada apertura del panel arranca sin localizador elegido y con el buscador vacío.
                    Set(varSelAprb, ThisItem);
                    Set(varAgeAprb, Blank());
                    Reset(txtBuscarAgeAprb);
                    Reset(txtMotRechAprb);
                    Set(varPanelAprb, true)
                  ShowScrollbar: =false
                  TemplateFill: =If(ThisItem.IsSelected, gblC.tealSuave, gblC.card)
                  TemplatePadding: =0
                  TemplateSize: =84
                  Width: =Parent.Width - 2*gblE.Pad
                  X: =gblE.Pad
                  Y: =Max(btnActualizarAprb.Y + btnActualizarAprb.Height, conFiltrosAprb.Y + conFiltrosAprb.Height) + gblE.PadSm
                Children:
                  - lblFilaClienteAprb:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.ink
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        PaddingLeft: =0
                        Size: =10
                        Text: =ThisItem.clienteAprb
                        Width: =If(nfMovil, Parent.TemplateWidth - 2*gblE.Pad - 170, Parent.TemplateWidth*0.32)
                        Wrap: =false
                        X: =gblE.Pad
                        Y: =8
                  - lblFilaCuentaAprb:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.muted
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =16
                        PaddingLeft: =0
                        Size: =9
                        Text: =CuentaMasc(ThisItem.ult4Aprb)
                        Width: =lblFilaClienteAprb.Width
                        Wrap: =false
                        X: =gblE.Pad
                        Y: =28
                  - lblFilaPideAprb:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.muted2
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =16
                        PaddingLeft: =0
                        Size: =8
                        Text: |-
                          ="Pide: " & ThisItem.pideAprb & " · " & Text(ThisItem.'[AS] Fecha de Asignacion', "dd/mm HH:mm")
                        Width: =lblFilaClienteAprb.Width
                        Wrap: =false
                        X: =gblE.Pad
                        Y: =46
                  - lblFilaNotasAprb:
                      Control: Label@2.5.1
                      Properties:
                        Color: =gblC.ink2
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        Height: =60
                        PaddingLeft: =0
                        Size: =9
                        Text: =ThisItem.Notas
                        VerticalAlign: =VerticalAlign.Top
                        Visible: =!nfMovil
                        Width: =Parent.TemplateWidth*0.36
                        X: =Parent.TemplateWidth*0.34
                        Y: =12
                  - lblFilaMontoAprb:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        Color: =gblC.ink
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        PaddingLeft: =0
                        PaddingRight: =0
                        Size: =10
                        Text: =Moneda(ThisItem.'Retiro NIO', ThisItem.'Retiro USD')
                        Wrap: =false
                        X: =Parent.TemplateWidth - 150 - gblE.Pad
                        Y: =14
                  - chpFilaPendAprb:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =gblC.pendInk
                        Fill: =gblC.pendBg
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =26
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =8
                        Text: ="Pendiente"
                        Width: =14 + 7*Len(Self.Text)
                        X: =Parent.TemplateWidth - Self.Width - gblE.Pad
                        Y: =44
                  - recSepAprb:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderThickness: =0
                        DropShadow: =DropShadow.None
                        Fill: =gblC.hairline
                        Height: =1
                        Width: =Parent.TemplateWidth
                        Y: =Parent.TemplateHeight - 1
                  - btnFilaAprb:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderThickness: =0
                        Color: =Color.Transparent
                        Fill: =Color.Transparent
                        FocusedBorderColor: =gblC.teal
                        FocusedBorderThickness: =2
                        Height: =Parent.TemplateHeight
                        HoverFill: =RGBA(15, 107, 107, 0.06)
                        OnSelect: =Select(Parent)
                        PressedFill: =RGBA(15, 107, 107, 0.12)
                        TabIndex: =0
                        Text: ="Revisar solicitud de " & ThisItem.clienteAprb
                        Width: =Parent.TemplateWidth
                        X: =0
                        Y: =0
            - lblCargandoAprb:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =gblC.teal
                  Fill: =RGBA(255, 255, 255, 0.88)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =galAprobAprb.Height
                  Size: =12
                  Text: ="⏳ Cargando la cola de aprobación…"
                  Visible: =varCargandoAprb
                  Width: =galAprobAprb.Width
                  X: =galAprobAprb.X
                  Y: =galAprobAprb.Y
            - cmpVacioAprb:
                Control: CanvasComponent
                ComponentName: cmpVacio
                Properties:
                  Height: =200
                  Icono: |-
                    ="🎉"
                  Mensaje: |-
                    =If(IsBlank(varDesdeAprb) && IsBlank(varHastaAprb) && varPideAprb = "Todos los solicitantes" && IsBlank(varBuscaAprb),
                        "Las solicitudes Especiales nuevas aparecen acá apenas el Solicitante las envía.",
                        "Ninguna pendiente coincide con estos filtros. Probá con otros o «Limpiar».")
                  Titulo: =If(IsBlank(varDesdeAprb) && IsBlank(varHastaAprb) && varPideAprb = "Todos los solicitantes" && IsBlank(varBuscaAprb), "Nada por aprobar", "Sin resultados")
                  Visible: =CountRows(colAprobAprb) = 0 && !varCargandoAprb
                  Width: =Min(420, Parent.Width - 2*gblE.Pad)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =galAprobAprb.Y + 80
      - btnCargarAprb:
          Control: Classic/Button@2.2.0
          Properties:
            OnSelect: |-
              =// Cola de aprobación con TODOS los filtros en el servidor (APP-40, mismo patrón que Mis solicitudes): cada cambio vuelve
              // a consultar Dataverse y el límite de 2000 filas aplica a lo que coincide. Las partes «IsBlank(var) ||» y «var = "x" &&»
              // no tocan columnas y Power Apps las resuelve antes de enviar (verificado en la red, APP-39).
              // CIF, cliente y cuenta viven en la CUENTA: primero las cuentas que coinciden (una consulta a Cuentas, hasta 50) y
              // después sus Especiales pendientes, una consulta por cuenta.
              Set(varCargandoAprb, true);
              Set(varFinAprb, If(IsBlank(varHastaAprb), Blank(), DateAdd(varHastaAprb, 1)));
              Set(varPideRecAprb, If(varPideAprb in ["Todos los solicitantes", "Sin solicitante (carga)"], Blank(), LookUp(Users, 'Full Name' = varPideAprb)));
              Set(varErrAprb, Blank());
              Clear(colAprobAprb);
              Clear(colCtaAprb);
              IfError(
                  If(IsBlank(varBuscaAprb),
                      Collect(colAprobAprb,
                          AddColumns(
                              Filter('CM | TBL | Asignacions',
                                  '[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Especial &&
                                  '[AS] Estado' = true &&  // B-18: una Especial cerrada estando pendiente no se aprueba
                                  '[AS] Estado de aprobacion' = 'Choice | CM | Estado aprobacion especial'.'Pendiente aprobacion'
                                  && (IsBlank(varDesdeAprb) || 'Created On' >= varDesdeAprb)
                                  && (IsBlank(varFinAprb) || 'Created On' < varFinAprb)
                                  && (varPideAprb = "Todos los solicitantes"
                                      || (varPideAprb = "Sin solicitante (carga)" && '[AS] Solicitado por' = Blank())
                                      || (!IsBlank(varPideRecAprb) && '[AS] Solicitado por'.User = varPideRecAprb.User))),
                              clienteAprb,
                              Upper(Coalesce(ThisRecord.'[AS] Cuenta'.'Nombre Cliente', "—")),
                              ult4Aprb, Coalesce(ThisRecord.'[AS] Cuenta'.'Últimos 4', ""),
                              prodAprb, Coalesce(ThisRecord.'[AS] Cuenta'.'Tipo Producto', "—"),
                              nioAprb, ThisRecord.'[AS] Cuenta'.'[CT] Saldo Vencido NIO',
                              usdAprb, ThisRecord.'[AS] Cuenta'.'[CT] Saldo Vencido USD',
                              pideAprb, Coalesce('[AS] Solicitado por'.'Full Name', "—")
                          )
                      ),
                      ClearCollect(colCtaAprb,
                          FirstN(Filter('CM | TBL | Cuentas',
                              StartsWith('CIF Cliente', varBuscaAprb) || varBuscaAprb in 'Nombre Cliente' || 'Últimos 4' = varBuscaAprb), 51));
                      ForAll(FirstN(colCtaAprb, 50) As C,
                          Collect(colAprobAprb,
                              AddColumns(
                                  Filter('CM | TBL | Asignacions',
                                      '[AS] Tipo' = 'Choice | CM | Tipo asignacion'.Especial &&
                                      '[AS] Estado' = true &&  // B-18: una Especial cerrada estando pendiente no se aprueba
                                      '[AS] Estado de aprobacion' = 'Choice | CM | Estado aprobacion especial'.'Pendiente aprobacion'
                                      && (IsBlank(varDesdeAprb) || 'Created On' >= varDesdeAprb)
                                      && (IsBlank(varFinAprb) || 'Created On' < varFinAprb)
                                      && (varPideAprb = "Todos los solicitantes"
                                          || (varPideAprb = "Sin solicitante (carga)" && '[AS] Solicitado por' = Blank())
                                          || (!IsBlank(varPideRecAprb) && '[AS] Solicitado por'.User = varPideRecAprb.User))
                                      && '[AS] Cuenta'.'CM | TBL | Cuenta' = C.'CM | TBL | Cuenta'),
                                  clienteAprb,
                                  Upper(Coalesce(ThisRecord.'[AS] Cuenta'.'Nombre Cliente', "—")),
                                  ult4Aprb, Coalesce(ThisRecord.'[AS] Cuenta'.'Últimos 4', ""),
                                  prodAprb, Coalesce(ThisRecord.'[AS] Cuenta'.'Tipo Producto', "—"),
                                  nioAprb, ThisRecord.'[AS] Cuenta'.'[CT] Saldo Vencido NIO',
                                  usdAprb, ThisRecord.'[AS] Cuenta'.'[CT] Saldo Vencido USD',
                                  pideAprb, Coalesce('[AS] Solicitado por'.'Full Name', "—")
                              )
                          )
                      )
                  ),
                  Set(varErrAprb, Coalesce(FirstError.Message, "sin detalle"))
              );
              If(CountRows(colAprobAprb) >= 2000,
                  Notify("Hay 2.000 o más pendientes con estos filtros y se muestran 2.000 (las más viejas primero). Acotá con fechas, solicitante o el buscador.", NotificationType.Warning));
              If(CountRows(colCtaAprb) > 50,
                  Notify("Más de 50 cuentas coinciden con la búsqueda: se buscó en las primeras 50. Escribí más del CIF o del nombre.", NotificationType.Warning));
              If(!IsBlank(varErrAprb),
                  Notify("No se pudo leer la cola: " & TextoError(varErrAprb), NotificationType.Error),
                  varAvisoAprb,
                  Notify("✓ Cola actualizada", NotificationType.Success, 2500));
              Set(varSelAprb, Blank());
              Set(varAgeAprb, Blank());
              Set(varPanelAprb, false);
              Set(varAvisoAprb, false);
              Set(varCargandoAprb, false)
            Height: =1
            Visible: =false
            Width: =1
      - recScrimAprb:
          Control: Rectangle@2.3.0
          Properties:
            AccessibleLabel: ="Cerrar panel"
            Fill: =gblC.scrim
            FocusedBorderColor: =gblC.teal
            FocusedBorderThickness: =2
            Height: =Parent.Height
            OnSelect: |-
              =Set(varPanelAprb, false);
              Set(varAgeAprb, Blank());
              Reset(txtBuscarAgeAprb)
            TabIndex: =0
            Visible: =varPanelAprb
            Width: =Parent.Width
      - conPanelAprb:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =gblC.borde
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =gblC.card
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =varPanelAprb
            Width: =If(nfMovil, Parent.Width, Min(480, Parent.Width * 0.45))
            X: =Parent.Width - Self.Width
          Children:
            - lblPanelTituloAprb:
                Control: Label@2.5.1
                Properties:
                  Color: =gblC.ink
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =28
                  PaddingLeft: =0
                  Text: ="Solicitud " & varSelAprb.'[AS] Numero'
                  Width: =Parent.Width - 2*gblE.Pad
                  Wrap: =false
                  X: =gblE.Pad
                  Y: =gblE.Pad
            - icoCerrarAprb:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: ="Cerrar panel"
                  Color: =gblC.muted
                  FocusedBorderColor: =gblC.teal
                  FocusedBorderThickness: =2
                  Height: =28
                  Icon: =Icon.Cancel
                  OnSelect: |-
                    =Set(varPanelAprb, false);
                    Set(varAgeAprb, Blank());
                    Reset(txtBuscarAgeAprb)
                  TabIndex: =0
                  Width: =28
                  X: =Parent.Width - 40
