  const pagos=p?[...document.querySelectorAll('#pagoLines .pago-line')].filter(l=>parseFloat(l.querySelector('.mn').value)>0).map(l=>({monto:parseFloat(l.querySelector('.mn').value),moneda:l.querySelector('.mo').value,recibo:l.querySelector('.rc').value.trim()})):[];
  inter.push({cid,aid,fecha:TODAY,hora:"09:41",com,pagos,datos:d});
  alert('✓ Guardado offline: interacción'+(p?' + pago(s)':'')+(d?' + actualización de datos':'')+'.\nSe sincroniza al volver la señal.');openDetalle(cid,aid,detSrc);}

function inicioHTML(){
  const today=inter.filter(h=>h.fecha===TODAY);
  let pNio=0,pUsd=0,nPagos=0;today.forEach(h=>h.pagos.forEach(p=>{if(p.moneda==='USD')pUsd+=p.monto;else pNio+=p.monto;nPagos++;}));
  const nInt=today.length,nCu=new Set(today.map(h=>h.aid)).size,nCl=new Set(today.map(h=>h.cid)).size;let rows='';
  if(inicioMode==='cliente'){const m={};today.forEach(h=>m[h.cid]=(m[h.cid]||0)+1);rows=Object.keys(m).map(cid=>{const c=clients.find(x=>x.id==cid);return `<div class="brow" onclick="openCliente(${cid},'inter','inicio')"><div><div class="bn">${c.nombre}</div><div class="bs">${c.cuentas.length} cuenta(s) en cartera</div></div><div class="rgrp"><span class="bcount">${m[cid]} interac.</span><span style="color:#cbd2d9;font-size:var(--fmd)">›</span></div></div>`;}).join('');}
  else{const m={};today.forEach(h=>m[h.aid]=(m[h.aid]||0)+1);rows=Object.keys(m).map(aid=>{let a,c;clients.forEach(cl=>cl.cuentas.forEach(cu=>{if(cu.id==aid){a=cu;c=cl;}}));return `<div class="brow" onclick="openDetalle(${c.id},${aid},'inicio','inter')"><div><div class="bn">${a.producto}</div><div class="bs">${c.nombre} · ${a.cuenta}</div></div><div class="rgrp"><span class="bcount">${m[aid]} interac.</span><span style="color:#cbd2d9;font-size:var(--fmd)">›</span></div></div>`;}).join('');}
  return `<div class="hdr"><div class="sb"><span>9:41</span><span>●●● 📶 🔋</span></div><div class="trow"><div><div class="ttl">Hola, Marvin</div><div class="sub">Martes 23 de junio</div></div><div class="hbtns">${aa}${syncPill()}</div></div></div>
   <div class="body">
     <div class="hero" onclick="openPagos()"><div class="hl">Cobrado hoy</div><div class="ha">${m2(pNio,pUsd)}</div><div class="hs">${nPagos} pago(s) · ${nInt} interacción(es) · Ver detalle ›</div></div>
     <div class="statsrow"><div class="statc"><div class="sv">${nInt}</div><div class="sl2">Interacciones</div></div><div class="statc"><div class="sv">${nCu}</div><div class="sl2">Cuentas</div></div><div class="statc"><div class="sv">${nCl}</div><div class="sl2">Clientes</div></div></div>
     <div class="resultbar"><span style="font-size:var(--fsm);color:#667085;font-weight:600">Interacciones de hoy</span><div class="gtoggle"><span class="gopt ${inicioMode==='cliente'?'active':''}" onclick="setInicioMode('cliente')">👤 Cliente</span><span class="gopt ${inicioMode==='cuenta'?'active':''}" onclick="setInicioMode('cuenta')">▤ Cuenta</span></div></div>
     ${rows||'<div class="empty">Todavía no registraste interacciones hoy.</div>'}</div>`;
}
function setInicioMode(m){inicioMode=m;showTab('inicio');}
function pagosHTML(){
  const today=inter.filter(h=>h.fecha===TODAY);let sumN=0,sumU=0;const byAcct={};
  today.forEach(h=>h.pagos.forEach(p=>{if(p.moneda==='USD')sumU+=p.monto;else sumN+=p.monto;(byAcct[h.aid]=byAcct[h.aid]||[]).push({...p,hora:h.hora});}));
  const groups=Object.keys(byAcct).map(aid=>{let a,c;clients.forEach(cl=>cl.cuentas.forEach(cu=>{if(cu.id==aid){a=cu;c=cl;}}));
    const rows=byAcct[aid].map(p=>`<div class="crow"><div class="ci"><div class="cv">${(p.moneda==='USD'?'US$ ':'C$ ')+fmt(p.monto)}</div><div class="ct2">Recibo ${p.recibo||'—'} · ${p.hora}</div></div></div>`).join('');
    return `<div class="dcard"><div class="ct">${c.nombre}</div><div class="mc" style="margin-bottom:4px">${a.producto} · ${a.cuenta}</div>${rows}</div>`;}).join('');
  return `<div class="dhdr"><button class="back" onclick="showTab('inicio')">←</button><div style="flex:1"><div class="dnm">Pagos de hoy</div><div class="dac">Por cuenta y por moneda</div></div>${aa}</div>
   <div class="body"><div class="dcard hl"><div class="dlbl">Total cobrado</div><div class="dbig">${m2(sumN,sumU)}</div></div>${groups||'<div class="empty">Sin pagos hoy.</div>'}</div>`;
}
function openPagos(){nav.style.display='none';app.innerHTML=pagosHTML();app.scrollTop=0;}
function pendItems(){return inter.filter(h=>!h.synced);}
function pendCounts(){const its=pendItems();let upd=0;its.forEach(h=>{upd+=1+(h.pagos?h.pagos.length:0)+(h.datos?1:0);});return{rows:its.length,upd};}
function syncStatus(){const p=pendCounts();if(!online)return{cls:'off',ico:'📴',t:'Sin conexión',d:p.rows?`${p.rows} captura(s) guardada(s) en el dispositivo`:'Trabajando offline · todo guardado localmente'};if(p.rows)return{cls:'pend',ico:'🔼',t:'Pendiente de subir',d:`${p.rows} captura(s) · ${p.upd} actualización(es) individual(es)`};return{cls:'ok',ico:'✓',t:'Sincronizado',d:'Todo al día con el servidor'};}
function syncPill(){const c=pendCounts(),off=!online;const dot=off?'#f59e0b':(c.rows?'#fbbf24':'#34d399');const tx=off?'Sin conexión':(c.rows?`${c.rows} pend.`:'Sincronizado');return `<div class="sync" onclick="openSync()" style="cursor:pointer"><span class="dot" style="background:${dot}"></span>${tx}</div>`;}
function syncHTML(){
  const st=syncStatus(),items=inter.filter(h=>h.fecha===TODAY),c=pendCounts();
  const list=items.map(h=>{let a,cl;clients.forEach(x=>x.cuentas.forEach(cu=>{if(cu.id===h.aid){a=cu;cl=x;}}));
    const parts=['Interacción'];if(h.pagos&&h.pagos.length)parts.push(h.pagos.length+' pago(s)');if(h.datos)parts.push('datos');
    return `<div class="brow" style="cursor:default"><div><div class="bn">${cl.nombre} · ${a.producto}</div><div class="bs">${h.hora} · ${parts.join(' + ')}</div></div>${h.synced?'<span class="pendtag okt">Nº asignado</span>':'<span class="pendtag">sin Nº aún</span>'}</div>`;}).join('');
  const canSync=online&&c.rows>0;
  return `<div class="dhdr"><button class="back" onclick="showTab(syncBack)">←</button><div style="flex:1"><div class="dnm">Sincronización</div><div class="dac">Estado de tus capturas</div></div></div>
   <div class="body">
     <div class="statbig ${st.cls}"><span class="stico">${st.ico}</span><div><div class="st1">${st.t}</div><div class="st2">${st.d}</div></div></div>
     <div class="dcard"><div class="kv"><span class="k">Conexión</span><span class="v">${online?'En línea':'Sin señal'}</span></div>
       <div class="kv"><span class="k">Última sincronización</span><span class="v">${lastSync}</span></div>
       <div class="kv"><span class="k">Pendientes por subir</span><span class="v">${c.rows} captura(s)</span></div></div>
     <button class="bigbtn" onclick="doSync()" ${canSync?'':'disabled'}>${online?'↻ Buscar actualizaciones':'Sin conexión — no se puede sincronizar'}</button>
     <div class="ct" style="margin-top:18px">Capturas de hoy</div>
     ${list||'<div class="empty">No registraste capturas hoy.</div>'}
     <div class="note2">El número <b>INT-/PAG-</b> lo asigna el <b>servidor al sincronizar</b>: por eso una captura offline aparece <b>“sin Nº aún”</b> hasta que sube. El conteo de pendientes y el forzado real de subida también viven en el <b>ícono de globo</b> de la barra nativa del player móvil (página <b>Device Status</b>) — esta pantalla es el complemento amigable dentro de la app.</div>
     <div class="demo">🧪 Demo: <span onclick="toggleOnline()" style="text-decoration:underline;cursor:pointer;font-weight:700">simular ${online?'pérdida de señal':'recuperar señal'}</span> para ver cómo cambia el estado.</div>
   </div>`;
}
function doSync(){if(!(online&&pendCounts().rows))return;inter.forEach(h=>h.synced=true);lastSync='Recién';openSync();}
function toggleOnline(){online=!online;openSync();}
function openSync(){syncBack=currentTab;nav.style.display='none';app.innerHTML=syncHTML();app.scrollTop=0;}
function openInteraccion(cid,aid){const c=clients.find(x=>x.id===cid);const a=c.cuentas.find(x=>x.id===aid);nav.style.display='none';app.innerHTML=interaccionHTML(c,a);app.scrollTop=0;validate();}

let currentTab='cartera';
function showTab(id){currentTab=id;nav.style.display='flex';nav.innerHTML=navHTML(id);
  if(id==='cartera'){app.innerHTML=carteraShell();renderList();}
  else if(id==='inicio'){app.innerHTML=inicioHTML();}
  else{app.innerHTML='<div class="hdr"><div class="sb"><span>9:41</span><span>●●● 📶 🔋</span></div><div class="trow"><div class="ttl">Mis Estadísticas</div><div class="hbtns">'+aa+'</div></div></div><div class="ph">📊 Ranking y gamificación<br>— próximamente —</div>';}
  app.scrollTop=0;}
function openCliente(id,tab,back){cliCur=id;cliTab=tab||'cuentas';cliBack=back||'cartera';nav.style.display='none';app.innerHTML=clienteHTML(clients.find(x=>x.id===id));app.scrollTop=0;}
function setCliTab(t){cliTab=t;app.innerHTML=clienteHTML(clients.find(x=>x.id===cliCur));app.scrollTop=0;}
function openDetalle(cid,aid,src,tab){detSrc=src;detCid=cid;detAid=aid;detTab=tab||'detalle';const c=clients.find(x=>x.id===cid);nav.style.display='none';app.innerHTML=detalleHTML(c,c.cuentas.find(x=>x.id===aid));app.scrollTop=0;}
function setDetTab(t){detTab=t;const c=clients.find(x=>x.id===detCid);app.innerHTML=detalleHTML(c,c.cuentas.find(x=>x.id===detAid));app.scrollTop=0;}

let curScale=+(localStorage.getItem('cmScale')||1);
function applyScale(){document.querySelector('.phone').className='phone'+(curScale>1?' s'+curScale:'');}
function setScale(n){curScale=n;localStorage.setItem('cmScale',n);applyScale();hideSheet();}
function showSheet(){document.querySelectorAll('.sopt').forEach(o=>o.classList.toggle('active',o.dataset.n===String(curScale)));document.getElementById('sheet').classList.add('show');}
function hideSheet(){document.getElementById('sheet').classList.remove('show');}
applyScale();showTab('cartera');
</script>
</body>
</html>
