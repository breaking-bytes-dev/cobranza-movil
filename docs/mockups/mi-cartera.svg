<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 820" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <clipPath id="screen"><rect x="2" y="2" width="396" height="816" rx="38"/></clipPath>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#101828" flood-opacity="0.06"/>
    </filter>
  </defs>

  <g clip-path="url(#screen)">
    <!-- screen bg -->
    <rect x="0" y="0" width="400" height="820" fill="#f2f4f7"/>

    <!-- ===== Header ===== -->
    <rect x="0" y="0" width="400" height="170" fill="#0f6b6b"/>
    <!-- status bar -->
    <text x="24" y="27" fill="#ffffff" font-size="13" font-weight="700">9:41</text>
    <g fill="#ffffff">
      <rect x="332" y="18" width="18" height="10" rx="2" fill="none" stroke="#ffffff" stroke-width="1.3"/>
      <rect x="334" y="20" width="11" height="6" rx="1"/>
      <circle cx="360" cy="23" r="3"/><circle cx="370" cy="23" r="3"/>
    </g>
    <!-- title row -->
    <text x="24" y="68" fill="#ffffff" font-size="23" font-weight="700">Mi Cartera</text>
    <text x="24" y="89" fill="#bfe3e3" font-size="12.5">24 cuentas asignadas</text>
    <!-- sync pill -->
    <rect x="284" y="50" width="98" height="24" rx="12" fill="#ffffff" fill-opacity="0.16"/>
    <circle cx="298" cy="62" r="4" fill="#34d399"/>
    <text x="308" y="66" fill="#ffffff" font-size="11">Sincronizado</text>
    <!-- total a cobrar -->
    <rect x="16" y="104" width="368" height="50" rx="12" fill="#ffffff" fill-opacity="0.12"/>
    <text x="30" y="125" fill="#bfe3e3" font-size="11">A cobrar hoy</text>
    <text x="30" y="145" fill="#ffffff" font-size="17" font-weight="700">C$ 45,320.00 &#183; US$ 1,240.00</text>

    <!-- ===== Filtro por tipo (segmentado) ===== -->
    <rect x="16" y="184" width="368" height="34" rx="17" fill="#e4e7ec"/>
    <rect x="18" y="186" width="88" height="30" rx="15" fill="#ffffff" filter="url(#cardShadow)"/>
    <text x="62" y="205" fill="#0f6b6b" font-size="12.5" font-weight="700" text-anchor="middle">Todos</text>
    <text x="154" y="205" fill="#475467" font-size="12.5" text-anchor="middle">Diaria</text>
    <text x="246" y="205" fill="#475467" font-size="11.5" text-anchor="middle">Incobrable</text>
    <text x="338" y="205" fill="#475467" font-size="12" text-anchor="middle">Especial</text>

    <!-- ===== Búsqueda ===== -->
    <rect x="16" y="230" width="368" height="38" rx="12" fill="#ffffff" stroke="#e4e7ec"/>
    <circle cx="36" cy="249" r="6" fill="none" stroke="#98a2b3" stroke-width="1.6"/>
    <line x1="41" y1="254" x2="45" y2="258" stroke="#98a2b3" stroke-width="1.6"/>
    <text x="54" y="254" fill="#98a2b3" font-size="13">Buscar cliente o cuenta&#8230;</text>

    <!-- ============ CARD 1 — Diaria ============ -->
    <g>
      <rect x="16" y="282" width="368" height="104" rx="14" fill="#ffffff" stroke="#eaecf0" filter="url(#cardShadow)"/>
      <text x="30" y="310" fill="#101828" font-size="15" font-weight="700">Carlos Cruz Salazar</text>
      <rect x="314" y="296" width="58" height="22" rx="11" fill="#dbeafe"/>
      <text x="343" y="311" fill="#2563eb" font-size="11" font-weight="700" text-anchor="middle">Diaria</text>
      <text x="30" y="328" fill="#667085" font-size="11.5">Tarjeta Oro &#183; 4556 &#8226;&#8226;&#8226;&#8226; 0676</text>
      <line x1="30" y1="340" x2="370" y2="340" stroke="#f2f4f7"/>
      <text x="30" y="357" fill="#98a2b3" font-size="10">A cobrar</text>
      <text x="30" y="375" fill="#0f6b6b" font-size="15.5" font-weight="700">C$ 18,410.07</text>
      <rect x="214" y="356" width="104" height="22" rx="11" fill="#f2f4f7"/>
      <text x="266" y="371" fill="#475467" font-size="11" text-anchor="middle">27 d&#237;as &#183; Nivel 1</text>
      <text x="360" y="350" fill="#98a2b3" font-size="14" text-anchor="middle">&#9650;</text>
      <text x="360" y="380" fill="#98a2b3" font-size="14" text-anchor="middle">&#9660;</text>
    </g>

    <!-- ============ CARD 2 — Incobrable (mora alta) ============ -->
    <g>
      <rect x="16" y="398" width="368" height="104" rx="14" fill="#ffffff" stroke="#eaecf0" filter="url(#cardShadow)"/>
      <text x="30" y="426" fill="#101828" font-size="15" font-weight="700">Mar&#237;a L&#243;pez Garc&#237;a</text>
      <rect x="288" y="412" width="84" height="22" rx="11" fill="#fef3c7"/>
      <text x="330" y="427" fill="#b45309" font-size="11" font-weight="700" text-anchor="middle">Incobrable</text>
      <text x="30" y="444" fill="#667085" font-size="11.5">Pr&#233;stamo &#183; 8030 &#8226;&#8226;&#8226;&#8226; 5917</text>
      <line x1="30" y1="456" x2="370" y2="456" stroke="#f2f4f7"/>
      <text x="30" y="473" fill="#98a2b3" font-size="10">A cobrar</text>
      <text x="30" y="491" fill="#0f6b6b" font-size="15.5" font-weight="700">US$ 1,240.00</text>
      <rect x="214" y="472" width="104" height="22" rx="11" fill="#fee2e2"/>
      <text x="266" y="487" fill="#dc2626" font-size="11" font-weight="700" text-anchor="middle">108 d&#237;as &#183; Nivel 4</text>
      <text x="360" y="466" fill="#98a2b3" font-size="14" text-anchor="middle">&#9650;</text>
      <text x="360" y="496" fill="#98a2b3" font-size="14" text-anchor="middle">&#9660;</text>
    </g>

    <!-- ============ CARD 3 — Diaria ============ -->
    <g>
      <rect x="16" y="514" width="368" height="104" rx="14" fill="#ffffff" stroke="#eaecf0" filter="url(#cardShadow)"/>
      <text x="30" y="542" fill="#101828" font-size="15" font-weight="700">Yelba Ortiz Reyes</text>
      <rect x="314" y="528" width="58" height="22" rx="11" fill="#dbeafe"/>
      <text x="343" y="543" fill="#2563eb" font-size="11" font-weight="700" text-anchor="middle">Diaria</text>
      <text x="30" y="560" fill="#667085" font-size="11.5">Tarjeta Cl&#225;sica &#183; 7011 &#8226;&#8226;&#8226;&#8226; 3402</text>
      <line x1="30" y1="572" x2="370" y2="572" stroke="#f2f4f7"/>
      <text x="30" y="589" fill="#98a2b3" font-size="10">A cobrar</text>
      <text x="30" y="607" fill="#0f6b6b" font-size="15.5" font-weight="700">C$ 9,850.50</text>
      <rect x="214" y="588" width="104" height="22" rx="11" fill="#f2f4f7"/>
      <text x="266" y="603" fill="#475467" font-size="11" text-anchor="middle">45 d&#237;as &#183; Nivel 2</text>
      <text x="360" y="582" fill="#98a2b3" font-size="14" text-anchor="middle">&#9650;</text>
      <text x="360" y="612" fill="#98a2b3" font-size="14" text-anchor="middle">&#9660;</text>
    </g>

    <!-- ============ CARD 4 — Especial ============ -->
    <g>
      <rect x="16" y="630" width="368" height="104" rx="14" fill="#ffffff" stroke="#eaecf0" filter="url(#cardShadow)"/>
      <text x="30" y="658" fill="#101828" font-size="15" font-weight="700">Denis Guti&#233;rrez M.</text>
      <rect x="304" y="644" width="68" height="22" rx="11" fill="#ede9fe"/>
      <text x="338" y="659" fill="#7c3aed" font-size="11" font-weight="700" text-anchor="middle">Especial</text>
      <text x="30" y="676" fill="#667085" font-size="11.5">Pr&#233;stamo &#183; 5412 &#8226;&#8226;&#8226;&#8226; 8821</text>
      <line x1="30" y1="688" x2="370" y2="688" stroke="#f2f4f7"/>
      <text x="30" y="705" fill="#98a2b3" font-size="10">A cobrar</text>
      <text x="30" y="723" fill="#0f6b6b" font-size="15.5" font-weight="700">C$ 6,200.00</text>
      <rect x="214" y="704" width="104" height="22" rx="11" fill="#f2f4f7"/>
      <text x="266" y="719" fill="#475467" font-size="11" text-anchor="middle">12 d&#237;as &#183; Nivel 1</text>
      <text x="360" y="698" fill="#98a2b3" font-size="14" text-anchor="middle">&#9650;</text>
      <text x="360" y="728" fill="#98a2b3" font-size="14" text-anchor="middle">&#9660;</text>
    </g>

    <!-- ===== Barra inferior ===== -->
    <rect x="0" y="744" width="400" height="76" fill="#ffffff"/>
    <line x1="0" y1="744" x2="400" y2="744" stroke="#eaecf0"/>
    <!-- Inicio -->
    <path d="M70 772 L80 763 L90 772 L90 783 L70 783 Z" fill="none" stroke="#98a2b3" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="80" y="800" fill="#98a2b3" font-size="10" text-anchor="middle">Inicio</text>
    <!-- Cartera (activo) -->
    <g fill="#0f6b6b">
      <rect x="188" y="762" width="24" height="3.5" rx="1.5"/>
      <rect x="188" y="769" width="24" height="3.5" rx="1.5"/>
      <rect x="188" y="776" width="24" height="3.5" rx="1.5"/>
    </g>
    <text x="200" y="800" fill="#0f6b6b" font-size="10" font-weight="700" text-anchor="middle">Cartera</text>
    <!-- Stats -->
    <g fill="#98a2b3">
      <rect x="311" y="772" width="4" height="10" rx="1"/>
      <rect x="318" y="765" width="4" height="17" rx="1"/>
      <rect x="325" y="768" width="4" height="14" rx="1"/>
    </g>
    <text x="320" y="800" fill="#98a2b3" font-size="10" text-anchor="middle">Stats</text>
    <!-- home indicator -->
    <rect x="160" y="809" width="80" height="4" rx="2" fill="#d0d5dd"/>
  </g>

  <!-- device border -->
  <rect x="2" y="2" width="396" height="816" rx="38" fill="none" stroke="#cbd2d9" stroke-width="2"/>
</svg>
