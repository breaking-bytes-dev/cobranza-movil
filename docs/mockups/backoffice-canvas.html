<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CM · Backoffice — Mockup canvas app</title>
<style>
  :root{
    --teal:#0F6B6B; --tealDark:#0B5252; --tealSoft:#E0EEEE;
    --screen:#F2F4F7; --card:#FFFFFF; --border:#E4E7EC; --hairline:#F0F2F5;
    --ink:#101828; --ink2:#475467; --muted:#667085; --muted2:#98A2B3;
    --okBg:#ECFDF5; --okInk:#067647;
    --pendBg:#FEF3C7; --pendInk:#B45309;
    --redBg:#FEE2E2; --redInk:#DC2626;
    --diariaBg:#DBEAFE; --diariaInk:#2563EB;
    --incobBg:#FEF3C7; --incobInk:#B45309;
    --espBg:#EDE9FE; --espInk:#7C3AED;
    --demoBg:#F5F0FF; --demoBorder:#B79CF0; --demoInk:#6D3FC4;
    --f2xs:10px; --fxs:11px; --fsm:12.5px; --fbase:13.5px; --fmd:15px; --flg:17px; --fxl:20px; --fbig:24px;
    --r:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
  html,body{height:100%}
  body{background:var(--screen);font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;color:var(--ink);font-size:var(--fbase)}
  button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:inherit;color:inherit}
  input,select,textarea{font-family:inherit;font-size:var(--fbase);color:var(--ink);outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--teal)!important;box-shadow:0 0 0 3px rgba(15,107,107,.12)}
  button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

  /* ═══ Barra de demo (rol) — NO forma parte de la app ═══ */
  .demobar{position:sticky;top:0;z-index:60;background:var(--demoBg);border-bottom:2px dashed var(--demoBorder);
    padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .demobar b{font-size:var(--fxs);letter-spacing:1px;color:var(--demoInk);text-transform:uppercase}
  .demobar .hint{font-size:var(--fxs);color:var(--demoInk);opacity:.75}
  .rolebtn{font-size:var(--fsm);font-weight:700;color:var(--demoInk);border:1.5px solid var(--demoBorder);
    border-radius:99px;padding:5px 14px;background:#fff}
  .rolebtn.on{background:var(--demoInk);color:#fff;border-color:var(--demoInk)}

  /* ═══ Shell ═══ */
  .shell{display:flex;min-height:calc(100vh - 44px)}
  .sidebar{width:230px;flex-shrink:0;background:var(--teal);color:#fff;display:flex;flex-direction:column;padding:18px 12px;gap:2px}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 10px 16px}
  .brand .logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
  .brand .t1{font-size:var(--fmd);font-weight:800;line-height:1.1}
  .brand .t2{font-size:var(--f2xs);letter-spacing:1.4px;text-transform:uppercase;opacity:.75}
  .navsec{font-size:var(--f2xs);letter-spacing:1.2px;text-transform:uppercase;opacity:.55;padding:14px 10px 6px}
  .navitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 10px;border-radius:9px;
    font-size:var(--fbase);font-weight:600;color:rgba(255,255,255,.82)}
  .navitem:hover{background:rgba(255,255,255,.1)}
  .navitem.on{background:rgba(255,255,255,.18);color:#fff}
  .navitem .ic{width:20px;text-align:center;flex-shrink:0}
  .navitem .badge{margin-left:auto;background:#fff;color:var(--teal);font-size:var(--fxs);font-weight:800;border-radius:99px;padding:1px 8px}
  .sidefoot{margin-top:auto;padding:10px;border-top:1px solid rgba(255,255,255,.15);display:flex;align-items:center;gap:10px}
  .avatar{width:32px;height:32px;border-radius:99px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:var(--fsm);font-weight:800;flex-shrink:0}
  .sidefoot .un{font-size:var(--fsm);font-weight:700;line-height:1.15}
  .sidefoot .ur{font-size:var(--f2xs);opacity:.7}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{display:none}
  .content{flex:1;padding:22px clamp(14px,3vw,30px) 60px;max-width:1160px;width:100%;margin:0 auto}
  .pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .pagehead h1{font-size:var(--fbig);font-weight:800;letter-spacing:-.3px}
  .pagehead .sub{font-size:var(--fsm);color:var(--muted);margin-top:3px}

  /* ═══ Piezas ═══ */
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px}
  .grid{display:grid;gap:12px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .kpi .lb{font-size:var(--fxs);font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
  .kpi .v{font-size:var(--fbig);font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
  .kpi .d{font-size:var(--fsm);color:var(--muted);margin-top:2px}
  .kpi.hero{background:var(--teal);border-color:var(--teal);color:#fff}
  .kpi.hero .lb{color:rgba(255,255,255,.75)}
  .kpi.hero .d{color:rgba(255,255,255,.8)}

  .chip{display:inline-flex;align-items:center;gap:5px;font-size:var(--fxs);font-weight:800;border-radius:8px;padding:4px 10px;white-space:nowrap}
  .chip.diaria{background:var(--diariaBg);color:var(--diariaInk)}
  .chip.incob{background:var(--incobBg);color:var(--incobInk)}
  .chip.esp{background:var(--espBg);color:var(--espInk)}
  .chip.ok{background:var(--okBg);color:var(--okInk)}
  .chip.pend{background:var(--pendBg);color:var(--pendInk)}
  .chip.red{background:var(--redBg);color:var(--redInk)}
  .chip.gray{background:var(--hairline);color:var(--ink2)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:var(--fbase);
    border-radius:10px;padding:10px 18px;transition:filter .12s}
  .btn.pri{background:var(--teal);color:#fff}
  .btn.pri:hover{filter:brightness(1.08)}
  .btn.sec{background:var(--tealSoft);color:var(--teal)}
  .btn.danger{background:var(--redBg);color:var(--redInk)}
  .btn.ghost{border:1px solid var(--border);color:var(--ink2);background:#fff}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
  .btn.sm{padding:7px 12px;font-size:var(--fsm);border-radius:9px}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:9px 12px}
  .search input{border:none;flex:1;min-width:0;background:none}
  .sel{background:#fff;border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-weight:600;color:var(--ink2)}

  .rows{display:flex;flex-direction:column;gap:10px}
  .row{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:13px 15px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;cursor:pointer;transition:border-color .12s,box-shadow .12s;text-align:left;width:100%}
  .row:hover{border-color:var(--teal);box-shadow:0 2px 10px rgba(15,107,107,.08)}
  .row.static{cursor:default}
  .row.static:hover{border-color:var(--border);box-shadow:none}
  .row .who{flex:1;min-width:170px}
  .row .who .nm{font-weight:800;font-size:var(--fmd)}
  .row .who .mt{font-size:var(--fsm);color:var(--muted);margin-top:2px}
  .row .mid{flex:1.4;min-width:200px}
  .row .mid .cm{font-size:var(--fbase);color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .row .tail{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-left:auto}
  .money{font-weight:800;color:var(--teal);font-variant-numeric:tabular-nums;white-space:nowrap}
  .empty{padding:36px 20px;text-align:center;color:var(--muted)}
  .empty .big{font-size:34px;margin-bottom:8px}

  .field{margin-bottom:14px}
  .field label{display:block;font-size:var(--fsm);font-weight:700;color:var(--ink2);margin-bottom:6px}
  .field label .req{color:var(--redInk)}
  .inp,.fsel,.ta{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:#fff}
  .ta{min-height:84px;resize:vertical}
  .fhint{font-size:var(--fxs);color:var(--muted);margin-top:5px}
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  .kv{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--hairline);font-size:var(--fbase)}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--muted);flex-shrink:0}
  .kv .v{font-weight:600;text-align:right}
  .sect{font-size:var(--fxs);font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
  .sect:first-child{margin-top:0}

  /* ═══ Panel lateral (detalle) ═══ */
  .scrim{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:80;opacity:0;pointer-events:none;transition:opacity .18s}
  .scrim.open{opacity:1;pointer-events:auto}
  .panel{position:fixed;top:0;right:0;bottom:0;width:min(480px,100vw);background:var(--card);z-index:90;
    transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(16,24,40,.18)}
  .panel.open{transform:none}
  .phead{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0}
  .phead .tt{font-size:var(--flg);font-weight:800;flex:1;min-width:0}
  .phead .x{width:34px;height:34px;border-radius:9px;background:var(--hairline);font-size:15px;flex-shrink:0}
  .pbody{flex:1;overflow-y:auto;padding:18px 20px}
  .pfoot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;flex-shrink:0;background:#fff}
  .pfoot .btn{flex:1}

  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,80px);background:var(--ink);color:#fff;
    font-weight:600;font-size:var(--fbase);border-radius:99px;padding:11px 22px;z-index:120;opacity:0;transition:all .25s;max-width:90vw;text-align:center}
  .toast.show{transform:translate(-50%,0);opacity:1}
  .toast.err{background:var(--redInk)}

  .alertcard{border-left:4px solid var(--redInk);background:var(--redBg)}
  .alertcard.ok{border-left-color:var(--okInk);background:var(--okBg)}
  .alertcard.warn{border-left-color:var(--pendInk);background:var(--pendBg)}
  .meter{height:8px;border-radius:99px;background:var(--hairline);overflow:hidden;margin:8px 0 4px}
  .meter i{display:block;height:100%;border-radius:99px;background:var(--teal)}
  .meter.red i{background:var(--redInk)}

  .tabs{display:flex;gap:6px;background:var(--hairline);border-radius:11px;padding:4px;width:max-content;max-width:100%;margin-bottom:14px}
  .tab{border-radius:8px;padding:8px 16px;font-weight:700;font-size:var(--fsm);color:var(--muted)}
  .tab.on{background:#fff;color:var(--teal);box-shadow:0 1px 4px rgba(16,24,40,.1)}

  /* ═══ Estación de transcripción — 3 columnas ═══ */
  .ws3{display:grid;grid-template-columns:185px 255px minmax(0,1fr);gap:12px;align-items:start}
  .colhead{font-size:var(--fxs);font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:2px 4px 8px}
  .loclist,.queue{display:flex;flex-direction:column;gap:7px}
  .locitem{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;text-align:left;width:100%;cursor:pointer;
    display:flex;align-items:center;gap:8px}
  .locitem .nm{font-weight:700;font-size:var(--fsm);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .locitem .n{background:var(--hairline);color:var(--ink2);font-size:var(--fxs);font-weight:800;border-radius:99px;padding:2px 9px;font-variant-numeric:tabular-nums;flex-shrink:0}
  .locitem.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .locitem.on .n{background:rgba(255,255,255,.25);color:#fff}
  .locitem.zero{opacity:.45}
  .qitem{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;text-align:left;width:100%;cursor:pointer}
  .qitem .nm{font-weight:700;font-size:var(--fsm)}
  .qitem .mt{font-size:var(--fxs);color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
  .qitem.on{border-color:var(--teal);background:var(--tealSoft);box-shadow:0 0 0 1px var(--teal) inset}
  .work{position:sticky;top:14px;min-width:0}
  .work .pos{font-size:var(--fxs);font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
  .idcard{background:var(--teal);border-radius:12px;padding:14px 16px;color:#fff;margin-top:8px}
  .idcard .short{font-size:var(--flg);font-weight:800;letter-spacing:.5px}
  .idcard .cifchip{display:inline-block;background:rgba(255,255,255,.18);border-radius:8px;padding:2px 10px;font-size:var(--fsm);font-weight:800;margin-left:8px;vertical-align:2px}
  .idcard .lbl{font-size:var(--f2xs);font-weight:800;letter-spacing:1.4px;text-transform:uppercase;opacity:.75;margin-top:12px}
  .idcard .acct{font-size:clamp(26px,3.2vw,34px);font-weight:800;letter-spacing:2.5px;font-variant-numeric:tabular-nums;line-height:1.15;cursor:pointer}
  .idcard .prod{font-size:var(--fsm);opacity:.85;margin-top:2px}
  .comentbig{background:var(--screen);border-radius:10px;padding:14px;font-size:var(--fmd);line-height:1.5;margin-top:8px}
  .codmini{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--hairline)}
  .codmini .lb{font-size:var(--fsm);font-weight:700;color:var(--muted)}
  .codmini .inp{width:110px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;padding:8px 10px;font-size:var(--fbase)}
  .kbd{display:inline-block;background:var(--hairline);border:1px solid var(--border);border-bottom-width:2px;border-radius:6px;
    padding:1px 7px;font-size:var(--fxs);font-weight:700;color:var(--ink2);font-family:inherit}
  .cambios{border:1.5px solid var(--espInk);border-radius:10px;overflow:hidden;background:var(--espBg)}
  .cambio{padding:10px 14px;border-bottom:1px solid rgba(124,58,237,.18)}
  .cambio:last-child{border-bottom:none}
  .cambio .ck{font-size:var(--f2xs);font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--espInk)}
  .cambio .cv{margin-top:3px;font-size:var(--fbase);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .cambio .cv b{color:var(--ink)}
  .cambio .ant{color:var(--muted);text-decoration:line-through}
  .cambio .arr{color:var(--espInk);font-weight:800}
  .cambio .tagnuevo{background:var(--espInk);color:#fff;font-size:var(--f2xs);font-weight:800;border-radius:6px;padding:2px 7px;letter-spacing:.5px}
  @media (max-width:1080px){ .ws3{grid-template-columns:150px 210px minmax(0,1fr)} }
  @media (max-width:920px){ .ws3{grid-template-columns:1fr}
    .loclist{grid-row:auto;flex-direction:row;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
    .locitem{flex:0 0 auto;width:auto}
    .work,.queue{grid-column:auto} .work{position:static} }

  .pagos{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:6px}
  .pago{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-bottom:1px solid var(--hairline);font-size:var(--fbase)}
  .pago:last-child{border-bottom:none}
  .pago .rc{color:var(--muted);font-size:var(--fsm)}
  .quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .qbtn{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;text-align:left;cursor:pointer;transition:border-color .12s}
  .qbtn:hover{border-color:var(--teal)}
  .qbtn .ic{font-size:22px}
  .qbtn .t{font-weight:800;font-size:var(--fmd);margin-top:8px}
  .qbtn .d{font-size:var(--fsm);color:var(--muted);margin-top:3px}

  /* ═══ Responsive ═══ */
  @media (max-width:920px){
    .sidebar{position:fixed;inset:0 auto 0 0;z-index:100;transform:translateX(-102%);transition:transform .22s ease;width:min(280px,84vw);box-shadow:14px 0 40px rgba(16,24,40,.25)}
    .sidebar.open{transform:none}
    .topbar{display:flex;align-items:center;gap:12px;background:var(--teal);color:#fff;padding:12px 14px;position:sticky;top:44px;z-index:50}
    .topbar .burger{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.15);color:#fff;font-size:17px;flex-shrink:0}
    .topbar .tt{font-weight:800;font-size:var(--fmd);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .content{padding-top:16px}
    .duo{grid-template-columns:1fr}
    .row .tail{align-items:flex-start;margin-left:0;flex-direction:row;flex-wrap:wrap;width:100%}
  }
</style>
</head>
<body>

<!-- Barra de DEMO: en la app real esto lo decide el rol de seguridad del usuario -->
<div class="demobar">
  <b>Demo · Rol</b>
  <button class="rolebtn" data-role="backoffice">Backoffice</button>
  <button class="rolebtn" data-role="solicitante">Solicitante</button>
  <button class="rolebtn" data-role="supervisor">Supervisor</button>
  <button class="rolebtn" data-role="admin">Admin</button>
  <span class="hint">En la app real, el rol se detecta al entrar y cada quien ve SOLO sus pantallas.</span>
</div>

<div class="shell">
  <nav class="sidebar" id="sidebar" aria-label="Navegación">
    <div class="brand">
      <div class="logo">₡</div>
      <div><div class="t1">Cobranza Móvil</div><div class="t2">Backoffice</div></div>
    </div>
    <div id="nav"></div>
    <div class="sidefoot">
      <div class="avatar" id="avatarTxt">MB</div>
      <div><div class="un" id="userName">—</div><div class="ur" id="userRole">—</div></div>
    </div>
  </nav>

  <div class="main">
    <div class="topbar">
      <button class="burger" id="burger" aria-label="Abrir menú">☰</button>
      <div class="tt" id="topTitle">Inicio</div>
      <div class="avatar" id="avatarTxt2">MB</div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" aria-modal="true" role="dialog">
  <div class="phead"><div class="tt" id="ptitle">—</div><button class="x" id="pclose" aria-label="Cerrar">✕</button></div>
  <div class="pbody" id="pbody"></div>
  <div class="pfoot" id="pfoot"></div>
</aside>
<div class="toast" id="toast"></div>

<script>
/* ══════════════ DATOS MOCK ══════════════ */

  {id:'A4', nombre:'Beto Castillo', email:'beto@bac.ni',    usuario:'beto@bac.ni',    activo:true},

];

const cuentas = [
  {num:'4501-2231', cliente:'Rosa Amelia Gutiérrez', cif:'C-10221', prod:'Tarjeta Clásica', nio:12500, usd:180, dias:45, nivel:2},
  {num:'4501-8812', cliente:'Rosa Amelia Gutiérrez', cif:'C-10221', prod:'Préstamo Personal', nio:8200, usd:0, dias:45, nivel:2},
  {num:'7810-0034', cliente:'Pedro Pablo Jarquín',   cif:'C-20817', prod:'Tarjeta Oro', nio:0, usd:960, dias:120, nivel:4},

/* Estación de transcripción: chips de localizador + cola + detalle fijo, marcar-y-siguiente */
let locSel='Todos', curId=null;
function colaFiltrada(){
  let list=interacciones.filter(i=>i.estado==='pend');
  if(locSel!=='Todos') list=list.filter(i=>i.agente===locSel);
  return [...list].sort((a,b)=>a.fecha-b.fecha);
}
function pickLoc(l){ locSel=l; curId=null; render(); }
function selCur(id){ curId=id; render(); }
function scrCola(){
  const pend=interacciones.filter(i=>i.estado==='pend');
  const porLoc={}; pend.forEach(i=>porLoc[i.agente]=(porLoc[i.agente]||0)+1);
  const locs=[...new Set(interacciones.map(i=>i.agente))].sort((a,b)=>(porLoc[b]||0)-(porLoc[a]||0));
  const list=colaFiltrada();
  if(!curId||!list.some(i=>i.id===curId)) curId=list.length?list[0].id:null;
  const cur=list.find(i=>i.id===curId);
  const pos=list.findIndex(i=>i.id===curId)+1;

  const colLocs=`<div class="loclist"><div class="colhead" style="flex:0 0 auto">Localizadores</div>
    <button class="locitem ${locSel==='Todos'?'on':''}" onclick="pickLoc('Todos')"><span class="nm">Todos</span><span class="n">${pend.length}</span></button>
    ${locs.map(l=>{const n=porLoc[l]||0;return `<button class="locitem ${locSel===l?'on':''} ${n?'':'zero'}" onclick="pickLoc('${esc(l)}')"><span class="nm">🏍️ ${esc(l)}</span><span class="n">${n}</span></button>`;}).join('')}
  </div>`;

  const colQueue=`<div class="queue"><div class="colhead">Pendientes${locSel!=='Todos'?' · '+esc(locSel.split(' ')[0]):''} (${list.length}) · FIFO</div>
    ${list.length?list.map(i=>`<button class="qitem ${i.id===curId?'on':''}" onclick="selCur('${i.id}')">
      <div class="nm">${esc(shortName(i.cta.cliente))}</div>
      <div class="mt">${i.cta.num} · ${hora(i.fecha)}${i.pago?' · 💵':''}${i.datos?' · ✏️':''}${locSel==='Todos'?'<br>🏍️ '+esc(i.agente.split(' ')[0]):''}</div>
    </button>`).join(''):`<div class="card empty" style="padding:22px"><div class="big">🎉</div><b>Cola vacía</b><br>${locSel!=='Todos'?'Pasá al siguiente localizador.':'Sin pendientes.'}</div>`}
  </div>`;

  const colWork=!cur?`<div class="card work"><div class="empty"><div class="big">✨</div><b>Nada seleccionado</b><br>Elegí un localizador con pendientes.</div></div>`
  :`<div class="card work">
    <div class="pos">${pos} de ${list.length}${locSel!=='Todos'?' · '+esc(locSel):''} · ${cur.id} · 🏍️ ${esc(cur.agente)} · ${hora(cur.fecha)}
      ${cur.geo?` · <a href="#" onclick="toast('Demo: abriría el mapa');return false" style="color:var(--teal);font-weight:700">📍 mapa</a>`:''}</div>

      <span class="short">${esc(shortName(cur.cta.cliente))}</span><span class="cifchip">${cur.cta.cif}</span>

      <div class="lbl">N° tarjeta / préstamo</div>
      <div class="acct" onclick="toast('Demo: copiaría '+this.textContent+' al portapapeles')" title="Copiar">${cur.cta.num}</div>
      <div class="prod">${esc(cur.cta.prod)}</div>
    </div>
    <div class="comentbig">${esc(cur.comentario)}</div>
    ${cur.pago?`<div class="sect">Pagos (${cur.pagos.length})</div><div class="pagos">${cur.pagos.map(p=>`<div class="pago"><span class="money">${p.mon==='NIO'?'C$':'US$'} ${p.m.toLocaleString('es-NI',{minimumFractionDigits:2})}</span><span class="rc">Recibo ${p.rec}</span></div>`).join('')}</div>`:''}
    ${cur.datos?`<div class="sect" style="color:var(--espInk)">✏️ Actualización de datos — grabala también en el core</div>
    <div class="cambios">${Object.entries(cur.cambios||{}).map(([k,v])=>`
      <div class="cambio"><div class="ck">${esc(k)}</div>
        <div class="cv">${v.ant&&v.ant!=='—'?`<span class="ant">${esc(v.ant)}</span><span class="arr">→</span>`:`<span class="tagnuevo">NUEVO</span>`}<b>${esc(v.nuevo)}</b></div></div>`).join('')}
    </div>`:''}
    <div class="codmini">
      <span class="lb">Código del core</span>
      <input class="inp" id="codigoInp" maxlength="10" placeholder="PAG01" autocomplete="off"
        oninput="$('btnGrab').disabled=!this.value.trim()"
        onkeydown="if(event.key==='Enter'&&!$('btnGrab').disabled)marcarSiguiente()">
      <button class="btn pri sm" id="btnGrab" disabled onclick="marcarSiguiente()">✓ y siguiente</button>
      <button class="btn ghost sm" onclick="saltar()">Saltar →</button>
      <span class="fhint" style="margin:0"><span class="kbd">Enter</span> marca y avanza · <span class="kbd">↓</span><span class="kbd">↑</span> navegan</span>

  </div>`;

  return head('Por transcribir','Localizador → pendientes → detalle. Grabá en el core y seguí de corrido.')
    +`<div class="ws3">${colLocs}${colQueue}${colWork}</div>`;
}
function marcarSiguiente(){
  const list=colaFiltrada(); const cur=list.find(i=>i.id===curId); if(!cur)return;
  const idxAll=interacciones.findIndex(x=>x.id===cur.id);
  cur.estado='grab'; cur.codigo=$('codigoInp').value.trim().toUpperCase(); cur.hora=new Date();
  interacciones.splice(idxAll,1); transcritas.unshift(cur);
  const rest=colaFiltrada(); const oldPos=list.findIndex(i=>i.id===cur.id);
  curId=rest.length?(rest[Math.min(oldPos,rest.length-1)].id):null;
  toast('✓ '+cur.id+' grabada'+(rest.length?' — siguiente: '+rest[Math.min(oldPos,rest.length-1)].cta.cliente.split(' ')[0]:' — ¡cola vacía!'));
  render();
}
function saltar(){
  const list=colaFiltrada(); if(list.length<2)return;
  const p=list.findIndex(i=>i.id===curId); curId=list[(p+1)%list.length].id; render();
}
document.addEventListener('keydown',e=>{
  if(screen!=='cola'||rol!=='backoffice')return;
  if(e.target.tagName==='INPUT'&&e.key!=='ArrowDown'&&e.key!=='ArrowUp')return;

    <div class="kv"><span class="k">Trabajo</span><span class="v">${esc(c.trabajo)}</span></div>
    <div class="sect">Teléfonos</div>${c.tels.map(t=>`<div class="kv"><span class="v" style="text-align:left">📞 ${esc(t)}</span></div>`).join('')||'<div class="fhint">—</div>'}
    <div class="sect">Direcciones</div>${c.dirs.map(d=>`<div class="kv"><span class="v" style="text-align:left">📍 ${esc(d)}</span></div>`).join('')||'<div class="fhint">—</div>'}
    <div class="sect">Cuentas (${cts.length})</div>
    ${cts.map(x=>`<div class="kv"><span class="k">${x.num}</span><span class="v">${esc(x.prod)} · <span class="money">${money(x.nio,x.usd)}</span></span></div>`).join('')||'<div class="fhint">Sin cuentas en mora.</div>'}`,
    `<button class="btn ghost" onclick="closePanel()">Cerrar</button>
     <button class="btn sec" onclick="toast('Demo: abriría la edición')">✏️ Editar</button>`);
}
function openNuevoCliente(){
  openPanel('Nuevo cliente',`
    <div class="duo">
      <div class="field"><label>CIF <span class="req">*</span></label><input class="inp" id="ncCif" placeholder="C-00000" oninput="ncValida()"></div>
      <div class="field"><label>Nombre completo <span class="req">*</span></label><input class="inp" id="ncNom" oninput="ncValida()"></div></div>
    <div class="duo">
      <div class="field"><label>Departamento</label><input class="inp" id="ncDep"></div>
      <div class="field"><label>Distrito</label><input class="inp" id="ncDis"></div></div>
    <div class="field"><label>Trabajo</label><input class="inp" id="ncTra"></div>
    <div class="duo">
      <div class="field"><label>Teléfono celular</label><input class="inp" id="ncCel" placeholder="8888-8888"></div>
      <div class="field"><label>Teléfono casa</label><input class="inp" id="ncCas"></div></div>
    <div class="field"><label>Dirección casa</label><input class="inp" id="ncDc"></div>
    <div class="field"><label>Dirección trabajo</label><input class="inp" id="ncDt"></div>
    <div class="fhint">⚠ El CIF debe ser el del core. Un CIF equivocado duplica el cliente en el próximo import.</div>`,
    `<button class="btn ghost" onclick="closePanel()">Cancelar</button>
     <button class="btn pri" id="ncBtn" disabled onclick="ncCrear()">＋ Crear cliente</button>`);
}
function ncValida(){ $('ncBtn').disabled=!($('ncCif').value.trim()&&$('ncNom').value.trim()); }
function ncCrear(){
  clientes.unshift({cif:$('ncCif').value.trim(), nombre:$('ncNom').value.trim(), depto:$('ncDep').value||'—', distrito:$('ncDis').value||'—',
    trabajo:$('ncTra').value||'—',
    tels:[$('ncCel').value&&$('ncCel').value+' (cel)',$('ncCas').value&&$('ncCas').value+' (casa)'].filter(Boolean),
    dirs:[$('ncDc').value&&$('ncDc').value+' (casa)',$('ncDt').value&&$('ncDt').value+' (trabajo)'].filter(Boolean)});
  closePanel(); toast('✓ Cliente creado'); render(); }

/* ══════════════ PANEL / RENDER ══════════════ */
function openPanel(t,body,foot){ $('ptitle').textContent=t; $('pbody').innerHTML=body; $('pfoot').innerHTML=foot||'';
  $('panel').classList.add('open'); $('scrim').classList.add('open'); }
function closePanel(){ $('panel').classList.remove('open'); $('scrim').classList.remove('open'); }
$('scrim').onclick=closePanel; $('pclose').onclick=closePanel;
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){closePanel();$('sidebar').classList.remove('open');} });
$('burger').onclick=()=>$('sidebar').classList.add('open');

const screens={home:scrHome, cola:scrCola, transcritas:scrTranscritas, missolicitudes:scrMisSolicitudes,
  nueva:scrNueva, aprobaciones:scrAprobaciones, monitoreo:scrMonitoreo, reconciliacion:scrReconciliacion,
  cierres:scrCierres, agentes:scrAgentes, maestros:scrMaestros};
function render(){ renderNav(); $('content').innerHTML=(screens[screen]||scrHome)();
  const c=$('codigoInp'); if(c&&window.innerWidth>920)c.focus(); }
document.querySelectorAll('.rolebtn').forEach(b=>b.onclick=()=>setRole(b.dataset.role));
setRole('backoffice');
</script>
