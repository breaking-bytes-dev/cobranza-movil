Screens:
  scrCartera:
    Properties:
      Fill: =gblC.screen
      OnHidden: |-
        =ForAll(Filter(colClientes, dirty) As C,
             ForAll(Filter(colAsig, cid = C.cid) As A,
                UpdateIf('CM | TBL | Asignacions',
                   '[AS] NumeroCuenta' = A.'[AS] NumeroCuenta',
                   { '[AS] Orden': C.orden })));
          UpdateIf(colClientes, dirty, { dirty: false })
      OnVisible: |-
        =  If(!varCarteraLista || varRecargarCartera,
          UpdateContext({varshowLoader: true});
         ClearCollect(colAsigRaw, Filter('CM | TBL | Asignacions', '[AS] Estado' = true));
         ClearCollect(colAsig,
             AddColumns(
                AddColumns(colAsigRaw,
                   cta, LookUp(colCuentas, '[CT] Numero de cuenta' = '[AS] NumeroCuenta')),
                cid,      cta.'CIF Cliente',
                cliNom,   cta.'Nombre Cliente',
                saldoNio, cta.'[CT] Saldo Vencido NIO',
                saldoUsd, cta.'[CT] Saldo Vencido USD',
                diasMora, cta.'[CT] Dias Mora',
                ord,      '[AS] Orden'));

          ClearCollect(colClientes,
             AddColumns(
                GroupBy(colAsig, cid, cliNom, Asigs),
                orden,    Min(Asigs, ord),
                totNio,   Sum(Asigs, saldoNio),
                totUsd,   Sum(Asigs, saldoUsd),
                maxDias,  Max(Asigs, diasMora),
                nCuentas, CountRows(Asigs),
                dirCasa,  LookUp(colDirecciones, '[DR] CIF' = cid && '[DR] Tipo'="Casa").'[DR] Direccion',
                dirTrab,  LookUp(colDirecciones, '[DR] CIF' = cid && '[DR] Tipo'="Trabajo").'[DR] Direccion',
                dirty,   false));
            Set(varCarteraLista, true);
             Set(varRecargarCartera, false);
             Set(varFechaUltimaActualizacion, Now());
             UpdateContext({varshowLoader: false});
          )
    Children:
      - cmpNav_2:
          Control: CanvasComponent
          ComponentName: cmpNav
          Properties:
            Height: =64
            Y: =Parent.Height - Self.Height
      - conMaster:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height - cmpNav_1.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            Width: =Parent.Width
          Children:
            - conHeader_2:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =gblC.teal
                  FillPortions: =0
                  Height: =Container12.Height + conTotal.Height + 40
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =9
                  PaddingLeft: =10
                  PaddingRight: =10
                  PaddingTop: =6
                Children:
                  - Container12:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.ExtraBold
                        FillPortions: =0
                        Height: =Max(lblTitulo_3.Height + lblSub_6.Height + lblSub_7.Height,Button1_2.Height + Button1_2.Y)  + 20
                        LayoutMinHeight: =16
                        LayoutMinWidth: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                        Width: =conTotal.Width
                        X: =40
                        Y: =40
                      Children:
                        - lblSub_7:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              Color: =gblC.tealSub
                              Height: =10
                              Size: =gblT.f2xs
                              Text: =varFechaUltimaActualizacion
                              Y: =lblSub_6.Y + lblSub_6.Height
                        - lblSub_6:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              Color: =gblC.tealSub
                              Height: =10
                              Size: =gblT.fsm
                              Text: =CountRows(Distinct(colAsig, cid)) & " clientes · " & CountRows(colAsig) & " cuentas"
                              Y: =lblTitulo_3.Height + lblTitulo_3.Y
                        - lblTitulo_3:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              Color: =gblC.white
                              Font: =gblFont
                              FontWeight: =FontWeight.Bold
                              Height: =10
