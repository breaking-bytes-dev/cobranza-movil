                              Text: ="Hola, "&User().FullName
                        - Button1_2:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderStyle: =BorderStyle.None
                              Color: =gblC.white
                              Fill: =RGBA(255,255,255,0.18)
                              Font: =
                              FontWeight: =FontWeight.Normal
                              Height: =30
                              OnSelect: "=UpdateContext({varshowLoader: true});\r\n\r\nForAll(colClientes As C,\r\n     ForAll(Filter(colAsig, cid = C.cid) As A,\r\n        UpdateIf('CM | TBL | Asignacions',\r\n           '[AS] NumeroCuenta' = A.'[AS] NumeroCuenta',\r\n           { '[AS] Orden': C.orden })));\r\n\r\nClearCollect(colAsigRaw, Filter('CM | TBL | Asignacions', '[AS] Estado' = true));\r\nClearCollect(colAsig,\r\n     AddColumns(\r\n        AddColumns(colAsigRaw,\r\n           cta, LookUp(colCuentas, '[CT] Numero de cuenta' = '[AS] NumeroCuenta')),\r\n        cid,      cta.'CIF Cliente',\r\n        cliNom,   cta.'Nombre Cliente',\r\n        saldoNio, cta.'[CT] Saldo Vencido NIO',\r\n        saldoUsd, cta.'[CT] Saldo Vencido USD',\r\n        diasMora, cta.'[CT] Dias Mora',\r\n        ord,      '[AS] Orden'));\r\n\r\n  ClearCollect(colClientes,\r\n     AddColumns(\r\n        GroupBy(colAsig, cid, cliNom, Asigs),\r\n        orden,    Min(Asigs, ord),\r\n        totNio,   Sum(Asigs, saldoNio),\r\n        totUsd,   Sum(Asigs, saldoUsd),\r\n        maxDias,  Max(Asigs, diasMora),\r\n        nCuentas, CountRows(Asigs),\r\n        dirCasa,  LookUp(colDirecciones, '[DR] CIF' = cid && '[DR] Tipo'=\"Casa\").'[DR] Direccion',\r\n        dirTrab,  LookUp(colDirecciones, '[DR] CIF' = cid && '[DR] Tipo'=\"Trabajo\").'[DR] Direccion',\r\n        dirty,   false));\r\n    Set(varCarteraLista, true);\r\n     Set(varRecargarCartera, false);\r\n     Set(varFechaUltimaActualizacion, Now());\r\n     UpdateContext({varshowLoader: false});\r\n        "
                              PaddingBottom: =7
                              PaddingLeft: =11
                              PaddingRight: =11
                              PaddingTop: =7
                              RadiusBottomLeft: =9
                              RadiusBottomRight: =9
                              RadiusTopLeft: =9
                              RadiusTopRight: =9
                              Size: =gblT.fxs
                              Text: ="Actualizar"
                              Width: =If(gblScale = 1, 110,gblScale = 1.2,120,gblScale = 1.45,130,140)
                              X: =App.ActiveScreen.Width - Self.Width - 50
                              Y: =Button1_1.Height + Button1_1.Y + 10
                        - Button1_1:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderStyle: =BorderStyle.None
                              Color: =gblC.white
                              Fill: =RGBA(255,255,255,0.18)
                              FontWeight: =FontWeight.Bold
                              Height: =30
                              OnSelect: =Set(varSheetEscala, true)
                              PaddingBottom: =7
                              PaddingLeft: =11
                              PaddingRight: =11
                              PaddingTop: =7
                              RadiusBottomLeft: =9
                              RadiusBottomRight: =9
                              RadiusTopLeft: =9
                              RadiusTopRight: =9
                              Size: =gblT.fmd
                              Text: ="Aa"
                              Width: =If(gblScale = 1, 50,gblScale = 1.2,60,gblScale = 1.45,70,80)
                              X: =App.ActiveScreen.Width - Self.Width - 50
                              Y: =cmpSyncPill_2.Y + cmpSyncPill_2.Height + 10
                        - cmpSyncPill_2:
